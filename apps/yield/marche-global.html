<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « LE MARCHÉ GLOBAL » — intégrée au socle V5 le 15 novembre 2026
     (docs/specs/spec-integration-v5-lot-2.md). La FORME change, pas le fond :
     mêmes deux appels, mêmes sections, mêmes états.
     ⚠ PAGE EN LECTURE SEULE (spec §17 de docs/kb/chantier-nouveau-bien.md).
     Elle n'écrit rien, ne pilote rien. PIPELINES ÉTANCHES : l'historique
     (sections 1 à 3) et AirROI (section 4) s'affichent côte à côte, sans
     jamais se croiser.
     RÈGLES V5 : aucun hexa (les trois années et les barres vivent dans
     shared/theme.css, --yf-annee-* et --yf-barre*), aucun texte en dur. -->
<style>
  /* Les trois annees : N-2 la plus pale, N la plus soutenue. Des RENVOIS a
     la charte : la page ne porte plus de couleur. */
  .out-pont {
    --mg-n2: var(--yf-annee-n2); --mg-n1: var(--yf-annee-n1); --mg-n: var(--yf-annee-n);
    --mg-barre: var(--yf-barre); --mg-barre-partielle: var(--yf-barre-partielle);
  }
  /* ⚠ VARIANTE SOMBRE RETIREE — double validation de Thierry du 2 novembre
     2026 : « pas de mode sombre sur YieldFlow pour l'instant ». */
  .mg-meta { font-size: var(--fs-small); color: var(--muted); margin: 0; }
  .mg-carte { border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px 18px; background: var(--surface); }
  .mg-carte h2 { font-size: 16px; font-weight: var(--fw-bold); margin: 0 0 4px; }
  .mg-carte .sous { font-size: var(--fs-small); color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
  .mg-mention { font-size: var(--fs-caption); color: var(--muted); margin: 6px 0 0; }
  .mg-legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--fs-caption); color: var(--muted); margin: 8px 0 2px; }
  .mg-legende i { display: inline-block; width: 22px; height: 0; vertical-align: 3px; margin-inline-end: 6px; }
  .non-calc { color: var(--muted); font-style: italic; }
  #mg-corps, #mg-airroi-zone { display: flex; flex-direction: column; gap: var(--gap-m); }
  #mg-airroi-zone:empty { display: none; }
  /* « En resume » (§18) : quatre blocs, chacun sa source. */
  .mg-bloc { padding: 12px 0; border-top: 1px solid var(--line); }
  #mg-resume-tendance { border-top: 0; padding-top: 4px; }
  .mg-bloc h3 { font-size: 15px; font-weight: var(--fw-semibold); margin: 0 0 2px; }
  .mg-source { font-size: var(--fs-caption); color: var(--muted); margin: 0 0 8px; }
  .mg-verdict { font-size: 15px; font-weight: var(--fw-semibold); margin: 4px 0 8px; }
  .mg-sens { display: grid; grid-template-columns: 26px 1fr; gap: 4px 6px; font-size: var(--fs-small); align-items: center; }
  .mg-sens b { font-size: 17px; text-align: center; }
  .mg-zones { color: var(--muted); font-size: var(--fs-caption); }
  /* ⚠ LA LIGNE NE PORTE PAS LE NIVEAU, LA PASTILLE LE PORTE — regle 1 de
     Thierry (constat de review du 3 novembre 2026). La ligne garde le fond
     neutre des blocs ; le niveau vit dans une pastille. */
  .mg-niv-l { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 4px;
              border-radius: 4px; background: var(--surface-2); font-size: var(--fs-small); color: var(--ink); }
  .mg-niv-l small { color: var(--muted); }
  .mg-niv-l .mg-pastille { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); white-space: nowrap;
                           background: var(--niveau-fond, var(--surface-2)); color: var(--niv-encre, var(--ink));
                           border: 1px solid var(--niveau-lisere, var(--border)); }
  .mg-ev-liste { display: flex; flex-direction: column; gap: 6px; }
  /* ⚠ LE RAIL EST NEUTRE DEPUIS LE 3 NOVEMBRE 2026, et le niveau est sur le
     BADGE de la ligne (un trait de 4 px ne peut pas encoder quatre densites
     de gris sur un fond gris). */
  .mg-ev-l { background: var(--surface-2); border-inline-start: 4px solid var(--border); border-radius: 4px; padding: 7px 10px; font-size: var(--fs-small);
             display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .mg-ev-l .o { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  svg.mg { width: 100%; height: auto; display: block; }
  svg.mg text { font-size: 11px; fill: var(--muted); font-family: inherit; }
  svg.mg .axe { stroke: var(--border); stroke-width: 1; }
  svg.mg .grille { stroke: var(--line); stroke-width: 1; }
  svg.mg .repere-mois { stroke: var(--line); stroke-width: 0.6; }
  svg.mg text.initiale { font-size: 10px; }
  svg.mg text.annee { font-weight: var(--fw-semibold); fill: var(--ink); }
  /* Telephone : chaque graphique est DESSINE a la largeur de sa carte (voir
     largeurGraphe) et tient entier, sans defilement (demande de Thierry,
     4 octobre 2026) ; la page, elle, ne deborde jamais. */
  .mg-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 640px) {
    .mg-carte { padding: 12px; }
  }
</style>
</head>
<body class="out-page out-pont">

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page out">
  <div class="out-tete">
    <div class="out-tete__titre"><h1 class="h1" data-i18n="mg.titre"></h1></div>
  </div>
  <nav class="seg out-yf" data-yf-onglets data-i18n-attr="aria-label:yfnav.aria"></nav>

  <div class="out-note out-note--avertir mg-avertir" data-riche="mg.avertir"></div>

  <label class="out-choix"><span data-i18n="yfm.logement"></span> <select id="mg-bien" class="out-saisie"></select></label>
  <p class="mg-meta" id="mg-meta"></p>
  <!-- Sections 1 a 3 : l'historique du marche (/api/marche-global). -->
  <div id="mg-corps"><p class="mg-meta" data-i18n="yfm.lecture_marche"></p></div>
  <!-- Section 4 : le calendrier AirROI, dans SON bloc, lu par SA route. -->
  <div id="mg-airroi-zone"></div>
  <!-- « En resume » (§18) : la tendance vient de l'historique, le reste
       d'AirROI ; chaque bloc nomme sa source, rien n'est croise. -->
  <div class="mg-carte" id="mg-resume" hidden><h2 data-i18n="mg.resume_titre"></h2>
    <div class="mg-bloc" id="mg-resume-tendance"></div>
    <div id="mg-resume-airroi"></div>
  </div>
</main>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
  // ⚠ LECTURE SEULE : la liste des logements du compte, puis deux GET, chacun
  // sa source : /api/marche-global (historique) et /api/marche-temperature
  // (AirROI). Aucune ecriture, aucun appel AirROI, aucun prix AirROI.
  import { requireAuth } from '/components/auth-guard.js'
  import { compteCourant, enteteCompte, peutLire, estTitulaire, comptes, basculerVers } from '/shared/compte-courant.js'
  import { sansArchives } from '/shared/biens-vivants.js'
  import { supabase, signOut } from '/shared/supabase.js'
  import { initErrorHandler } from '/shared/error-handler.js'
  import { renderOnboardingBanner } from '/components/onboarding-banner.js'
  import { monterCoquille, tHtml, brut, moisIso, formaterDate, listeLocale } from '/shared/page-outil.js'
  import { monterOngletsYieldFlow } from '/shared/yieldflow-onglets.js'
  import { monterAnneeTemperature, fermerDetail, badge, niv, parlerLangue } from '/shared/temperature-calendrier.js'

  initErrorHandler()
  const el = id => document.getElementById(id)
  const t = (k, v) => I18n.t(k, v)
  const th = (k, v) => tHtml(t, k, v)
  const ech = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  // Les dates dans la langue de l'hote. En francais, le rendu d'avant :
  // « oct. 2026 » pour un mois, « 30/09/2026 » pour un jour (horodatage
  // accepte : seuls ses dix premiers caracteres comptent).
  const moisFr = m => moisIso(I18n, m, { month: 'short', year: 'numeric' })
  const jourFr = iso => (/^\d{4}-\d{2}-\d{2}/.test(String(iso || ''))
    ? formaterDate(I18n, `${String(iso).slice(0, 10)}T12:00:00Z`, { day: 'numeric', month: '2-digit', year: 'numeric', timeZone: 'UTC' }) || '—' : '—')
  const euros = v => (typeof v === 'number' && Number.isFinite(v) ? t('yfm.euros', { v: I18n.num(Math.round(v * 10) / 10, { maximumFractionDigits: 1, useGrouping: false }) }) : t('mg.non_mesure'))
  const pourcent = v => (typeof v === 'number' && Number.isFinite(v) ? t('yfm.pct', { v: I18n.num(Math.round(v * 100)) }) : t('mg.non_mesure'))
  // L'initiale d'un mois (0 a 11), dans la langue de l'hote (« J F M A… »).
  // ⚠ A LA DEMANDE, PAS AU CHARGEMENT DU MODULE (constat 5 de la review du
  // lot 2a) : calculee avant `I18n.init()`, elle restait en francais pour un
  // hote hispanophone (« J » pour enero).
  const initiale = k => formaterDate(I18n, new Date(Date.UTC(2026, k, 15, 12)), { month: 'narrow', timeZone: 'UTC' })
  const liste = xs => listeLocale(I18n.lang, xs)
  // Le graphique des biens montre les 3 dernieres annees (la donnee garde 60 mois).
  const MOIS_AFFICHES = 36
  // Le mois en cours, a l'heure de Paris : le calendrier AirROI part de lui.
  const moisDeParis = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }).slice(0, 7)

  let session = null
  let jeton = 0
  // La derniere reponse de l'historique : redessinee si la largeur change.
  let dernier = null
  let largeurDessinee = 0

  // La largeur du dessin suit celle de la carte : sur telephone, une courbe de
  // douze mois tient entiere, texte a sa taille normale, sans defilement. Sans
  // mesure possible (page cachee), la largeur de bureau.
  function largeurGraphe () {
    const w = el('mg-corps').clientWidth
    return w > 0 ? Math.max(280, Math.min(900, Math.round(w - 34))) : 900
  }
  function dessinerHistorique () {
    if (!dernier) return
    largeurDessinee = largeurGraphe()
    corps(sectionRevpar(dernier.progression, dernier.recupere_le) + sectionRemplissage(dernier.progression, dernier.recupere_le) + sectionBiens(dernier.revpar))
  }
  let attente = null
  window.addEventListener('resize', () => {
    clearTimeout(attente)
    attente = setTimeout(() => { if (dernier && largeurGraphe() !== largeurDessinee) dessinerHistorique() }, 200)
  })

  async function init () {
    await I18n.init()
    // Le calendrier commun parle la langue de l'hote (ses mots, ses dates).
    parlerLangue(I18n)
    session = await requireAuth()
    if (!session) return
    document.addEventListener('i18n:changed', () => location.reload())
    monterCoquille({
      HSNav, I18n, session, titre: t('mg.titre'),
      compte: { comptes, compteCourant, basculerVers, estTitulaire, peutLire },
      deconnexion: () => signOut()
    })
    monterOngletsYieldFlow(document.querySelector('[data-yf-onglets]'), 'marche-global', t)
    // Le bandeau d'incitation que l'ancienne barre latérale posait : gardé.
    renderOnboardingBanner().catch(() => {})
    const compte = compteCourant()
    // ⚠ UN LOGEMENT ARCHIVE NE PARAIT PLUS DANS LE SELECTEUR (point 7 du constat
    // de Thierry du 3 novembre 2026). Cette lecture est CLIENT — elle passe par
    // la RLS, pas par un endpoint —, donc aucun filtre serveur ne pouvait
    // l'atteindre : la regle vit dans `/shared/biens-vivants.js`, en un seul
    // exemplaire pour les six ecrans qui l'emploient.
    let q = sansArchives(supabase.from('properties').select('id, name')).order('name')
    if (compte) q = q.eq('user_id', compte)
    const { data, error } = await q
    if (error) return corps(`<p class="non-calc">${th('yfm.biens_illisibles')}</p>`)
    if (!data || !data.length) return corps(`<p class="non-calc">${th('yfm.aucun_bien')}</p>`)
    el('mg-bien').innerHTML = data.map(b => `<option value="${ech(b.id)}">${ech(b.name)}</option>`).join('')
    // Le bien demande par l'URL (?bien=<uuid>), pose par le menu YieldFlow du
    // calendrier. La garde `data.some(...)` : un identifiant inconnu ou d'un
    // autre compte laisse le selecteur ou il est.
    const voulu = new URLSearchParams(location.search).get('bien')
    if (voulu && data.some(b => b.id === voulu)) el('mg-bien').value = voulu
    el('mg-bien').addEventListener('change', charger)
    charger()
  }

  function corps (html) { el('mg-corps').innerHTML = html }

  function charger () {
    const j = ++jeton
    // La fenetre de detail d'un jour appartient au logement precedent (review de 39d9d81).
    fermerDetail()
    el('mg-resume').hidden = false
    el('mg-resume-tendance').innerHTML = `<p class="mg-meta">${th('yfm.lecture')}</p>`
    el('mg-resume-airroi').innerHTML = ''
    chargerHistorique(j)
    chargerAirroi(j)
  }

  // ─── L'HISTORIQUE (sections 1 a 3) ──────────────────────────────────────
  async function chargerHistorique (j) {
    dernier = null
    corps(`<p class="mg-meta">${th('yfm.lecture_marche')}</p>`); el('mg-meta').innerHTML = ''
    let r
    try {
      r = await fetch(`/api/marche-global?property_id=${encodeURIComponent(el('mg-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
    } catch (e) { if (j === jeton) { corps(`<p class="non-calc">${th('yfm.serveur_muet')}</p>`); el('mg-resume-tendance').innerHTML = blocTendance(null) } return }
    if (j !== jeton) return
    if (!r.ok) { el('mg-resume-tendance').innerHTML = blocTendance(null); return corps(`<p class="non-calc">${th('yfm.statut', { statut: r.status })}</p>`) }
    let d
    try { d = await r.json() } catch (e) { if (j === jeton) { corps(`<p class="non-calc">${th('yfm.illisible')}</p>`); el('mg-resume-tendance').innerHTML = blocTendance(null) } return }
    if (j !== jeton) return
    if (d.etat !== 'calcule') el('mg-resume-tendance').innerHTML = blocTendance(null)
    if (d.etat === 'marche_inconnu') return corps(`<p class="non-calc">${d.motif ? th('yfm.marche_inconnu_motif', { motif: d.motif }) : th('yfm.marche_inconnu')}</p>`)
    if (d.etat === 'historique_absent') return corps(`<p class="non-calc">${th('mt.capture_absente', { localite: d.marche && d.marche.localite, motif: d.motif })}</p>`)
    el('mg-meta').innerHTML = th('mg.meta', { localite: brut(`<b>${ech(d.marche.localite)}</b>`), region: d.marche.region, pays: d.marche.pays, date: jourFr(d.recupere_le) })
    dernier = d
    dessinerHistorique()
    el('mg-resume-tendance').innerHTML = blocTendance(d.progression)
  }

  // ─── Sections 1 et 2 : N, N-1, N-2 superposees ──────────────────────────
  // ⚠ Legende RELATIVE (N, N-1, N-2), jamais une annee en dur ; l'annee
  // reelle ne sort qu'en info-bulle. N est l'annee de la LECTURE de
  // l'historique. Une annee partielle (moins de 12 mois mesures) est en
  // pointilles, et aucun total d'annee n'est calcule.
  const RANGS = [['N-2', 2, '--mg-n2', 1.8], ['N-1', 1, '--mg-n1', 2.2], ['N', 0, '--mg-n', 2.8]]

  function troisAnnees (prog, recupereLe) {
    const annees = (prog && prog.annees) || []
    // Sans date de lecture lisible, pas de N : on ne devine pas l'annee (review de 39d9d81).
    const n = /^\d{4}/.test(String(recupereLe || '')) ? Number(String(recupereLe).slice(0, 4)) : null
    if (!n) return []
    return RANGS.map(([nom, ecart, couleur, epaisseur]) => ({
      nom, couleur: `var(${couleur})`, epaisseur, donnee: annees.find(a => Number(a.annee) === n - ecart) || null,
    }))
  }

  function superposees (prog, recupereLe, cle, { titre, sous, bulle, graduation, mention }) {
    const entete = `<h2>${titre}</h2><p class="sous">${sous}</p>`
    const series = troisAnnees(prog, recupereLe)
    const vals = series.flatMap(s => (s.donnee ? s.donnee.mois.map(m => m[cle]) : [])).filter(v => typeof v === 'number')
    if (!prog || prog.statut !== 'calcule' || !vals.length) {
      const motif = prog && prog.statut === 'calcule' && !series.length ? t('mg.date_illisible') : (prog && prog.motif) || t('mg.historique_absent')
      return `<div class="mg-carte">${entete}<p class="non-calc">${th('yfm.non_calculable', { motif })}</p></div>`
    }
    const L = largeurGraphe(), H = L < 600 ? 220 : 260, G = 50, D = 12, HAUT = 12, BAS = 26
    const max = Math.max(...vals) * 1.08
    const x = k => G + (L - G - D) * k / 11
    const y = v => HAUT + (H - HAUT - BAS) * (1 - v / max)
    const grille = [0, 0.25, 0.5, 0.75, 1].map(f => `<line class="grille" x1="${G}" x2="${L - D}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${G - 6}" y="${y(max * f) + 4}" text-anchor="end">${graduation(max * f)}</text>`).join('')
    const abscisse = Array.from({ length: 12 }, (_, k) => initiale(k)).map((n, k) => `<line class="repere-mois" x1="${x(k)}" x2="${x(k)}" y1="${HAUT}" y2="${H - BAS}"/><text class="initiale" x="${x(k)}" y="${H - BAS + 15}" text-anchor="middle">${ech(n)}</text>`).join('')
    const courbes = series.filter(s => s.donnee).map(s => {
      const a = s.donnee
      const mesure = k => k >= 0 && k < a.mois.length && typeof a.mois[k][cle] === 'number'
      let dd = ''; let dedans = false
      a.mois.forEach((m, k) => {
        if (typeof m[cle] !== 'number') { dedans = false; return }
        dd += `${dedans ? 'L' : 'M'}${x(k).toFixed(1)},${y(m[cle]).toFixed(1)} `; dedans = true
      })
      // Un mois sans voisin mesure ne trace aucun segment : il porte un point plein.
      const points = a.mois.map((m, k) => {
        if (typeof m[cle] !== 'number') return ''
        const isole = !mesure(k - 1) && !mesure(k + 1)
        // Un mois de trop peu d'annonces reste trace, mais le dit : point creux.
        if (m.peu_annonces) return `<circle class="peu" cx="${x(k).toFixed(1)}" cy="${y(m[cle]).toFixed(1)}" r="3.5" fill="var(--bg)" stroke="${s.couleur}" stroke-width="1.5"><title>${ech(moisFr(m.mois))} (${s.nom}) · ${ech(bulle(m[cle]))} · ${th('mg.peu_annonces')}</title></circle>`
        return `<circle cx="${x(k).toFixed(1)}" cy="${y(m[cle]).toFixed(1)}" r="${isole ? 3.5 : 6}" fill="${isole ? s.couleur : 'transparent'}"${isole ? ' class="isole"' : ''}><title>${ech(moisFr(m.mois))} (${s.nom}) · ${ech(bulle(m[cle]))}</title></circle>`
      }).join('')
      return `<path data-rang="${s.nom}" d="${dd}" fill="none" stroke="${s.couleur}" stroke-width="${s.epaisseur}"${a.partielle ? ' stroke-dasharray="6 4"' : ''}/>${points}`
    }).join('')
    const legende = `<div class="mg-legende">${series.slice().reverse().map(s => {
      const note = !s.donnee ? th('mg.leg_non_mesuree') : s.donnee.partielle ? th('mg.leg_partielle') : ''
      const trait = s.donnee && s.donnee.partielle ? `border-top:${s.epaisseur}px dashed ${s.couleur}` : `border-top:${s.epaisseur}px solid ${s.couleur}`
      return `<span><i style="${trait}"></i>${note ? th('mg.ligne_sens', { nom: s.nom, sens: brut(note) }) : s.nom}</span>`
    }).join('')}</div>`
    return `<div class="mg-carte">${entete}${legende}<div class="mg-defile"><svg class="mg" viewBox="0 0 ${L} ${H}" role="img" aria-label="${th('mg.aria_superposees', { titre: brut(titre) })}">
      ${abscisse}${grille}<line class="axe" x1="${G}" x2="${L - D}" y1="${H - BAS}" y2="${H - BAS}"/>${courbes}</svg></div>
      <p class="mg-mention">${mention}${series.some(s => s.donnee && s.donnee.mois.some(m => m.peu_annonces)) ? ` ${th('mg.point_creux', { seuil: prog.seuil_annonces })}` : ''}</p></div>`
  }

  function sectionRevpar (prog, recupereLe) {
    return superposees(prog, recupereLe, 'revpar', {
      titre: th('mg.revpar_titre'),
      sous: th('mg.revpar_sous'),
      bulle: v => t('mg.revpar_bulle', { v: euros(v) }),
      graduation: v => ech(t('yfm.euros', { v: I18n.num(Math.round(v), { useGrouping: false }) })),
      mention: th('mg.revpar_mention'),
    })
  }

  // ⚠ L'occupation est celle du MARCHE : cette page ne lit, ne montre et ne
  // compare aucune occupation de logement (regle 13 de Thierry).
  function sectionRemplissage (prog, recupereLe) {
    return superposees(prog, recupereLe, 'occupation', {
      titre: th('mg.remplissage_titre'),
      sous: th('mg.remplissage_sous'),
      bulle: v => t('mg.remplissage_bulle', { v: pourcent(v) }),
      graduation: v => ech(t('yfm.pct', { v: I18n.num(Math.round(v * 100)) })),
      mention: th('mg.remplissage_mention'),
    })
  }

  // ─── Section 3 : le nombre de biens sur le marche (format existant) ─────
  function sectionBiens (ind) {
    const entete = `<h2>${th('mg.biens_titre')}</h2><p class="sous">${th('mg.biens_sous')}</p>`
    if (!ind || ind.statut !== 'calcule') {
      return `<div class="mg-carte">${entete}<p class="non-calc">${th('yfm.non_calculable', { motif: (ind && ind.motif) || t('mg.historique_absent') })}</p></div>`
    }
    const mois = ind.mois.slice(-MOIS_AFFICHES)
    if (!mois.some(m => m.annonces)) return `<div class="mg-carte">${entete}<p class="non-calc">${th('yfm.non_calculable', { motif: brut(th('mg.aucune_annonce')) })}</p></div>`
    const L = largeurGraphe(), G = 44, D = 12, HC = 130, BAS = 34
    const x = i => G + (L - G - D) * (mois.length === 1 ? 0.5 : i / (mois.length - 1))
    // Etroit (telephone) : barres affinees, et une initiale par trimestre
    // seulement — 36 initiales ne tiennent pas dans 300 px.
    const pas = (L - G - D) / Math.max(1, mois.length - 1)
    const lb = Math.max(3, Math.min(10, pas * 0.6))
    const etroit = pas < 14
    // Etroit : l'annee du premier mois chevaucherait celle du janvier suivant
    // s'il tombe a moins de cinq barres (review de 24e3d9d) — on ne l'ecrit pas.
    const versJanvier = (13 - Number(mois[0].mois.slice(5, 7))) % 12
    const anneeDuPremier = !etroit || versJanvier === 0 || versJanvier >= 5
    const maxA = Math.max(...mois.map(m => m.annonces || 0)) || 1
    const barres = mois.map((m, i) => {
      const h = m.annonces ? (HC - BAS - 10) * m.annonces / maxA : 0
      return m.annonces
        ? `<rect x="${(x(i) - lb / 2).toFixed(1)}" y="${(HC - BAS - h).toFixed(1)}" width="${lb.toFixed(1)}" height="${h.toFixed(1)}" fill="var(${m.couverture_partielle ? '--mg-barre-partielle' : '--mg-barre'})"><title>${th(m.couverture_partielle ? 'mg.barre_partielle' : 'mg.barre', { mois: moisFr(m.mois), n: m.annonces })}</title></rect>`
        : `<text x="${x(i)}" y="${HC - BAS - 4}" text-anchor="middle">·</text>`
    }).join('')
    const abscisse = mois.map((m, i) => {
      const janvier = m.mois.slice(5) === '01'
      const trimestre = ['01', '04', '07', '10'].includes(m.mois.slice(5))
      return (!etroit || trimestre ? `<text class="initiale" x="${x(i)}" y="${HC - BAS + 12}" text-anchor="middle">${ech(initiale(Number(m.mois.slice(5, 7)) - 1))}</text>` : '')
        + (janvier || (i === 0 && anneeDuPremier) ? `<text class="annee" x="${x(i)}" y="${HC - BAS + 27}" text-anchor="middle">${ech(m.mois.slice(0, 4))}</text>` : '')
    }).join('')
    const bornes = mois.filter(m => m.annonces)
    return `<div class="mg-carte">${entete}<div class="mg-defile"><svg class="mg" viewBox="0 0 ${L} ${HC}" role="img" aria-label="${th('mg.biens_aria')}">
      ${barres}<line class="axe" x1="${G}" x2="${L - D}" y1="${HC - BAS}" y2="${HC - BAS}"/>${abscisse}</svg></div>
      <p class="mg-mention">${th('mg.biens_bornes', { mois1: moisFr(bornes[0].mois), n1: bornes[0].annonces, mois2: moisFr(bornes[bornes.length - 1].mois), n2: bornes[bornes.length - 1].annonces })}${mois.some(m => m.couverture_partielle) ? ` ${th('mg.barre_grise')}` : ''}</p></div>`
  }

  // ─── Section 4 : le calendrier AirROI, 12 mois d'un coup (§17.1) ────────
  // ⚠ PIPELINE ETANCHE : sa route, son bloc ; rien de l'historique n'y entre.
  // Le rendu est le module commun avec la page « La temperature du marche ».
  async function chargerAirroi (j) {
    el('mg-airroi-zone').innerHTML = `<div class="mg-carte"><h2>${th('mg.airroi_titre')}</h2>`
      + `<p class="sous">${th('mg.airroi_sous')}</p>`
      + `<div id="mg-airroi"><p class="mg-meta">${th('mg.airroi_lecture')}</p></div>`
      + `<p class="mg-mention">${th('mg.airroi_deux_sources')}</p>`
      + `<p class="mg-mention" id="mg-airroi-meta"></p></div>`
    const ici = html => {
      if (j !== jeton) return
      el('mg-airroi').innerHTML = html
      el('mg-resume-airroi').innerHTML = blocsAirroi(null)
    }
    let r
    try {
      r = await fetch(`/api/marche-temperature?property_id=${encodeURIComponent(el('mg-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
    } catch (e) { return ici(`<p class="non-calc">${th('yfm.serveur_muet')}</p>`) }
    if (j !== jeton) return
    if (!r.ok) return ici(`<p class="non-calc">${th('yfm.statut', { statut: r.status })}</p>`)
    let d
    try { d = await r.json() } catch (e) { return ici(`<p class="non-calc">${th('yfm.illisible')}</p>`) }
    if (j !== jeton) return
    if (d.etat === 'marche_inconnu') return ici(`<p class="non-calc">${d.motif ? th('yfm.marche_inconnu_motif', { motif: d.motif }) : th('yfm.marche_inconnu')}</p>`)
    if (d.etat === 'capture_absente') return ici(`<p class="non-calc">${ech(d.motif)}.</p>`)
    if (d.etat !== 'calcule' || !Array.isArray(d.jours) || !d.jours.length) return ici(`<p class="non-calc">${th('mt.aucun_jour')}</p>`)
    el('mg-airroi-meta').innerHTML = th('mg.airroi_meta', { date: jourFr(d.capture_le) })
    // Le calendrier part du MEME mois que le resume calcule par l'API ; a
    // defaut, du mois de Paris lu ici (review de f229258).
    const depart = d.resume && d.resume.periode && /^\d{4}-\d{2}$/.test(String(d.resume.periode.debut)) ? d.resume.periode.debut : moisDeParis()
    monterAnneeTemperature(el('mg-airroi'), d.jours, { premierMois: depart, nbMois: 12 })
    el('mg-resume-airroi').innerHTML = blocsAirroi(d.resume)
  }

  // ─── « EN RESUME » (§18) ────────────────────────────────────────────────
  // 5a — la tendance : l'HISTORIQUE (12 mois glissants contre les 12
  // precedents). Un SENS par indicateur, aucun chiffre ; le verdict suit le
  // RevPAR ; bande de stabilite ±3 %.
  const BANDE_STABLE = 3
  const sensDe = pct => (typeof pct !== 'number' ? null : pct > BANDE_STABLE ? 'hausse' : pct < -BANDE_STABLE ? 'baisse' : 'stable')
  const FLECHE = { hausse: '↑', baisse: '↓', stable: '→' }
  const MOT = { hausse: 'mg.mot_hausse', baisse: 'mg.mot_baisse', stable: 'mg.mot_stable' }
  const VERDICT = { hausse: 'mg.verdict_hausse', baisse: 'mg.verdict_baisse', stable: 'mg.verdict_stable' }
  function blocTendance (prog) {
    const tete = `<h3>${th('mg.tendance_titre')}</h3><p class="mg-source">${th('mg.tendance_source')}</p>`
    const p = prog && prog.statut === 'calcule' ? prog.progression : null
    if (!p || p.statut !== 'calcule') return `${tete}<p class="non-calc">${th('yfm.non_calculable', { motif: (p && p.motif) || (prog && prog.motif) || t('mg.historique_absent') })}</p>`
    const ligne = (cle, nom) => {
      const sn = sensDe(p.indicateurs[cle] && p.indicateurs[cle].pct)
      return sn ? `<b aria-hidden="true">${FLECHE[sn]}</b><span>${th('mg.ligne_sens', { nom: brut(th(nom)), sens: brut(th(MOT[sn])) })}</span>` : `<b aria-hidden="true">·</b><span>${th('mg.ligne_sens', { nom: brut(th(nom)), sens: brut(`<span class="non-calc">${th('mg.non_calculable_mot')}</span>`) })}</span>`
    }
    const v = sensDe(p.indicateurs.revpar && p.indicateurs.revpar.pct)
    const verdict = v ? th(VERDICT[v]) : null
    return `${tete}${verdict ? `<p class="mg-verdict">${verdict}</p>` : `<p class="non-calc">${th('mg.pas_de_verdict')}</p>`}`
      + `<div class="mg-sens">${ligne('revpar', 'mg.ind_revpar')}${ligne('occupation', 'mg.ind_occupation')}${ligne('annonces', 'mg.ind_biens')}</div>`
  }

  // 5b, 5c, 5d — AirROI, sur les 12 mois du calendrier.
  const sourceAirroi = () => `<p class="mg-source">${th('mg.source_airroi')}</p>`
  // ⚠ TROIS JETONS PAR NIVEAU : le fond, le trait, l'encre. L'echelle d'encre
  // n'a pas d'« accent » — elle n'a que des densites — donc le trait et le
  // texte se choisissent dans la meme echelle, et le texte bascule sur --bg
  // au niveau 5. Aucun hexa ici : tout est jeton.
  //
  // ⚠ LA DERNIERE LIGNE COUVRE DEUX NIVEAUX (« Pic » chez AirROI vaut Tres
  // haut OU Exceptionnel) : elle prend le fond du 5, et un trait CLAIR, parce
  // qu'un trait sombre sur un fond sombre ne se verrait pas. C'est la suite de
  // l'ecart 1 du 29 octobre, qui appariait le fond d'un niveau avec l'accent
  // d'un autre : un fond va avec un trait qu'on voit dessus, et c'est tout ce
  // que la regle disait.
  // ⚠ UNE CLASSE DE NIVEAU, PAS DES JETONS EN STYLE EN LIGNE. Les classes
  // .n-* de l'echelle d'encre portent deja le fond, l'encre et le lisere ;
  // les reecrire ici en trois jetons etait une quatrieme copie du mecanisme,
  // et c'est par la que le niveau avait atteint la LIGNE (constat de review
  // du 3 novembre 2026). La derniere entree couvre deux niveaux — « Pic »
  // chez AirROI vaut Tres haut OU Exceptionnel — et prend la classe du 5.
  const YF = {
    Base: 'n-base',
    Moyen: 'n-moyen',
    Haut: 'n-haut',
    'Très haut ou Exceptionnel': 'n-exceptionnel'
  }
  // Le CHIFFRE est toujours ecrit (regle 2) — a l'affichage seulement.
  const CHIFFRE_MARCHE = { Base: '1', Moyen: '2', Haut: '3', 'Très haut ou Exceptionnel': '4-5' }
  // ⚠ LES CLES CI-DESSUS SONT LES VALEURS QUE L'API RENVOIE, en francais, et
  // elles le restent : c'est leur NOM A L'ECRAN qui se traduit, ici. Un
  // libelle inconnu est dit tel quel, echappe.
  const NOM_YF = { Base: 'mg.yf_base', Moyen: 'mg.yf_moyen', Haut: 'mg.yf_haut', 'Très haut ou Exceptionnel': 'mg.yf_tres_haut_exc' }
  const nomYf = x => (Object.hasOwn(NOM_YF, x) ? th(NOM_YF[x]) : ech(x))
  function blocsAirroi (r) {
    if (!r || r.statut !== 'calcule' || !r.semaine || !Array.isArray(r.niveaux) || !Array.isArray(r.evenements)) {
      return `<div class="mg-bloc"><h3>${th('mg.airroi_bloc_titre')}</h3>${sourceAirroi()}<p class="non-calc">${th('yfm.non_calculable', { motif: (r && r.motif) || t('mg.resume_absent') })}</p></div>`
    }
    const s = r.semaine
    const verdict = s.verdict === 'week_end' ? th('mg.sem_week_end')
      : s.verdict === 'semaine' ? th('mg.sem_semaine')
        : s.verdict === 'equilibre' ? th('mt.verdict_egal') : null
    const semaine = `<div class="mg-bloc"><h3>${th('mt.sem_titre')}</h3>${sourceAirroi()}`
      + (verdict ? `<p class="mg-verdict">${verdict}</p>` : `<p class="non-calc">${th('mg.non_calculable_point')}</p>`)
      + (s.meilleur ? `<p class="mg-mention">${th('mt.sem_meilleur', { meilleur: s.meilleur, pire: s.pire })}</p>` : '')
      + `<p class="mg-mention">${th('mg.sem_definition')}</p></div>`
    const niveaux = `<div class="mg-bloc"><h3>${th('mg.niveaux_titre')}</h3>${sourceAirroi()}`
      + r.niveaux.map(n => {
        // ⚠ LE REPLI EST DEVENU UNE CLASSE VIDE, ET LA RAISON MERITE D'ETRE
        // GARDEE. Jusqu'au 3 novembre 2026 cette ligne rendait trois jetons en
        // style en ligne, avec un repli `['--bg2', '--text2', '--text2']` — et
        // une version anterieure y mettait `--border2`, un jeton de BORDURE
        // employe comme couleur de TEXTE : 1,60:1 sur --bg2, le nom AirROI
        // entre parentheses disparaissait presque.
        // Maintenant c'est une CLASSE de niveau, et le repli est la chaine
        // vide : une ligne dont le libelle n'est pas connu garde simplement le
        // fond neutre de .mg-pastille et le texte --text, soit le repli ecrit
        // dans les `var(…, …)` de la regle. Il n'y a plus de couleur a choisir
        // ici, donc plus de mauvaise couleur a choisir.
        const classe = YF[n.yieldflow] || ''
        return `<div class="mg-niv-l"><span><b class="mg-pastille ${classe}">${CHIFFRE_MARCHE[n.yieldflow] ? `${CHIFFRE_MARCHE[n.yieldflow]} · ` : ''}${nomYf(n.yieldflow)}</b> <small>(${NOM_AIRROI[niv(n.niveau)] ? th(NOM_AIRROI[niv(n.niveau)]) : '—'})</small></span><span>${th('yfm.jours', { n: Number(n.jours) || 0 })}</span></div>`
      }).join('')
      + `<p class="mg-mention">${th('mg.niveaux_mention')}</p></div>`
    const evts = r.evenements.map(e => {
      const n = niv(e.niveau)
      return `<div class="mg-ev-l"><strong>${ech(e.nom)}</strong>`
        + `<span>${ech(jourFr(e.debut))}${e.fin !== e.debut ? ` → ${ech(jourFr(e.fin))}` : ''} (${th('yfm.nuits', { n: Number(e.nuits) || 0 })})</span>`
        + `${badge(e.niveau)}<span class="o">${th(e.recurrent ? 'mg.recurrent' : 'mg.ponctuel')}</span></div>`
    }).join('')
    const evenements = `<div class="mg-bloc"><h3>${th('mg.evenements_titre')}</h3>${sourceAirroi()}`
      + `<p class="mg-mention" style="margin-bottom:8px">${th('mg.evenements_mention')}</p>`
      + (evts ? `<div class="mg-ev-liste">${evts}</div>` : `<p class="non-calc">${th('mg.aucun_evenement')}</p>`) + '</div>'
    // Une capture qui ne couvre pas toute la fenetre le dit.
    const p = r.periode || {}
    const partiel = p.jours && p.jours_fenetre && p.jours < p.jours_fenetre
      ? `<p class="mg-mention" style="margin-top:8px">${th('mg.couverture_partielle', { jours: p.jours, total: p.jours_fenetre })}</p>` : ''
    return partiel + semaine + niveaux + evenements + blocVacances(r.vacances)
  }

  // 5e — les vacances scolaires (§19) : le modele AirROI croise avec le
  // calendrier officiel des vacances. Un sens par periode et par zone, jamais
  // un chiffre, et une conclusion en une phrase.
  // ⚠ LES PHRASES SE COMPOSENT PAR CLE, PAS PAR CONCATENATION : « de Noël »,
  // « À Noël » et la liste « A, B et C » changent de forme d'une langue a
  // l'autre. Une periode inconnue garde son nom (echappe) dans un gabarit.
  const PERIODES = ['toussaint', 'noel', 'hiver', 'printemps', 'ete']
  const EFFET_VAC = { hausse: 'mg.vac_effet_hausse', baisse: 'mg.vac_effet_baisse', neutre: 'mg.vac_effet_neutre' }
  const FLECHE_VAC = { hausse: '↑', baisse: '↓', neutre: '→' }
  function blocVacances (v) {
    if (v === undefined) return ''
    const tete = `<div class="mg-bloc"><h3>${th('mg.vac_titre')}</h3><p class="mg-source">${th('mg.vac_source')}</p>`
    const connues = v && /^\d{4}-\d{2}-\d{2}$/.test(String(v.connues_jusqu_au || ''))
      ? `<p class="mg-mention">${th('mg.vac_connues', { date: jourFr(v.connues_jusqu_au) })}</p>` : ''
    if (!v || v.statut !== 'calcule' || !Array.isArray(v.periodes)) return `${tete}<p class="non-calc">${th('yfm.non_calculable', { motif: (v && v.motif) || t('mg.vac_absentes') })}</p>${connues}</div>`
    // Une meme periode deux fois dans la fenetre se distingue par son annee scolaire.
    const doublons = new Set(v.periodes.map(p => p.cle).filter((c, i, l) => l.indexOf(c) !== i))
    const annee = p => (doublons.has(p.cle) ? ` ${ech(p.annee_scolaire)}` : '')
    const de = p => `${PERIODES.includes(p.cle) ? th(`mg.vac_de_${p.cle}`) : th('mg.vac_de_autre', { nom: p.nom })}${annee(p)}`
    const en = p => `${PERIODES.includes(p.cle) ? th(`mg.vac_en_${p.cle}`) : th('mg.vac_en_autre', { nom: p.nom })}${annee(p)}`
    const calc = v.periodes.filter(p => p.statut === 'calcule' && FLECHE_VAC[p.sens])
    const hausses = calc.filter(p => p.sens === 'hausse').map(de)
    const baisses = calc.filter(p => p.sens === 'baisse').map(de)
    const phrases = []
    if (hausses.length) phrases.push(baisses.length ? th('mg.vac_hausses_baisses', { hausses: brut(liste(hausses)), baisses: brut(liste(baisses)) }) : th('mg.vac_hausses', { hausses: brut(liste(hausses)) }))
    else if (baisses.length) phrases.push(th('mg.vac_baisses', { baisses: brut(liste(baisses)) }))
    else if (calc.length) phrases.push(th('mg.vac_sans_effet'))
    // Les zones ne se departagent que dans une periode qui PORTE le marche.
    const parZone = calc.filter(p => p.sens === 'hausse' && Array.isArray(p.zones)).map(p => {
      const pp = Array.isArray(p.plus_porteuses) ? p.plus_porteuses : null
      const nb = Number(p.zones_mesurees) || 0
      if (!pp || nb < 2) return th('mg.zones_indeparta', { quand: brut(en(p)) })
      if (!pp.length) return th(nb === 3 ? 'mg.zones_trois_egales' : 'mg.zones_egales', { quand: brut(en(p)) })
      return pp.length > 1 ? th('mg.zones_porteuses', { quand: brut(en(p)), zones: brut(liste(pp.map(ech))) }) : th('mg.zone_porteuse', { quand: brut(en(p)), zone: pp[0] })
    })
    // Apres le separateur, la suite reprend en minuscule (« ; au printemps »).
    if (parZone.length) phrases.push(th('mg.zones_phrase', { suite: brut(parZone.map((x, i) => (i ? x.charAt(0).toLowerCase() + x.slice(1) : x)).join(t('mg.separateur'))) }))
    const lignes = v.periodes.map(p => {
      const nom = th('mg.vac_nom', { de: brut(de(p)) })
      if (p.statut === 'debut_seulement') return `<b aria-hidden="true">·</b><span>${th('mg.ligne_sens', { nom: brut(nom), sens: brut(`<span class="non-calc">${th('mg.vac_debut_seulement')}</span>`) })}</span>`
      if (p.statut === 'hors_fenetre') return `<b aria-hidden="true">·</b><span>${th('mg.ligne_sens', { nom: brut(nom), sens: brut(`<span class="non-calc">${th('mg.vac_hors_fenetre')}</span>`) })}</span>`
      if (p.statut !== 'calcule' || !FLECHE_VAC[p.sens]) return `<b aria-hidden="true">·</b><span>${th('mg.ligne_sens', { nom: brut(nom), sens: brut(`<span class="non-calc">${th('mg.non_calculable_mot')}${p.motif ? ` (${ech(p.motif)})` : ''}</span>`) })}</span>`
      const zones = Array.isArray(p.zones)
        ? `<br><small class="mg-zones">${p.zones.map(z => th('mg.zone_sens', { zone: z.zone, sens: brut(FLECHE_VAC[z.sens] || th('mg.zone_non_mesuree')) })).join(' · ')}</small>` : ''
      const partielle = p.partielle ? ` <span class="non-calc">${th('mg.vac_partielle')}</span>` : ''
      // Le niveau du marche pendant la periode, comme pour un evenement.
      // Sans niveau lisible, rien n'est insere (pas de tiret orphelin).
      return `<b aria-hidden="true">${FLECHE_VAC[p.sens]}</b><span>${th('mg.ligne_sens', { nom: brut(`${nom}${niv(p.niveau) ? ` ${badge(p.niveau)}` : ''}`), sens: brut(`${th(EFFET_VAC[p.sens])}${partielle}${zones}`) })}</span>`
    }).join('')
    return `${tete}${phrases.length ? `<p class="mg-verdict">${phrases.join(' ')}</p>` : ''}<div class="mg-sens">${lignes}</div>`
      + `<p class="mg-mention">${th('mg.vac_mention')}</p>`
      + `${connues}</div>`
  }
  const NOM_AIRROI = { creux: 'mg.airroi_creux', modere: 'mg.airroi_modere', favorable: 'mg.airroi_favorable', pic: 'mg.airroi_pic' }

  init().catch(e => console.error('[marche-global]', e))
</script>
</body>
</html>
