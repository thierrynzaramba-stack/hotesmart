<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HôteSmart — Le marché global</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    [hidden] { display: none !important; }
    /* ⚠ PAGE EN LECTURE SEULE (spec §17 de docs/kb/chantier-nouveau-bien.md).
       Elle n'ecrit rien, ne pilote rien, n'est reliee a aucun menu (acces par
       l'adresse directe). PIPELINES ETANCHES : l'historique (sections 1 a 3) et
       AirROI (section 4) s'affichent cote a cote, sans jamais se croiser. */
    :root {
      /* Les trois annees : N-2 la plus pale, N la plus soutenue. */
      --mg-n2: #9DB9E3; --mg-n1: #5B87C9; --mg-n: #1E3F73;
      --mg-barre: #9DB9E3; --mg-barre-partielle: #C9CED6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --mg-n2: #4a5f80; --mg-n1: #7fa3dc; --mg-n: #c7dbff;
        --mg-barre: #5b7fb5; --mg-barre-partielle: #555b66;
      }
    }
    :root[data-theme="dark"] {
      --mg-n2: #4a5f80; --mg-n1: #7fa3dc; --mg-n: #c7dbff;
      --mg-barre: #5b7fb5; --mg-barre-partielle: #555b66;
    }
    .mg-avertir { background: var(--amber-bg); border: 0.5px solid var(--amber); border-radius: var(--radius);
                  padding: 12px 14px; margin-bottom: 16px; font-size: 13.5px; line-height: 1.5; }
    .mg-meta { font-size: 12.5px; color: var(--text2); margin: 6px 0 16px; }
    .mg-carte { border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px;
                margin-bottom: 16px; background: var(--bg); }
    .mg-carte h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    .mg-carte .sous { font-size: 12.5px; color: var(--text2); margin: 0 0 10px; line-height: 1.45; }
    .mg-mention { font-size: 12px; color: var(--text2); margin: 6px 0 0; }
    .mg-legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text2); margin: 8px 0 2px; }
    .mg-legende i { display: inline-block; width: 22px; height: 0; vertical-align: 3px; margin-right: 6px; }
    .non-calc { color: var(--text2); font-style: italic; }
    /* « En resume » (§18) : quatre blocs, chacun sa source. */
    :root {
      --yf-base: #E7F0F7; --yf-base-l: #4A7FA8; --yf-moyen: #EDF4EE; --yf-moyen-l: #5F8F6E;
      --yf-haut: #FBF4E2; --yf-haut-l: #C89A2E; --yf-tres-haut: #FAEADA; --yf-tres-haut-l: #D2762E;
      --yf-exceptionnel-l: #BF4F32;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --yf-base: #1d2a36; --yf-moyen: #1f2d24; --yf-haut: #352d17; --yf-tres-haut: #3a2717;
      }
    }
    :root[data-theme="dark"] { --yf-base: #1d2a36; --yf-moyen: #1f2d24; --yf-haut: #352d17; --yf-tres-haut: #3a2717; }
    .mg-bloc { padding: 12px 0; border-top: 0.5px solid var(--border); }
    #mg-resume-tendance { border-top: 0; padding-top: 4px; }
    .mg-bloc h3 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
    .mg-source { font-size: 11.5px; color: var(--text2); margin: 0 0 8px; }
    .mg-verdict { font-size: 14px; font-weight: 600; margin: 4px 0 8px; }
    .mg-sens { display: grid; grid-template-columns: 26px 1fr; gap: 4px 6px; font-size: 13.5px; align-items: center; }
    .mg-sens b { font-size: 17px; text-align: center; }
    .mg-zones { color: var(--text2); font-size: 12px; }
    .mg-niv-l { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 4px;
                border-radius: 4px; background: var(--niv-fond); box-shadow: inset 3px 0 0 var(--niv-lisere); font-size: 13.5px; color: var(--text); }
    .mg-niv-l small { color: var(--text2); }
    .mg-ev-liste { display: flex; flex-direction: column; gap: 6px; }
    .mg-ev-l { background: var(--bg2); border-left: 4px solid var(--ev); border-radius: 4px; padding: 7px 10px; font-size: 13px;
               display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .mg-ev-l .o { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
    svg.mg { width: 100%; height: auto; display: block; }
    svg.mg text { font-size: 11px; fill: var(--text2); font-family: inherit; }
    svg.mg .axe { stroke: var(--border2); stroke-width: 1; }
    svg.mg .grille { stroke: var(--border); stroke-width: 1; }
    svg.mg .repere-mois { stroke: var(--border); stroke-width: 0.6; }
    svg.mg text.initiale { font-size: 10px; }
    svg.mg text.annee { font-weight: 600; fill: var(--text); }
    /* Telephone : chaque graphique est DESSINE a la largeur de sa carte (voir
       largeurGraphe) et tient entier, sans defilement (demande de Thierry,
       4 octobre 2026) ; la page, elle, ne deborde jamais. */
    .mg-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 640px) {
      .content { padding-left: 12px; padding-right: 12px; } .mg-carte { padding: 12px; }
    }
  </style>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="content">
  <div class="header"><h1>Le marché global</h1></div>

  <div class="mg-avertir">
    <b>Une estimation du marché, pas un prix.</b> Cette page montre le marché de votre commune d’après
    les annonces Airbnb. Elle ne calcule aucun prix pour votre logement, n’en pousse aucun, et
    <b>ne pilote rien</b>.
  </div>

  <div><label class="mg-meta">Logement <select id="mg-bien"></select></label></div>
  <div class="mg-meta" id="mg-meta"></div>
  <!-- Sections 1 a 3 : l'historique du marche (/api/marche-global). -->
  <div id="mg-corps"><p class="mg-meta">Lecture du marché…</p></div>
  <!-- Section 4 : le calendrier AirROI, dans SON bloc, lu par SA route. -->
  <div id="mg-airroi-zone"></div>
  <!-- « En resume » (§18) : la tendance vient de l'historique, le reste
       d'AirROI ; chaque bloc nomme sa source, rien n'est croise. -->
  <div class="mg-carte" id="mg-resume" hidden><h2>En résumé</h2>
    <div class="mg-bloc" id="mg-resume-tendance"></div>
    <div id="mg-resume-airroi"></div>
  </div>
</div>
</div>
</div>

<script type="module">
  // ⚠ LECTURE SEULE : la liste des logements du compte, puis deux GET, chacun
  // sa source : /api/marche-global (historique) et /api/marche-temperature
  // (AirROI). Aucune ecriture, aucun appel AirROI, aucun prix AirROI.
  import { requireAuth } from '/components/auth-guard.js'
  import { renderSidebar } from '/components/sidebar.js'
  import { compteCourant, enteteCompte } from '/shared/compte-courant.js'
  import { supabase } from '/shared/supabase.js'
  import { initErrorHandler } from '/shared/error-handler.js'
  import { monterAnneeTemperature, fermerDetail, badge, niv } from '/shared/temperature-calendrier.js'

  initErrorHandler()
  const el = id => document.getElementById(id)
  const ech = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']
  const moisFr = m => `${MOIS[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`
  const jourFr = iso => /^\d{4}-\d{2}-\d{2}/.test(String(iso || '')) ? `${Number(iso.slice(8, 10))}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '—'
  const euros = v => (typeof v === 'number' && Number.isFinite(v) ? `${String(Math.round(v * 10) / 10).replace('.', ',')} €` : 'non mesuré')
  const pourcent = v => (typeof v === 'number' && Number.isFinite(v) ? `${Math.round(v * 100)} %` : 'non mesuré')
  const INITIALES = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D']
  // Le graphique des biens montre les 3 dernieres annees (la donnee garde 60 mois).
  const MOIS_AFFICHES = 36
  // Le mois en cours, a l'heure de Paris : le calendrier AirROI part de lui.
  const moisDeParis = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }).slice(0, 7)

  let session = null
  let jeton = 0
  // La derniere reponse de l'historique : redessinee si la largeur change.
  let dernier = null
  let largeurDessinee = 0

  // La largeur du dessin suit celle de la carte : sur telephone, une courbe de
  // douze mois tient entiere, texte a sa taille normale, sans defilement. Sans
  // mesure possible (page cachee), la largeur de bureau.
  function largeurGraphe () {
    const w = el('mg-corps').clientWidth
    return w > 0 ? Math.max(280, Math.min(900, Math.round(w - 34))) : 900
  }
  function dessinerHistorique () {
    if (!dernier) return
    largeurDessinee = largeurGraphe()
    corps(sectionRevpar(dernier.progression, dernier.recupere_le) + sectionRemplissage(dernier.progression, dernier.recupere_le) + sectionBiens(dernier.revpar))
  }
  let attente = null
  window.addEventListener('resize', () => {
    clearTimeout(attente)
    attente = setTimeout(() => { if (dernier && largeurGraphe() !== largeurDessinee) dessinerHistorique() }, 200)
  })

  async function init () {
    session = await requireAuth()
    if (!session) return
    renderSidebar('yield-marche-global').catch(e => console.error('[marche-global] sidebar', e))
    const compte = compteCourant()
    let q = supabase.from('properties').select('id, name').order('name')
    if (compte) q = q.eq('user_id', compte)
    const { data, error } = await q
    if (error) return corps('<p class="non-calc">Impossible de lire la liste des logements.</p>')
    if (!data || !data.length) return corps('<p class="non-calc">Aucun logement accessible sur ce compte.</p>')
    el('mg-bien').innerHTML = data.map(b => `<option value="${ech(b.id)}">${ech(b.name)}</option>`).join('')
    el('mg-bien').addEventListener('change', charger)
    charger()
  }

  function corps (html) { el('mg-corps').innerHTML = html }

  function charger () {
    const j = ++jeton
    // La fenetre de detail d'un jour appartient au logement precedent (review de 39d9d81).
    fermerDetail()
    el('mg-resume').hidden = false
    el('mg-resume-tendance').innerHTML = '<p class="mg-meta">Lecture…</p>'
    el('mg-resume-airroi').innerHTML = ''
    chargerHistorique(j)
    chargerAirroi(j)
  }

  // ─── L'HISTORIQUE (sections 1 a 3) ──────────────────────────────────────
  async function chargerHistorique (j) {
    dernier = null
    corps('<p class="mg-meta">Lecture du marché…</p>'); el('mg-meta').innerHTML = ''
    let r
    try {
      r = await fetch(`/api/marche-global?property_id=${encodeURIComponent(el('mg-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
    } catch (e) { if (j === jeton) { corps('<p class="non-calc">Lecture impossible : le serveur ne répond pas.</p>'); el('mg-resume-tendance').innerHTML = blocTendance(null) } return }
    if (j !== jeton) return
    if (!r.ok) { el('mg-resume-tendance').innerHTML = blocTendance(null); return corps(`<p class="non-calc">Lecture impossible (${r.status}).</p>`) }
    let d
    try { d = await r.json() } catch (e) { if (j === jeton) { corps('<p class="non-calc">Réponse illisible.</p>'); el('mg-resume-tendance').innerHTML = blocTendance(null) } return }
    if (j !== jeton) return
    if (d.etat !== 'calcule') el('mg-resume-tendance').innerHTML = blocTendance(null)
    if (d.etat === 'marche_inconnu') return corps(`<p class="non-calc">Aucun marché n’est relié à ce logement : ${ech(d.motif)}.</p>`)
    if (d.etat === 'historique_absent') return corps(`<p class="non-calc">Marché ${ech(d.marche && d.marche.localite)} : ${ech(d.motif)}.</p>`)
    el('mg-meta').innerHTML = `Marché : <b>${ech(d.marche.localite)}</b> (${ech(d.marche.region)}, ${ech(d.marche.pays)}) · historique AirROI lu le ${jourFr(d.recupere_le)}`
    dernier = d
    dessinerHistorique()
    el('mg-resume-tendance').innerHTML = blocTendance(d.progression)
  }

  // ─── Sections 1 et 2 : N, N-1, N-2 superposees ──────────────────────────
  // ⚠ Legende RELATIVE (N, N-1, N-2), jamais une annee en dur ; l'annee
  // reelle ne sort qu'en info-bulle. N est l'annee de la LECTURE de
  // l'historique. Une annee partielle (moins de 12 mois mesures) est en
  // pointilles, et aucun total d'annee n'est calcule.
  const RANGS = [['N-2', 2, '--mg-n2', 1.8], ['N-1', 1, '--mg-n1', 2.2], ['N', 0, '--mg-n', 2.8]]

  function troisAnnees (prog, recupereLe) {
    const annees = (prog && prog.annees) || []
    // Sans date de lecture lisible, pas de N : on ne devine pas l'annee (review de 39d9d81).
    const n = /^\d{4}/.test(String(recupereLe || '')) ? Number(String(recupereLe).slice(0, 4)) : null
    if (!n) return []
    return RANGS.map(([nom, ecart, couleur, epaisseur]) => ({
      nom, couleur: `var(${couleur})`, epaisseur, donnee: annees.find(a => Number(a.annee) === n - ecart) || null,
    }))
  }

  function superposees (prog, recupereLe, cle, { titre, sous, bulle, graduation, mention }) {
    const entete = `<h2>${titre}</h2><p class="sous">${sous}</p>`
    const series = troisAnnees(prog, recupereLe)
    const vals = series.flatMap(s => (s.donnee ? s.donnee.mois.map(m => m[cle]) : [])).filter(v => typeof v === 'number')
    if (!prog || prog.statut !== 'calcule' || !vals.length) {
      const motif = prog && prog.statut === 'calcule' && !series.length ? 'la date de lecture de l’historique est illisible' : (prog && prog.motif) || 'historique absent'
      return `<div class="mg-carte">${entete}<p class="non-calc">Non calculable : ${ech(motif)}.</p></div>`
    }
    const L = largeurGraphe(), H = L < 600 ? 220 : 260, G = 50, D = 12, HAUT = 12, BAS = 26
    const max = Math.max(...vals) * 1.08
    const x = k => G + (L - G - D) * k / 11
    const y = v => HAUT + (H - HAUT - BAS) * (1 - v / max)
    const grille = [0, 0.25, 0.5, 0.75, 1].map(f => `<line class="grille" x1="${G}" x2="${L - D}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${G - 6}" y="${y(max * f) + 4}" text-anchor="end">${graduation(max * f)}</text>`).join('')
    const abscisse = INITIALES.map((n, k) => `<line class="repere-mois" x1="${x(k)}" x2="${x(k)}" y1="${HAUT}" y2="${H - BAS}"/><text class="initiale" x="${x(k)}" y="${H - BAS + 15}" text-anchor="middle">${n}</text>`).join('')
    const courbes = series.filter(s => s.donnee).map(s => {
      const a = s.donnee
      const mesure = k => k >= 0 && k < a.mois.length && typeof a.mois[k][cle] === 'number'
      let dd = ''; let dedans = false
      a.mois.forEach((m, k) => {
        if (typeof m[cle] !== 'number') { dedans = false; return }
        dd += `${dedans ? 'L' : 'M'}${x(k).toFixed(1)},${y(m[cle]).toFixed(1)} `; dedans = true
      })
      // Un mois sans voisin mesure ne trace aucun segment : il porte un point plein.
      const points = a.mois.map((m, k) => {
        if (typeof m[cle] !== 'number') return ''
        const isole = !mesure(k - 1) && !mesure(k + 1)
        // Un mois de trop peu d'annonces reste trace, mais le dit : point creux.
        if (m.peu_annonces) return `<circle class="peu" cx="${x(k).toFixed(1)}" cy="${y(m[cle]).toFixed(1)}" r="3.5" fill="var(--bg)" stroke="${s.couleur}" stroke-width="1.5"><title>${ech(moisFr(m.mois))} (${s.nom}) · ${bulle(m[cle])} · trop peu d’annonces pour être représentatif</title></circle>`
        return `<circle cx="${x(k).toFixed(1)}" cy="${y(m[cle]).toFixed(1)}" r="${isole ? 3.5 : 6}" fill="${isole ? s.couleur : 'transparent'}"${isole ? ' class="isole"' : ''}><title>${ech(moisFr(m.mois))} (${s.nom}) · ${bulle(m[cle])}</title></circle>`
      }).join('')
      return `<path data-rang="${s.nom}" d="${dd}" fill="none" stroke="${s.couleur}" stroke-width="${s.epaisseur}"${a.partielle ? ' stroke-dasharray="6 4"' : ''}/>${points}`
    }).join('')
    const legende = `<div class="mg-legende">${series.slice().reverse().map(s => {
      const note = !s.donnee ? ' : non mesurée' : s.donnee.partielle ? ' : partielle' : ''
      const trait = s.donnee && s.donnee.partielle ? `border-top:${s.epaisseur}px dashed ${s.couleur}` : `border-top:${s.epaisseur}px solid ${s.couleur}`
      return `<span><i style="${trait}"></i>${s.nom}${note}</span>`
    }).join('')}</div>`
    return `<div class="mg-carte">${entete}${legende}<div class="mg-defile"><svg class="mg" viewBox="0 0 ${L} ${H}" role="img" aria-label="${titre}, années N, N-1 et N-2 superposées">
      ${abscisse}${grille}<line class="axe" x1="${G}" x2="${L - D}" y1="${H - BAS}" y2="${H - BAS}"/>${courbes}</svg></div>
      <p class="mg-mention">${mention}${series.some(s => s.donnee && s.donnee.mois.some(m => m.peu_annonces)) ? ` Un point creux marque un mois de moins de ${ech(prog.seuil_annonces)} annonces actives : trop peu pour être représentatif.` : ''}</p></div>`
  }

  function sectionRevpar (prog, recupereLe) {
    return superposees(prog, recupereLe, 'revpar', {
      titre: 'Le RevPAR du marché, mois par mois',
      sous: 'Revenu par nuit disponible, médiane de l’ensemble des annonces du marché, de janvier à décembre. Une courbe par année : N (l’année de la dernière lecture de l’historique), N-1 et N-2.',
      bulle: v => `RevPAR médian : ${euros(v)}`,
      graduation: v => `${Math.round(v)} €`,
      mention: 'RevPAR du marché, en euros par nuit disponible — <b>pas un prix pour votre logement</b>. Une année en pointillés est partielle : elle se lit mois par mois, jamais comme un total.',
    })
  }

  // ⚠ L'occupation est celle du MARCHE : cette page ne lit, ne montre et ne
  // compare aucune occupation de logement (regle 13 de Thierry).
  function sectionRemplissage (prog, recupereLe) {
    return superposees(prog, recupereLe, 'occupation', {
      titre: 'Le remplissage du marché, mois par mois',
      sous: 'Occupation médiane de l’ensemble des annonces du marché (part des nuits vendues), de janvier à décembre. Une courbe par année : N, N-1 et N-2.',
      bulle: v => `occupation médiane : ${pourcent(v)}`,
      graduation: v => `${Math.round(v * 100)} %`,
      mention: 'Occupation <b>du marché</b>, comptée sur toutes ses annonces Airbnb, y compris les peu actives : elle ne se compare pas à l’occupation d’un logement.',
    })
  }

  // ─── Section 3 : le nombre de biens sur le marche (format existant) ─────
  function sectionBiens (ind) {
    const entete = '<h2>Le nombre de biens sur le marché</h2><p class="sous">Annonces actives mesurées par AirROI, mois par mois, sur les 3 dernières années : là où la barre est basse, l’historique est mince.</p>'
    if (!ind || ind.statut !== 'calcule') {
      return `<div class="mg-carte">${entete}<p class="non-calc">Non calculable : ${ech((ind && ind.motif) || 'historique absent')}.</p></div>`
    }
    const mois = ind.mois.slice(-MOIS_AFFICHES)
    if (!mois.some(m => m.annonces)) return `<div class="mg-carte">${entete}<p class="non-calc">Non calculable : aucune annonce mesurée sur les 3 dernières années.</p></div>`
    const L = largeurGraphe(), G = 44, D = 12, HC = 130, BAS = 34
    const x = i => G + (L - G - D) * (mois.length === 1 ? 0.5 : i / (mois.length - 1))
    // Etroit (telephone) : barres affinees, et une initiale par trimestre
    // seulement — 36 initiales ne tiennent pas dans 300 px.
    const pas = (L - G - D) / Math.max(1, mois.length - 1)
    const lb = Math.max(3, Math.min(10, pas * 0.6))
    const etroit = pas < 14
    // Etroit : l'annee du premier mois chevaucherait celle du janvier suivant
    // s'il tombe a moins de cinq barres (review de 24e3d9d) — on ne l'ecrit pas.
    const versJanvier = (13 - Number(mois[0].mois.slice(5, 7))) % 12
    const anneeDuPremier = !etroit || versJanvier === 0 || versJanvier >= 5
    const maxA = Math.max(...mois.map(m => m.annonces || 0)) || 1
    const barres = mois.map((m, i) => {
      const h = m.annonces ? (HC - BAS - 10) * m.annonces / maxA : 0
      return m.annonces
        ? `<rect x="${(x(i) - lb / 2).toFixed(1)}" y="${(HC - BAS - h).toFixed(1)}" width="${lb.toFixed(1)}" height="${h.toFixed(1)}" fill="var(${m.couverture_partielle ? '--mg-barre-partielle' : '--mg-barre'})"><title>${ech(moisFr(m.mois))} : ${ech(m.annonces)} annonces actives${m.couverture_partielle ? ' (couverture AirROI partielle)' : ''}</title></rect>`
        : `<text x="${x(i)}" y="${HC - BAS - 4}" text-anchor="middle">·</text>`
    }).join('')
    const abscisse = mois.map((m, i) => {
      const janvier = m.mois.slice(5) === '01'
      const trimestre = ['01', '04', '07', '10'].includes(m.mois.slice(5))
      return (!etroit || trimestre ? `<text class="initiale" x="${x(i)}" y="${HC - BAS + 12}" text-anchor="middle">${INITIALES[Number(m.mois.slice(5, 7)) - 1]}</text>` : '')
        + (janvier || (i === 0 && anneeDuPremier) ? `<text class="annee" x="${x(i)}" y="${HC - BAS + 27}" text-anchor="middle">${ech(m.mois.slice(0, 4))}</text>` : '')
    }).join('')
    const bornes = mois.filter(m => m.annonces)
    return `<div class="mg-carte">${entete}<div class="mg-defile"><svg class="mg" viewBox="0 0 ${L} ${HC}" role="img" aria-label="Annonces actives par mois, 36 derniers mois">
      ${barres}<line class="axe" x1="${G}" x2="${L - D}" y1="${HC - BAS}" y2="${HC - BAS}"/>${abscisse}</svg></div>
      <p class="mg-mention">${ech(moisFr(bornes[0].mois))} : ${ech(bornes[0].annonces)} annonces · ${ech(moisFr(bornes[bornes.length - 1].mois))} : ${ech(bornes[bornes.length - 1].annonces)} annonces.${mois.some(m => m.couverture_partielle) ? ' Une barre grise : mois où la couverture d’AirROI était encore partielle.' : ''}</p></div>`
  }

  // ─── Section 4 : le calendrier AirROI, 12 mois d'un coup (§17.1) ────────
  // ⚠ PIPELINE ETANCHE : sa route, son bloc ; rien de l'historique n'y entre.
  // Le rendu est le module commun avec la page « La temperature du marche ».
  async function chargerAirroi (j) {
    el('mg-airroi-zone').innerHTML = `<div class="mg-carte"><h2>Le calendrier du marché selon AirROI, jour par jour</h2>`
      + `<p class="sous"><b>Estimation AirROI, pas un prix.</b> Le niveau de chaque jour d’après le modèle de prix d’AirROI pour votre commune, ramené à quatre niveaux. Touchez un jour pour son détail.</p>`
      + `<div id="mg-airroi"><p class="mg-meta">Lecture du modèle AirROI…</p></div>`
      + `<p class="mg-mention">Deux sources, deux calendriers. Le modèle AirROI ne tient pas compte de l’historique des ventes.</p>`
      + `<p class="mg-mention" id="mg-airroi-meta"></p></div>`
    const ici = html => {
      if (j !== jeton) return
      el('mg-airroi').innerHTML = html
      el('mg-resume-airroi').innerHTML = blocsAirroi(null)
    }
    let r
    try {
      r = await fetch(`/api/marche-temperature?property_id=${encodeURIComponent(el('mg-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
    } catch (e) { return ici('<p class="non-calc">Lecture impossible : le serveur ne répond pas.</p>') }
    if (j !== jeton) return
    if (!r.ok) return ici(`<p class="non-calc">Lecture impossible (${r.status}).</p>`)
    let d
    try { d = await r.json() } catch (e) { return ici('<p class="non-calc">Réponse illisible.</p>') }
    if (j !== jeton) return
    if (d.etat === 'marche_inconnu') return ici(`<p class="non-calc">Aucun marché n’est relié à ce logement : ${ech(d.motif)}.</p>`)
    if (d.etat === 'capture_absente') return ici(`<p class="non-calc">${ech(d.motif)}.</p>`)
    if (d.etat !== 'calcule' || !Array.isArray(d.jours) || !d.jours.length) return ici('<p class="non-calc">Aucun jour à afficher pour ce marché.</p>')
    el('mg-airroi-meta').innerHTML = `Modèle AirROI calculé le ${jourFr(d.capture_le)}.`
    // Le calendrier part du MEME mois que le resume calcule par l'API ; a
    // defaut, du mois de Paris lu ici (review de f229258).
    const depart = d.resume && d.resume.periode && /^\d{4}-\d{2}$/.test(String(d.resume.periode.debut)) ? d.resume.periode.debut : moisDeParis()
    monterAnneeTemperature(el('mg-airroi'), d.jours, { premierMois: depart, nbMois: 12 })
    el('mg-resume-airroi').innerHTML = blocsAirroi(d.resume)
  }

  // ─── « EN RESUME » (§18) ────────────────────────────────────────────────
  // 5a — la tendance : l'HISTORIQUE (12 mois glissants contre les 12
  // precedents). Un SENS par indicateur, aucun chiffre ; le verdict suit le
  // RevPAR ; bande de stabilite ±3 %.
  const BANDE_STABLE = 3
  const sensDe = pct => (typeof pct !== 'number' ? null : pct > BANDE_STABLE ? 'hausse' : pct < -BANDE_STABLE ? 'baisse' : 'stable')
  const FLECHE = { hausse: '↑', baisse: '↓', stable: '→' }
  const MOT = { hausse: 'en hausse', baisse: 'en baisse', stable: 'stable' }
  function blocTendance (prog) {
    const tete = '<h3>La tendance du marché</h3><p class="mg-source">Source : historique du marché — les 12 derniers mois comparés aux 12 précédents.</p>'
    const p = prog && prog.statut === 'calcule' ? prog.progression : null
    if (!p || p.statut !== 'calcule') return `${tete}<p class="non-calc">Non calculable : ${ech((p && p.motif) || (prog && prog.motif) || 'historique absent')}.</p>`
    const ligne = (cle, nom) => {
      const sn = sensDe(p.indicateurs[cle] && p.indicateurs[cle].pct)
      return sn ? `<b aria-hidden="true">${FLECHE[sn]}</b><span>${nom} : ${MOT[sn]}</span>` : `<b aria-hidden="true">·</b><span>${nom} : <span class="non-calc">non calculable</span></span>`
    }
    const v = sensDe(p.indicateurs.revpar && p.indicateurs.revpar.pct)
    const verdict = v === 'stable' ? 'Le marché est stable par rapport à l’année dernière.'
      : v ? `Le marché est ${MOT[v]} par rapport à l’année dernière.` : null
    return `${tete}${verdict ? `<p class="mg-verdict">${verdict}</p>` : '<p class="non-calc">Pas de verdict : le RevPAR n’est pas calculable.</p>'}`
      + `<div class="mg-sens">${ligne('revpar', 'RevPAR')}${ligne('occupation', 'Occupation')}${ligne('annonces', 'Nombre de biens')}</div>`
  }

  // 5b, 5c, 5d — AirROI, sur les 12 mois du calendrier.
  const SOURCE_AIRROI = '<p class="mg-source">Source : modèle AirROI — les 12 mois du calendrier ci-dessus.</p>'
  const YF = { Base: ['--yf-base', '--yf-base-l'], Moyen: ['--yf-moyen', '--yf-moyen-l'], Haut: ['--yf-haut', '--yf-haut-l'],
    'Très haut ou Exceptionnel': ['--yf-tres-haut', '--yf-exceptionnel-l'] }
  function blocsAirroi (r) {
    if (!r || r.statut !== 'calcule' || !r.semaine || !Array.isArray(r.niveaux) || !Array.isArray(r.evenements)) {
      return `<div class="mg-bloc"><h3>Le marché selon AirROI</h3>${SOURCE_AIRROI}<p class="non-calc">Non calculable : ${ech((r && r.motif) || 'résumé absent')}.</p></div>`
    }
    const s = r.semaine
    const verdict = s.verdict === 'week_end' ? 'Le marché est plutôt favorable en week-end.'
      : s.verdict === 'semaine' ? 'Le marché est plutôt favorable en semaine.'
        : s.verdict === 'equilibre' ? 'Week-end et semaine se valent.' : null
    const semaine = `<div class="mg-bloc"><h3>Week-end ou semaine</h3>${SOURCE_AIRROI}`
      + (verdict ? `<p class="mg-verdict">${verdict}</p>` : '<p class="non-calc">Non calculable.</p>')
      + (s.meilleur ? `<p class="mg-mention">Meilleur jour : <b>${ech(s.meilleur)}</b> · jour le plus faible : <b>${ech(s.pire)}</b>.</p>` : '')
      + '<p class="mg-mention">Week-end : nuits du vendredi et du samedi ; semaine : du lundi au jeudi.</p></div>'
    const niveaux = `<div class="mg-bloc"><h3>Les niveaux du marché</h3>${SOURCE_AIRROI}`
      + r.niveaux.map(n => {
        const [fond, lisere] = YF[n.yieldflow] || ['--bg2', '--border2']
        return `<div class="mg-niv-l" style="--niv-fond:var(${fond});--niv-lisere:var(${lisere})"><span><b>${ech(n.yieldflow)}</b> <small>(${ech(NOM_AIRROI[niv(n.niveau)] || '—')})</small></span><span>${ech(n.jours)} jour${n.jours > 1 ? 's' : ''}</span></div>`
      }).join('')
      + '<p class="mg-mention">Les niveaux d’AirROI lus dans les noms de votre grille YieldFlow : une lecture, pas un calcul de vos prix. Pic correspond à Très haut ou Exceptionnel.</p></div>'
    const evts = r.evenements.map(e => {
      const n = niv(e.niveau)
      return `<div class="mg-ev-l" style="--ev:${n ? `var(--tc-${n})` : 'var(--border2)'}"><strong>${ech(e.nom)}</strong>`
        + `<span>${jourFr(e.debut)}${e.fin !== e.debut ? ` → ${jourFr(e.fin)}` : ''} (${ech(e.nuits)} nuit${e.nuits > 1 ? 's' : ''})</span>`
        + `${badge(e.niveau)}<span class="o">${e.recurrent ? 'récurrent' : 'ponctuel'}</span></div>`
    }).join('')
    const evenements = `<div class="mg-bloc"><h3>Les événements détectés</h3>${SOURCE_AIRROI}`
      + '<p class="mg-mention" style="margin-bottom:8px">Ces événements sont détectés par le modèle AirROI. Pour qu’ils influencent vos prix, créez-les dans vos événements.</p>'
      + (evts ? `<div class="mg-ev-liste">${evts}</div>` : '<p class="non-calc">Aucun événement détecté sur ces 12 mois.</p>') + '</div>'
    // Une capture qui ne couvre pas toute la fenetre le dit.
    const p = r.periode || {}
    const partiel = p.jours && p.jours_fenetre && p.jours < p.jours_fenetre
      ? `<p class="mg-mention" style="margin-top:8px">Le modèle AirROI ne couvre que ${ech(p.jours)} jours sur ${ech(p.jours_fenetre)} : ce résumé ne porte que sur eux.</p>` : ''
    return partiel + semaine + niveaux + evenements + blocVacances(r.vacances)
  }

  // 5e — les vacances scolaires (§19) : le modele AirROI croise avec le
  // calendrier officiel des vacances. Un sens par periode et par zone, jamais
  // un chiffre, et une conclusion en une phrase.
  const enListe = xs => (xs.length > 1 ? `${xs.slice(0, -1).join(', ')} et ${xs[xs.length - 1]}` : xs[0] || '')
  const DE_PERIODE = { toussaint: 'de la Toussaint', noel: 'de Noël', hiver: 'd’hiver', printemps: 'de printemps', ete: 'd’été' }
  const EN_PERIODE = { toussaint: 'À la Toussaint', noel: 'À Noël', hiver: 'En hiver', printemps: 'Au printemps', ete: 'En été' }
  const EFFET_VAC = { hausse: 'font monter le marché', baisse: 'font baisser le marché', neutre: 'sans effet net' }
  const FLECHE_VAC = { hausse: '↑', baisse: '↓', neutre: '→' }
  function blocVacances (v) {
    if (v === undefined) return ''
    const tete = '<div class="mg-bloc"><h3>Les vacances scolaires</h3><p class="mg-source">Source : modèle AirROI et calendrier officiel des vacances scolaires — les 12 mois du calendrier ci-dessus.</p>'
    const connues = v && /^\d{4}-\d{2}-\d{2}$/.test(String(v.connues_jusqu_au || ''))
      ? `<p class="mg-mention">Le calendrier officiel des vacances n’est publié que jusqu’au ${jourFr(v.connues_jusqu_au)} : les vacances suivantes n’entrent pas encore dans ce bilan.</p>` : ''
    if (!v || v.statut !== 'calcule' || !Array.isArray(v.periodes)) return `${tete}<p class="non-calc">Non calculable : ${ech((v && v.motif) || 'vacances absentes')}.</p>${connues}</div>`
    // Une meme periode deux fois dans la fenetre se distingue par son annee scolaire.
    const doublons = new Set(v.periodes.map(p => p.cle).filter((c, i, t) => t.indexOf(c) !== i))
    const de = p => `${DE_PERIODE[p.cle] || `de ${ech(p.nom)}`}${doublons.has(p.cle) ? ` ${ech(p.annee_scolaire)}` : ''}`
    const en = p => `${EN_PERIODE[p.cle] || `En ${ech(p.nom)}`}${doublons.has(p.cle) ? ` ${ech(p.annee_scolaire)}` : ''}`
    const calc = v.periodes.filter(p => p.statut === 'calcule' && FLECHE_VAC[p.sens])
    const hausses = calc.filter(p => p.sens === 'hausse').map(de)
    const baisses = calc.filter(p => p.sens === 'baisse').map(de)
    const phrases = []
    if (hausses.length) phrases.push(`Les vacances ${enListe(hausses)} portent le marché${baisses.length ? ` ; celles ${enListe(baisses)} le font baisser` : ''}.`)
    else if (baisses.length) phrases.push(`Aucune période de vacances mesurée ne porte nettement le marché ; celles ${enListe(baisses)} le font baisser.`)
    else if (calc.length) phrases.push('Les périodes de vacances mesurées n’ont pas d’effet net sur le marché.')
    // Les zones ne se departagent que dans une periode qui PORTE le marche.
    const parZone = calc.filter(p => p.sens === 'hausse' && Array.isArray(p.zones)).map(p => {
      const pp = Array.isArray(p.plus_porteuses) ? p.plus_porteuses : null
      const nb = Number(p.zones_mesurees) || 0
      if (!pp || nb < 2) return `${en(p)}, les zones ne se départagent pas (trop peu de zones mesurées)`
      if (!pp.length) return `${en(p)}, ${nb === 3 ? 'les trois zones se valent' : 'les zones mesurées se valent'}`
      return `${en(p)}, ${pp.length > 1 ? `les zones ${enListe(pp.map(ech))} sont les plus porteuses` : `la zone ${ech(pp[0])} est la plus porteuse`}`
    })
    // Apres un point-virgule, la suite reprend en minuscule (« ; au printemps »).
    if (parZone.length) phrases.push(`${parZone.map((x, i) => (i ? x.charAt(0).toLowerCase() + x.slice(1) : x)).join(' ; ')}.`)
    const lignes = v.periodes.map(p => {
      const nom = `Vacances ${de(p)}`
      if (p.statut === 'debut_seulement') return `<b aria-hidden="true">·</b><span>${nom} : <span class="non-calc">non mesurables, seule leur date de début est publiée</span></span>`
      if (p.statut === 'hors_fenetre') return `<b aria-hidden="true">·</b><span>${nom} : <span class="non-calc">en grande partie hors des 12 mois, non conclues</span></span>`
      if (p.statut !== 'calcule' || !FLECHE_VAC[p.sens]) return `<b aria-hidden="true">·</b><span>${nom} : <span class="non-calc">non calculable${p.motif ? ` (${ech(p.motif)})` : ''}</span></span>`
      const zones = Array.isArray(p.zones)
        ? `<br><small class="mg-zones">${p.zones.map(z => `zone ${ech(z.zone)} ${FLECHE_VAC[z.sens] || '(non mesurée)'}`).join(' · ')}</small>` : ''
      const partielle = p.partielle ? ' <span class="non-calc">(en partie seulement dans les 12 mois)</span>' : ''
      return `<b aria-hidden="true">${FLECHE_VAC[p.sens]}</b><span>${nom} : ${EFFET_VAC[p.sens]}${partielle}${zones}</span>`
    }).join('')
    return `${tete}${phrases.length ? `<p class="mg-verdict">${phrases.join(' ')}</p>` : ''}<div class="mg-sens">${lignes}</div>`
      + '<p class="mg-mention">Chaque période est comparée aux jours hors vacances des mois où elle tombe vraiment. Peu de jours ne concernent qu’une seule zone : l’écart entre zones reste indicatif.</p>'
      + `${connues}</div>`
  }
  const NOM_AIRROI = { creux: 'Creux', modere: 'Modéré', favorable: 'Favorable', pic: 'Pic' }

  init()
</script>
</body>
</html>
