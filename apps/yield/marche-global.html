<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HôteSmart — Le marché global</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    [hidden] { display: none !important; }
    /* ⚠ PAGE EN LECTURE SEULE (spec §17 de docs/kb/chantier-nouveau-bien.md).
       Elle n'ecrit rien, ne pilote rien, n'est reliee a aucun menu (acces par
       l'adresse directe). PIPELINES ETANCHES : l'historique (sections 1 a 3) et
       AirROI (section 4) s'affichent cote a cote, sans jamais se croiser. */
    :root {
      /* Les trois annees : N-2 la plus pale, N la plus soutenue. */
      --mg-n2: #9DB9E3; --mg-n1: #5B87C9; --mg-n: #1E3F73;
      --mg-barre: #9DB9E3; --mg-barre-partielle: #C9CED6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --mg-n2: #4a5f80; --mg-n1: #7fa3dc; --mg-n: #c7dbff;
        --mg-barre: #5b7fb5; --mg-barre-partielle: #555b66;
      }
    }
    :root[data-theme="dark"] {
      --mg-n2: #4a5f80; --mg-n1: #7fa3dc; --mg-n: #c7dbff;
      --mg-barre: #5b7fb5; --mg-barre-partielle: #555b66;
    }
    .mg-avertir { background: var(--amber-bg); border: 0.5px solid var(--amber); border-radius: var(--radius);
                  padding: 12px 14px; margin-bottom: 16px; font-size: 13.5px; line-height: 1.5; }
    .mg-meta { font-size: 12.5px; color: var(--text2); margin: 6px 0 16px; }
    .mg-carte { border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px;
                margin-bottom: 16px; background: var(--bg); }
    .mg-carte h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    .mg-carte .sous { font-size: 12.5px; color: var(--text2); margin: 0 0 10px; line-height: 1.45; }
    .mg-mention { font-size: 12px; color: var(--text2); margin: 6px 0 0; }
    .mg-legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text2); margin: 8px 0 2px; }
    .mg-legende i { display: inline-block; width: 22px; height: 0; vertical-align: 3px; margin-right: 6px; }
    .non-calc { color: var(--text2); font-style: italic; }
    svg.mg { width: 100%; height: auto; display: block; }
    svg.mg text { font-size: 11px; fill: var(--text2); font-family: inherit; }
    svg.mg .axe { stroke: var(--border2); stroke-width: 1; }
    svg.mg .grille { stroke: var(--border); stroke-width: 1; }
    svg.mg .repere-mois { stroke: var(--border); stroke-width: 0.6; }
    svg.mg text.initiale { font-size: 10px; }
    svg.mg text.annee { font-weight: 600; fill: var(--text); }
    /* Telephone : un graphique garde une largeur lisible et DEFILE dans sa
       carte ; la page, elle, ne deborde jamais. */
    .mg-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 640px) {
      .content { padding-left: 12px; padding-right: 12px; } .mg-carte { padding: 12px; }
      .mg-defile svg.mg { min-width: 600px; }
    }
  </style>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="content">
  <div class="header"><h1>Le marché global</h1></div>

  <div class="mg-avertir">
    <b>Une estimation du marché, pas un prix.</b> Cette page montre le marché de votre commune d’après
    les annonces Airbnb. Elle ne calcule aucun prix pour votre logement, n’en pousse aucun, et
    <b>ne pilote rien</b>.
  </div>

  <div><label class="mg-meta">Logement <select id="mg-bien"></select></label></div>
  <div class="mg-meta" id="mg-meta"></div>
  <!-- Sections 1 a 3 : l'historique du marche (/api/marche-global). -->
  <div id="mg-corps"><p class="mg-meta">Lecture du marché…</p></div>
  <!-- Section 4 : le calendrier AirROI, dans SON bloc, lu par SA route. -->
  <div id="mg-airroi-zone"></div>
</div>
</div>
</div>

<script type="module">
  // ⚠ LECTURE SEULE : la liste des logements du compte, puis deux GET, chacun
  // sa source : /api/marche-global (historique) et /api/marche-temperature
  // (AirROI). Aucune ecriture, aucun appel AirROI, aucun prix AirROI.
  import { requireAuth } from '/components/auth-guard.js'
  import { renderSidebar } from '/components/sidebar.js'
  import { compteCourant, enteteCompte } from '/shared/compte-courant.js'
  import { supabase } from '/shared/supabase.js'
  import { initErrorHandler } from '/shared/error-handler.js'
  import { monterAnneeTemperature } from '/shared/temperature-calendrier.js'

  initErrorHandler()
  const el = id => document.getElementById(id)
  const ech = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']
  const moisFr = m => `${MOIS[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`
  const jourFr = iso => /^\d{4}-\d{2}-\d{2}/.test(String(iso || '')) ? `${Number(iso.slice(8, 10))}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '—'
  const euros = v => (typeof v === 'number' && Number.isFinite(v) ? `${String(Math.round(v * 10) / 10).replace('.', ',')} €` : 'non mesuré')
  const pourcent = v => (typeof v === 'number' && Number.isFinite(v) ? `${Math.round(v * 100)} %` : 'non mesuré')
  const INITIALES = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D']
  // Le graphique des biens montre les 3 dernieres annees (la donnee garde 60 mois).
  const MOIS_AFFICHES = 36
  // Le mois en cours, a l'heure de Paris : le calendrier AirROI part de lui.
  const moisDeParis = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }).slice(0, 7)

  let session = null
  let jeton = 0

  async function init () {
    session = await requireAuth()
    if (!session) return
    renderSidebar('yield-marche-global').catch(e => console.error('[marche-global] sidebar', e))
    const compte = compteCourant()
    let q = supabase.from('properties').select('id, name').order('name')
    if (compte) q = q.eq('user_id', compte)
    const { data, error } = await q
    if (error) return corps('<p class="non-calc">Impossible de lire la liste des logements.</p>')
    if (!data || !data.length) return corps('<p class="non-calc">Aucun logement accessible sur ce compte.</p>')
    el('mg-bien').innerHTML = data.map(b => `<option value="${ech(b.id)}">${ech(b.name)}</option>`).join('')
    el('mg-bien').addEventListener('change', charger)
    charger()
  }

  function corps (html) { el('mg-corps').innerHTML = html }

  function charger () {
    const j = ++jeton
    chargerHistorique(j)
    chargerAirroi(j)
  }

  // ─── L'HISTORIQUE (sections 1 a 3) ──────────────────────────────────────
  async function chargerHistorique (j) {
    corps('<p class="mg-meta">Lecture du marché…</p>'); el('mg-meta').innerHTML = ''
    let r
    try {
      r = await fetch(`/api/marche-global?property_id=${encodeURIComponent(el('mg-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
    } catch (e) { if (j === jeton) corps('<p class="non-calc">Lecture impossible : le serveur ne répond pas.</p>'); return }
    if (j !== jeton) return
    if (!r.ok) return corps(`<p class="non-calc">Lecture impossible (${r.status}).</p>`)
    let d
    try { d = await r.json() } catch (e) { if (j === jeton) corps('<p class="non-calc">Réponse illisible.</p>'); return }
    if (j !== jeton) return
    if (d.etat === 'marche_inconnu') return corps(`<p class="non-calc">Aucun marché n’est relié à ce logement : ${ech(d.motif)}.</p>`)
    if (d.etat === 'historique_absent') return corps(`<p class="non-calc">Marché ${ech(d.marche && d.marche.localite)} : ${ech(d.motif)}.</p>`)
    el('mg-meta').innerHTML = `Marché : <b>${ech(d.marche.localite)}</b> (${ech(d.marche.region)}, ${ech(d.marche.pays)}) · historique AirROI lu le ${jourFr(d.recupere_le)}`
    corps(sectionRevpar(d.progression, d.recupere_le) + sectionRemplissage(d.progression, d.recupere_le) + sectionBiens(d.revpar))
  }

  // ─── Sections 1 et 2 : N, N-1, N-2 superposees ──────────────────────────
  // ⚠ Legende RELATIVE (N, N-1, N-2), jamais une annee en dur ; l'annee
  // reelle ne sort qu'en info-bulle. N est l'annee de la LECTURE de
  // l'historique. Une annee partielle (moins de 12 mois mesures) est en
  // pointilles, et aucun total d'annee n'est calcule.
  const RANGS = [['N-2', 2, '--mg-n2', 1.8], ['N-1', 1, '--mg-n1', 2.2], ['N', 0, '--mg-n', 2.8]]

  function troisAnnees (prog, recupereLe) {
    const annees = (prog && prog.annees) || []
    const lue = /^\d{4}/.test(String(recupereLe || '')) ? Number(String(recupereLe).slice(0, 4)) : null
    const n = lue || (annees.length ? Number(annees[annees.length - 1].annee) : null)
    if (!n) return []
    return RANGS.map(([nom, ecart, couleur, epaisseur]) => ({
      nom, couleur: `var(${couleur})`, epaisseur, donnee: annees.find(a => Number(a.annee) === n - ecart) || null,
    }))
  }

  function superposees (prog, recupereLe, cle, { titre, sous, bulle, graduation, mention }) {
    const entete = `<h2>${titre}</h2><p class="sous">${sous}</p>`
    const series = troisAnnees(prog, recupereLe)
    const vals = series.flatMap(s => (s.donnee ? s.donnee.mois.map(m => m[cle]) : [])).filter(v => typeof v === 'number')
    if (!prog || prog.statut !== 'calcule' || !vals.length) {
      return `<div class="mg-carte">${entete}<p class="non-calc">Non calculable : ${ech((prog && prog.motif) || 'historique absent')}.</p></div>`
    }
    const L = 900, H = 260, G = 50, D = 12, HAUT = 12, BAS = 26
    const max = Math.max(...vals) * 1.08
    const x = k => G + (L - G - D) * k / 11
    const y = v => HAUT + (H - HAUT - BAS) * (1 - v / max)
    const grille = [0, 0.25, 0.5, 0.75, 1].map(f => `<line class="grille" x1="${G}" x2="${L - D}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${G - 6}" y="${y(max * f) + 4}" text-anchor="end">${graduation(max * f)}</text>`).join('')
    const abscisse = INITIALES.map((n, k) => `<line class="repere-mois" x1="${x(k)}" x2="${x(k)}" y1="${HAUT}" y2="${H - BAS}"/><text class="initiale" x="${x(k)}" y="${H - BAS + 15}" text-anchor="middle">${n}</text>`).join('')
    const courbes = series.filter(s => s.donnee).map(s => {
      const a = s.donnee
      const mesure = k => k >= 0 && k < 12 && typeof a.mois[k][cle] === 'number'
      let dd = ''; let dedans = false
      a.mois.forEach((m, k) => {
        if (typeof m[cle] !== 'number') { dedans = false; return }
        dd += `${dedans ? 'L' : 'M'}${x(k).toFixed(1)},${y(m[cle]).toFixed(1)} `; dedans = true
      })
      // Un mois sans voisin mesure ne trace aucun segment : il porte un point plein.
      const points = a.mois.map((m, k) => {
        if (typeof m[cle] !== 'number') return ''
        const isole = !mesure(k - 1) && !mesure(k + 1)
        return `<circle cx="${x(k).toFixed(1)}" cy="${y(m[cle]).toFixed(1)}" r="${isole ? 3.5 : 6}" fill="${isole ? s.couleur : 'transparent'}"${isole ? ' class="isole"' : ''}><title>${ech(moisFr(m.mois))} (${s.nom}) · ${bulle(m[cle])}</title></circle>`
      }).join('')
      return `<path data-rang="${s.nom}" d="${dd}" fill="none" stroke="${s.couleur}" stroke-width="${s.epaisseur}"${a.partielle ? ' stroke-dasharray="6 4"' : ''}/>${points}`
    }).join('')
    const legende = `<div class="mg-legende">${series.slice().reverse().map(s => {
      const note = !s.donnee ? ' : non mesurée' : s.donnee.partielle ? (s.nom === 'N' ? ' : année en cours, partielle' : ' : partielle') : ''
      const trait = s.donnee && s.donnee.partielle ? `border-top:${s.epaisseur}px dashed ${s.couleur}` : `border-top:${s.epaisseur}px solid ${s.couleur}`
      return `<span><i style="${trait}"></i>${s.nom}${note}</span>`
    }).join('')}</div>`
    return `<div class="mg-carte">${entete}${legende}<div class="mg-defile"><svg class="mg" viewBox="0 0 ${L} ${H}" role="img" aria-label="${titre}, années N, N-1 et N-2 superposées">
      ${abscisse}${grille}<line class="axe" x1="${G}" x2="${L - D}" y1="${H - BAS}" y2="${H - BAS}"/>${courbes}</svg></div>
      <p class="mg-mention">${mention}</p></div>`
  }

  function sectionRevpar (prog, recupereLe) {
    return superposees(prog, recupereLe, 'revpar', {
      titre: 'Le RevPAR du marché, mois par mois',
      sous: 'Revenu par nuit disponible, médiane de l’ensemble des annonces du marché, de janvier à décembre. Une courbe par année : N (l’année en cours), N-1 et N-2.',
      bulle: v => `RevPAR médian : ${euros(v)}`,
      graduation: v => `${Math.round(v)} €`,
      mention: 'RevPAR du marché, en euros par nuit disponible — <b>pas un prix pour votre logement</b>. Une année en pointillés est partielle : elle se lit mois par mois, jamais comme un total.',
    })
  }

  // ⚠ L'occupation est celle du MARCHE : cette page ne lit, ne montre et ne
  // compare aucune occupation de logement (regle 13 de Thierry).
  function sectionRemplissage (prog, recupereLe) {
    return superposees(prog, recupereLe, 'occupation', {
      titre: 'Le remplissage du marché, mois par mois',
      sous: 'Occupation médiane de l’ensemble des annonces du marché (part des nuits vendues), de janvier à décembre. Une courbe par année : N, N-1 et N-2.',
      bulle: v => `occupation médiane : ${pourcent(v)}`,
      graduation: v => `${Math.round(v * 100)} %`,
      mention: 'Occupation <b>du marché</b>, comptée sur toutes ses annonces Airbnb, y compris les peu actives : elle ne se compare pas à l’occupation d’un logement.',
    })
  }

  // ─── Section 3 : le nombre de biens sur le marche (format existant) ─────
  function sectionBiens (ind) {
    const entete = '<h2>Le nombre de biens sur le marché</h2><p class="sous">Annonces actives mesurées par AirROI, mois par mois, sur les 3 dernières années : là où la barre est basse, l’historique est mince.</p>'
    if (!ind || ind.statut !== 'calcule') {
      return `<div class="mg-carte">${entete}<p class="non-calc">Non calculable : ${ech((ind && ind.motif) || 'historique absent')}.</p></div>`
    }
    const mois = ind.mois.slice(-MOIS_AFFICHES)
    if (!mois.some(m => m.annonces)) return `<div class="mg-carte">${entete}<p class="non-calc">Non calculable : aucune annonce mesurée sur les 3 dernières années.</p></div>`
    const L = 900, G = 44, D = 12, HC = 130, BAS = 34
    const x = i => G + (L - G - D) * (mois.length === 1 ? 0.5 : i / (mois.length - 1))
    const maxA = Math.max(...mois.map(m => m.annonces || 0)) || 1
    const barres = mois.map((m, i) => {
      const h = m.annonces ? (HC - BAS - 10) * m.annonces / maxA : 0
      return m.annonces
        ? `<rect x="${(x(i) - 5).toFixed(1)}" y="${(HC - BAS - h).toFixed(1)}" width="10" height="${h.toFixed(1)}" fill="var(${m.couverture_partielle ? '--mg-barre-partielle' : '--mg-barre'})"><title>${ech(moisFr(m.mois))} : ${ech(m.annonces)} annonces actives</title></rect>`
        : `<text x="${x(i)}" y="${HC - BAS - 4}" text-anchor="middle">·</text>`
    }).join('')
    const abscisse = mois.map((m, i) => {
      const janvier = m.mois.slice(5) === '01'
      return `<text class="initiale" x="${x(i)}" y="${HC - BAS + 12}" text-anchor="middle">${INITIALES[Number(m.mois.slice(5, 7)) - 1]}</text>`
        + (janvier || i === 0 ? `<text class="annee" x="${x(i)}" y="${HC - BAS + 27}" text-anchor="middle">${ech(m.mois.slice(0, 4))}</text>` : '')
    }).join('')
    const bornes = mois.filter(m => m.annonces)
    return `<div class="mg-carte">${entete}<div class="mg-defile"><svg class="mg" viewBox="0 0 ${L} ${HC}" role="img" aria-label="Annonces actives par mois, 36 derniers mois">
      ${barres}<line class="axe" x1="${G}" x2="${L - D}" y1="${HC - BAS}" y2="${HC - BAS}"/>${abscisse}</svg></div>
      <p class="mg-mention">${ech(moisFr(bornes[0].mois))} : ${ech(bornes[0].annonces)} annonces · ${ech(moisFr(bornes[bornes.length - 1].mois))} : ${ech(bornes[bornes.length - 1].annonces)} annonces.</p></div>`
  }

  // ─── Section 4 : le calendrier AirROI, 12 mois d'un coup (§17.1) ────────
  // ⚠ PIPELINE ETANCHE : sa route, son bloc ; rien de l'historique n'y entre.
  // Le rendu est le module commun avec la page « La temperature du marche ».
  async function chargerAirroi (j) {
    el('mg-airroi-zone').innerHTML = `<div class="mg-carte"><h2>Le calendrier du marché selon AirROI, jour par jour</h2>`
      + `<p class="sous"><b>Estimation AirROI, pas un prix.</b> Le niveau de chaque jour d’après le modèle de prix d’AirROI pour votre commune, ramené à quatre niveaux. Touchez un jour pour son détail.</p>`
      + `<div id="mg-airroi"><p class="mg-meta">Lecture du modèle AirROI…</p></div>`
      + `<p class="mg-mention">Deux sources, deux calendriers. Le modèle AirROI ne tient pas compte de l’historique des ventes.</p>`
      + `<p class="mg-mention" id="mg-airroi-meta"></p></div>`
    const ici = html => { if (j === jeton) el('mg-airroi').innerHTML = html }
    let r
    try {
      r = await fetch(`/api/marche-temperature?property_id=${encodeURIComponent(el('mg-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
    } catch (e) { return ici('<p class="non-calc">Lecture impossible : le serveur ne répond pas.</p>') }
    if (j !== jeton) return
    if (!r.ok) return ici(`<p class="non-calc">Lecture impossible (${r.status}).</p>`)
    let d
    try { d = await r.json() } catch (e) { return ici('<p class="non-calc">Réponse illisible.</p>') }
    if (j !== jeton) return
    if (d.etat === 'marche_inconnu') return ici(`<p class="non-calc">Aucun marché n’est relié à ce logement : ${ech(d.motif)}.</p>`)
    if (d.etat === 'capture_absente') return ici(`<p class="non-calc">${ech(d.motif)}.</p>`)
    if (d.etat !== 'calcule' || !Array.isArray(d.jours) || !d.jours.length) return ici('<p class="non-calc">Aucun jour à afficher pour ce marché.</p>')
    el('mg-airroi-meta').innerHTML = `Modèle AirROI calculé le ${jourFr(d.capture_le)}.`
    monterAnneeTemperature(el('mg-airroi'), d.jours, { premierMois: moisDeParis(), nbMois: 12 })
  }

  init()
</script>
</body>
</html>
