    fermeture: { ligne: 'indisponible · si vous la libérez', case: 'indisponible : prix prévu si vous la libérez',
      survol: 'Cette nuit est couverte par une indisponibilité que vous avez posée. Voici le prix que YieldFlow proposerait si vous la libériez — en modifiant ou en supprimant l’indisponibilité dans le calendrier. Rien n’est envoyé.',
      detail: 'Cette nuit est couverte par une indisponibilité que vous avez posée : voici ce que YieldFlow proposerait si vous la libériez (dans l’indisponibilité elle-même). Rien n’est envoyé.' },
    fermee_inconnu: { ligne: 'fermée · prix prévu', case: 'fermée : prix prévu',
      survol: 'Cette nuit n’est pas en vente. Voici le prix que YieldFlow proposerait si elle l’était — rien n’est envoyé.',
      detail: 'Cette nuit n’est pas en vente : voici ce que YieldFlow proposerait si elle l’était. Rien n’est envoyé.' },
    non_renseignee: { ligne: 'non renseignée · si vous l’ouvrez', case: 'non renseignée : prix prévu si vous l’ouvrez',
      survol: 'Votre calendrier ne va pas jusqu’à cette nuit. Si vous l’ouvrez, voici ce que YieldFlow proposerait.',
      detail: 'Cette nuit n’est pas au calendrier : voici ce que YieldFlow proposerait si vous l’ouvriez.' }
  }

  // ─── L'APPARIEMENT N-1, EN CLAIR ──────────────────────────────────────────
  // ⚠ L'HÔTE DOIT POUVOIR VÉRIFIER CHAQUE APPARIEMENT. Sans la date exacte et
  // l'étage qui l'a choisie, la colonne « l'an dernier » est une affirmation
  // qu'on ne peut pas contredire.
  // ⚠ CE BLOC A ÉTÉ PERDU puis rétabli en réécrivant la carte des prix : c'est
  // le rendu sur données réelles qui l'a signalé, pas une relecture. Règle 14
  // du dépôt, payée une fois de plus.
  const ordinal = n => n === 1 ? '1<sup>re</sup>' : `${n}<sup>e</sup>`
  const ETAGE_NOM = {
    'a-bis': 'étage a-bis — votre propre événement',
    a: 'étage a — date fixe',
    b: 'étage b — position dans l’événement',
    c: 'étage c — rang dans le mois',
    d: 'étage d — aucun comparable'
  }
  function appariement (n1) {
    if (!n1) return ''
    const m = motif(n1.alignement)
    if (!n1.date) {
      const r = motif(n1.raison)
      return `<strong>Pas de comparable</strong> — ${ech(r ? r.quoi : (m ? m.quoi : ''))}`
    }
    const d = new Date(`${n1.date}T00:00:00Z`)
    const lisible = `${JOURS_LONGS[d.getUTCDay()]} ${d.getUTCDate()} ${MOIS[d.getUTCMonth()]} ${d.getUTCFullYear()}`
    return `Comparé au <strong>${ech(lisible)}</strong>
      ${n1.rang ? `— ${n1.rang_n1 === n1.rang ? ordinal(n1.rang) : `${ordinal(n1.rang_n1)} (et non ${ordinal(n1.rang)})`} de sa période ` : ''}
      <span class="yp-vide" title="${ech(m ? m.quoi : '')}">(${ech(ETAGE_NOM[n1.etage] || '')})</span>.
      ${n1.etage === 'b' && n1.ecart_jours
        ? `L’événement a glissé de ${Math.abs(n1.ecart_jours)} jour${Math.abs(n1.ecart_jours) > 1 ? 's' : ''} d’une année sur l’autre.` : ''}
      ${!n1.meme_segment && n1.segment
        ? `Attention : cette nuit-là était <strong>${ech(nomSegment(n1.segment))}</strong>.` : ''}`
  }

  // ⚠ UN SEGMENT DE BARRE, PAS UN `rowspan`. Une barre posée en `rowspan`
  // se décale dès qu'une ligne de détail s'intercale — et le détail s'ouvre au
  // clic. Des segments contigus, collés bord à bord, donnent la même barre
  // continue sans jamais dépendre du nombre de lignes.
  function segment (x, n1 = false) {
    if (!x) return ''
    const t = [
      `${x.nuits} nuit${x.nuits > 1 ? 's' : ''}`,
      `${frDate(x.arrivee)} → ${frDate(x.depart)}`,
      x.canal ? `canal ${x.canal}` : null,
      x.prix_total != null ? `séjour ${euros(x.prix_total)}` : null,
      !x.confirme ? `réservation non confirmée (${x.statut || '?'})` : null,
      n1 && x.vendu_a_ce_delai === true ? 'déjà vendu à ce délai l’an dernier' : null,
      n1 && x.vendu_a_ce_delai === false ? 'vendu plus tard que le délai actuel' : null,
      n1 && x.vendu_a_ce_delai == null ? 'date de vente non exploitable' : null,
      x.chevauchement ? '⚠ deux séjours se chevauchent sur cette nuit' : null
    ].filter(Boolean).join(' · ')
    return `<span class="yp-seg ${n1 ? 'n1' : ''} ${x.plein ? '' : 'grise'}
      ${x.debut ? 'debut' : ''} ${x.fin ? 'fin' : ''}
      ${x.chevauchement ? 'chevauche' : ''}" title="${ech(t)}"></span>`
  }

  const frDate = iso => {
    if (!iso) return ''
    const d = new Date(`${iso}T00:00:00Z`)
    return `${d.getUTCDate()} ${MOIS[d.getUTCMonth()].slice(0, 4)}`
  }

  function ligne (n, barA, barN1) {
    const j = new Date(`${n.date}T00:00:00Z`).getUTCDay()
    const we = j === 0 || j === 6
    const passe = n.delai_jours < 0
    const pilote = !!(donnees && donnees.bien && donnees.bien.pilote === 'yieldflow')

    // ⚠ AUCUN MOT D'ÉTAT DANS LA LIGNE. L'état est une classe, donc une
    // couleur, et la légende en tête l'explique une fois pour le mois entier.
    let etat
    if (n.vendue) etat = 'e-vendue'
    else if (passe) etat = 'e-vide'
    else if (n.ouverte === false) etat = 'e-fermee'
    // ⚠ AVANT « inconnue » : une nuit hors fenêtre porte aussi `ouverte: null`
    // (aucune ligne au calendrier), mais elle n'est pas « non renseignée » —
    // personne n'a rien oublié, c'est la fenêtre glissante du pilote.
    else if (n.hors_fenetre) etat = 'e-attente'
    else if (n.ouverte == null) etat = 'e-inconnue'
    else etat = 'e-vide'

    // ⚠ DEUX COLONNES, PAS UNE — passe 5. « Ce que je pilote » à gauche : ce
    // qui reste à décider. « Ce sur quoi je m'appuie » à droite : ce qui est
    // déjà fait, cette année comme l'an dernier. Une seule colonne mélangeait
    // une décision à prendre et un fait acquis, dans la même case.
    let prix
    if (n.vendue) {
      // ⚠ LE PRIX D'UNE NUIT VENDUE EST CELUI QU'ELLE A RAPPORTÉ, pas celui
      // qui était affiché. Sur le passé, le calendrier ne garde aucune trace :
      // la ligne montrait un tiret sur la seule nuit dont le prix est certain.
      const p = n.prix_vendu != null ? n.prix_vendu : n.prix_actuel
      prix = p != null
        ? `<span class="yp-prix" title="${ech(n.prix_vendu != null
            ? 'Part de cette nuit dans le prix payé par le voyageur (répartition uniforme sur les nuits du séjour).'
            : 'Prix affiché au calendrier pour cette nuit.')}">${euros(p)}</span>`
        : `<span class="yp-vide" title="Cette nuit est vendue, mais son prix n’est pas exploitable — souvent une réservation recréée lors d’une migration de canal.">—</span>`
    } else if (!passe && n.projection && n.suggestion != null) {
      // ⚠ UNE NUIT NON OUVERTE MONTRE LES MEMES INFORMATIONS QU'UNE NUIT
      // OUVERTE — demande de Thierry (22 septembre 2026) : le prix auquel elle
      // s'ouvrira (ou que YieldFlow proposerait), son niveau, et QUAND. La
      // ligne garde la couleur de son etat : on anticipe, on ne confond pas.
      const q = n.ouverture_prevue ? dateFr(n.ouverture_prevue) : null
      const P = TEXTES_PROJECTION[n.projection_motif] || TEXTES_PROJECTION.non_renseignee
      const quand = n.projection_motif === 'fenetre' ? `s’ouvrira${q ? ` le ${q}` : ' seule'}` : P.ligne
      prix = `<span class="yp-prix">${euros(n.suggestion)}</span>
        <span class="yp-niveau yp-niv-badge ${CLASSES[n.niveau] || ''}" title="${ech(`Niveau ${n.niveau} de votre grille.`)}">${ech(n.etiquette || n.niveau)}</span>
        ${preuveLigne(n)}
        <span class="yp-attente" title="${ech(n.projection_motif === 'fenetre'
          ? `Cette nuit est au-delà de la fenêtre de vente pilotée par YieldFlow. Ce n’est pas une fermeture : la fenêtre glisse chaque jour, et cette nuit s’ouvrira seule${q ? ` le ${q}` : ''}, à ce prix.`
          : P.survol)}">${quand}</span>`
    } else if (!passe && n.hors_fenetre) {
      // Sans projection calculable (grille non fiable) : au moins la date.
      const q = n.ouverture_prevue ? dateFr(n.ouverture_prevue) : null
      prix = `<span class="yp-attente" title="${ech(`Cette nuit est au-delà de la fenêtre de vente de ce logement, pilotée par YieldFlow. Ce n’est pas une fermeture : la fenêtre glisse chaque jour, et cette nuit s’ouvrira seule${q ? ` le ${q}` : ''}, avec son prix déjà prêt.`)}">pas encore ouverte${q ? ` · s’ouvrira le ${q}` : ''}</span>`
    } else if (n.prix_hote != null && pilote) {
      // ⚠ LA MAIN DE L'HOTE : son prix est le prix retenu, le conseil de
      // YieldFlow reste a cote, et un geste le retire (le moteur reprend la
      // nuit a son passage suivant).
      // ⚠ LE PRIX AFFICHE EST CELUI DU CALENDRIER (prix_actuel), pas la memoire de
      // la main : si les deux divergent (poussee refusee, course avec le moteur),
      // l'ecart se voit — releve en review.
      const ecart = n.prix_actuel != null && Math.round(n.prix_actuel * 100) !== Math.round(n.prix_hote * 100)
      prix = `<span class="yp-prix">${euros(n.prix_actuel != null ? n.prix_actuel : n.prix_hote)}</span><span class="yp-hote" title="Ce prix est le vôtre : YieldFlow ne le modifie pas. Il tient jusqu’à la nuit, ou jusqu’à ce que vous le retiriez.">votre prix</span>${n.ouverte === false ? '<span class="yp-attente" title="Cette nuit est fermée à la vente : votre prix sera celui retenu quand elle rouvrira.">fermée</span>' : ''}
        ${ecart ? `<span class="yp-rien" title="Vous aviez fixé ${euros(n.prix_hote)}, mais le calendrier affiche ${euros(n.prix_actuel)} : la dernière écriture n’a pas abouti. Ressaisissez votre prix, ou retirez-le.">⚠ fixé à ${euros(n.prix_hote)}</span>` : ''}
        ${n.suggestion != null ? `<span class="yp-hote-conseil" title="Ce que YieldFlow proposerait pour cette nuit.">YieldFlow : ${euros(n.suggestion)}</span>` : ''}
        <button class="yp-editer" data-editer="${n.date}" title="Modifier votre prix">✎</button>
        <button class="yp-hote-x" data-retirer="${n.date}" title="Retirer votre prix : YieldFlow reprend cette nuit à son prochain passage.">×</button>`
    } else if (n.suggestion != null) {
      const sens = n.prix_actuel == null ? ''
        : (n.suggestion > n.prix_actuel ? 'hausse' : (n.suggestion < n.prix_actuel ? 'baisse' : ''))
      prix = `${n.prix_actuel != null
        ? `<span class="yp-affiche">${euros(n.prix_actuel)}</span><span class="yp-fleche">→</span>` : ''}
        <span class="yp-prix ${sens}">${euros(n.suggestion)}</span>
        <span class="yp-niveau yp-niv-badge ${CLASSES[n.niveau] || ''} ${sens}" title="${ech(n.etiquette_corrigee
          ? `Niveau ${n.niveau} de votre grille, corrigé parce que les ${n.jour_semaine}s se vendent différemment sur ce type de période. C’est pourquoi le prix ne tombe pas exactement sur le niveau.`
          : `Niveau ${n.niveau} de votre grille.`)}">${ech(n.etiquette || n.niveau)}</span>
        ${preuveLigne(n)}
        ${n.cumul ? '<span class="yp-plus" title="Deux signaux vont dans le même sens : c’est l’écart le plus marqué du mois.">++</span>' : ''}
        ${pilote && n.ouverte === true ? `<button class="yp-editer" data-editer="${n.date}" title="Fixer vous-même le prix de cette nuit : YieldFlow ne l’écrasera pas.">✎</button>` : ''}`
    } else if (passe) {
      // Éteinte, et muette : le mois passé n'a rien à décider.
      prix = n.prix_actuel != null
        ? `<span class="yp-affiche">${euros(n.prix_actuel)}</span>` : ''
    } else {
      const m = motif(n.non_calculable[0])
      prix = `${n.prix_actuel != null ? `<span class="yp-affiche">${euros(n.prix_actuel)}</span> ` : ''}
        <span class="yp-rien" title="${ech(m ? m.quoi : '')}">${ech(m ? m.titre : '—')}</span>`
    }

    // ⚠ LE PARTAGE : ce qui est encore à décider reste à gauche, tout ce qui
    // est acquis part à droite. Une nuit vendue ou passée n'a plus rien à
    // piloter — sa case de gauche est donc vide, et ce vide est une réponse.
    const acquis = n.vendue || passe
    const pilotage = acquis ? '' : prix
    const realise = acquis ? prix : ''

    // ─── LA COLONNE N-1 : LA COULEUR DIT TOUT ──────────────────────────────
    // ⚠ PLEIN = la nuit comparable était DÉJÀ vendue à ce délai. Si la mienne
    // ne l'est pas, je suis en retard — et le liseré d'alerte s'allume ici, au
    // même endroit du regard, plutôt que dans une colonne de texte à part.
    const n1 = n.n1 || {}
    const retard = !n.vendue && n.ouverte === true && n1.vendue_a_ce_delai === true
    let reel
    if (n1.prix_vendu != null) {
      const plein = n1.vendue_a_ce_delai === true
      reel = `<span class="yp-n1 ${plein ? 'plein' : ''} ${retard ? 'alerte' : ''}"
        title="${ech(plein
          ? `Au même délai l’an dernier, la nuit comparable était DÉJÀ vendue ${euros(n1.prix_vendu)}.${retard ? ' Celle-ci ne l’est pas : vous êtes en retard sur son rythme.' : ''}`
          : `La nuit comparable s’est vendue ${euros(n1.prix_vendu)}, mais plus tard que le délai où nous sommes. Rien à en conclure.`)}">${euros(n1.prix_vendu)}</span>`
    } else if (!n1.date) {
      const r = motif(n1.raison) || motif('pas_de_comparable')
      reel = `<span class="yp-rien" title="${ech(r ? r.quoi : '')}">—</span>`
    } else {
      reel = `<span class="yp-vide" title="La nuit comparable retenue n’a pas été vendue l’an dernier.">—</span>`
    }

    // ⚠ LA COULEUR DU NIVEAU EST UNE BULLE SUR LE BADGE, PAS LA LIGNE — second
    // retour de Thierry (22 septembre 2026) : « toute la ligne colorée n'est
    // pas agréable ». La teinte vit sur le mot du niveau (la meme pastille que
    // la grille en tete de page) ; la ligne garde la couleur de son ETAT.
    return `<tr class="${we ? 'we' : ''} ${etat} ${n.prix_hote != null ? 'prix-hote' : ''} ${passe ? 'passe' : ''} cliquable"
      data-jour="${n.date}" aria-expanded="false" tabindex="0" role="button">
      <td class="yp-jour ${we ? 'we' : ''}">${Number(n.date.slice(8))}<small>${JOURS[j]}</small>
        ${n.segment === 'pont'
          ? `<span class="yp-pont" title="${ech(`Jour de pont${n.libelle ? ` — ${n.libelle}` : ''} : coincé entre un jour férié et un week-end. Ces nuits-là se vendent au tarif des jours fériés.`)}">pont</span>`
          : ''}</td>
      <td class="sep-g">${pilotage}</td>
      <td class="sep-g yp-realise">${realise}</td>
      <td>${reel}</td>
      <td class="yp-bar">${segment(barA)}</td>
      <td class="yp-bar">${segment(barN1, true)}</td>
    </tr>
    <tr class="yp-detail-l" id="d-${n.date}" hidden>
      <td colspan="6"><div class="yp-detail">${pourquoi(n)}</div></td></tr>`
  }

  // ÉTAGE 1 (ce qui a bougé, PROPRE À CETTE NUIT) + ÉTAGE 3 (le reste, replié).
  function pourquoi (n) {
    const toutes = n.couches || []
    // ⚠ UNE NUIT SANS SUGGESTION A QUAND MEME UN DETAIL : le motif du refus, et
    // l'appariement N-1. C'est justement sur ces nuits-là que l'hôte se demande
    // pourquoi il n'a rien à décider.
    if (n.suggestion == null) {
      const m = motif((n.non_calculable || [])[0])
      return `<p class="yp-raisons">${m ? `<strong>${ech(m.titre)}</strong> — ${ech(m.quoi)}` : ''}</p>
        <div class="yp-apparie">${appariement(n.n1)}</div>`
    }
    // ⚠ NI LES COUCHES MUETTES, NI CE QUI EST DÉJÀ DIT AILLEURS.
    // `agit` écarte « inchangé » et « ×0,99 » ; `pression` est écartée parce
    // qu'elle porte sur le MOIS et vit dans le bandeau. Ce qui reste est ce qui
    // distingue cette nuit des vingt-neuf autres.
    const agit = toutes.filter(c => c.agit && c.resume && c.nom !== 'pression')
    const moisAgit = toutes.some(c => c.nom === 'pression' && c.agit)
    let dites
    if (agit.length) {
      dites = `<ul class="yp-raisons">${agit.map(c => `<li>${ech(c.resume)}</li>`).join('')}</ul>`
    } else if (moisAgit) {
      // Le mois est la seule correction : on le rappelle sans le redire.
      dites = `<p class="yp-raisons">Seule la tendance du mois déplace le prix —
        c’est votre niveau <strong>${ech(n.etiquette || n.niveau)}</strong>.</p>`
    } else {
      dites = `<p class="yp-raisons">Aucun signal ne déplace le prix : c’est votre niveau
        <strong>${ech(n.niveau)}</strong>.</p>`
    }
    // ⚠ PLUS D'ÉTENDUE NI DE MIN-MAX ICI — demande de Thierry.
    // L'étendue de la grille est en tête du groupe, une fois. Et le min-max des
    // prix observés n'y revient pas : « de 35 € à 206 € » fait peur pour rien,
    // un extrême unique n'étant pas une borne de décision mais un accident.
    // La projection se dit aussi ici (relecture) : « mêmes informations », mais
    // l'hôte sait qu'il lit une nuit qui n'est pas encore en vente.
    const proj = n.projection && n.ouverte !== true
      ? `<p class="yp-raisons"><em>${(TEXTES_PROJECTION[n.projection_motif] || TEXTES_PROJECTION.non_renseignee).detail}</em></p>`
      : ''
    return `${proj}${dites}
      <div class="yp-apparie">${appariement(n.n1)}</div>
      <details class="yp-audit"><summary>Tout le calcul</summary>
        <ol>${toutes.map(c => `<li><strong>${ech(nomCouche(c.nom))}</strong> — ${ech(c.detail)}</li>`).join('')}</ol>
      </details>`
  }

  const NOMS_COUCHE = {
    socle: 'Point de départ', pression: 'Portefeuille du mois', delai: 'Délai',
    jour_de_semaine: 'Jour de la semaine', cumul: 'Signaux cumulés',
    neutralisation: 'Sans effet', position: 'Position', anomalie: 'À vérifier',
    fourchette: 'Fourchette Exceptionnel', releve_n1: 'Prix de l’an dernier'
  }
  const nomCouche = c => NOMS_COUCHE[c] || c

  // ÉTAGE 1 — les totaux du mois, comme un pied de tableau.
  function pied (d) {
    const p = d.pied || {}
    const ad = p.a_date, n1 = p.a_date_n1
    const proj = p.projection || {}
    const cmp = p.vs_n1 && p.vs_n1.ca ? p.vs_n1.ca : null
    const rp = p.vs_n1 && p.vs_n1.revpar ? p.vs_n1.revpar : null
    const ligne = (l, v, comp) => `<tr><th>${l}</th><td>${v}</td><td>${comp}</td></tr>`
    // ⚠ LE `title` DU DRAPEAU PASSE PAR `ligne`, DONC SANS ECHAPPEMENT ICI :
    // les libelles de ce pied sont ecrits dans ce fichier, jamais recus.
    const ecart = c => {
      if (!c) return '<span class="yp-vide">—</span>'
      if (c.non_calculable) {
        const m = motif(c.non_calculable)
        return `<span class="yp-rien" title="${ech(m ? m.quoi : '')}">${ech(m ? m.titre : '—')}</span>`
      }
      if (c.variation == null) return `<span class="yp-vide">${euros(c.n1)}</span>`
      const v = Math.round(c.variation * 100)
      return `<span class="${v >= 0 ? 'hausse' : 'baisse'}">${v >= 0 ? '+' : ''}${v} %</span>
        <small>contre ${euros(c.n1)}</small>`
    }
    const fourchette = proj.nuitees_min != null && proj.nuitees_max != null
      ? `entre <strong>${Math.round(proj.nuitees_min)}</strong> et
         <strong>${Math.round(proj.nuitees_max)}</strong> nuitées`
      : (proj.non_calculable && proj.non_calculable.length
        ? `<span class="yp-rien" title="${ech((motif(proj.non_calculable[0]) || {}).quoi || '')}">${ech((motif(proj.non_calculable[0]) || {}).titre || '—')}</span>`
        : '<span class="yp-vide">—</span>')
    return `<div class="yp-pied">
      <h3>Total du mois</h3>
      <table class="yp-totaux">
        <thead><tr><th></th><th>À ce jour</th><th>Au même moment l’an dernier</th></tr></thead>
        <tbody>
          ${ligne('Chiffre d’affaires vendu', ad ? euros(ad.ca) : '—', ecart(cmp))}
          ${ligne(`RevPAR${rp && rp.estimee
            ? ' <span class="yp-indic" title="La mémoire du calendrier ne remonte pas jusqu’à cette période : les nuits ouvertes sont estimées par convention (un jour passé sans mémoire est réputé ouvert, sauf exception déclarée). Le RevPAR l’est donc aussi.">capacité estimée</span>'
            : ''}`,
            ad && ad.revpar != null ? euros(ad.revpar)
              : '<span class="yp-rien" title="Le RevPAR divise le chiffre d’affaires par les nuits ouvertes : sans savoir combien l’étaient, il n’existe pas. Ce n’est pas zéro.">—</span>',
            ecart(rp))}
          ${ligne('Nuitées vendues', ad ? ad.nuitees : '—',
            n1 ? `<span class="yp-vide">${n1.nuitees}</span>` : '<span class="yp-vide">—</span>')}
          ${ligne('Nuits ouvertes', p.jours_ouverts != null ? p.jours_ouverts
            : `<span class="yp-rien" title="${ech((motif(p.capacite_non_calculable) || {}).quoi || '')}">${ech((motif(p.capacite_non_calculable) || {}).titre || '—')}</span>`, '')}
          ${ligne('À terminaison', fourchette, '')}
        </tbody>
      </table>
      <p class="yp-note">La comparaison porte sur le <strong>même délai</strong> l’an dernier
      — ${p.delai_jours != null && p.delai_jours > 0 ? `${p.delai_jours} jour(s) avant le début du mois` : 'mois en cours'} —
      et non sur le mois entier : comparer ce qui est vendu aujourd’hui à un mois déjà terminé
      donnerait toujours une chute.</p>
    </div>`
  }

  // ─── LA GRILLE DU MARCHE (lot V2.5) — REPLIEE, A TITRE D'INFORMATION ─────
  // ⚠ LUE A L'OUVERTURE DU BLOC SEULEMENT (une requete de plus pour qui la
  // demande), jamais un appel AirROI : l'endpoint lit le dernier releve.
  // ⚠ REGLE 19 : tant que le critere de l'interrupteur n'est pas grave,
  // l'endpoint ne rend ni ecart ni niveau — le bloc le dit.
  function blocMarche () {
    return `<details class="yp-marche" id="yp-marche"><summary>Grille du marché — à titre d’information, n’agit pas sur vos prix</summary>
      <div id="yp-marche-corps"><p class="dit">Lecture…</p></div></details>`
  }
  async function chargerMarche () {
    const corps = el('yp-marche-corps'); if (!corps) return
    let d
    try {
      const r = await fetch(`/api/yield-marche?property_id=${encodeURIComponent(el('yp-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
      d = await r.json()
      if (!r.ok) throw new Error(d && d.error)
    } catch (e) { corps.innerHTML = '<p class="dit">Lecture impossible pour le moment.</p>'; return }
    corps.innerHTML = rendreMarche(d)
  }
  const STATUT_MARCHE = {
    fiable: 'fiable', reference_amincie: 'référence amincie',
    attente_dette_26: 'en attente : votre historique contient du ménage facturé (dette 26)'
  }
  function rendreMarche (d) {
    const source = '<p class="dit">Source : <b>marché</b> — des annonces Airbnb comparables à la vôtre, pas vos ventes.</p>'
    if (d.etat !== 'releve') return `${source}<p class="dit">Aucun relevé du marché pour ce logement.</p>`
    const tete = `<p class="dit">Relevé du ${ech(dateFr(String(d.releve_le).slice(0, 10)))} · ${ech(STATUT_MARCHE[d.statut] || d.statut)} · ${d.nb_comparables} comparable(s) · données du marché du ${ech(dateFr(String(d.fraicheur_marche || '').slice(0, 10)) || '—')}.</p>`
    if (!d.lisible) {
      return `${source}${tete}<p class="dit">Les grilles ne s’affichent pas encore : le critère qui dira un jour si la grille du marché peut guider un prix doit être fixé <b>avant</b> la première lecture.</p>`
    }
    const niv = d.niveaux_marche || []
    const ecarts = new Map((d.ecarts || []).map(e => [e.nom, e]))
    const lignes = niv.map((n, i) => {
      const m12 = d.niveaux_mesure_12m ? d.niveaux_mesure_12m[i] : null
      const m3 = d.niveaux_mesure_3ans ? d.niveaux_mesure_3ans[i] : null
      const e = ecarts.get(n.nom)
      return `<tr><td>${ech(n.nom)}</td><td>${m3 ? euros(m3.prix) : '—'}</td><td>${m12 ? euros(m12.prix) : '—'}</td><td>${euros(n.prix)}</td><td>${e ? `${e.ecart_eur >= 0 ? '+' : ''}${e.ecart_eur} € (${e.ecart_pct >= 0 ? '+' : ''}${String(e.ecart_pct).replace('.', ',')} %)` : '—'}</td></tr>`
    }).join('')
    const av = (d.avertissements || []).map(a => `<li class="avert">${ech(a.phrase)}</li>`).join('')
    return `${source}${tete}
      ${niv.length ? `<table><thead><tr><th>Niveau</th><th>Vos ventes, 3 ans</th><th>Vos ventes, 12 mois</th><th>Marché, 12 mois</th><th>Écart (marché − 12 mois)</th></tr></thead><tbody>${lignes}</tbody></table>` : ''}
      ${av ? `<ul class="dit">${av}</ul>` : ''}
      <p class="dit">Tarif par nuit, hors frais de ménage. Nuits Airbnb seulement : le marché ne voit ni Booking ni le direct.</p>`
  }

  function brancher () {
    const m = el('yp-marche')
    if (m) m.addEventListener('toggle', () => { if (m.open) chargerMarche() }, { once: true })
    // ⚠ LE CLIC OUVRE LE MOIS, sans second aller-retour pour la bande : la
    // reponse suivante la reconstruit avec le meme appel.
    for (const b of document.querySelectorAll('.yp-rm')) {
      b.addEventListener('click', () => { mois = b.dataset.mois; charger() })
    }
    // ⚠ UNE SEULE OUVERTE A LA FOIS. Trente détails dépliés redonneraient
    // exactement la page que cette passe supprime.
    const basculer = (tr) => {
      const d = el(`d-${tr.dataset.jour}`)
      if (!d) return
      const ouvrir = d.hidden
      for (const autre of document.querySelectorAll('.yp-detail-l')) autre.hidden = true
      for (const autre of document.querySelectorAll('tr.cliquable')) {
        autre.setAttribute('aria-expanded', 'false')
        autre.classList.remove('ouverte-d')
      }
      d.hidden = !ouvrir
      tr.setAttribute('aria-expanded', ouvrir ? 'true' : 'false')
      tr.classList.toggle('ouverte-d', ouvrir)
    }
    // La main de l'hote : editer / retirer, sans deplier la ligne.
    for (const b of document.querySelectorAll('[data-editer]')) {
      b.addEventListener('click', e => { e.stopPropagation(); editerPrix(b.dataset.editer, b) })
    }
    for (const b of document.querySelectorAll('[data-retirer]')) {
      b.addEventListener('click', e => { e.stopPropagation(); retirerPrix(b.dataset.retirer) })
    }
    for (const tr of document.querySelectorAll('tr.cliquable')) {
      tr.addEventListener('click', () => basculer(tr))
      tr.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); basculer(tr) }
      })
    }
  }

  // ─── LA MAIN DE L'HOTE (arbitrage A bis) ──────────────────────────────────
  // La saisie remplace le prix sur la ligne, le conseil YieldFlow reste a cote.
  // Elle part par la porte du calendrier avec `prix_hote: true` : memorisee
  // dans `prix_hote`, ecrite origine 'host', jamais ecrasee par le moteur.
  function editerPrix (date, bouton) {
    const n = (donnees && donnees.nuits || []).find(x => x.date === date); if (!n) return
    const cellule = bouton.closest('td'); if (!cellule) return
    const conseil = n.suggestion != null ? euros(n.suggestion) : null
    const initial = n.prix_hote != null ? n.prix_hote : (n.suggestion != null ? n.suggestion : (n.prix_actuel || ''))
    cellule.innerHTML = `<input class="yp-saisie" type="number" min="1" step="1" value="${ech(initial)}" aria-label="Votre prix pour le ${dateFr(date)}"> €
      ${conseil ? `<span class="yp-hote-conseil">YieldFlow : ${conseil}</span>` : ''}
      <button class="yp-editer" data-valider="1">OK</button><button class="yp-editer" data-annuler="1">annuler</button>`
    const input = cellule.querySelector('input')
    input.focus(); input.select()
    cellule.addEventListener('click', e => e.stopPropagation())
    const annuler = () => charger()
    const valider = async () => {
      const v = Number(input.value)
      if (!(v > 0)) { input.focus(); return }
      cellule.innerHTML = '<span class="yp-attente">Enregistrement…</span>'
      try {
        const bien = el('yp-bien').value
        await apiClient.calendar.save(bien, [{ date_from: date, date_to: date, rate: v }], { prix_hote: true })
      } catch (e) {
        cellule.innerHTML = `<span class="yp-rien">${ech(e.message || 'Refusé.')}</span>`
        return
      }
      charger()
    }
    cellule.querySelector('[data-valider]').addEventListener('click', valider)
    cellule.querySelector('[data-annuler]').addEventListener('click', annuler)
    input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); valider() } else if (e.key === 'Escape') annuler() })
  }
  async function retirerPrix (date) {
    if (!window.confirm(`Retirer votre prix du ${dateFr(date)} ? YieldFlow reprendra cette nuit à son prochain passage.`)) return
    try { await apiClient.calendar.retirerPrixHote(el('yp-bien').value, [date]) }
    catch (e) { window.alert(e.message || 'Refusé.'); return }
    charger()
  }

  // ─── LA POP-UP DES ÉVÉNEMENTS ─────────────────────────────────────────────
  // Un calendrier en tableau du mois affiche : la teinte des cases est le
  // NIVEAU de la nuit (les memes cinq teintes que les lignes), les evenements
  // sont des CONTOURS unifies, « Ajouter un evenement » declare le votre.
  const EV_COULEUR = { officiel: '#2A5E86', calendrier: '#7A3E9A', declare: '#1F6F45' }
  const EV_NOM = { officiel: 'officiel', calendrier: 'date commerciale', declare: 'déclaré' }
  const RECURRENCE_NOM = { unique: 'une seule fois', annuelle: 'chaque année, mêmes dates', annuelle_mobile: 'chaque année, dates à confirmer' }
  const apiEv = async (methode, corps = null, params = {}) => {
    const q = new URLSearchParams({ property_id: el('yp-bien').value, ...params })
    const r = await fetch(`/api/yield-evenements?${q}`, {
      method: methode,
      headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte(), ...(corps ? { 'Content-Type': 'application/json' } : {}) },
      ...(corps ? { body: JSON.stringify({ property_id: el('yp-bien').value, ...corps }) } : {})
    })
    return { ok: r.ok, data: await r.json() }
  }
  // ⚠ LES EVENEMENTS DU MOIS AFFICHE — releve en review : sans debut/fin,
  // l'endpoint sert [aujourd'hui, +12 mois], donc ni le passe du mois courant
  // ni les mois hors de cette fenetre. On lit la fenetre de la grille.
  let evenementsMois = null
  async function lireEvenements () {
    const [a, m] = mois.split('-').map(Number)
    const fin = `${mois}-${String(new Date(Date.UTC(a, m, 0)).getUTCDate()).padStart(2, '0')}`
    const r = await apiEv('GET', null, { debut: `${mois}-01`, fin })
    if (!r.ok) throw new Error(refus(r.data && r.data.error) || 'Lecture impossible.')
    evenements = r.data; evenementsMois = mois
  }
  async function ouvrirPopup () {
    popupOuverte = true
    el('yp-ov-ev').classList.add('visible')
    el('yp-pop-ev').innerHTML = '<p class="yp-attente">Lecture des événements…</p>'
    try { await lireEvenements() } catch (e) { el('yp-pop-ev').innerHTML = `<p class="yp-rien">${ech(e.message)}</p>`; return }
    rendrePopup()
  }
  function fermerPopup () { popupOuverte = false; el('yp-ov-ev').classList.remove('visible') }
  async function rendrePopup (message = '') {
    if (!popupOuverte || !donnees) return
    if (evenementsMois !== mois) { try { await lireEvenements() } catch (e) { el('yp-pop-ev').innerHTML = `<p class="yp-rien">${ech(e.message)}</p>`; return } }
    const d = donnees, ev = evenements || {}
    const [a, m] = mois.split('-').map(Number)
    const premier = new Date(Date.UTC(a, m - 1, 1)), nbJours = new Date(Date.UTC(a, m, 0)).getUTCDate()
    const decalage = (premier.getUTCDay() + 6) % 7   // lundi = 0
    const debutMois = `${mois}-01`, finMois = `${mois}-${String(nbJours).padStart(2, '0')}`
    const parDate = new Map((d.nuits || []).map(n => [n.date, n]))
    // Les evenements qui touchent le mois, dans l'ordre du calendrier ; la
    // semaine et le week-end n'y sont pas : ce sont des couches, pas des periodes.
    const entrees = (ev.calendrier || []).filter(e => e.debut <= finMois && e.fin >= debutMois)
    // ⚠ PLUSIEURS EVENEMENTS PAR JOUR (releve en review : un Salon dans les
    // vacances de Toussaint ecrasait la Toussaint). Chaque jour porte la liste
    // de ses evenements ; le CONTOUR est celui du plus long (le cadre), et une
    // barre par evenement, au bas de la case, montre les autres.
    const parJour = new Map()
    entrees.forEach((e, i) => {
      for (let j = e.debut < debutMois ? debutMois : e.debut; j <= (e.fin > finMois ? finMois : e.fin); j = decalerJour(j, 1)) {
        if (!parJour.has(j)) parJour.set(j, [])
        parJour.get(j).push(i)
      }
    })
    const duree = e => Math.round((Date.parse(e.fin) - Date.parse(e.debut)) / 86400000)
    let cases = ''
    for (let k = 0; k < decalage; k++) cases += '<td class="vide"></td>'
    for (let jour = 1; jour <= nbJours; jour++) {
      const iso = `${mois}-${String(jour).padStart(2, '0')}`
      const n = parDate.get(iso)
      const niveau = n && n.suggestion != null && (n.ouverte === true || n.projection) && !n.vendue ? (CLASSES[n.niveau] || '') : ''
      const ids = parJour.get(iso) || []
      const cadre = ids.length ? entrees[ids.slice().sort((x, y) => duree(entrees[y]) - duree(entrees[x]))[0]] : null
      const e = cadre
      const premierDuEv = e && (iso === e.debut || iso === debutMois)
      const dernierDuEv = e && (iso === e.fin || iso === finMois)
      // ⚠ UNE NUIT PROJETEE MONTRE SON PRIX PREVU, avec « ~ », meme si elle
      // garde un prix au calendrier (une nuit fermee le garde souvent) —
      // review : la case montrait l'ancien prix teinte du niveau prevu.
      const projete = !!(n && n.projection && n.suggestion != null)
      const prix = n ? (projete ? n.suggestion : (n.prix_actuel != null ? n.prix_actuel : n.suggestion)) : null
      const barres = ids.map(k => { const x = entrees[k]; return `<i class="ev-barre ${iso === x.debut ? 'g' : ''} ${iso === x.fin ? 'd' : ''}" style="background:${EV_COULEUR[x.origine] || '#555'}" title="${ech(x.nom)}"></i>` }).join('')
      cases += `<td class="${niveau} ${e ? 'ev' : ''} ${premierDuEv ? 'ev-g' : ''} ${dernierDuEv ? 'ev-d' : ''}" ${e ? `style="--ev:${EV_COULEUR[e.origine] || '#555'}"` : ''} title="${ech([dateFr(iso), n && n.etiquette ? `niveau ${n.etiquette}` : '', n && (n.prime_exceptionnel || n.releve_n1) ? (n.prime_exceptionnel || n.releve_n1).resume : '', projete ? (TEXTES_PROJECTION[n.projection_motif] || TEXTES_PROJECTION.fenetre).case : '', ...ids.map(k => entrees[k].nom)].filter(Boolean).join(' · '))}">
        <span class="j">${jour}</span>
        ${prix != null ? `<span class="p">${projete ? '~' : ''}${euros(prix)}${n && n.prix_hote != null ? ' ✎' : ''}</span>` : ''}
        ${n && n.etiquette ? `<span class="n">${ech(n.etiquette)}</span>` : ''}
        ${e && (premierDuEv || (premier.getUTCDay() + 6 + jour - 1) % 7 === 0) ? `<span class="ev-nom">${ech(e.nom)}</span>` : ''}
        ${barres ? `<span class="ev-barres">${barres}</span>` : ''}
      </td>`
      if ((decalage + jour) % 7 === 0 && jour < nbJours) cases += '</tr><tr>'
    }
    const reste = (decalage + nbJours) % 7
    if (reste) for (let k = reste; k < 7; k++) cases += '<td class="vide"></td>'
    const lecture = ev.droits_ecriture === false
    const crans = v => v == null ? '—' : (v === 0 ? 'sans effet' : `${v > 0 ? '+' : ''}${v} cran${Math.abs(v) > 1 ? 's' : ''}`)
    const sv = ev.source_vacances || {}
    const horizon = sv.incertain_apres && sv.incertain_apres <= finMois
      ? `<div class="yp-ev-l" style="--ev:#B8860B"><strong>Calendrier scolaire publié jusqu’au ${dateFr(sv.incertain_apres)}.</strong><span class="o">Au-delà, les vacances ne sont pas encore connues : les nuits sont comptées ordinaires tant que le ministère n’a pas publié. Les fériés, eux, restent calculés.</span></div>`
      : ''
    const liste = entrees.map((e, i) => `<div class="yp-ev-l" style="--ev:${EV_COULEUR[e.origine] || '#555'}">
        <strong>${ech(e.nom)}</strong>
        <span>${dateFr(e.debut)}${e.fin !== e.debut ? ` → ${dateFr(e.fin)}` : ''}</span>
        <span class="o">${ech(EV_NOM[e.origine] || e.origine)}</span>
        ${e.ferie_voisin ? `<span class="o" title="Ces nuits de week-end touchent un jour férié, directement ou par un pont.">éclairé par ${ech(e.ferie_voisin)}</span>` : ''}
        ${lecture ? `<span class="o">${ech(crans(e.crans))}</span>`
          : `<select data-ev-reglage="${ech(e.cle)}" title="De combien de crans cette période pousse vos prix. Semaine et week-end montent du même cran.">
              <option value="">${ech(e.crans_mesures != null ? `laisser mesurer (${crans(e.crans_mesures)})` : 'à mesurer')}</option>
              ${Array.from({ length: (ev.crans_max || 4) * 2 + 1 }, (_, k) => k - (ev.crans_max || 4)).map(v => `<option value="${v}" ${v === e.crans_ajustes ? 'selected' : ''}>${ech(crans(v))}</option>`).join('')}
            </select>`}
        ${!lecture && e.droits && e.droits.desactivable ? `<button data-ev-actif="${ech(e.cle)}" data-vers="${e.actif === false ? '1' : '0'}">${e.actif === false ? 'réactiver' : 'couper'}</button>` : ''}
        ${!lecture && e.droits && e.droits.supprimable && e.id ? `<button data-ev-sup="${ech(e.id)}" data-nom="${ech(e.nom)}">supprimer</button>` : ''}
      </div>`).join('')
    const formulaire = lecture ? '' : `<div class="yp-ev-form" id="yp-ev-form">
        <label style="grid-column: span 2">Nom<input id="ev-nom" maxlength="${ev.limites ? ev.limites.nom_max : 80}" placeholder="Festival, salon, saison…"></label>
        <label>Du<input id="ev-debut" type="date" value="${debutMois}"></label>
        <label>Au (inclus)<input id="ev-fin" type="date" value="${debutMois}"></label>
        <label>Revient-il ?<select id="ev-rec">${(ev.recurrences || []).map(r => `<option value="${ech(r)}">${ech(RECURRENCE_NOM[r] || r)}</option>`).join('')}</select></label>
        <label>Se comporte comme<select id="ev-parent"><option value="">— à déterminer —</option>${(ev.parents || []).map(p => `<option value="${ech(p)}">${ech(p)}</option>`).join('')}</select></label>
        <button id="ev-ajouter">Ajouter un événement</button>
        ${message ? `<div class="yp-ev-msg ${message.startsWith('✓') ? 'ok' : 'ko'}">${ech(message)}</div>` : ''}
      </div>`
    // ⚠ LES RECONDUCTIONS RESTENT (elles vivaient sur l'ancienne page) : un
    // evenement recurrent dont l'edition approche est PROPOSE, jamais
    // enregistre sans confirmation, dates corrigeables.
    const reconductions = (ev.reconductions || []).map((r, i) => r.debut
      ? `<div class="yp-ev-l" style="--ev:#2A5E86"><strong>${ech(r.nom)}</strong><span class="o">à reconduire — l’an dernier du ${dateFr(r.depuis.debut)} au ${dateFr(r.depuis.fin)}</span>
          <input type="date" id="rd-${i}" value="${ech(r.debut)}" aria-label="Début proposé"><input type="date" id="rf-${i}" value="${ech(r.fin)}" aria-label="Fin proposée">
          <button data-reconduire="${i}">Confirmer</button></div>`
      : `<div class="yp-ev-l" style="--ev:#B8860B"><strong>${ech(r.nom)}</strong><span class="o">à reconduire — ${r.non_calculable === 'date_absente_l_annee_suivante' ? 'cette date n’existe pas l’an prochain' : 'cette position n’existe pas l’an prochain'} : saisissez les dates ci-dessous.</span></div>`).join('')
    el('yp-pop-ev').innerHTML = `<div class="yp-pop-tete">
        <h2>Événements — ${ech(nomMois(mois))}</h2>
        <div class="yp-nav"><button id="ev-prec" aria-label="Mois précédent">‹</button><button id="ev-suiv" aria-label="Mois suivant">›</button></div>
        <button class="yp-pop-fermer" id="ev-fermer" aria-label="Fermer">×</button>
      </div>
      <table class="yp-cal"><thead><tr>${['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'].map(j => `<th>${j}</th>`).join('')}</tr></thead>
        <tbody><tr>${cases}</tr></tbody></table>
      <div class="yp-ev-liste">${horizon}${reconductions}${liste || '<div class="yp-ev-l" style="--ev:#ccc">Aucun événement ce mois-ci.</div>'}</div>
      ${formulaire}`
    el('ev-fermer').addEventListener('click', fermerPopup)
    el('ev-prec').addEventListener('click', () => { mois = decalerMois(mois, -1); charger() })
    el('ev-suiv').addEventListener('click', () => { mois = decalerMois(mois, 1); charger() })
    const aj = el('ev-ajouter'); if (aj) aj.addEventListener('click', ajouterEvenement)
    for (const b of document.querySelectorAll('[data-ev-sup]')) b.addEventListener('click', () => supprimerEvenement(b.dataset.evSup, b.dataset.nom))
    for (const b of document.querySelectorAll('[data-reconduire]')) b.addEventListener('click', () => reconduireEvenement(Number(b.dataset.reconduire)))
    for (const sel of document.querySelectorAll('[data-ev-reglage]')) sel.addEventListener('change', () => reglerEvenement(sel.dataset.evReglage, { crans: sel.value === '' ? null : Number(sel.value) }))
    for (const b of document.querySelectorAll('[data-ev-actif]')) b.addEventListener('click', () => reglerEvenement(b.dataset.evActif, { actif: b.dataset.vers === '1' }))
  }
  function decalerJour (iso, n) { const d = new Date(`${iso}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10) }
  async function rechargerEvenements (message) {
    try { const r = await apiEv('GET'); if (r.ok) evenements = r.data } catch (e) {}
    await charger()
    rendrePopup(message)
  }
  async function ajouterEvenement () {
    const corps = { nom: el('ev-nom').value.trim(), debut: el('ev-debut').value, fin: el('ev-fin').value, recurrence: el('ev-rec').value, parent_segment: el('ev-parent').value || null }
    if (!corps.nom || !corps.debut || !corps.fin) return rendrePopup('Il manque le nom ou les dates.')
    let r
    try { r = await apiEv('POST', corps) } catch (e) { return rendrePopup(`Échec : ${e.message}`) }
    if (!r.ok) return rendrePopup(refus(r.data && r.data.error) || (r.data && (r.data.detail || r.data.error)) || 'Refusé.')
    rechargerEvenements(`✓ « ${corps.nom} » ajouté.`)
  }
  async function reconduireEvenement (i) {
    const r = evenements && evenements.reconductions ? evenements.reconductions[i] : null
    if (!r) return
    const corps = { nom: r.nom, debut: el(`rd-${i}`).value, fin: el(`rf-${i}`).value, recurrence: r.recurrence, parent_segment: r.parent_segment, reconduit_de: r.depuis.id }
    let x
    try { x = await apiEv('POST', corps) } catch (e) { return rendrePopup(`Échec : ${e.message}`) }
    if (!x.ok) return rendrePopup(refus(x.data && x.data.error) || (x.data && (x.data.detail || x.data.error)) || 'Refusé.')
    rechargerEvenements(`✓ « ${r.nom} » reconduit.`)
  }
  async function supprimerEvenement (id, nom) {
    if (!window.confirm(`Supprimer « ${nom} » ?\n\nCes nuits redeviendront des nuits ordinaires pour le moteur, et les prix changeront.`)) return
    let r
    try { r = await apiEv('DELETE', null, { id }) } catch (e) { return rendrePopup(`Échec : ${e.message}`) }
    rechargerEvenements(r.ok ? `✓ « ${nom} » supprimé.` : (refus(r.data && r.data.error) || 'Refusé.'))
  }
  async function reglerEvenement (segment, champs) {
    let r
    try { r = await apiEv('PATCH', { segment, ...champs }) } catch (e) { return rendrePopup(`Échec : ${e.message}`) }
    rechargerEvenements(r.ok ? '✓ Réglage enregistré.' : (refus(r.data && r.data.error) || 'Refusé.'))
  }

  function etat (msg, erreur = false) {
    el('yp-contenu').innerHTML =
      `<div class="yp-etat-page${erreur ? ' erreur' : ''}">${ech(msg)}</div>`
  }

  init()
</script>
</body>
</html>
