<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HôteSmart — Prédiction de prix</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    [hidden] { display: none !important; }
    .yp-barre { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .yp-nav { display: flex; align-items: center; gap: 4px; }
    .yp-nav button { background: var(--bg); border: 0.5px solid var(--border);
                     border-radius: var(--radius); width: 30px; height: 30px; cursor: pointer;
                     font-size: 14px; color: var(--text2); font-family: inherit; }
    .yp-nav button:hover { background: var(--bg2); color: var(--text); }
    #yp-mois { font-size: 15px; font-weight: 600; min-width: 132px; text-align: center;
               text-transform: capitalize; }
    /* LE CA DANS LE BANDEAU — demande de Thierry (22 septembre 2026) : le
       chiffre d'affaires du mois affiche, et celui de l'an dernier au meme
       delai s'il existe. Ce sont les nombres du pied de mois, sans requete de
       plus : le bandeau les lit dans la meme reponse. */
    #yp-ca { font-size: 12.5px; color: var(--text2); display: inline-flex; gap: 10px;
             align-items: baseline; white-space: nowrap; }
    #yp-ca b { color: var(--text); font-weight: 600; font-size: 13.5px; }
    #yp-ca .n1 { color: var(--text2); }
    #yp-ca .n1.hausse b { color: #1B7F3B; }
    #yp-ca .n1.baisse b { color: #B23A2A; }

    /* ─── LE PILOTE TARIFAIRE : QUI ECRIT LES PRIX DE CE LOGEMENT ─────────
       Spec §2 bis. C'est une CONFIG D'APP : elle vit ici, pas dans /settings.
       Test qui tranche : ce reglage aurait-il un sens si YieldFlow n'existait
       pas ? Non. */
    .yp-pilote { border: 0.5px solid var(--border); border-radius: var(--radius);
                 padding: 10px 12px; margin-bottom: 14px; background: var(--bg); }
    /* L'ETAT DU PILOTE EST UN BOUTON A COTE DU LOGEMENT : « activé » ou
       « désactivé » (demande de Thierry, 22 septembre 2026, a la place des deux
       cartes de choix). Le clic ouvre une confirmation, jamais la bascule. */
    .yp-etat { border: 0.5px solid var(--border); border-radius: 999px; padding: 5px 11px 5px 9px;
               font-size: 12.5px; font-family: inherit; cursor: pointer; background: var(--bg);
               color: var(--text2); display: inline-flex; align-items: center; gap: 6px; }
    .yp-etat::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #C9C9C9; }
    .yp-etat.on { border-color: #0F7B3E; color: #0F7B3E; background: #EAF6EE; }
    .yp-etat.on::before { background: #0F7B3E; }
    .yp-etat:hover { background: var(--bg2); }
    .yp-etat.on:hover { background: #DDF0E3; }
    .yp-etat:disabled { cursor: not-allowed; opacity: .7; }
    .yp-pilote .raison { font-size: 12px; color: #B02A37; margin: 8px 0 0; }
    .yp-pilote .avertir { font-size: 13px; color: var(--text); margin: 0; flex-basis: 100%; }
    .yp-pilote .avertir b { color: #B02A37; }
    .yp-pilote .dit { font-size: 12px; color: var(--text3); margin: 8px 0 0; }
    /* LA FENETRE D'OUVERTURE (lot 4.6.3) : jusqu'ou YieldFlow ouvre les dates. */
    .yp-fenetre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px;
                  padding: 8px 10px; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 12.5px; }
    .yp-fenetre input[type="number"] { width: 64px; padding: 5px 6px; border: 0.5px solid var(--border); border-radius: 6px; font-size: 12.5px; }
    .yp-fenetre select { padding: 5px 6px; border: 0.5px solid var(--border); border-radius: 6px; font-size: 12.5px; background: var(--bg); }
    .yp-fenetre button { padding: 5px 10px; border: none; border-radius: 6px; background: var(--text2, #1d1d1f); color: #fff; font-size: 12.5px; cursor: pointer; }
    .yp-fenetre button.secondaire { background: transparent; color: var(--text3); }
    .yp-fenetre .etat { flex-basis: 100%; color: var(--text3); font-size: 12px; }

    /* ─── LE RADAR : DOUZE MOIS EN UNE BANDE ─────────────────────────────── */
    .yp-radar { display: flex; gap: 3px; margin-bottom: 12px; overflow-x: auto;
                -webkit-overflow-scrolling: touch; padding-bottom: 3px; }
    .yp-rm { flex: 1 0 62px; background: var(--bg); border: 0.5px solid var(--border);
             border-radius: var(--radius); padding: 6px 5px 5px; cursor: pointer;
             font-family: inherit; text-align: center; color: var(--text2);
             position: relative; }
    .yp-rm:hover { background: var(--bg2); }
    .yp-rm[aria-current="true"] { border-color: var(--text2); background: var(--bg2);
                                  box-shadow: inset 0 -2px 0 var(--text2); }
    .yp-rm.passe { opacity: .62; }
    .yp-rm .m { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em;
                color: var(--text3); display: block; }
    .yp-rm .g { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums;
                display: block; margin-top: 2px; line-height: 1.15; }
    .yp-rm .a { font-size: 9.5px; color: var(--text3); display: block; margin-top: 1px;
                white-space: nowrap; }
    .yp-rm .a b { font-weight: 600; }
    /* LE CA SUR LA TUILE — demande de Thierry (22 septembre 2026) : vendu a ce
       jour, et l'an dernier au meme delai ; mois passe = mois entier contre
       mois entier. Deux lignes courtes, le survol porte l'explication. */
    .yp-rm .ca { display: block; margin-top: 4px; padding-top: 3px; font-size: 10.5px;
                 border-top: 0.5px dashed var(--border); color: var(--text);
                 font-variant-numeric: tabular-nums; white-space: nowrap; }
    .yp-rm .ca b { font-weight: 600; }
    .yp-rm .ca .n1 { display: block; font-size: 9.5px; color: var(--text3); }
    .yp-rm .ca .n1.up { color: #0F7B3E; } .yp-rm .ca .n1.dn { color: #B02A37; }
    .yp-rm .a .up { color: #0F7B3E; } .yp-rm .a .dn { color: #B02A37; }
    /* ⚠ L'ALERTE EST UN POINT, PAS UNE PHRASE : douze tuiles n'ont pas la place
       d'une explication, et le survol la porte. */
    .yp-al { position: absolute; top: 4px; right: 5px; width: 6px; height: 6px;
             border-radius: 50%; }
    .yp-al.rouge { background: #B02A37; }
    .yp-al.ambre { background: #B8860B; }
    .yp-al.gris { background: #C9C9C9; }
    /* ⚠ TROIS ÉTATS SANS ACTION, ET ILS NE SE VALENT PAS.
       « Fermé à la vente » est un manque à gagner : il porte la couleur d'une
       alerte. « Incertain » est une réserve. « — » seul veut dire « rien à
       faire », et c'est le seul qui reste neutre. */
    .yp-rm .pourquoi { font-size: 10px; display: block; margin-top: 4px;
                       line-height: 1.5; white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; }
    .yp-rm.e-retard { background: #FDECEA; border-color: #F0C2BC; }
    .yp-rm.e-retard .pourquoi { color: #96302B; font-weight: 600; }
    .yp-rm.e-retard:hover { background: #FBE1DD; }
    .yp-rm.e-ferme { background: #FBF1DA; border-color: #E6D3A8; }
    .yp-rm.e-ferme .pourquoi { color: #8A6D3B; font-weight: 600; }
    .yp-rm.e-ferme:hover { background: #F7E9C9; }
    .yp-rm.e-incertain .pourquoi { color: #8A6D3B; }
    .yp-rm.e-inconnu .pourquoi { color: var(--text3); }
    .yp-rm.e-rien .pourquoi { color: var(--text3); }

    /* ─── ÉTAGE 1 : la tendance du mois (seulement quand elle agit) ──────── */
    .yp-tete { background: var(--bg); border: 0.5px solid var(--border);
               border-radius: var(--radius-lg); padding: 10px 16px; margin-bottom: 12px; }
    .hausse { color: #0F7B3E; } .baisse { color: #B02A37; }
    .yp-note { font-size: 11px; color: var(--text2); line-height: 1.6; margin: 10px 0 0; }
    .yp-mois-dit { font-size: 12px; line-height: 1.6; margin: 0; }

    /* ─── ÉTAGE 1 : le tableau du mois ───────────────────────────────────── */
    .yp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch;
               background: var(--bg); border: 0.5px solid var(--border);
               border-radius: var(--radius-lg); margin-bottom: 14px; }
    .yp-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 560px; }
    .yp-table th { text-align: left; font-weight: 500; color: var(--text3); font-size: 9.5px;
                   text-transform: uppercase; letter-spacing: .04em; padding: 6px 10px;
                   border-bottom: 0.5px solid var(--border); white-space: nowrap; }
    .yp-table td { padding: 4px 10px; border-bottom: 0.5px solid var(--border);
                   vertical-align: middle; white-space: nowrap; }
    .yp-table tr:last-child td { border-bottom: none; }
    .yp-table tr.off td { opacity: .72; }

    /* ⚠ CINQ TEINTES GRADUEES, DU PLUS FRAIS AU PLUS CHAUD — demande de
       Thierry : « le mois se lit comme une carte thermique ». Le fond de ligne
       EST le niveau suggéré, donc l'intensité d'une nuit se voit avant d'être
       lue. La rampe va du bleu au terracotta : elle est ordonnée, ce qu'un jeu
       de couleurs non gradué ne serait pas.
       ⚠ LA COULEUR NE PORTE JAMAIS SEULE : le badge texte du niveau reste sur
       chaque ligne, et un liseré gauche double la teinte. Un hôte daltonien
       lit le badge et l'ordre des lignes, pas la nuance. */
    .n-base        { background: #E7F0F7; box-shadow: inset 3px 0 0 #4A7FA8; }
    .n-moyen       { background: #EDF4EE; box-shadow: inset 3px 0 0 #5F8F6E; }
    .n-haut        { background: #FBF4E2; box-shadow: inset 3px 0 0 #C89A2E; }
    .n-tres-haut   { background: #FAEADA; box-shadow: inset 3px 0 0 #D2762E; }
    .n-exceptionnel{ background: #F8E2DA; box-shadow: inset 3px 0 0 #BF4F32; }
    /* ⚠ LES ÉTATS S'EXPRIMENT EN COULEUR, PAS EN TEXTE — règle de Thierry,
       13 septembre 2026. « Vendue », « Fermée », « Non renseignée » répétés
       trente fois occupaient une colonne entière pour dire ce qu'une teinte
       dit sans être lue. La légende l'explique une fois, en tête. */
    .yp-table tr.e-vendue  { background: #E8F2EC; box-shadow: inset 3px 0 0 #2E7D52; }
    .yp-table tr.e-fermee  { background: #FBF1DA; box-shadow: inset 3px 0 0 #B8860B; }
    .yp-table tr.e-inconnue{ background: var(--bg); box-shadow: inset 3px 0 0 #C9C9C9; }
    /* ⚠ « PAS ENCORE OUVERTE » A SA COULEUR (lot 4.6.0) : ni l'ambre de
       « fermée » (l'hôte n'a rien fermé), ni le gris de « non renseignée »
       (personne n'a rien oublié). La fenêtre glisse, la nuit s'ouvrira seule. */
    .yp-table tr.e-attente { background: var(--bg); box-shadow: inset 3px 0 0 #B5C9DA; }
    .yp-table tr.e-attente td:first-child { border-left: 2px dotted #B5C9DA; }
    .yp-attente { font-size: 11.5px; color: var(--text3); }
    .yp-table tr.e-inconnue td:first-child { border-left: 2px dashed #D8D8D8; }
    /* ⚠ LE PASSÉ RESTE SOUS LES YEUX, ÉTEINT. C'est la base de réflexion de
       l'hôte : le masquer lui retirerait le seul mois dont il connaît déjà la
       réponse. Une nuit passée VENDUE garde sa couleur pleine et son prix ;
       restée vide, elle s'éteint — sans un mot. */
    .yp-table tr.passe td { color: var(--text3); }
    .yp-table tr.passe.e-vide { background: #FAFAFA; box-shadow: inset 3px 0 0 #E4E4E4; }
    .yp-table tr.passe.e-vendue { background: #EFF5F1; box-shadow: inset 3px 0 0 #9DC4AE; }
    .yp-table tr.passe.e-vendue td { color: var(--text2); }
    .yp-table tr.we.e-vide:not(.passe) { background: var(--bg2); }

    /* ⚠ UNE SÉPARATION VISIBLE ENTRE LES DEUX MOITIÉS — demande de Thierry.
       À gauche ce qui se décide, à droite ce sur quoi on s'appuie. Sans trait,
       l'œil lisait une seule table de six colonnes et mélangeait les deux. */
    .yp-table .sep-g { border-left: 1.5px solid var(--border2); }
    .yp-table tr.yp-moities th { padding: 5px 10px 3px; font-size: 9px;
                                 letter-spacing: .06em; border-bottom: none; }
    .yp-table tr.yp-moities .m-pilotage { color: var(--text2);
                                          border-left: 1.5px solid var(--border2); }
    .yp-table tr.yp-moities .m-passe { color: var(--text3);
                                       border-left: 1.5px solid var(--border2); }
    .yp-table td.yp-realise { color: var(--text2); }

    /* ─── Les deux colonnes de planning ──────────────────────────────────── */
    /* ⚠ 18 px, PAS 14 : la barre ne faisait que 8 px de large et disparaissait
       à l'impression. Un rail visible même vide dit que la colonne existe. */
    .yp-table td.yp-bar { padding: 0; position: relative; width: 18px;
                          min-width: 18px; border-bottom: none; }
    .yp-table td.yp-bar::before { content: ''; position: absolute; left: 7px;
                                  right: 7px; top: 0; bottom: 0;
                                  background: rgba(0,0,0,.045); }
    .yp-seg { position: absolute; left: 3px; right: 3px; top: 0; bottom: 0;
              background: #4A7FA8; cursor: help; }
    .yp-seg.grise { background: #D2DAE2; }
    .yp-seg.debut { top: 2px; border-radius: 4px 4px 0 0; }
    .yp-seg.fin { bottom: 2px; border-radius: 0 0 4px 4px; }
    .yp-seg.debut.fin { border-radius: 4px; }
    .yp-seg.n1 { background: #7C8B9A; }
    .yp-seg.n1.grise { background: #D5DBE1; }
    .yp-seg.chevauche { outline: 1.5px solid #B02A37; outline-offset: -1.5px; }

    /* ─── La grille du bien, une fois, en tête ───────────────────────────── */
    .yp-grille { background: var(--bg); border: 0.5px solid var(--border);
                 border-radius: var(--radius-lg); padding: 10px 14px; margin-bottom: 10px; }
    .yp-grille-tete { font-size: 11.5px; font-weight: 600; margin-bottom: 8px;
                      display: flex; align-items: center; gap: 8px; }
    .yp-grille-n { font-size: 9.5px; font-weight: 400; color: var(--text3); cursor: help; }
    .yp-grille-note { font-size: 10px; color: var(--text3); margin-top: 6px; }
    .yp-niv-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px;
                    white-space: nowrap; border: 0.5px solid rgba(0,0,0,.08); }
    .yp-niv-badge.n-base { background: #E7F0F7; } .yp-niv-badge.n-moyen { background: #EDF4EE; }
    .yp-niv-badge.n-haut { background: #FBF4E2; } .yp-niv-badge.n-tres-haut { background: #FAEADA; }
    .yp-niv-badge.n-exceptionnel { background: #F8E2DA; }
    .yp-groupe-sauf { font-size: 10.5px; color: var(--text2); display: inline-flex;
                      align-items: center; gap: 5px; flex-wrap: wrap; }
    .yp-niv.n-base { background: #E7F0F7; } .yp-niv.n-moyen { background: #EDF4EE; }
    .yp-niv.n-haut { background: #FBF4E2; } .yp-niv.n-tres-haut { background: #FAEADA; }
    .yp-niv.n-exceptionnel { background: #F8E2DA; }
    .yp-niv sup { font-size: 8px; }
    /* LA FOURCHETTE EXCEPTIONNEL (lot V2.0.7) : le bas est le prix du niveau,
       le haut une BORNE DE SECURITE (le prix le plus eleve deja obtenu), jamais
       un objectif — le haut s'ecrit plus petit, et la note le dit. */
    .yp-niv .p .haut { font-weight: 500; color: var(--text2); }
    .yp-preuve { font-size: 10.5px; color: var(--text2); margin-left: 2px; cursor: help; white-space: nowrap; }
    .yp-preuve b { font-weight: 600; color: var(--text); }

    /* ─── La légende, une fois, en tête ──────────────────────────────────── */
    .yp-legende { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center;
                  font-size: 10.5px; color: var(--text2); margin-bottom: 10px;
                  padding: 8px 12px; background: var(--bg); border-radius: var(--radius);
                  border: 0.5px solid var(--border); }
    .yp-lg { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .yp-lg i { width: 12px; height: 12px; border-radius: 3px; display: inline-block;
               flex: 0 0 auto; }
    .yp-lg.barre i { width: 6px; height: 14px; border-radius: 3px; }
    .yp-table tr.cliquable { cursor: pointer; }
    .yp-table tr.cliquable:hover td { filter: brightness(0.975); }
    .yp-table tr.ouverte-d td { box-shadow: inset 0 -1px 0 var(--border2); }
    .yp-chev { color: var(--text3); font-size: 9px; margin-left: 6px; }
    .yp-table tr.yp-detail-l td { padding: 0 12px 10px; border-bottom: none; white-space: normal; }
    .yp-jour { font-variant-numeric: tabular-nums; font-weight: 600; }
    .yp-jour.we small { color: var(--text2); font-weight: 600; }
    /* ⚠ LE PONT SE REPERE SUR SA LIGNE, pas seulement dans l'en-tête de son
       groupe : c'est la nuit qui prend le plus de valeur de l'année, et elle
       doit se voir en balayant le mois. La couleur reste celle du niveau. */
    .yp-pont { font-size: 9px; text-transform: uppercase; letter-spacing: .04em;
               background: #F3E8D0; color: #7A5B1E; border-radius: 3px;
               padding: 1px 4px; margin-left: 5px; cursor: help; font-weight: 600; }
    .yp-fleche { color: var(--text3); margin: 0 5px; }
    .yp-jour small { font-weight: 400; color: var(--text3); margin-left: 5px; font-size: 10px; }
    .yp-affiche { font-variant-numeric: tabular-nums; color: var(--text3); }
    /* ⚠ LE RETARD SE LIT SUR LA COLONNE N-1 — demande de Thierry.
       PLEIN : cette nuit comparable était DÉJÀ vendue au même délai l'an
       dernier. Si la mienne ne l'est pas, je suis en retard, et le badge de
       rythme dit la même chose au même endroit.
       GRISÉ : elle s'était vendue plus tard. Aucune alarme à tirer. */
    .yp-n1 { font-variant-numeric: tabular-nums; color: var(--text3); cursor: help; }
    .yp-n1.plein { color: var(--text); font-weight: 600; }
    /* ⚠ LE LISERÉ D'ALERTE S'ALLUME ICI, pas dans une colonne de texte : au
       même endroit du regard que le chiffre qui le justifie. */
    .yp-n1.alerte { box-shadow: inset 0 -2px 0 #B02A37; padding-bottom: 1px; }
    .yp-niveau { font-size: 10px; text-transform: uppercase; letter-spacing: .03em;
                 color: var(--text2); margin-right: 7px; }
    /* La bulle du niveau sur la ligne : la pastille de la grille, telle quelle. */
    .yp-niveau.yp-niv-badge { padding: 1px 7px; border-radius: 10px; }
    .yp-niveau.hausse { color: #0F7B3E; } .yp-niveau.baisse { color: #B02A37; }
    .yp-prix { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .yp-plus { color: #3A4A8A; font-weight: 700; margin-left: 5px; cursor: help; }
    .yp-rien { font-size: 11px; color: #8A6D3B; cursor: help; }
    .yp-vide { color: var(--text3); font-size: 11px; cursor: help; }
    .yp-retard { font-size: 10px; color: #B02A37; font-weight: 600; cursor: help;
                 margin-right: 6px; }
    .yp-apparie { margin-top: 7px; padding-top: 7px; font-size: 11px;
                  color: var(--text2); border-top: 0.5px solid var(--border); }
    .yp-apparie sup { font-size: 8px; }
    .yp-detail { background: var(--bg2); border-radius: var(--radius); padding: 10px 12px;
                 font-size: 11.5px; line-height: 1.7; }
    .yp-raisons { margin: 0; padding-left: 16px; }
    .yp-raisons li { margin-bottom: 3px; }
    .yp-audit { margin-top: 8px; }
    .yp-audit summary { cursor: pointer; color: var(--text3); font-size: 10.5px; }
    .yp-audit ol { margin: 6px 0 0; padding-left: 18px; color: var(--text2); }

    /* ─── ÉTAGE 1 : LA GRILLE, EN TÊTE DE CHAQUE GROUPE DE DATES ─────────── */
    .yp-table tr.yp-sep td { background: var(--bg3); padding: 8px 12px;
                             white-space: normal; border-bottom: 0.5px solid var(--border); }
    .yp-groupe { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .yp-groupe-nom { font-size: 11.5px; font-weight: 600; color: var(--text2);
                     display: flex; align-items: center; gap: 7px; flex: 0 1 auto; }
    .yp-indic { font-size: 9.5px; font-weight: 400; color: #8A6D3B; background: #FFF8E6;
                border: 0.5px solid #F0DFB0; border-radius: 4px; padding: 1px 6px; cursor: help; }
    .yp-carte-avert { font-size: 11.5px; color: #8A6D3B; }
    .yp-niveaux { display: flex; gap: 1px; background: var(--border);
                  border-radius: var(--radius); overflow: hidden;
                  flex: 1 1 320px; max-width: 560px; }
    .yp-niv { background: var(--bg); padding: 5px 6px; text-align: center; flex: 1 1 0;
              min-width: 0; }
    /* Le socle garde sa marque, mais discrètement : la teinte du niveau prime,
       sinon la légende ne serait plus la légende des lignes. */
    .yp-niv.socle .p { text-decoration: underline; text-underline-offset: 3px;
                       text-decoration-thickness: 1.5px; }
    .yp-niv .n { font-size: 9px; color: var(--text3); text-transform: uppercase;
                 letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
    .yp-niv .p { font-size: 13px; font-weight: 600; margin-top: 1px;
                 font-variant-numeric: tabular-nums; }

    /* ─── ÉTAGE 1 : les totaux ───────────────────────────────────────────── */
    .yp-pied { background: var(--bg); border: 0.5px solid var(--border);
               border-radius: var(--radius-lg); padding: 13px 16px; }
    .yp-pied h3 { font-size: 13px; font-weight: 600; margin: 0 0 9px; }
    .yp-totaux { width: 100%; border-collapse: collapse; font-size: 12px; }
    .yp-totaux th { text-align: left; font-weight: 500; color: var(--text3); font-size: 10px;
                    text-transform: uppercase; letter-spacing: .03em; padding: 5px 0; }
    .yp-totaux thead th:not(:first-child) { text-align: right; }
    .yp-totaux tbody th { font-size: 12px; text-transform: none; letter-spacing: 0;
                          color: var(--text2); font-weight: 400; }
    .yp-totaux td { text-align: right; padding: 6px 0; font-variant-numeric: tabular-nums;
                    border-top: 0.5px solid var(--border); }
    .yp-totaux tbody th { border-top: 0.5px solid var(--border); }
    .yp-totaux small { display: block; color: var(--text3); font-size: 10px; }

    /* ─── LE BLOC MARCHE (lot V2.5) : REPLIE, A TITRE D'INFORMATION ─────────
       Il s'AJOUTE sous le pied du mois ; il ne remplace rien et n'agit sur
       aucun prix. Donnee d'emprunt : « source : marché » dit partout. */
    .yp-marche { margin-top: 14px; background: var(--bg); border: 0.5px solid var(--border);
                 border-radius: var(--radius-lg); padding: 10px 14px; }
    .yp-marche summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text2); }
    .yp-marche .dit { font-size: 12px; color: var(--text2); margin: 8px 0 0; line-height: 1.6; }
    .yp-marche table { border-collapse: collapse; font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .yp-marche th, .yp-marche td { padding: 4px 10px; border-bottom: 0.5px solid var(--border); text-align: right; }
    .yp-marche th:first-child, .yp-marche td:first-child { text-align: left; }
    .yp-marche .avert { color: #8A6D3B; }
    .yp-etat-page { padding: 20px; border: 0.5px solid var(--border);
                    border-radius: var(--radius-lg); background: var(--bg);
                    color: var(--text2); font-size: 13px; }
    .yp-etat-page.erreur { border-color: #F5C2C7; background: #FFF5F5; color: #842029; }

    /* ─── LA MAIN DE L'HOTE SUR UNE NUIT (arbitrage A bis, 22 sept. 2026) ──
       Sur un bien pilote, le prix se modifie SUR LA LIGNE : le conseil YieldFlow
       reste affiche A COTE de la saisie, et « votre prix » se distingue par un
       liseré et un mot. */
    .yp-editer { margin-left: 6px; background: none; border: 0.5px solid var(--border);
                 border-radius: 4px; font-size: 10px; color: var(--text3); cursor: pointer;
                 padding: 1px 5px; }
    .yp-editer:hover { color: var(--text); border-color: var(--text2); }
    .yp-hote { font-size: 10px; text-transform: uppercase; letter-spacing: .03em;
               color: #5A3E8A; margin-left: 6px; font-weight: 600; }
    .yp-hote-conseil { font-size: 11px; color: var(--text3); margin-left: 6px; }
    .yp-hote-x { margin-left: 4px; background: none; border: none; color: var(--text3);
                 cursor: pointer; font-size: 12px; }
    .yp-hote-x:hover { color: #B02A37; }
    .yp-saisie { width: 64px; padding: 3px 5px; border: 0.5px solid var(--text2);
                 border-radius: 4px; font-size: 13px; font-weight: 600;
                 font-variant-numeric: tabular-nums; }
    .yp-table tr.prix-hote td:first-child { box-shadow: inset 3px 0 0 #5A3E8A; }

    /* ─── LA POP-UP DES ÉVÉNEMENTS : un calendrier en tableau ─────────────
       Les cases portent la teinte du NIVEAU de la nuit (les memes cinq
       teintes que les lignes) ; un evenement est un CONTOUR unifie sur ses
       cases — deux teintes dedans (semaine / week-end) restent un seul
       evenement. Semaine et week-end ne sont jamais des evenements. */
    .yp-ov { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
             align-items: flex-start; justify-content: center; z-index: 60; padding: 24px 12px; overflow-y: auto; }
    .yp-ov.visible { display: flex; }
    .yp-pop { background: var(--bg); border-radius: var(--radius-lg); width: 100%; max-width: 760px;
              box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 16px 18px 18px; }
    .yp-pop-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .yp-pop-tete h2 { font-size: 15px; margin: 0; }
    .yp-pop-tete .yp-nav { margin-left: auto; }
    .yp-pop-fermer { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text3); }
    .yp-cal { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
    .yp-cal th { font-size: 10px; text-transform: uppercase; color: var(--text3); font-weight: 600; padding: 2px 0; }
    .yp-cal td { height: 54px; vertical-align: top; border-radius: 6px; padding: 3px 4px; font-size: 11px;
                 background: var(--bg2); position: relative; border: 2px solid transparent; }
    .yp-cal td.vide { background: transparent; }
    .yp-cal td .j { font-weight: 600; font-variant-numeric: tabular-nums; }
    .yp-cal td .p { font-size: 10.5px; color: var(--text2); display: block; margin-top: 2px; }
    .yp-cal td .n { font-size: 9px; text-transform: uppercase; color: var(--text3); display: block; }
    .yp-cal td.n-base, .yp-cal td.n-moyen, .yp-cal td.n-haut, .yp-cal td.n-tres-haut, .yp-cal td.n-exceptionnel { box-shadow: none; }
    /* Le contour d'un evenement : bordures haut/bas sur toutes ses cases,
       gauche sur la premiere, droite sur la derniere ; en rejoignant les
       cases voisines (espacement negatif), il se lit d'un seul trait. */
    .yp-cal td.ev { border-top-color: var(--ev); border-bottom-color: var(--ev); border-radius: 0; }
    .yp-cal td.ev.ev-g { border-left-color: var(--ev); border-radius: 6px 0 0 6px; }
    .yp-cal td.ev.ev-d { border-right-color: var(--ev); border-radius: 0 6px 6px 0; }
    .yp-cal td.ev.ev-g.ev-d { border-radius: 6px; }
    .yp-cal td .ev-nom { position: absolute; left: 4px; top: 3px; right: 22px; font-size: 9px; font-weight: 600;
                         color: var(--ev); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
    /* Une barre par evenement au bas de la case : les chevauchements se voient,
       et chaque barre court d'un bout a l'autre de son evenement. */
    .yp-cal td .ev-barres { position: absolute; left: -2px; right: -2px; bottom: 0; display: flex; flex-direction: column; gap: 1px; }
    .yp-cal td .ev-barre { display: block; height: 3px; }
    .yp-cal td .ev-barre.g { margin-left: 4px; border-radius: 2px 0 0 2px; }
    .yp-cal td .ev-barre.d { margin-right: 4px; border-radius: 0 2px 2px 0; }
    .yp-ev-liste { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
    .yp-ev-l { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px;
               padding: 6px 8px; border-radius: var(--radius); background: var(--bg2); border-left: 4px solid var(--ev); }
    .yp-ev-l .o { font-size: 9.5px; text-transform: uppercase; color: var(--text3); }
    .yp-ev-l select { font-size: 11.5px; padding: 2px 4px; border: 0.5px solid var(--border); border-radius: 4px; background: var(--bg); }
    .yp-ev-l button { font-size: 11px; background: none; border: 0.5px solid var(--border); border-radius: 4px; cursor: pointer; color: var(--text3); padding: 2px 7px; }
    .yp-ev-l button:hover { color: #B02A37; border-color: #F5C2C7; }
    .yp-ev-form { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border);
                  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; }
    .yp-ev-form label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: var(--text3); }
    .yp-ev-form input, .yp-ev-form select { padding: 6px 8px; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 12.5px; background: var(--bg); color: var(--text); }
    .yp-ev-form button { padding: 7px 12px; border: none; border-radius: var(--radius); background: var(--text); color: var(--bg); cursor: pointer; font-size: 12.5px; }
    .yp-ev-msg { grid-column: 1 / -1; font-size: 12px; }
    .yp-ev-msg.ko { color: #B02A37; } .yp-ev-msg.ok { color: #1F6F45; }
    .yp-btn-ev { padding: 6px 10px; border: 0.5px solid var(--border); border-radius: var(--radius);
                 background: var(--bg); cursor: pointer; font-size: 12.5px; color: var(--text); }
    .yp-btn-ev:hover { background: var(--bg2); }

    @media (max-width: 640px) {
      .yp-barre { gap: 8px; }
      #yp-bien { flex: 1 1 100%; }
      .yp-niveaux { flex-basis: 100%; max-width: none; }
    }
  </style>

<body>
<!-- ⚠ LE CONTRAT DE MISE EN PAGE EST `.layout > .sidebar + .main`, ET L'ID
     DOIT ETRE `sidebar` : `components/sidebar.js` fait
     `document.getElementById('sidebar')` puis `if (!sidebar) return`.
     Ces pages portaient `sidebar-root` et n'avaient pas le conteneur : le menu
     n'etait jamais rendu, SANS la moindre erreur, et l'app devenait un
     cul-de-sac des qu'on y entrait. Mesure du 14 septembre 2026. -->
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<!-- ⚠ `.content` PORTE LE DEFILEMENT, ET C'EST LA MOITIE DU CONTRAT.
     `.layout` est en `height:100vh; overflow:hidden` et `.main` aussi
     (public/style.css) : sans `.content` — qui est le seul a porter
     `flex:1; overflow-y:auto` — tout ce qui depasse la fenetre est TRONQUE,
     sans barre de defilement. Ces pages vivaient hors du conteneur, donc le
     body scrollait ; en les y ramenant pour retrouver le menu, on heritait
     aussi de sa contrainte de hauteur. Releve en review le 14 septembre 2026,
     avant livraison. `.content` apporte au passage le retrait de 24 px des
     autres pages : `.header` n'est style NULLE PART, le titre etait colle au
     rail de la sidebar. -->
<div class="content">
  <div class="header">
    <h1>Prédiction de prix</h1>
  </div>

  <div class="yp-barre">
    <select id="yp-bien"></select>
    <!-- ACTIVÉ / DÉSACTIVÉ, à côté du logement (demande de Thierry, 22 septembre
         2026) : l'état vient du serveur, le bouton est rendu par le JS. Le clic
         ne bascule jamais directement : il ouvre une confirmation. -->
    <button id="yp-etat" class="yp-etat" hidden></button>
    <div class="yp-nav">
      <button id="yp-prec" aria-label="Mois précédent">‹</button>
      <span id="yp-mois"></span>
      <button id="yp-suiv" aria-label="Mois suivant">›</button>
    </div>
    <span id="yp-ca"></span>
    <button class="yp-btn-ev" id="yp-ouvrir-ev" title="Le calendrier du mois, avec ce qui pilote vos prix : vacances, fériés, dates commerciales, vos événements.">Événements</button>
  </div>

  <!-- LA POP-UP DES ÉVÉNEMENTS (remplace l'ancienne page « Ce qui pilote vos
       prix », decision de Thierry du 22 septembre 2026). Rendue par le JS. -->
  <div class="yp-ov" id="yp-ov-ev" role="dialog" aria-modal="true" aria-label="Événements">
    <div class="yp-pop" id="yp-pop-ev"></div>
  </div>

  <!-- LA CONFIRMATION D'UN CHANGEMENT D'ETAT s'ouvre ICI, sous le bouton que
       l'hote vient de cliquer — jamais en bas de page. -->
  <div class="yp-pilote" id="yp-confirm" hidden></div>

  <div id="yp-contenu"></div>

  <!-- LA FENETRE D'OUVERTURE ET LE DERNIER PASSAGE, en bas de page pour le
       moment (demande de Thierry, 22 septembre 2026). Rendu par le JS parce
       que son etat vient du serveur. -->
  <div class="yp-pilote" id="yp-pilote" hidden></div>
</div><!-- .content -->
</div>

</div><!-- .layout -->

<script type="module">
  // ⚠ LA PAGE QUE L'HÔTE OUVRE LE MATIN — un MOIS à la fois, une LIGNE par nuit.
  // Cette liste verticale est la base, et elle le reste : la refonte en matrice
  // (jours en colonnes) a été abandonnée le 13 septembre 2026 — non parce que
  // l'idée était mauvaise, mais parce qu'elle changeait tout d'un coup, donc
  // sans qu'aucune correction ne puisse être jugée séparément. Les améliorations
  // arrivent désormais une par une, validées sur aperçu. DOC : docs/kb/
  // restitution-yield.md §« on itère un écran comme on itère du code ».
  //
  // ⚠ TROIS ÉTAGES STRICTS, et rien ne franchit son étage :
  //   1. décision  — la grille du segment, la suggestion EN NIVEAU, le N-1 réel
  //   2. confiance — un avertissement quand la grille est mince, rien d'autre
  //   3. audit     — derrière « Pourquoi ? », la mécanique complète et intacte
  //
  // ⚠ CE QUI EST VRAI DU MOIS SE DIT UNE FOIS, DANS LE BANDEAU. Ce qui est vrai
  // du SEGMENT se dit une fois, en tête de son groupe de dates. Seul ce qui est
  // propre à LA NUIT vit sur sa ligne. Répéter « ce mois se vend moins bien »
  // trente fois n'apprend rien la trentième fois, et noie ce qui, lui, change.
  //
  // ⚠ TOUT PARLE EN NIVEAUX DE LA GRILLE DE L'HÔTE. Aucun ratio, aucune
  // médiane, aucun compte de nuits en vedette. Les multiplicateurs mesurés
  // vivent dans l'audit — le calcul, lui, ne change pas.
  //
  // ⚠ LECTURE SEULE. « Appliquer » viendra au lot 4.6, par le calendrier.
  import { requireAuth } from '/components/auth-guard.js'
  import { renderSidebar } from '/components/sidebar.js'
  import { compteCourant, enteteCompte } from '/shared/compte-courant.js'
  import { supabase } from '/shared/supabase.js'
  import { initErrorHandler } from '/shared/error-handler.js'
  import { motif, nomSegment, refus } from '/shared/yield-motifs.js'
  import { api as apiClient } from '/shared/api-client.js'

  initErrorHandler()

  let session = null
  let mois = null
  let enCours = 0
  let donnees = null          // la derniere reponse de /api/yield-prix
  let evenements = null       // la derniere reponse de /api/yield-evenements (par bien)
  let popupOuverte = false
  const el = id => document.getElementById(id)
  // JJ/MM/AAAA depuis un jour ISO, sans passer par Date : un jour ISO reste
  // un jour ISO, aucun fuseau n'entre en jeu.
  const dateFr = iso => /^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))
    ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : ''
  const ech = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const euros = v => v == null ? null :
    new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR',
      maximumFractionDigits: 0 }).format(v)
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
    'août', 'septembre', 'octobre', 'novembre', 'décembre']
  const JOURS = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam']
  const JOURS_LONGS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi',
    'vendredi', 'samedi']
  const nomMois = c => `${MOIS[Number(c.slice(5)) - 1]} ${c.slice(0, 4)}`
  const decalerMois = (c, n) => {
    const d = new Date(Date.UTC(Number(c.slice(0, 4)), Number(c.slice(5)) - 1 + n, 1))
    return d.toISOString().slice(0, 7)
  }

  async function init () {
    session = await requireAuth()
    if (!session) return
    renderSidebar('yield-prix').catch(e => console.error('[yield-prix] sidebar', e))
    mois = new Date().toISOString().slice(0, 7)
    const ok = await chargerBiens()
    el('yp-bien').addEventListener('change', () => { chargerPilote(); charger() })
    el('yp-prec').addEventListener('click', () => { mois = decalerMois(mois, -1); charger() })
    el('yp-suiv').addEventListener('click', () => { mois = decalerMois(mois, 1); charger() })
    el('yp-ouvrir-ev').addEventListener('click', ouvrirPopup)
    el('yp-ov-ev').addEventListener('click', e => { if (e.target === el('yp-ov-ev')) fermerPopup() })
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && popupOuverte) fermerPopup() })
    if (new URLSearchParams(location.search).get('evenements') === '1') setTimeout(ouvrirPopup, 300)
    if (ok && el('yp-bien').value) { chargerPilote(); charger() }
  }

  async function chargerBiens () {
    const compte = compteCourant()
    let q = supabase.from('properties').select('id, name').order('name')
    if (compte) q = q.eq('user_id', compte)
    const { data, error } = await q
    if (error) { etat('Impossible de lire la liste des logements.', true); return false }
    if (!data || !data.length) {
      etat('Aucun logement accessible sur ce compte.')
      return false
    }
    el('yp-bien').innerHTML = data
      .map(b => `<option value="${ech(b.id)}">${ech(b.name)}</option>`).join('')
    return true
  }

  // ─── LE PILOTE TARIFAIRE ────────────────────────────────────────────────
  // ⚠ CET ECRAN NE GARDE RIEN. Le refus d'ecriture tarifaire est tenu par
  // `api/calendar.js` (garde serveur, spec §2 bis arbitrage A) et le refus de
  // bascule par `api/yield-pilote.js`. Ce qui est ici EXPLIQUE ; ça ne protege
  // pas. Une restriction d'UI n'est pas une restriction.
  let enCoursPilote = 0
  let nuitsPrixHote = null
  // « 3 nuits gardent votre prix YieldFlow » — la phrase de la decision (a),
  // une fois. « YieldFlow » : ce sont les prix poses par le ✎ de cette page,
  // pas ceux du calendrier (changement de dessin du 23 septembre 2026).
  const phrasePrixHote = n => `${n} nuit${n > 1 ? 's' : ''} garde${n > 1 ? 'nt' : ''} votre prix YieldFlow`
  // « 12 nuits ont déjà un prix au calendrier » — decision A1 : la base ne sait
  // pas QUI a pose un prix du calendrier, on ne dit donc pas « que vous avez
  // definis ».
  const phrasePrixCalendrier = n => `${n} nuit${n > 1 ? 's ont' : ' a'} déjà un prix au calendrier`
  async function chargerPilote () {
    // ⚠ LE MEME JETON QUE `charger()` — releve en review. Sans lui, deux
    // changements de logement rapides peuvent peindre le pilote du bien A
    // au-dessus du calendrier du bien B ; et un clic sur la radio, qui relit
    // `el('yp-bien').value`, basculerait alors le bien B sur la foi d'un etat
    // affiche pour A.
    const jeton = ++enCoursPilote
    const bien = el('yp-bien').value
    const bloc = el('yp-pilote')
    const etat = el('yp-etat')
    const confirm = el('yp-confirm')
    confirm.hidden = true; confirm.innerHTML = ''
    // Jamais le compte du logement precedent dans la confirmation de celui-ci.
    nuitsPrixHote = null
    // Pendant la lecture, le bouton ne repond pas : il porte encore l'etat du
    // bien precedent (releve en relecture).
    etat.disabled = true
    if (!bien) { bloc.hidden = true; etat.hidden = true; return }
    let d
    try {
      const r = await fetch(`/api/yield-pilote?bien=${encodeURIComponent(bien)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() }
      })
      d = await r.json()
      if (jeton !== enCoursPilote) return
      if (!r.ok) throw new Error(d && d.error)
    } catch (e) {
      if (jeton !== enCoursPilote) return
      // ⚠ UN REGLAGE QU'ON NE SAIT PAS LIRE NE S'AFFICHE PAS « calendrier ».
      // Le montrer dans un etat invente ferait croire a l'hote qu'il sait ou
      // il en est, et un clic ecrirait par-dessus une valeur jamais lue.
      etat.hidden = false; etat.disabled = true; etat.className = 'yp-etat'
      etat.textContent = 'réglage illisible'
      etat.removeAttribute('aria-pressed'); etat.onclick = null
      etat.title = 'Réglage illisible pour le moment. Rechargez la page.'
      bloc.hidden = true
      return
    }
    const yf = d.pilote === 'yieldflow'
    const bloque = !d.peut_basculer && !yf
    // Les nuits a venir qui gardent le prix de l'hote (dette 22) : les deux
    // confirmations les annoncent. `null` = illisible, on se tait.
    nuitsPrixHote = d.prix_hote && Number.isInteger(d.prix_hote.nuits) ? d.prix_hote.nuits : null
    // ⚠ L'ETAT EST UN MOT A COTE DU LOGEMENT, et le survol dit ce que le mode
    // fait AUJOURD'HUI : en yieldflow, YieldFlow ouvre les dates de la fenêtre et
    // entretient leurs prix chaque jour ; vos indisponibilités ne sont jamais
    // touchées. Desactive, vous saisissez vos prix a la main dans le calendrier.
    etat.hidden = false
    etat.disabled = bloque
    etat.className = `yp-etat ${yf ? 'on' : ''}`
    etat.textContent = yf ? 'activé' : 'désactivé'
    etat.setAttribute('aria-pressed', yf ? 'true' : 'false')
    etat.title = bloque
      ? (d.raison || 'Activation impossible pour ce logement.')
      : (yf
        ? 'Prédiction de prix activée : YieldFlow ouvre les dates de la fenêtre et entretient leurs prix chaque jour. Vos indisponibilités ne sont jamais touchées. Cliquez pour désactiver.'
        : 'Prédiction de prix désactivée : vous saisissez vos prix à la main dans le calendrier. Cliquez pour activer.')
    etat.onclick = () => confirmerBascule(yf ? 'calendrier' : 'yieldflow')
    if (!yf) { bloc.hidden = true; bloc.innerHTML = ''; return }
    bloc.hidden = false
    // ⚠ CE QUE LE MODE N'EMPORTE PAS SE DIT AUSSI. Sans cette phrase, l'hote
    // qui active croit son calendrier mort et n'ose plus fermer une nuit.
    bloc.innerHTML = '<p class="dit">Les prix de ce logement sont tenus par YieldFlow : ils ne se '
      + 'saisissent plus dans le calendrier. La disponibilité et la fermeture à la vente, elles, '
      + 'se règlent toujours dans le calendrier.</p>'
      // LA FENETRE D'OUVERTURE (lot 4.6.3) : la fenetre reglee, la derniere
      // ouverture du moteur, et le moyen de la changer. Le moteur tourne par le
      // cron (toutes les 5 minutes) ; cet ecran ne l'appelle pas.
      + fenetreHtml(d)
    brancherFenetre(d)
  }

  // ⚠ CHANGER D'ETAT SE CONFIRME, DANS LES DEUX SENS — demande de Thierry
  // (22 septembre 2026). Activer : l'IA va modifier les tarifs, l'hote verifie
  // d'abord la configuration et les prix proposes. Desactiver : YieldFlow
  // s'arrete, les prix en place restent, l'hote reprend la main.
  function confirmerBascule (voulu) {
    if (voulu === 'yieldflow') { demanderFenetre(); return }
    const bloc = el('yp-confirm')
    bloc.hidden = false
    bloc.innerHTML = '<div class="yp-fenetre" id="yp-desactivation">'
      + '<p class="avertir"><b>Désactiver la prédiction de prix ?</b> YieldFlow n’ouvrira plus de dates et ne modifiera plus vos tarifs. '
      + 'Les prix en place restent au calendrier ; vous les saisissez à nouveau vous-même.</p>'
      // ⚠ DESACTIVER N'EFFACE PAS LA MAIN DE L'HOTE (dette 22) : on le dit,
      // pour que l'hote sache ce qu'il retrouvera en reactivant.
      + (nuitsPrixHote ? `<p class="dit">${phrasePrixHote(nuitsPrixHote)} : à la réactivation, YieldFlow ne ${nuitsPrixHote > 1 ? 'les' : 'la'} modifiera pas. C’est le prix affiché au calendrier à ce moment-là qui sera retenu.</p>` : '')
      + '<button type="button" id="yp-des-valider">Désactiver</button>'
      + '<button type="button" class="secondaire" id="yp-des-annuler">Annuler</button>'
      + '<span class="etat" id="yp-des-etat"></span>'
      + '</div>'
    el('yp-des-annuler').addEventListener('click', () => chargerPilote())
    el('yp-des-valider').addEventListener('click', () => basculerPilote('calendrier'))
  }

  // ─── LA FENETRE D'OUVERTURE ────────────────────────────────────────────
  const libelleFenetre = f => f ? `${f.valeur} ${f.type === 'mois' ? 'mois' : 'jour' + (f.valeur > 1 ? 's' : '')} glissants` : null
  const dateFrCourte = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) }
  function fenetreHtml (d) {
    const f = d.fenetre
    // Le bilan du dernier passage voyage avec le marqueur : « 0 ouverte, 24
    // sans prix » ne doit pas se lire « YieldFlow est passe ».
    const b = d.ouverture && d.ouverture.bilan
    const c = b && b.comptes ? b.comptes : null
    let derniere = 'YieldFlow n’a pas encore ouvert de dates : il passe dans les 5 minutes qui suivent l’activation, puis chaque jour.'
    if (d.ouverture && d.ouverture.derniere) {
      const px = b && b.prix ? b.prix : null
      derniere = `Dernier passage de YieldFlow : ${ech(dateFrCourte(d.ouverture.derniere))}` + (b ? ` — ${b.ouvertes} nuit${b.ouvertes > 1 ? 's' : ''} ouverte${b.ouvertes > 1 ? 's' : ''}` : '')
        + (px ? `, ${px.changees} prix modifié${px.changees > 1 ? 's' : ''}` + (px.comptes && px.comptes.non_calculables ? ` (${px.comptes.non_calculables} nuit${px.comptes.non_calculables > 1 ? 's' : ''} non calculable${px.comptes.non_calculables > 1 ? 's' : ''} : prix en place conservé)` : '') : '') + '.'
      if (c && c.sans_prix) derniere += ` ⚠ ${c.sans_prix} nuit${c.sans_prix > 1 ? 's' : ''} sans prix : renseignez un prix de base pour ce logement.`
      if (c && c.sous_plancher) derniere += ` ⚠ ${c.sous_plancher} nuit${c.sous_plancher > 1 ? 's' : ''} sous le prix plancher, laissée${c.sous_plancher > 1 ? 's' : ''} fermée${c.sous_plancher > 1 ? 's' : ''}.`
    }
    return '<div class="yp-fenetre" id="yp-fenetre">'
      + `<span><b>Fenêtre d’ouverture :</b> ${f ? ech(libelleFenetre(f)) : '<span class="raison">non réglée</span>'}</span>`
      + '<label>ouvrir <input type="number" id="yp-fen-valeur" min="1" max="500" value="' + (f ? f.valeur : 120) + '"></label>'
      + '<select id="yp-fen-type"><option value="jours"' + (!f || f.type === 'jours' ? ' selected' : '') + '>jours</option><option value="mois"' + (f && f.type === 'mois' ? ' selected' : '') + '>mois</option></select>'
      + ' <span>à l’avance</span>'
      + '<button type="button" id="yp-fen-enregistrer">' + (f ? 'Modifier' : 'Régler') + '</button>'
      + `<span class="etat" id="yp-fen-etat">${derniere} Les dates de la fenêtre s’ouvrent à la vente avec leur prix ; une indisponibilité que vous avez posée n’est jamais touchée.</span>`
      + '</div>'
  }
  function brancherFenetre (d) {
    const btn = el('yp-fen-enregistrer'); if (!btn) return
    btn.addEventListener('click', () => enregistrerFenetre())
  }
  async function enregistrerFenetre () {
    const bien = el('yp-bien').value
    const type = el('yp-fen-type').value, valeur = el('yp-fen-valeur').value
    const etat = el('yp-fen-etat'); const btn = el('yp-fen-enregistrer')
    btn.disabled = true; etat.textContent = 'Enregistrement…'
    try {
      const r = await fetch('/api/yield-pilote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}`, ...enteteCompte() },
        body: JSON.stringify({ bien, fenetre: { type, valeur } })
      })
      const d = await r.json()
      // ⚠ LE REFUS DU SERVEUR S'AFFICHE TEL QUEL : la regle et son francais vivent
      // dans lib/pilote-tarifaire.js (validerFenetre), pas ici.
      if (!r.ok) { etat.textContent = d && d.error ? d.error : 'Réglage refusé.'; btn.disabled = false; return }
    } catch (e) { etat.textContent = 'Erreur réseau : réessayez.'; btn.disabled = false; return }
    await chargerPilote()
    charger()
  }

  // ⚠ ENTRER EN YIELDFLOW EXIGE UNE FENETRE (lot 4.6.3) : l'activation, c'est
  // le mode ET jusqu'ou il ouvre. On la demande AVANT d'ecrire, dans le bloc
  // meme ; le serveur la valide (validerFenetre) et refuse sans elle.
  function demanderFenetre () {
    const bloc = el('yp-confirm')
    if (el('yp-fenetre-activation')) return
    bloc.hidden = false
    bloc.innerHTML = ''
    bloc.insertAdjacentHTML('beforeend', '<div class="yp-fenetre" id="yp-fenetre-activation">'
      + '<p class="avertir"><b>L’IA de prédiction des prix va modifier vos tarifs.</b> '
      + 'Vérifiez la configuration et les tarifs proposés sur cette page avant d’enclencher.</p>'
      // ⚠ LA DECISION (a) SE DIT A LA REACTIVATION (dette 22) : les nuits dont
      // l'hote a fixe le prix restent a lui, au prix affiche au calendrier.
      // DEUX ORIGINES, DEUX TRAITEMENTS (23 septembre 2026) : les prix du
      // calendrier de la fenetre seront REMPLACES (le compte vient du serveur,
      // pour la fenetre saisie) ; les prix YieldFlow (✎) sont GARDES.
      + '<p class="dit" id="yp-act-compte">Comptage des prix du calendrier…</p>'
      + (nuitsPrixHote ? `<p class="dit"><b>${phrasePrixHote(nuitsPrixHote)}.</b> YieldFlow ne ${nuitsPrixHote > 1 ? 'les' : 'la'} modifiera pas : c’est le prix affiché au calendrier qui est retenu. Pour ${nuitsPrixHote > 1 ? 'les' : 'la'} lui confier, retirez votre prix sur ${nuitsPrixHote > 1 ? 'leur' : 'sa'} ligne.</p>` : '')
      + '<span><b>Jusqu’où YieldFlow ouvre-t-il vos dates ?</b></span>'
      + '<label>ouvrir <input type="number" id="yp-act-valeur" min="1" max="500" value="120"></label>'
      + '<select id="yp-act-type"><option value="jours" selected>jours</option><option value="mois">mois</option></select>'
      + ' <span>à l’avance</span>'
      + '<button type="button" id="yp-act-valider">Activer</button>'
      + '<button type="button" class="secondaire" id="yp-act-annuler">Annuler</button>'
      + '<span class="etat" id="yp-act-etat">Les dates de cette fenêtre s’ouvriront à la vente dans les 5 minutes, au prix prédit par YieldFlow (à défaut, à leur prix actuel ou au prix de base). Vos indisponibilités ne sont jamais touchées. La fenêtre glisse ensuite chaque jour.</span>'
      + '</div>')
    el('yp-act-annuler').addEventListener('click', () => chargerPilote())
    el('yp-act-valider').addEventListener('click', () => basculerPilote('yieldflow', { type: el('yp-act-type').value, valeur: el('yp-act-valeur').value }))
    // Le compte suit la fenetre saisie : relu a chaque changement, apres une
    // courte pause (on ne relit pas deux ans de calendrier a chaque chiffre).
    // ⚠ LE JETON AVANCE A LA FRAPPE, PAS A LA FIN DE LA PAUSE (releve en
    // review) : sinon une reponse pour l'ancienne fenetre, arrivee pendant la
    // pause, s'affichait comme le compte de la nouvelle ; et « Activer » reste
    // inerte tant que le compte de la fenetre saisie n'est pas arrive — la
    // question « Continuer ? » se lit AVANT de pouvoir repondre.
    let attente = null
    const relire = () => { clearTimeout(attente); attendreCompte(); attente = setTimeout(compterPrixCalendrier, 400) }
    el('yp-act-valeur').addEventListener('input', relire)
    el('yp-act-type').addEventListener('change', relire)
    compterPrixCalendrier()
  }

  // ⚠ UN SEUL COMPTE A L'ECRAN, CELUI DE LA DERNIERE FENETRE SAISIE : un jeton,
  // comme `chargerPilote` — une reponse lente pour 120 jours ne doit pas
  // s'afficher par-dessus celle de 6 mois.
  let enCoursCompte = 0
  function attendreCompte () {
    ++enCoursCompte
    const zone = el('yp-act-compte'); if (zone) zone.textContent = 'Comptage des prix du calendrier…'
    const valider = el('yp-act-valider'); if (valider) valider.disabled = true
  }
  async function compterPrixCalendrier () {
    const zone = el('yp-act-compte'); if (!zone) return
    attendreCompte()
    const jeton = enCoursCompte
    const bien = el('yp-bien').value
    const type = el('yp-act-type').value, valeur = el('yp-act-valeur').value
    const liberer = () => { const v = el('yp-act-valider'); if (v) v.disabled = false }
    let d = null
    try {
      const r = await fetch(`/api/yield-pilote?bien=${encodeURIComponent(bien)}&fenetre_type=${encodeURIComponent(type)}&fenetre_valeur=${encodeURIComponent(valeur)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() }
      })
      d = await r.json()
      if (jeton !== enCoursCompte || !el('yp-act-compte')) return
      // Une fenetre invalide : le serveur dit pourquoi, le bouton le redira.
      if (!r.ok) { zone.textContent = d && d.error ? d.error : 'Fenêtre invalide.'; liberer(); return }
    } catch (e) {
      if (jeton !== enCoursCompte || !el('yp-act-compte')) return
      d = null
    }
    const n = d && d.prix_calendrier && Number.isInteger(d.prix_calendrier.nuits) ? d.prix_calendrier.nuits : null
    // ⚠ « JE NE SAIS PAS » N'EST PAS « AUCUN » : illisible se dit, jamais 0.
    // ⚠ « PAR SES PREDICTIONS » QUAND IL SAIT LES FAIRE (releve en review) :
    // une nuit non calculable ou sous le plancher garde son prix, et un bien a
    // l'historique mince peut n'en calculer aucune. La phrase le dit.
    zone.innerHTML = n == null
      ? 'Impossible de compter vos prix du calendrier pour le moment : YieldFlow recalculera ceux de cette fenêtre qu’il sait prédire.'
      : n === 0
        ? 'Aucune nuit de cette fenêtre n’a de prix au calendrier à remplacer.'
        : `<b>${phrasePrixCalendrier(n)}.</b> YieldFlow va ${n > 1 ? 'les' : 'le'} remplacer par ses prédictions ; une nuit qu’il ne sait pas encore prédire garde son prix. Continuer ?`
    liberer()
  }

  async function basculerPilote (voulu, fenetre) {
    const bien = el('yp-bien').value
    const bloc = el('yp-confirm')
    if (voulu === 'yieldflow' && !fenetre) { demanderFenetre(); return }
    for (const i of document.querySelectorAll('#yp-confirm input, #yp-confirm button, #yp-pilote input, #yp-pilote button')) i.disabled = true
    el('yp-etat').disabled = true
    try {
      const r = await fetch('/api/yield-pilote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`, ...enteteCompte() },
        body: JSON.stringify(fenetre ? { bien, pilote: voulu, fenetre } : { bien, pilote: voulu })
      })
      const d = await r.json()
      // ⚠ LE REFUS DU SERVEUR S'AFFICHE TEL QUEL. C'est lui qui porte la regle
      // et le message en francais ; le reecrire ici ferait deux verites.
      if (!r.ok) {
        // ⚠ LE REFUS SE LIT DANS LE PANNEAU DE CONFIRMATION, QUI RESTE EN PLACE
        // — releve en relecture : en mode calendrier, `chargerPilote` cache le
        // bloc, donc une raison ajoutee apres etait invisible et l'hote ne
        // savait jamais pourquoi l'activation avait ete refusee.
        const zone = el('yp-act-etat') || el('yp-des-etat')
        const message = d && d.error ? d.error : 'Changement refusé.'
        if (zone) {
          zone.textContent = message
          zone.classList.add('raison')
          for (const i of document.querySelectorAll('#yp-confirm input, #yp-confirm button, #yp-pilote input, #yp-pilote button')) i.disabled = false
          el('yp-etat').disabled = false
          return
        }
        await chargerPilote()
        bloc.hidden = false
        const p = document.createElement('p')
        p.className = 'raison'
        p.textContent = message
        bloc.appendChild(p)
        return
      }
    } catch (e) {
      await chargerPilote()
      return
    }
    await chargerPilote()
    charger()
  }

  async function charger () {
    const jeton = ++enCours
    el('yp-mois').textContent = nomMois(mois)
    el('yp-ca').innerHTML = ''
    etat('Lecture du cœur de données…')
    const p = new URLSearchParams({ property_id: el('yp-bien').value, mois })
    let r, data
    try {
      r = await fetch(`/api/yield-prix?${p}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() }
      })
      data = await r.json()
    } catch (e) {
      if (jeton === enCours) etat(`Lecture impossible : ${e.message}`, true)
      return
    }
    if (jeton !== enCours) return
    if (!r.ok) { etat(refus(data?.error), true); return }
    donnees = data
    el('yp-ca').innerHTML = bandeauCa(data)
    el('yp-contenu').innerHTML = vue(data)
    brancher()
    if (popupOuverte) rendrePopup()
  }

  // ⚠ LE CA DU BANDEAU EST CELUI DU PIED, PAS UN SECOND CALCUL : `pied.a_date`
  // (vendu a ce jour sur le mois affiche) et `pied.a_date_n1` (l'an dernier au
  // MEME delai, jamais le mois entier — comparer a un mois termine donnerait
  // toujours une chute). Sans N-1 exploitable, on ne montre que le mois : un
  // « 0 € » d'an dernier se lirait comme une chute.
  function bandeauCa (d) {
    const p = d.pied || {}
    const ad = p.a_date
    if (!ad || ad.ca == null) return ''
    // Le delai est compte avant le DEBUT du mois : negatif des que le mois a
    // commence, donc il ne distingue pas « en cours » de « termine ».
    const moisParis = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris' }).format(new Date()).slice(0, 7)
    const periode = p.periode || mois
    const quand = periode < moisParis ? 'mois terminé'
      : (periode === moisParis ? 'mois en cours'
        : (p.delai_jours != null ? `${p.delai_jours} jour(s) avant le début du mois` : 'mois à venir'))
    let n1 = ''
    const cmp = p.vs_n1 && p.vs_n1.ca ? p.vs_n1.ca : null
    if (p.a_date_n1 && p.a_date_n1.ca != null && !(cmp && cmp.non_calculable)) {
      const v = cmp && cmp.variation != null ? Math.round(cmp.variation * 100) : null
      const sens = v == null ? '' : (v >= 0 ? 'hausse' : 'baisse')
      n1 = `<span class="n1 ${sens}" title="${ech(`L’an dernier, au même délai (${quand}) : ${euros(p.a_date_n1.ca)} vendus sur ce mois.`)}">N-1 <b>${euros(p.a_date_n1.ca)}</b>${v != null ? ` (${v >= 0 ? '+' : ''}${v} %)` : ''}</span>`
    }
    return `<span title="${ech(`Chiffre d’affaires vendu à ce jour sur ${nomMois(p.periode || mois)} (${quand}).`)}">CA <b>${euros(ad.ca)}</b></span>${n1}`
  }

  // ─── La vue : action, tableau, pied ───────────────────────────────────────
  function vue (d) {
    return radar(d) + tendanceDuMois(d) + grilleDuBien(d) + legende(d) + tableau(d) + pied(d) + blocMarche()
  }

  const ABREV = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.',
    'août', 'sept.', 'oct.', 'nov.', 'déc.']

  // ⚠ LA BANDE VIENT AVEC LE MOIS, SANS UNE REQUETE DE PLUS — contrainte de
  // Thierry. Elle est calculée par le même endpoint, avec la MÊME fonction que
  // les lignes : la tuile annonce exactement ce que le mois montrera au clic.
  //
  // ⚠ ET ELLE NE DIT QUE CE QU'IL Y A À FAIRE. Douze tuiles n'ont pas la place
  // d'un tableau de bord : un gain, deux compteurs, un point d'alerte. Tout le
  // reste vit au survol, et le détail au clic.
  function radar (d) {
    if (!d.radar || !d.radar.length) return ''
    return `<div class="yp-radar">${d.radar.map(m => {
      const nom = `${ABREV[Number(m.periode.slice(5)) - 1]} ${m.periode.slice(2, 4)}`
      const a = m.alertes || {}
      // ⚠ UNE SEULE ALERTE, LA PLUS GRAVE : deux points sur une tuile de 62 px
      // ne se distinguent pas, et l'hôte n'agirait sur aucun des deux.
      const alerte = a.en_retard > 0
        ? { c: 'rouge', t: `${a.en_retard} nuit(s) en retard sur leur rythme : à ce délai, l’an dernier, la nuit comparable était déjà vendue.` }
        : (a.segments_incertains > 0
          ? { c: 'ambre', t: `${a.segments_incertains} nuit(s) hors de la couverture du calendrier scolaire : leurs segments sont incertains.` }
          : (a.fermees > 0
            ? { c: 'ambre', t: `${a.fermees} nuit(s) fermée(s) à la vente — aucun prix ne s’y vend.` }
            : (a.non_renseignees > 0
              ? { c: 'gris', t: `${a.non_renseignees} nuit(s) non renseignée(s) : votre calendrier ne va pas jusque-là.` }
              : null)))
      // ⚠ UNE TUILE SANS ACTION DOIT DIRE POURQUOI — demande de Thierry.
      // « — » était ambigu : janvier à mai 2027 sont FERMÉS À LA VENTE, ce qui
      // est un manque à gagner, pas un calme plat. Trois cas distincts, et un
      // seul « — » : celui qui veut vraiment dire « rien à faire ».
      const agit = m.a_monter > 0 || m.a_baisser > 0
      // ⚠ « EN RETARD » PASSE AVANT « RIEN A FAIRE » — releve en review.
      // Un mois dont les prix en place sont deja ceux du moteur affichait
      // « — / Rien a changer » alors qu'il comptait des nuits en retard sur
      // leur rythme N-1 : l'alerte la PLUS GRAVE etait la seule a pouvoir
      // disparaitre, parce que le point rouge n'etait dessine que sur les
      // tuiles qui agissent.
      const etat = agit ? 'action'
        : (a.en_retard > 0 ? 'retard'
          : (a.fermees > 0 ? 'ferme'
            : (a.segments_incertains > 0 ? 'incertain'
              // ⚠ AVANT « inconnu » : un mois entierement au-dela de la fenetre
              // n'est pas « non renseigne » — personne n'a rien oublie.
              : (a.pas_encore_ouvertes > 0 ? 'attente'
                : (a.non_renseignees > 0 ? 'inconnu' : 'rien')))))
      const POURQUOI = {
        retard: {
          court: `${a.en_retard} en retard`,
          long: `${a.en_retard} nuit(s) en retard sur leur rythme : à ce délai, l’an dernier, la nuit comparable était déjà vendue. Les prix en place sont ceux que le moteur suggère — c’est donc le rythme de vente qu’il faut regarder, pas le tarif.`
        },
        ferme: {
          court: `${a.fermees} fermée${a.fermees > 1 ? 's' : ''}`,
          long: `${a.fermees} nuit(s) fermée(s) à la vente : aucun prix ne peut s’y vendre. C’est un manque à gagner, pas un mois calme. Leur prix prévu, quand il est calculable, est affiché dans le mois — ouvrez-les au calendrier (ou libérez l’indisponibilité) pour les vendre.`
        },
        incertain: {
          court: 'incertain',
          long: `${a.segments_incertains} nuit(s) hors de la couverture du calendrier scolaire : leurs segments sont incertains, donc aucune suggestion n’est proposée.`
        },
        attente: {
          court: `${a.pas_encore_ouvertes} pas encore ouverte${a.pas_encore_ouvertes > 1 ? 's' : ''}`,
          long: `${a.pas_encore_ouvertes} nuit(s) au-delà de la fenêtre de vente pilotée par YieldFlow. Ce n’est pas une fermeture : la fenêtre glisse chaque jour et elles s’ouvriront seules${a.premiere_ouverture ? `, la première le ${dateFr(a.premiere_ouverture)}` : ''}, avec leur prix déjà prêt.`
        },
        inconnu: {
          court: 'non renseigné',
          long: `${a.non_renseignees} nuit(s) non renseignée(s) : votre calendrier ne va pas jusque-là, personne n’a encore dit si elles étaient ouvertes.`
        },
        rien: { court: '—', long: 'Rien à changer : les prix en place sont ceux que le moteur suggère.' }
      }
      // Le CA de la tuile : vendu a ce jour, contre l'an dernier au meme delai
      // (mois passe : mois entier contre mois entier). Sans N-1 exploitable,
      // le montant seul — jamais « 0 € » d'an dernier.
      const ca = m.ca && m.ca.a_date != null ? m.ca : null
      const caN1 = ca && ca.n1 != null && !ca.non_calculable ? ca.n1 : null
      const caV = caN1 != null && ca.variation != null ? Math.round(ca.variation * 100) : null
      // ⚠ « MOIS ENTIER » N'EST PROMIS QUE SUR LES VENTES DATEES : une
      // reservation importee sans date de vente fiable n'entre pas dans ce
      // chiffre (releve en relecture). Quand le mois en porte, le survol le dit.
      const caReserve = ca && ca.fiable === false ? ' — sur les ventes datées seulement, les réservations importées sans date de vente n’y sont pas' : ''
      const caTitre = ca
        ? (m.passe
          ? `CA du mois ${euros(ca.a_date)}${caN1 != null ? ` contre ${euros(caN1)} l’an dernier${caV != null ? ` (${caV >= 0 ? '+' : ''}${caV} %)` : ''}` : ''}${caReserve}`
          : `CA vendu à ce jour ${euros(ca.a_date)}${caN1 != null ? ` contre ${euros(caN1)} l’an dernier au même délai${caV != null ? ` (${caV >= 0 ? '+' : ''}${caV} %)` : ''}` : ''}${caReserve}`)
        : null
      const titre = [
        `${nom} — ${m.nuits} nuit(s)`,
        caTitre,
        agit ? `${m.a_monter} à monter, ${m.a_baisser} à baisser` : null,
        agit ? `${m.gain >= 0 ? '+' : ''}${m.gain} € si tout appliqué` : null,
        m.vendues ? `${m.vendues} vendue(s)` : null,
        agit ? (alerte ? alerte.t : null) : POURQUOI[etat].long
      ].filter(Boolean).join(' · ')
      return `<button class="yp-rm e-${etat} ${m.passe ? 'passe' : ''}" data-mois="${ech(m.periode)}"
        aria-current="${m.affiche ? 'true' : 'false'}" title="${ech(titre)}">
        ${alerte ? `<span class="yp-al ${alerte.c}"></span>` : ''}
        <span class="m">${ech(nom)}</span>
        ${agit
          ? `<span class="g ${m.gain > 0 ? 'hausse' : (m.gain < 0 ? 'baisse' : '')}">${m.gain >= 0 ? '+' : ''}${m.gain}&nbsp;€</span>
             <span class="a">${m.a_monter ? `<b class="up">↑${m.a_monter}</b>` : ''}${m.a_monter && m.a_baisser ? ' ' : ''}${m.a_baisser ? `<b class="dn">↓${m.a_baisser}</b>` : ''}</span>`
          : `<span class="pourquoi">${ech(POURQUOI[etat].court)}</span>`}
        ${ca ? `<span class="ca"><b>${euros(ca.a_date)}</b>${caN1 != null
          ? `<span class="n1 ${caV == null ? '' : (caV >= 0 ? 'up' : 'dn')}">vs ${euros(caN1)}</span>` : ''}</span>` : ''}
      </button>`
    }).join('')}</div>`
  }

  // ⚠ UNE LÉGENDE, UNE FOIS. C'est le prix à payer pour que les lignes n'aient
  // aucun mot d'état : la couleur ne s'explique pas toute seule, mais elle ne
  // s'explique qu'une fois — contre trente répétitions auparavant.
  function legende (d) {
    const p = d.nuits.some(n => n.delai_jours < 0)
    // ⚠ NE PARLER DE LA FENETRE QUE SI ELLE EXISTE — releve en review. Un
    // hote en mode calendrier (tous les biens aujourd'hui) lisait une legende
    // sur une « fenetre de vente pilotee par YieldFlow » qu'il n'a pas, et
    // cherchait la ligne bleue qui n'existe pas.
    const a = (d.nuits || []).some(n => n.hors_fenetre)

    const c = (couleur, texte, titre = '') =>
      `<span class="yp-lg" title="${ech(titre)}"><i style="background:${couleur}"></i>${texte}</span>`
    const b = (couleur, texte, titre = '') =>
      `<span class="yp-lg barre" title="${ech(titre)}"><i style="background:${couleur}"></i>${texte}</span>`
    return `<div class="yp-legende">
      ${c('#E8F2EC', 'vendue', 'Cette nuit est vendue : son prix ne se change plus.')}
      ${c('#EDF4EE', 'à vendre', 'Ouverte à la vente : la teinte de la ligne est le niveau suggéré, repris de votre grille ci-dessus.')}
      ${c('#FBF1DA', 'fermée', 'Fermée à la vente : aucun prix ne s’y vend. Le prix affiché est celui que YieldFlow proposerait si vous l’ouvriez — rien n’est envoyé.')}
      ${c('#FFFFFF', 'non renseignée', 'Votre calendrier ne va pas jusqu’à cette nuit.')}
      ${a ? b('#B5C9DA', 'pas encore ouverte', 'Au-delà de la fenêtre de vente pilotée par YieldFlow. Ce n’est pas une fermeture : la fenêtre glisse chaque jour et la nuit s’ouvrira seule, avec son prix déjà prêt.') : ''}
      ${p ? c('#FAFAFA', 'passée, restée vide', 'Nuit écoulée sans être vendue. Elle ne compte plus dans les actions, mais elle reste sous vos yeux.') : ''}
      ${b('#4A7FA8', 'séjour', 'Un séjour confirmé, de l’arrivée au départ.')}
      ${b('#D2DAE2', 'non confirmé', 'Une demande ou une option : elle n’occupe pas encore la nuit, mais elle est là.')}
      ${b('#7C8B9A', 'séjour N-1 vendu à ce délai', 'L’an dernier, ce séjour était déjà vendu au nombre de jours où nous en sommes.')}
      ${b('#D5DBE1', 'N-1 vendu plus tard', 'Il s’était vendu, mais plus tard que le délai actuel : rien à en conclure.')}
      <span class="yp-lg"><b style="color:var(--text)">128&nbsp;€</b> l’an dernier, déjà vendue à ce délai</span>
      <span class="yp-lg"><span style="color:var(--text3)">128&nbsp;€</span> l’an dernier, vendue plus tard</span>
    </div>`
  }

  // ⚠ LE BLOC DES COMPTEURS DU MOIS (« 0 à monter, 0 à baisser, 2 fermées,
  // +0 € si tout appliqué » et sa note) A ETE SUPPRIME — demande de Thierry,
  // recette du 22 septembre 2026 : « il n'a pas d'intérêt ». Les tuiles du
  // radar portent deja ces comptes, mois par mois, et le tableau les detaille.
  // ⚠ LA TENDANCE DU MOIS SE DIT ICI, ET NULLE PART AILLEURS.
  // C'est la couche « pression » du moteur : elle vaut pour les trente nuits à
  // la fois. Elle vivait dans la justification de CHAQUE ligne — trente fois la
  // même phrase, qui noyait le seul motif propre à la nuit.
  // ⚠ ET SEULEMENT QUAND ELLE AGIT. Une tendance « dans la fourchette » ne
  // déplace aucun prix : l'annoncer serait une couche muette affichée.
  function tendanceDuMois (d) {
    const p = d.pression ? d.pression[d.pied ? d.pied.periode : ''] : null
    if (!p || p.ecart == null) return ''
    const exemple = d.nuits.find(n => (n.couches || [])
      .some(c => c.nom === 'pression' && c.agit && c.resume))
    if (!exemple) return ''
    const couche = exemple.couches.find(c => c.nom === 'pression')
    const sens = couche.deplacement > 0 ? 'hausse' : 'baisse'
    return `<div class="yp-tete"><p class="yp-mois-dit"><strong class="${sens}">Ce mois-ci</strong> —
      ${ech(couche.resume)}. Cela vaut pour toutes les nuits du mois.</p></div>`
  }

  // ÉTAGE 1 — une ligne par jour, précédée de LA GRILLE de son segment.
  function tableau (d) {
    let segCourant = null
    const lignes = []
    const sj = d.sejours || { annee: [], n1: [] }
    d.nuits.forEach((n, i) => {
      if (n.segment !== segCourant) {
        segCourant = n.segment
        lignes.push(`<tr class="yp-sep"><td colspan="6">${enTeteDeGroupe(d, n)}</td></tr>`)
      }
      lignes.push(ligne(n, sj.annee[i] || null, sj.n1[i] || null))
    })
    return `<div class="yp-wrap"><table class="yp-table">
      <thead>
        <tr class="yp-moities">
          <th></th>
          <th class="m-pilotage">Ce que je pilote</th>
          <th class="m-passe" colspan="4">Ce sur quoi je m’appuie</th>
        </tr>
        <tr>
          <th>Jour</th>
          <th class="sep-g">Prix&nbsp;→&nbsp;suggestion</th>
          <th class="sep-g">Réalisé</th>
          <th>L’an dernier</th>
          <th colspan="2" title="À gauche vos séjours, à droite ceux de l’an dernier ramenés sur les mêmes jours de semaine (décalage continu de 52 semaines).">Séjours</th>
        </tr>
      </thead>
      <tbody>${lignes.join('')}</tbody>
    </table></div>`
  }

  // ⚠ UNE SEULE TABLE DE TEINTES, pour la grille comme pour les lignes. Si la
  // légende ne portait pas les couleurs du tableau, ce ne serait pas une
  // légende.
  const CLASSES = {
    Base: 'n-base', Moyen: 'n-moyen', Haut: 'n-haut',
    'Très haut': 'n-tres-haut', Exceptionnel: 'n-exceptionnel'
  }

  // ⚠ LA GRILLE DU BIEN, UNE FOIS, EN TÊTE DE PAGE — passe 5.
  // Cinq cartes de prix différentes obligeaient l'hôte à retenir quelle grille
  // s'appliquait à quelle ligne. Il n'y en a plus qu'une : c'est SA grille, et
  // chaque période s'y positionne.
  function grilleDuBien (d) {
    const b = d.grille.base
    if (!b || !b.fiable) {
      return `<div class="yp-grille"><div class="yp-carte-avert">
        Pas encore de grille — trop peu d’historique sur ce logement
        (${b ? b.echantillon : 0} nuit(s)).</div></div>`
    }
    return `<div class="yp-grille">
      <div class="yp-grille-tete">Votre grille
        <span class="yp-grille-n" title="${ech(`Construite sur ${b.echantillon} nuits vendues et ${b.reservations} réservations, entre ${euros(b.min)} et ${euros(b.max)}.`)}">${b.echantillon} nuits</span></div>
      <div class="yp-niveaux">
        ${b.niveaux.map((n, i) => {
          const f = fourchette(b, i)
          return `<div class="yp-niv ${CLASSES[n.nom] || ''} ${i === 1 ? 'socle' : ''}"
          title="${ech(`${n.nom} — ${n.etire
            ? `mesuré à ${n.prix_mesure} €, étiré à ${n.prix} € pour garder au moins 5 % d’écart avec le niveau précédent (deux niveaux trop proches ne sont pas deux niveaux).`
            : `mesuré à ${n.prix_mesure} €, arrondi à ${n.prix} €.`}${
            n.confondu_avec ? ` Se confond avec ${n.confondu_avec} : au-delà, ce serait un prix jamais obtenu.` : ''}${
            f ? ` ${phraseFourchette(b)}` : ''}`)}">
          <div class="n">${ech(n.nom)}${n.etire ? '<sup>*</sup>' : ''}</div>
          <div class="p">${f ? `${n.prix}–<span class="haut">${euros(b.plafond)}</span>` : euros(n.prix)}</div>
        </div>`
        }).join('')}
      </div>
      ${b.niveaux.some(n => n.etire)
        ? '<div class="yp-grille-note"><sup>*</sup> niveau étiré pour garder 5 % d’écart — il reste dans vos prix pratiqués.</div>'
        : ''}
      ${b.plafond != null
        ? `<div class="yp-grille-note">Exceptionnel : ${euros(b.niveaux[b.niveaux.length - 1].prix)} sans preuve. Une nuit ne monte au-delà que si sa nuit comparable de l’an dernier s’est vendue plus cher — et jamais au-dessus du <b>plafond de ${euros(b.plafond)}</b>, le prix le plus élevé atteint par au moins deux réservations : une borne, pas un prix visé. Il monte seul dès qu’une deuxième réservation atteint un prix plus haut ; au-delà, c’est vous qui posez le prix (✎). Les autres niveaux peuvent aussi monter, jusqu’à ce plafond, quand la nuit comparable de l’an dernier s’est vendue plus cher : la nuit affiche alors son prix et « prouvé le … ».${!(Number(d.bien && d.bien.inventory_units) > 1) ? ' Un seul logement : chaque nuit de l’an dernier est une vente unique, donc toute prime repose sur une seule vente (référence amincie).' : ''}</div>`
        : ''}
    </div>`
  }

  // ⚠ LA FOURCHETTE EXCEPTIONNEL (lot V2.0.7) : seulement le dernier niveau, et
  // seulement quand le plafond depasse son prix (le moteur rend `null` sinon).
  const fourchette = (b, i) => !!(b && b.plafond != null && i === b.niveaux.length - 1)
  const phraseFourchette = b => `Fourchette ${b.niveaux[b.niveaux.length - 1].prix}–${b.plafond} € : sans preuve, la nuit reste à ${b.niveaux[b.niveaux.length - 1].prix} € ; elle ne monte que si sa nuit comparable de l’an dernier s’est vendue plus cher. Plafond ${b.plafond} € : le prix le plus élevé atteint par au moins deux réservations — une borne, pas un objectif ; au-delà, c’est vous qui posez le prix (✎).`
  // La preuve (ou le retrait de la prime) SUR LA LIGNE : une nuit posee dans la
  // fourchette affiche SON prix et d'ou il vient ; une prime retiree se dit —
  // jamais un prix qui chute sans phrase. Les autres absences de prime se
  // lisent au detail de la nuit.
  function preuveLigne (n) {
    // La fourchette (A) ou le plancher N-1 (B) : la meme preuve, la meme ligne.
    const p = n.prime_exceptionnel || n.releve_n1
    if (!p) return ''
    if (p.prix != null) {
      return `<span class="yp-preuve" title="${ech(p.resume + (n.fourchette_exceptionnel && !p.plafonne ? ` Fourchette ${n.fourchette_exceptionnel.bas}–${n.fourchette_exceptionnel.plafond} € ; le plafond est le prix atteint par au moins deux réservations.` : ''))}">prouvé le ${p.preuve_autre_jour ? `${ech(p.preuve_autre_jour.jour_preuve)} ` : ''}<b>${ech(dateFr(p.preuve_date))}</b>${p.preuve_autre_jour && p.preuve_autre_jour.prudent ? ' · minimum prudent' : ''}${p.reference_amincie && !p.amincie_systematique ? ' · 1 vente' : ''}${p.plafonne ? ' · <b>plafonné</b>' : ''}</span>`
    }
    const quoi = p === n.releve_n1 ? 'relèvement retiré' : 'prime retirée'
    if (p.motif_sans_prime === 'prime_retiree_par_la_pression') {
      return `<span class="yp-rien" title="${ech(p.resume)}">${quoi}${p.ecart_pression != null ? ` −${Math.abs(Math.round(p.ecart_pression * 100))} %` : ''}</span>`
    }
    // Le delai et le reglage de l'hote retirent aussi : la ligne le dit, le
    // survol et le detail disent pourquoi (arbitrages de Thierry).
    if (p.motif_sans_prime === 'releve_retire_par_le_delai') {
      return `<span class="yp-rien" title="${ech(p.resume)}">${quoi} · la nuit approche</span>`
    }
    if (p.motif_sans_prime === 'releve_non_repris_reglage_de_l_hote') {
      return `<span class="yp-preuve" title="${ech(p.resume)}">N-1 non repris · votre réglage</span>`
    }
    return ''
  }

  // ⚠ UN CONTEXTE NE PORTE PLUS DE PRIX : IL PORTE UN NIVEAU.
  // C'est la phrase de Thierry, rendue telle quelle : « Toussaint : niveau
  // Haut, ses week-ends : Très haut. »
  function enTeteDeGroupe (d, n) {
    const seg = n.segment
    const p = d.grille.positions ? d.grille.positions[seg] : null
    const nom = n.libelle || nomSegment(seg)
    if (!p || !p.fiable) {
      return `<div class="yp-groupe"><div class="yp-groupe-nom">${ech(nom)}</div>
        <div class="yp-carte-avert">Pas assez d’historique pour situer cette période sur votre grille.</div>
      </div>`
    }
    // Les jours de la période qui se positionnent AILLEURS qu'elle.
    const ecarts = []
    for (const [cle, pj] of Object.entries(d.grille.positions_jour || {})) {
      if (!pj.fiable || !cle.startsWith(`${seg}|`)) continue
      if (pj.indice === p.indice) continue
      ecarts.push({ jour: cle.split('|')[1], niveau: pj.niveau, indice: pj.indice })
    }
    // ⚠ ON GROUPE PAR NIVEAU. « sauf les samedis Haut, les vendredis Haut »
    // énumère deux fois la même information : ce sont les vendredis ET les
    // samedis qui sont Haut, et c'est une seule chose à retenir.
    const parNiveau = new Map()
    for (const e of ecarts.sort((a, b) => b.indice - a.indice)) {
      if (!parNiveau.has(e.niveau)) parNiveau.set(e.niveau, [])
      parNiveau.get(e.niveau).push(e.jour)
    }
    const b = d.grille && d.grille.base
    const pastille = niv => `<span class="yp-niv-badge ${CLASSES[niv] || ''}"${
      b && b.plafond != null && b.niveaux[b.niveaux.length - 1].nom === niv
        ? ` title="${ech(phraseFourchette(b))}"` : ''}>${ech(niv)}</span>`
    // ⚠ LE PLURIEL PORTE SUR CHAQUE JOUR, pas sur le dernier : « les samedi et
    // vendredis » se lisait comme une faute, et une faute dans l'interface use
    // la confiance aussi surement qu'un chiffre faux.
    const etFr = l => {
      const p = l.map(x => `${x}s`)
      return p.length > 1 ? `${p.slice(0, -1).join(', ')} et ${p[p.length - 1]}` : p[0]
    }
    return `<div class="yp-groupe">
      <div class="yp-groupe-nom">${ech(nom)} :</div>
      ${pastille(p.niveau)}
      ${p.reference_empruntee
        ? `<span class="yp-indic" title="${ech(`Vous n’avez que ${p.echantillon_propre ?? 0} nuit(s) d’historique sur ce type de période — trop peu pour la situer. Le moteur reprend la position de « ${p.reference_empruntee} », le comportement le plus proche. Sans cet emprunt, il n’y aurait aucune suggestion ici.`)}">position empruntée</span>`
        : ''}
      ${parNiveau.size
        ? `<span class="yp-groupe-sauf">sauf ${[...parNiveau].map(([niv, jours]) =>
            `les ${ech(etFr(jours))} ${pastille(niv)}`).join(' · ')}</span>`
        : ''}
    </div>`
  }

  // ⚠ UNE NUIT PROJETEE DIT LA BONNE CONDITION — une table, lue par la ligne,
  // le depliant et la pop-up. Une indisponibilite de l'hote ne se « rouvre »
  // pas au calendrier (refuse) : elle se leve dans l'indisponibilite elle-meme
  // (review du 23 septembre 2026). Rien n'est jamais envoye.
  const TEXTES_PROJECTION = {
    fenetre: { ligne: 's’ouvrira seule', case: 'pas encore en vente : prix prévu',
      survol: '', detail: 'Cette nuit n’est pas encore en vente : voici le prix auquel YieldFlow l’ouvrira.' },
    fermee: { ligne: 'fermée · si vous l’ouvrez', case: 'fermée : prix prévu si vous l’ouvrez',
      survol: 'Cette nuit est fermée à la vente. Voici le prix que YieldFlow proposerait si vous l’ouvriez au calendrier — rien n’est envoyé, et YieldFlow ne rouvre jamais une nuit que vous avez fermée.',
      detail: 'Cette nuit est fermée à la vente : voici ce que YieldFlow proposerait si vous l’ouvriez. Rien n’est envoyé.' },
