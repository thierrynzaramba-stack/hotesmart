<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « LA TEMPÉRATURE DU MARCHÉ » — intégrée au socle V5 le 15 novembre
     2026 (docs/specs/spec-integration-v5-lot-2.md). La FORME change, pas le
     fond : mêmes appels, mêmes blocs, mêmes états.
     ⚠ LECTURE SEULE (pipeline AirROI, spec §15 de docs/kb/chantier-nouveau-bien.md).
     Elle n'écrit rien, ne pilote rien, n'affiche AUCUN prix, et n'est reliée à
     aucun menu (accès par l'adresse directe). PIPELINE ÉTANCHE : rien de
     l'historique des ventes n'entre ici.
     RÈGLES V5 : aucun hexa, aucun texte en dur, aucune icône dessinée ici. -->
<style>
  /* Les couleurs des quatre niveaux, la légende, le calendrier et son
     détail : shared/temperature-calendrier.js (commun avec le marché global). */
  .mt-carte { border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px 18px; background: var(--surface); }
  .mt-carte h2 { font-size: 16px; font-weight: var(--fw-bold); margin: 0 0 4px; }
  .mt-carte .sous { font-size: var(--fs-small); color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
  .mt-meta { font-size: var(--fs-small); color: var(--muted); margin: 0; }
  .non-calc { color: var(--muted); font-style: italic; }
  .mt-table { width: 100%; border-collapse: collapse; font-size: var(--fs-small); }
  .mt-table th { text-align: start; font-weight: var(--fw-semibold); color: var(--muted); font-size: var(--fs-caption); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .mt-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .mt-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .mt-semaine { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .mt-semaine div { text-align: center; font-size: var(--fs-caption); }
  .mt-semaine .tc-badge { display: block; margin-top: 3px; }
  .mt-evt { padding: 8px 0; border-top: 1px solid var(--line); font-size: var(--fs-small); }
  .mt-evt:first-child { border-top: 0; }
  svg.mt { width: 100%; height: auto; display: block; }
  svg.mt text { font-size: 11px; fill: var(--muted); font-family: inherit; }
  svg.mt .axe { stroke: var(--border); stroke-width: 1; }
  #mt-corps { display: flex; flex-direction: column; gap: var(--gap-m); }
  @media (max-width: 640px) {
    .mt-carte { padding: 12px; }
    .mt-defile svg.mt { min-width: 600px; }
    .mt-defile .mt-table { min-width: 560px; }
  }
</style>
</head>
<body class="out-page out-pont">

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page out">
  <div class="out-tete">
    <div class="out-tete__titre"><h1 class="h1" data-i18n="mt.titre"></h1></div>
  </div>
  <nav class="seg out-yf" data-yf-onglets data-i18n-attr="aria-label:yfnav.aria"></nav>

  <div class="out-note out-note--avertir" id="mt-avertir" data-riche="mt.avertir"></div>

  <label class="out-choix"><span data-i18n="yfm.logement"></span> <select id="mt-bien" class="out-saisie"></select></label>
  <p class="mt-meta" id="mt-meta"></p>
  <div id="mt-corps"><p class="mt-meta" data-i18n="yfm.lecture_marche"></p></div>
</main>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
  // ⚠ LECTURE SEULE : la liste des logements du compte, puis un GET sur
  // /api/marche-temperature. Aucune ecriture, aucun appel AirROI, aucun prix.
  import { requireAuth } from '/components/auth-guard.js'
  import { compteCourant, enteteCompte, peutLire, estTitulaire, comptes, basculerVers } from '/shared/compte-courant.js'
  import { sansArchives } from '/shared/biens-vivants.js'
  import { supabase, signOut } from '/shared/supabase.js'
  import { initErrorHandler } from '/shared/error-handler.js'
  import { renderOnboardingBanner } from '/components/onboarding-banner.js'
  import { monterCoquille, tHtml, brut, jourIso, moisIso } from '/shared/page-outil.js'
  import { monterOngletsYieldFlow } from '/shared/yieldflow-onglets.js'
  import { monterCalendrierTemperature, ech, badge, parlerLangue } from '/shared/temperature-calendrier.js'

  initErrorHandler()
  const el = id => document.getElementById(id)
  const t = (k, v) => I18n.t(k, v)
  const th = (k, v) => tHtml(t, k, v)
  const jour = iso => jourIso(I18n, iso)
  const mois = m => moisIso(I18n, m)
  const moisCourt = m => moisIso(I18n, m, { month: 'short', year: '2-digit' })

  let session = null
  let jeton = 0
  let donnees = null

  async function init () {
    await I18n.init()
    // Le calendrier commun parle la langue de l'hote (ses mots, ses dates).
    parlerLangue(I18n)
    session = await requireAuth()
    if (!session) return
    document.addEventListener('i18n:changed', () => location.reload())
    monterCoquille({
      HSNav, I18n, session, titre: t('mt.titre'),
      compte: { comptes, compteCourant, basculerVers, estTitulaire, peutLire },
      deconnexion: () => signOut()
    })
    monterOngletsYieldFlow(document.querySelector('[data-yf-onglets]'), null, t)
    // Le bandeau d'incitation que l'ancienne barre latérale posait : gardé
    // (spec du lot 1, §3.1 et §8), sans attente.
    renderOnboardingBanner().catch(() => {})
    const compte = compteCourant()
    // ⚠ UN LOGEMENT ARCHIVE NE PARAIT PLUS DANS LE SELECTEUR (point 7 du constat
    // de Thierry du 3 novembre 2026). Cette lecture est CLIENT — elle passe par
    // la RLS, pas par un endpoint —, donc aucun filtre serveur ne pouvait
    // l'atteindre : la regle vit dans `/shared/biens-vivants.js`, en un seul
    // exemplaire pour les six ecrans qui l'emploient.
    let q = sansArchives(supabase.from('properties').select('id, name')).order('name')
    if (compte) q = q.eq('user_id', compte)
    const { data, error } = await q
    if (error) return corps(`<p class="non-calc">${th('yfm.biens_illisibles')}</p>`)
    if (!data || !data.length) return corps(`<p class="non-calc">${th('yfm.aucun_bien')}</p>`)
    el('mt-bien').innerHTML = data.map(b => `<option value="${ech(b.id)}">${ech(b.name)}</option>`).join('')
    el('mt-bien').addEventListener('change', charger)
    charger()
  }

  function corps (html) { el('mt-corps').innerHTML = html }

  async function charger () {
    const j = ++jeton
    corps(`<p class="mt-meta">${th('yfm.lecture_marche')}</p>`); el('mt-meta').innerHTML = ''
    let r
    try {
      r = await fetch(`/api/marche-temperature?property_id=${encodeURIComponent(el('mt-bien').value)}`, {
        headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte() } })
    } catch (e) { if (j === jeton) corps(`<p class="non-calc">${th('yfm.serveur_muet')}</p>`); return }
    if (j !== jeton) return
    if (!r.ok) return corps(`<p class="non-calc">${th('yfm.statut', { statut: r.status })}</p>`)
    let d
    try { d = await r.json() } catch (e) { if (j === jeton) corps(`<p class="non-calc">${th('yfm.illisible')}</p>`); return }
    if (j !== jeton) return
    if (d.etat === 'marche_inconnu') return corps(`<p class="non-calc">${d.motif ? th('yfm.marche_inconnu_motif', { motif: d.motif }) : th('yfm.marche_inconnu')}</p>`)
    if (d.etat === 'capture_absente') return corps(`<p class="non-calc">${th('mt.capture_absente', { localite: d.marche && d.marche.localite, motif: d.motif })}</p>`)
    if (d.etat !== 'calcule' || !Array.isArray(d.jours) || !d.jours.length) return corps(`<p class="non-calc">${th('mt.aucun_jour')}</p>`)
    donnees = d
    el('mt-meta').innerHTML = th('mt.meta', { localite: brut(`<b>${ech(d.marche.localite)}</b>`), region: d.marche.region, pays: d.marche.pays, date: jour(d.capture_le), n: d.jours.length })
    peindre()
  }

  function peindre () {
    corps(blocCalendrier() + blocMois() + blocSemaine() + blocEvenements() + blocSuggestions() + blocCourbe())
    monterCalendrierTemperature(el('mt-calendrier'), donnees.jours)
  }

  // ─── 1. Le calendrier, mois par mois (module commun) ──────────────────────
  function blocCalendrier () {
    return `<div class="mt-carte"><h2>${th('mt.cal_titre')}</h2>`
      + `<p class="sous">${th('mt.cal_sous')}</p>`
      + `<div id="mt-calendrier"></div></div>`
  }

  // ─── 2. Le diagnostic mensuel ─────────────────────────────────────────────
  const AVANTAGE = { week_end: 'mt.avantage_week_end', semaine: 'mt.avantage_semaine', egal: 'mt.avantage_egal' }
  function blocMois () {
    const lignes = donnees.mois.map(m => `<tr><td>${ech(mois(m.mois))}</td><td>${badge(m.niveau)}</td>`
      + `<td>${badge(m.niveau_week_end)}</td><td>${badge(m.niveau_semaine)}</td><td>${AVANTAGE[m.avantage] ? th(AVANTAGE[m.avantage]) : '—'}</td>`
      + `<td>${m.evenements.length ? ech(m.evenements.join(', ')) : '—'}</td></tr>`).join('')
    return `<div class="mt-carte"><h2>${th('mt.mois_titre')}</h2>`
      + `<p class="sous">${th('mt.mois_sous')}</p>`
      + `<div class="mt-defile"><table class="mt-table"><thead><tr><th>${th('mt.col_mois')}</th><th>${th('yfm.col_niveau')}</th><th>${th('mt.col_week_end')}</th><th>${th('mt.col_semaine')}</th><th>${th('mt.col_avantage')}</th><th>${th('mt.col_evenements')}</th></tr></thead>`
      + `<tbody>${lignes}</tbody></table></div></div>`
  }

  // ─── 3. Week-end ou semaine ───────────────────────────────────────────────
  function blocSemaine () {
    const w = donnees.week_end_ou_semaine
    const verdict = w.verdict === 'week_end' ? th('mt.verdict_week_end')
      : w.verdict === 'semaine' ? th('mt.verdict_semaine')
        : th('mt.verdict_egal')
    const jours = w.par_jour.map(p => `<div>${ech(p.jour_semaine)}${badge(p.niveau)}</div>`).join('')
    return `<div class="mt-carte"><h2>${th('mt.sem_titre')}</h2>`
      + `<p class="sous">${verdict} ${th('mt.sem_decompte', { mois: donnees.mois.length, we: w.mois_week_end, sem: w.mois_semaine, egaux: w.mois_egaux })}</p>`
      + `<div class="mt-semaine">${jours}</div>`
      + `<p class="sous">${th('mt.sem_meilleur', { meilleur: w.meilleur, pire: w.pire })}</p></div>`
  }

  // ─── 4. Les événements ────────────────────────────────────────────────────
  function blocEvenements () {
    if (!donnees.evenements.length) return ''
    const lignes = donnees.evenements.map(e => `<div class="mt-evt"><b>${ech(e.nom)}</b> ${badge(e.niveau)}<br>`
      + e.occurrences.map(o => `${ech(jour(o.debut))}${o.fin !== o.debut ? ` → ${ech(jour(o.fin))}` : ''} (${th('yfm.nuits', { n: Number(o.nuits) || 0 })})`).join(' · ')
      + `</div>`).join('')
    return `<div class="mt-carte"><h2>${th('mt.evt_titre')}</h2>`
      + `<p class="sous">${th('mt.evt_sous')}</p>${lignes}</div>`
  }

  // ─── 5. Les événements à créer dans YieldFlow ─────────────────────────────
  function blocSuggestions () {
    const lignes = donnees.suggestions.map(s => {
      const periode = s.type === 'saisonnier'
        ? (s.debut === s.fin ? ech(mois(s.debut)) : `${ech(mois(s.debut))} → ${ech(mois(s.fin))}`)
        : (s.debut === s.fin ? ech(jour(s.debut)) : `${ech(jour(s.debut))} → ${ech(jour(s.fin))}`)
      return `<tr><td>${ech(s.nom)}</td><td>${th(s.type === 'saisonnier' ? 'mt.type_saison' : 'mt.type_evenement')}</td><td>${periode}</td><td>${badge(s.niveau)}</td><td>${th(s.recurrent ? 'yfm.oui' : 'yfm.non')}</td></tr>`
    }).join('')
    return `<div class="mt-carte"><h2>${th('mt.sugg_titre')}</h2>`
      + `<p class="sous">${th('mt.sugg_sous')}</p>`
      + `<div class="mt-defile"><table class="mt-table"><thead><tr><th>${th('mt.col_nom')}</th><th>${th('mt.col_type')}</th><th>${th('mt.col_periode')}</th><th>${th('yfm.col_niveau')}</th><th>${th('mt.col_recurrent')}</th></tr></thead>`
      + `<tbody>${lignes}</tbody></table></div></div>`
  }

  // ─── 6. La courbe mensuelle, avec les bandes des 4 niveaux ────────────────
  function blocCourbe () {
    const pts = donnees.courbe
    if (!pts.length) return ''
    const s = donnees.seuils
    const L = 640, H = 220, g = 36, d = 10, h = 16, b = 46
    const vals = pts.map(p => p.ecart)
    const min = Math.min(-6, Math.floor(Math.min(...vals)) - 1)
    const max = Math.max(10, Math.ceil(Math.max(...vals)) + 1)
    const y = v => h + (max - v) / (max - min) * (H - h - b)
    const x = i => g + i * (L - g - d) / Math.max(1, pts.length - 1)
    const bande = (de, a, n) => `<rect x="${g}" width="${L - g - d}" y="${y(Math.min(a, max))}" height="${Math.max(0, y(Math.max(de, min)) - y(Math.min(a, max)))}" fill="var(--tc-${n})" opacity="0.65"></rect>`
    const bandes = bande(min, s.creux, 'creux') + bande(s.creux, s.favorable, 'modere') + bande(s.favorable, s.pic, 'favorable') + bande(s.pic, max, 'pic')
    const ligne = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.ecart).toFixed(1)}`).join(' ')
    const graduations = [s.creux, 0, s.favorable, s.pic].map(v => `<text x="${g - 6}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? '+' : ''}${v}</text>`).join('')
    const axe = pts.map((p, i) => i % 3 === 0 ? `<text x="${x(i)}" y="${H - b + 16}" text-anchor="middle">${ech(moisCourt(p.mois))}</text>` : '').join('')
    return `<div class="mt-carte"><h2>${th('mt.courbe_titre')}</h2>`
      + `<p class="sous">${th('mt.courbe_sous')}</p>`
      + `<div class="mt-defile"><svg class="mt" viewBox="0 0 ${L} ${H}" role="img" aria-label="${th('mt.courbe_aria')}">`
      + bandes + `<line class="axe" x1="${g}" x2="${L - d}" y1="${y(0)}" y2="${y(0)}" stroke-dasharray="3 3"></line>`
      + `<path d="${ligne}" fill="none" stroke="var(--text)" stroke-width="2"></path>`
      + pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.ecart).toFixed(1)}" r="2.5" fill="var(--text)"></circle>`).join('')
      + graduations + axe + `</svg></div></div>`
  }

  init().catch(e => console.error('[marche-temperature]', e))
</script>
</body>
</html>
