<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- Leaflet 1.9.4 (cdnjs), empreintes d'integrite verifiees le 5 octobre 2026. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
        integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- PAGE « CHOISIR VOS COMPARABLES » — intégrée au socle V5 le 15 novembre 2026
     (docs/specs/spec-integration-v5-lot-2.md §11). La FORME change, pas le
     fond : mêmes appels (/api/marche-comparables), mêmes gestes, mêmes états.
     ⚠ SUR UNE CARTE (spec §20 et §21 de docs/kb/chantier-nouveau-bien.md).
     En haut, le rappel du profil ; la carte, le bien de l'hôte et les biens
     proposés (plus ressemblant = plus gros) ; un clic ouvre la fiche sous la
     carte. AUCUN PRIX dans la fiche. Toute donnée venue d'AirROI est posée par
     textContent / setAttribute, jamais comme du HTML.
     RÈGLES V5 : aucun hexa (les couleurs de la carte vivent dans
     shared/theme.css, --yf-carte-*), aucun texte en dur. -->
<style>
  .cp-intro { font-size: var(--fs-small); line-height: 1.5; color: var(--muted); margin: 0; }
  .cp-carte { border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px 18px; background: var(--surface); }
  .cp-carte h2 { font-size: 16px; font-weight: var(--fw-bold); margin: 0 0 4px; }
  .cp-carte .sous { font-size: var(--fs-small); color: var(--muted); margin: 0 0 12px; line-height: 1.45; }
  .cp-meta { font-size: var(--fs-small); color: var(--muted); margin: 6px 0 12px; }
  .non-calc { color: var(--muted); font-style: italic; }
  #cp-bien { max-width: 100%; }
  /* Le rappel du profil. */
  .cp-recap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .cp-recap-texte { font-size: var(--fs-small); line-height: 1.5; }
  .cp-recap-texte b { font-weight: var(--fw-semibold); }
  /* Le formulaire. */
  .cp-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 16px; }
  .cp-form label { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-small); font-weight: var(--fw-semibold); }
  .cp-form label small { font-weight: var(--fw-regular); color: var(--muted); font-size: var(--fs-caption); line-height: 1.35; }
  .cp-adresse { grid-column: 1 / -1; }
  .cp-eq { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 12px 0 4px; font-size: var(--fs-small); }
  .cp-eq label { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-weight: var(--fw-regular); }
  .cp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
  .cp-btn:disabled { opacity: .45; cursor: default; }
  .cp-erreur { color: var(--danger-ink); font-size: var(--fs-small); }
  .cp-ok { color: var(--ok-ink); font-size: var(--fs-small); }
  /* La carte. */
  /* isolation : les couches de Leaflet (z-index jusqu'a 1000) restent DANS la
     carte et ne passent plus sur le pied collant (review de 995f025). */
  #cp-map { width: 100%; height: 440px; border-radius: var(--radius-tile); border: 1px solid var(--line); background: var(--surface-2); isolation: isolate; }
  .cp-legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-caption); color: var(--muted); margin: 8px 0 0; }
  .cp-legende i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-inline-end: 5px; }
  /* La fiche sous la carte. */
  .cp-fiche { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .cp-photos { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .cp-photos img { height: 150px; width: auto; max-width: 240px; object-fit: cover; border-radius: 8px; background: var(--surface-2); flex: 0 0 auto; }
  .cp-nom { font-size: 15px; font-weight: var(--fw-semibold); margin: 8px 0 4px; overflow-wrap: anywhere; }
  .cp-ligne { font-size: var(--fs-small); color: var(--muted); margin: 2px 0; }
  .cp-badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .cp-badge { font-size: var(--fs-caption); padding: 2px 8px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .cp-source { font-size: var(--fs-caption); font-weight: var(--fw-semibold); color: var(--ok-ink); }
  .cp-verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .cp-verdict button[aria-pressed="true"].similaire { background: var(--ok); border-color: var(--ok); color: var(--on-ink); }
  .cp-explication { font-size: var(--fs-small); color: var(--muted); line-height: 1.45; margin: 10px 0 0; }
  .cp-alerte { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 10px; margin: 8px 0 0; }
  .cp-verdict button.en-avant { outline: 2px solid var(--warn); outline-offset: 1px; }
  .cp-verdict button[aria-pressed="true"].non { background: var(--muted); border-color: var(--muted); color: var(--on-ink); }
  .cp-fondateur { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--ok-ink); margin-top: 10px; }
  .cp-entete-fiche { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
  .cp-lien { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--info); text-decoration: underline; }
  .cp-desc { font-size: var(--fs-small); line-height: 1.5; white-space: pre-line; margin: 6px 0; }
  .cp-blocs { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: var(--fs-small); margin: 8px 0; }
  .cp-blocs dt { color: var(--muted); }
  .cp-blocs dd { margin: 0; }
  .cp-tous-eq ul { columns: 2; column-gap: 18px; font-size: var(--fs-small); margin: 6px 0 0; padding-inline-start: 18px; }
  .cp-tous-eq summary, .cp-description summary { cursor: pointer; font-size: var(--fs-small); font-weight: var(--fw-semibold); min-height: 32px; padding: 6px 0; }
  .cp-liste-biens summary { cursor: pointer; font-size: var(--fs-small); font-weight: var(--fw-semibold); min-height: 32px; padding: 6px 0; }
  .cp-liste-biens ol { margin: 4px 0 0; padding-inline-start: 20px; font-size: var(--fs-small); }
  .cp-liste-biens button { font: inherit; background: none; border: 0; padding: 4px 0; color: var(--ink); cursor: pointer; text-align: start; min-height: 32px; }
  .cp-strategies { display: grid; gap: 8px; margin: 6px 0 12px; }
  .cp-strategies label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: var(--fs-small); }
  .cp-strategies label small { display: block; color: var(--muted); font-size: var(--fs-caption); margin-top: 2px; }
  .cp-sejour { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: var(--fs-small); font-weight: var(--fw-semibold); }
  .cp-sejour .out-saisie { width: 80px; }
  .cp-prix { width: 100%; border-collapse: collapse; font-size: var(--fs-small); margin: 8px 0; }
  .cp-prix th { text-align: start; color: var(--muted); font-weight: var(--fw-semibold); font-size: var(--fs-caption); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .cp-prix td { padding: 8px; border-bottom: 1px solid var(--line); }
  .cp-prix td.prix { font-size: 16px; font-weight: var(--fw-bold); }
  .cp-prix .prix { display: block; font-size: 16px; font-weight: var(--fw-bold); }
  .cp-fourchette { display: block; font-size: var(--fs-caption); color: var(--muted); }
  .cp-avert { font-size: var(--fs-small); color: var(--ink); background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }
  .cp-pied { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 0; margin-top: 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; z-index: 500; }
  @media (max-width: 640px) {
    .cp-carte { padding: 12px; }
    #cp-map { height: 60vh; }
    .cp-tous-eq ul { columns: 1; }
    .cp-photos img { height: 120px; }
    .cp-prix td, .cp-prix th { padding-left: 4px; padding-right: 4px; }
  }
  /* ⚠ LA BARRE DU BAS DU SOCLE EST FIXE sous 721 px (shared/ui.css) : le pied
     collant « Valider mes comparables » se pose AU-DESSUS d'elle, sinon il
     glissait dessous et le bouton devenait inatteignable au téléphone. */
  @media (max-width: 720px) {
    .cp-pied { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body class="out-page out-pont">

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page out">
  <div class="out-tete">
    <div class="out-tete__titre"><h1 class="h1" data-i18n="cp.titre"></h1></div>
  </div>
  <nav class="seg out-yf" data-yf-onglets data-i18n-attr="aria-label:yfnav.aria"></nav>
  <p class="cp-intro" data-riche="cp.intro"></p>

  <label class="out-choix"><span data-i18n="yfm.logement"></span> <select id="cp-bien" class="out-saisie"></select></label>

  <!-- Le rappel du profil, avec « Modifier » -->
  <div class="cp-carte" id="cp-recap" hidden>
    <div class="cp-recap">
      <div class="cp-recap-texte" id="cp-recap-texte"></div>
      <button type="button" class="btn btn--secondary cp-btn secondaire" id="cp-modifier" data-i18n="cp.modifier"></button>
    </div>
  </div>

  <!-- ÉTAPE A : décrire son bien -->
  <div class="cp-carte" id="cp-etape-a">
    <h2 data-i18n="cp.a_titre"></h2>
    <p class="sous" data-i18n="cp.a_sous"></p>
    <form id="cp-form" class="cp-form" novalidate>
      <label class="cp-adresse"><span data-i18n="cp.adresse"></span>
        <input type="text" class="out-saisie" id="cp-adresse" name="adresse" autocomplete="street-address" maxlength="200" data-i18n-attr="placeholder:cp.adresse_exemple">
        <small data-i18n="cp.adresse_aide"></small>
      </label>
      <label><span data-i18n="cp.voyageurs"></span>
        <input type="number" class="out-saisie" id="cp-voyageurs" name="voyageurs" min="1" max="30" step="1" inputmode="numeric">
      </label>
      <label><span data-i18n="cp.chambres"></span>
        <input type="number" class="out-saisie" id="cp-chambres" name="chambres" min="0" max="20" step="1" inputmode="numeric">
        <small data-riche="cp.chambres_aide"></small>
      </label>
      <label><span data-i18n="cp.pieces"></span>
        <input type="number" class="out-saisie" id="cp-pieces" name="pieces" min="1" max="30" step="1" inputmode="numeric">
        <small data-i18n="cp.pieces_aide"></small>
      </label>
      <label><span data-i18n="cp.sdb"></span>
        <input type="number" class="out-saisie" id="cp-sdb" name="salles_de_bain" min="0" max="10" step="1" inputmode="numeric">
      </label>
    </form>
    <div class="cp-eq" id="cp-eq" role="group" data-i18n-attr="aria-label:cp.eq_aria"></div>
    <div class="cp-actions">
      <button type="button" class="btn btn--primary cp-btn" id="cp-valider-a" data-i18n="cp.valider_a"></button>
      <button type="button" class="btn btn--secondary cp-btn secondaire" id="cp-annuler-a" hidden data-i18n="cp.annuler"></button>
      <span id="cp-message-a" aria-live="polite"></span>
    </div>
  </div>

  <!-- ÉTAPE B : la carte et la fiche -->
  <div class="cp-carte" id="cp-etape-b" hidden>
    <h2 data-i18n="cp.b_titre"></h2>
    <p class="sous" data-i18n="cp.b_sous"></p>
    <div id="cp-zone-liste"><p class="cp-meta" data-i18n="cp.recherche"></p></div>
    <div id="cp-zone-carte" hidden>
      <div id="cp-map" role="region" data-i18n-attr="aria-label:cp.carte_aria"></div>
      <div class="cp-legende">
        <span><i data-couleur="hote"></i><span data-i18n="cp.leg_hote"></span></span>
        <span><i data-couleur="neutre"></i><span data-i18n="cp.leg_neutre"></span></span>
        <span><i data-couleur="similaire"></i><span data-i18n="cp.leg_similaire"></span></span>
        <span><i data-couleur="non"></i><span data-i18n="cp.leg_non"></span></span>
        <span><i data-contour="equipements"></i><span data-i18n="cp.leg_equipements"></span></span>
      </div>
      <p class="cp-meta" id="cp-note-position" data-i18n="cp.note_position"></p>
      <p class="cp-erreur" id="cp-carte-erreur" hidden></p>
      <p class="cp-meta" id="cp-note" aria-live="polite"></p>
      <div id="cp-complement"></div>
      <div class="cp-fiche" id="cp-fiche" aria-live="polite"><p class="cp-meta" data-i18n="cp.toucher_point"></p></div>
      <details class="cp-liste-biens"><summary data-i18n="cp.tous_biens"></summary><ol id="cp-liste-biens"></ol></details>
      <p class="cp-meta" id="cp-hors-liste" hidden></p>
    </div>
    <div class="cp-pied">
      <button type="button" class="btn btn--primary cp-btn" id="cp-valider-b" disabled data-i18n="cp.valider_b"></button>
      <span id="cp-compte" class="cp-meta" style="margin:0" aria-live="polite"></span>
      <span id="cp-message-b" aria-live="polite"></span>
    </div>
  </div>

  <!-- ÉTAPE C : la stratégie et le séjour minimum (§22.2) -->
  <div class="cp-carte" id="cp-etape-c" hidden>
    <h2 data-i18n="cp.c_titre"></h2>
    <p class="sous" data-i18n="cp.c_sous"></p>
    <div class="cp-strategies" role="radiogroup" data-i18n-attr="aria-label:cp.strat_aria">
      <label data-i18n-attr="title:cp.strat_agressif_titre"><input type="radio" name="strategie" value="agressif"><span><b data-i18n="cp.strat_agressif"></b><small data-i18n="cp.strat_agressif_aide"></small></span></label>
      <label data-i18n-attr="title:cp.strat_juste_titre"><input type="radio" name="strategie" value="juste"><span><b data-i18n="cp.strat_juste"></b><small data-i18n="cp.strat_juste_aide"></small></span></label>
      <label data-i18n-attr="title:cp.strat_qualite_titre"><input type="radio" name="strategie" value="qualite"><span><b data-i18n="cp.strat_qualite"></b><small data-i18n="cp.strat_qualite_aide"></small></span></label>
    </div>
    <p class="cp-meta" data-i18n="cp.voix"></p>
    <label class="cp-sejour"><span data-i18n="cp.sejour_libelle"></span>
      <input type="number" class="out-saisie" id="cp-sejour-min" min="1" max="30" step="1" inputmode="numeric"> <span data-i18n="cp.sejour_unite"></span>
    </label>
    <p class="cp-meta" id="cp-marche-sejour"></p>
    <p class="cp-alerte" id="cp-alerte-sejour" hidden></p>
    <div class="cp-actions">
      <button type="button" class="btn btn--primary cp-btn" id="cp-valider-c" data-i18n="cp.valider_c"></button>
      <span id="cp-message-c" aria-live="polite"></span>
    </div>
  </div>

  <!-- ÉTAPE D : les prix de départ (§22.7) -->
  <div class="cp-carte" id="cp-etape-d" hidden>
    <h2 data-i18n="cp.d_titre"></h2>
    <p class="sous" data-i18n="cp.d_sous"></p>
    <div id="cp-zone-prix"></div>
    <p class="cp-meta" id="cp-note-prix" aria-live="polite"></p>
  </div>
</main>

  }

  }
  // ⚠ LA TABLE CI-DESSUS EST LE FRANCAIS DES LIBELLES AIRBNB (qui sont en
  // anglais). Une table PAR LANGUE, sans condition sur la langue dans le code :
  // en anglais le libelle d'Airbnb s'affiche tel quel ; une langue sans table
  // aussi (spec du lot 2, §11.4).
  const EQ_TRADUITS = { fr: EQ_FR }
  const libelleEq = e => (EQ_TRADUITS[I18n.lang] || {})[e] || e
  const ANNULATION = { Flexible: 'cp.annul_flexible', Moderate: 'cp.annul_moderee', Firm: 'cp.annul_ferme', Strict: 'cp.annul_stricte', 'Super strict': 'cp.annul_tres_stricte', 'Non-refundable': 'cp.annul_non_remboursable' }
  // Un nombre a la decimale de la langue, sans separateur ni arrondi (« 4,8 »).
  const virgule = v => I18n.num(Number(v), { maximumFractionDigits: 6, useGrouping: false })

  let session = null
  let jeton = 0
  let profil = null
  let cartes = []
  // Les jugements de l'hote : id -> 'dessous' | 'equivalent' | 'dessus' (un
  // COMPARABLE, avec sa position, §22.1) ou 'non' (pas comparable, aide de tri
  // non enregistree).
  const jugements = new Map()
  const POSITIONS = ['dessous', 'equivalent', 'dessus']
  const LIBELLE_POSITION = { dessous: 'cp.pos_dessous', equivalent: 'cp.pos_equivalent', dessus: 'cp.pos_dessus' }
  // Les equipements RARES, dits « votre X » et « un X » : une cle par forme.
  const NOM_RARE = { spa: 'cp.rare_votre_spa', piscine: 'cp.rare_votre_piscine', jardin: 'cp.rare_votre_jardin', vue: 'cp.rare_votre_vue' }
  const AVEC_ARTICLE = { spa: 'cp.rare_un_spa', piscine: 'cp.rare_un_piscine', jardin: 'cp.rare_un_jardin', vue: 'cp.rare_un_vue' }
  // Les retenus du FONDATEUR : verrouilles en vert, jamais envoyes par l'hote
  // (decision de Thierry du 5 octobre 2026).
  let fondateur = new Set()
  // Les biens que l'hote a JUGES sur cette page (meme annule) : une nouvelle
  // recherche ne les reecrase pas avec les retenus enregistres (review de 995f025).
  const touches = new Set()
  let carte = null
  const marqueurs = new Map()
  let ouvert = null
  // Chaque recherche a son numero : seule la derniere s'affiche (review de 995f025).
  let rechercheEnCours = 0
  // §22.2 : ce que pratique le marche en sejour minimum, et le nombre de
  // comparables DEJA enregistres (l'etape C s'ouvre a partir de 3).
  let marcheSejour = null
  let retenusEnregistres = 0
  // L'etape C est remplie UNE fois par logement : une nouvelle validation des
  // comparables n'efface pas une saisie en cours (review de dd8c060).
  let strategieAffichee = false
  // §22.7 : la note de coherence de chaque comparable (sa mention), et le
  // dernier etat des prix de depart.
  let prixDepart = null

  function dire (id, texte, classe) { const z = el(id); z.textContent = texte || ''; z.className = classe || '' }
  const similaires = () => [...jugements.entries()].filter(([, v]) => POSITIONS.includes(v)).map(([id]) => id)

  async function appeler (methode, corps) {
    const r = await fetch(`/api/marche-comparables?property_id=${encodeURIComponent(el('cp-bien').value)}`, {
      method: methode,
      headers: { Authorization: `Bearer ${session.access_token}`, ...enteteCompte(), ...(corps ? { 'Content-Type': 'application/json' } : {}) },
      ...(corps ? { body: JSON.stringify(corps) } : {}),
    })
    let d = null
    try { d = await r.json() } catch (e) { d = null }
    return { ok: r.ok, status: r.status, d }
  }

  async function init () {
    await I18n.init()
    session = await requireAuth()
    if (!session) return
    document.addEventListener('i18n:changed', () => location.reload())
    monterCoquille({
      HSNav, I18n, session, titre: t('cp.titre'),
      compte: { comptes, compteCourant, basculerVers, estTitulaire, peutLire },
      deconnexion: () => signOut()
    })
    monterOngletsYieldFlow(document.querySelector('[data-yf-onglets]'), 'comparables', t)
    // Le bandeau d'incitation que l'ancienne barre latérale posait : gardé.
    renderOnboardingBanner().catch(() => {})
    lireCouleurs()
    for (const i of document.querySelectorAll('[data-couleur]')) i.style.background = COULEUR[i.dataset.couleur]
    for (const i of document.querySelectorAll('[data-contour]')) { i.style.border = `3px solid ${COULEUR.equipements}`; i.style.background = 'transparent' }
    for (const cle of Object.keys(EQUIPEMENTS)) {
      const l = document.createElement('label')
      const c = document.createElement('input')
      c.type = 'checkbox'; c.value = cle; c.name = 'equipements'
      l.append(c, document.createTextNode(nomEq(cle)))
      el('cp-eq').append(l)
    }
    const compte = compteCourant()
    // ⚠ UN LOGEMENT ARCHIVE NE PARAIT PLUS DANS LE SELECTEUR (point 7 du constat
    // de Thierry du 3 novembre 2026). Cette lecture est CLIENT — elle passe par
    // la RLS, pas par un endpoint —, donc aucun filtre serveur ne pouvait
    // l'atteindre : la regle vit dans `/shared/biens-vivants.js`, en un seul
    // exemplaire pour les six ecrans qui l'emploient.
    let q = sansArchives(supabase.from('properties').select('id, name')).order('name')
    if (compte) q = q.eq('user_id', compte)
    const { data, error } = await q
    if (error || !data || !data.length) { dire('cp-message-a', t(error ? 'yfm.biens_illisibles' : 'yfm.aucun_bien'), 'cp-erreur'); return }
    for (const b of data) { const o = document.createElement('option'); o.value = b.id; o.textContent = b.name; el('cp-bien').append(o) }
    // Le bien demande par l'URL (?bien=<uuid>), pose par le menu YieldFlow du
    // calendrier. La garde `data.some(...)` : un identifiant inconnu ou d'un
    // autre compte laisse le selecteur ou il est.
    const voulu = new URLSearchParams(location.search).get('bien')
    if (voulu && data.some(b => b.id === voulu)) el('cp-bien').value = voulu
    el('cp-bien').addEventListener('change', charger)
    el('cp-valider-a').addEventListener('click', validerProfil)
    el('cp-valider-b').addEventListener('click', retenir)
    el('cp-modifier').addEventListener('click', () => montrerFormulaire(true))
    el('cp-annuler-a').addEventListener('click', () => montrerFormulaire(false))
    el('cp-valider-c').addEventListener('click', enregistrerStrategie)
    el('cp-sejour-min').addEventListener('input', afficherSejour)
    charger()
  }

  // ─── Le profil : formulaire ou rappel ─────────────────────────────────────
  function remplirFormulaire (p) {
    el('cp-adresse').value = p ? p.adresse : ''
    el('cp-voyageurs').value = p ? p.voyageurs : ''
    el('cp-chambres').value = p ? p.chambres : ''
    el('cp-pieces').value = p ? p.pieces : ''
    el('cp-sdb').value = p ? p.salles_de_bain : ''
    const eq = new Set(p && Array.isArray(p.equipements) ? p.equipements : [])
    for (const c of el('cp-eq').querySelectorAll('input')) c.checked = eq.has(c.value)
  }
  // Un nombre et son nom, accordes par la langue (« 1 voyageur », « 3 voyageurs »).
  const pluriel = (n, cle) => t(cle, { n: Number(n) })
  function afficherRecap (p) {
    const z = el('cp-recap-texte')
    z.replaceChildren()
    const b = document.createElement('b'); b.textContent = p.adresse_trouvee
    const eq = (p.equipements || []).filter(e => EQUIPEMENTS[e]).map(nomEq)
    const morceaux = [pluriel(p.voyageurs, 'cp.n_voyageurs'), p.chambres === 0 ? t('cp.studio_0') : pluriel(p.chambres, 'cp.n_chambres'),
      pluriel(p.pieces, 'cp.n_pieces'), pluriel(p.salles_de_bain, 'cp.n_sdb_entier')]
    z.append(b, document.createElement('br'), document.createTextNode(morceaux.join(' · ')), document.createElement('br'),
      document.createTextNode(eq.length ? t('cp.equipements_liste', { liste: eq.join(', ') }) : t('cp.aucun_equipement')))
  }
  // Le formulaire s'ouvre seul quand il n'y a pas de profil, ou sur « Modifier ».
  function montrerFormulaire (ouvrir) {
    el('cp-etape-a').hidden = !ouvrir
    el('cp-recap').hidden = ouvrir || !profil
    el('cp-annuler-a').hidden = !profil
    if (ouvrir) remplirFormulaire(profil)
  }

  async function charger () {
    const j = ++jeton
    profil = null; cartes = []; jugements.clear(); touches.clear(); fondateur = new Set(); ouvert = null
    marcheSejour = null; retenusEnregistres = 0; strategieAffichee = false; prixDepart = null
    el('cp-etape-d').hidden = true
    // Le bouton est rendu au nouveau logement (review de dd8c060).
    el('cp-etape-c').hidden = true; dire('cp-message-c', ''); el('cp-valider-c').disabled = false
    rechercheEnCours++
    majCompte()
    dire('cp-note', '', 'cp-meta')
    el('cp-carte-erreur').hidden = true
    el('cp-etape-b').hidden = true
    el('cp-recap').hidden = true
    el('cp-etape-a').hidden = false
    el('cp-annuler-a').hidden = true
    dire('cp-message-a', ''); dire('cp-message-b', '')
    remplirFormulaire(null)
    let r
    try { r = await appeler('GET') } catch (e) { if (j === jeton) dire('cp-message-a', t('cp.serveur_muet'), 'cp-erreur'); return }
    if (j !== jeton) return
    if (!r.ok || !r.d) return dire('cp-message-a', t('yfm.statut', { statut: r.status }), 'cp-erreur')
    if (r.d.etat === 'indisponible') { el('cp-valider-a').disabled = true; return dire('cp-message-a', r.d.message || t('cp.indisponible'), 'cp-erreur') }
    el('cp-valider-a').disabled = false
    retenusDu(r.d)
    if (!r.d.profil) return
    profil = r.d.profil
    marcheSejour = r.d.marche_sejour_min || null
    retenusEnregistres = (r.d.retenus || []).filter(id => !fondateur.has(String(id))).length
    afficherStrategie()
    afficherRecap(profil)
    montrerFormulaire(false)
    el('cp-etape-b').hidden = false
    // La liste en cache s'affiche. Sinon, rien ne part tout seul : une
    // recherche peut couter, c'est l'hote qui la lance (review de 7ace057).
    if (Array.isArray(r.d.comparables)) {
      afficher(r.d.comparables)
      dire('cp-note', noteDe(r.d), 'cp-meta')
      if (r.d.encore) boutonPlus(j)
    } else boutonChercher(j)
    // Apres la liste : un comparable « a verifier » se nomme par sa carte.
    afficherPrix(r.d.prix_depart || null)
  }

  // Les retenus enregistres : ceux de l'equipe a part (et jamais dans les
  // jugements de l'hote) ; les autres coches « similaire », SAUF ceux que l'hote
  // a deja juges sur cette page.
  function retenusDu (d) {
    fondateur = new Set((d.fondateur || []).map(String))
    for (const id of fondateur) jugements.delete(id)
    const positions = d.positions && typeof d.positions === 'object' ? d.positions : {}
    for (const id of d.retenus || []) {
      const k = String(id)
      // Un retenu sans position (avant §22) est compte « equivalent ».
      if (!fondateur.has(k) && !touches.has(k)) jugements.set(k, POSITIONS.includes(positions[k]) ? positions[k] : 'equivalent')
    }
    majCompte()
  }

  function boutonChercher (j) {
    el('cp-zone-carte').hidden = true
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'btn btn--primary cp-btn'; b.id = 'cp-chercher'; b.textContent = t('cp.chercher')
    b.addEventListener('click', () => chercher(j))
    const p = document.createElement('p'); p.className = 'cp-meta'
    p.textContent = t('cp.chercher_aide')
    el('cp-zone-liste').replaceChildren(p, b)
  }

  // §22.10 (review de 428fe8c) : d'anciens choix qui ne sont plus proposes
  // (inactifs, sans vos equipements) ne comptent plus — l'hote le sait.
  function noteDe (d) {
    const n = Number(d && d.retenus_hors_liste) || 0
    const hors = n ? t('cp.hors_liste', { n }) : ''
    return [d && d.note, hors].filter(Boolean).join(' ')
  }

  // §22.10 : 10 biens de plus (une page AirROI), tant qu'il y en a, 50 au plus.
  function boutonPlus (j) {
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'btn btn--secondary cp-btn secondaire'; b.id = 'cp-plus'
    b.textContent = t('cp.plus')
    b.addEventListener('click', () => chercher(j, 'plus'))
    const p = document.createElement('p'); p.className = 'cp-meta'
    p.textContent = t('cp.plus_aide')
    el('cp-complement').replaceChildren(p, b)
  }

  async function validerProfil () {
    const j = jeton
    const n = id => el(id).value.trim()
    const corps = {
      action: 'profil', adresse: n('cp-adresse'), voyageurs: n('cp-voyageurs'), chambres: n('cp-chambres'),
      pieces: n('cp-pieces'), salles_de_bain: n('cp-sdb'),
      equipements: [...el('cp-eq').querySelectorAll('input:checked')].map(c => c.value),
    }
    el('cp-valider-a').disabled = true
    dire('cp-message-a', t('cp.enregistrement'))
    let r
    try { r = await appeler('POST', corps) } catch (e) { r = { ok: false, d: { message: t('cp.serveur_muet') } } }
    // Le bouton n'est rendu qu'au logement qui l'a envoye (review de 7ace057).
    if (j !== jeton) return
    el('cp-valider-a').disabled = false
    if (!r.ok || !r.d || !r.d.profil) return dire('cp-message-a', (r.d && r.d.message) || t('cp.enregistrement_impossible'), 'cp-erreur')
    dire('cp-message-a', '')
    profil = r.d.profil
    afficherRecap(profil)
    montrerFormulaire(false)
    el('cp-etape-b').hidden = false
    // Un profil change, une autre recherche : les jugements de l'ancienne
    // liste ne valent plus pour les biens qui n'y sont plus (afficher le fait).
    chercher(j)
  }

  async function chercher (j, action = 'chercher') {
    const n = ++rechercheEnCours
    // Pendant une recherche, on ne valide pas une liste qui va changer.
    el('cp-valider-b').disabled = true
    el('cp-complement').replaceChildren()
    // « Voir 10 de plus » garde la liste affichee pendant le chargement.
    const attente = Object.assign(document.createElement('p'), { className: 'cp-meta', textContent: t(action === 'plus' ? 'cp.chargement_plus' : 'cp.recherche') })
    if (action === 'plus') el('cp-complement').replaceChildren(attente)
    else el('cp-zone-liste').replaceChildren(attente)
    let r
    try { r = await appeler('POST', { action }) } catch (e) { r = { ok: false, d: null } }
    if (j !== jeton || n !== rechercheEnCours) return
    majCompte()
    if (!r.ok || !r.d || r.d.etat !== 'calcule') {
      // L'echec de « Voir 10 de plus » n'efface pas la liste deja affichee.
      if (action === 'plus') {
        const p = document.createElement('p'); p.className = 'non-calc'
        p.textContent = (r.d && r.d.message) || t('cp.plus_indispo')
        el('cp-complement').replaceChildren(p)
        return
      }
      el('cp-zone-carte').hidden = true
      const p = document.createElement('p'); p.className = 'non-calc'
      p.textContent = (r.d && r.d.message) || t('cp.liste_indispo')
      el('cp-zone-liste').replaceChildren(p)
      return
    }
    retenusDu(r.d)
    if (r.d.marche_sejour_min) { marcheSejour = r.d.marche_sejour_min; afficherSejour() }
    dire('cp-note', noteDe(r.d), 'cp-meta')
    afficher(r.d.comparables)
    if (r.d.encore) boutonPlus(j)
  }

  // ─── La carte ──────────────────────────────────────────────────────────────
  function etatDe (id) {
    if (fondateur.has(id)) return 'similaire'
    const j = jugements.get(id)
    return POSITIONS.includes(j) ? 'similaire' : j === 'non' ? 'non' : 'neutre'
  }
  // Rayon du point : de 6 a 18 selon la ressemblance (0 a 100 %).
  const rayon = c => 6 + Math.round(12 * Math.max(0, Math.min(100, Number(c.ressemblance) || 0)) / 100)
  // Le contour : noir pour le bien ouvert ; VIOLET EPAIS pour un bien qui a l'un
  // des equipements rares de l'hote (§21.6) ; blanc sinon.
  function style (c) {
    const etat = etatDe(c.listing_id)
    const eq = aVosEquipements(c)
    return { radius: rayon(c), color: c.listing_id === ouvert ? COULEUR.ouvert : eq ? COULEUR.equipements : COULEUR.bord,
      weight: c.listing_id === ouvert ? 3 : eq ? 4 : 1.5, fillColor: COULEUR[etat], fillOpacity: etat === 'non' ? 0.45 : 0.85 }
  }

  function afficher (liste) {
    cartes = Array.isArray(liste) ? liste : []
    const ids = new Set(cartes.map(c => String(c.listing_id)))
    for (const id of [...jugements.keys()]) if (!ids.has(id)) jugements.delete(id)
    el('cp-zone-liste').replaceChildren()
    if (!cartes.length) {
      el('cp-zone-carte').hidden = true
      const p = document.createElement('p'); p.className = 'non-calc'; p.textContent = t('cp.aucun_bien_marche')
      el('cp-zone-liste').replaceChildren(p); majCompte(); return
    }
    el('cp-zone-carte').hidden = false
    dessinerCarte()
    listeAccessible()
    // Les retenus de l'equipe hors de la liste restent pris en compte : on le dit.
    const horsListe = [...fondateur].filter(id => !ids.has(id)).length
    el('cp-hors-liste').hidden = !horsListe
    el('cp-hors-liste').textContent = horsListe ? t('cp.hors_carte', { n: horsListe }) : ''
    const premier = ouvert && ids.has(ouvert) ? ouvert : null
    if (premier) ouvrirFiche(premier); else el('cp-fiche').replaceChildren(Object.assign(document.createElement('p'), { className: 'cp-meta', textContent: t('cp.toucher_point') }))
    majCompte()
  }

  function dessinerCarte () {
    const L = window.L
    // Message a lui (review de 995f025 : la note du serveur l'effacait).
    if (!L) { el('cp-map').hidden = true; montrerErreurCarte(t('cp.carte_panne')); return }
    if (!carte) {
      carte = L.map(el('cp-map'), { scrollWheelZoom: false })
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
        attribution: `&copy; <a href="https://www.openstreetmap.org/copyright">${esc(t('cp.osm'))}</a>` }).addTo(carte)
    }
    for (const m of marqueurs.values()) m.remove()
    marqueurs.clear()
    const points = []
    if (profil && Number.isFinite(profil.latitude) && Number.isFinite(profil.longitude)) {
      const h = L.circleMarker([profil.latitude, profil.longitude], { radius: 11, color: COULEUR.ouvert, weight: 3, fillColor: COULEUR.hote, fillOpacity: 1 }).addTo(carte)
      h.bindTooltip(esc(t('cp.leg_hote')), { permanent: true, direction: 'top', offset: [0, -10] })
      marqueurs.set('__hote', h)
      points.push([profil.latitude, profil.longitude])
    }
    // Les petits d'abord : un gros point (plus ressemblant) reste cliquable au-dessus.
    for (const c of [...cartes].sort((a, b) => a.ressemblance - b.ressemblance)) {
      if (!Number.isFinite(c.latitude) || !Number.isFinite(c.longitude)) continue
      // L'identifiant du bien voyage avec son point (deux annonces peuvent
      // partager la meme position).
      const m = L.circleMarker([c.latitude, c.longitude], { ...style(c), identifiant: c.listing_id }).addTo(carte)
      m.on('click', () => ouvrirFiche(c.listing_id))
      marqueurs.set(c.listing_id, m)
      points.push([c.latitude, c.longitude])
    }
    // Aucun point a placer : pas de carte grise sans vue.
    el('cp-map').hidden = !points.length
    if (!points.length) { montrerErreurCarte(t('cp.carte_sans_position')); return }
    el('cp-carte-erreur').hidden = true
    carte.fitBounds(points, { padding: [24, 24], maxZoom: 16 })
    setTimeout(() => carte && carte.invalidateSize && carte.invalidateSize(), 0)
  }
  function montrerErreurCarte (texte) { const e = el('cp-carte-erreur'); e.textContent = texte; e.hidden = false }

  function restyler () {
    for (const c of cartes) { const m = marqueurs.get(c.listing_id); if (m) m.setStyle(style(c)) }
  }

  // La liste, pour le clavier et les lecteurs d'ecran (et un bien sans position).
  function listeAccessible () {
    const ol = el('cp-liste-biens')
    ol.replaceChildren()
    for (const c of cartes) {
      const li = document.createElement('li')
      const b = document.createElement('button'); b.type = 'button'; b.dataset.id = c.listing_id
      const j = jugements.get(c.listing_id)
      const suffixe = fondateur.has(c.listing_id) ? t('cp.suffixe_equipe') : POSITIONS.includes(j) ? t('cp.suffixe_comparable', { position: t(LIBELLE_POSITION[j]) }) : j === 'non' ? t('cp.suffixe_non') : ''
      b.textContent = `${c.nom || t('cp.sans_titre')} — ${t('cp.ressemblance', { n: c.ressemblance })}${suffixe ? ` ${suffixe}` : ''}`
      b.addEventListener('click', () => ouvrirFiche(c.listing_id))
      li.append(b); ol.append(li)
    }
  }

  // ─── La fiche sous la carte ───────────────────────────────────────────────
  function ouvrirFiche (id, { focus = null, defiler = true } = {}) {
    const c = cartes.find(x => x.listing_id === id)
    if (!c) return
    ouvert = id
    restyler()
    const f = el('cp-fiche')
    f.replaceChildren()
    f.dataset.id = id
    const photos = document.createElement('div'); photos.className = 'cp-photos'
    for (const url of Array.isArray(c.photos) ? c.photos : []) {
      const img = document.createElement('img')
      img.loading = 'lazy'; img.alt = ''
      img.setAttribute('referrerpolicy', 'no-referrer')
      img.setAttribute('src', url)
      photos.append(img)
    }
    if (!photos.children.length) photos.append(Object.assign(document.createElement('p'), { className: 'cp-meta', textContent: t('cp.pas_photo') }))
    const d = c.details || {}
    const nom = document.createElement('h3'); nom.className = 'cp-nom'; nom.textContent = c.nom || t('cp.sans_titre')
    const entete = document.createElement('div'); entete.className = 'cp-entete-fiche'
    entete.append(nom)
    // Le lien vers l'annonce : construit a partir de l'identifiant NUMERIQUE seul.
    if (/^[0-9]{1,24}$/.test(String(c.listing_id))) {
      const a = document.createElement('a'); a.className = 'cp-lien'
      a.setAttribute('href', `https://www.airbnb.fr/rooms/${c.listing_id}`)
      a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer')
      a.textContent = t('cp.voir_annonce')
      entete.append(a)
    }
    const morceaux = []
    if (Number.isFinite(c.voyageurs)) morceaux.push(pluriel(c.voyageurs, 'cp.n_voyageurs'))
    if (Number.isFinite(c.chambres)) morceaux.push(c.chambres === 0 ? t('cp.studio') : pluriel(c.chambres, 'cp.n_chambres'))
    if (Number.isFinite(d.lits)) morceaux.push(pluriel(d.lits, 'cp.n_lits'))
    if (Number.isFinite(d.salles_de_bain)) morceaux.push(t('cp.n_sdb', { v: virgule(d.salles_de_bain), n: d.salles_de_bain > 1 ? 2 : 1 }))
    if (Number.isFinite(c.distance_km)) morceaux.push(t(c.position_approchee ? 'cp.distance_environ' : 'cp.distance', { v: virgule(c.distance_km) }))
    const ligne = document.createElement('p'); ligne.className = 'cp-ligne'; ligne.textContent = morceaux.join(' · ')
    const activite = document.createElement('p'); activite.className = 'cp-ligne'
    activite.textContent = [c.ouvert_toute_annee === true ? t('cp.toute_annee') : c.ouvert_toute_annee === false ? t('cp.saisonnier') : '',
      Number.isFinite(c.ressemblance) ? t('cp.ressemblance', { n: c.ressemblance }) : ''].filter(Boolean).join(' · ')
    const badges = document.createElement('div'); badges.className = 'cp-badges'
    for (const e of Array.isArray(c.equipements) ? c.equipements : []) {
      if (!Object.prototype.hasOwnProperty.call(EQUIPEMENTS, e)) continue
      const b = document.createElement('span'); b.className = 'cp-badge'; b.textContent = nomEq(e); badges.append(b)
    }
    f.append(photos, entete, ligne, activite, badges)
    if (c.source === 'equipements') f.append(Object.assign(document.createElement('p'), { className: 'cp-source', textContent: t('cp.trouve_equipements') }))
    else if (aVosEquipements(c)) f.append(Object.assign(document.createElement('p'), { className: 'cp-source', textContent: t('cp.a_vos_equipements') }))
    // §21.6 : tout le reste de l'information, sauf l'argent.
    const blocs = document.createElement('dl'); blocs.className = 'cp-blocs'
    const ajouter = (titre, valeur) => { if (!valeur) return; const dt = document.createElement('dt'); dt.textContent = titre; const dd = document.createElement('dd'); dd.textContent = valeur; blocs.append(dt, dd) }
    ajouter(t('cp.d_type'), [d.type, d.logement_entier === true ? t('cp.entier') : d.logement_entier === false ? t('cp.partage') : ''].filter(Boolean).join(' · '))
    if (Number.isFinite(d.note)) ajouter(t('cp.d_note'), `${t('cp.note_sur5', { v: virgule(d.note) })}${Number.isFinite(d.avis) ? ` (${pluriel(d.avis, 'cp.n_avis')})` : ''}`)
    else if (Number.isFinite(d.avis)) ajouter(t('cp.d_avis'), pluriel(d.avis, 'cp.n_avis'))
    const n = d.notes || {}
    const sous = [['cp.sn_proprete', n.proprete], ['cp.sn_exactitude', n.exactitude], ['cp.sn_arrivee', n.arrivee], ['cp.sn_communication', n.communication], ['cp.sn_emplacement', n.emplacement], ['cp.sn_qualite_prix', n.rapport_qualite]]
      .filter(([, v]) => Number.isFinite(v)).map(([k, v]) => `${t(k)} ${virgule(v)}`)
    ajouter(t('cp.d_detail_notes'), sous.join(' · '))
    ajouter(t('cp.d_distinctions'), [d.superhote ? t('cp.superhote') : '', d.coup_de_coeur ? t('cp.coup_de_coeur') : ''].filter(Boolean).join(' · '))
    ajouter(t('cp.d_hote'), [d.hote, d.gestion_pro === true ? t('cp.gestion_pro') : d.gestion_pro === false ? t('cp.gestion_particuliere') : ''].filter(Boolean).join(' · '))
    ajouter(t('cp.d_reservation'), [Number.isFinite(d.sejour_min) ? t('cp.sejour_min', { nuits: pluriel(d.sejour_min, 'yfm.nuits') }) : '',
      d.reservation_instantanee === true ? t('cp.instantanee') : d.reservation_instantanee === false ? t('cp.sur_demande') : '',
      d.annulation ? t('cp.annulation', { x: ANNULATION[d.annulation] ? t(ANNULATION[d.annulation]) : d.annulation }) : ''].filter(Boolean).join(' · '))
    ajouter(t('cp.d_horaires'), [d.arrivee ? t('cp.arrivee', { h: d.arrivee }) : '', d.depart ? t('cp.depart', { h: d.depart }) : ''].filter(Boolean).join(' · '))
    if (Number.isFinite(d.nb_photos)) ajouter(t('cp.d_photos'), pluriel(d.nb_photos, 'cp.n_photos'))
    if (blocs.children.length) f.append(blocs)
    if (d.description) {
      const det = document.createElement('details'); det.className = 'cp-description'
      const sm = document.createElement('summary'); sm.textContent = t('cp.description')
      const p = document.createElement('p'); p.className = 'cp-desc'; p.textContent = d.description
      det.append(sm, p); f.append(det)
    }
    const tous = Array.isArray(d.equipements_airbnb) ? d.equipements_airbnb : []
    if (tous.length) {
      const det = document.createElement('details'); det.className = 'cp-tous-eq'
      const sm = document.createElement('summary'); sm.textContent = t('cp.tous_equipements', { n: tous.length })
      const ul = document.createElement('ul')
      for (const e of tous) { const li = document.createElement('li'); li.textContent = libelleEq(e); ul.append(li) }
      det.append(sm, ul); f.append(det)
    }
    if (fondateur.has(id)) {
      f.append(Object.assign(document.createElement('p'), { className: 'cp-fondateur', textContent: t('cp.retenu_equipe') }))
    } else {
      // §22.1 : un ecart d'equipement RARE signale un ecart de valeur.
      const manque = (Array.isArray(c.rares_manquants) ? c.rares_manquants : []).filter(e => NOM_RARE[e])
      const enPlus = (Array.isArray(c.rares_en_plus) ? c.rares_en_plus : []).filter(e => NOM_RARE[e])
      const ecart = manque.length || enPlus.length
      // « n'a pas votre X » ; « n'a ni votre X, ni votre Y » ; « a X et Y ; le
      // votre n'en a pas » (review de 1e64a2b).
      const vos = manque.map(e => t(NOM_RARE[e]))
      if (vos.length) f.append(Object.assign(document.createElement('p'), { className: 'cp-alerte',
        textContent: vos.length === 1 ? t('cp.manque_un', { x: vos[0] }) : t('cp.manque_plusieurs', { x: vos.join(t('cp.sep_ni')) }) }))
      const siens = enPlus.map(e => t(AVEC_ARTICLE[e]))
      if (siens.length) f.append(Object.assign(document.createElement('p'), { className: 'cp-alerte',
        textContent: t('cp.en_plus', { x: listeLocale(I18n.lang, siens) }) }))
      f.append(Object.assign(document.createElement('p'), { className: 'cp-explication',
        textContent: t('cp.explication') }))
      const v = document.createElement('div'); v.className = 'cp-verdict'
      const bouton = (etat, texte, classe) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = `btn btn--secondary cp-btn secondaire ${classe}${etat === 'non' && ecart ? ' en-avant' : ''}`; b.textContent = texte
        b.dataset.verdict = etat
        b.setAttribute('aria-pressed', String(jugements.get(id) === etat))
        // Un second clic sur le meme bouton annule le jugement.
        b.addEventListener('click', () => {
          touches.add(id)
          if (jugements.get(id) === etat) jugements.delete(id); else jugements.set(id, etat)
          // La fiche est reconstruite : le focus revient sur le meme bouton, et
          // la page ne defile pas (review de 995f025).
          ouvrirFiche(id, { focus: etat, defiler: false }); listeAccessible(); majCompte()
        })
        return b
      }
      v.append(bouton('dessous', t('cp.v_dessous'), 'similaire'), bouton('equivalent', t('cp.v_equivalent'), 'similaire'),
        bouton('dessus', t('cp.v_dessus'), 'similaire'), bouton('non', t('cp.v_non'), 'non'))
      f.append(v)
    }
    if (focus) { const b = f.querySelector(`button[data-verdict="${focus}"]`); if (b) b.focus() }
    // Telephone : la fiche est sous 60 % d'ecran de carte, on l'amene a l'oeil.
    if (defiler && window.innerWidth <= 640 && typeof f.scrollIntoView === 'function') f.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
  }

  function majCompte () {
    const n = similaires().length
    el('cp-valider-b').disabled = n < MIN
    el('cp-compte').textContent = n < MIN ? t('cp.compte_manque', { n, reste: MIN - n }) : t('cp.compte', { n })
  }

  async function retenir () {
    const j = jeton
    const ids = similaires()
    if (ids.length < MIN) return
    el('cp-valider-b').disabled = true
    dire('cp-message-b', t('cp.enregistrement'))
    let r
    try { r = await appeler('POST', { action: 'retenir', choix: ids.map(id => ({ listing_id: id, position: jugements.get(id) })) }) } catch (e) { r = { ok: false, d: { message: t('cp.serveur_muet') } } }
    if (j !== jeton) return
    majCompte()
    if (!r.ok || !r.d || !Array.isArray(r.d.retenus)) return dire('cp-message-b', (r.d && r.d.message) || t('cp.enregistrement_impossible'), 'cp-erreur')
    dire('cp-message-b', t('cp.retenus_ok', { n: r.d.retenus.length }), 'cp-ok')
    retenusEnregistres = r.d.retenus.length
    afficherStrategie()
  }

  // ─── ÉTAPE C : la strategie et le sejour minimum (§22.2) ─────────────────
  function afficherStrategie () {
    el('cp-etape-c').hidden = !(profil && retenusEnregistres >= MIN)
    if (el('cp-etape-c').hidden) return
    if (!strategieAffichee) {
      for (const r of document.querySelectorAll('input[name="strategie"]')) r.checked = r.value === profil.strategie
      el('cp-sejour-min').value = Number.isInteger(profil.sejour_min) ? profil.sejour_min : ''
      strategieAffichee = true
    }
    afficherSejour()
  }
  const pct = (n, total) => t('yfm.pct', { v: Math.round(100 * n / total) })
  function afficherSejour () {
    const m = marcheSejour
    const total = m && Number.isInteger(m.total) && m.total > 0 ? m.total : 0
    el('cp-marche-sejour').textContent = total
      ? t('cp.marche_sejour', { total, une: m.une, deux: m.deux, trois: m.trois_plus, p1: pct(m.une, total), p2: pct(m.deux, total), p3: pct(m.trois_plus, total) })
      : t('cp.marche_sejour_inconnu')
    // Imposer plusieurs nuits la ou LA PLUPART (plus de la moitie) en acceptent
    // une : on previent.
    const voulu = Number(el('cp-sejour-min').value)
    const alerte = total && Number.isInteger(voulu) && voulu >= 2 && m.une / total > 0.5
    el('cp-alerte-sejour').hidden = !alerte
    el('cp-alerte-sejour').textContent = alerte ? t('cp.alerte_sejour', { n: voulu }) : ''
  }

  async function enregistrerStrategie () {
    const j = jeton
    const choisie = document.querySelector('input[name="strategie"]:checked')
    const corps = { action: 'strategie', strategie: choisie ? choisie.value : null, sejour_min: el('cp-sejour-min').value.trim() }
    el('cp-valider-c').disabled = true
    dire('cp-message-c', t('cp.enregistrement'))
    let r
    try { r = await appeler('POST', corps) } catch (e) { r = { ok: false, d: { message: t('cp.serveur_muet') } } }
    if (j !== jeton) return
    el('cp-valider-c').disabled = false
    if (!r.ok || !r.d || !r.d.profil) return dire('cp-message-c', (r.d && r.d.message) || t('cp.enregistrement_impossible'), 'cp-erreur')
    profil = r.d.profil
    dire('cp-message-c', t('cp.strategie_ok'), 'cp-ok')
    // Les prix de depart suivent la strategie : on les relit (cache seulement).
    let g
    try { g = await appeler('GET') } catch (e) { g = null }
    if (j !== jeton || !g || !g.ok || !g.d) return
    afficherPrix(g.d.prix_depart || null)
  }

  // ─── ÉTAPE D : les prix de depart (§22.7) ────────────────────────────────
  const EUROS = v => t('yfm.euros', { v: I18n.num(Number(v), { useGrouping: false, maximumFractionDigits: 2 }) })
  const NIVEAUX_PRIX = ['creux', 'modere', 'favorable', 'pic']
  // ⚠ UN SEUL VOCABULAIRE A L'ECRAN (recette du 6 octobre 2026) : les tranches de
  // YieldFlow, celles de l'ecran Prix (TRANCHE, shared/prix-depart-jours.js).
  // Leur nom passe par le dictionnaire pour suivre la langue, et
  // tests/integration-v5-lot-2.test.js exige que le francais soit, au
  // caractere, la table TRANCHE : un seul vocabulaire, toujours.
  // Une FONCTION, pas une table : evaluee a l'affichage, apres le chargement
  // des dictionnaires.
  const NOM_NIVEAU = n => t(`cp.tranche_${n}`)
  const NOM_STRATEGIE = { agressif: 'cp.ns_agressif', juste: 'cp.ns_juste', qualite: 'cp.ns_qualite' }
  function afficherPrix (pd) {
    prixDepart = pd
    el('cp-etape-d').hidden = !(profil && profil.strategie && pd)
    if (el('cp-etape-d').hidden) return
    const zone = el('cp-zone-prix')
    zone.replaceChildren()
    dire('cp-note-prix', (pd && pd.note) || '', 'cp-meta')
    // Des prix a relever : le bouton, a cote du tableau s'il y en a un (review de
    // f37b7da, C4 : on calcule avec ce qui est deja releve).
    const bouton = () => {
      const b = document.createElement('button'); b.type = 'button'; b.id = 'cp-relever'
      b.className = 'btn btn--primary cp-btn'
      b.textContent = t(pd.etat === 'calcule' ? 'cp.relever_manquants' : 'cp.relever')
      b.addEventListener('click', relever)
      return b
    }
    // Sans marche relie, la page le DIT (recette de Thierry, 6 octobre 2026),
    // avant tout releve payant : les niveaux ne viennent alors que des
    // comparables, sans repli possible.
    // Le detail technique vit dans l'infobulle, pas dans la phrase (recette du
    // 25 octobre 2026) : `title` n'entre pas dans `textContent`, donc le
    // message reste court a l'ecran et la mecanique reste atteignable.
    if (pd.marche && pd.marche.relie === false) {
      const p = Object.assign(document.createElement('p'), { className: 'cp-avert', textContent: pd.marche.message })
      if (pd.marche.detail) p.title = pd.marche.detail
      zone.append(p)
    }
    if (pd.etat === 'a_capturer') {
      const p = document.createElement('p'); p.className = 'cp-meta'
      p.textContent = t('cp.a_capturer', { n: Number(pd.a_capturer) })
      zone.append(p, bouton()); return
    }
    if (pd.etat !== 'calcule' || !pd.prix) { zone.append(Object.assign(document.createElement('p'), { className: 'non-calc', textContent: pd.message || t('cp.prix_pas_encore') })); return }
    const r = pd.prix
    // Le calcul entier impossible : son motif, jamais un tableau vide (C5).
    if (r.statut !== 'calcule' || !Array.isArray(r.cases) || !r.cases.length) {
      zone.append(Object.assign(document.createElement('p'), { className: 'non-calc', textContent: t('cp.prix_impossible', { motif: r.motif || t('cp.donnees_insuffisantes') }) }))
      if (pd.a_capturer > 0) zone.append(bouton())
      return
    }
    // §22.11 : 8 cases — 4 niveaux × semaine / week-end. Dans chaque case, VOTRE
    // prix et la fourchette des prix de vos comparables (jamais hors marche).
    const tab = document.createElement('table'); tab.className = 'cp-prix'
    const th = document.createElement('tr')
    for (const x of ['yfm.col_niveau', 'cp.col_semaine', 'cp.col_week_end']) { const c = document.createElement('th'); c.textContent = t(x); th.append(c) }
    const tete = document.createElement('thead'); tete.append(th)
    const corps = document.createElement('tbody')
    const cellule = c => {
      const td = document.createElement('td')
      if (!c || c.statut !== 'calcule') { td.className = 'non-calc'; td.textContent = c && c.motif ? t('mc.non_calc_motif', { motif: c.motif }) : t('mg.non_calculable_mot'); return td }
      td.append(Object.assign(document.createElement('span'), { className: 'prix', textContent: EUROS(c.prix) }),
        // Espaces insecables : la fourchette ne se coupe pas sur telephone.
        Object.assign(document.createElement('span'), { className: 'cp-fourchette', textContent: t('cp.fourchette', { bas: c.fourchette.bas, haut: c.fourchette.haut }) }))
      return td
    }
    for (const n of NIVEAUX_PRIX) {
      const tr = document.createElement('tr')
      tr.append(Object.assign(document.createElement('td'), { textContent: NOM_NIVEAU(n) }),
        cellule(r.cases.find(c => c.niveau === n && c.type === 'semaine')), cellule(r.cases.find(c => c.niveau === n && c.type === 'weekend')))
      corps.append(tr)
    }
    tab.append(tete, corps)
    zone.append(tab)
    const dit = (texte, classe = 'cp-meta') => zone.append(Object.assign(document.createElement('p'), { className: classe, textContent: texte }))
    dit(t('cp.sous_prix'))
    // Regle (d) : d'ou vient la FORME (saison et week-end), dite a chaque fois.
    const pct = v => t('yfm.pct', { v: virgule(v) })
    const nonMesures = r.hotes_non_mesures || 0
    const fixes = (r.hotes || 0) - (r.hotes_mouvants || 0) - nonMesures
    const ville = r.phase1_localite || t('cp.votre_ville')
    const nonJuges = nonMesures > 0 ? ` ${t('cp.non_juges', { n: nonMesures })}` : ''
    dit(r.niveaux_source === 'phase1'
      ? `${r.repli === 'saison_plate' ? t('cp.saison_plate', { n: r.hotes_mouvants }) : t('cp.moins_de_2')} ${t('cp.phase1', { ville })}${nonJuges}`
      : `${t('cp.mouvants', { hm: r.hotes_mouvants, h: r.hotes, seuil: r.seuil_mouvant_pct, amp: pct(r.amplitude) })}${fixes > 0 ? ` ${t('cp.fixes', { n: fixes })}` : ''}${nonJuges} ${t('cp.prix_habituel_tous')}`)
    // Une INFORMATION, sans effet sur le prix (demande de Thierry) : l'ecart de
    // prime week-end entre vos comparables et le marche de la ville.
    const pw = r.prime_week_end
    if (pw) dit(t('cp.prime', { c: pw.comparables === null ? t('cp.non_mesuree') : pct(pw.comparables), de: pw.localite ? t('cp.de_ville', { ville: pw.localite }) : t('cp.de_la_ville'), m: pw.marche === null ? t('cp.non_mesuree') : pct(pw.marche) }))
    if (r.ancres) dit(t('cp.ancres', { n: Number(r.hotes), a: EUROS(r.ancres.agressif), j: EUROS(r.ancres.juste), q: EUROS(r.ancres.qualite), s: NOM_STRATEGIE[r.strategie] ? t(NOM_STRATEGIE[r.strategie]) : '' }))
    // Un ecart faible entre strategies est DIT, jamais maquille.
    if (r.serre) {
      const [a, b, e] = r.serre.juste_qualite <= r.serre.agressif_juste ? ['cp.serre_juste', 'cp.serre_qualite', r.serre.juste_qualite] : ['cp.serre_agressif', 'cp.serre_juste', r.serre.agressif_juste]
      dit(t('cp.serre', { e: EUROS(e), a: t(a), b: t(b) }), 'cp-avert')
    }
    // Une montee ratee : signalee, jamais lissee (pour VOTRE strategie).
    for (const al of (r.alertes || []).filter(x => x.strategie === r.strategie)) {
      dit(al.type === 'weekend'
        ? t('cp.alerte_we', { tranche: NOM_NIVEAU(al.niveau), we: EUROS(al.prix), sem: EUROS(al.semaine) })
        : t(al.jour === 'weekend' ? 'cp.alerte_tranche_we' : 'cp.alerte_tranche_sem', { tranche: NOM_NIVEAU(al.niveau), prix: EUROS(al.prix), avant: EUROS(al.precedent) }), 'cp-avert')
    }
    for (const id of r.a_verifier || []) {
      const c = cartes.find(x => String(x.listing_id) === String(id))
      dit(t('cp.verifier', { nom: c ? c.nom : t('cp.un_de_vos') }), 'cp-avert')
    }
    const se = r.sejour
    if (se && se.statut === 'calcule') {
      const sens = se.ecart_pct < 0 ? t('cp.moins_cher', { p: t('yfm.pct', { v: Math.abs(se.ecart_pct) }) }) : se.ecart_pct > 0 ? t('cp.plus_cher', { p: t('yfm.pct', { v: se.ecart_pct }) }) : t('cp.meme_prix')
      zone.append(Object.assign(document.createElement('p'), { className: 'cp-meta', textContent: t('cp.sejour_comp', { sens, a: EUROS(se.plusieurs_nuits), b: EUROS(se.une_nuit) }) }))
    } else if (se) zone.append(Object.assign(document.createElement('p'), { className: 'cp-meta', textContent: t('cp.sejour_motif', { motif: se.motif }) }))
    if (pd.a_capturer > 0) zone.append(bouton())
    if (ouvert) ouvrirFiche(ouvert, { defiler: false })
  }

  async function relever () {
    const j = jeton
    const b = el('cp-relever'); if (b) b.disabled = true
    dire('cp-note-prix', t('cp.releve_en_cours'), 'cp-meta')
    let r
    try { r = await appeler('POST', { action: 'prix' }) } catch (e) { r = { ok: false, d: { message: t('cp.serveur_muet') } } }
    if (j !== jeton) return
    if (!r.ok || !r.d) { if (b) b.disabled = false; return dire('cp-note-prix', (r.d && r.d.message) || t('cp.releve_impossible'), 'cp-erreur') }
    afficherPrix(r.d)
  }

  init().catch(e => console.error('[comparables]', e))
</script>
</body>
</html>
