<!DOCTYPE html>
<!-- ⚠️ DOC : comportement documenté dans docs/kb/menage.md — si tu modifies/ajoutes/supprimes une fonctionnalité ici, mets à jour ce kb (MÊME COMMIT). -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HôteSmart — Planning</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    /* ⚠ MÊME LANGAGE VISUEL QUE LE CALENDRIER DES RÉSERVATIONS ET TARIFS
       (`pages/biens-calendrier.html`), décliné aux ménages — décision du product
       owner du 5 septembre 2026. Ce n'est PAS une réinvention : même barre de
       contrôles collante, mêmes pastilles de mois, même bande de mois, même
       `table.cal` et libellé de ligne figé à gauche, mêmes classes
       `weekend` / `today` / `month-start`. Seule la LARGEUR de case diffère —
       cet écran écrit des prénoms, celui des tarifs des chiffres.
       Deux écrans qui montrent des jours et des biens doivent se lire pareil :
       une seconde grammaire visuelle, c'est un second apprentissage. */
    .cal-page * { box-sizing: border-box; }
    /* Largeur de case par défaut ; le script l'ajuste selon la taille d'écran. */
    .cal-page { -webkit-user-select: none; user-select: none; --case: 84px; --label: 120px; }
    @media (max-width: 640px) { .cal-page { --case: 62px; --label: 92px; } }
    .cal-controls { background: var(--bg); padding: 14px 20px; border-bottom: 0.5px solid var(--border);
                    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
                    gap: 12px; position: sticky; top: 0; z-index: 20; }
    .cal-controls .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: #f0f0f0; border: 1px solid #e5e5e7; border-radius: 8px; padding: 0 12px;
                height: 36px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center;
                justify-content: center; color: #1d1d1f; }
    .period-select { padding: 7px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px;
                     background: #fff; font-family: inherit; color: #1d1d1f; }
    .multi-select { position: relative; }
    .multi-select .ms-trigger { padding: 7px 12px; border: 1px solid #d2d2d7; border-radius: 8px;
                                font-size: 14px; background: #fff; cursor: pointer; min-width: 190px;
                                display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .multi-select .ms-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0;
                              background: #fff; border: 1px solid #d2d2d7; border-radius: 10px;
                              box-shadow: 0 8px 24px rgba(0,0,0,0.12); min-width: 250px; max-height: 320px;
                              overflow-y: auto; z-index: 30; padding: 6px; }
    .multi-select.open .ms-panel { display: block; }
    .multi-select .ms-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
                               border-radius: 7px; cursor: pointer; font-size: 14px; color: #1d1d1f; }
    .multi-select .ms-option:hover { background: #f5f5f7; }

    .cal-main { padding: 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 60px; color: #1d1d1f; }
    .month-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .month-pill { background: #fff; border: 1px solid #d2d2d7; border-radius: 20px; padding: 5px 14px;
                  font-size: 13px; cursor: pointer; color: #1d1d1f; font-weight: 500; text-transform: capitalize; }
    .month-pill:hover { background: #eef4ff; border-color: #007aff; }
    .month-pill.active { background: #007aff; color: #fff; border-color: #007aff; }
    .scroll-shell { background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; }
    .scroll-area { overflow-x: auto; }
    table.month-band { border-collapse: collapse; table-layout: fixed; }
    table.month-band td { height: 26px; font-size: 12px; font-weight: 700; color: #1d1d1f; text-align: left;
                          padding-left: 8px; white-space: nowrap; border-bottom: 1px solid #e5e5e7; text-transform: capitalize; }
    table.month-band td.month-start { border-left: 2px solid #007aff; }
    table.month-band .corner { width: var(--label); min-width: var(--label); position: sticky; left: 0;
                               background: #fff; z-index: 5; border-bottom: 1px solid #e5e5e7; }

    .bien-section { padding-top: 18px; padding-bottom: 16px; margin-bottom: 4px; }
    .bien-section:not(:last-child) { border-bottom: 3px solid #eef0f3; }
    table.cal { border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    /* ⚠ LA LARGEUR DE CASE EST PROPRE A CET ECRAN, et pilotée par `--case`.
       `CELL_W` (34 px) reste la largeur du calendrier des tarifs, qui n'affiche
       que des chiffres : l'y modifier pour écrire un prénom aurait élargi un
       écran qui n'en a pas besoin, et les deux grilles partagent ce module. */
    table.cal th, table.cal td { padding: 6px 2px; text-align: center; white-space: nowrap;
                                 width: var(--case); min-width: var(--case); }
    table.cal thead th { border-bottom: 1px solid #e5e5e7; }
    table.cal .row-label { text-align: left; padding-left: 8px; font-size: 11px; color: #6e6e73;
                           width: var(--label); min-width: var(--label);
                           background: #fff; position: sticky; left: 0; z-index: 2;
                           border-right: 1px solid #e5e5e7; font-weight: 500; }
    table.cal thead .row-label { z-index: 4; }
    table.cal .row-label.bien-head { font-size: 14px; font-weight: 700; color: #1d1d1f; border-left: 4px solid #007aff;
                                     vertical-align: middle; line-height: 1.2; }
    table.cal .row-label.bien-head .cap-h { display: block; font-size: 10px; font-weight: 400; color: #86868b; margin-top: 2px; }
    table.cal .day-num { font-weight: 600; font-size: 12px; color: #1d1d1f; }
    table.cal .day-name { font-size: 9px; color: #86868b; text-transform: uppercase; }
    table.cal .weekend { background: rgba(0,0,0,0.022); }
    table.cal .month-start { border-left: 2px solid #007aff; }
    table.cal .today { background: #e6f0ff !important; box-shadow: inset 2px 0 0 #007aff, inset -2px 0 0 #007aff; }
    table.cal td.cell { cursor: pointer; position: relative; }
    table.cal td.cell:hover { background: #eef4ff; }

    /* Le PRÉNOM EN ENTIER dans la ligne Garde (décision du 5 septembre 2026, en
       remplacement des pastilles à initiale) : les colonnes s'élargissent, la
       grille défile — moins de jours d'un coup, mais on lit qui c'est sans
       survoler.
       ⚠ L'ellipse est CSS, pas une coupe en JavaScript : couper une chaîne à
       N caractères tranche au milieu d'un accent composé, et « Régina » y
       devenait « Re… ». Le navigateur, lui, coupe au pixel et sait le faire.
       Le prénom complet reste dans le `title` de la case. */
    .gard { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 11px; font-weight: 600; line-height: 18px; border-radius: 4px;
            padding: 0 4px; border-left: 3px solid transparent; text-align: left; }
    .gard.vide { color: #d2d2d7; font-weight: 400; text-align: center; border-left-color: transparent; }
    .gard.alerte { background: #ffeced; color: #d52a44; border-left-color: #d52a44; }
    .gard.regler { background: #FEF3C7; color: #92400E; border-left-color: #f59e0b; }
    .men { display: inline-block; width: 100%; font-size: 11px; line-height: 18px; border-radius: 4px; }
    .men.porte { background: #dde7f5; color: #0d4ea6; }
    .men.attente { background: #FEF3C7; color: #92400E; }
    .men.alerte { background: #ffeced; color: #d52a44; font-weight: 700; }
    .men.differe { background: #f5f5f7; color: #86868b; }
    .men.gris { background: #f5f5f7; color: #c7c7cc; }
    .men.avis-ok::after { content: '👍'; font-size: 9px; margin-left: 1px; }
    .men.avis-ko::after { content: '👎'; font-size: 9px; margin-left: 1px; }
    td.non-confie { background: #fafafa; }

    .legende { font-size: 11px; color: #6e6e73; line-height: 2.2; padding: 0 4px; }
    .legende span { margin-right: 14px; white-space: nowrap; }
    .cal-etat { text-align: center; padding: 40px 20px; color: #6e6e73; font-size: 13px; line-height: 1.6; }
    .cal-etat strong { display: block; color: #1d1d1f; margin-bottom: 4px; }
    .bandeau { margin: 0 0 12px; padding: 10px 13px; background: #FEF3C7; border: 0.5px solid #FCD34D;
               border-radius: 8px; font-size: 12px; color: #92400E; line-height: 1.5; }

    /* Le détail au clic : tout ce que la grille ne peut pas montrer. */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center;
               justify-content: center; z-index: 100; padding: 16px; }
    .overlay.visible { display: flex; }
    .popup { background: #fff; border-radius: 16px; width: 100%; max-width: 440px; max-height: 92vh;
             overflow-y: auto; color: #1d1d1f; }
    .popup-head { padding: 18px 20px 12px; border-bottom: 1px solid #f0f0f0; }
    .popup-head h3 { font-size: 16px; font-weight: 600; text-transform: capitalize; }
    .popup-head .sous { font-size: 13px; color: #86868b; margin-top: 2px; }
    .popup-corps { padding: 16px 20px; font-size: 13px; line-height: 1.6; }
    .popup-corps .bloc { margin-bottom: 14px; }
    .popup-corps .bloc:last-child { margin-bottom: 0; }
    .popup-corps .etiq { font-size: 11px; color: #86868b; text-transform: uppercase; letter-spacing: 0.03em; }
    .popup-foot { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; }
    .btn-fermer { background: #f0f0f0; color: #1d1d1f; border: none; border-radius: 9px; padding: 9px 16px;
                  font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-ouvrir { background: #007aff; color: #fff; border: none; border-radius: 9px; padding: 9px 16px;
                  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .pastille { font-size: 12px; border-radius: 20px; padding: 3px 10px; border: 0.5px solid #d2d2d7;
                background: #f5f5f7; color: #6e6e73; display: inline-block; }
    .pastille.porte { background: #EEEDFE; color: #3C3489; border-color: #C4B5FD; }
    .pastille.attente { background: #FEF3C7; color: #92400E; border-color: #D97706; }
    .pastille.alerte { background: #FEE2E2; color: #991B1B; border-color: #E24B4A; }
    .pastille.retour-ok { background: #DCFCE7; color: #166534; border-color: #86EFAC; }
    .pastille.retour-ko { background: #FEF3C7; color: #92400E; border-color: #D97706; }
    .retour-etiquette { font-size: 10px; color: #86868b; border: 0.5px solid #d2d2d7; border-radius: 20px;
                        padding: 2px 8px; margin-left: 4px; }
    .retour-extrait { font-size: 13px; margin-top: 6px; line-height: 1.5; font-style: italic; }
  </style>
</head>
<body>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>

  <div class="main cal-page">
    <div class="topbar">
      <div>
        <div class="page-title">🧹 Planning</div>
        <div class="page-sub">Qui est de garde, par bien et par jour</div>
      </div>
    </div>

    <div class="cal-controls">
      <div class="left">
        <div class="multi-select" id="multi-select">
          <div class="ms-trigger" id="ms-trigger"><span id="ms-label">Tous les biens</span><span>&#9662;</span></div>
          <div class="ms-panel" id="ms-panel"></div>
        </div>
        <!-- ⚠ PAS DE 6 NI 12 MOIS, contrairement au calendrier des tarifs. Une
             garde à un an n'a aucun sens : les règles de disponibilité auront
             changé bien avant, et l'écran afficherait une prévision présentée
             comme un fait. La borne serveur (92 jours) dit la même chose. -->
        <select class="period-select" id="period-select">
          <option value="1" selected>1 mois</option>
          <option value="3">3 mois</option>
        </select>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-today">Aujourd'hui</button>
      </div>
    </div>

    <div class="cal-main">
      <div id="bandeau" class="bandeau" style="display:none"></div>
      <div class="month-pills" id="month-pills"></div>
      <div class="scroll-shell">
        <div class="scroll-area" id="scroll-area">
          <div id="month-band-wrap"></div>
          <div id="blocks"><div class="cal-etat">Chargement…</div></div>
        </div>
      </div>
      <div class="legende" id="legende" style="display:none">
        <span><span class="gard" style="display:inline-block;border-left-color:#0d4ea6;background:#0d4ea614;color:#1d1d1f">Régina</span> de garde</span>
        <span><span class="gard regler" style="display:inline-block">Marie</span> jours à régler</span>
        <span><span class="gard alerte" style="display:inline-block">Marie</span> désactivée</span>
        <span><span class="men porte">&nbsp;✓&nbsp;</span> ménage porté</span>
        <span><span class="men attente">&nbsp;⏳&nbsp;</span> proposé</span>
        <span><span class="men alerte">&nbsp;⚠&nbsp;</span> personne / refusé</span>
        <span><span class="men differe">&nbsp;·&nbsp;</span> proposition à venir</span>
        <span>👍 👎 retour du voyageur — cliquez la case</span>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-head">
      <h3 id="popup-titre"></h3>
      <div class="sous" id="popup-sous"></div>
    </div>
    <div class="popup-corps" id="popup-corps"></div>
    <div class="popup-foot">
      <button class="btn-fermer" id="btn-fermer">Fermer</button>
      <a class="btn-ouvrir" href="/apps/menages">Ouvrir le planning</a>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth } from '/components/auth-guard.js'
  import { renderSidebar } from '/components/sidebar.js'
  import { enteteCompte } from '/shared/compte-courant.js'
  import { initErrorHandler } from '/shared/error-handler.js'
  // ⚠ MÊMES PRIMITIVES QUE LE CALENDRIER DES TARIFS — sauf la LARGEUR DE CASE,
  // qui est propre à cet écran depuis qu'il écrit des prénoms. `CELL_W` (34 px)
  // reste celle du calendrier des tarifs, qui n'affiche que des chiffres : la
  // changer là-bas pour nos besoins aurait élargi un écran qui n'en a pas besoin.
  import { dayNames, monthFull, toISO } from '/shared/calendar-core.js'

  initErrorHandler()

  let session = null
  let jours = []            // les Date de la grille
  let donnees = null        // la dernière réponse serveur
  let biensChoisis = null   // null = tous
  let mois = 1

  // ⚠ LA GRILLE COMMENCE AVANT AUJOURD'HUI, contrairement au calendrier des
  // tarifs — et c'est la seule vraie divergence, assumée. Le retour de propreté
  // d'un séjour ne s'affiche que sur un ménage PASSÉ : une grille qui démarre
  // aujourd'hui ne l'aurait jamais montré. On garde donc la semaine écoulée, et
  // « Aujourd'hui » recentre.
  const JOURS_AVANT = 7
  // ⚠ LA MÊME BORNE QUE LE SERVEUR (`api/garde.js`), et que `planningDeGarde`.
  // « 3 mois » demandait 90 + 7 = 97 jours : le serveur refusait, et l'écran
  // affichait « Service indisponible » — l'option était morte à la livraison.
  // Les deux bornes doivent être écrites au même endroit dans la tête de celui
  // qui les lit : ici, et en commentaire du serveur.
  const MAX_JOURS = 92

  // ⚠ LA LARGEUR LUE DEPUIS LE CSS, jamais recopiée. Deux constantes — une en
  // CSS pour peindre, une en JS pour faire défiler — se désynchronisent au
  // premier ajustement, et « Aujourd'hui » tombe alors à côté de la colonne du
  // jour. Le CSS est la source, la media query comprise.
  function largeurCase () {
    const v = getComputedStyle(document.querySelector('.cal-page')).getPropertyValue('--case')
    const n = parseFloat(v)
    return Number.isFinite(n) && n > 0 ? n : 84
  }

  function construireJours () {
    const t = new Date(); t.setHours(0, 0, 0, 0)
    const debut = new Date(t); debut.setDate(t.getDate() - JOURS_AVANT)
    const n = Math.min(MAX_JOURS, Math.round(mois * 30) + JOURS_AVANT)
    const out = []
    for (let i = 0; i < n; i++) { const d = new Date(debut); d.setDate(debut.getDate() + i); out.push(d) }
    return out
  }

  const estAujourdhui = d => toISO(d) === toISO(new Date())
  const estWeekend = d => d.getDay() === 0 || d.getDay() === 6
  const debutDeMois = (d, i) => i === 0 || d.getDate() === 1

  function echapper (t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
  }

  // ⚠ UNE COULEUR STABLE PAR PERSONNE, dérivée de son identifiant : la même
  // prestataire garde sa couleur d'un bien à l'autre et d'une semaine à l'autre.
  // Une couleur tirée de l'ordre d'affichage changeait au premier congé.
  const COULEURS = ['#0d4ea6', '#1f6f23', '#7c3aed', '#b45309', '#0f766e', '#9d174d']
  function couleurDe (id) {
    let h = 0
    for (const c of String(id || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0
    return COULEURS[h % COULEURS.length]
  }
  // ⚠ LE PRÉNOM EN ENTIER, et c'est le CSS qui coupe s'il déborde (ellipse au
  // pixel). Tronquer en JavaScript à N caractères tranche au milieu d'un accent
  // composé — « Régina » y devenait « Re… » — et ne sait pas ce qui tient
  // vraiment dans la case, qui change avec la taille de l'écran.
  function nomAffiche (p, avecNoms) {
    if (!p) return ''
    if (!avecNoms || !p.prenom) return 'quelqu\'un'
    return p.prenom.trim()
  }
  function nomOu (p, avecNoms) {
    if (!p) return 'personne'
    if (!avecNoms || !p.prenom) return 'quelqu\'un'
    return p.prenom
  }

  // ─── Chargement ───────────────────────────────────────────────────────────
  let chargementCourant = 0
  async function charger () {
    // ⚠ `jours` N'EST AFFECTÉ QU'AU SUCCÈS. Le muter avant le fetch laissait, sur
    // une erreur, une fenêtre de 3 mois en mémoire avec les données d'un mois :
    // le moindre `rendre()` ultérieur — cocher un bien dans le sélecteur en
    // appelle un — repeignait 60 jours en « aucun ménage / personne de garde »,
    // c'est-à-dire du silence exactement là où des alertes peuvent exister.
    const fenetre = construireJours()
    const du = toISO(fenetre[0])
    const au = toISO(fenetre[fenetre.length - 1])
    const jeton = ++chargementCourant
    etat('Chargement…')

    let res
    try {
      // ⚠ `enteteCompte()` : sans lui, le serveur lit le compte de l'APPELANT et
      // non celui qui est sélectionné.
      res = await fetch(`/api/garde?du=${du}&au=${au}`, {
        headers: { 'Authorization': `Bearer ${session.access_token}`, ...enteteCompte() }
      })
    } catch (e) {
      if (jeton === chargementCourant) etat('Connexion impossible', 'Vérifiez votre réseau, puis réessayez.')
      return
    }
    // ⚠ Deux changements de période rapides lancent deux requêtes : sans ce
    // jeton, la plus lente écrase la plus récente.
    if (jeton !== chargementCourant) return
    if (res.status === 403) return etat('Accès refusé', 'Vous n\'avez pas le droit de consulter les ménages.')
    if (!res.ok) return etat('Service indisponible', 'Réessayez dans un instant.')
    let data
    try { data = await res.json() } catch (e) { return etat('Réponse illisible') }
    if (jeton !== chargementCourant) return
    jours = fenetre
    donnees = data
    rendre()
  }

  function etat (titre, message) {
    grilleAffichee = false
    document.getElementById('legende').style.display = 'none'
    document.getElementById('month-band-wrap').innerHTML = ''
    // ⚠ Les pastilles de mois AUSSI : laissées au-dessus de « Service
    // indisponible », elles annonçaient une période dont plus rien n'est affiché.
    document.getElementById('month-pills').innerHTML = ''
    document.getElementById('blocks').innerHTML =
      `<div class="cal-etat"><strong>${echapper(titre)}</strong>${echapper(message || '')}</div>`
  }

  // ─── Rendu de la grille ───────────────────────────────────────────────────
  function rendre () {
    const data = donnees
    const tous = data.biens || []
    if (!tous.length) return etat('Aucun bien', 'Connectez un logement pour voir sa garde.')

    const biens = biensChoisis ? tous.filter(b => biensChoisis.has(b.id)) : tous

    // Index (bien, jour) -> garde, et (bien, jour) -> ménages.
    const gardeIdx = {}
    const gereIdx = {}
    for (const b of (data.garde || [])) {
      gereIdx[b.propertyId] = b.gere !== false
      for (const j of (b.jours || [])) gardeIdx[`${b.propertyId}|${j.date}`] = j
    }
    const menIdx = {}
    for (const m of (data.menages || [])) {
      (menIdx[`${m.propertyId}|${m.date}`] ||= []).push(m)
    }

    const bandeau = document.getElementById('bandeau')
    if (data.tronque) {
      bandeau.textContent = '⚠️ Liste incomplète : trop de biens ou de ménages sur cette période. Réduisez la période pour tout voir.'
      bandeau.style.display = ''
    } else bandeau.style.display = 'none'

    renderMonthBand()
    renderMonthPills()

    const blocks = document.getElementById('blocks')
    blocks.innerHTML = biens.length
      ? biens.map(b => blocBien(b, gardeIdx, menIdx, gereIdx[b.id] !== false, data.avec_noms)).join('')
      : '<div class="cal-etat">Aucun bien sélectionné.</div>'
    document.getElementById('legende').style.display = ''
    grilleAffichee = true
    brancherCellules(gardeIdx, menIdx, gereIdx)
    centrerSurAujourdhui(false)
  }

  function renderMonthBand () {
    let h = '<table class="month-band"><tr><td class="corner"></td>'
    let i = 0
    while (i < jours.length) {
      const m = jours[i].getMonth()
      let span = 0
      while (i + span < jours.length && jours[i + span].getMonth() === m) span++
      const w = span * largeurCase()
      h += `<td colspan="${span}" class="month-start" style="width:${w}px;min-width:${w}px">${monthFull[m]} ${jours[i].getFullYear()}</td>`
      i += span
    }
    document.getElementById('month-band-wrap').innerHTML = h + '</tr></table>'
  }

  function renderMonthPills () {
    const w = document.getElementById('month-pills')
    w.innerHTML = ''
    const vus = new Set()
    jours.forEach((d, idx) => {
      const k = `${d.getFullYear()}-${d.getMonth()}`
      if (vus.has(k)) return
      vus.add(k)
      const p = document.createElement('button')
      p.className = 'month-pill'
      p.textContent = monthFull[d.getMonth()]
      p.addEventListener('click', () => {
        document.getElementById('scroll-area').scrollTo({ left: idx * largeurCase(), behavior: 'smooth' })
        w.querySelectorAll('.month-pill').forEach(x => x.classList.remove('active'))
        p.classList.add('active')
      })
      w.appendChild(p)
    })
    const f = w.querySelector('.month-pill')
    if (f) f.classList.add('active')
  }

  function blocBien (bien, gardeIdx, menIdx, gere, avecNoms) {
    let h = `<div class="bien-section" data-bien="${echapper(bien.id)}"><table class="cal"><thead><tr>`
    h += `<th class="row-label bien-head">${echapper(bien.name)}${gere ? '' : '<span class="cap-h">non confié</span>'}</th>`
    jours.forEach((d, i) => {
      const cls = [estWeekend(d) ? 'weekend' : '', estAujourdhui(d) ? 'today' : '', debutDeMois(d, i) ? 'month-start' : '']
      h += `<th class="${cls.join(' ')}"><div class="day-name">${dayNames[d.getDay()]}</div><div class="day-num">${d.getDate()}</div></th>`
    })
    h += '</tr></thead><tbody>'

    // Ligne 1 — LA GARDE. Une initiale par jour, couleur stable par personne.
    h += '<tr><td class="row-label">Garde</td>'
    jours.forEach((d, i) => {
      const iso = toISO(d)
      const g = gardeIdx[`${bien.id}|${iso}`]
      h += `<td class="${classesCellule(d, i, gere).join(' ')}" data-bien="${echapper(bien.id)}" data-jour="${iso}"` +
           ` title="${echapper(titreGarde(bien, g, gere, avecNoms))}">${pastilleGarde(g, gere, avecNoms)}</td>`
    })
    h += '</tr>'

    // Ligne 2 — LE MÉNAGE.
    h += '<tr><td class="row-label">Ménage</td>'
    jours.forEach((d, i) => {
      const iso = toISO(d)
      const menages = menIdx[`${bien.id}|${iso}`] || []
      h += `<td class="${classesCellule(d, i, gere).join(' ')}" data-bien="${echapper(bien.id)}" data-jour="${iso}"` +
           ` title="${echapper(titreMenage(menages, gere, avecNoms))}">${caseMenage(menages, gere)}</td>`
    })
    h += '</tr></tbody></table></div>'
    return h
  }

  function classesCellule (d, i, gere) {
    const c = ['cell']
    if (estWeekend(d)) c.push('weekend')
    if (estAujourdhui(d)) c.push('today')
    if (debutDeMois(d, i)) c.push('month-start')
    if (!gere) c.push('non-confie')
    return c
  }

  // ⚠ UN BIEN NON CONFIÉ N'EST PAS UN TROU DE GARDE : le moteur sépare les deux
  // et n'alerte que sur le second (décision du 3 septembre). Les confondre
  // peignait en rouge chaque départ d'un hôte qui fait son ménage lui-même.
  function pastilleGarde (g, gere, avecNoms) {
    if (!gere) return '<span class="gard vide">·</span>'
    if (!g || g.trou || !g.responsable) return '<span class="gard vide">—</span>'
    const p = g.responsable
    const nom = echapper(nomAffiche(p, avecNoms))
    // ⚠ AUCUN `title` ICI. `.gard` est en `display: block` et remplit la boîte de
    // la cellule : une infobulle posée dessus GAGNE au survol et masque celle du
    // `<td>`, qui est la seule voie d'accès à « désactivée : sa PWA ne s'ouvre
    // plus », « jours à régler », la remplaçante et le nom du bien. L'hôte aurait
    // survolé une case rouge pour n'y lire qu'un prénom. Le prénom complet est
    // déjà en tête de `titreGarde` — une seule infobulle, et elle dit tout.
    // Désactivée ou jours non réglés : elle est « de garde » pour le calcul, mais
    // elle ne recevra rien. L'afficher comme les autres laissait l'hôte compter
    // sur quelqu'un qui ne verra jamais le ménage.
    if (p.actif === false) return `<span class="gard alerte">${nom}</span>`
    if (p.a_regler) return `<span class="gard regler">${nom}</span>`
    // ⚠ COULEUR STABLE PAR PERSONNE, en LISERÉ plus fond très clair : un aplat
    // plein sur toute la largeur d'une case devenait un mur de couleur dès trois
    // biens, et le prénom s'y lisait moins bien que le calme.
    const c = couleurDe(p.id || p.prenom)
    return `<span class="gard" style="border-left-color:${c};background:${c}14;color:#1d1d1f">${nom}</span>`
  }

  // ⚠ LE ROUGE EST CONDITIONNEL, ET TROIS FOIS : pas de ménage, bien non confié,
  // ou proposition simplement différée ne sont pas des alertes.
  // ⚠ LE PLUS GRAVE L'EMPORTE quand un jour porte plusieurs ménages. La cellule
  // n'en montrait que le PREMIER : un ménage porté (✓ vert) cachait un second
  // que personne n'a (⚠). Le détail au clic les liste tous, mais la grille est
  // ce que l'hôte parcourt pour repérer un problème — c'est elle qui doit
  // porter le pire.
  const GRAVITE = { alerte: 4, attente: 3, differe: 2, porte: 1, gris: 0 }
  function etatMenage (m, gere) {
    if (!gere) return 'gris'
    // ⚠ `orphaned` AVANT `differe`. Un ménage refusé n'a ni porteur ni offre :
    // dès que son départ sort de la fenêtre de proposition, il satisfait aussi
    // `differe` — et s'affichait « proposition à venir » en gris, cachant la
    // décision humaine que ce statut existe pour réclamer.
    if (m.proposeA) return 'attente'
    if (m.status === 'orphaned') return 'alerte'
    if (m.differe) return 'differe'
    if (m.porteur) return 'porte'
    return 'alerte'
  }
  const MARQUEUR = { alerte: '⚠', attente: '⏳', differe: '·', porte: '✓', gris: '·' }

  function caseMenage (menages, gere) {
    if (!menages.length) return ''
    let pire = menages[0], etat = etatMenage(menages[0], gere)
    for (const m of menages.slice(1)) {
      const e = etatMenage(m, gere)
      if (GRAVITE[e] > GRAVITE[etat]) { pire = m; etat = e }
    }
    const avis = pire.retour ? (pire.retour.verdict === 'positif' ? ' avis-ok' : ' avis-ko') : ''
    const plus = menages.length > 1 ? `<sup>${menages.length}</sup>` : ''
    return `<span class="men ${etat}${avis}">${MARQUEUR[etat]}${plus}</span>`
  }

  // ─── Le survol : ce que la grille ne peut pas écrire ──────────────────────
  //
  // ⚠ LA CASE ÉCRIT UN PRÉNOM, PAS UNE PHRASE. Le `title` de la cellule porte le
  // reste au survol — le bien, la mention « désactivée » ou « jours à régler »,
  // la remplaçante — et le clic ouvre le détail : toute l'information reste
  // accessible, aucune n'encombre la grille.
  function titreGarde (bien, g, gere, avecNoms) {
    if (!gere) return `${bien.name} — non confié à un prestataire`
    if (!g || g.trou || !g.responsable) return `${bien.name} — personne de garde ce jour-là`
    const p = g.responsable
    let t = `${bien.name} — ${nomOu(p, avecNoms)} de garde`
    if (p.actif === false) t += ' (désactivée : sa PWA ne s\'ouvre plus)'
    else if (p.a_regler) t += ' (jours à régler : aucune proposition ne lui partira)'
    if (g.remplacante) {
      t += ` · remplaçante : ${nomOu(g.remplacante, avecNoms)}`
      if (g.remplacante.a_regler) t += ' (jours à régler)'
    }
    return t
  }

  function titreMenage (menages, gere, avecNoms) {
    if (!menages.length) return 'Aucun ménage ce jour-là'
    const suffixe = menages.length > 1 ? ` · ${menages.length} ménages ce jour-là, cliquez` : ''
    let pire = menages[0], etat = etatMenage(menages[0], gere)
    for (const m of menages.slice(1)) {
      const e = etatMenage(m, gere)
      if (GRAVITE[e] > GRAVITE[etat]) { pire = m; etat = e }
    }
    return titreDUnMenage(pire, gere, avecNoms) + suffixe
  }

  function titreDUnMenage (m, gere, avecNoms) {
    if (!gere) return 'Ménage — bien non confié à un prestataire'
    if (m.proposeA) {
      const chez = m.porteur ? ` (porté par ${nomOu(m.porteur, avecNoms)})` : ''
      return `Ménage proposé à ${nomOu(m.proposeA, avecNoms)}${chez}${delaiTexte(m)}`
    }
    // ⚠ Même ordre que `etatMenage` : `orphaned` avant `differe`.
    if (m.status === 'orphaned') return `Ménage refusé — décision attendue${m.raison ? ' · ' + m.raison : ''}`
    if (m.differe) return 'Ménage — proposition à venir (le départ est encore loin)'
    if (m.porteur) return `Ménage porté par ${nomOu(m.porteur, avecNoms)}${m.retour ? ' · retour du voyageur, cliquez' : ''}`
    return 'Ménage — personne'
  }

  // ⚠ EN HEURE DE PARIS, et une échéance passée ne se dit pas « avant » :
  // l'information qui dit « faut-il agir maintenant » indiquerait le contraire.
  function delaiTexte (m) {
    if (!m.expireLe) return ''
    const d = new Date(m.expireLe)
    if (Number.isNaN(d.getTime())) return ''
    const quand = d.toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long',
                                              hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' })
    return Date.parse(m.expireLe) < Date.now() ? ` · délai dépassé (${quand})` : ` · réponse avant ${quand}`
  }

  // ─── Le détail au clic ────────────────────────────────────────────────────
  // ⚠ UN SEUL ÉCOUTEUR, DÉLÉGUÉ. Un par cellule, c'était 200 biens × 97 jours ×
  // 2 lignes ≈ 39 000 écouteurs, reconstruits à chaque rendu — y compris à
  // chaque case cochée dans le sélecteur de biens. La cellule porte déjà ce
  // qu'il faut dans ses `data-`.
  let indexCourant = { garde: {}, menages: {}, gere: {} }
  function brancherCellules (gardeIdx, menIdx, gereIdx) {
    indexCourant = { garde: gardeIdx, menages: menIdx, gere: gereIdx }
  }
  document.getElementById('blocks').addEventListener('click', e => {
    const td = e.target.closest('td.cell')
    if (!td) return
    const bien = td.dataset.bien
    const jour = td.dataset.jour
    ouvrirDetail(bien, jour, indexCourant.garde[`${bien}|${jour}`],
                 indexCourant.menages[`${bien}|${jour}`] || [],
                 indexCourant.gere[bien] !== false)
  })

  function ouvrirDetail (bienId, jour, g, menages, gere) {
    const bien = (donnees.biens || []).find(b => b.id === bienId)
    const avecNoms = donnees.avec_noms
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(jour)
    // ⚠ En UTC : une date de calendrier lue en heure locale se décale d'un jour
    // à l'ouest de Greenwich — le piège déjà corrigé deux fois dans ce dépôt.
    const lisible = m
      ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12))
          .toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
      : jour
    document.getElementById('popup-titre').textContent = lisible
    document.getElementById('popup-sous').textContent = bien ? bien.name : bienId

    let h = ''
    if (!gere) {
      h += '<div class="bloc">Ce bien n\'est confié à aucun prestataire. Ses ménages n\'ont personne, et c\'est normal.</div>'
    } else if (!g || g.trou || !g.responsable) {
      h += '<div class="bloc"><div class="etiq">Garde</div><span class="pastille alerte">personne de garde ce jour-là</span></div>'
    } else {
      const p = g.responsable
      // ⚠ MÊMES COULEURS QUE LA GRILLE : rouge pour une désactivée, ambre pour
      // des jours non réglés. Les fondre en une seule teinte confondait deux
      // problèmes différents — l'une ne peut plus ouvrir sa PWA, l'autre attend
      // un réglage.
      const mention = p.actif === false ? ' — désactivée, sa PWA ne s\'ouvre plus'
                    : (p.a_regler ? ' — jours à régler, aucune proposition ne lui partira' : '')
      const teinte = p.actif === false ? 'alerte' : (p.a_regler ? 'attente' : 'porte')
      h += `<div class="bloc"><div class="etiq">Garde</div>` +
           `<span class="pastille ${teinte}">${echapper(nomOu(p, avecNoms))}${echapper(mention)}</span></div>`
      if (g.remplacante) {
        h += `<div class="bloc"><div class="etiq">Remplaçante</div>` +
             `<span class="pastille">${echapper(nomOu(g.remplacante, avecNoms))}${g.remplacante.a_regler ? ' — jours à régler' : ''}</span></div>`
      }
    }

    if (!menages.length) {
      h += '<div class="bloc"><div class="etiq">Ménage</div>Aucun ménage ce jour-là.</div>'
    }
    for (const men of menages) {
      h += `<div class="bloc"><div class="etiq">Ménage</div>${etatMenageDetail(men, gere, avecNoms)}`
      // ⚠ LE RETOUR DE PROPRETÉ EST ICI, PAS DANS LA GRILLE : un pavé de texte
      // par cellule ruinerait la densité, qui est tout l'intérêt d'un calendrier.
      // La grille porte un 👍/👎 discret, le détail porte la phrase.
      if (men.retour) {
        const r = men.retour
        const badge = r.verdict === 'positif'
          ? '<span class="pastille retour-ok">👍 propreté saluée</span>'
          : '<span class="pastille retour-ko">👎 remarque propreté</span>'
        const prive = r.prive ? '<span class="retour-etiquette">retour privé</span>' : ''
        const humain = r.humain ? '<span class="retour-etiquette">requalifié par vous</span>' : ''
        const extrait = r.extrait ? `<div class="retour-extrait">« ${echapper(r.extrait)} »</div>` : ''
        h += `<div style="margin-top:8px">${badge}${prive}${humain}${extrait}</div>`
      }
      h += '</div>'
    }
    document.getElementById('popup-corps').innerHTML = h
    document.getElementById('overlay').classList.add('visible')
  }

  function etatMenageDetail (m, gere, avecNoms) {
    if (!gere) return '<span class="pastille">bien non confié</span>'
    if (m.proposeA) {
      const chez = m.porteur ? ` — porté par ${echapper(nomOu(m.porteur, avecNoms))} en attendant` : ''
      return `<span class="pastille attente">⏳ proposé à ${echapper(nomOu(m.proposeA, avecNoms))}</span>${chez}${echapper(delaiTexte(m))}`
    }
    // ⚠ Même ordre que la grille : `orphaned` avant `differe`.
    if (m.status === 'orphaned') {
      return `<span class="pastille alerte">⚠ refusé</span>${m.raison ? ' ' + echapper(m.raison) : ''}`
    }
    if (m.differe) return '<span class="pastille">proposition à venir</span> — le départ est encore loin, la proposition partira à l\'approche.'
    if (m.porteur) return `<span class="pastille porte">${echapper(nomOu(m.porteur, avecNoms))}</span>`
    return '<span class="pastille alerte">⚠ personne</span>'
  }

  // ─── Sélecteur de biens ───────────────────────────────────────────────────
  //
  // ⚠ RÉGLAGE D'AFFICHAGE, PAS DE CONFIGURATION (règle de config d'app). Il ne
  // vit que dans cette page : rien n'est écrit en base depuis cet écran.
  function renderSelecteurBiens () {
    const panel = document.getElementById('ms-panel')
    const tous = (donnees && donnees.biens) || []
    panel.innerHTML = tous.map(b => `
      <label class="ms-option">
        <input type="checkbox" value="${echapper(b.id)}" ${!biensChoisis || biensChoisis.has(b.id) ? 'checked' : ''}>
        <span>${echapper(b.name)}</span>
      </label>`).join('')
    panel.querySelectorAll('input').forEach(cb => {
      cb.addEventListener('change', () => {
        const coches = [...panel.querySelectorAll('input')].filter(x => x.checked).map(x => x.value)
        biensChoisis = coches.length === tous.length ? null : new Set(coches)
        majLabelBiens()
        rendre()
      })
    })
    majLabelBiens()
  }
  function majLabelBiens () {
    const tous = (donnees && donnees.biens) || []
    const n = biensChoisis ? biensChoisis.size : tous.length
    document.getElementById('ms-label').textContent =
      !biensChoisis || n === tous.length ? 'Tous les biens' : `${n} bien${n > 1 ? 's' : ''}`
  }

  function centrerSurAujourdhui (doux) {
    const area = document.getElementById('scroll-area')
    if (!area) return
    // La colonne du jour, moins un peu de marge pour voir ce qui précède.
    area.scrollTo({ left: Math.max(0, JOURS_AVANT * largeurCase() - 40), behavior: doux ? 'smooth' : 'auto' })
  }

  // ─── Branchements ─────────────────────────────────────────────────────────
  document.getElementById('ms-trigger').addEventListener('click', () => {
    document.getElementById('multi-select').classList.toggle('open')
  })
  document.addEventListener('click', e => {
    const ms = document.getElementById('multi-select')
    if (!ms.contains(e.target)) ms.classList.remove('open')
  })
  document.getElementById('period-select').addEventListener('change', e => {
    mois = Number(e.target.value) || 1
    charger()
  })
  document.getElementById('btn-today').addEventListener('click', () => centrerSurAujourdhui(true))

  // ⚠ LA BANDE DE MOIS EST CALCULÉE EN PIXELS. La media query change `--case`
  // toute seule pour les cases, mais pas les largeurs que le script a écrites :
  // après une rotation de téléphone, la bande restait aux dimensions de l'autre
  // orientation et se décalait des colonnes qu'elle est censée coiffer.
  // ⚠ ON NE REDESSINE QUE LA BANDE, jamais la grille entière. `rendre()` se
  // termine par `centrerSurAujourdhui()` et réactive la première pastille de
  // mois : sur Chrome Android, la simple rétractation de la barre d'URL pendant
  // un défilement émet `resize` — l'hôte qui consultait la mi-octobre était
  // ramené de force sur la colonne du jour, sans avoir rien demandé.
  // ⚠ ET JAMAIS PAR-DESSUS UN ÉTAT D'ERREUR OU DE CHARGEMENT. `donnees` garde la
  // dernière réponse reçue : redessiner sur ce seul critère repeignait une
  // ancienne grille à la place de « Chargement… » ou de « Service indisponible »,
  // avec le sélecteur affichant une période que la grille ne couvre pas.
  let grilleAffichee = false
  let redessin = null
  window.addEventListener('resize', () => {
    clearTimeout(redessin)
    redessin = setTimeout(() => { if (grilleAffichee) renderMonthBand() }, 150)
  })
  document.getElementById('btn-fermer').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('visible')
  })
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target.id === 'overlay') document.getElementById('overlay').classList.remove('visible')
  })
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('overlay').classList.remove('visible')
  })

  ;(async () => {
    session = await requireAuth()
    if (!session) return
    renderSidebar('menages-garde').catch(e => console.error('[garde] sidebar', e))
    await charger()
    if (donnees && (donnees.biens || []).length) renderSelecteurBiens()
  })()
</script>
</body>
</html>
