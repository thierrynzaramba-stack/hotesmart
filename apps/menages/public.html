    //     prendre une rangee entiere a chaque fois repousserait la liste ;
    //   · 0 case (mois finissant un dimanche) -> une rangee a lui.
    // Dans tous les cas il porte son `aria-label` : l'engrenage seul est muet
    // pour un lecteur d'ecran, et c'est le seul acces aux reglages.
    // ⚠ PAS D'ENGRENAGE POUR QUI NE REGLE RIEN : une porte qui ne mene qu'a
    // relire ce qu'on voit deja n'est pas une porte.
    // ⚠ UN SEUL ENGRENAGE, SUR LE DERNIER MOIS PEINT. `peindreUnMois` est appelee
    // deux fois (`DISPO_VISIBLES = 2`) : l'id etait donc emis EN DOUBLE — HTML
    // invalide, `getElementById` prenant le premier en silence, et deux portes
    // pour un reglage que le dessin annonce unique.
    if (engrenageIci) {
      const large = (casesMortes === 0 || casesMortes >= 3)
      // ⚠ LA COLONNE DES SEMAINES COMPTE. En quinzaine la grille fait HUIT
      // colonnes (`18px repeat(7, 1fr)`) : un element de 7 de large ne peut pas
      // commencer en colonne 8, il retombait sur une rangee neuve et l'engrenage
      // se calait a droite du SAMEDI, une case trop tot.
      const colonnes = alt ? 8 : 7
      const large7 = casesMortes === 0 ? colonnes : casesMortes
      out += `<div class="dispo-case-config" style="grid-column: span ${large7}">` +
             boutonReglages(large) + '</div>'
    }
    out += '</div></div>'
    return out
  }

  // ⚠ RECONSTRUIT A CHAQUE PEINTURE, donc son ecouteur vit sur le conteneur —
  // un ecouteur par bouton aurait fui a chaque changement de mois.
  function boutonReglages (avecLibelle) {
    return '<button type="button" class="dispo-lien-config' + (avecLibelle ? '' : ' seul') +
      '" id="btn-reglages" title="Mes jours" aria-label="Mes jours">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="3"></circle>' +
        '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 ' +
          '1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 ' +
          '19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 ' +
          '15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 ' +
          '0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 ' +
          '1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 ' +
          '2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.37.5.66.87.83H21a2 2 0 1 1 0 ' +
          '4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>' +
      '</svg>' + (avecLibelle ? 'Mes jours' : '') + '</button>'
  }

  // ─── MES 30 PROCHAINS JOURS (refonte v2, lot 3) ──────────────────────────
  //
  // Le calendrier dit OU et QUAND d'un coup d'oeil ; la liste dit QUOI. Elle
  // reprend `getMenages()` — la meme source que le planning — pour qu'un ecran
  // ne puisse pas contredire l'autre.
  //
  // ⚠ ELLE MELE SES MENAGES ET CEUX A PRENDRE, tries par date. Les separer en
  // deux listes obligeait a comparer deux colonnes pour savoir ce qu'il y a
  // mardi. Ce qui les distingue est leur ALLURE, pas leur emplacement.
  const AGENDA_JOURS = 30

  function peindreMonAgenda () {
    const zone = document.getElementById('agenda-liste')
    if (!zone) return
    const debut = AUJ()
    // ⚠ `- 1` : la borne est INCLUSIVE des deux cotes. Sans lui, « mes 30
    // prochains jours » en couvrait 31 — aujourd'hui plus trente.
    const fin = isoJ(new Date(Date.UTC(
      Number(debut.slice(0, 4)), Number(debut.slice(5, 7)) - 1,
      Number(debut.slice(8, 10)) + AGENDA_JOURS - 1, 12)))

    const lignes = []
    ;(Array.isArray(bookings) ? bookings : []).forEach(b => {
      if (!b.departure || b.departure < debut || b.departure > fin) return
      if (!activeProps.has(b.propId)) return
      lignes.push({ jour: b.departure, bien: b.propName || '', mien: true,
                    fait: doneSet.has(`${b.id}-${b.departure}`) })
    })
    ;(Array.isArray(aPrendre) ? aPrendre : []).forEach(m => {
      if (m.departure_date < debut || m.departure_date > fin) return
      if (!activeProps.has(m.property_id)) return
      lignes.push({ jour: m.departure_date, bien: m.property_name || '', mien: false,
                    offre: m })
    })
    if (!lignes.length) {
      // ⚠ « Rien de prevu » n'est pas « rien a faire » : on ne le dit que pour
      // les 30 jours qu'on regarde, pas en general.
      zone.innerHTML = '<div class="agenda-vide">Rien de prévu dans les 30 prochains jours.</div>'
      return
    }
    lignes.sort((a, b) => a.jour < b.jour ? -1 : a.jour > b.jour ? 1 : (a.bien < b.bien ? -1 : 1))

    const parJour = new Map()
    lignes.forEach(l => { if (!parJour.has(l.jour)) parJour.set(l.jour, []); parJour.get(l.jour).push(l) })

    let out = ''
    for (const [jour, items] of parJour) {
      const auj = jour === debut
      // Un jour ou elle s'est dite absente porte des menages : elle doit le voir
      // ici aussi, pas seulement sur le calendrier.
      const eteint = !jourTravaille(jour)
      out += `<div class="agenda-jour${auj ? ' auj' : ''}">` +
             `<div class="agenda-date">${auj ? "Aujourd’hui — " : ''}${echapper(jourLisible(jour))}` +
             (eteint ? ' <em>· vous êtes absente</em>' : '') + '</div>' +
             items.map(l => l.mien
               ? `<div class="agenda-item${l.fait ? ' fait' : ''}">` +
                 `<span class="agenda-bien">${echapper(l.bien)}</span>` +
                 (l.fait ? '<span class="agenda-tag fait">FAIT</span>' : '') + '</div>'
               // ⚠ ECHAPPEE COMME TOUT CE QUI VIENT DU SERVEUR. Ailleurs dans
               // ce fichier, `data-jour` porte une date fabriquee localement ;
               // ici elle vient de `departure_date`, et les bornes de la fenetre
               // sont des comparaisons de CHAINES — une valeur qui sort de
               // l'attribut y passerait.
               : `<button type="button" class="agenda-item offre" data-jour="${echapper(jour)}">` +
                 `<span class="agenda-bien">${echapper(l.bien)}</span>` +
                 '<span class="agenda-tag offre">À PRENDRE</span></button>').join('') +
             '</div>'
    }
    zone.innerHTML = out
  }

  // Le libelle de date vient de `jourLisible` (plus bas) : elle fait deja
  // exactement ca, en validant le format et en lisant la date en UTC. En
  // ecrire une seconde a produit une REDECLARATION — le bloc entier ne parsait
  // plus, et le test `js-navigateur-parse` l'a dit avant le navigateur.

  function peindreLegende (alt) {
    document.getElementById('dispo-legende').innerHTML =
      // ⚠ LA LEGENDE SUIT LA CASE. Elle decrivait encore le rouge des jours
      // absents — une couleur que le lot 2 a retiree — et ne disait rien des deux
      // marques qu'il a ajoutees. Une legende qui montre des couleurs absentes de
      // l'ecran est pire qu'une legende absente : elle fait douter de ce qu'on voit.
      '<span><i style="background:var(--green-bg);border:1px solid var(--green)"></i>Je travaille</span>' +
      '<span><i style="background:var(--bg2);border:1px solid var(--border)"></i>Je ne travaille pas</span>' +
      '<span><i style="background:var(--bg3);border:1px dashed var(--border)"></i>Congé</span>' +
      '<span><i style="background:var(--green-bg);border:1px solid var(--green);position:relative">' +
      '<b style="position:absolute;left:1px;top:1px;width:4px;height:4px;border-radius:50%;' +
      'background:var(--green);opacity:.7"></b></i>absence posée à la main</span>' +
      // Les deux marques du lot 2 : ce que j'ai a faire, et ce que personne ne fait.
      '<span><i style="background:var(--green-bg);border:1px solid var(--green);position:relative">' +
      '<b style="position:absolute;left:4px;bottom:1px;width:4px;height:4px;border-radius:50%;' +
      'background:var(--green)"></b></i>mon ménage</span>' +
      '<span><i style="background:var(--primary);border-radius:3px"></i>à prendre</span>' +
      (alt ? '<span><b style="color:var(--green)">A</b>/<b style="color:var(--amber)">B</b> à gauche de chaque semaine</span>' : '')
  }

  function peindreMesConges () {
    const zone = document.getElementById('dispo-conges')
    const liste = (mesJours.conges || []).slice()
      .sort((a, b) => String(a.debut).localeCompare(String(b.debut)))
    zone.innerHTML = liste.length ? liste.map(c => `
      <div class="dispo-item">
        <span>✕ du ${echapper(jourLisible(c.debut))} au ${echapper(jourLisible(c.fin))}
          ${c.motif ? '— ' + echapper(c.motif) : ''}
          ${c.source === 'prestataire' ? '' : '<span class="dispo-source">— posé par votre employeur</span>'}
        </span>
        ${c.source === 'prestataire' && mesJours.modifiable
          ? `<button class="btn-mini" data-conge="${echapper(c.id)}">Annuler</button>` : ''}
      </div>`).join('') : '<div class="dispo-aide">Aucun congé posé.</div>'
    zone.querySelectorAll('[data-conge]').forEach(b =>
      b.addEventListener('click', () => retirerMonConge(b.dataset.conge)))
  }

  // ⚠ TOUT CE QU'ON LUI DIT SURVIT AU REPEINT, y compris une confirmation.
  // Chaque ecriture se termine par `chargerDisponibilites()`, donc par
  // `peindreMesJours()` : sans ce drapeau, la phrase d'accueil ecrasait dans la
  // meme seconde le « ✓ Absence enregistree » qu'elle venait de declencher.
  // Elle touchait un jour, la case virait au rouge, et aucun mot ne confirmait
  // que c'etait parti — sur un telephone, c'est exactement le moment ou l'on
  // retouche pour etre sur, donc ou l'on defait ce qu'on vient de faire.
  // ⚠ LA OU ELLE REGARDE. Depuis le lot C, le formulaire de conge vit DANS la
  // feuille des reglages : `dire()` ecrivait alors dans le bandeau du
  // calendrier, derriere l'overlay. Elle tapait « Poser » sans date et ne voyait
  // RIEN — ni le refus, ni le hors-ligne, ni le « ✓ enregistre ».
  function direReglages (el, texte, type = 'erreur') {
    if (!reglagesOuverts) { dire(el, texte); return }
    if (type === 'ok') showModalSuccess(texte); else showModalError(texte)
  }

  function dire (msg, texte) {
    msg.dataset.garde = '1'
    msg.textContent = texte
  }

  // ⚠ HORS LIGNE, ON NE PROMET RIEN. Le planning a une file d'attente ; une
  // absence, non — la rejouer plus tard porterait sur un planning qui a bouge, et
  // l'ecran ne peut pas dire « c'est enregistre » quand rien n'est parti.
  // ⚠ IL ROUTE, IL N'ECRIT PLUS EN DUR. Depuis que les reglages vivent dans une
  // feuille, `dire()` depose ses messages dans le bandeau du calendrier —
  // derriere l'overlay. Corriger les deux fonctions de conge ne suffisait pas :
  // les jours habituels, l'alternance et l'ancrage passent tous par ici.
  // Une seule porte de sortie, et elle sait ou regarde la personne.
  function horsLigne (msg) {
    if (navigator.onLine) return false
    direReglages(msg, '⚠️ Hors ligne : rien n\'a été envoyé. Réessayez une fois connectée.')
    return true
  }

  // ─── SES JOURS HABITUELS : ecrire ─────────────────────────────────────────
  //
  // ⚠ UN SEUL APPEL POUR TOUT LE REGLAGE. La premiere version enchainait
  // « retirer tout, puis reposer » en autant d'appels qu'il y avait de regles :
  // le reseau d'un telephone coupe au milieu, le retrait passait, la pose non,
  // et TOUTES ses regles disparaissaient — donc « disponible tous les jours »,
  // l'inverse exact de ce qu'elle venait de demander — pendant que l'ecran
  // annoncait une panne serveur. Trouve en review, corrige a la racine.

  function joursCoches (lot) {
    return [...document.querySelectorAll(`#dispo-recur input[data-lot="${lot}"]:checked`)]
      .map(c => +c.value)
  }

  // ⚠ LES CASES SE VERROUILLENT PENDANT L'ENVOI. Sans ca, une seconde tape
  // partait dans un `return` MUET (`envoiEnCours`) : le navigateur avait deja
  // coche la case, la requete ne partait pas, le repeint la decochait — et le
  // message affichait « ✓ Vos jours sont enregistres » pour le geste PRECEDENT.
  // Une case grisee ne ment pas ; un retour muet, si.
  // ⚠ `reconcilierEnFond` A ETE RETIRE, et c'est la lecon du lot.
  // L'idee — rendre la main des que l'ecriture aboutit, reconcilier derriere —
  // ne vaut QUE si rien dans le DOM ne peut produire une ecriture fausse pendant
  // la fenetre. Sur ces quatre chemins, c'est faux : les cases A/B et la liste
  // des conges SONT la source de l'ecriture suivante, et elles affichent encore
  // l'etat d'avant. Deverrouiller tot y faisait perdre tous ses jours recurrents
  // (alternance), annuler l'echange (ancrage), ou transformer une annulation
  // reussie en erreur (conges).
  // Seul `enregistrerMesJours` peut s'en passer : la ou le DOM est deja la
  // verite qu'on envoie, et ou un numero d'ordre departage les envois.

  function verrouillerMesCases (verrou) {
    document.querySelectorAll('#dispo-recur input[data-lot]').forEach(c => { c.disabled = verrou })
  }

  async function envoyerMesJours (lots, { alt }) {
    const { ok, data } = await envoyer({ action: 'reglerMesJours', lots,
                                         toutes_les_n_semaines: alt ? 2 : 1 })
    return { ok, erreur: !ok ? ((data && data.error) || 'Vos jours n\'ont pas pu être enregistrés.') : null }
  }

  // Les deux lots tels que l'ecran les montre, ancrages compris.
  function lotsASoumettre (alt) {
    const cette = lundiDe(AUJ())
    const suivante = isoJ(new Date(dJour(cette).getTime() + 7 * 86400000))
    if (!alt) return [{ jours: joursCoches('simple'), depuis: cette }]
    // ⚠ ON GARDE L'ANCRAGE EXISTANT s'il y en a un : le deplacer a chaque
    // modification inverserait son rythme une fois sur deux.
    const { a } = lotsPwa()
    const d0 = (a && a.ancre) ? lundiDe(a.ancre) : cette
    const d1 = isoJ(new Date(dJour(d0).getTime() + 7 * 86400000))
    return [{ jours: joursCoches('a'), depuis: d0 }, { jours: joursCoches('b'), depuis: d1 }]
  }

  // ⚠ LE VERROU A ETE REMPLACE, PAS SUPPRIME (17 septembre 2026).
  //
  // Mesure en reel : ces cases gardaient le circuit d'AVANT le lot 1 — ecriture,
  // PUIS relecture complete (6 requetes base pour des donnees deja en memoire),
  // le tout cases GRISEES. Deux allers-retours pendant lesquels l'ecran ne
  // repond pas : c'est le meme reproche que le clic sur une date, au meme
  // endroit, resté sur ce chemin-la.
  //
  // ⚠ CE QUE LE VERROU PROTEGEAIT RESTE PROTEGE, et c'est le point. Il avait ete
  // pose pour un vrai defaut : une seconde tape partait dans un `return` MUET —
  // le navigateur avait deja coche la case, la requete ne partait pas, le repeint
  // la decochait, et le message affichait « ✓ » pour le geste PRECEDENT. Griser
  // rendait l'attente visible ; ca ne la supprimait pas.
  // Desormais chaque geste PART, et un NUMERO D'ORDRE decide qui a le dernier
  // mot : `reglerMesJours` envoie l'etat COMPLET lu a l'instant de l'envoi, donc
  // le dernier envoi est la verite. Aucun geste n'est avale, et rien ne gele.
  // ─── LE RENDU OPTIMISTE DES JOURS HABITUELS (18 septembre 2026) ───────────
  //
  // ⚠ MESURE AVANT CORRECTIF, dans le vrai DOM, ecriture et relecture tenues
  // separement : apres la tape sur « mardi », `input.checked` passe bien a vrai
  // — mais l'`<input>` est en `opacity: 0`, et le SEUL signal visible est la
  // classe `.dispo-pastille.on`, posee par `peindreMesRegles`. Or ce repeint
  // n'arrive qu'apres `chargerDisponibilites()`, c'est-a-dire apres DEUX
  // requetes en serie (l'ecriture, puis une relecture complete qui coute six
  // allers-retours base). Pastille grise et case du calendrier `off` pendant
  // toute cette fenetre : le plancher reseau mesure en prod est de 0,39 s par
  // requete, sans le travail base. Le lot 1 n'avait corrige que le clic sur une
  // DATE ; ce chemin-ci etait reste entier.
  //
  // ⚠ CE CHEMIN REMPLACE TOUTES LES REGLES EN UNE ACTION, et c'est ce qui rend
  // son rattrapage different de celui d'un jour. Le serveur desactive TOUT ce
  // qui etait actif puis insere le nouveau lot : il n'y a pas « une case » a
  // remettre, il y a un LOT DE REGLES d'avant a restaurer. On en prend donc une
  // photo complete avant de muter.
  let enVolRegles = null
  // ⚠ LA CIBLE DU RATTRAPAGE EST LE DERNIER LOT CONFIRME, PAS `mesJours`.
  // Deux defauts trouves en review, et ils ont la meme racine : photographier
  // `mesJours.regles` a l'entree suppose qu'il porte la verite du serveur, ce
  // qui est faux des qu'un envoi est deja en vol.
  //   1) DEUXIEME TAPE PENDANT UN VOL : ce chemin laisse passer le second geste
  //      (pas de verrou par case, c'est voulu). Sa photo capturait alors le lot
  //      OPTIMISTE du premier — hors ligne, le rattrapage rendait des jours que
  //      personne n'avait jamais enregistres.
  //   2) RELECTURE PENDANT UN VOL : `reappliquerEnVol` re-tamponne le lot en vol
  //      sur chaque objet fraichement lu. Un `mesJours` remplace ne porte donc
  //      PAS la verite du serveur — il porte l'optimiste. La garde d'identite
  //      qui sautait le rattrapage dans ce cas laissait la case verte sous
  //      « Panne ».
  // On ne prend donc la photo qu'au PREMIER envoi d'une rafale : `enVolRegles`
  // nul est exactement l'etat « rien d'optimiste en attente ».
  //
  // ⚠ CE QUE CETTE PHOTO NE SAIT PAS, ET QU'IL FAUT LIRE EN FACE : elle rend
  // l'etat d'AVANT LA RAFALE, pas « ce que le serveur a ». Si une tape de la
  // rafale a ete COMMISE en base mais que sa reponse s'est perdue (la suivante
  // a pris la main, donc son `catch` est avale), le rattrapage rend moins de
  // jours qu'il n'y en a reellement d'enregistres — et si la relecture qui suit
  // echoue aussi, rien ne le corrige avant le prochain chargement.
  // C'est le prix ASSUME du correctif : photographier a chaque tape rendait,
  // lui, des jours que PERSONNE n'avait enregistres — un mensonge dans l'autre
  // sens, et celui-la est le pire des deux, parce qu'il fait croire a une
  // disponibilite qu'elle n'a pas donnee.
  let reglesAvantVol = null

  // Un seul endroit ecrit le modele local des regles — la bascule optimiste et
  // la reapplication apres relecture diraient sinon deux fois la meme chose, de
  // deux facons, et c'est ainsi qu'elles finissent par diverger.
  // ⚠ ON REPRODUIT CE QUE LE SERVEUR FAIT, pas ce qui arrangerait l'ecran : il
  // desactive toutes les regles actives, les opaques COMPRISES (`avant` n'a
  // aucun filtre de lisibilite), puis insere les lots recus. Le modele local
  // remplace donc en entier, lui aussi.
  function appliquerRegles (lots, alt) {
    if (!mesJours) return
    const cadence = alt ? 2 : 1
    mesJours.regles = (lots || []).filter(l => l.jours && l.jours.length)
      .map((l, i) => ({ id: 'local-' + i, label: 'Mes jours',
                        jours: l.jours.slice().sort((a, b) => a - b),
                        cadence, ancre: l.depuis }))
    mesJours.forceAlternee = alt
  }

  // ⚠ RATTRAPAGE HONNETE : on remet le LOT d'avant, tout de suite, sans reseau.
  // Le faire par une relecture obligerait a un troisieme aller-retour — et hors
  // ligne, il n'aboutirait pas : l'ecran resterait sur des jours qui ne sont
  // partis nulle part.
  function rendreLesRegles () {
    // ⚠ D'ABORD COUPER L'ALIMENTATION. Tant que `enVolRegles` porte un lot, la
    // moindre relecture le re-tamponnerait par-dessus ce qu'on vient de rendre.
    enVolRegles = null
    if (!mesJours || !reglesAvantVol) return
    // ⚠ SUR L'OBJET COURANT, QUEL QU'IL SOIT — pas seulement sur celui qu'on a
    // mute. Un `mesJours` remplace pendant le vol porte l'etat optimiste, pas
    // celui du serveur : le sauter laissait precisement le mensonge qu'on veut
    // defaire.
    mesJours.regles = reglesAvantVol.regles
    mesJours.forceAlternee = reglesAvantVol.forceAlternee
    peindreMesJours()
  }

  let seqRegles = 0
  // Nombre d'ecritures de jours actuellement en vol. Les quatre autres chemins
  // s'y refusent l'entree — voir plus bas.
  let ecrituresRegles = 0
  async function enregistrerMesJours () {
    const msg = document.getElementById('dispo-message')
    if (!mesJours || !mesJours.modifiable) return
    // ⚠ HORS LIGNE : la case est DEJA cochee par le navigateur. Sortir sans
    // repeindre laisserait a l'ecran un reglage qui n'est parti nulle part.
    if (horsLigne(msg)) { peindreMesRegles(); return }

    const monTour = ++seqRegles
    const alt = enQuinzaine()
    const voulu = lotsASoumettre(alt)
    // ⚠ LES AUTRES ECRIVAINS DOIVENT ENCORE NOUS VOIR. Ils gardent tous leur
    // `if (… || envoiEnCours) return`, et en cessant de lever ce drapeau on les
    // rendait aveugles : cocher mercredi puis toucher « une semaine sur deux »
    // faisait calculer l'alternance sur un `mesJours` d'AVANT — mercredi
    // disparaissait, sans un mot. Le numero d'ordre ne departage que les
    // ecritures de jours entre elles ; il ne dit rien aux quatre autres.
    // ⚠ UN COMPTEUR, PAS UN BOOLEEN : cette fonction se rappelle elle-meme
    // (reprise quand la coche a bouge pendant l'envoi), et un booleen serait
    // baisse par l'appel interne pendant que l'externe est encore en vol.
    ecrituresRegles++
    // ⚠ LE VERROU EST POSE AVANT LA MUTATION QU'IL GARDE (regle du KB, apprise
    // au lot 1) — ET LA MUTATION EST DANS LE `try`. Entre l'increment et le
    // `try`, il n'y avait plus qu'un `dire()` ; ce lot y avait glisse un
    // `peindreMesJours()` complet (regles, deux mois, agenda, conges). Une
    // exception la-dedans laissait le compteur en l'air pour de bon, et les
    // quatre autres ecrivains — alternance, ancrage, pose et retrait de conge —
    // sortaient en silence pour le reste de la session.
    try {
      // ⚠ LA PHOTO NE SE PREND QU'AU PREMIER ENVOI D'UNE RAFALE. `enVolRegles`
      // nul = rien d'optimiste en attente = `mesJours` porte bien le confirme.
      if (!enVolRegles) {
        reglesAvantVol = { regles: (mesJours.regles || []).slice(),
                           forceAlternee: !!mesJours.forceAlternee }
      }

      // ⚠ L'ECRAN BASCULE MAINTENANT, PAS DANS DEUX ALLERS-RETOURS. La case cochee
      // par le navigateur est INVISIBLE (`opacity: 0`) : seule la classe `on`, et
      // la couleur du calendrier, disent ce qui vient d'etre regle.
      appliquerRegles(voulu, alt)
      enVolRegles = { lots: voulu, alt }
      peindreMesJours()
      direReglages(msg, '✓ Vos jours sont enregistrés.', 'ok')

      const { ok, erreur } = await envoyerMesJours(voulu, { alt })
      // Un geste plus recent a pris la main : sa reponse fera foi, pas celle-ci.
      // ⚠ ET ON NE TOUCHE PAS A `enVolRegles` : il porte deja le geste du
      // suivant, encore en vol. L'effacer ici ferait retomber SON ecran a la
      // premiere relecture.
      if (monTour !== seqRegles) return
      if (!ok) {
        // ⚠ RATTRAPAGE HONNETE : on remet le LOT d'avant — pas une case — et on
        // dit ce que le serveur a repondu. Laisser les jours affiches apres un
        // refus, c'est un ecran qui ment sur ce qui est enregistre.
        rendreLesRegles()
        direReglages(msg, erreur)
        // Et on se recale derriere, sans panneau d'erreur par-dessus le refus
        // qu'on vient d'afficher.
        await relireSilencieusement()
        return
      }
      enVolRegles = null
      // ⚠ LA RELECTURE RESTE, MAIS ELLE NE FAIT PLUS ATTENDRE. Le serveur decide
      // du REMPLACEMENT (une regle que la PWA ne sait pas relire n'est pas
      // ecrasee par ce qu'elle affiche) : sans elle, l'ecran finirait par
      // diverger de ce qui est reellement enregistre.
      await chargerDisponibilites()
      if (monTour !== seqRegles) return
      // Et on regarde si la coche a bouge pendant l'envoi — un clavier, un
      // second onglet. Comparer l'etat voulu a l'etat courant evite d'avaler un
      // geste en silence, ce qui est exactement ce que le verrou empechait.
      const apres = lotsASoumettre(enQuinzaine())
      const change = JSON.stringify(apres.map(l => l.jours)) !== JSON.stringify(voulu.map(l => l.jours))
      if (change) return enregistrerMesJours()
    } catch (err) {
      if (monTour !== seqRegles) return
      // ⚠ UN `catch` EST UNE ISSUE INCONNUE : on ne sait pas si l'ecriture est
      // passee. On remet donc l'etat d'avant — le seul qu'on sache vrai — et on
      // le dit. La restauration est LOCALE : hors ligne, une relecture
      // n'aboutirait pas, et l'ecran resterait sur des jours partis nulle part.
      rendreLesRegles()
      direReglages(msg, 'Connexion impossible. Réessayez.')
      await relireSilencieusement()
    } finally {
      ecrituresRegles = Math.max(0, ecrituresRegles - 1)
    }
  }

  async function basculerMonAlternance (vers) {
    const msg = document.getElementById('dispo-message')
    if (!mesJours || !mesJours.modifiable || envoiEnCours || ecrituresRegles) return
    if (horsLigne(msg)) return
    envoiEnCours = true
    verrouillerMesCases(true)
    try {
      // ⚠ REVENIR A « TOUTES LES SEMAINES » GARDE LA SEMAINE A, et l'ecran le
      // dit. Fusionner les deux lignes aurait invente un rythme que personne n'a
      // regle — et elle se serait retrouvee engagee des jours qu'elle n'avait
      // coches que pour une semaine sur deux.
      const source = vers ? fusion(reglesLues()) : lotsPwa().a
      const jours = source ? source.jours : []
      const { ok, erreur } = await envoyerMesJours(
        [{ jours, depuis: lundiDe(AUJ()) }], { alt: !!vers })
      if (ok) {
        // ⚠ LE MODE NE SE POSE QUE SI L'ECRITURE A REUSSI. Le poser dans tous les
        // cas faisait basculer l'ecran en A/B alors que RIEN n'avait ete ecrit.
        mesJours.forceAlternee = !!vers
        // ⚠ ET LE MESSAGE DIT CE QUI S'EST PASSE, pas ce qu'on esperait. Avec une
        // semaine A vide, « les jours de la semaine A sont conserves » annoncait
        // une conservation alors qu'on venait de tout effacer — donc
        // « disponible tous les jours », sans un mot.
        direReglages(msg, vers ? 'Cochez les jours de la semaine B.'
                       : (jours.length ? 'Les jours de la semaine A sont conservés.'
                                       : 'Vous n\'avez plus aucun jour habituel : ' +
                                         'vous êtes comptée disponible tous les jours.'))
      } else {
        direReglages(msg, erreur)
      }
      // ⚠ LE VERROU TIENT JUSQU'AU REPEINT, ET C'EST VITAL ICI.
      // J'avais rendu la main avant la relecture, comme ailleurs. Mais
      // `forceAlternee` est pose AVANT : pendant toute la fenetre, `enQuinzaine()`
      // rend deja `true` alors que le DOM ne contient encore que des cases
      // `data-lot="simple"`. Une tape dans cet intervalle appelle
      // `lotsASoumettre(true)`, qui lit `joursCoches('a')` et `joursCoches('b')`
      // — tous deux VIDES — et envoie deux lots vides : elle perd TOUS ses jours
      // recurrents, donc elle est comptee disponible tous les jours, pendant que
      // l'ecran affiche « ✓ Vos jours sont enregistres ».
      // Ce chemin change la STRUCTURE de l'ecran ; on ne peut pas rendre la main
      // avant que l'ecran corresponde a la structure annoncee.
      await chargerDisponibilites()
      if (ok && mesJours) mesJours.forceAlternee = !!vers
      peindreMesJours()
    } catch (err) {
      direReglages(msg, 'Connexion impossible. Réessayez.')
    } finally { envoiEnCours = false; verrouillerMesCases(false) }
  }

  // ⚠ INVERSER, C'EST ECHANGER LES ANCRAGES DES DEUX LOTS. La semaine A est, par
  // definition, celle qui couvre la semaine en cours : pour que « c'est plutot
  // une semaine B » ait un effet, il faut que le CONTENU des deux lignes
  // s'echange — pas qu'on renomme une etiquette.
  async function inverserMonAncrage () {
    const msg = document.getElementById('dispo-message')
    if (!mesJours || !mesJours.modifiable || envoiEnCours || ecrituresRegles) return
    if (horsLigne(msg)) return
    envoiEnCours = true
    verrouillerMesCases(true)
    try {
      const { a, b } = lotsPwa()
      const cette = lundiDe(AUJ())
      const suivante = isoJ(new Date(dJour(cette).getTime() + 7 * 86400000))
      const { ok, erreur } = await envoyerMesJours(
        [{ jours: a ? a.jours : [], depuis: suivante },
         { jours: b ? b.jours : [], depuis: cette }], { alt: true })
      direReglages(msg, ok ? '✓ Les deux semaines sont échangées.' : erreur)
      // ⚠ MEME PIEGE QUE L'ALTERNANCE : tant que la relecture n'a pas atterri,
      // les lignes A/B affichent encore l'ANCIEN arrangement. Une tape dans
      // cette fenetre reecrit l'ancrage d'avant et annule silencieusement
      // l'echange qu'on vient de confirmer.
      await chargerDisponibilites()
    } catch (err) {
      direReglages(msg, 'Connexion impossible. Réessayez.')
    } finally { envoiEnCours = false; verrouillerMesCases(false) }
  }

  let envoiEnCours = false
  async function envoyer (corps) {
    const res = await fetch(`/api/menages-public?token=${currentToken}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corps)
    })
    const data = await res.json().catch(() => null)
    return { ok: res.ok, data }
  }

  // Jours dont l'ecriture est en vol, avec la valeur VOULUE (`true` = absente).
  // Remplace le verrou d'ecran pour CE geste seul : les autres ecritures de la
  // page (regles, conges) gardent le leur, elles portent sur tout le reglage et
  // non sur une case. La valeur sert a `reappliquerEnVol` quand un rechargement
  // tombe au milieu.
  const enVolParJour = new Map()

  // ⚠ `depuisFeuille` : appelee DEPUIS la feuille du jour (lot B), le raccourci
  // « une offre passe avant tout » ne doit pas rejouer — la feuille montre deja
  // les propositions dans leur propre section, et y renvoyer ferait sauter la
  // feuille sous le doigt de qui touchait le segment de disponibilite.
  async function basculerMonJour (j, { depuisFeuille = false } = {}) {
    const msg = document.getElementById('dispo-message')
    // ⚠ LE MESSAGE DOIT ATTERRIR LA OU ELLE REGARDE. Depuis le lot B, ce chemin
    // n'est plus appele QUE depuis la feuille — et `dire()` ecrit dans le bandeau
    // de la carte, recouvert par l'overlay. Hors ligne, elle touchait le segment,
    // rien ne bougeait, et l'explication s'affichait derriere le modal : il ne se
    // passait rien, sans un mot. On route donc vers les messages de la feuille.
    // ⚠ ET IL FAUT QUE LA FEUILLE SOIT ENCORE LA, SUR CE JOUR-LA. Router sur le
    // seul `depuisFeuille` ecrivait dans un modal ferme — la journee revenait
    // toute seule dans le calendrier, sans un mot nulle part — ou pire, affichait
    // le refus du jour A sur la feuille du jour B qu'elle venait d'ouvrir.
    const direIci = (texte, type = 'erreur') => {
      if (!depuisFeuille || !feuilleOuverteSur(j)) { dire(msg, texte); return }
      if (type === 'ok') { showModalSuccess(texte) } else { showModalError(texte) }
    }
    // ⚠ UNE OFFRE PASSE AVANT TOUT LE RESTE, Y COMPRIS UN JOUR D'ABSENCE OU DE
    // CONGE (decision du 17 septembre). C'est ce qui demande une decision ; le
    // reste du jour, lui, ne change pas. Ce test vient donc avant les gardes de
    // la bascule — sinon un jour eteint ou en conge ressortait ici sans jamais
    // montrer la seule chose qui s'y passe.
    if (j >= AUJ()) {
      const libres = aPrendreDu(j)
      if (!depuisFeuille && libres.length) { ouvrirPriseDeMenage(j, libres); return }
    }
    if (!mesJours.modifiable) return
    if (j < AUJ() || congeDuJour(j)) return
    // ⚠ HORS LIGNE PASSE AUSSI PAR `direIci`. `horsLigne()` ecrit directement
    // dans le bandeau de la carte : depuis la feuille, elle touchait le segment,
    // rien ne bougeait, et l'explication s'affichait derriere l'overlay.
    if (!navigator.onLine) {
      direIci('⚠️ Hors ligne : rien n\'a été envoyé. Réessayez une fois connectée.')
      return
    }
    const exc = exceptionDuJour(j)
    // ⚠ ELLE N'ANNULE QUE CE QU'ELLE A DECLARE. Une absence posee par son
    // employeur n'est pas la sienne a defaire : la lui laisser effacer la
    // remettrait candidate sur un jour dont il l'avait retiree, sans qu'il
    // l'apprenne. L'ecran ne propose donc pas le geste.
    if (exc && exc.source !== 'prestataire') {
      // ⚠ DEUX SENS, DEUX PHRASES. L'hote peut poser « pas ce samedi-la »
      // (`available: false`) MAIS AUSSI « viens exceptionnellement ce samedi »
      // (`available: true`). Un libelle unique annoncait « cette absence a ete
      // posee par votre employeur » a quelqu'un a qui on venait au contraire de
      // DEMANDER de venir — elle n'y comprenait rien, et n'avait aucun moyen de
      // dire qu'elle ne pouvait pas.
      direIci(exc.available
        ? 'Votre employeur vous a demandé de venir ce jour-là. Si vous ne pouvez pas, dites-le lui.'
        : 'Cette absence a été posée par votre employeur. Pour la retirer, dites-le lui.')
      return
    }
    // ⚠ UN MENAGE FIXE LA JOURNEE (lot A). Se declarer absente pendant qu'on doit
    // y etre n'est pas un reglage, c'est une contradiction — et le chemin de
    // retour existe : il passe par le RETRAIT du menage, avec son delai.
    // ⚠ CETTE GARDE EST NEE DE L'INVARIANT, et sans elle il ouvrait une faille.
    // Avant, un jour de repos portant un menage sortait sur « vous ne travaillez
    // deja pas ce jour-la » et rien ne partait. Depuis que `jourTravaille` rend
    // VRAI des qu'un menage est la — ce qui est juste — ce filet a saute, et la
    // bascule declarait une absence sur une journee ou elle est attendue.
    // Corriger une lecture oblige a reprendre ce qu'elle protegeait par accident.
    // ⚠ `!exc` EST DECISIF, ET SON ABSENCE PIEGEAIT LA PRESTATAIRE. La garde
    // jouait dans les DEUX sens : elle empechait aussi de RETIRER une absence
    // qu'elle avait posee elle-meme, si l'hote lui attribuait ensuite un menage
    // ce jour-la. L'absence restait alors en base, invisible a l'ecran (le
    // ménage la recouvre), et sans aucun moyen de la lever depuis l'interface.
    // On interdit de POSER une absence sur un jour de travail ; on n'interdit
    // jamais d'en retirer une.
    if (!exc && mesMenagesTousBiens(j).length) {
      direIci('Vous avez un ménage ce jour-là. Pour vous libérer, retirez-le d’abord.')
      return
    }
    if (!exc && !jourTravaille(j)) {
      direIci('Vous ne travaillez déjà pas ce jour-là.')
      return
    }
    // ─── RENDU OPTIMISTE ────────────────────────────────────────────────
    // ⚠ C'EST LE REPROCHE N° 1 DES UTILISATRICES, ET IL ETAIT MERITE.
    // L'ancien chemin attendait DEUX allers-retours reseau avant de changer
    // quoi que ce soit a l'ecran : l'ecriture, puis `chargerDisponibilites()`
    // — une relecture COMPLETE qui coute 6 requetes base enchainees pour des
    // donnees qu'on a deja. Mesure du 17 septembre 2026 sur la production :
    // le plancher de cet endpoint (jeton invalide, donc UNE seule requete base
    // avant le refus) tient deja 0,42 a 1,07 s depuis un poste filaire. Le vrai
    // clic en faisait dix fois plus, deux fois de suite, sur un telephone.
    // Pendant tout ce temps la case ne changeait pas d'etat — elle passait a
    // 45 % d'opacite — et `envoiEnCours` bloquait TOUT le calendrier, si bien
    // qu'une seconde tape ne faisait rien du tout.
    //
    // Desormais : on bascule l'affichage TOUT DE SUITE, on envoie derriere, et
    // on NE RELIT PAS. Un basculement d'un jour ne change ni les regles ni les
    // conges : la relecture ne rapportait rien que l'ecran ne sache deja.
    //
    // ⚠ LE RATTRAPAGE EST LA CONTREPARTIE, PAS UNE OPTION. Un rendu optimiste
    // qui ne sait pas revenir en arriere ne rend pas l'ecran rapide : il le
    // rend MENTEUR, ce qui est pire que lent. En cas d'echec on remet l'etat
    // EXACT d'avant et on le dit.
    // ⚠ VERROU PAR JOUR, PLUS PAR ECRAN — ET AVANT LA BASCULE, PAS APRES.
    // `envoiEnCours` gelait le calendrier entier : taper un second jour pendant
    // l'envoi du premier ne faisait rien, sans le moindre signe. On n'empeche
    // plus que la course sur LE MEME jour, qui seule peut partir en double.
    //
    // ⚠ LA PLACE DE CE TEST EST LE PIEGE. Pose APRES la bascule optimiste, il
    // produisait exactement le mensonge que le rattrapage existe pour empecher :
    // deuxieme tape sur le meme jour -> l'ecran s'inversait, puis on sortait
    // sans rien envoyer. La premiere ecriture aboutissait, et l'ecran affichait
    // durablement l'INVERSE de ce que le serveur avait enregistre. On sort donc
    // AVANT de toucher quoi que ce soit : la seconde tape ne fait rien du tout,
    // ce qui est juste — l'envoi qu'elle voudrait annuler est deja parti.
    if (enVolParJour.has(j)) return

    // ⚠ ON NE GARDE QUE CE JOUR-LA, PAS UN INSTANTANE DU TABLEAU.
    // Premiere version : `avant = exceptions.slice()`, restitue en bloc sur
    // echec. Avec un verrou PAR JOUR, deux ecritures peuvent etre en vol en
    // meme temps : l'echec de la premiere rendait alors le tableau d'AVANT la
    // seconde, effacant une absence pourtant enregistree cote serveur. Un
    // verrou par jour impose un rattrapage par jour — c'est la contrepartie
    // qu'on doit a la levee du verrou d'ecran.
    const excAvant = exc ? Object.assign({}, exc) : null
    // Identite de l'objet d'etat, pour reconnaitre un RECHARGEMENT survenu
    // entre-temps (`chargerDisponibilites` remplace `mesJours` en entier).
    // Sans ce reperage, un rattrapage tardif reecrivait des donnees fraiches
    // par-dessus, effacant a l'ecran une absence que l'employeur venait de poser.
    const monEtat = mesJours

    // ⚠ LE DRAPEAU SE POSE AVANT CE QU'IL GARDE, et avant le redessin qui le LIT.
    // Il etait pose apres `ouvrirJour` : la feuille se redessinait sur un etat ou
    // rien n'etait encore « en vol », donc le segment ressortait ACTIF alors que
    // l'ecriture partait. La seconde tape sortait ensuite sur
    // `enVolParJour.has(j)` sans un mot.
    // Meme lecon qu'au lot 1 : un verrou qui protege une ecriture se pose AVANT
    // la mutation qu'il garde — ici, avant le rendu qui s'en sert.
    enVolParJour.set(j, !exc)

    appliquerJour(j, !exc)
    peindreMesJours()
    // ⚠ ET LA FEUILLE SE REDESSINE, si le geste vient d'elle. Sans cela, le
    // segment resterait sur la face qu'on vient de quitter : le calendrier
    // derriere aurait bascule, la feuille par-dessus dirait le contraire, et
    // c'est celle-ci qu'elle regarde.
    if (depuisFeuille && feuilleOuverteSur(j)) ouvrirJour(j)
    direIci(exc ? '✓ Absence annulée.' : '✓ Absence enregistrée.', 'ok')

    // (La valeur VOULUE est retenue le temps du vol, plus haut : si un
    // rechargement tombe au milieu, `reappliquerEnVol` la remet par-dessus
    // l'etat serveur qui ne la connait pas encore.)

    const rattraperCeJour = (texte) => {
      // Rechargement passe par la : l'etat courant vient du serveur, il est plus
      // frais que tout ce qu'on pourrait restituer. On ne touche a rien.
      if (mesJours === monEtat) {
        mesJours.exceptions = (mesJours.exceptions || [])
          .filter(e => String(e.date).slice(0, 10) !== j)
        if (excAvant) mesJours.exceptions = mesJours.exceptions.concat([excAvant])
        peindreMesJours()
        // ⚠ SEULEMENT SI LA FEUILLE EST ENCORE OUVERTE SUR CE JOUR-LA.
        // `ouvrirJour` finit par `display = 'flex'` : appele apres coup, il
        // ROUVRAIT une feuille qu'elle avait fermee, ou — pire — remplacait sous
        // ses yeux le contenu du jour qu'elle venait d'ouvrir par celui du jour
        // en echec, ET reprenait `jourOuvert` : sa tape suivante ecrivait alors
        // sur le mauvais jour.
        if (depuisFeuille && feuilleOuverteSur(j)) ouvrirJour(j)
      }
      direIci(texte)
    }

    try {
      const { ok, data } = await envoyer({
        action: exc ? 'retirerIndisponibilite' : 'declarerIndisponibilite', date: j })
      enVolParJour.delete(j)
      // Le serveur a REPONDU non : l'issue est connue, on peut l'affirmer.
      if (!ok) rattraperCeJour((data && data.error) || 'Pas enregistré. Votre journée n\'a pas changé.')
    } catch (err) {
      enVolParJour.delete(j)
      // ⚠ ON NE SAIT PAS SI L'ECRITURE A ABOUTI. `fetch` leve aussi bien quand la
      // requete n'est jamais partie que quand c'est la REPONSE qui s'est perdue —
      // et `declarerIndisponibilite` est idempotent cote serveur, donc le second
      // cas laisse l'absence enregistree. Affirmer « votre journee n'a pas
      // change » serait donc un mensonge une fois sur deux, et depuis que la
      // relecture systematique a disparu, plus rien ne viendrait le corriger.
      // On redemande au serveur ; si lui non plus ne repond pas, alors seulement
      // on restitue, et on le dit sans rien affirmer de plus.
      const relu = await relireSilencieusement()
      if (relu && depuisFeuille && feuilleOuverteSur(j)) ouvrirJour(j)
      if (relu) direIci('Envoi interrompu — votre journée a été rechargée.')
      else rattraperCeJour('Connexion impossible. Réessayez dans un instant.')
    }
  }

  // Pose ou retire l'absence d'UN jour dans l'etat courant. Un seul endroit
  // ecrit cette ligne : la bascule, le rattrapage et la reapplication apres
  // rechargement diraient sinon trois fois la meme chose, de trois facons.
  function appliquerJour (j, absente) {
    const reste = (mesJours.exceptions || []).filter(e => String(e.date).slice(0, 10) !== j)
    // Pas d'`id` : le serveur le donnera. Les deux ecritures se font PAR DATE
    // (`declarer`/`retirerIndisponibilite`), et le rendu ne lit que `date`,
    // `available` et `source` — la ligne locale porte donc tout ce qu'il faut.
    mesJours.exceptions = absente
      ? reste.concat([{ date: j, available: false, source: 'prestataire' }])
      : reste
  }

  // ⚠ UN RECHARGEMENT NE DOIT PAS DEFAIRE CE QUI EST ENCORE EN VOL.
  // `chargerDisponibilites` peut tomber au milieu d'une ecriture (retour sur
  // l'onglet, pose d'un conge, reglage des jours) : le serveur rend alors l'etat
  // d'AVANT, la case retombe toute seule, et « ✓ Absence enregistree » reste
  // affiche au-dessus. On remet donc par-dessus les jours dont l'ecriture n'a
  // pas encore rendu son verdict.
  function reappliquerEnVol () {
    if (!mesJours) return
    // ⚠ LES REGLES AUSSI, et avant les jours : une relecture qui atterrit
    // pendant qu'un reglage s'envoie rendait les jours d'AVANT, les pastilles
    // redevenaient grises toutes seules, et « ✓ Vos jours sont enregistres »
    // restait affiche au-dessus.
    if (enVolRegles) appliquerRegles(enVolRegles.lots, enVolRegles.alt)
    if (!enVolParJour.size) return
    enVolParJour.forEach((absente, j) => appliquerJour(j, absente))
  }

  // Relecture SANS panneau d'erreur : sert au rattrapage, ou afficher « vos
  // jours n'ont pas pu etre lus » par-dessus une absence qu'on vient peut-etre
  // d'enregistrer ajouterait de la confusion a l'incertitude.
  // ⚠ UN SEUL ENDROIT ECRIT CET ECRAN, parce que les DEUX chemins de lecture y
  // arrivent : la lecture normale et le rattrapage.
  function ecranNonAutorisee () {
    // ⚠ ET ON FERME LA FEUILLE. Les deux cartes de reglages en sont sorties : les
    // laisser ouvertes, avec un bouton « Poser » vivant, au-dessus d'une page qui
    // vient d'annoncer que ses absences sont gerees par son employeur, lui
    // promettait un geste que le serveur refuse desormais en 403 — et refermer
    // ensuite les rangeait dans un conteneur devenu invisible.
    closeModal()
    const etat = document.getElementById('dispo-etat')
    const contenu = document.getElementById('dispo-contenu')
    etat.innerHTML = '<strong>Vos absences sont gérées par votre employeur</strong>Prévenez-le directement.'
    etat.style.display = ''; contenu.style.display = 'none'
  }

  async function relireSilencieusement () {
    try {
      const res = await fetch(`/api/menages-public?action=disponibilites&token=${currentToken}`)
      if (!res.ok) return false
      const data = await res.json()
      // ⚠ UN DROIT RETIRE N'EST PAS UN ECHEC DE LECTURE. Rendre `false` en
      // silence laissait les cases ACTIVES sous un « Non autorisé » seul :
      // chaque tape suivante repartait vers le meme 403. Quand l'employeur
      // reprend la main, l'ecran doit le dire — c'est le seul cas ou le
      // rattrapage a le droit de remplacer le panneau.
      if (data.autorise !== true) { ecranNonAutorisee(); return false }
      mesJours = { regles: data.regles || [], exceptions: data.exceptions || [],
                   conges: data.conges || [], modifiable: data.modifiable === true,
                   mois: mesJours ? mesJours.mois : 0 }
      reappliquerEnVol()
      peindreMesJours()
      return true
    } catch (err) { return false }
  }

  async function poserMonConge () {
    const msg = document.getElementById('dispo-message')
    if (!mesJours || !mesJours.modifiable || envoiEnCours || ecrituresRegles) return
    const du = document.getElementById('conge-du').value
    const au = document.getElementById('conge-au').value
    if (!du || !au) { direReglages(msg, 'Choisissez un début et une fin.'); return }
    if (!navigator.onLine) {
      direReglages(msg, '\u26a0\ufe0f Hors ligne : rien n\'a \u00e9t\u00e9 envoy\u00e9. R\u00e9essayez une fois connect\u00e9e.')
      return
    }
    envoiEnCours = true
    try {
      const { ok, data } = await envoyer({ action: 'declarerConge', debut: du, fin: au,
        motif: document.getElementById('conge-motif').value.trim() })
      if (!ok) { direReglages(msg, (data && data.error) || 'Impossible d\'enregistrer.'); return }
      // ⚠ Les trois champs se vident : les laisser remplis avec un bouton actif
      // invite au second appui, et la table n'a aucune contrainte d'unicite.
      for (const id of ['conge-du', 'conge-au', 'conge-motif']) document.getElementById(id).value = ''
      direReglages(msg, data && data.deja ? '✓ Ce congé était déjà posé.' : '✓ Congé enregistré.', 'ok')
      // ⚠ On se place sur le mois du conge : poser une date qu'on ne voit pas
      // apparaitre se lit comme un geste qui a echoue.
      const b = dJour(AUJ()), d = dJour(du)
      if (d) mesJours.mois = Math.max(0, Math.min(DISPO_MOIS - 1,
        (d.getUTCFullYear() - b.getUTCFullYear()) * 12 + (d.getUTCMonth() - b.getUTCMonth())))
      await chargerDisponibilites()
    } catch (err) {
      direReglages(msg, 'Connexion impossible. Réessayez.')
    } finally { envoiEnCours = false }
  }

  async function retirerMonConge (id) {
    const msg = document.getElementById('dispo-message')
    // Le bouton n'existe que si `modifiable`, et le serveur refuse de toute
    // facon — mais les trois chemins d'ecriture posent la meme garde, et une
    // asymetrie est ce qui se perd au prochain remaniement.
    if (!mesJours || !mesJours.modifiable || envoiEnCours || ecrituresRegles) return
    if (!navigator.onLine) {
      direReglages(msg, '\u26a0\ufe0f Hors ligne : rien n\'a \u00e9t\u00e9 envoy\u00e9. R\u00e9essayez une fois connect\u00e9e.')
      return
    }
    envoiEnCours = true
    try {
      const { ok, data } = await envoyer({ action: 'retirerConge', id })
      if (!ok) { direReglages(msg, (data && data.error) || 'Impossible d\'annuler.'); return }
      direReglages(msg, '✓ Congé annulé.', 'ok')
      // ⚠ LA LIGNE RESTE A L'ECRAN TANT QUE LA RELECTURE N'A PAS ATTERRI, et
      // elle reste cliquable. Rendre la main avant laissait une seconde tape
      // renvoyer le meme identifiant : le serveur refusait, et « ✓ Congé
      // annulé. » se changeait en « Impossible d'annuler. » pour une annulation
      // qui avait REUSSI.
      await chargerDisponibilites()
    } catch (err) {
      direReglages(msg, 'Connexion impossible. Réessayez.')
    } finally { envoiEnCours = false }
  }

  function jourLisible (d) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ''))
    if (!m) return String(d || '')
    // ⚠ En UTC : une date de calendrier lue en heure locale se decale d'un jour
    // a l'ouest de Greenwich.
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString('fr-FR',
      { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
  }

  // ─── Branchements, poses une seule fois ──────────────────────────────────
  // ⚠ CHANGER DE MOIS LEVE LE DRAPEAU. `dire()` le pose pour que la confirmation
  // survive au repeint qui suit immediatement l'ecriture — mais il ne retombait
  // jamais, et un « ✓ Absence enregistree » la suivait de mois en mois pendant
  // que la phrase d'aide ne revenait plus. Une confirmation parle du geste qu'on
  // vient de faire ; des qu'elle regarde ailleurs, elle a fait son travail.
  // ⚠ ON NE LA LEVE PAS DANS `chargerDisponibilites` : la relecture suit
  // immediatement chaque ecriture, et l'y mettre effacerait la confirmation
  // exactement comme avant — essaye, teste, et remis ici.
  function oublierLeMessage () {
    const m = document.getElementById('dispo-message')
    if (m) delete m.dataset.garde
  }
  document.getElementById('dispo-prec').addEventListener('click', () => {
    if (mesJours && mesJours.mois > 0) { mesJours.mois--; oublierLeMessage(); peindreMesJours() } })
  document.getElementById('dispo-suiv').addEventListener('click', () => {
    if (mesJours && mesJours.mois < DISPO_MOIS - 1) { mesJours.mois++; oublierLeMessage(); peindreMesJours() } })
  document.getElementById('dispo-auj').addEventListener('click', () => {
    if (mesJours) { mesJours.mois = 0; oublierLeMessage(); peindreMesJours() } })
  document.getElementById('btn-conge').addEventListener('click', poserMonConge)

  // ⚠ UN SEUL ECOUTEUR, POSE UNE FOIS, SUR LE CONTENEUR. Les cases sont
  // reconstruites a chaque repeint : un ecouteur par case aurait fui a chaque
  // enregistrement, et le dernier geste serait parti en double.
  document.getElementById('dispo-recur').addEventListener('change', e => {
    if (!e.target.matches('input[data-lot]')) return
    enregistrerMesJours()
  })

  // ⚠ UNE TAPE, PAS UN GLISSE — et `click`, pas `pointerdown`. Sur un telephone,
  // un glisse de selection se bat avec le defilement de la page : on ne peut pas
  // avoir les deux, et c'est le defilement qui gagne dans l'usage reel. Pour
  // plusieurs jours d'affilee, le conge est fait pour ca.
  document.getElementById('dispo-months').addEventListener('click', e => {
    if (e.target.closest('#btn-reglages')) { ouvrirReglages(); return }
    const el = e.target.closest('.dispo-case')
    if (!el || !el.dataset.jour) return
    // ⚠ LE MEME GESTE NE PEUT PAS FAIRE DEUX CHOSES SELON UN ETAT QU'IL FAUT
    // DEVINER (lot B). La tape ouvre la feuille ; c'est la feuille qui porte les
    // gestes, chacun nomme.
    ouvrirJour(el.dataset.jour)
  })
  // ⚠ UN SEUL ECOUTEUR, POSE UNE FOIS, SUR LE CONTENEUR — meme raison que pour
  // les cases : la liste est reconstruite a chaque repeint.
  // ⚠ ET LA MEME FEUILLE QUE LA BULLE. Deux chemins vers deux feuilles
  // differentes finiraient par dire deux choses differentes du meme menage.
  document.getElementById('agenda-liste').addEventListener('click', e => {
    const el = e.target.closest('.agenda-item.offre')
    if (!el || !el.dataset.jour) return
    const libres = aPrendreDu(el.dataset.jour)
    if (libres.length) ouvrirPriseDeMenage(el.dataset.jour, libres)
  })

  document.getElementById('dispo-months').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return
    const el = e.target.closest('.dispo-case')
    if (!el || !el.dataset.jour) return
    e.preventDefault()
    ouvrirJour(el.dataset.jour)
  })

  // Sonde au demarrage : sert UNIQUEMENT a savoir si l'onglet doit exister.
  // `self_view_reviews` a false => pas d'onglet du tout. Hors ligne ou token
  // refuse => pas d'onglet non plus : on ne sait rien, on n'affiche rien.
  // Un 503 en revanche fait apparaitre l'onglet, en etat de panne : le serveur
  // nous parle, et masquer la vue ferait passer une panne pour un droit retire.
  // ⚠ MEME LOGIQUE QUE L'ONGLET AVIS : l'onglet n'existe que si le serveur dit
  // que le droit est la. Un onglet qui repondrait 403 a chaque geste vaudrait
  // moins que pas d'onglet — et une panne ne doit pas le faire disparaitre non
  // plus, sinon une indisponibilite passagere ressemble a un droit retire.
  async function initDisponibilites () {
    let res
    try {
      res = await fetch(`/api/menages-public?action=disponibilites&token=${currentToken}`)
    } catch (err) { return }
    if (res.status === 503) { montrerOnglets(); document.getElementById('tab-dispo').style.display = ''; return }
    if (!res.ok) return
    let data
    try { data = await res.json() } catch (err) { return }
    if (data.autorise !== true) return
    montrerOnglets()
    document.getElementById('tab-dispo').style.display = ''
  }

  async function initAvis () {
    let res
    try {
      res = await fetch(`/api/menages-public?action=avis&token=${currentToken}`)
    } catch (err) { return }
    // ⚠ 503 : le serveur nous PARLE, le droit existe donc — mais il ne peut rien
    // compter. La porte s'ouvre avec son libelle, jamais vide : la vue Avis sait
    // dire la panne, encore faut-il pouvoir l'atteindre.
    if (res.status === 503) { montrerOnglets(); montrerOngletAvis(); porteSansChiffre(); return }
    if (!res.ok) return
    let data
    try { data = await res.json() } catch (err) { return }
    // ⚠ On VIDE explicitement plutot que de compter sur l'etat initial du HTML :
    // c'est une coincidence — l'element part masque et la sonde ne tourne
    // qu'une fois — qui protege ici, pas le code. Un second appel ajoute plus
    // tard laisserait sinon un ratio perime en en-tete.
    if (data.actif === false || data.autorise !== true) { renderEnteteRatio(null); return }
    montrerOnglets()
    montrerOngletAvis()
    renderEnteteRatio(data)
  }

  // Le ratio permanent, a cote du prenom. Il ne s'affiche QUE sur des chiffres
  // surs : panne de comptage, champ manquant ou comptage partiel, il reste
  // masque et l'onglet Avis explique. Un rappel d'objectif quotidien qui
  // annoncerait un faux chiffre serait pire que pas de rappel.
  function renderEnteteRatio (data) {
    const el = document.getElementById('entete-ratio')
    if (!el) return
    // ⚠ DEUX ECHECS QUI N'ONT PAS LA MEME REPONSE, et les confondre rouvrait une
    // fuite. `data` absente veut dire LE DROIT N'EST PAS (ou PLUS) LA : la porte
    // doit disparaitre avec lui — un ratio survivant au retrait du droit en
    // serait une. Des CHIFFRES douteux, eux, ne disent rien du droit : la porte
    // reste, seuls les chiffres se taisent.
    if (!data) {
      avisOuvert = false
      el.style.display = 'none'
      el.innerHTML = ''
      return
    }
    const r = data && data.ratio
    const sur = v => Number.isFinite(v)
    if (!r || r.erreur || r.tronque || !sur(r.total) || !sur(r.positif) || !sur(r.remarque)) {
      // ⚠ LES CHIFFRES SE TAISENT, PAS LA PORTE (lot 4). Depuis que les avis
      // vivent derriere ce bouton, le masquer sur une panne de comptage
      // l'enfermerait dehors : elle n'aurait plus aucun moyen de les atteindre.
      // On retire donc les chiffres — un faux ratio vaut moins que pas de ratio —
      // et on garde un libelle qui dit ou l'on va.
      porteSansChiffre()
      return
    }
    const lib = LIB_PERIODE[r.periode] || LIB_PERIODE[data.periode] || ''
    el.innerHTML = `
      <div class="ratio">
        <span class="ratio-item pos" title="Propreté saluée">${POUCE_HAUT}${r.positif}</span>
        <span class="ratio-item neg" title="Remarques sur la propreté">${POUCE_BAS}${r.remarque}</span>
      </div>
      <div class="entete-periode">sur ${r.total} avis${lib ? ' · ' + echapper(lib) : ''}</div>`
    majPorteAvis()
  }

  // ⚠ IDEMPOTENT. Les ecouteurs sont poses UNE FOIS. `initAvis` ne tournait
  // qu'au demarrage quand cette fonction a ete ecrite ; le re-sondage au retour
  // au premier plan la rappelle, et une fleche anonyme ne se dedoublonne pas :
  // une PWA laissee ouverte une journee accumulait un ecouteur par reveil, si
  // bien qu'UN SEUL tap sur « Avis » lancait autant de chargements paralleles
  // (`avisCharge` ne passe a true qu'apres le premier `await`, donc aucun ne
  // s'arrete). Mesure sur le vrai bloc : 3 sondes = 3 fetchs pour un clic.
  // Chaque sonde devoile SON onglet, et lui seul.
  // ─── LES AVIS PASSENT DERRIERE LE RATIO (refonte v2, lot 4) ───────────────
  //
  // Plus d'onglet : le ratio en haut a droite EST la porte. Il etait deja le
  // rappel permanent ; en faire l'acces supprime un onglet sans rien cacher.
  //
  // ⚠ LA PORTE ET LES CHIFFRES N'ONT PAS LA MEME CONDITION, et les confondre
  // l'enfermerait dehors. Le ratio ne montre ses chiffres que s'ils sont SURS
  // (un rappel qui annoncerait un faux chiffre vaut moins que pas de rappel) ;
  // le DROIT, lui, existe ou non. Sur une panne de comptage, l'ancien ecran
  // gardait l'onglet et expliquait dedans — si la porte disparaissait avec les
  // chiffres, elle n'aurait plus aucun moyen d'atteindre ses avis.
  // `avisOuvert` retient donc le droit, independamment des chiffres.
  let avisOuvert = false
  function montrerOngletAvis () {
    avisOuvert = true
    const b = document.getElementById('tab-avis')
    if (b) b.style.display = 'none'      // l'onglet ne revient pas
    majPorteAvis()
  }

  // ⚠ LA PORTE NE S'AFFICHE JAMAIS VIDE. Sur une sonde en 503, `initAvis`
  // devoilait la porte sans passer par `renderEnteteRatio` : elle s'ouvrait avec
  // l'`innerHTML` du premier chargement — c'est-a-dire RIEN — pendant que
  // l'onglet, lui, avait disparu. Plus aucun acces aux avis, sur le cas meme
  // (panne serveur) ou la vue sait expliquer ce qui se passe.
  function porteSansChiffre () {
    const el = document.getElementById('entete-ratio')
    if (el) el.innerHTML = '<div class="ratio-porte">Mes avis ›</div>'
    majPorteAvis()
  }

  // La porte s'affiche des que le droit est la ; son CONTENU depend des chiffres.
  function majPorteAvis () {
    const el = document.getElementById('entete-ratio')
    if (!el) return
    if (!avisOuvert) { el.style.display = 'none'; return }
    el.style.display = ''
    if (!el.dataset.branche) {
      el.dataset.branche = '1'
      el.addEventListener('click', () => setTab('avis'))
      el.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        e.preventDefault(); setTab('avis')
      })
    }
  }

  let ongletsBranches = false
  function montrerOnglets () {
    const tabs = document.getElementById('tabs')
    if (!tabs) return
    tabs.style.display = ''
    if (ongletsBranches) return
    ongletsBranches = true
    tabs.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => setTab(b.dataset.tab))
    })
  }

  // ⚠ UN RAPPEL QUOTIDIEN CALCULE UNE SEULE FOIS N'EN EST PAS UN. Une PWA reste
  // ouverte des jours sur un telephone : sans ce reveil, le ratio date du
  // dernier chargement, et un droit `self_view_reviews` retire resterait
  // affiche. Au plus une fois par quart d'heure, pour ne pas rejouer le
  // comptage a chaque bascule d'application.
  let derniereSonde = Date.now()
  function brancherResonde () {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return
      if (Date.now() - derniereSonde < 15 * 60 * 1000) return
      derniereSonde = Date.now()
      resonder().catch(err => console.warn('[Avis] resonde impossible', err))
    })
  }

  async function resonder () {
    // ⚠ SEQUENCE, PAS PARALLELE. Lances ensemble, la sonde et le chargement
    // ecrivent tous deux l'en-tete : sur un droit retire entre les deux
    // reponses, l'ordre d'arrivee decidait de ce qui restait affiche.
    await initAvis()
    if (currentTab !== 'avis') return
    // ⚠ ET SEULEMENT SI ON PEUT ABOUTIR. Hors ligne, `chargerAvis` remplace la
    // liste par « service indisponible » — la prestataire qui lisait ses
    // extraits en sous-sol, met l'appli en fond et revient, perdait l'ecran
    // qu'elle pouvait encore lire. Une PWA hors-ligne garde ce qu'elle a.
    if (navigator.onLine === false) return
    await chargerAvis()
  }

  // ⚠ JETON DE REQUETE. Deux changements de periode rapproches, ou un changement
  // pendant le rechargement du reveil, lancaient deux chargements paralleles :
  // la reponse la plus lente ecrivait en dernier, et le selecteur affichait
  // « 6 mois » au-dessus d'un dossier calcule sur 15 jours. Seul le dernier
  // chargement demande a le droit d'ecrire a l'ecran.
  let chargementCourant = 0

  // ⚠ La periode est passee en ARGUMENT, pas relue du stockage. Le handler du
  // selecteur la memorisait puis appelait `chargerAvis`, qui relisait le
  // localStorage : quand `setItem` echoue (navigation privee, quota, Safari qui
  // bloque le stockage), le choix etait perdu en silence — la requete partait
  // sur l'ancienne periode, et le <select> etait remis dessus en fin de
  // chargement. La prestataire voyait son choix disparaitre sans un mot.
  async function chargerAvis (periodeVoulue) {
    const p = PERIODES_VUE.includes(periodeVoulue) ? periodeVoulue : periodeVueLocale()
    const jeton = ++chargementCourant
    etatAvis('Chargement…', '')
    let res
    try {
      res = await fetch(`/api/menages-public?action=avis&detail=1&periode=${encodeURIComponent(p)}&token=${currentToken}`)
    } catch (err) {
      if (jeton === chargementCourant) etatAvis('Service indisponible', 'Vérifiez votre connexion, puis réessayez.')
      return
    }
    if (jeton !== chargementCourant) return   // un chargement plus recent a pris la main
    // ⚠ UN LIEN MORT N'EST PAS UNE PANNE, ET LE DIRE FAIT REESSAYER POUR RIEN.
    // Depuis le 14 septembre, un profil desactive rend 401 sur ce chemin — avant,
    // c'etait un 200 « actif: false » qui masquait proprement l'onglet. Traite
    // comme les 503, il affichait « Réessayez dans un instant » a quelqu'un dont
    // l'acces est revoque : elle reessaierait indefiniment. On retombe donc sur
    // le meme geste que « droit retire » : on masque l'onglet, on revient au
    // planning — qui, lui, dira l'etat du lien.
    if (res.status === 401 || res.status === 403) {
      masquerOngletAvis()
      return
    }
    if (!res.ok) {
      // 503 : panne serveur (droits, attribution ou liste). Surtout pas « aucun
      // avis » — la difference change ce qu'elle en conclut sur son travail.
      etatAvis('Service indisponible', 'Réessayez dans un instant.')
      return
    }
    let data
    try { data = await res.json() } catch (err) {
      etatAvis('Service indisponible', 'Réessayez dans un instant.')
      return
    }
    if (jeton !== chargementCourant) return
    // Le droit a pu etre retire entre la sonde et le clic.
    if (data.actif === false || data.autorise !== true) {
      masquerOngletAvis()
      return
    }
    avisCharge = true
    renderEnteteRatio(data)
    renderAvis(data)
    // La periode que le serveur dit avoir appliquee — pas celle qu'on croyait
    // demander : c'est elle qui est sous les yeux de la prestataire.
    montrerSelecteurPeriode(data.periodeVue || p)
  }

  // ⚠ ON MASQUE LE SEUL ONGLET AVIS, PAS LA BARRE. La masquer entierement
  // emportait « Mes jours », parfaitement legitime, jusqu'au rechargement de
  // la PWA : un droit retire sur les avis ne retire pas les autres.
  // Deux chemins y menent — le droit retire entre la sonde et le clic, et le
  // lien devenu mort (401) — et ils doivent faire EXACTEMENT la meme chose :
  // deux versions du meme geste auraient diverge au premier ajustement.
  function masquerOngletAvis () {
    const bouton = document.getElementById('tab-avis')
    if (bouton) bouton.style.display = 'none'
    renderEnteteRatio(null)
    setTab('planning')
  }

  function renderAvis (data) {
    // ⚠ `ratioVue` d'abord : c'est le compteur de la periode consultee. Prendre
    // `ratio` (l'objectif) afficherait un total qui ne correspond pas a la liste
    // en dessous — un ecran qui se contredit tout seul.
    const r = data.ratioVue || data.ratio
    // ⚠ CONTRAT DU SERVEUR : `ratio.erreur` est une PANNE, pas un resultat. Lu
    // AVANT tout affichage — sans quoi l'ecran annoncerait « 0 avis » a une
    // prestataire qui en a 98, et elle en tirerait une conclusion fausse.
    const chiffre = v => Number.isFinite(v) ? v : null
    if (!r || r.erreur || chiffre(r.total) === null || chiffre(r.positif) === null || chiffre(r.remarque) === null) {
      // Un champ manquant est traite comme la panne qu'il est : afficher
      // « undefined avis » vaudrait le « 0 avis » que tout ceci evite.
      etatAvis('Compteurs indisponibles', 'Vos avis n\'ont pas pu être comptés. Réessayez dans un instant.')
      avisCharge = false   // rien d'affiche : la prochaine ouverture doit reessayer
      return
    }

    const avis = Array.isArray(data.avis) ? data.avis : []
    // Seuls les avis qui PARLENT de proprete sont listes : un avis sans mention
    // ne lui apprend rien et noierait les autres. Le ratio, lui, garde le total
    // reel — et le libelle dit lequel est lequel, pour qu'aucun des deux
    // chiffres ne se lise a la place de l'autre.
    const parlants = avis.filter(a => a.verdict === 'positif' || a.verdict === 'remarque')

    document.getElementById('avis-etat').style.display = 'none'
    const ratio = document.getElementById('avis-ratio')
    ratio.innerHTML = `
      <div class="week-stat"><strong>${r.total}</strong>avis pris en compte${
        LIB_PERIODE[r.periode] ? ', ' + echapper(LIB_PERIODE[r.periode]) : ''}</div>
      <div class="week-stat">
        <strong class="ratio">
          <span class="ratio-item pos">${POUCE_HAUT}${r.positif}</span>
          <span class="ratio-item neg">${POUCE_BAS}${r.remarque}</span>
        </strong>propreté saluée / remarques
      </div>`
    // ⚠ `tronque` dit que le comptage a bute sur une borne : le chiffre est
    // PARTIEL. Ne pas le dire le ferait lire comme un total — la meme famille
    // de faute que la panne affichee en « 0 avis ».
    if (r.tronque || data.listeTronquee) {
      ratio.innerHTML += '<div class="week-stat" style="flex-basis:100%">Vous avez beaucoup d\'avis : cet écran n\'en montre qu\'une partie.</div>'
    }
    ratio.style.display = ''

    const liste = document.getElementById('avis-liste')
    if (!parlants.length) {
      liste.innerHTML = `<div class="avis-etat"><strong>${r.total ? 'Aucune mention de la propreté' : 'Aucun avis pour l\'instant'}</strong>${
        r.total
          ? 'Aucun des avis reçus ne parle du ménage.'
          : 'Les avis des voyageurs apparaîtront ici.'}</div>`
      return
    }
    liste.innerHTML = parlants.map(ligneAvis).join('')
  }

  // ⚠ CE QUI IDENTIFIE LE MENAGE, C'EST LA DATE DU SEJOUR — pas celle de l'avis.
  // Et une date de reception presentee comme un sejour est une donnee inventee :
  // elle enverrait la prestataire chercher le mauvais menage. On etiquette donc
  // toujours ce qu'on montre, et on ne comble jamais un sejour manquant.
  function libelleDate (a) {
    const jour = v => {
      const d = v ? new Date(v) : null
      return (d && !isNaN(d)) ? d : null
    }
    const deb = jour(a.sejourDebut), fin = jour(a.sejourFin), recu = jour(a.recuLe)
    // ⚠ `stay_start` / `stay_end` sont des colonnes `date` : PostgREST rend
    // « 2026-08-15 », que `new Date` interprete a MINUIT UTC. Formate en heure
    // locale, ce meme jour s'affiche « 14 août » a l'ouest de Greenwich — donc
    // pour une prestataire en Guadeloupe, en Martinique ou en Guyane, marches
    // francophones vises. Un sejour decale d'un jour envoie chercher le mauvais
    // menage, exactement ce que cet etiquetage veut empecher. On force donc UTC
    // pour les dates NUES. `recuLe` est un vrai instant : il reste en local.
    const UTC = { timeZone: 'UTC' }
    const court = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', ...UTC })
    const long = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', ...UTC })
    const longLocal = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
    if (deb && fin) {
      // Meme mois : « du 12 au 15 août », sinon les deux mois en entier. La
      // comparaison est en UTC elle aussi, sinon un séjour du 31 au 1er
      // basculerait de forme selon le fuseau de lecture.
      const memeMois = deb.getUTCFullYear() === fin.getUTCFullYear() && deb.getUTCMonth() === fin.getUTCMonth()
      return `Séjour du ${memeMois ? deb.getUTCDate() : court(deb)} au ${long(fin)}`
    }
    if (fin) return `Séjour terminé le ${long(fin)}`
    if (deb) return `Séjour à partir du ${long(deb)}`
    // Aucun ancrage : on le DIT. L'import de l'historique fera basculer ces
    // avis vers leur vraie date de sejour, sans rien changer ici.
    if (recu) return `Avis reçu le ${longLocal(recu)}`
    return ''
  }

  // Le selecteur n'apparait qu'une fois un PREMIER dossier reellement charge :
  // offert d'emblee sur un ecran de panne, il inviterait a recharger ce qui n'a
  // jamais pu s'afficher. Une fois montre, il RESTE — y compris si un
  // changement de periode echoue : c'est par lui qu'elle revient en arriere.
  let selecteurBranche = false
  // ⚠ Ce que le <select> affiche doit etre la periode du dossier REELLEMENT a
  // l'ecran, pas celle du stockage : les deux divergent des qu'une ecriture
  // locale echoue ou qu'un chargement est abandonne.
  let derniereePeriodeAffichee = 'toujours'
  function montrerSelecteurPeriode (periodeAffichee) {
    const ligne = document.getElementById('avis-periode-ligne')
    const sel = document.getElementById('avis-periode')
    if (!ligne || !sel) return
    if (PERIODES_VUE.includes(periodeAffichee)) derniereePeriodeAffichee = periodeAffichee
    sel.value = derniereePeriodeAffichee
    ligne.style.display = ''
    if (selecteurBranche) return
    selecteurBranche = true
    sel.addEventListener('change', () => {
      const v = PERIODES_VUE.includes(sel.value) ? sel.value : 'toujours'
      // La memorisation est un confort : si elle echoue, le choix vaut quand
      // meme pour cette session — il part en argument, pas par le stockage.
      try { localStorage.setItem(LS_PERIODE_AVIS, v) } catch (e) {}
      // ⚠ HORS LIGNE, ON GARDE L'ECRAN. Le chargement remplacerait la liste par
      // « service indisponible » : la prestataire qui consulte en sous-sol
      // perdrait ce qu'elle avait encore sous les yeux. Meme garde que le reveil
      // au premier plan, par une autre porte.
      if (navigator.onLine === false) {
        sel.value = derniereePeriodeAffichee
        return
      }
      chargerAvis(v).catch(err => {
        console.warn('[Avis] changement de periode impossible', err)
        etatAvis('Service indisponible', 'Réessayez dans un instant.')
      })
    })
  }

  function ligneAvis (a) {
    const neg = a.verdict === 'remarque'
    const dateTxt = libelleDate(a)
    // Le nom du bien s'il est connu, sinon rien : l'identifiant provider brut
    // (« 287031 ») ne dit rien a personne.
    const bien = a.bienNom || ''
    // ⚠ UN AVIS PEUT NE PAS AVOIR D'EXTRAIT — et une carte rouge vide est un
    // reproche que la personne visee ne peut ni verifier ni situer. Trois
    // chemins de production en produisent : la regle de l'etage 1 n'en pose
    // JAMAIS (tag `_negative_` Airbnb, note de proprete basse), l'etage 2 le
    // met a null quand la citation du modele ne se retrouve pas dans le texte,
    // et la requalification par l'hote l'efface. On le DIT au lieu de laisser
    // un blanc. Le cas est invisible aujourd'hui (1 remarque sur 70, avec
    // extrait) : il apparaitra au premier tag negatif.
    const texte = a.extrait
      ? echapper(a.extrait)
      : `<span class="avis-sans-detail">${neg
          ? 'Propreté signalée, sans détail rapporté par le voyageur.'
          : 'Propreté saluée, sans commentaire détaillé.'}</span>`
    return `<div class="avis-card ${neg ? 'neg' : 'pos'}">
      <div class="avis-meta">
        <span class="${neg ? 'neg' : 'pos'}">${neg ? POUCE_BAS : POUCE_HAUT}</span>
        ${dateTxt ? `<span>${echapper(dateTxt)}</span>` : ''}
        ${bien ? `<span>· ${echapper(bien)}</span>` : ''}
        ${a.prive ? '<span class="badge-prive">retour privé</span>' : ''}
      </div>
      <div class="avis-texte">${texte}</div>
    </div>`
  }

  // ─── Helpers dates ─────────────────────────────────────────────────────────
  function getMonday(date) { const d = new Date(date); d.setHours(0,0,0,0); const day = d.getDay(); d.setDate(d.getDate() + ((day === 0) ? -6 : 1 - day)); return d }
  function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d }
  function formatDate(date) { return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) }
  function toDateStr(date) {
    // YYYY-MM-DD en heure locale (pas UTC, pour rester coherent avec departure
    // de Beds24 qui est en heure locale du bien). On evite toISOString() qui
    // shifte en UTC et peut faire passer la date du jour au lendemain.
    const y = date.getFullYear()
    const m = String(date.getMonth() + 1).padStart(2, '0')
    const d = String(date.getDate()).padStart(2, '0')
    return `${y}-${m}-${d}`
  }
  function getDotColor(i) { return ['#3B82F6', '#10B981', '#F59E0B', '#EC4899'][i % 4] }

  init()
</script>

</body>
