  // ⚠ UNE ANNONCE PERIME A 72 h (lot D). Une nouvelle qui reste indefiniment
  // cesse d'etre une nouvelle : au bout d'une semaine on ne la lit plus, et elle
  // pousse vers le bas ce qui vient VRAIMENT d'arriver. Trois jours couvrent un
  // week-end sans regarder son telephone, ce qui est le cas reel qu'on protege.
  // ⚠ COTE ECRAN, PAS COTE SERVEUR : la ligne reste en base — c'est la trace,
  // et l'hote la consulte. Ce qui perime, c'est son affichage a elle.
  const PEREMPTION_H = 72
  function annonceFraiche (n) {
    const t = Date.parse(n.created_at)
    if (!Number.isFinite(t)) return true   // date illisible : on montre, on ne cache pas
    return (Date.now() - t) / 3600000 < PEREMPTION_H
  }

  function renderNews() {
    // Réconcilie le miroir local d acquittement (offline-safe) : une notif acquittee reste lue
    // même si la sync serveur n a pas encore eu lieu (empêche la réapparition au reload).
    newsItems.forEach(n => { if (readSet.has(String(n.id))) n.read = true })
    // ⚠ UN SEUL ENDROIT DECIDE DE CE QUI S'AFFICHE : peremption ET acquittement.
    // Deux filtres separes auraient diverge au premier ajout — et le compteur
    // aurait annonce des nouvelles qu'aucune liste ne montre.
    const visibles = newsItems.filter(annonceFraiche)
    const unread = visibles.filter(n => !n.read)
    const panel  = document.getElementById('news-panel')
    const count  = document.getElementById('news-count')
    const list   = document.getElementById('news-list')

    if (visibles.length === 0) { panel.style.display = 'none'; return }
    panel.style.display = 'block'
    count.textContent = unread.length
    count.style.display = unread.length === 0 ? 'none' : 'inline'

    // ⚠ « NOUVEAU MENAGE », PAS « NOUVELLE RESERVATION » (lot D).
    // La reservation est le fait de l'hote ; ce qu'elle change POUR ELLE, c'est
    // qu'un menage apparait — dans tel logement, tel jour. Lui annoncer une
    // reservation l'obligeait a traduire elle-meme en travail, date et adresse,
    // depuis un vocabulaire qui n'est pas le sien. C'est la regle du coeur de
    // donnees appliquee a l'ecrit : la source est une reservation, l'app en
    // montre ce qu'elle sert.
    const icons  = { new: '🧹', modified: '✏️', cancelled: '❌', note: '📝' }
    const labels = { new: 'Nouveau ménage', modified: 'Ménage modifié',
                     cancelled: 'Ménage annulé', note: "Note de l'employeur" }

    list.innerHTML = visibles.map(n => {
      const d = new Date(n.created_at)
      const timeStr = d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })

      let detail = n.property_name || ''
      if (n.event_data) {
        if (n.event_type === 'note') {
          detail = `${n.property_name} · ${n.event_data.guestName || ''}\nArrivée : ${n.event_data.arrival || '—'} · Départ : ${n.event_data.departure || '—'}\n📝 ${n.event_data.comment || ''}`
        } else {
          // ⚠ LE LOGEMENT ET LE JOUR, RIEN D'AUTRE. On y mettait le nom du
          // voyageur et les deux bornes du sejour : trois informations dont
          // aucune ne repond a « ou dois-je aller, et quand ». Le jour du menage
          // est le DEPART — c'est lui qui la concerne, pas l'arrivee.
          const jour = n.event_data.departure
            ? jourLisible(String(n.event_data.departure).slice(0, 10))
            : ''
          detail = `${n.property_name || ''}${jour ? ' · ' + jour : ''}`
          if (n.event_type === 'modified' && n.event_data.changes) {
            const changes = []
            if (n.event_data.changes.arrival)   changes.push(`arrivée : ${n.event_data.changes.arrival.before} → ${n.event_data.changes.arrival.after}`)
            if (n.event_data.changes.departure)  changes.push(`départ : ${n.event_data.changes.departure.before} → ${n.event_data.changes.departure.after}`)
            if (n.event_data.changes.numAdult)   changes.push(`adultes : ${n.event_data.changes.numAdult.before} → ${n.event_data.changes.numAdult.after}`)
            if (n.event_data.changes.numChild)   changes.push(`enfants : ${n.event_data.changes.numChild.before} → ${n.event_data.changes.numChild.after}`)
            if (changes.length) detail += `\n${changes.join(', ')}`
          }
        }
      }

      return `
        <div class="news-item ${n.read ? 'read' : 'unread'}" data-id="${n.id}">
          <div class="news-icon">${icons[n.event_type] || '📋'}</div>
          <div class="news-content">
            <div class="news-content-title">${labels[n.event_type] || n.event_type}</div>
            <div class="news-content-sub">${detail.replace(/\n/g, '<br>')}</div>
          </div>
          <div class="news-time">${timeStr}</div>
        </div>
      `
    }).join('')

    list.querySelectorAll('.news-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id
        const n = newsItems.find(n => String(n.id) === String(id))
        if (n && !n.read) markEventsRead([id])
      })
    })
  }

  function markAllNewsRead() {
    const unreadIds = newsItems.filter(n => !n.read).map(n => n.id)
    markEventsRead(unreadIds)
  }

  function renderWeek() {
    const today = new Date(); today.setHours(0,0,0,0)
    const weekEnd = addDays(currentWeekStart, 6)
    const menages = getMenages()

    document.getElementById('week-label').textContent = `${formatDate(currentWeekStart)} — ${formatDate(weekEnd)}`

    const weekMenages = menages.filter(m => m.date >= currentWeekStart && m.date <= weekEnd)
    const done = weekMenages.filter(m => m.done).length
    document.getElementById('week-stats').innerHTML = `
      <div class="week-stat"><strong>${weekMenages.length}</strong>ménages cette semaine</div>
      <div class="week-stat"><strong>${done}</strong>effectués</div>
      <div class="week-stat"><strong>${weekMenages.length - done}</strong>restants</div>
    `

    const grid = document.getElementById('week-grid')
    grid.innerHTML = ''

    for (let i = 0; i < 7; i++) {
      const day = addDays(currentWeekStart, i)
      day.setHours(0,0,0,0)
      const isToday = day.getTime() === today.getTime()
      const dayMenages = menages.filter(m => { const md = new Date(m.date); md.setHours(0,0,0,0); return md.getTime() === day.getTime() })

      const col = document.createElement('div')
      col.className = `day-col${isToday ? ' today' : ''}${dayMenages.length === 0 ? ' is-empty' : ''}`
      col.innerHTML = `
        <div class="day-header">
          <div class="day-name">${JOURS[i]}</div>
          <div class="day-number">${day.getDate()}</div>
        </div>
        <div class="day-body">
          ${dayMenages.length === 0 ? '<div class="day-empty">—</div>' :
            dayMenages.map(m => {
              const obs = isMenageObsolete(m, menages)
              return `
              <div class="menage-card ${PROP_COLORS[m.propIdx % 4]} ${m.done ? 'done' : ''} ${obs ? 'obsolete' : ''}" data-id="${m.id}" style="cursor:pointer">
                <div class="menage-card-prop">${m.propName}</div>
                <div class="menage-card-title">Ménage départ</div>
                <div class="menage-card-time">${m.guestName}</div>
                ${badgeOffre(m)}
                ${m.done ? '<div class="menage-card-check">✓</div>' : ''}
                ${m.pending ? '<div class="menage-card-pending">⏳</div>' : ''}
                ${m.comment ? '<div class="menage-card-comment">📝</div>' : ''}
              </div>
            `
            }).join('')
          }
        </div>
      `
      grid.appendChild(col)
    }

    grid.querySelectorAll('.menage-card').forEach(card => {
      card.addEventListener('click', () => {
        selectedMenage = getMenages().find(m => m.id === card.dataset.id)
        openModal(selectedMenage)
      })
    })
  }

  function renderMiniCal() {
    const menages = getMenages()
    const menageDates = new Map()
    menages.forEach(m => {
      if (!menageDates.has(m.dateStr)) menageDates.set(m.dateStr, [])
      menageDates.get(m.dateStr).push(m)
    })

    document.getElementById('mini-cal-title').textContent = `${MOIS[miniCalDate.getMonth()]} ${miniCalDate.getFullYear()}`

    const grid = document.getElementById('mini-cal-grid')
    const headers = Array.from(grid.children).slice(0, 7)
    grid.innerHTML = ''; headers.forEach(h => grid.appendChild(h))

    const firstDay = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth(), 1)
    const lastDay  = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() + 1, 0)
    const today    = new Date(); today.setHours(0,0,0,0)

    let startOffset = (firstDay.getDay() + 6) % 7
    for (let i = 0; i < startOffset; i++) {
      const prev = new Date(firstDay); prev.setDate(prev.getDate() - (startOffset - i))
      const d = document.createElement('div')
      d.className = 'mini-cal-day other-month'; d.textContent = prev.getDate()
      grid.appendChild(d)
    }

    for (let d = 1; d <= lastDay.getDate(); d++) {
      const date = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth(), d)
      date.setHours(0,0,0,0)
      const dateStr    = toDateStr(date)
      const dayMenages = menageDates.get(dateStr) || []
      const hasMenage  = dayMenages.length > 0
      const isDone     = hasMenage && dayMenages.every(m => m.done)
      const isToday    = date.getTime() === today.getTime()
      const weekEnd    = addDays(currentWeekStart, 6)
      const inWeek     = date >= currentWeekStart && date <= weekEnd

      const el = document.createElement('div')
      el.className = ['mini-cal-day', isToday ? 'today' : '', hasMenage && !isToday ? (isDone ? 'has-menage done' : 'has-menage') : '', inWeek && !isToday ? 'selected-week' : ''].filter(Boolean).join(' ')
      el.textContent = d

      if (hasMenage) {
        const tooltip = document.createElement('div')
        tooltip.className = 'cal-tooltip'
        tooltip.textContent = dayMenages.map(m => `${m.propName} · ${m.guestName}`).join('\n')
        el.appendChild(tooltip)
      }

      el.addEventListener('click', () => { currentWeekStart = getMonday(date); routeRender() })
      grid.appendChild(el)
    }
  }

  function isMenageObsolete(m, allMenages) {
    if (m.done) return false
    const today = new Date(); today.setHours(0,0,0,0)
    const menageDate = new Date(m.date); menageDate.setHours(0,0,0,0)
    const laterDone = allMenages.some(other =>
      other.propId === m.propId && other.id !== m.id && other.done &&
      new Date(other.date) > menageDate
    )
    if (laterDone) return true
    const laterArrived = bookings.some(b =>
      b.propId === m.propId && b.id !== m.bookId && b.arrival &&
      dateNueLocale(b.arrival) > menageDate && dateNueLocale(b.arrival) <= today
    )
    return laterArrived
  }

  // Garde-fou cote front : on bloque le clic markDone sur un menage futur.
  // Comparaison string YYYY-MM-DD (cf. convention dates pures du projet).
  function isMenageFuture(m) {
    return m.dateStr > toDateStr(new Date())
  }

  // ⚠ UNE OFFRE N'EST PAS UN MENAGE A FAIRE. Tant qu'elle n'est pas acceptee,
  // personne n'est engage : le dire a l'oeil evite qu'on s'organise autour de
  // quelque chose qu'on n'a pas confirme — ou qu'on laisse filer une offre sans
  // repondre. Le referent ne voit jamais ce badge : son menage nait accepte.
  // ⚠ DEUX SITUATIONS TRES DIFFERENTES, et les confondre serait grave :
  //   - `role: 'propose'` — on ME le propose. Je ne le porte pas encore, je dois
  //     repondre, et un delai court.
  //   - `role: 'porteur'` + `propose` — je le PORTE, et il est propose a
  //     quelqu'un d'autre. Il reste ma responsabilite tant que personne n'a
  //     accepte : la mention est discrete, et il n'y a rien a faire.
  function estUneOffre (m) { return !!(m.assign && m.assign.role === 'propose') }
  function estPropose (m) { return !!(m.assign && m.assign.role === 'porteur' && m.assign.propose) }

  // Le temps qu'il reste pour repondre, en clair. « Il reste 3 h » se decide
  // mieux qu'une date d'expiration a calculer soi-meme.
  function delaiRestant (m) {
    const t = m.assign && m.assign.expire_le ? Date.parse(m.assign.expire_le) : NaN
    if (!t || isNaN(t)) return ''
    const ms = t - Date.now()
    if (ms <= 0) return 'expirée'
    const h = Math.floor(ms / 3600000)
    if (h >= 24) return `${Math.floor(h / 24)} j restants`
    if (h >= 1) return `${h} h restantes`
    return `${Math.max(1, Math.round(ms / 60000))} min restantes`
  }

  function badgeOffre (m) {
    if (estUneOffre(m)) {
      const d = delaiRestant(m)
      return `<div class="badge-offre">À CONFIRMER${d ? ' · ' + d : ''}</div>`
    }
    // ⚠ Discret : ce menage reste le sien, rien ne lui est demande.
    if (estPropose(m)) return '<div class="badge-propose">proposé à quelqu\'un</div>'
    return ''
  }

  // ─── PRENDRE UN MENAGE QUE PERSONNE NE PORTE (refonte v2, lot 2) ──────────
  //
  // ⚠ CE QU'ELLE VOIT D'UN MENAGE QUI N'EST PAS LE SIEN : le bien et la date,
  // rien d'autre. Ni voyageur, ni occupation, ni arrivee. Le serveur ne les
  // envoie meme pas — c'est exactement ce qui separe cette lecture de celle qui
  // a fuite le 14 septembre. L'ecran ne doit donc rien inventer non plus.
  let priseEnCours = null
  let retraitEnCours = null
  // ⚠ `idx` : LAQUELLE des propositions du jour. Tant qu'il n'y avait qu'un
  // chemin d'entree — la bulle du calendrier — prendre la premiere suffisait.
  // Depuis que la feuille du jour les liste toutes et les nomme, chacune doit
  // ouvrir la sienne.
  function ouvrirPriseDeMenage (jour, libres, idx = 0) {
    rendreLesCartes()
    // ⚠ ON QUITTE LA FEUILLE DU JOUR : `jourOuvert` doit retomber. Sans cela,
    // `feuilleOuverteSur` repondait encore vrai, et le rattrapage d'une bascule
    // partie juste avant effacait la feuille de PRISE sous son doigt.
    jourOuvert = null
    const m = libres[idx] || libres[0]
    priseEnCours = m
    // ⚠ LE MODAL EST PARTAGE, et le retrait doit se remettre a zero ici comme
    // `modal-prendre` le fait dans `openModal`. Sans cela : elle ouvre SON menage
    // A (bouton affiche, `retraitEnCours = A`), ferme, puis ouvre une bulle « a
    // prendre » B — le bouton de A restait visible sur la feuille de B, et le
    // toucher la retirait de A.
    reinitialiserRetrait()
    const absente = !jourTravaille(jour)
    document.getElementById('modal-title').textContent = 'Prendre ce ménage'
    document.getElementById('modal-sub').textContent = formatDate(dateNueLocale(jour))
    document.getElementById('modal-body').innerHTML =
      `<div class="modal-row"><span>Logement</span><span>${echapper(m.property_name || '—')}</span></div>` +
      `<div class="modal-row"><span>Départ</span><span>${echapper(m.departure_date)}</span></div>` +
      (libres.length > 1
        ? `<div class="modal-row"><span>Ce jour-là</span><span>${libres.length} ménages à prendre</span></div>`
        : '')
    // ⚠ LES DEUX PHRASES NE DISENT PAS LA MEME CHOSE, et c'est la decision du
    // 17 septembre : prendre un menage un jour d'absence ne la rend disponible
    // QUE pour celui-la. Le reste de sa journee ne bouge pas, et il faut le lui
    // dire — sinon elle croit annuler son absence entiere.
    document.getElementById('modal-note').innerHTML = absente
      ? '<div class="admin-note"><div class="admin-note-title">Vous êtes absente ce jour-là</div>' +
        'Prendre ce ménage vous rend disponible <b>pour lui seul</b>. Le reste de votre journée ne change pas.</div>'
      : '<div class="admin-note"><div class="admin-note-title">Une fois pris, il est à vous</div>' +
        'Ce n\'est pas une demande : le ménage vous est attribué, et votre hôte en est informé.</div>'
    hideModalMessages()
    document.getElementById('modal-done').style.display = 'none'
    document.getElementById('modal-accepter').style.display = 'none'
    document.getElementById('modal-refuser').style.display = 'none'
    const btn = document.getElementById('modal-prendre')
    btn.style.display = ''
    btn.disabled = false
    btn.textContent = 'Je prends ce ménage'
    document.getElementById('modal').style.display = 'flex'
  }

  // ─── LA FEUILLE DU JOUR (lot B) ─────────────────────────────────────────
  //
  // ⚠ UNE TAPE SUR UNE DATE OUVRE SA FEUILLE, TOUJOURS. Elle ne DECIDE plus
  // rien, elle MONTRE. Trois sections, dans cet ordre : ce qu'on lui PROPOSE
  // (en premier — c'est la seule chose qui peut lui echapper si elle tarde), les
  // menages qui sont DEJA A ELLE, puis sa DISPONIBILITE.
  let jourOuvert = null

  // ⚠ UN JOUR QUI N'A RIEN A DIRE NE S'OUVRE PAS. Une feuille « rien de prevu /
  // fermer » demande deux gestes pour apprendre qu'il n'y a rien, et laisse le
  // doute d'avoir mal tape. Elle est pire qu'une absence de reponse, parce
  // qu'elle fait douter du GESTE au lieu de renseigner.
  function jourOuvrable (j) {
    // ⚠ LE PASSE D'ABORD, ET AVANT LES OFFRES. Un menage passe n'est pas
    // recuperable (decision du 17 septembre) : le serveur le refuse, et l'ecran
    // ne doit pas l'ouvrir. Tester les offres en premier rouvrait exactement ce
    // que la regle ferme — une proposition d'hier restait saisissable.
    // Un jour passe ne s'ouvre donc que pour CONSULTER ce qu'elle y a fait.
    // ⚠ SUR LES LISTES NON FILTREES, COMME LA FEUILLE ELLE-MEME — sinon les deux
    // divergent et la feuille s'ouvre vide (voir `ouvrirJour`).
    if (j < AUJ()) return mesMenagesTousBiens(j).length > 0
    if (aPrendreTousBiens(j).length || mesMenagesTousBiens(j).length) return true
    // Sinon il reste la disponibilite — y compris pour LIRE pourquoi le jour est
    // barre (conge, absence posee par l'hote).
    return !!(mesJours && mesJours.modifiable)
  }

  function ouvrirJour (j) {
    if (!jourOuvrable(j)) return
    rendreLesCartes()
    jourOuvert = j
    // ⚠ LE FILTRE DE BIENS NE TRAVERSE PAS CETTE FEUILLE, NULLE PART.
    // Une premiere correction avait deplace la seule section « disponibilite »
    // sur la liste non filtree, en laissant le reste — et `jourOuvrable` — sur la
    // liste filtree. Les deux se sont mises a diverger : vue reduite au bien 1,
    // un menage sur le bien 2 rendait le jour ouvrable (liste filtree vide) tout
    // en supprimant la section (liste complete non vide), et la feuille s'ouvrait
    // COMPLETEMENT VIDE en annoncant « rien de prevu » sur une journee ou elle
    // travaille. Un bouton muet etait devenu une feuille qui ment.
    // Le filtre allege la SILHOUETTE du mois ; une journee qu'elle ouvre
    // explicitement montre ce qui s'y passe, sinon l'ecran cache du travail a
    // celle qui le fera.
    const libres = aPrendreTousBiens(j)
    const miensTous = mesMenagesTousBiens(j)
    const miens = miensTous
    const passe = j < AUJ()
    const e = mesJours ? exceptionDuJour(j) : null
    const c = mesJours ? congeDuJour(j) : null
    const dispo = jourTravaille(j)

    // 1 — CE QU'ON LUI PROPOSE.
    let html = ''
    if (libres.length) {
      html += '<div class="jsect"><div class="jsect-t">' +
        (libres.length > 1 ? `${libres.length} propositions` : 'Une proposition') + '</div>' +
        // ⚠ UN INDEX PAR PROPOSITION, PAS LE JOUR. Toutes portaient `data-offre=j`
        // et le handler refaisait `aPrendreDu(j)` puis prenait `libres[0]` :
        // deux menages a prendre le meme jour, elle touchait le second, la
        // feuille de prise annoncait le PREMIER. Si elle validait, elle prenait
        // le mauvais logement — et le second n'etait jamais atteignable.
        libres.map((m, i) => `<button class="jligne offre" data-offre="${echapper(j)}" data-offre-i="${i}">` +
          `<span class="jligne-bien">${echapper(m.property_name || '—')}</span>` +
          '<span style="color:var(--primary);font-weight:700;font-size:11px">À PRENDRE</span>' +
          '</button>').join('') + '</div>'
    }

    // 2 — CE QU'ELLE PORTE DEJA.
    if (miens.length) {
      html += '<div class="jsect"><div class="jsect-t">' +
        (miens.length > 1 ? `${miens.length} ménages à vous` : 'Votre ménage') + '</div>' +
        miens.map(m => `<div class="jligne">` +
          `<span class="jligne-bien">${echapper(m.propName || '—')}</span>` +
          (doneSet.has(`${m.id}-${m.departure}`)
            ? '<span style="color:var(--green);font-weight:700;font-size:11px">FAIT</span>' : '') +
          '</div>').join('') + '</div>'
    }

    // 3 — SA DISPONIBILITE.
    // ⚠ PAS DE SECTION DU TOUT QUAND ELLE PORTE UN MENAGE. Un menage FIXE la
    // journee : se declarer absente pendant qu'on doit y etre n'est pas un
    // reglage, c'est une contradiction. Un segment grise aurait suggere un droit
    // qui lui manque ; or c'est elle qui est attendue, et le chemin de retour
    // passe par le retrait du menage, avec son delai.
    // ⚠ NI QUAND ELLE NE REGLE RIEN. Chez une prestataire dont l'hote tient le
    // planning, montrer un segment fige ferait chercher un droit qu'on ne lui
    // promet pas.
    if (!miensTous.length && !passe && mesJours && mesJours.modifiable) {
      // ⚠ FIGE AUSSI SUR UN JOUR DE REPOS, et c'est une limite ASSUMEE.
      // La maquette ouvrait le segment sur un jour habituellement chome : se
      // rendre disponible « pour ce jour-la » y etait une exception positive.
      // Le serveur ne l'accepte pas aujourd'hui — `declarerIndisponibilite` ne
      // sait poser que des ABSENCES. Ouvrir le segment promettrait donc un geste
      // qui echouerait, ce qui est exactement ce que cet ecran s'interdit.
      // Ses jours habituels se reglent dans la carte « Mes jours » ; la feuille
      // le dit plutot que de faire semblant.
      const repos = !c && !e && !jourTravaille(j)
      // ⚠ ET PENDANT L'ENVOI. `basculerMonJour` sort sur `enVolParJour.has(j)`
      // sans un mot : elle touchait la seconde face, rien ne bougeait, et le
      // « ✓ » du geste precedent restait affiche.
      const enVol = enVolParJour.has(j)
      const fige = !!(c || repos || enVol || (e && e.source !== 'prestataire'))
      html += '<div class="jsect"><div class="jsect-t">Disponibilité</div>' +
        '<div class="jseg">' +
        `<button data-dispo="1" aria-pressed="${dispo ? 'true' : 'false'}"${fige ? ' disabled' : ''}>` +
        'Je suis disponible</button>' +
        `<button class="non" data-dispo="0" aria-pressed="${dispo ? 'false' : 'true'}"${fige ? ' disabled' : ''}>` +
        'Je ne suis pas disponible</button></div>' +
        (c ? '<div class="jsect-vide" style="padding-top:8px">Vous êtes en congé — réglez-le dans la carte « Mes jours ».</div>'
           : repos
             ? '<div class="jsect-vide" style="padding-top:8px">Ce jour n’est pas dans vos jours habituels — réglez-les dans la carte « Mes jours ».</div>'
             : (e && e.source !== 'prestataire'
                // ⚠ DEUX SENS, DEUX PHRASES. L'hote peut poser « pas ce samedi »
                // (`available: false`) MAIS AUSSI « viens exceptionnellement »
                // (`available: true`). Un libelle unique annoncait une absence a
                // quelqu'un a qui on venait au contraire de DEMANDER de venir.
                // C'est la regression que `basculerMonJour` avait deja corrigee
                // une fois ; la feuille ne doit pas la reintroduire.
                ? (e.available
                   ? '<div class="jsect-vide" style="padding-top:8px">Votre employeur vous a demandé de venir ce jour-là. Si vous ne pouvez pas, dites-le lui.</div>'
                   : '<div class="jsect-vide" style="padding-top:8px">Absence posée par votre employeur — pour la retirer, dites-le lui.</div>')
                : '')) +
        '</div>'
    }

    document.getElementById('modal-title').textContent = jourLisible(j)
    document.getElementById('modal-sub').textContent = resumeDuJour(libres.length, miens.length, dispo, passe)
    document.getElementById('modal-body').innerHTML = html
    document.getElementById('modal-note').innerHTML = ''
    hideModalMessages()
    reinitialiserRetrait()
    priseEnCours = null
    for (const id of ['modal-done', 'modal-prendre', 'modal-accepter', 'modal-refuser']) {
      document.getElementById(id).style.display = 'none'
    }
    document.getElementById('modal').style.display = 'flex'
  }

  // Vrai quand la feuille est visible ET porte ce jour-la. Un rattrapage qui
  // arrive apres coup n'a rien a redessiner si elle regarde autre chose.
  function feuilleOuverteSur (j) {
    return jourOuvert === j &&
           document.getElementById('modal').style.display === 'flex'
  }

  // ─── LA FEUILLE DES REGLAGES (lot C) ────────────────────────────────────
  //
  // ⚠ ON DEMENAGE LES NOEUDS, ON NE LES RECREE PAS. `appendChild` deplace
  // l'element AVEC ses ecouteurs : les cases a cocher, l'alternance A/B et les
  // conges continuent de marcher sans qu'on repose un seul geste. Les recopier
  // aurait oblige a tout rebrancher — et a le dupliquer a la deuxieme ouverture.
  let reglagesOuverts = false
  function ouvrirReglages () {
    // ⚠ ON RAPATRIE AVANT D'EFFACER. Le bouton garde le focus apres activation :
    // un second Entree relançait la fonction, `innerHTML = ''` DETRUISAIT les
    // deux cartes — qui sont alors filles du modal — et l'`appendChild` suivant
    // recevait `null`. Les reglages disparaissaient pour le reste de la session.
    rendreLesCartes()
    // ⚠ GARDE DE PROFONDEUR, VOLONTAIREMENT NON ATTEIGNABLE PAR L'INTERFACE.
    // L'engrenage n'est pas rendu quand elle ne regle rien, donc aucun test ne
    // peut faire rougir cette ligne — et c'est la raison de ce commentaire : elle
    // n'est pas morte, elle est la SECONDE serrure. Le jour ou un autre chemin
    // menera ici (un lien, un raccourci clavier), elle sera deja en place.
    if (!mesJours || !mesJours.modifiable) return
    const corps = document.getElementById('modal-body')
    corps.innerHTML = ''
    corps.appendChild(document.getElementById('carte-regles'))
    corps.appendChild(document.getElementById('carte-conges'))
    document.getElementById('modal-title').textContent = 'Mes jours'
    document.getElementById('modal-sub').textContent =
      'Ce que vous réglez ici vaut pour toutes les semaines à venir.'
    document.getElementById('modal-note').innerHTML = ''
    hideModalMessages()
    reinitialiserRetrait()
    priseEnCours = null
    jourOuvert = null
    for (const id of ['modal-done', 'modal-prendre', 'modal-accepter', 'modal-refuser']) {
      document.getElementById(id).style.display = 'none'
    }
    reglagesOuverts = true
    document.getElementById('modal').style.display = 'flex'
    // ⚠ LE FOCUS ENTRE DANS LA FEUILLE. Il restait sur l'engrenage, DERRIERE
    // l'overlay : au clavier, la tabulation suivante parcourait la page cachee
    // au lieu du panneau qu'on vient d'ouvrir. Et cet engrenage est repeint —
    // donc detruit — des qu'un geste de la feuille recharge le calendrier, ce qui
    // laissait le focus retomber sur `<body>`.
    const premier = document.querySelector('#modal-body input, #modal-body button')
    if (premier) premier.focus()
  }

  // ⚠ LES CARTES RENTRENT CHEZ ELLES A LA FERMETURE. Les laisser dans le modal
  // marcherait tant qu'on ne le reouvre pas sur autre chose — puis
  // `innerHTML = ''` les DETRUIRAIT, avec leurs ecouteurs, et les reglages
  // seraient perdus pour le reste de la session.
  function rendreLesCartes () {
    if (!reglagesOuverts) return
    reglagesOuverts = false
    // ⚠ ET LE FOCUS REVIENT D'OU IL VENAIT. Sans cela, refermer la feuille le
    // laisse sur un noeud qu'on vient de demenager hors de l'ecran.
    const ancre = document.getElementById('btn-reglages')
    const foyer = document.getElementById('dispo-reglages')
    const r = document.getElementById('carte-regles')
    const c = document.getElementById('carte-conges')
    if (foyer && r) foyer.appendChild(r)
    if (foyer && c) foyer.appendChild(c)
    if (ancre && document.body.contains(ancre)) ancre.focus()
  }

  function resumeDuJour (nLibres, nMiens, dispo, passe) {
    const p = []
    if (nLibres) p.push(nLibres + (nLibres > 1 ? ' propositions' : ' proposition'))
    if (nMiens) p.push(nMiens + (nMiens > 1 ? ' ménages à vous' : ' ménage à vous'))
    if (!p.length) p.push(passe ? 'Aucun ménage' : (dispo ? 'Rien de prévu' : 'Vous n’êtes pas disponible'))
    return p.join(' · ')
  }

  // ⚠ PAS DE RENDU OPTIMISTE ICI, ET C'EST DELIBERE — contrairement au clic
  // « je ne suis pas disponible » du lot 1. Une absence ne concerne qu'elle : si
  // l'envoi echoue, on remet sa journee comme avant et personne d'autre n'a rien
  // vu. Prendre un menage est une COURSE avec ses collegues : afficher « il est
  // a vous » avant que le serveur ait tranche lui ferait organiser sa journee
  // autour d'un menage qu'une autre vient peut-etre de prendre. On attend donc
  // le verdict — et comme l'appel est unique (pas de relecture derriere), il
  // reste court.
  async function prendreLeMenage () {
    if (!priseEnCours) return
    const m = priseEnCours
    const btn = document.getElementById('modal-prendre')
    hideModalMessages()
    if (!navigator.onLine) {
      showModalError('Hors ligne : impossible de prendre un ménage pour le moment.')
      return
    }
    btn.disabled = true
    btn.textContent = 'Envoi…'
    try {
      const res = await fetch(`/api/menages-public?token=${currentToken}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'prendreMenage', property_id: m.property_id,
                               booking_id: m.booking_id, departure_date: m.departure_date })
      })
      const data = await res.json().catch(() => null)
      if (!res.ok) {
        // 409 = course perdue, 403 = pas son bien ou verrou de l'hote. Dans les
        // deux cas le serveur envoie une PHRASE : on l'affiche telle quelle
        // plutot que d'en inventer une qui dirait moins.
        showModalError((data && data.error) || 'Ce ménage n\'a pas pu être pris.')
        btn.disabled = false
        btn.textContent = 'Je prends ce ménage'
        // ⚠ ON RECHARGE QUAND MEME : si quelqu'un vient de le prendre, la bulle
        // doit disparaitre de son calendrier. La laisser inviterait a reessayer
        // indefiniment un geste qui echouera toujours.
        await rechargerApresPrise()
        return
      }
      closeModal()
      await rechargerApresPrise()
    } catch (err) {
      showModalError('Connexion impossible. Réessayez dans un instant.')
      btn.disabled = false
      btn.textContent = 'Je prends ce ménage'
    }
  }

  // Relecture complete apres une prise : le menage change de camp, la bulle
  // decroit et un point apparait sous la date. C'est le seul endroit du lot ou
  // une relecture se justifie — l'etat a vraiment change cote serveur, et
  // ailleurs qu'a l'endroit qu'on a touche.
  async function rechargerApresPrise () {
    const r = await loadData(currentToken, { silencieux: true })
    // ⚠ L'ECRAN GARDE CE QU'IL A si la relecture echoue — meme regle que le
    // rafraichissement au retour au premier plan. Repeindre sur une reponse
    // ratee viderait le planning d'une prestataire dont le reseau a bronche.
    if (!r || r.ok === false) return
    rebuildDoneSet()
    renderFilters()        // les filtres de biens sont reconstruits par loadData
    routeRender()          // la vue courante, quelle qu'elle soit
    if (mesJours) peindreMesJours()
  }

  // ⚠ PAS DE RENDU OPTIMISTE ICI NON PLUS, et pour la meme raison qu'a la prise :
  // le retrait rend le menage a TOUT LE MONDE. L'afficher comme acquis avant le
  // verdict lui ferait liberer sa journee alors que le serveur peut refuser —
  // delai depasse, menage deja reassigne par l'hote.
  async function retirerLeMenage () {
    if (!retraitEnCours) return
    const m = retraitEnCours
    const btn = document.getElementById('modal-retirer')
    hideModalMessages()
    if (!navigator.onLine) {
      showModalError('Hors ligne : impossible de vous retirer pour le moment.')
      return
    }
    if (!w_confirmerRetrait(m)) return
    btn.disabled = true
    btn.textContent = 'Envoi…'
    try {
      const res = await fetch(`/api/menages-public?token=${currentToken}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'retirerMonMenage', property_id: m.propId,
                               booking_id: String(m.bookId), departure_date: m.dateStr })
      })
      const data = await res.json().catch(() => null)
      if (!res.ok) {
        // Le serveur envoie une PHRASE (delai depasse, plus a vous) : on
        // l'affiche telle quelle plutot que d'en inventer une qui dirait moins.
        showModalError((data && data.error) || 'Ce ménage n\'a pas pu être retiré.')
        btn.disabled = false
        btn.textContent = 'Je ne peux plus le faire'
        await rechargerApresPrise()
        return
      }
      closeModal()
      await rechargerApresPrise()
    } catch (err) {
      showModalError('Connexion impossible. Réessayez dans un instant.')
      btn.disabled = false
      btn.textContent = 'Je ne peux plus le faire'
    }
  }

  // ⚠ LE RETRAIT SE COMPTE A PARIS, PAS EN HEURE DE L'APPAREIL, et c'est la
  // SEULE chose de cet ecran qui le fasse. Tout le planning raisonne en local —
  // `dateNueLocale`, `toDateStr` — parce qu'il affiche des jours de calendrier
  // du bien. Le delai de retrait, lui, n'est pas un affichage : c'est la REGLE
  // DE L'HOTE, que le serveur applique en Europe/Paris. Les deux referentiels
  // doivent coincider, sinon l'ecran offre un bouton que le serveur refuse —
  // 2 h de fenetre l'ete, 1 h l'hiver, pour une prestataire aux Antilles.
  function jourParis () {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris',
      year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date())
  }
  function minuitParis (jour) {
    const commeUTC = Date.parse(`${jour}T00:00:00Z`)
    if (!Number.isFinite(commeUTC)) return NaN
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris', hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit' })
    const p = {}
    for (const part of fmt.formatToParts(new Date(commeUTC))) p[part.type] = part.value
    const h = p.hour === '24' ? '00' : p.hour
    const heureParis = Date.parse(`${p.year}-${p.month}-${p.day}T${h}:${p.minute}:${p.second}Z`)
    return commeUTC - (heureParis - commeUTC)
  }

  // Remise a zero du retrait sur une feuille partagee. Appelee par les DEUX
  // ouvertures de modal, et par la fermeture : un bouton laisse affiche agit sur
  // le menage de la feuille precedente.
  function reinitialiserRetrait () {
    retraitEnCours = null
    const b = document.getElementById('modal-retirer')
    if (b) { b.style.display = 'none'; b.disabled = false; b.textContent = 'Je ne peux plus le faire' }
  }

  // ⚠ UNE CONFIRMATION, PARCE QUE LE GESTE ENGAGE QUELQU'UN D'AUTRE. Se retirer
  // rend le logement a l'hote, qui devra trouver une remplacante.
  function w_confirmerRetrait (m) {
    return window.confirm(
      `Vous retirer du ménage de ${m.propName} le ${jourLisible(m.dateStr)} ?\n\n` +
      'Il repassera « à prendre » et votre hôte en sera informé.')
  }

  function openModal(m) {
    // ⚠ LE DERNIER ECRIVAIN DE `#modal-body`. Il n'est pas atteignable
    // aujourd'hui — l'overlay couvre les cartes de menage, qui n'ont pas de
    // `tabindex` — mais il est a un attribut pres de detruire les reglages.
    // Une asymetrie dans une regle de surete finit toujours par etre le trou.
    rendreLesCartes()
    document.getElementById('modal-title').textContent = `Ménage — ${m.propName}`
    document.getElementById('modal-sub').textContent = formatDate(m.date)
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-row"><span>Voyageur</span><span>${m.guestName}</span></div>
      <div class="modal-row"><span>Adultes</span><span>${m.numAdult || '—'}</span></div>
      <div class="modal-row"><span>Enfants</span><span>${m.numChild > 0 ? m.numChild + ' enfant(s) 👶' : 'Aucun'}</span></div>
      <div class="modal-row"><span>Arrivée</span><span>${m.arrival || '—'}</span></div>
      <div class="modal-row"><span>Départ</span><span>${m.departure || '—'}</span></div>
      <div class="modal-row"><span>Statut</span><span>${m.done ? '✅ Effectué' : (m.pending ? '⏳ En attente d envoi' : '⏳ À faire')}</span></div>
    `

    const noteEl = document.getElementById('modal-note')
    noteEl.innerHTML = m.comment
      ? `<div class="admin-note"><div class="admin-note-title">📝 Note de l'employeur</div>${m.comment}</div>`
      : ''

    hideModalMessages()

    const obsolete = isMenageObsolete(m, getMenages())
    const future   = isMenageFuture(m)

    const btn = document.getElementById('modal-done')
    const btnOui = document.getElementById('modal-accepter')
    const btnNon = document.getElementById('modal-refuser')
    // ⚠ Le modal est PARTAGE : sans cette remise a zero, le bouton « Je prends »
    // d'une feuille precedente restait visible sur la fiche d'un menage a elle.
    document.getElementById('modal-prendre').style.display = 'none'
    priseEnCours = null

    // ─── SE RETIRER D'UN MENAGE (lot 5) ────────────────────────────────────
    // ⚠ ON NE PROPOSE PAS UN BOUTON QUI ECHOUERAIT. La garde est SERVEUR
    // (`retirerMonMenage` la refait entierement) ; celle-ci ne sert qu'a ne pas
    // promettre un geste refuse. Trois cas ou il n'apparait pas : le menage
    // n'est pas a elle, le delai est depasse, ou on n'a pas pu LIRE le delai —
    // deviner un defaut qui n'est peut-etre pas celui de l'hote reviendrait a
    // decider a sa place.
    const btnRet = document.getElementById('modal-retirer')
    reinitialiserRetrait()
    if (btnRet) {
      const aElle = !!(m.assign && m.assign.role === 'porteur')
      let possible = aElle && retraitDelaiH !== null && !m.done
      // ⚠ LE PASSE, HORS DU TEST DE DELAI — comme au serveur. Chez un hote qui
      // a choisi « jusqu'au dernier moment », rien d'autre ne borne la date : un
      // menage du mois dernier jamais marque fait offrait le bouton, et le
      // serveur repondait « ce menage est passe ».
      if (possible && m.dateStr < jourParis()) possible = false
      if (possible && retraitDelaiH > 0) {
        possible = (minuitParis(m.dateStr) - Date.now()) / 3600000 >= retraitDelaiH
      }
      btnRet.style.display = possible ? '' : 'none'
      btnRet.disabled = false
      btnRet.textContent = 'Je ne peux plus le faire'
      if (possible) retraitEnCours = m
    }
    btn.style.opacity = ''

    // ⚠ TANT QUE L'OFFRE N'EST PAS ACCEPTEE, il n'y a rien a marquer fait :
    // proposer les deux a la fois laisserait croire qu'on peut faire le menage
    // sans l'avoir accepte, et le serveur refuserait ensuite l'un des deux.
    const offre = estUneOffre(m)
    btnOui.style.display = offre ? '' : 'none'
    btnNon.style.display = offre ? '' : 'none'
    btn.style.display = offre ? 'none' : ''
    if (offre) {
      const d = delaiRestant(m)
      // ⚠ Une offre expiree ne peut plus aboutir : le serveur rendra 409.
      // Laisser les deux boutons actifs, c'est proposer une action qui echoue.
      const expiree = d === 'expirée'
      btnOui.disabled = expiree
      btnNon.disabled = expiree
      if (expiree) showModalWarning('Cette proposition a expiré : le ménage est resté à quelqu\'un d\'autre.')
      else if (d) showModalWarning(`À confirmer — ${d}.`)
      document.getElementById('modal').style.display = 'flex'
      return
    }
    // ⚠ La porteuse garde TOUS ses boutons : ce menage est le sien tant que
    // personne n'a accepte. La mention l'informe, elle ne lui retire rien.
    if (estPropose(m)) {
      showModalWarning('Ce ménage est proposé à quelqu\'un d\'autre. Il reste le vôtre tant que personne ne l\'a accepté.')
    }

    if (m.done) {
      btn.textContent = '↩ Marquer non fait'
      btn.className = 'btn'
      btn.disabled = false
    } else if (obsolete) {
      btn.textContent = '⏭ Obsolète (un voyageur suivant est déjà arrivé)'
      btn.className = 'btn'
      btn.disabled = true
      btn.style.opacity = '0.4'
    } else if (future) {
      btn.textContent = '🔒 Le voyageur n est pas encore parti'
      btn.className = 'btn'
      btn.disabled = true
      btn.style.opacity = '0.4'
    } else {
      btn.textContent = '✓ Marquer fait'
      btn.className = 'btn btn-primary'
      btn.disabled = false
    }

    document.getElementById('modal').style.display = 'flex'
  }

  // ⚠ `jourOuvert` RETOMBE ICI. Sans cela, le segment d'une feuille restait lie
  // a un jour qu'elle avait quitte : un rattrapage tardif ecrivait alors sur ce
  // jour-la, pas sur celui qu'elle regarde.
  function closeModal() { rendreLesCartes(); document.getElementById('modal').style.display = 'none'; selectedMenage = null; jourOuvert = null; reinitialiserRetrait(); hideModalMessages() }

  // ─── Helpers messages modal ────────────────────────────────────────────────
  function showModalError(msg)   { setModalMessage('error',   msg) }
  function showModalSuccess(msg) { setModalMessage('success', msg) }
  function showModalWarning(msg) { setModalMessage('warning', msg) }
  function setModalMessage(type, msg) {
    ;['error','success','warning'].forEach(t => {
      const el = document.getElementById(`modal-${t}`)
      if (t === type) { el.textContent = msg; el.classList.add('visible') }
      else { el.classList.remove('visible') }
    })
  }
  function hideModalMessages() {
    ;['error','success','warning'].forEach(t => document.getElementById(`modal-${t}`).classList.remove('visible'))
  }

  // ─── Routage du clic du bouton modal-done ──────────────────────────────────
  // ─── Repondre a une offre (spec §11.3) ─────────────────────────────────────
  //
  // ⚠ AUCUNE FILE HORS LIGNE ICI, contrairement a « marquer fait ». Accepter une
  // offre est une COURSE : l'hote peut reassigner, une autre candidate peut
  // prendre le menage. Rejouer une acceptation vieille de deux heures ferait
  // croire a un engagement que le serveur a peut-etre deja donne a quelqu'un
  // d'autre. Hors ligne, on le dit et on ne promet rien.
  async function repondreOffre(accepte) {
    const menage = selectedMenage
    if (!menage) return
    const btnOui = document.getElementById('modal-accepter')
    const btnNon = document.getElementById('modal-refuser')
    if (navigator.onLine === false) {
      showModalError('Hors ligne : impossible de répondre à une offre pour le moment.')
      return
    }
    btnOui.disabled = true; btnNon.disabled = true
    try {
      // ⚠ AUCUN REJEU. `fetchWithRetry` rejoue sur toute exception de `fetch` —
      // y compris une reponse perdue alors que le serveur a DEJA commite.
      // Le rejeu retombe alors sur `status='offered'` faux, donc zero ligne,
      // donc 409 : on annoncerait « ce menage ne vous est plus propose » a
      // quelqu'un qui vient de l'accepter. Sur un telephone en 4G instable,
      // exactement l'inverse de ce qu'on veut dire. `doMarkDone`, lui, rejoue :
      // marquer fait est idempotent, accepter ne l'est pas.
      const res = await fetchWithRetry(`/api/menages-public?token=${currentToken}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: accepte ? 'accepterMenage' : 'refuserMenage',
          booking_id: menage.bookId, property_id: menage.propId,
          departure_date: menage.dateStr })
      }, 0)
      const data = await res.json().catch(() => null)
      if (res.status === 409) {
        // ⚠ Course perdue, PAS une panne : on le dit clairement, sinon elle
        // s'organiserait autour d'un menage qui ne lui revient plus.
        showModalWarning('Ce ménage ne vous est plus proposé.')
        await rechargerAssignations()
        // La fiche porte un menage qui n'est plus le sien : la laisser ouverte
        // avec ses deux boutons invitait a recliquer, pour un 404.
        setTimeout(closeModal, 1600)
        return
      }
      if (!res.ok) {
        showModalError((data && data.error) || 'Impossible d\'enregistrer votre réponse.')
        return
      }
      if (menage.assign) menage.assign.status = accepte ? 'accepted' : 'orphaned'
      // ⚠ NE PAS PROMETTRE CE QUI N'ARRIVE PLUS. Le serveur dit lequel des TROIS
      // cas c'est, et il ne faut en annoncer aucun autre :
      //   - `porte`    : quelqu'un d'autre a la charge du menage — rien n'est
      //                  decouvert, l'hote n'est pas alerte ;
      //   - `escalade` : la personne suivante de garde vient d'etre sollicitee.
      //                  L'hote n'est PAS alerte non plus (`!porte && !suivante`
      //                  cote serveur) : lui dire « votre employeur est prevenu »
      //                  etait un mensonge, la faute exacte du commit c6d0553 ;
      //   - ni l'un ni l'autre : plus personne ne porte ce menage, et LA l'hote
      //                  recoit une tache in-app plus un SMS/email.
      showModalSuccess(accepte
        ? 'Ménage accepté.'
        : (data && data.porte
            ? 'Réponse enregistrée. Ce ménage reste à la personne qui en a la charge.'
            : (data && data.escalade
                ? 'Réponse enregistrée. Le ménage est proposé à quelqu\'un d\'autre.'
                : 'Réponse enregistrée : votre employeur est prévenu.')))
      await rechargerAssignations()
      setTimeout(closeModal, 1200)
    } catch (err) {
      showModalError('Connexion impossible. Réessayez.')
    } finally {
      btnOui.disabled = false; btnNon.disabled = false
    }
  }

  // Recharge la vérité serveur après une réponse : c'est lui qui tranche.
  async function rechargerAssignations() {
    try {
      const r = await loadData(currentToken, { silencieux: true })
      if (!r || r.ok === false) return   // l'ecran garde ce qu'il a
      rebuildDoneSet()
      renderFilters()   // les filtres de biens sont reconstruits par loadData
      routeRender()
    } catch (e) { console.warn('[Offre] rechargement impossible', e) }
  }

  async function onModalDoneClick() {
    if (!selectedMenage) return
    if (selectedMenage.done) await doMarkUndone()
    else await doMarkDone()
  }

  // ─── markDone : tente serveur, sinon enqueue offline ───────────────────────
  async function doMarkDone() {
    const menage = selectedMenage
    const btn = document.getElementById('modal-done')
    const originalText = btn.textContent

    if (!menage.bookId || !menage.propId || !menage.dateStr) {
      showModalError('Donnees manquantes (booking_id, property_id ou departure_date).')
      return
    }
    if (isMenageFuture(menage)) {
      showModalError('Le voyageur n est pas encore parti. Impossible de marquer fait.')
      return
    }

    btn.disabled = true
    btn.textContent = '⏳ Envoi en cours...'
    hideModalMessages()

    const action = {
      action: 'markDone',
      booking_id: String(menage.bookId),
      property_id: String(menage.propId),
      departure_date: menage.dateStr
    }

    try {
      const res = await fetchWithRetry(`/api/menages-public?token=${currentToken}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(action)
      }, 1)

      if (!res.ok) {
        let serverMsg = ''
        try { const errBody = await res.json(); serverMsg = errBody.error || '' } catch(e) {}
        showModalError(serverMsg || `Erreur serveur ${res.status}`)
        btn.disabled = false
        btn.textContent = originalText
        return
      }

      const payload = await res.json().catch(() => ({}))
      if (payload.error) {
        showModalError(`Erreur : ${payload.error}`)
        btn.disabled = false
        btn.textContent = originalText
        return
      }

      // Succes serveur : on met a jour le miroir
      const key = `${action.booking_id}|${action.departure_date}`
      serverDoneSet.add(key)
      saveServerDoneSet()
      rebuildDoneSet()
      showModalSuccess('Menage marque comme fait')
      setTimeout(() => { closeModal(); routeRender(); renderSyncBanner() }, 800)

    } catch (err) {
      // Erreur reseau : on enqueue pour envoi differe
      console.warn('[markDone] Reseau KO, mise en file:', err)
      enqueuePending(action)
      rebuildDoneSet()
      showModalWarning('Hors ligne : action enregistree, sera envoyee au retour de la connexion.')
      setTimeout(() => { closeModal(); routeRender(); renderSyncBanner() }, 1200)
    }
  }

  // ─── markUndone : tente serveur, sinon enqueue ─────────────────────────────
  async function doMarkUndone() {
    const menage = selectedMenage
    const btn = document.getElementById('modal-done')
    const originalText = btn.textContent

    btn.disabled = true
    btn.textContent = '⏳ Envoi en cours...'
    hideModalMessages()

    const action = {
      action: 'markUndone',
      booking_id: String(menage.bookId),
      property_id: String(menage.propId),
      departure_date: menage.dateStr
    }

    try {
      const res = await fetchWithRetry(`/api/menages-public?token=${currentToken}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(action)
      }, 1)

      if (!res.ok) {
        let serverMsg = ''
        try { const errBody = await res.json(); serverMsg = errBody.error || '' } catch(e) {}
        showModalError(serverMsg || `Erreur serveur ${res.status}`)
        btn.disabled = false
        btn.textContent = originalText
        return
      }

      const payload = await res.json().catch(() => ({}))
      if (payload.error) {
        showModalError(`Erreur : ${payload.error}`)
        btn.disabled = false
        btn.textContent = originalText
        return
      }

      const key = `${action.booking_id}|${action.departure_date}`
      serverDoneSet.delete(key)
      saveServerDoneSet()
      rebuildDoneSet()
      showModalSuccess('Menage decoche')
      setTimeout(() => { closeModal(); routeRender(); renderSyncBanner() }, 800)

    } catch (err) {
      console.warn('[markUndone] Reseau KO, mise en file:', err)
      enqueuePending(action)
      rebuildDoneSet()
      showModalWarning('Hors ligne : action enregistree, sera envoyee au retour de la connexion.')
      setTimeout(() => { closeModal(); routeRender(); renderSyncBanner() }, 1200)
    }
  }

  // ─── Fetch avec retry simple ───────────────────────────────────────────────
  async function fetchWithRetry(url, options, retries = 1) {
    try { return await fetch(url, options) }
    catch (err) {
      if (retries > 0) {
        await new Promise(r => setTimeout(r, 1500))
        return fetchWithRetry(url, options, retries - 1)
      }
      throw err
    }
  }

  // ─── Vue « Avis » ──────────────────────────────────────────────────────────
  // Ce que la prestataire voit de son propre travail : un ratio et les extraits
  // d'avis qui parlent de proprete. Jamais le nom d'un voyageur, jamais le texte
  // complet d'un avis — le serveur ne les envoie pas, et rien ici ne les demande.
  const POUCE_HAUT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21h4V9H2v12zM23 10a2 2 0 0 0-2-2h-6.3l1-4.6v-.3a1.5 1.5 0 0 0-.4-1L14 1 7.6 7.4A2 2 0 0 0 7 8.8V19a2 2 0 0 0 2 2h9a2 2 0 0 0 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2z"/></svg>'
  const POUCE_BAS  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 3h-4v12h4V3zM1 14a2 2 0 0 0 2 2h6.3l-1 4.6v.3a1.5 1.5 0 0 0 .4 1L10 23l6.4-6.4a2 2 0 0 0 .6-1.4V5a2 2 0 0 0-2-2H6a2 2 0 0 0-1.8 1.2l-3 7.1c-.1.2-.2.5-.2.7v2z"/></svg>'

  let avisCharge = false          // la liste a deja ete chargee une fois
  let currentTab = 'planning'

  // La periode est reglee par l'hote (public_tokens.ratio_periode) ; l'ecran la
  // DIT, sinon « 10 / 11 » ne veut rien dire — sur 15 jours ou depuis toujours,
  // ce n'est pas le meme resultat.
  const LIB_PERIODE = {
    '15j': 'sur 15 jours', '30j': 'sur 30 jours',
    '6mois': 'sur 6 mois', 'toujours': 'depuis le début'
  }
  const PERIODES_VUE = ['15j', '30j', '6mois', 'toujours']
  const LS_PERIODE_AVIS = 'menages-avis-periode-v1'

  // ⚠ LA PERIODE DU DOSSIER N'EST PAS CELLE DE L'EN-TETE.
  // En haut, l'objectif fixe par l'hote : il ne bouge pas d'ici. Dans l'onglet,
  // la consultation libre de la prestataire, memorisee sur SON appareil — elle
  // ne remonte a personne et ne change rien d'autre. Les deux chiffres peuvent
  // donc differer a l'ecran, et chacun porte sa periode ecrite : c'est la seule
  // facon qu'aucun des deux ne se lise a la place de l'autre.
  function periodeVueLocale () {
    try {
      const v = localStorage.getItem(LS_PERIODE_AVIS)
      if (PERIODES_VUE.includes(v)) return v
    } catch (e) {}
    return 'toujours'
  }

  function echapper (t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
  }

  function setTab (t) {
    currentTab = (t === 'avis' || t === 'dispo') ? t : 'planning'
    document.querySelectorAll('#tabs button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === currentTab)
    })
    const planning = document.querySelector('.menage-layout')
    const vue = document.getElementById('avis-vue')
    const vueDispo = document.getElementById('dispo-vue')
    if (planning) planning.style.display = (currentTab === 'planning') ? '' : 'none'
    if (vue) vue.style.display = (currentTab === 'avis') ? '' : 'none'
    if (vueDispo) vueDispo.style.display = (currentTab === 'dispo') ? '' : 'none'
    // Le bouton flottant Filtres appartient au planning : il n'a rien a filtrer
    // ailleurs et resterait sinon en travers de l'ecran sur mobile.
    const fab = document.getElementById('fab-filters')
    if (fab) fab.style.display = (currentTab === 'planning') ? '' : 'none'
    if (currentTab === 'planning') routeRender()
    if (currentTab === 'dispo') chargerDisponibilites()
    if (currentTab === 'avis' && !avisCharge) {
      chargerAvis().catch(err => {
        console.warn('[Avis] chargement impossible', err)
        etatAvis('Service indisponible', 'Réessayez dans un instant.')
      })
    }
  }

  function etatAvis (titre, message) {
    document.getElementById('avis-ratio').style.display = 'none'
    document.getElementById('avis-liste').innerHTML = ''
    const el = document.getElementById('avis-etat')
    el.innerHTML = `<strong>${echapper(titre)}</strong>${echapper(message || '')}`
    el.style.display = ''
  }

  // ─── MES ABSENCES (lot 3.5) ──────────────────────────────────────────────
  //
  // ⚠ ELLE DECLARE UNE ABSENCE, JAMAIS UNE PRESENCE, et jamais ses JOURS
  // ATTITRES : ceux-la sont une decision de son employeur. Pouvoir s'en retirer
  // elle-meme lui permettrait de quitter un bien sans qu'il l'apprenne, alors
  // qu'il compte sur elle pour le preparer.
  //
  // ⚠ AUCUNE FILE HORS LIGNE ICI, contrairement a « marquer fait ». Une absence
  // rejouee deux heures plus tard porterait sur un planning qui a bouge — et
  // surtout, l'ecran ne peut pas promettre que son employeur l'a vue si rien
  // n'est parti. Hors ligne, on le DIT.
  let dispoCharge = false

  // ─── MES JOURS DE TRAVAIL (lot 2b) ───────────────────────────────────────
  //
  // ⚠ LE CALENDRIER EST LE FORMULAIRE, comme sur l'ecran de l'hote — et pour la
  // meme raison : un reglage qu'on ne voit pas se verifie mal. Elle voit ses
  // jours habituels, ses absences et ses conges dans UNE seule vue.
  //
  // ⚠ ELLE DECLARE UNE ABSENCE, JAMAIS UNE PRESENCE. Se rendre disponible un
  // jour que son employeur ne lui a pas confie n'aurait aucun effet — ses jours
  // attitres sont sa decision a lui — et lui ferait croire le contraire. Une
  // tape sur un jour vert le rend rouge ; une tape sur un jour QU'ELLE a rendu
  // rouge l'annule. Un jour rouge par la recurrence ne bouge pas.
  const JOURS_SEM = [{ n: 1, c: 'L' }, { n: 2, c: 'M' }, { n: 3, c: 'M' }, { n: 4, c: 'J' },
                     { n: 5, c: 'V' }, { n: 6, c: 'S' }, { n: 0, c: 'D' }]
  const NOMS_SEM = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi']
  const DISPO_MOIS = 12

  let mesJours = null   // { regles, exceptions, conges, mois, modifiable }

  const isoJ = d => d.toISOString().slice(0, 10)
  const dJour = t => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(t || '')); return m
    ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)) : null }
  const AUJ = () => { const n = new Date()
    return isoJ(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), 12))) }
  // ⚠ En UTC : a minuit local, le lundi bascule d'un jour et l'ancrage A/B se
  // decale d'une semaine entiere.
  const lundiDe = t => { const d = dJour(t); return d
    ? isoJ(new Date(d.getTime() - ((d.getUTCDay() + 6) % 7) * 86400000)) : null }
  const moisDe = n => { const b = dJour(AUJ())
    return new Date(Date.UTC(b.getUTCFullYear(), b.getUTCMonth() + n, 1, 12)) }
  const moisLisible = d => d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric', timeZone: 'UTC' })

  const reglesLues = () => (mesJours.regles || []).filter(r => Array.isArray(r.jours))
  const reglesOpaquesPwa = () => (mesJours.regles || []).filter(r => !Array.isArray(r.jours))
  // ⚠ LE MODE N'EST PAS TOUJOURS DEDUCTIBLE DES DONNEES. Sans aucune regle, rien
  // ne dit si elle veut une quinzaine : le bouton « Une semaine sur deux… »
  // paraissait mort sur un profil vierge — c'est-a-dire sur tous les profils
  // aujourd'hui. Un drapeau d'ecran porte l'intention jusqu'a ce qu'une regle
  // existe. Meme mecanique que l'ecran de l'hote.
  const enQuinzaine = () =>
    (mesJours && mesJours.forceAlternee) || reglesLues().some(r => (r.cadence || 1) >= 2)
  function couvreSemaine (r) {
    const n = Math.max(1, Number(r.cadence) || 1)
    const e = Math.round((dJour(lundiDe(AUJ())) - dJour(lundiDe(r.ancre || AUJ()))) / (7 * 86400000))
    return ((e % n) + n) % n === 0
  }
  const fusion = rs => rs.length
    ? { jours: [...new Set(rs.flatMap(r => r.jours))].sort((a, b) => a - b) } : null
  // ⚠ Une regle HEBDOMADAIRE appartient aux DEUX semaines : l'oublier ferait
  // disparaitre des jours de l'affichage — meme regle que sur l'ecran de l'hote.
  function lotsPwa () {
    const act = reglesLues()
    const quinz = act.filter(r => (r.cadence || 1) >= 2)
    const hebdo = act.filter(r => (r.cadence || 1) < 2)
    return { a: fusion(quinz.filter(couvreSemaine).concat(hebdo)),
             b: fusion(quinz.filter(r => !couvreSemaine(r)).concat(hebdo)) }
  }
  const lettreSemaine = j => {
    const e = Math.round((dJour(lundiDe(j)) - dJour(lundiDe(AUJ()))) / (7 * 86400000))
    return ((e % 2) + 2) % 2 === 0 ? 'A' : 'B'
  }
  const congeDuJour = j => (mesJours.conges || []).find(c =>
    j >= String(c.debut).slice(0, 10) && j <= String(c.fin).slice(0, 10)) || null
  const exceptionDuJour = j => (mesJours.exceptions || [])
    .find(e => String(e.date).slice(0, 10) === j) || null

  // ─── Ce que le calendrier fusionne (refonte v2, lot 2) ────────────────────
  // ⚠ LES MENAGES A ELLE VIENNENT DES RESERVATIONS DEJA CHARGEES, filtrees par
  // le serveur sur son profil : on ne refait pas ce filtrage ici, on le lit.
  // Un menage annule ou hors de ses biens n'est jamais arrive jusqu'a nous.
  // ⚠ SANS LE FILTRE DE BIENS, ET C'EST LA DIFFERENCE QUI COMPTE.
  // `mesMenagesDu` honore `activeProps`, un filtre d'AFFICHAGE que la
  // prestataire manipule pour alleger sa vue. Le faire entrer dans une REGLE de
  // disponibilite avait deux effets, tous deux faux : decocher un logement
  // re-barrait un jour qu'elle travaille reellement, et la garde d'ecriture se
  // laissait contourner par ce meme filtre — vue reduite au bien 1, elle pouvait
  // se declarer absente un jour ou elle a un menage sur le bien 2.
  // Une regle ne se lit jamais a travers un reglage d'affichage.
  function mesMenagesTousBiens (j) {
    if (!Array.isArray(bookings)) return []
    return bookings.filter(b => b.departure === j)
  }
  // Idem pour les propositions : la feuille d'un jour montre ce qui S'Y PASSE,
  // que le filtre d'affichage les montre au calendrier ou non.
  function aPrendreTousBiens (j) {
    if (!Array.isArray(aPrendre)) return []
    return aPrendre.filter(m => m.departure_date === j)
  }

  function mesMenagesDu (j) {
    if (!Array.isArray(bookings)) return []
    return bookings.filter(b => b.departure === j && activeProps.has(b.propId))
  }
  // ⚠ `null` (pas encore charge) et `[]` (rien a prendre) ne se confondent pas :
  // le premier ne doit dessiner aucune bulle, pas une bulle a zero.
  function aPrendreDu (j) {
    if (!Array.isArray(aPrendre)) return []
    // ⚠ LE FILTRE DE BIENS S'APPLIQUE ICI AUSSI. `mesMenagesDu` l'honorait, pas
    // celle-ci : en reduisant l'affichage a un logement, ses points
    // disparaissaient des autres mais les bulles y restaient — et toucher l'une
    // ouvrait la prise d'un logement qu'elle venait explicitement de masquer.
    return aPrendre.filter(m => m.departure_date === j && activeProps.has(m.property_id))
  }

  // ⚠ LA MEME PRECEDENCE QUE LE SERVEUR : conge, exception, regle, puis
  // « aucune regle = disponible ». Une seconde regle ecrite ici divergerait du
  // moteur au premier ajustement, et elle lirait un planning que le cron ne suit
  // pas.
  function jourTravaille (j) {
    // ⚠ UN JOUR QUI PORTE UN MENAGE EST UN JOUR TRAVAILLE (lot A).
    // L'invariant se pose ICI plutot que dans chaque rendu : sans lui, un jour
    // pouvait sortir BARRE ET VERT a la fois — l'ecran se contredisait sur la
    // meme case. Le cas se produit des qu'un menage est attribue d'office sur un
    // jour qu'elle n'avait pas ouvert, ce qui est la situation NORMALE d'une
    // prestataire dont l'hote tient le planning.
    // C'est aussi la generalisation de la decision 5 : prendre un menage debarre
    // le jour, donc en RECEVOIR un le debarre aussi.
    //
    // ⚠ ET CETTE REGLE NE VA PAS AU SERVEUR — C'EST VOULU, PAS UN OUBLI.
    // `lib/cleaning/availability.js` continue de tenir un jour d'absence pour
    // INDISPONIBLE, meme s'il porte deja un menage. L'ecart est deliberé :
    //   · ici, on DECRIT une journee ou elle est attendue — dire « absente » sur
    //     une case qui porte du travail serait faux pour celle qui la lit ;
    //   · la-bas, on DECIDE d'en attribuer d'autres — et un menage tombe sur un
    //     jour qu'elle avait ferme ne doit pas rouvrir ce jour a tout le reste.
    // Propager l'invariant au moteur creerait une boucle : le premier menage
    // rendrait le jour disponible, donc eligible au deuxieme, et ainsi de suite.
    // Le commentaire d'en-tete (« la meme precedence que le serveur ») vaut pour
    // la precedence conge > exception > regle, qui est intacte ; celle-ci est
    // une couche d'AFFICHAGE posee par-dessus, et elle s'arrete a l'ecran.
    if (mesMenagesTousBiens(j).length) return true
    if (congeDuJour(j)) return false
    const e = exceptionDuJour(j)
    if (e) return e.available === true
    const act = reglesLues()
    // Une regle qu'on ne sait pas relire ne vaut pas « aucune regle » : on
    // montre le cas le plus prudent plutot qu'un calendrier tout vert.
    if (!act.length) return reglesOpaquesPwa().length === 0
    const jour = dJour(j).getUTCDay()
    return act.some(r => {
      if (!r.jours.includes(jour)) return false
      const n = Math.max(1, Number(r.cadence) || 1)
      if (n < 2) return true
      const e2 = Math.round((dJour(lundiDe(j)) - dJour(lundiDe(r.ancre || AUJ()))) / (7 * 86400000))
      return ((e2 % n) + n) % n === 0
    })
  }

  async function chargerDisponibilites () {
    const etat = document.getElementById('dispo-etat')
    const contenu = document.getElementById('dispo-contenu')
    if (!dispoCharge) { etat.textContent = 'Chargement…'; etat.style.display = ''; contenu.style.display = 'none' }
    let data
    try {
      const res = await fetch(`/api/menages-public?action=disponibilites&token=${currentToken}`)
      if (!res.ok) throw new Error(String(res.status))
      data = await res.json()
    } catch (err) {
      // ⚠ On le DIT plutot que d'afficher un calendrier vide : « aucune absence »
      // sur une panne lui ferait croire qu'elle a bien declare.
      etat.innerHTML = '<strong>Vos jours n\'ont pas pu être lus</strong>Vérifiez votre connexion, puis rouvrez cet onglet.'
      etat.style.display = ''; contenu.style.display = 'none'
      return
    }
    if (data.autorise !== true) { ecranNonAutorisee(); return }
    dispoCharge = true
    etat.style.display = 'none'; contenu.style.display = ''
    const moisCourant = mesJours ? mesJours.mois : 0
    mesJours = { regles: data.regles || [], exceptions: data.exceptions || [],
                 conges: data.conges || [], modifiable: data.modifiable === true,
                 mois: moisCourant }
    // ⚠ CE QUI EST EN VOL SURVIT AU RECHARGEMENT. Le serveur rend l'etat qu'il
    // connait ; il ne connait pas encore les ecritures parties a l'instant.
    // Sans cette ligne, revenir sur l'onglet — ou poser un conge — pendant
    // qu'une absence s'envoie faisait retomber la case a son ancien etat, avec
    // « ✓ Absence enregistree » toujours affiche au-dessus.
    reappliquerEnVol()
    peindreMesJours()
  }

  function peindreMesJours () {
    peindreMesRegles()
    peindreMonMois()
    peindreMonAgenda()
    peindreMesConges()
    const msg = document.getElementById('dispo-message')
    if (!mesJours.modifiable) {
      msg.textContent = 'Vous pouvez consulter vos jours, mais c\'est votre employeur qui pose vos absences.'
    } else if (!msg.dataset.garde) {
      // ⚠ « CI-DESSOUS » NE DESIGNAIT PLUS RIEN. Depuis le lot C, le formulaire
      // de conge vit derriere l'engrenage : la phrase envoyait defiler vers un
      // espace vide. Un mode d'emploi qui pointe a cote est pire que pas de mode
      // d'emploi — il fait douter de ce qu'on a sous les yeux.
      msg.textContent = 'Touchez un jour pour voir ce qui s\'y passe. Pour plusieurs jours d\'affilée, posez un congé dans « Mes jours ».'
    }
  }

  function ligneLecture (jours, tag, classe, fige) {
    const t = tag ? `<span class="dispo-tag ${classe}">${tag}</span>`
                  : '<span class="dispo-tag simple">Je travaille</span>'
    // ⚠ DE VRAIES CASES A COCHER, pas des pastilles. L'element cliquable est le
    // `<label>` : il porte la cible tactile de 44 px, et le `<input>` caché
    // dedans garde le clavier et les lecteurs d'écran — une `<div>` avec un
    // `onclick` aurait perdu les deux.
    return `<div class="dispo-ligne-ab ${classe}${fige ? ' fige' : ''}">${t}` + JOURS_SEM.map(j =>
      `<label class="dispo-pastille${jours.includes(j.n) ? ' on' : ''}">` +
      `<input type="checkbox" data-lot="${classe || 'simple'}" value="${j.n}"` +
      `${jours.includes(j.n) ? ' checked' : ''}${fige ? ' disabled' : ''}>` +
      `<span>${j.c}</span></label>`).join('') + '</div>'
  }

  // ⚠ ELLE REGLE SES JOURS ELLE-MEME (decision du 15 septembre 2026, revenant
  // sur celle du meme jour : « c'est l'organisation du travail, pas une
  // declaration d'absence »). La carte est donc un FORMULAIRE, pas un resume.
  //
  // ⚠ CE QUE CA OUVRE, ET QUI N'EST PAS FERME ICI : elle peut se retirer d'un
  // jour sur lequel son employeur compte, et rien ne l'en previent. Noté au KB.
  function peindreMesRegles () {
    const zone = document.getElementById('dispo-recur')
    const aide = document.getElementById('dispo-recur-aide')
    // ⚠ LE FOCUS SURVIT AU REPEINT. Ces cases se reconstruisent desormais a
    // CHAQUE tape (rendu optimiste) et non plus une fois par aller-retour : au
    // clavier, la case qu'on vient de cocher disparaissait sous le doigt et le
    // `Tab` suivant repartait du haut de la page. On note laquelle avait le
    // focus, et on le lui rend.
    const actif = document.activeElement
    const focus = actif && actif.matches && actif.matches('#dispo-recur input[data-lot]')
      ? { lot: actif.dataset.lot, valeur: actif.value } : null
    const act = reglesLues()
    const opaques = reglesOpaquesPwa()
    // ⚠ SANS DROIT D'ECRITURE, LES CASES SONT FIGEES MAIS VISIBLES. Les cacher
    // lui ferait croire qu'elle n'a aucun jour habituel ; les laisser actives
    // promettrait une action que le serveur refuse en 403.
    const fige = !mesJours.modifiable

    if (enQuinzaine()) {
      const { a, b } = lotsPwa()
      zone.innerHTML = '<div class="dispo-lignes-ab">' +
        ligneLecture(a ? a.jours : [], 'Semaine A', 'a', fige) +
        ligneLecture(b ? b.jours : [], 'Semaine B', 'b', fige) + '</div>' +
        (fige ? '' :
          '<div class="dispo-ancre">' +
          `<span>Cette semaine est une <b>semaine ${lettreSemaine(AUJ())}</b>.</span>` +
          '<button type="button" class="dispo-lien" id="dispo-inverser">' +
          `C'est plutôt une semaine ${lettreSemaine(AUJ()) === 'A' ? 'B' : 'A'}</button></div>` +
          '<div style="margin-top:8px"><button type="button" class="dispo-mini" id="dispo-simple">' +
          'Revenir à toutes les semaines</button></div>')
      // ⚠ L'ANCRAGE SE DIT MEME QUAND ELLE NE PEUT PAS Y TOUCHER. « Une semaine
      // sur deux » ne designe rien sans un repere : elle doit pouvoir verifier
      // elle-meme ou elle en est.
      aide.innerHTML = fige
        ? `Cette semaine est une <b>semaine ${lettreSemaine(AUJ())}</b>. ` +
          'Réglé par votre employeur — pour le changer, dites-le lui.'
        : 'Cochez les jours où vous travaillez habituellement.'
    } else {
      const tous = fusion(act)
      zone.innerHTML = '<div class="dispo-lignes-ab">' +
        ligneLecture(tous ? tous.jours : [], '', 'simple', fige) + '</div>' +
        (fige ? '' :
          '<div style="margin-top:8px"><button type="button" class="dispo-mini" id="dispo-alterner">' +
          'Une semaine sur deux…</button></div>')
      aide.textContent = fige
        ? 'Réglé par votre employeur — pour le changer, dites-le lui.'
        : 'Cochez les jours où vous travaillez habituellement.'
    }
    // ⚠ LA PHRASE REVIENT, MAIS SEULEMENT QUAND ELLE EST VRAIE ET UTILE.
    // Elle avait ete retiree parce qu'elle etait le SEUL contenu de la carte sur
    // un profil vierge — ca se lisait comme un ecran qui n'a pas fini de
    // charger. Mais depuis que les cases s'ecrivent, tout decocher est le geste
    // le plus lourd disponible ici, et c'est la seule ligne qui dit ce qu'il
    // veut dire. Elle suit une lecture REUSSIE, sous des cases visibles : elle
    // ne peut plus passer pour un ecran en cours de chargement.
    if (!act.length && !opaques.length) {
      aide.textContent = 'Vous n\'avez aucun jour habituel : vous êtes comptée ' +
        'disponible tous les jours.'
    } else if (!fige) {
      // ⚠ COCHER UN JOUR NE SUFFIT PAS A EN RECEVOIR DU TRAVAIL, et l'aide le
      // taisait. Deux filtres distincts decident : `weekdays` dit quels jours
      // l'hote lui CONFIE un bien, la recurrence dit quels jours elle EST LA.
      // Elle coche le mardi, l'ecran le peint vert, et elle n'aura jamais un
      // menage le mardi. C'est le geste naturel de qui veut plus de travail.
      aide.textContent += ' Pour être proposée un jour de plus, dites-le aussi ' +
        'à votre employeur : c\'est lui qui confie les logements.'
    }
    if (opaques.length) {
      aide.innerHTML += '<br>Vous avez aussi ' + opaques.length +
        ' règle(s) que cet écran ne sait pas afficher. Demandez à votre employeur.'
    }
    const bAlt = document.getElementById('dispo-alterner')
    if (bAlt) bAlt.addEventListener('click', () => basculerMonAlternance(true))
    const bSimple = document.getElementById('dispo-simple')
    if (bSimple) bSimple.addEventListener('click', () => basculerMonAlternance(false))
    const bInv = document.getElementById('dispo-inverser')
    if (bInv) bInv.addEventListener('click', inverserMonAncrage)
    if (focus) {
      const rendu = zone.querySelector(`input[data-lot="${focus.lot}"][value="${focus.valeur}"]`)
      if (rendu) rendu.focus()
    }
  }

  // ⚠ DEUX MOIS A LA FOIS, cote a cote ou empiles selon la largeur (le CSS s'en
  // charge). Un seul mois obligeait a naviguer pour voir la fin d'une semaine a
  // cheval, et un conge de fin de mois se posait a l'aveugle.
  // ⚠ LA BORNE DE NAVIGATION SUIT : avec deux mois affiches, le dernier pas
  // utile est `DISPO_MOIS - 2`, sinon le second mois sortirait de l'horizon d'un
  // an que le serveur accepte.
  const DISPO_VISIBLES = 2

  function peindreMonMois () {
    const a = moisDe(mesJours.mois)
    const dernier = moisDe(Math.min(DISPO_MOIS - 1, mesJours.mois + DISPO_VISIBLES - 1))
    // ⚠ L'ANNEE NE SE RETIRE QUE SI LES DEUX MOIS LA PARTAGENT. Sans ce test,
    // « decembre 2026 – janvier 2027 » s'affichait « decembre – janvier 2027 »,
    // qui se lit decembre 2027.
    const memeAnnee = a.getUTCFullYear() === dernier.getUTCFullYear()
    document.getElementById('dispo-titre-mois').textContent = memeAnnee
      ? moisLisible(a).replace(/ \d{4}$/, '') + ' – ' + moisLisible(dernier)
      : moisLisible(a) + ' – ' + moisLisible(dernier)
    document.getElementById('dispo-prec').disabled = mesJours.mois === 0
    document.getElementById('dispo-suiv').disabled = mesJours.mois >= DISPO_MOIS - DISPO_VISIBLES

    const alt = enQuinzaine()
    const auj = AUJ()
    let out = ''
    for (let k = 0; k < DISPO_VISIBLES && mesJours.mois + k < DISPO_MOIS; k++) {
      // Le dernier mois PEINT, pas le dernier de l'horizon : c'est lui qui porte
      // les cases mortes ou l'engrenage se pose.
      const dernier = (k === DISPO_VISIBLES - 1) || (mesJours.mois + k + 1 >= DISPO_MOIS)
      out += peindreUnMois(moisDe(mesJours.mois + k), alt, auj, dernier)
    }
    document.getElementById('dispo-months').innerHTML = out
    peindreLegende(alt)
  }

  function peindreUnMois (a, alt, auj, dernierMois = false) {
    const nb = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth() + 1, 0, 12)).getUTCDate()
    const decal = (a.getUTCDay() + 6) % 7
    const cellules = []
    for (let z = 0; z < decal; z++) cellules.push(null)
    for (let d = 1; d <= nb; d++) cellules.push(isoJ(new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), d, 12))))
    // ⚠ LE RESTE SE MESURE AVANT LE BOURRAGE. `while (length % 7) push(null)`
    // rendait `length % 7` nul par construction : le calcul des cases libres
    // sortait TOUJOURS zero, la variante « engrenage seul » etait du code mort,
    // et l'engrenage prenait une rangee de plus SOUS les cases vides — l'inverse
    // exact de ce qu'il vient faire.
    const casesMortes = (7 - (cellules.length % 7)) % 7
    // ⚠ ON NE BOURRE PAS QUAND L'ENGRENAGE VA PRENDRE LA PLACE. Mesurer
    // `casesMortes` avant le bourrage ne suffisait pas : les `null` etaient
    // toujours rendus en `.dispo-case vide`, qui sont de VRAIS elements de
    // grille. L'engrenage se placait donc APRES eux, sur une rangee neuve —
    // exactement ce qu'il vient eviter, et 44 px + la gouttiere de perdus a
    // chaque peinture.
    const engrenageIci = !!(dernierMois && mesJours && mesJours.modifiable)
    if (!engrenageIci) { while (cellules.length % 7) cellules.push(null) }

    let out = `<div class="dispo-mois"><div class="dispo-mois-titre">${echapper(moisLisible(a))}</div>` +
              `<div class="dispo-grille${alt ? ' alt' : ''}">`
    if (alt) out += '<div class="dispo-sem"></div>'
    out += JOURS_SEM.map(j => `<div class="dispo-dow">${j.c}</div>`).join('')
    for (let w = 0; w < cellules.length; w += 7) {
      const sem = cellules.slice(w, w + 7)
      if (alt) {
        const reel = sem.find(Boolean)
        const q = reel ? lettreSemaine(reel) : ''
        out += `<div class="dispo-sem ${q === 'A' ? 'a' : 'b'}">${q}</div>`
      }
      for (const j of sem) {
        if (!j) { out += '<div class="dispo-case vide"></div>'; continue }
        const c = congeDuJour(j), libre = jourTravaille(j)
        const exc = !c && exceptionDuJour(j)
        // ⚠ LE CALENDRIER FUSIONNE PLANNING ET DISPONIBILITES (refonte v2,
        // lot 2). La meme case porte desormais trois informations : si elle
        // travaille (le fond), ce qu'elle a a faire (les points), et ce que
        // personne ne fait (la bulle).
        const miens = mesMenagesDu(j)
        const libres = aPrendreDu(j)
        // ⚠ LE CONGE AUSSI CEDE AU MENAGE (decision 1, 18 septembre). La branche
        // `c ? ' conge' : …` etait choisie AVANT toute consultation de
        // `jourTravaille` : un conge portant un menage sortait VERT ET BARRE,
        // exactement la contradiction que l'invariant existe pour supprimer.
        // Un ménage tombé sur un congé se produit des qu'un sejour survit aux
        // vacances — ce n'est pas un cas de bord.
        const congeVisible = c && !miens.length
        const cls = 'dispo-case' + (congeVisible ? ' conge' : (libre ? '' : ' off')) +
                    (j < auj ? ' passe' : '') + (j === auj ? ' auj' : '') +
                    (miens.length ? ' a-moi' : '') +
                    (exc && exc.source === 'prestataire' ? ' manuel' : '') +
                    (libres.length ? ' a-prendre' : '')
        const titre = [
          congeVisible ? ('Congé' + (c.motif ? ' — ' + c.motif : ''))
            : (libre ? 'Je travaille' : (exc ? 'Je suis absente' : 'Je ne travaille pas ce jour-là')),
          miens.length ? `${miens.length} ménage${miens.length > 1 ? 's' : ''} à moi` : '',
          libres.length ? `${libres.length} ménage${libres.length > 1 ? 's' : ''} à prendre` : ''
        ].filter(Boolean).join(' · ')
        // ⚠ LA BULLE EST POSEE MEME SUR UN JOUR ETEINT, et c'est une decision :
        // une offre reste saisissable un jour ou elle s'est dite absente — la
        // prendre vaut « je me rends disponible pour celui-la ». Le jour recule,
        // pas l'offre.
        const bulle = libres.length
          ? `<span class="dispo-bulle">${libres.length}</span>` : ''
        // ⚠ UNE PASTILLE CHIFFREE, PLUS DES POINTS (lot A). Le chiffre porte la
        // charge du jour — « 2 menages mardi » se lit sans reflechir, la ou des
        // points se recomptent des trois.
        const points = miens.length
          ? `<span class="dispo-compte">${miens.length}</span>` : ''
        // ⚠ UNE CASE QUI PORTE UNE OFFRE RESTE TOUCHABLE MEME PASSEE... non :
        // un menage passe n'est pas recuperable (decision du 17 septembre), et
        // le serveur le refuse. On ne l'ouvre donc pas non plus ici.
        // ⚠ LA MEME REGLE QUE L'OUVERTURE, ET UNE SEULE. `inerte` etait calcule a
        // part : il ne suivait plus `jourOuvrable`, qui ouvre desormais un jour
        // PASSE portant un de ses menages et un jour de CONGE. Ces cases
        // recevaient `tabindex="-1"` et un curseur « interdit » alors qu'elles
        // s'ouvrent — inatteignables au clavier, mensongeres a la souris. Et
        // symetriquement, chez une prestataire qui ne regle rien, un jour futur
        // vide restait focusable et « cliquable » sans rien ouvrir.
        const inerte = !jourOuvrable(j)
        out += `<div class="${cls}${inerte ? ' inerte' : ''}" data-jour="${j}" title="${echapper(titre)}" ` +
               `tabindex="${inerte ? -1 : 0}">${bulle}<span class="dispo-num">${+j.slice(8, 10)}</span>${points}</div>`
      }
    }
    // ⚠ TROIS CAS, PARCE QUE LA PLACE VARIE D'UN MOIS A L'AUTRE. « Mes jours »
    // ne tient pas dans une case de 44 px :
    //   · 3 cases ou plus -> engrenage + libelle, cale a droite ;
    //   · 1 ou 2 cases    -> engrenage SEUL. Un mois sur deux finit ainsi, et
