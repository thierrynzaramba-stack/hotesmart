<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HôteSmart — Gestion ménages</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    .menage-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
    .mini-cal { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; position: sticky; top: 0; }
    .mini-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .mini-cal-title { font-size: 13px; font-weight: 500; }
    .mini-cal-nav { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 14px; padding: 2px 6px; border-radius: var(--radius); }
    .mini-cal-nav:hover { background: var(--bg2); }
    .mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .mini-cal-day-label { font-size: 9px; color: var(--text3); text-align: center; padding: 2px 0; font-weight: 500; }
    .mini-cal-day { font-size: 10px; text-align: center; padding: 3px 0; border-radius: 4px; cursor: pointer; color: var(--text2); position: relative; }
    .mini-cal-day:hover { background: var(--bg2); }
    .mini-cal-day.today { background: var(--primary); color: white; font-weight: 600; }
    .mini-cal-day.has-menage { background: #FFF3CD; color: #856404; font-weight: 500; }
    .mini-cal-day.has-menage.done { background: #D1FAE5; color: #065F46; }
    .mini-cal-day.selected-week { background: var(--bg2); border: 0.5px solid var(--border2); }
    .mini-cal-day.other-month { opacity: 0.3; }

    /* Tooltip mini-cal */
    .cal-tooltip {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 200;
      pointer-events: none;
      display: none;
      line-height: 1.4;
      text-align: left;
    }
    .mini-cal-day:hover .cal-tooltip { display: block; }

    .filter-title { font-size: 10px; color: var(--text2); font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .filter-item input { cursor: pointer; accent-color: var(--primary); }
    .filter-label { font-size: 12px; color: var(--text); }
    .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .planning-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .week-nav { display: flex; align-items: center; gap: 8px; }
    .week-nav button { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--text); }
    .week-nav button:hover { background: var(--bg2); }
    .week-label { font-size: 14px; font-weight: 500; min-width: 200px; text-align: center; }
    .btn-today { font-size: 12px; }

    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day-col { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; min-height: 200px; }
    .day-col.today { border-color: var(--primary); }
    .day-header { padding: 8px 10px; border-bottom: 0.5px solid var(--border); background: var(--bg2); }
    .day-name { font-size: 10px; color: var(--text2); font-weight: 500; text-transform: uppercase; }
    .day-number { font-size: 18px; font-weight: 600; color: var(--text); line-height: 1.2; }
    .day-col.today .day-number { color: var(--primary); }
    .day-body { padding: 6px; display: flex; flex-direction: column; gap: 4px; }

    .menage-card { border-radius: var(--radius); padding: 6px 8px; font-size: 11px; cursor: pointer; transition: opacity 0.15s; position: relative; }
    .menage-card:hover { opacity: 0.85; }
    .menage-card.done { opacity: 0.6; }
    .menage-card.done .menage-card-title { text-decoration: line-through; }
    .menage-card-prop { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.8; margin-bottom: 2px; }
    .menage-card-title { font-weight: 500; line-height: 1.3; }
    .menage-card-time { font-size: 9px; opacity: 0.7; margin-top: 2px; }
    .menage-card-check { position: absolute; top: 4px; right: 4px; font-size: 10px; }
    .menage-card-comment { position: absolute; bottom: 4px; right: 4px; font-size: 9px; }
    /* Qui fait le menage. `offered` = propose, pas encore confirme : la nuance
       compte, un suppleant qui n'a pas repondu n'est pas un menage couvert. */
    .presta-pastille { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 600;
                       border-radius: 999px; padding: 1px 6px; margin-top: 3px; background: rgba(255,255,255,0.75); }
    .presta-pastille.offert { border: 1px dashed currentColor; }
    .presta-pastille.vide   { background: rgba(0,0,0,0.06); font-weight: 500; font-style: italic; }
    .presta-pastille.refus  { background: #FEE2E2; color: #991B1B; }
    .presta-ligne { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .presta-ligne select { flex: 1; padding: 6px 8px; font-size: 13px; border: 0.5px solid var(--border);
                           border-radius: var(--radius); background: var(--bg); color: var(--text); }
    .presta-etat { font-size: 11px; color: var(--text2); margin-top: 6px; min-height: 14px; }
    .presta-gestes { display: flex; gap: 8px; margin-top: 8px; }
    .presta-gestes button { flex: 1; font-size: 12px; padding: 7px 6px; line-height: 1.2; }
    .presta-gestes button small { display: block; font-size: 10px; opacity: 0.65; font-weight: 400; }
    .presta-gestes button:disabled { opacity: 0.4; cursor: default; }

    .prop-color-0 { background: #DBEAFE; color: #1E40AF; }
    .prop-color-1 { background: #D1FAE5; color: #065F46; }
    .prop-color-2 { background: #FEF3C7; color: #92400E; }
    .prop-color-3 { background: #FCE7F3; color: #9D174D; }
    .prop-color-0.done { background: #EFF6FF; }
    .prop-color-1.done { background: #ECFDF5; }

    .day-empty { font-size: 11px; color: var(--text3); text-align: center; padding: 20px 8px; }

    .week-stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .week-stat { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 12px; }
    .week-stat strong { font-size: 18px; font-weight: 600; display: block; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 24px; width: 420px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
    .modal-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 0.5px solid var(--border); }
    .modal-row:last-of-type { border-bottom: none; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

    /* Commentaire admin */
    .comment-section { margin-top: 16px; padding-top: 16px; border-top: 0.5px solid var(--border); }
    .comment-label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .comment-input { width: 100%; min-height: 80px; resize: vertical; }
    .comment-save-btn { margin-top: 8px; }
    .comment-saved { font-size: 11px; color: var(--green); margin-top: 4px; display: none; }
  </style>
</head>
<body>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title">Gestion ménages</div>
        <div class="page-sub">Planning des interventions par bien</div>
      </div>
    </div>

    <div class="content">
      <div class="menage-layout">

        <div>
          <div class="mini-cal">
            <div class="mini-cal-header">
              <button class="mini-cal-nav" id="mini-prev">‹</button>
              <div class="mini-cal-title" id="mini-cal-title"></div>
              <button class="mini-cal-nav" id="mini-next">›</button>
            </div>
            <div class="mini-cal-grid" id="mini-cal-grid">
              <div class="mini-cal-day-label">L</div>
              <div class="mini-cal-day-label">M</div>
              <div class="mini-cal-day-label">M</div>
              <div class="mini-cal-day-label">J</div>
              <div class="mini-cal-day-label">V</div>
              <div class="mini-cal-day-label">S</div>
              <div class="mini-cal-day-label">D</div>
            </div>
          </div>

          <div class="mini-cal" style="margin-top:12px">
            <div class="filter-title">Biens affichés</div>
            <div id="filter-list">
              <div style="font-size:11px;color:var(--text2)">Chargement...</div>
            </div>
          </div>
        </div>

        <div>
          <div class="planning-header">
            <div class="week-nav">
              <button id="btn-prev-week">← Semaine préc.</button>
              <div class="week-label" id="week-label"></div>
              <button id="btn-next-week">Semaine suiv. →</button>
            </div>
            <button class="btn btn-today" id="btn-today">Aujourd'hui</button>
          </div>

          <div class="week-stats" id="week-stats"></div>

          <div class="week-grid" id="week-grid">
            <div style="grid-column:span 7;text-align:center;padding:40px;color:var(--text2)">Chargement...</div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-body"></div>

    <!-- Commentaire admin -->
    <div class="comment-section">
      <div class="comment-label">📝 Note pour la femme de ménage</div>
      <textarea class="form-input comment-input" id="modal-comment" placeholder="Ex: Attention au jacuzzi, changer les draps du lit double..."></textarea>
      <button class="btn btn-primary comment-save-btn" id="btn-save-comment">Enregistrer la note</button>
      <div class="comment-saved" id="comment-saved">✅ Note enregistrée</div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="modal-done">✓ Marquer fait</button>
      <button class="btn" id="modal-close">Fermer</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth } from '/components/auth-guard.js'
  import { renderSidebar } from '/components/sidebar.js'
import { compteCourant, peutEcrire, enteteCompte } from '/shared/compte-courant.js'
  import { supabase } from '/shared/supabase.js'
  import { initErrorHandler } from '/shared/error-handler.js'

  initErrorHandler()

  const PROP_COLORS = ['prop-color-0', 'prop-color-1', 'prop-color-2', 'prop-color-3']
  const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim']
  const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre']

  let currentSession = null
  let assignations = {}   // `bien|resa|depart` -> { provider_id, status, assigned_by }
  let prestataires = []   // profils `lien` du compte, pour le selecteur
  let properties = []
  let bookings = []
  let doneSet = new Set()
  let commentsMap = {}  // bookingId-departure -> comment
  let currentWeekStart = getMonday(new Date())
  let miniCalDate = new Date()
  let activeProps = new Set()
  let selectedMenage = null

  async function init() {
    currentSession = await requireAuth()
    if (!currentSession) return

    // Les trois chargements ne dependent que de la session : ils partent ENSEMBLE.
    // En serie, leurs latences s'additionnaient avant le premier pixel de grille.
    // Chacun porte son propre catch : une promesse rejetee ne doit pas empecher
    // les autres d'aboutir.
    loadDoneSet()
    const pSidebar  = renderSidebar('menages').catch(e => console.error('[menages] sidebar', e))
    const pPlanning = loadPlanning().catch(e => { console.error('[menages] planning', e); planningEnErreur('Impossible de charger le planning.') })
    const pComments = loadComments().catch(e => console.error('[menages] commentaires', e))

    // La grille s'affiche des que le planning est la. Les commentaires n'alimentent
    // qu'un badge de note : les attendre retarderait l'affichage pour rien.
    await pPlanning
    renderFilters()
    renderMiniCal()
    renderWeek()

    // Rafraichissement discret quand les notes arrivent.
    pComments.then(() => { renderMiniCal(); renderWeek() })

    // ⚠ Les ecouteurs sont cables ICI, juste apres l'affichage de la grille, et
    // surtout PAS derriere une attente de la sidebar : celle-ci est la chaine la
    // plus lente de la page (getApiStatus enchaine trois requetes en serie).
    // Attendre sa resolution laisserait une grille complete et cliquable a
    // l'ecran, mais des boutons morts — navigation par semaine, ouverture d'une
    // carte, « Marquer effectue » — sans aucun retour visuel ; et indefiniment
    // si la sidebar ne se resolvait jamais. Rien ici n'en depend.
    document.getElementById('btn-prev-week').addEventListener('click', () => { currentWeekStart = addDays(currentWeekStart, -7); renderWeek(); renderMiniCal() })
    document.getElementById('btn-next-week').addEventListener('click', () => { currentWeekStart = addDays(currentWeekStart, 7); renderWeek(); renderMiniCal() })
    document.getElementById('btn-today').addEventListener('click', () => { currentWeekStart = getMonday(new Date()); miniCalDate = new Date(); renderWeek(); renderMiniCal() })
    document.getElementById('mini-prev').addEventListener('click', () => { miniCalDate = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() - 1, 1); renderMiniCal() })
    document.getElementById('mini-next').addEventListener('click', () => { miniCalDate = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() + 1, 1); renderMiniCal() })
    document.getElementById('modal-close').addEventListener('click', closeModal)
    document.getElementById('modal-done').addEventListener('click', markDone)
    document.getElementById('modal').addEventListener('click', (e) => { if (e.target === document.getElementById('modal')) closeModal() })
    document.getElementById('btn-save-comment').addEventListener('click', saveComment)

    // ⚠ LECTURE SEULE VISIBLE. Un membre a `menages: read` ne doit pas voir un
    // champ de saisie et un bouton qui echoueront a l'enregistrement — la RLS les
    // refuserait, mais il aurait deja ecrit sa note. On la lui montre en lecture.
    if (!peutEcrire('menages')) {
      const zone = document.getElementById('modal-comment')
      const bouton = document.getElementById('btn-save-comment')
      if (zone) { zone.readOnly = true; zone.placeholder = 'Lecture seule' }
      if (bouton) bouton.remove()
      // ⚠ « Marquer fait » aussi. Il ne touche aujourd'hui que le localStorage
      // (voir markDone), donc il ne pouvait rien casser en base — mais le laisser
      // actif en lecture seule fait croire a une action partagee qui n'existe pas.
      const fait = document.getElementById('modal-done')
      if (fait) fait.remove()
    }
  }

  // Planning dual-provider : une seule lecture serveur (api/menages.js), qui lit
  // bookings_snapshot. Fini l'appel direct a /api/beds24, qui laissait le planning
  // VIDE pour un hote Channex (ecart E1 de l'audit d'unification).
  // La cle des biens est provider_property_id, deja utilisee par menage_comments,
  // menage_done et public_tokens : les ecritures du front restent inchangees.
  // Fenetre demandee au serveur : bornee pour ne jamais dependre du cap de
  // pagination (un planning tronque en silence perdrait des menages de la semaine
  // en cours). Large de part et d'autre pour couvrir la navigation par semaines.
  function fenetrePlanning() {
    const d = (mois) => { const x = new Date(); x.setMonth(x.getMonth() + mois); return x.toISOString().split('T')[0] }
    return { from: d(-12), to: d(12) }
  }

  async function loadPlanning() {
    const { from, to } = fenetrePlanning()
    let res
    try {
      // ⚠ `enteteCompte()` : sans lui, le serveur lit le compte de l'APPELANT
      // alors que les notes juste a cote sont lues sur le compte courant — le
      // membre voyait un planning vide a cote de commentaires bien presents.
      res = await fetch(`/api/menages?from=${from}&to=${to}`, {
        headers: { 'Authorization': `Bearer ${currentSession.access_token}`, ...enteteCompte() }
      })
    } catch (e) {
      return planningEnErreur('Connexion impossible. Vérifiez votre réseau.')
    }

    // Un echec silencieux afficherait un planning VIDE, indiscernable de
    // « aucune reservation » — exactement le symptome que ce module corrige.
    if (res.status === 401) {
      return planningEnErreur('Session expirée. <a href="/login">Se reconnecter</a>')
    }
    if (!res.ok) {
      console.error('[menages] chargement planning echec', res.status)
      return planningEnErreur('Impossible de charger le planning. Réessayez dans un instant.')
    }

    const data = await res.json()
    properties = data.properties || []
    bookings = data.bookings || []
    // Qui fait quoi (spec §11.6). Indexe par l'IDENTITE du menage — la meme que
    // menage_done et que la file hors ligne de la PWA.
    assignations = {}
    ;(data.menages || []).forEach(m => {
      assignations[`${m.property_id}|${m.booking_id}|${m.departure_date}`] = m
    })
    prestataires = data.prestataires || []
    activeProps = new Set(properties.map(p => p.id))
    if (data.tronque) console.warn('[menages] planning tronque : fenetre trop large')
  }

  // Etat d'erreur explicite : on ne laisse jamais croire a un planning vide.
  let planningErreur = null
  function planningEnErreur(message) {
    planningErreur = message
    properties = []
    bookings = []
    const grid = document.getElementById('week-grid')
    if (grid) grid.innerHTML = `<div style="grid-column:span 7;text-align:center;padding:40px;color:var(--danger,#c0392b)">
      ⚠️ ${message}</div>`
  }

  async function loadComments() {
    const { data } = await supabase
      .from('menage_comments')
      .select('*')
      .eq('user_id', compteCourant())
    ;(data || []).forEach(c => { commentsMap[`${c.booking_id}-${c.departure_date}`] = c.comment })
  }

  async function saveComment() {
  if (!selectedMenage) return
  const comment = document.getElementById('modal-comment').value.trim()
  const key = `${selectedMenage.bookId}-${selectedMenage.departure}`

  const { error } = await supabase.from('menage_comments').upsert({
    // ⚠ Le COMPTE, pas l'appelant : un commentaire ecrit par un membre appartient
    // au compte de l'hote, sinon il serait invisible a tout le monde — et la RLS
    // le refuserait de toute facon (can_write sur le compte cible).
    user_id:        compteCourant(),
    booking_id:     String(selectedMenage.bookId),
    departure_date: selectedMenage.departure,
    property_id:    String(selectedMenage.propId),
    comment,
    updated_at:     new Date().toISOString()
  }, { onConflict: 'user_id,booking_id,departure_date' })

  if (!error) {
    commentsMap[key] = comment

    // Créer événement fil d'actualités pour tous les tokens du bien
    // ⚠ `public_tokens` est sous `can_read(user_id, 'prestataires')`, PAS
    // `menages` : un membre `menages: write` / `prestataires: none` enregistre
    // bien sa note, mais ne peut pas lire les jetons — donc aucun evenement n'est
    // cree et le prestataire ne recoit JAMAIS la note, pendant que l'interface
    // affiche « enregistre ». On distingue les deux.
    const { data: tokens, error: eTokens } = await supabase
      .from('public_tokens')
      .select('token, property_ids')
      .eq('user_id', compteCourant())

    const relevantTokens = (tokens || []).filter(t =>
      !t.property_ids?.length || t.property_ids.includes(String(selectedMenage.propId))
    )

    for (const t of relevantTokens) {
      await supabase.from('menage_events').insert({
        user_id:       compteCourant(),
        booking_id:    String(selectedMenage.bookId),
        property_id:   String(selectedMenage.propId),
        property_name: selectedMenage.propName,
        event_type:    'note',
        event_data: {
          guestName:  selectedMenage.guestName,
          arrival:    selectedMenage.arrival,
          departure:  selectedMenage.departure,
          comment:    comment
        },
        token: t.token
      })
    }

    const avis = document.getElementById('comment-saved')
    // La note est bien enregistree ; ce qui peut manquer, c'est sa transmission
    // au prestataire. Le dire plutot que d'afficher un succes complet.
    avis.textContent = eTokens
      ? '✅ Note enregistrée — non transmise au prestataire (droit « Prestataires » requis)'
      : '✅ Note enregistrée'
    avis.style.display = 'block'
    setTimeout(() => { avis.style.display = 'none' }, eTokens ? 5000 : 2000)
    renderWeek()
    renderMiniCal()
  }
}

  function getMenages() {
    const menages = []
    for (const b of bookings) {
      if (!activeProps.has(b.propId)) continue
      if (!b.departure) continue
      const dep = new Date(b.departure)
      const propIdx = properties.findIndex(p => p.id === b.propId)
      const id = `${b.id}-${b.departure}`
      const commentKey = `${b.id}-${b.departure}`
      const assign = assignations[`${b.propId}|${b.id}|${b.departure}`] || null
      menages.push({
        id,
        assign,
        date: dep,
        dateStr: b.departure,
        propId: b.propId,
        propName: b.propName,
        propIdx,
        guestName: b.firstName ? `${b.firstName} ${b.lastName || ''}`.trim() : 'Voyageur',
        arrival: b.arrival,
        departure: b.departure,
        numAdult: b.numAdult || 0,
        numChild: b.numChild || 0,
        bookId: b.id,
        done: doneSet.has(id),
        comment: commentsMap[commentKey] || ''
      })
    }
    return menages
  }

  function renderFilters() {
    const list = document.getElementById('filter-list')
    list.innerHTML = properties.map((p, i) => `
      <div class="filter-item">
        <input type="checkbox" id="filter-${p.id}" ${activeProps.has(p.id) ? 'checked' : ''}>
        <div class="filter-dot" style="background:${getDotColor(i)}"></div>
        <label class="filter-label" for="filter-${p.id}">${p.name}</label>
      </div>
    `).join('')
    properties.forEach(p => {
      document.getElementById(`filter-${p.id}`).addEventListener('change', (e) => {
        if (e.target.checked) activeProps.add(p.id)
        else activeProps.delete(p.id)
        renderWeek(); renderMiniCal()
      })
    })
  }

  function renderWeek() {
    // Le message d'erreur prime sur un rendu vide trompeur.
    if (planningErreur) return
    const today = new Date()
    today.setHours(0,0,0,0)
    const weekEnd = addDays(currentWeekStart, 6)
    const menages = getMenages()

    document.getElementById('week-label').textContent = `${formatDate(currentWeekStart)} — ${formatDate(weekEnd)}`

    const weekMenages = menages.filter(m => m.date >= currentWeekStart && m.date <= weekEnd)
    const done = weekMenages.filter(m => m.done).length
    document.getElementById('week-stats').innerHTML = `
      <div class="week-stat"><strong>${weekMenages.length}</strong>ménages cette semaine</div>
      <div class="week-stat"><strong>${done}</strong>effectués</div>
      <div class="week-stat"><strong>${weekMenages.length - done}</strong>restants</div>
    `

    const grid = document.getElementById('week-grid')
    grid.innerHTML = ''

    for (let i = 0; i < 7; i++) {
      const day = addDays(currentWeekStart, i)
      day.setHours(0,0,0,0)
      const isToday = day.getTime() === today.getTime()

      const dayMenages = menages.filter(m => {
        const md = new Date(m.date); md.setHours(0,0,0,0)
        return md.getTime() === day.getTime()
      })

      const col = document.createElement('div')
      col.className = `day-col${isToday ? ' today' : ''}`
      col.innerHTML = `
        <div class="day-header">
          <div class="day-name">${JOURS[i]}</div>
          <div class="day-number">${day.getDate()}</div>
        </div>
        <div class="day-body">
          ${dayMenages.length === 0 ? '<div class="day-empty">—</div>' :
            dayMenages.map(m => `
              <div class="menage-card ${PROP_COLORS[m.propIdx % 4]} ${m.done ? 'done' : ''}" data-id="${m.id}" style="cursor:pointer">
                <div class="menage-card-prop">${m.propName}</div>
                <div class="menage-card-title">Ménage départ</div>
                <div class="menage-card-time">${m.guestName}</div>
                ${pastillePrestataire(m)}
                ${m.done ? '<div class="menage-card-check">✓</div>' : ''}
                ${m.comment ? '<div class="menage-card-comment">📝</div>' : ''}
              </div>
            `).join('')
          }
        </div>
      `
      grid.appendChild(col)
    }

    grid.querySelectorAll('.menage-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.id
        selectedMenage = menages.find(m => m.id === id)
        openModal(selectedMenage)
      })
    })
  }

  function renderMiniCal() {
    const menages = getMenages()
    const menageDates = new Map()
    menages.forEach(m => {
      if (!menageDates.has(m.dateStr)) menageDates.set(m.dateStr, [])
      menageDates.get(m.dateStr).push(m)
    })

    document.getElementById('mini-cal-title').textContent = `${MOIS[miniCalDate.getMonth()]} ${miniCalDate.getFullYear()}`

    const grid = document.getElementById('mini-cal-grid')
    const headers = Array.from(grid.children).slice(0, 7)
    grid.innerHTML = ''
    headers.forEach(h => grid.appendChild(h))

    const firstDay = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth(), 1)
    const lastDay = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() + 1, 0)
    const today = new Date(); today.setHours(0,0,0,0)

    let startOffset = (firstDay.getDay() + 6) % 7
    for (let i = 0; i < startOffset; i++) {
      const prev = new Date(firstDay); prev.setDate(prev.getDate() - (startOffset - i))
      const d = document.createElement('div')
      d.className = 'mini-cal-day other-month'
      d.textContent = prev.getDate()
      grid.appendChild(d)
    }

    for (let d = 1; d <= lastDay.getDate(); d++) {
      const date = new Date(miniCalDate.getFullYear(), miniCalDate.getMonth(), d)
      date.setHours(0,0,0,0)
      const dateStr = toDateStr(date)
      const dayMenages = menageDates.get(dateStr) || []
      const hasMenage = dayMenages.length > 0
      const isDone = hasMenage && dayMenages.every(m => m.done)
      const isToday = date.getTime() === today.getTime()
      const weekEnd = addDays(currentWeekStart, 6)
      const inWeek = date >= currentWeekStart && date <= weekEnd

      const el = document.createElement('div')
      el.className = ['mini-cal-day', isToday ? 'today' : '', hasMenage && !isToday ? (isDone ? 'has-menage done' : 'has-menage') : '', inWeek && !isToday ? 'selected-week' : ''].filter(Boolean).join(' ')
      el.textContent = d

      // Tooltip avec infos ménages
      if (hasMenage) {
        const tooltipContent = dayMenages.map(m => `${m.propName} · ${m.guestName}`).join('\n')
        const tooltip = document.createElement('div')
        tooltip.className = 'cal-tooltip'
        tooltip.textContent = tooltipContent
        el.appendChild(tooltip)
      }

      el.addEventListener('click', () => { currentWeekStart = getMonday(date); renderWeek(); renderMiniCal() })
      grid.appendChild(el)
    }
  }

  function echapper(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
  }

  function prenomDe(providerId) {
    const p = prestataires.find(x => x.id === providerId)
    return p ? p.prenom : null
  }

  // ⚠ TROIS ETATS DISTINCTS, et ils ne disent pas la meme chose :
  //   - pas d'assignation connue  -> rien du tout. Le lot 2.1 vient d'arriver et
  //     un menage peut n'avoir aucune ligne : afficher « personne » serait faux.
  //   - assigne et accepte        -> le prenom.
  //   - propose et pas confirme   -> le prenom en pointilles. Un suppleant qui
  //     n'a pas repondu n'est PAS un menage couvert, et le planning doit le dire.
  //   - assignation vide          -> « personne », en clair. C'est une alerte
  //     visuelle, pas un blanc qu'on prend pour un chargement en cours.
  function pastillePrestataire(m) {
    if (!m.assign) return ''
    const prenom = prenomDe(m.assign.provider_id)
    // ⚠ UN REFUS N'EST PAS UN « PERSONNE » ORDINAIRE : quelqu'un a dit non, et
    // rien ne le reprendra tout seul. Les confondre laissait l'hote sans savoir
    // qu'il doit agir.
    const proposeAOrph = m.assign.offered_to ? prenomDe(m.assign.offered_to) : null
    if (m.assign.status === 'orphaned' && !proposeAOrph) {
      // ⚠ « refusé » n'est plus exact : un `orphaned` peut aussi venir d'une
      // proposition EXPIREE. Et s'il est re-propose, la pastille masquait la
      // proposition alors que la modale, elle, l'affichait — deux endroits de la
      // meme page qui se contredisaient.
      return `<div class="presta-pastille refus" title="${echapper(m.assign.assignment_reason || '')}">⚠ personne</div>`
    }
    // ⚠ LA PROPOSITION NE REMPLACE PAS LE PORTEUR (regle du 4 septembre).
    // La pastille dit d'abord QUI le porte ; la proposition en cours s'ajoute a
    // cote, en pointilles. Afficher la sollicitee a la place de la porteuse
    // laissait croire que le menage avait change de mains alors que personne
    // n'avait accepte.
    const proposeA = m.assign.offered_to ? prenomDe(m.assign.offered_to) : null
    const mention = proposeA
      ? `<div class="presta-pastille offert">⏳ proposé à ${echapper(proposeA)}</div>`
      : ''
    if (!m.assign.provider_id) {
      return mention || '<div class="presta-pastille vide">personne</div>'
    }
    if (!prenom) return mention   // profil inconnu : on n'invente pas de nom
    return `<div class="presta-pastille">👤 ${echapper(prenom)}</div>${mention}`
  }

  function openModal(m) {
    document.getElementById('modal-title').textContent = `Ménage — ${m.propName}`
    document.getElementById('modal-sub').textContent = formatDate(m.date)
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-row"><span>Voyageur</span><span>${m.guestName}</span></div>
      <div class="modal-row"><span>Adultes</span><span>${m.numAdult || '—'}</span></div>
      <div class="modal-row"><span>Enfants</span><span>${m.numChild > 0 ? m.numChild + ' enfant(s) 👶' : 'Aucun'}</span></div>
      <div class="modal-row"><span>Arrivée</span><span>${m.arrival || '—'}</span></div>
      <div class="modal-row"><span>Départ</span><span>${m.departure || '—'}</span></div>
      <div class="modal-row"><span>Statut</span><span>${m.done ? '✅ Effectué' : '⏳ À faire'}</span></div>
      ${blocPrestataire(m)}
    `
    brancherSelecteurPrestataire(m)
    document.getElementById('modal-comment').value = m.comment || ''
    document.getElementById('comment-saved').style.display = 'none'

    // Le bouton a pu etre retire (lecture seule) : ne pas le supposer present.
    const btn = document.getElementById('modal-done')
    if (btn) {
      btn.textContent = m.done ? '↩ Marquer non fait' : '✓ Marquer fait'
      btn.className = m.done ? 'btn' : 'btn btn-primary'
    }
    document.getElementById('modal').style.display = 'flex'
  }

  // Le selecteur n'apparait QUE si le menage existe en base et qu'il y a au
  // moins une prestataire active a proposer : offrir un <select> vide serait une
  // promesse en l'air.
  function blocPrestataire(m) {
    if (!m.assign) return ''
    const actifs = prestataires.filter(p => p.actif)
    if (!actifs.length) return ''
    const options = ['<option value="">— personne —</option>'].concat(
      actifs.map(p => `<option value="${echapper(p.id)}"${p.id === m.assign.provider_id ? ' selected' : ''}>${echapper(p.prenom)}</option>`)
    ).join('')
    const proposeA = m.assign.offered_to ? prenomDe(m.assign.offered_to) : null
    const verrou = proposeA
      ? `Proposé à ${proposeA} — le ménage reste chez son porteur tant que personne n'a accepté.`
      : (m.assign.assigned_by === 'manual'
          ? 'Affectation manuelle : l\'automate n\'y touchera plus.'
          : '')
    // ⚠ DEUX GESTES DISTINCTS, et l'hote choisit en connaissance.
    //   « Proposer » — elle confirme. Le menage RESTE chez son porteur jusque-la.
    //   « Assigner »  — transfert immediat, sans confirmation, notification a la
    //     cle. C'est le geste d'urgence : quelqu'un se decommande a deux heures
    //     du depart. Aucune limite de delai.
    // La proposition reste le geste par defaut quand le temps le permet :
    // engager quelqu'un sans son accord doit rester un choix explicite.
    return `<div class="presta-ligne"><span style="font-size:13px">Qui le fait</span>
              <select id="modal-presta">${options}</select></div>
            <div class="presta-gestes" id="presta-gestes">
              <button class="btn" id="btn-proposer">Proposer <small>(elle confirme)</small></button>
              <button class="btn" id="btn-assigner">Assigner <small>(immédiat)</small></button>
            </div>
            <div class="presta-etat" id="presta-etat">${echapper(verrou)}</div>`
  }

  function brancherSelecteurPrestataire(m) {
    const sel = document.getElementById('modal-presta')
    if (!sel) return
    const bProp = document.getElementById('btn-proposer')
    const bAff = document.getElementById('btn-assigner')

    // ⚠ Le choix dans la liste ne DECLENCHE plus rien : c'est le bouton qui dit
    // ce qu'on veut faire. Un `change` seul ne pouvait pas exprimer les deux
    // gestes, et re-choisir la personne deja selectionnee n'emettait rien du
    // tout — le retrait d'une proposition etait donc impossible.
    const majBoutons = () => {
      const memeQuePorteur = sel.value && sel.value === (m.assign.provider_id || '')
      if (bProp) {
        bProp.disabled = !sel.value || memeQuePorteur
        bProp.style.display = memeQuePorteur && m.assign.offered_to ? 'none' : ''
      }
      if (bAff) {
        bAff.textContent = ''
        bAff.insertAdjacentHTML('afterbegin', memeQuePorteur && m.assign.offered_to
          ? 'Retirer la proposition<small>le ménage lui reste</small>'
          : (sel.value ? 'Assigner<small>(immédiat)</small>' : 'Retirer<small>(personne)</small>'))
      }
    }
    sel.addEventListener('change', majBoutons)
    majBoutons()

    const envoyer = async (geste) => {
      const etat = document.getElementById('presta-etat')
      const choix = sel.value || null
      sel.disabled = true
      if (bProp) bProp.disabled = true
      if (bAff) bAff.disabled = true
      if (etat) etat.textContent = 'Enregistrement…'
      try {
        const res = await fetch('/api/menages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json',
                     'Authorization': `Bearer ${currentSession.access_token}`, ...enteteCompte() },
          body: JSON.stringify({
            property_id: m.propId, booking_id: m.bookId,
            departure_date: m.departure, provider_id: choix, mode: geste })
        })
        const data = await res.json().catch(() => null)
        if (!res.ok) {
          // ⚠ On DIT pourquoi. Un select qui revient en arriere sans un mot
          // laisse croire a un bug ; le motif le plus frequent est un droit
          // manquant (« Prestataires » en ecriture).
          // ⚠ Et quand c'est « trop tard pour proposer », le serveur dit que
          // l'assignation directe reste possible : on ne laisse pas l'hote
          // devant une impasse a deux heures du depart.
          if (etat) etat.textContent = (data && data.error) || 'Réassignation impossible.'
          if (data && data.assigner_possible && bAff) bAff.disabled = false
          else sel.value = m.assign.provider_id || ''
          return
        }
        // La verite affichee vient du SERVEUR, pas de ce qu'on croyait demander :
        // c'est lui qui decide si la personne est engagee ou seulement sollicitee.
        // ⚠ La verite vient du SERVEUR : c'est lui qui decide si la personne
        // PORTE le menage ou si elle est seulement sollicitee.
        m.assign.provider_id = data.provider_id
        m.assign.status = data.status
        m.assign.offered_to = data.offered_to || null
        m.assign.assigned_by = data.offered_to ? m.assign.assigned_by : (data.provider_id ? 'manual' : null)
        assignations[`${m.propId}|${m.bookId}|${m.departure}`] = m.assign
        if (etat) {
          // ⚠ On dit ce qui est REELLEMENT parti, pas ce qu'on esperait envoyer.
          const canal = data.notifiee && (data.notifiee.sms || data.notifiee.email)
            ? ' Elle a été prévenue.'
            : (data.assignee ? ' (aucune notification n\'a pu partir)' : '')
          etat.textContent = data.retiree
            ? `Proposition retirée — le ménage reste à ${data.prenom}.`
            : (data.offered_to
                ? `Proposé à ${data.prenom} — le ménage reste chez son porteur jusqu'à acceptation.`
                : (data.provider_id ? `Assigné à ${data.prenom}.${canal}` : 'Ménage laissé sans prestataire.'))
        }
        routeRenderSafe()
      } catch (err) {
        if (etat) etat.textContent = 'Connexion impossible. Réessayez.'
        sel.value = m.assign.provider_id || ''
      } finally {
        sel.disabled = false
        majBoutons()
      }
    }

    if (bProp) bProp.addEventListener('click', () => envoyer('proposer'))
    if (bAff) bAff.addEventListener('click', () => envoyer('assigner'))
  }

  // Le planning se re-rend apres une reassignation, sans supposer quelle vue
  // est active — l'ecran hote n'a qu'une vue semaine aujourd'hui.
  function routeRenderSafe() {
    try { renderWeek(); renderMiniCal() } catch (e) { console.warn('[menages] re-rendu', e) }
  }

  function closeModal() { document.getElementById('modal').style.display = 'none'; selectedMenage = null }

  // ⚠ DEFAUT CONNU, INDEPENDANT DE LA DELEGATION : ce marquage ne vit que dans le
  // localStorage DE CE NAVIGATEUR. Il n'ecrit pas `menage_done`, que la PWA
  // prestataire alimente pourtant (117 lignes en prod via api/menages-public).
  // Consequences : un menage marque fait par le prestataire n'apparait pas ici,
  // l'hote ne retrouve pas ses marquages sur un autre appareil, et rien n'est
  // partage dans l'equipe. A brancher sur `menage_done` — chantier a part, note
  // dans docs/kb/menage.md.
  function markDone() {
    if (!selectedMenage) return
    if (doneSet.has(selectedMenage.id)) doneSet.delete(selectedMenage.id)
    else doneSet.add(selectedMenage.id)
    saveDoneSet(); closeModal(); renderWeek(); renderMiniCal()
  }

  function loadDoneSet() { const raw = localStorage.getItem('menages-done'); if (raw) doneSet = new Set(JSON.parse(raw)) }
  function saveDoneSet() { localStorage.setItem('menages-done', JSON.stringify([...doneSet])) }

  function getMonday(date) { const d = new Date(date); d.setHours(0,0,0,0); const day = d.getDay(); d.setDate(d.getDate() + ((day === 0) ? -6 : 1 - day)); return d }
  function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d }
  function formatDate(date) { return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) }
  function toDateStr(date) { return date.toISOString().split('T')[0] }
  function getDotColor(i) { return ['#3B82F6', '#10B981', '#F59E0B', '#EC4899'][i % 4] }

  init()
</script>
