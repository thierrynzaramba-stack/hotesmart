<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « SERRURES CONNECTÉES » — intégrée au socle V5 le 15 novembre 2026
     (docs/specs/spec-integration-v5-lot-1.md). La FORME change, pas le fond :
     mêmes appels (/api/serrures), mêmes gestes, mêmes messages ; l'inventaire
     de la spec dit où chaque chose est passée.
     RÈGLES V5 : aucun hexa, aucun texte en dur, aucune icône dessinée ici. -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page out">
  <div class="out-tete">
    <div class="out-tete__titre">
      <h1 class="h1" data-i18n="serrures.titre"></h1>
      <p class="out-sous" id="topStatus" data-i18n="serrures.statut_chargement"></p>
    </div>
  </div>

  <div class="seg out-onglets" role="tablist" data-i18n-attr="aria-label:outil.onglets">
    <button type="button" class="seg__btn is-on" role="tab" aria-selected="true" data-onglet="config" data-i18n="outil.onglet_config"></button>
    <button type="button" class="seg__btn" role="tab" aria-selected="false" data-onglet="locks" data-i18n="serrures.onglet_serrures"></button>
  </div>

  <!-- Configuration -->
  <section class="out-carte out-carte--etroite" id="tab-config" data-panneau="config" aria-labelledby="h-statut">
    <h2 class="out-carte__titre" id="h-statut"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-link"/></svg><span data-i18n="serrures.carte_statut"></span></h2>

    <div class="out-bandeau" id="statusBanner"><span id="statusText" data-i18n="outil.non_configure"></span></div>

    <div class="out-note">
      <p><b data-i18n="serrures.aide_titre"></b></p>
      <ol>
        <li data-riche="serrures.aide_1" data-lien-seam="https://console.seam.co"></li>
        <li data-riche="serrures.aide_2"></li>
        <li data-riche="serrures.aide_3"></li>
        <li data-riche="serrures.aide_4"></li>
      </ol>
      <p data-riche="serrures.aide_supportees"></p>
      <p data-riche="serrures.aide_tarif"></p>
    </div>

    <div class="out-champ">
      <label for="apiKey" data-i18n="serrures.cle_libelle"></label>
      <div class="out-ligne-saisie">
        <input class="out-saisie out-mono" type="password" id="apiKey" autocomplete="off" data-i18n-attr="placeholder:serrures.cle_exemple">
        <button type="button" class="btn btn--primary" data-action="enregistrer" data-i18n="outil.enregistrer"></button>
      </div>
    </div>

    <label class="out-inter">
      <span data-i18n="serrures.activer"></span>
      <input type="checkbox" class="out-sw" role="switch" id="seamEnabled">
    </label>

    <p class="out-retour" id="configToast"></p>
  </section>

  <!-- Serrures -->
  <section class="out-pile" id="tab-locks" data-panneau="locks" hidden aria-labelledby="h-serrures">
    <div class="out-carte__tete">
      <h2 class="h2" id="h-serrures" data-i18n="serrures.mes_serrures"></h2>
      <button type="button" class="btn btn--secondary" data-action="actualiser" data-i18n="outil.actualiser"></button>
    </div>
    <div class="out-note">
      <p><b data-i18n="serrures.modes_titre"></b></p>
      <p data-riche="serrures.mode_offline"></p>
      <p data-riche="serrures.mode_connecte"></p>
    </div>
    <div id="locks-container"><p class="out-vide" data-i18n="common.loading"></p></div>
  </section>
</main>

<!-- Générer un code : une fenêtre <dialog> native, plein écran au téléphone. -->
<dialog class="out-feuille" id="modal" aria-labelledby="modal-titre">
  <div class="out-feuille__corps">
    <h2 class="h2" id="modal-titre" data-i18n="serrures.generer_titre"></h2>
    <input type="hidden" id="modal-lock-id">
    <div class="out-champ">
      <label for="modal-guest" data-i18n="serrures.voyageur"></label>
      <input class="out-saisie" id="modal-guest" data-i18n-attr="placeholder:serrures.voyageur_exemple">
    </div>
    <div class="out-champ">
      <label for="modal-start" data-i18n="serrures.debut"></label>
      <input class="out-saisie" type="datetime-local" id="modal-start">
    </div>
    <div class="out-champ">
      <label for="modal-end" data-i18n="serrures.fin"></label>
      <input class="out-saisie" type="datetime-local" id="modal-end">
    </div>
    <p class="out-retour" id="modalToast"></p>
    <div class="out-feuille__pied">
      <button type="button" class="btn btn--secondary" data-action="fermer" data-i18n="outil.annuler"></button>
      <button type="button" class="btn btn--primary" id="modal-generate" data-i18n="serrures.generer_bouton"></button>
    </div>
    <!-- Résultat -->
    <div class="out-pile" id="code-result" hidden>
      <p class="out-aide" data-i18n="serrures.code_genere"></p>
      <span class="out-code out-code--grand" id="code-pin-display"></span>
      <p class="out-aide" id="code-validity"></p>
      <button type="button" class="btn btn--primary btn--block" data-action="copier" data-i18n="serrures.copier"></button>
    </div>
  </div>
</dialog>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { exigerCompteProprePage, compteCourant, peutLire, estTitulaire, comptes, basculerVers } from '/shared/compte-courant.js'
import { requireAuth } from '/components/auth-guard.js'
import { signOut } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { renderOnboardingBanner } from '/components/onboarding-banner.js'
import { esc, afficherRetour, monterCoquille } from '/shared/page-outil.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (sel) => document.querySelector(sel)

let session = null
let dernierCode = null
const entete = () => ({ Authorization: `Bearer ${session?.access_token}` })
const enteteJson = () => ({ 'Content-Type': 'application/json', ...entete() })
const toast = (id, msg, type) => afficherRetour(document.getElementById(id), msg, type, 4000)

// ── Onglets ────────────────────────────────────────────────────────────────
function switchTab (name) {
  for (const b of document.querySelectorAll('[data-onglet]')) {
    const on = b.dataset.onglet === name
    b.classList.toggle('is-on', on)
    b.setAttribute('aria-selected', String(on))
  }
  for (const p of document.querySelectorAll('[data-panneau]')) p.hidden = p.dataset.panneau !== name
  if (name === 'locks') loadLocks()
}

// ── Config ─────────────────────────────────────────────────────────────────
async function loadConfig () {
  try {
    const res = await fetch('/api/serrures?action=config', { headers: entete() })
    const data = await res.json()
    if (data.configured) {
      $('#apiKey').value = '••••••••••••••••••••'
      $('#seamEnabled').checked = data.enabled
      updateBanner(data.enabled)
    }
  } catch {}
}

async function saveConfig () {
  const key = $('#apiKey').value.trim()
  if (!key || key.startsWith('•')) return toast('configToast', t('outil.cle_invalide'), 'erreur')
  try {
    const res = await fetch('/api/serrures', { method: 'POST', headers: enteteJson(), body: JSON.stringify({ action: 'saveConfig', apiKey: key }) })
    const data = await res.json()
    if (data.success) {
      toast('configToast', t('serrures.cle_enregistree'), 'ok')
      $('#apiKey').value = '••••••••••••••••••••'
      $('#seamEnabled').checked = true
      updateBanner(true)
    } else { toast('configToast', data.error || t('outil.erreur'), 'erreur') }
  } catch (err) { toast('configToast', err.message, 'erreur') }
}

async function toggleSeam () {
  const el = $('#seamEnabled')
  const enabled = el.checked
  // ⚠ La reponse est LUE. Sans cle enregistree le serveur refuse la bascule, et
  // la page affichait quand meme « Serrures activées » : l'hote croyait ses
  // serrures actives alors que rien n'avait change.
  const r = await fetch('/api/serrures', { method: 'POST', headers: enteteJson(), body: JSON.stringify({ action: 'toggleConfig', enabled }) })
  if (!r.ok) {
    const d = await r.json().catch(() => ({}))
    el.checked = !enabled
    return toast('configToast', d.error || t('serrures.bascule_impossible'), 'erreur')
  }
  updateBanner(enabled)
  toast('configToast', t(enabled ? 'serrures.active' : 'serrures.desactive'), 'ok')
}

function updateBanner (on) {
  $('#statusBanner').className = 'out-bandeau' + (on ? ' out-bandeau--ok' : '')
  $('#statusText').textContent = t(on ? 'serrures.bandeau_on' : 'serrures.bandeau_off')
  $('#topStatus').textContent = t(on ? 'serrures.statut_actif' : 'serrures.statut_inactif')
}

// ── Serrures ───────────────────────────────────────────────────────────────
async function loadLocks () {
  const container = $('#locks-container')
  container.innerHTML = `<p class="out-vide">${esc(t('common.loading'))}</p>`
  try {
    const res = await fetch('/api/serrures?action=locks', { headers: entete() })
    const data = await res.json()
    renderLocks(data.locks || [])
  } catch (err) {
    container.innerHTML = `<p class="out-vide out-aide--alerte">${esc(err.message)}</p>`
  }
}

// Les serrures affichées, par identifiant : les gestes (codes, suppression)
// retrouvent leur liste sans fabriquer d'id de DOM avec une donnée externe.
const serrures = new Map()

function renderLocks (locks) {
  const container = $('#locks-container')
  serrures.clear()
  if (!locks.length) {
    container.innerHTML = `<div class="out-carte out-vide">
      <svg class="icon icon--lg" aria-hidden="true"><use href="/shared/icons.svg#i-lock"/></svg>
      <h2 class="h2">${esc(t('serrures.vide_titre'))}</h2>
      <p>${esc(t('serrures.vide_texte'))}</p>
      <button type="button" class="btn btn--primary" data-action="configurer">${esc(t('serrures.configurer'))}</button>
    </div>`
    return
  }
  container.innerHTML = `<div class="out-grille">${locks.map((lock, i) => {
    const p = lock.properties || {}
    const isLocked = p.locked
    const battery = p.battery_level ? Math.round(p.battery_level * 100) : null
    // Détecte le mode offline : pas de capability 'online_access_codes'
    const caps = lock.capabilities_supported || []
    const isOffline = !caps.includes('online_access_codes')
    serrures.set(String(i), { id: lock.device_id, isOffline })
    const nom = p.name || lock.display_name || t('serrures.serrure')
    return `
      <article class="out-carte" data-offline="${isOffline}" data-serrure="${i}">
        <div class="out-carte__tete">
          <h3 class="out-carte__titre"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-lock"/></svg><span>${esc(nom)}</span></h3>
          <span class="out-etat ${isLocked ? 'out-etat--erreur' : 'out-etat--ok'}">${esc(t(isLocked ? 'serrures.verrouillee' : 'serrures.ouverte'))}</span>
        </div>
        <div class="out-actions">
          <span class="out-puce ${isOffline ? 'out-puce--attente' : 'out-puce--ok'}">${esc(t(isOffline ? 'serrures.badge_offline' : 'serrures.badge_connecte'))}</span>
        </div>
        <p class="out-ligne__sous">
          ${p.manufacturer ? esc(t('serrures.marque', { marque: p.manufacturer })) + '<br>' : ''}
          ${battery != null ? esc(t('serrures.batterie', { n: battery })) + '<br>' : ''}
          <span class="out-mono">${esc(lock.device_id)}</span>
        </p>
        <div class="out-note">
          <p><b>${esc(t(isOffline ? 'serrures.info_offline_titre' : 'serrures.info_connecte_titre'))}</b></p>
          <p>${esc(t(isOffline ? 'serrures.info_offline' : 'serrures.info_connecte'))}</p>
        </div>
        <div class="out-actions">
          <button type="button" class="btn btn--primary" data-action="generer"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-key"/></svg>${esc(t('serrures.generer'))}</button>
          <button type="button" class="btn btn--secondary" data-action="codes">${esc(t('serrures.voir_codes'))}</button>
        </div>
        <div class="out-liste" data-codes hidden></div>
      </article>`
  }).join('')}</div>`
}

async function loadCodes (carte, btn) {
  const s = serrures.get(carte.dataset.serrure)
  if (!s) return
  const list = carte.querySelector('[data-codes]')
  if (!list.hidden) {
    list.hidden = true
    btn.textContent = t('serrures.voir_codes')
    return
  }
  btn.textContent = t('common.loading')
  try {
    const res = await fetch(`/api/serrures?action=codes&lock_id=${encodeURIComponent(s.id)}`, { headers: entete() })
    const data = await res.json()
    const codes = data.codes || []
    const jour = (d) => I18n.date(new Date(d), { day: '2-digit', month: '2-digit', year: 'numeric' })
    if (!codes.length) {
      list.innerHTML = `<p class="out-aide">${esc(t('serrures.aucun_code'))}</p>`
    } else {
      list.innerHTML = codes.map(c => `
        <div class="out-ligne">
          <div class="out-ligne__corps">
            <span class="out-ligne__titre">${esc(c.name || t('serrures.code_defaut'))}</span>
            <span class="out-code">${esc(c.code || '——')}</span>
            <span class="out-ligne__sous">${c.starts_at ? esc(t('serrures.du', { date: jour(c.starts_at) })) : ''}${c.ends_at ? ' ' + esc(t('serrures.au', { date: jour(c.ends_at) })) : ''}</span>
          </div>
          ${s.isOffline || c.is_offline_access_code
            ? `<button type="button" class="btn btn--secondary" disabled title="${esc(t('serrures.immuable'))}" aria-label="${esc(t('serrures.immuable'))}">${esc(t('serrures.supprimer'))}</button>`
            : `<button type="button" class="btn btn--secondary" data-action="supprimer" data-code="${esc(c.access_code_id)}">${esc(t('serrures.supprimer'))}</button>`}
        </div>`).join('')
    }
    list.hidden = false
    btn.textContent = t('serrures.masquer_codes')
  } catch (err) {
    list.innerHTML = `<p class="out-aide out-aide--alerte">${esc(t('serrures.erreur', { message: err.message }))}</p>`
    list.hidden = false
    btn.textContent = t('serrures.voir_codes')
  }
}

async function deleteCode (codeId, carte) {
  if (!confirm(t('serrures.supprimer_confirmer'))) return
  try {
    await fetch('/api/serrures', { method: 'POST', headers: enteteJson(), body: JSON.stringify({ action: 'deleteCode', code_id: codeId }) })
    carte.querySelector('[data-codes]').hidden = true
  } catch {}
}

// ── Fenêtre « Générer un code » ────────────────────────────────────────────
function openModal (lockId) {
  $('#modal-lock-id').value = lockId
  $('#modal-guest').value = ''
  $('#code-result').hidden = true
  $('#modal-generate').hidden = false

  // Dates par défaut : aujourd'hui → dans 7 jours
  const now = new Date()
  const end = new Date(now)
  end.setDate(end.getDate() + 7)
  $('#modal-start').value = toDateTimeLocal(now)
  $('#modal-end').value = toDateTimeLocal(end)

  $('#modal').showModal()
}

function closeModal () { $('#modal').close() }

async function generateCode () {
  const lockId = $('#modal-lock-id').value
  const guestName = $('#modal-guest').value.trim() || t('serrures.voyageur_defaut')
  const startsAt = new Date($('#modal-start').value).toISOString()
  const endsAt = new Date($('#modal-end').value).toISOString()

  const btn = $('#modal-generate')
  btn.textContent = t('serrures.generation')
  btn.disabled = true

  try {
    const res = await fetch('/api/serrures', { method: 'POST', headers: enteteJson(), body: JSON.stringify({ action: 'generateCode', lock_id: lockId, guest_name: guestName, starts_at: startsAt, ends_at: endsAt }) })
    const data = await res.json()

    if (data.success && data.code) {
      const jour = (d) => I18n.date(new Date(d), { day: '2-digit', month: '2-digit', year: 'numeric' })
      $('#code-pin-display').textContent = data.code.code
      $('#code-validity').textContent = t('serrures.validite', { debut: jour(data.code.starts_at), fin: jour(data.code.ends_at) })
      $('#code-result').hidden = false
      btn.hidden = true
      dernierCode = data.code.code
    } else {
      toast('modalToast', data.error || t('outil.erreur'), 'erreur')
      btn.textContent = t('serrures.generer_bouton')
      btn.disabled = false
    }
  } catch (err) {
    toast('modalToast', err.message, 'erreur')
    btn.textContent = t('serrures.generer_bouton')
    btn.disabled = false
  }
}

function copyCode () {
  if (dernierCode) {
    navigator.clipboard.writeText(dernierCode)
    toast('modalToast', t('serrures.copie'), 'ok')
  }
}

function toDateTimeLocal (date) {
  return date.toISOString().slice(0, 16)
}

function brancher () {
  for (const b of document.querySelectorAll('[data-onglet]')) b.addEventListener('click', () => switchTab(b.dataset.onglet))
  $('[data-action="enregistrer"]').addEventListener('click', saveConfig)
  $('#seamEnabled').addEventListener('change', toggleSeam)
  $('[data-action="actualiser"]').addEventListener('click', loadLocks)
  $('#modal-generate').addEventListener('click', generateCode)
  $('[data-action="fermer"]').addEventListener('click', closeModal)
  $('[data-action="copier"]').addEventListener('click', copyCode)
  $('#locks-container').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-action]')
    if (!b) return
    if (b.dataset.action === 'configurer') return switchTab('config')
    const carte = b.closest('[data-serrure]')
    if (!carte) return
    const s = serrures.get(carte.dataset.serrure)
    if (b.dataset.action === 'generer' && s) openModal(s.id)
    else if (b.dataset.action === 'codes') loadCodes(carte, b)
    else if (b.dataset.action === 'supprimer') deleteCode(b.dataset.code, carte)
  })
}

async function init () {
  await I18n.init()
  // ⚠ PAGE NON DELEGABLE : elle montre les donnees de la personne connectee,
  // pas celles du compte sur lequel on travaille. Sans ce garde-fou, elle
  // s'ouvrait par URL directe en mode basculé et affichait un contresens.
  await exigerCompteProprePage({ nomPage: t('serrures.titre') })
  session = await requireAuth()
  if (!session) return
  document.addEventListener('i18n:changed', () => location.reload())
  monterCoquille({
    HSNav, I18n, session,
    compte: { comptes, compteCourant, basculerVers, estTitulaire, peutLire },
    deconnexion: () => signOut()
  })
  brancher()
  await loadConfig()
  // Le bandeau d'incitation que l'ancienne barre latérale posait : gardé
  // (spec §3.1 et §8), sans attente, après le rendu.
  renderOnboardingBanner().catch(() => {})
}

init().catch(e => console.error('[serrures]', e))
</script>
</body>
</html>
