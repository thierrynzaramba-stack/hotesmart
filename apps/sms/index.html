<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « SMS » — intégrée au socle V5 le 15 novembre 2026
     (docs/specs/spec-integration-v5-lot-1.md). La FORME change, pas le fond :
     mêmes appels (/api/sms), mêmes gestes, mêmes messages.
     RÈGLES V5 : aucun hexa, aucun texte en dur, aucune icône dessinée ici. -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page out">
  <div class="out-tete">
    <div class="out-tete__titre">
      <h1 class="h1" data-i18n="sms.titre"></h1>
      <p class="out-sous" id="topStatus" data-i18n="sms.statut_chargement"></p>
    </div>
  </div>

  <div class="seg out-onglets" role="tablist" data-i18n-attr="aria-label:outil.onglets">
    <button type="button" class="seg__btn is-on" role="tab" aria-selected="true" data-onglet="config" data-i18n="outil.onglet_config"></button>
    <button type="button" class="seg__btn" role="tab" aria-selected="false" data-onglet="test" data-i18n="sms.onglet_test"></button>
    <button type="button" class="seg__btn" role="tab" aria-selected="false" data-onglet="history" data-i18n="sms.onglet_historique"></button>
  </div>

  <!-- Configuration -->
  <section class="out-carte out-carte--etroite" id="tab-config" data-panneau="config" aria-labelledby="h-statut">
    <h2 class="out-carte__titre" id="h-statut"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-send"/></svg><span data-i18n="sms.carte_statut"></span></h2>

    <div class="out-bandeau" id="statusBanner"><span id="statusText" data-i18n="outil.non_configure"></span></div>

    <div class="out-note">
      <p><b data-i18n="sms.aide_titre"></b></p>
      <ol>
        <li data-riche="sms.aide_1" data-lien-brevo="https://www.brevo.com/fr/"></li>
        <li data-riche="sms.aide_2" data-lien-cles="https://app.brevo.com/settings/keys/api"></li>
        <li data-riche="sms.aide_3"></li>
        <li data-riche="sms.aide_4"></li>
        <li data-riche="sms.aide_5" data-lien-credits="https://app.brevo.com/billing/addon/customize/sms"></li>
      </ol>
    </div>

    <div class="out-champ">
      <label for="apiKey" data-i18n="sms.cle_libelle"></label>
      <div class="out-ligne-saisie">
        <input class="out-saisie out-mono" type="password" id="apiKey" autocomplete="off" data-i18n-attr="placeholder:sms.cle_exemple">
        <button type="button" class="btn btn--primary" data-action="enregistrer" data-i18n="outil.enregistrer"></button>
      </div>
    </div>

    <label class="out-inter">
      <span data-i18n="sms.activer"></span>
      <input type="checkbox" class="out-sw" role="switch" id="smsEnabled">
    </label>

    <p class="out-retour" id="configToast"></p>
  </section>

  <!-- Test & envoi -->
  <section class="out-grille out-grille--2" id="tab-test" data-panneau="test" hidden>
    <div class="out-carte" aria-labelledby="h-envoyer">
      <h2 class="out-carte__titre" id="h-envoyer"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-message"/></svg><span data-i18n="sms.envoyer_titre"></span></h2>

      <div class="out-champ">
        <label for="to" data-i18n="sms.destinataire"></label>
        <input class="out-saisie" type="tel" id="to" data-i18n-attr="placeholder:sms.destinataire_exemple">
      </div>

      <div class="out-champ">
        <label for="property_id" data-i18n="sms.bien"></label>
        <select class="out-saisie" id="property_id"></select>
      </div>

      <div class="out-champ">
        <label for="context" data-i18n="sms.contexte"></label>
        <select class="out-saisie" id="context">
          <option value="manuel" data-i18n="sms.ctx_manuel"></option>
          <option value="agent-ai" data-i18n="sms.ctx_agent"></option>
          <option value="menages" data-i18n="sms.ctx_menages"></option>
          <option value="cron" data-i18n="sms.ctx_cron"></option>
        </select>
      </div>

      <div class="out-champ">
        <span data-i18n="sms.modeles"></span>
        <div class="out-actions">
          <button type="button" class="btn btn--secondary" data-modele="checkin" data-i18n="sms.modele_checkin"></button>
          <button type="button" class="btn btn--secondary" data-modele="checkout" data-i18n="sms.modele_checkout"></button>
          <button type="button" class="btn btn--secondary" data-modele="menage" data-i18n="sms.modele_menage"></button>
          <button type="button" class="btn btn--secondary" data-modele="bienvenue" data-i18n="sms.modele_bienvenue"></button>
          <button type="button" class="btn btn--secondary" data-modele="incident" data-i18n="sms.modele_incident"></button>
        </div>
      </div>

      <div class="out-champ">
        <label for="message" data-i18n="sms.message"></label>
        <textarea id="message" rows="4" data-i18n-attr="placeholder:sms.message_exemple"></textarea>
        <span class="out-compteur num" id="charCount"></span>
      </div>

      <button type="button" class="btn btn--primary btn--block" id="sendBtn" data-i18n="sms.envoyer"></button>
      <p class="out-retour" id="sendToast"></p>
    </div>

    <div class="out-carte" aria-labelledby="h-infos">
      <h2 class="out-carte__titre" id="h-infos"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-help"/></svg><span data-i18n="sms.infos_titre"></span></h2>
      <div class="out-note">
        <p><b data-i18n="sms.infos_1"></b></p>
        <p data-riche="sms.infos_2"></p>
        <p data-riche="sms.infos_3"></p>
        <p data-riche="sms.infos_4"></p>
        <p data-riche="sms.infos_5"></p>
        <p data-riche="sms.infos_6"></p>
      </div>
    </div>
  </section>

  <!-- Historique -->
  <section class="out-carte" id="tab-history" data-panneau="history" hidden aria-labelledby="h-historique">
    <div class="out-carte__tete">
      <h2 class="out-carte__titre" id="h-historique"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-scheduled"/></svg><span data-i18n="sms.historique_titre"></span></h2>
      <button type="button" class="btn btn--secondary" data-action="actualiser" data-i18n="outil.actualiser"></button>
    </div>

    <div class="out-chiffres">
      <div class="out-chiffre"><b id="statTotal">—</b><span data-i18n="sms.total"></span></div>
      <div class="out-chiffre"><b id="statSuccess">—</b><span data-i18n="sms.reussis"></span></div>
      <div class="out-chiffre out-chiffre--alerte"><b id="statError">—</b><span data-i18n="sms.erreurs"></span></div>
    </div>

    <div class="out-champ">
      <label for="filterProperty" class="sr-only" data-i18n="sms.filtre"></label>
      <select class="out-saisie" id="filterProperty"></select>
    </div>

    <div class="out-liste out-defile" id="smsList"><p class="out-vide" data-i18n="common.loading"></p></div>
  </section>
</main>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { exigerCompteProprePage, compteCourant, peutLire, estTitulaire, comptes, basculerVers } from '/shared/compte-courant.js'
import { requireAuth } from '/components/auth-guard.js'
import { signOut } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { renderOnboardingBanner } from '/components/onboarding-banner.js'
import { esc, afficherRetour, monterCoquille } from '/shared/page-outil.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (sel) => document.querySelector(sel)

let session = null
const entete = () => ({ Authorization: `Bearer ${session?.access_token}` })
const enteteJson = () => ({ 'Content-Type': 'application/json', ...entete() })
const toast = (id, msg, type) => afficherRetour(document.getElementById(id), msg, type, 4000)

// ⚠ LA LISTE DES BIENS EST ÉCRITE EN DUR, ET C'ÉTAIT DÉJÀ LE CAS : les deux
// biens de Thierry, pour l'envoi comme pour le filtre de l'historique. Gardée
// telle quelle à l'intégration V5 (la page ne doit pas changer ce qu'elle
// fait) ; la brancher sur les biens du compte est une décision produit
// (spec-integration-v5-lot-1.md §8, point 5). Ce sont des NOMS PROPRES, pas
// du texte d'interface : ils ne se traduisent pas.
const BIENS = [
  { id: '169567', nom: 'Cœur de vie 23' },
  { id: '209413', nom: 'La bulle' }
]
const nomDuBien = (id) => (BIENS.find(b => b.id === String(id)) || {}).nom || ''

function remplirBiens () {
  const options = BIENS.map(b => `<option value="${esc(b.id)}">${esc(b.nom)}</option>`).join('')
  $('#property_id').innerHTML = `<option value="">${esc(t('sms.aucun'))}</option>${options}`
  $('#filterProperty').innerHTML = `<option value="">${esc(t('sms.tous_biens'))}</option>${options}`
}

// ── Onglets ────────────────────────────────────────────────────────────────
function switchTab (name) {
  for (const b of document.querySelectorAll('[data-onglet]')) {
    const on = b.dataset.onglet === name
    b.classList.toggle('is-on', on)
    b.setAttribute('aria-selected', String(on))
  }
  for (const p of document.querySelectorAll('[data-panneau]')) p.hidden = p.dataset.panneau !== name
  if (name === 'history') loadHistory()
}

// ── Config ─────────────────────────────────────────────────────────────────
async function loadConfig () {
  try {
    const res = await fetch('/api/sms?action=config', { headers: entete() })
    const data = await res.json()
    if (data.configured) {
      $('#apiKey').value = '••••••••••••••••••••••••'
      $('#smsEnabled').checked = data.enabled
      updateBanner(data.enabled)
    }
  } catch {}
}

async function saveConfig () {
  const key = $('#apiKey').value.trim()
  if (!key || key.startsWith('•')) return toast('configToast', t('outil.cle_invalide'), 'erreur')
  try {
    const res = await fetch('/api/sms', { method: 'POST', headers: enteteJson(), body: JSON.stringify({ action: 'saveConfig', apiKey: key }) })
    const data = await res.json()
    if (data.success) {
      toast('configToast', t('sms.cle_enregistree'), 'ok')
      $('#apiKey').value = '••••••••••••••••••••••••'
      $('#smsEnabled').checked = true
      updateBanner(true)
    } else {
      toast('configToast', data.error || t('outil.erreur'), 'erreur')
    }
  } catch (err) { toast('configToast', err.message, 'erreur') }
}

// ⚠ LA RÉPONSE N'EST PAS LUE, ET C'ÉTAIT DÉJÀ LE CAS : défaut d'origine relevé
// à l'intégration V5 et NON corrigé (la consigne est de ne pas changer ce que
// fait la page) — spec-integration-v5-lot-1.md §8, point 7.
async function toggleSms () {
  const enabled = $('#smsEnabled').checked
  try {
    await fetch('/api/sms', { method: 'POST', headers: enteteJson(), body: JSON.stringify({ action: 'toggleConfig', enabled }) })
    updateBanner(enabled)
    toast('configToast', t(enabled ? 'sms.active' : 'sms.desactive'), 'ok')
  } catch {}
}

function updateBanner (on) {
  $('#statusBanner').className = 'out-bandeau' + (on ? ' out-bandeau--ok' : '')
  $('#statusText').textContent = t(on ? 'sms.bandeau_on' : 'sms.bandeau_off')
  $('#topStatus').textContent = t(on ? 'sms.statut_actif' : 'sms.statut_inactif')
}

// ── Modèles ────────────────────────────────────────────────────────────────
function useTemplate (k) {
  $('#message').value = t('sms.texte_' + k)
  updateCount()
}

function updateCount () {
  const len = $('#message').value.length
  const el = $('#charCount')
  el.textContent = t('sms.compteur', { n: len })
  el.className = 'out-compteur num' + (len > 320 ? ' out-compteur--trop' : len > 160 ? ' out-compteur--long' : '')
}

// ── Envoi ──────────────────────────────────────────────────────────────────
async function sendSms () {
  const to = $('#to').value.trim()
  const message = $('#message').value.trim()
  if (!to || !message) return toast('sendToast', t('sms.requis'), 'erreur')
  const btn = $('#sendBtn')
  btn.disabled = true; btn.textContent = t('sms.envoi')
  try {
    const res = await fetch('/api/sms', { method: 'POST', headers: enteteJson(), body: JSON.stringify({ action: 'send', to, message, property_id: $('#property_id').value || null, context: $('#context').value }) })
    const data = await res.json()
    if (data.success) {
      toast('sendToast', t('sms.envoye'), 'ok')
      $('#message').value = ''
      $('#to').value = ''
      updateCount()
    } else { toast('sendToast', data.error || t('outil.erreur'), 'erreur') }
  } catch (err) { toast('sendToast', err.message, 'erreur') } finally { btn.disabled = false; btn.textContent = t('sms.envoyer') }
}

// ── Historique ─────────────────────────────────────────────────────────────
async function loadHistory () {
  const pid = $('#filterProperty')?.value
  try {
    const res = await fetch('/api/sms?action=logs' + (pid ? `&property_id=${encodeURIComponent(pid)}` : ''), { headers: entete() })
    const data = await res.json()
    renderHistory(data.logs || [])
  } catch { $('#smsList').innerHTML = `<p class="out-vide">${esc(t('sms.erreur_chargement'))}</p>` }
}

function renderHistory (logs) {
  $('#statTotal').textContent = I18n.num(logs.length)
  $('#statSuccess').textContent = I18n.num(logs.filter(l => l.status !== 'error').length)
  $('#statError').textContent = I18n.num(logs.filter(l => l.status === 'error').length)
  if (!logs.length) { $('#smsList').innerHTML = `<p class="out-vide">${esc(t('sms.vide'))}</p>`; return }
  $('#smsList').innerHTML = logs.map(log => {
    const d = new Date(log.created_at)
    const quand = I18n.date(d, { day: '2-digit', month: '2-digit' }) + ' ' + I18n.time(d)
    const erreur = log.status === 'error'
    return `<div class="out-ligne">
      <div class="out-ligne__corps">
        <div class="out-carte__tete"><span class="out-mono out-ligne__titre">${esc(log.to_number)}</span><span class="out-ligne__sous num">${esc(quand)}</span></div>
        <span>${esc(log.message)}</span>
        <div class="out-actions">
          <span class="out-puce ${erreur ? 'out-puce--erreur' : 'out-puce--ok'}">${esc(t(erreur ? 'sms.statut_erreur' : 'sms.statut_envoye'))}</span>
          ${log.context ? `<span class="out-puce">${esc(log.context)}</span>` : ''}
          ${log.property_id ? `<span class="out-puce">${esc(nomDuBien(log.property_id))}</span>` : ''}
          ${log.error ? `<span class="out-aide out-aide--alerte">${esc(log.error)}</span>` : ''}
        </div>
      </div>
    </div>`
  }).join('')
}

function brancher () {
  for (const b of document.querySelectorAll('[data-onglet]')) b.addEventListener('click', () => switchTab(b.dataset.onglet))
  for (const b of document.querySelectorAll('[data-modele]')) b.addEventListener('click', () => useTemplate(b.dataset.modele))
  $('[data-action="enregistrer"]').addEventListener('click', saveConfig)
  $('#smsEnabled').addEventListener('change', toggleSms)
  $('#message').addEventListener('input', updateCount)
  $('#sendBtn').addEventListener('click', sendSms)
  $('[data-action="actualiser"]').addEventListener('click', loadHistory)
  $('#filterProperty').addEventListener('change', loadHistory)
}

async function init () {
  await I18n.init()
  // ⚠ PAGE NON DELEGABLE : elle montre les donnees de la personne connectee,
  // pas celles du compte sur lequel on travaille. Sans ce garde-fou, elle
  // s'ouvrait par URL directe en mode basculé et affichait un contresens.
  await exigerCompteProprePage({ nomPage: t('sms.titre') })
  session = await requireAuth()
  if (!session) return
  document.addEventListener('i18n:changed', () => location.reload())
  monterCoquille({
    HSNav, I18n, session,
    compte: { comptes, compteCourant, basculerVers, estTitulaire, peutLire },
    deconnexion: () => signOut()
  })
  remplirBiens()
  updateCount()
  brancher()
  await loadConfig()
  // Le bandeau d'incitation que l'ancienne barre latérale posait : gardé
  // (spec §3.1 et §8), sans attente, après le rendu.
  renderOnboardingBanner().catch(() => {})
}

init().catch(e => console.error('[sms]', e))
</script>
</body>
</html>
