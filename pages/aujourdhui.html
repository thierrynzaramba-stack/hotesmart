<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- ⚠ LA LANDING NE RECHAUFFE PLUS LE CDN. Avant le 20 octobre 2026, un hote
     connecte passait par `/`, qui chargeait supabase-js : la poignee de main
     jsdelivr et le cache HTTP etaient deja faits en arrivant ici. La sonde de la
     landing part maintenant AVANT tout contact avec le CDN — cette page paie
     donc le cout a froid, et elle ne decouvrait l'URL qu'apres avoir lu
     shared/supabase.js, soit un niveau d'aller-retour de plus.
     Le prechargement est sur l'URL EPINGLEE : c'est l'epinglage qui le rend sur.
     `tests/accueil-rapide.test.js` refuse qu'elle s'ecarte de shared/supabase.js
     — deux versions divergentes, ce serait deux telechargements. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « AUJOURD'HUI » — refonte UI V5, lot 1. Spec : docs/specs/spec-refonte-ui-v5.md §4.
     KB : docs/kb/aujourdhui.md (sources de chaque chiffre, et ce qui n'est PAS affiché).
     RÈGLES : aucun hexa, aucun texte en dur, aucune icône dessinée ici.
     Couleurs → theme.css · Textes → i18n/*.json · Icônes → icons.svg
     Règles de comptage → shared/aujourdhui.js (fonctions pures, testées). -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page">

  <!-- Alarme de surréservation : reprise de l'ancien accueil (pages/index.html).
       Son bouton est le SEUL moyen d'arrêter la réémission des SMS
       (spec-reservation-manuelle.md §4). Vide et invisible sans alarme. -->
  <div class="stack" data-list="alarms" hidden></div>

  <!-- 1. Titre et date — etape 1 du lot Aujourd'hui V5 (spec-aujourdhui-v5.md §9).
       L'en-tete « Bonjour {prenom} », la ligne resume comptee et le bouton
       « Ajouter un logement » sont RETIRES : decision de Thierry du 24 octobre
       2026. Le titre porte la date, en toutes lettres a droite.
       ⚠ Le compte des choses a traiter n'est pas perdu avec la ligne resume :
       il passe a cote du titre « A valider » (Q6). -->
  <div class="row" style="flex-wrap: wrap; align-items: baseline; gap: var(--gap-m)">
    <h1 class="h1" id="h-today" style="flex: 1 1 auto" data-i18n="today.title"></h1>
    <p class="muted" style="font-size: 16px" data-bind="date"></p>
  </div>

  <!-- Mobile : « À valider » devient UNE carte sombre en tête (spec §4) -->
  <a class="card card--dark only-mobile" data-bind="validate-mobile" hidden></a>

  <!-- 2 + 3. Aujourd'hui / À valider -->
  <div class="auj-duo" data-bind="today-duo">

    <section class="auj-duo__jour" aria-labelledby="h-today">
      <div data-list="events"><p class="muted" data-i18n="common.loading"></p></div>
    </section>

    <section class="stack only-desktop" style="gap: 12px" aria-labelledby="h-validate" data-bind="validate-section" hidden>
      <div class="section-head"><h2 class="h2" id="h-validate" data-i18n="validate.title"></h2><span class="muted num" data-bind="validate-count"></span></div>
      <div class="stack" style="gap: 12px" data-list="pending"></div>
      <a class="link small" href="/messages" data-i18n="validate.settings"></a>
    </section>
  </div>

  <!-- 4. Fait pour vous : seulement les tuiles COMPTÉES (voir le KB) -->
  <section class="stack" style="gap: var(--gap-m)" aria-labelledby="h-done" data-bind="done-section" hidden>
    <div class="section-head"><h2 class="h2" id="h-done" data-i18n="done.title"></h2><span class="muted" data-i18n="done.period"></span></div>
    <div class="grid-auto scroll-x" data-list="done"></div>
  </section>

  <!-- 5. Derniers avis (etape 2) — lecture seule, AUCUNE action : ni repondre,
       ni evaluer. C'est un resume ; le geste vit sur la page Avis (spec §3).
       Le bloc n'est pas dans le DOM sans le droit `avis` (spec §6). -->
  <section class="stack" style="gap: var(--gap-m)" aria-labelledby="h-reviews" data-bind="reviews-section" hidden>
    <div class="section-head">
      <h2 class="h2" id="h-reviews" data-i18n="reviews.title"></h2>
      <span class="row" style="align-items: baseline; gap: 8px" data-bind="reviews-head"></span>
      <a class="link small" href="/avis" data-i18n="reviews.all"></a>
    </div>
    <div class="grid-avis scroll-x" data-list="reviews"></div>
  </section>

  <!-- La bande « Revenus · 30 j / Note · 30 j / Occupation · 30 j » est RETIREE
       (etape 1). La note revient a l'etape 2, en tete du bloc « Derniers avis » ;
       les revenus a l'etape 4, en mois de versement. ⚠ L'occupation 30 j et les
       min/max mensuels partent dans la FICHE DU LOGEMENT, bloc Prix (Q4) : c'est
       un travail du lot Logements, et rien ne les porte tant qu'il n'est pas fait. -->

  <!-- 6. Revenus nets (etape 4) -->
  <!-- ⚠ CE BLOC REMPLACE « Vos logements », qui part en entier : les cartes de
       bien vivent sur /logements, et l'inventaire de l'etape 0 trace chaque
       element deplace ou retire AVEC SA RAISON (I25 a I32). Ce qui disparait de
       l'accueil et n'existe nulle part ailleurs est note en dette 96 —
       l'occupation 30 j et les min/max mensuels, promis a la fiche du
       logement. -->
  <section class="stack" style="gap: 16px" aria-labelledby="h-revenue" data-bind="revenue-section" hidden>
    <div class="section-head">
      <h2 class="h2" id="h-revenue" data-i18n="revenue.title"></h2>
      <!-- Le selecteur Mois / Annee. La vue ANNEE se charge au clic, pas a
           l'ouverture (spec §5) : l'etape 4 ne livre que le mois, et le bouton
           Annee reste donc masque jusqu'a l'etape suivante plutot que de
           promettre un ecran qui n'existe pas. -->
      <!-- ⚠ LA NAVIGATION DE MOIS, demandee par Thierry a la recette du
           27 octobre 2026 : « sans ca, le 1er du mois le bloc est vide et on
           ne peut pas recetter un vrai total ». L'endpoint acceptait deja
           `?mois=`, et rien ne le lui passait — je lui avais meme repondu
           qu'il n'y avait pas de navigation a brancher. Il y en a une
           maintenant. -->
      <div class="rev-nav" role="group" data-i18n-attr="aria-label:revenue.pick_month">
        <button type="button" class="rev-nav__btn" data-mois="prec"
                data-i18n-attr="aria-label:revenue.prev_month">
          <svg class="icon cal-chevron-g" aria-hidden="true"><use href="/shared/icons.svg#i-chevron"/></svg>
        </button>
        <!-- Il porte « octobre 2026 » en vue Mois, « 2026 » en vue Annee. -->
        <strong class="rev-nav__label" data-bind="revenue-month-nav" aria-live="polite"></strong>
        <button type="button" class="rev-nav__btn" data-mois="suiv"
                data-i18n-attr="aria-label:revenue.next_month">
          <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-chevron"/></svg>
        </button>
      </div>
      <!-- ⚠ LE SELECTEUR REVIENT AVEC LA VUE ANNEE, et il porte maintenant
           DEUX choix — c'est ce qui manquait a sa premiere version, retiree a
           la recette du 27 octobre : un selecteur a un seul bouton ne
           selectionne rien. Ses cibles font `var(--control)`, donc 44 px,
           et non les 30 px que Thierry avait releves.
           ⚠ ET LES FLECHES AVANCENT D'UN MOIS OU D'UNE ANNEE selon la vue
           (sa decision 5) : une seule paire de fleches, dont le pas suit ce
           qu'on regarde. -->
      <div class="seg" role="group" data-i18n-attr="aria-label:revenue.view">
        <button type="button" class="seg__btn is-on" data-vue="mois"
                aria-pressed="true" data-i18n="revenue.month"></button>
        <button type="button" class="seg__btn" data-vue="annee"
                aria-pressed="false" data-i18n="revenue.year"></button>
      </div>
    </div>

    <!-- Le bandeau : total du mois, recu, a venir. -->
    <div class="card stack" style="gap: 10px">
      <div class="row" style="justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
        <strong class="num h1" data-bind="revenue-total"></strong>
        <!-- ⚠ LE MOIS NE S'AFFICHE PLUS ICI (recette, constat 4) : il etait
             ecrit DEUX FOIS a l'ecran, entre les fleches de navigation et a
             droite du total. Celui des fleches reste : c'est lui qu'on
             manipule, et le repeter a deux endroits laisse croire qu'ils
             peuvent differer. -->
      </div>
      <!-- ⚠ RECU ET A VENIR EN GROS CHIFFRES (maquette Aujourdhui-v5, demande
           de Thierry du 27 octobre). Ils portaient `class="num"` sous un
           libelle `small` : a l'ecran, le total ecrasait les deux autres alors
           que la maquette les montre comme trois chiffres de meme rang. -->
      <div class="rev-chiffres">
        <span class="rev-chiffre">
          <span class="muted small" data-i18n="revenue.received"></span>
          <strong class="num h2" data-bind="revenue-received"></strong>
        </span>
        <span class="rev-chiffre">
          <span class="muted small" data-i18n="revenue.upcoming"></span>
          <strong class="num h2" data-bind="revenue-upcoming"></strong>
        </span>
      </div>
      <!-- ⚠ CE QUE LE TOTAL NE DIT PAS, dit juste en dessous. Un sejour dont le
           montant ou la date n'est pas calculable n'entre pas en silence :
           « un total auquel il manque une reservation a l'air juste ». -->
      <p class="caption muted" data-bind="revenue-reserves" hidden></p>
    </div>

    <!-- ⚠ UN TABLEAU, PAS UNE LISTE DE `div` (maquette Aujourdhui-v5 : « photo,
         nom, nombre de sejours, barre, recu, a venir, total »). Trois colonnes
         de chiffres alignees se lisent, trois nombres pousses en bout de
         ligne par un `space-between` ne s'alignent pas — et c'est le reproche
         de Thierry a la recette du 27 octobre.
         ⚠ ET C'EST UN VRAI `<table>` : des colonnes de chiffres portent un
         en-tete, et un lecteur d'ecran doit pouvoir dire « A venir, 300 € »
         sur la bonne cellule. Les `div` ne le permettent pas. -->
    <div class="rev-tbl-wrap">
      <table class="rev-tbl">
        <thead>
          <tr>
            <th scope="col" data-i18n="revenue.col_property"></th>
            <!-- ⚠ LA BARRE A SA PROPRE COLONNE DEPUIS LE 27 OCTOBRE 2026
                 (demande de Thierry : « aligne-les verticalement, comme la
                 maquette, colonne de largeur fixe »). Elle vivait dans la
                 cellule du nom, a la suite du nom et du compte de sejours :
                 sa position horizontale suivait donc la longueur du nom et la
                 presence d'une pastille, et aucune barre n'etait alignee avec
                 la suivante.
                 ⚠ SON LIBELLE EXISTE, il n'est simplement pas AFFICHE. Une
                 colonne sans en-tete laisse le lecteur d'ecran annoncer une
                 cellule vide ; `sr-only` est sur le `<span>`, jamais sur le
                 `<th>` — une cellule mise en `position: absolute` quitte la
                 grille du tableau. -->
            <th scope="col" class="rev-tbl__barre">
              <span class="sr-only" data-i18n="revenue.col_split"></span>
            </th>
            <th scope="col" class="rev-tbl__num" data-i18n="revenue.col_received"></th>
            <th scope="col" class="rev-tbl__num" data-i18n="revenue.col_upcoming"></th>
            <th scope="col" class="rev-tbl__num" data-i18n="revenue.col_total"></th>
          </tr>
        </thead>
        <tbody data-list="revenue-rows"></tbody>
      </table>
    </div>

    <!-- ⚠ LA FORME TELEPHONE EST UNE LISTE, ET C'EST UN SECOND BALISAGE, PAS LE
         TABLEAU RESTYLE (recette de Thierry du 27 octobre 2026, constat 1 :
         « le tableau (425 px) deborde a 390 px, colonne Total coupee, noms
         casses mot par mot »).
         ⚠ ON NE PEUT PAS basculer le tableau en liste par CSS : changer le
         `display` d'un `<th>` ou d'un `<td>` retire la cellule de l'arbre
         d'accessibilite, donc `scope="row"` devient inerte — et
         `tests/masquage-hidden.test.js` refuse desormais toute classe de
         cellule qui touche a `display`. Les deux formes coexistent donc, une
         seule s'affiche, et les DEUX sont rendues par la meme boucle a partir
         des memes valeurs : c'est la regle du depot (« une regle partagee par
         les deux versions vit dans un module commun », jamais deux copies). -->
    <ul class="rev-liste" data-list="revenue-cards"></ul>

    <!-- ═══ LA VUE ANNEE ════════════════════════════════════════════════
         Chargee AU CLIC, jamais a l'ouverture : le budget de cet ecran est de
         deux appels au chargement, et un test les compte.
         ⚠ ELLE NE REMPLACE PAS LE BANDEAU DU MOIS A L'ECRAN — elle prend sa
         place, et le bandeau revient quand on repasse en vue Mois. Les deux
         jeux de donnees vivent cote a cote dans `etat`, donc un aller-retour
         entre les deux vues ne recharge rien. -->
    <div data-bind="revenue-annee" hidden>
      <p class="caption muted" data-bind="revenue-annee-etat" hidden></p>

      <!-- ⚠ LA PERIODE EST NOMMEE AVANT LE CHIFFRE (maquette
           `Accueil-revenus-annee-v5`) : « Janvier → octobre 2026 » dit ce que
           le total recouvre. Un grand nombre sans sa periode se lit comme
           l'annee entiere, et l'hote conclurait a une chute en janvier. -->
      <div class="rev-an-tete">
        <div>
          <span class="caption muted" data-bind="revenue-annee-periode"></span>
          <strong class="num rev-an-total" data-bind="revenue-annee-n"></strong>
        </div>
        <!-- ⚠ LE TOTAL N-1 EST COTE A COTE, SANS POURCENTAGE. La maquette en
             portait un (« +14 % vs meme periode 2025 »), et c'etait une erreur
             qu'elle demontrait elle-meme : ses quatre lignes donnent 57 590 €
             dont 7 190 € pour un logement « nouveau en 2026 ». Sans lui,
             50 400 € contre 50 300 € — soit +0,2 %. Le « +14 % » etait donc
             presque entierement l'arrivee d'un bien, pas une meilleure annee.
             Decision de Thierry du 27 octobre, confirmee apres la maquette :
             l'ecart vit sur les LIGNES, ou les deux annees parlent du meme
             logement. -->
        <div class="rev-an-n1">
          <span class="caption muted" data-bind="revenue-annee-n1-label"></span>
          <span class="num" data-bind="revenue-annee-n1"></span>
          <!-- ⚠ L'ECART N'APPARAIT QUE POUR UN LOGEMENT DESIGNE. Au niveau du
               compte il reste absent (decision 1) : les deux annees n'y portent
               pas les memes logements. Au niveau d'un bien, elles parlent du
               meme, et l'ecart est comparable (decision Q1 du 28 octobre). -->
          <span class="caption" data-bind="revenue-annee-ecart" hidden></span>
        </div>
      </div>

      <!-- Les pastilles de filtre : « Tous », puis un logement. -->
      <div class="rev-an-filtres" role="group" data-list="revenue-annee-filtres"
           data-i18n-attr="aria-label:revenue.annee_filtre_aria"></div>

      <div class="rev-an-legende" data-bind="revenue-annee-legende" aria-hidden="true"></div>
      <div data-bind="revenue-annee-courbe"></div>

      <!-- ⚠ UN VRAI TABLEAU : trois colonnes de chiffres alignees se lisent,
           et un lecteur d'ecran doit pouvoir dire « La bulle, 2025, 19 800 € ».
           Meme raison que le tableau de la vue Mois. -->
      <div class="rev-tbl-wrap rev-an-tbl">
        <table class="rev-tbl rev-tbl--annee">
          <thead><tr>
            <th scope="col" data-i18n="revenue.col_property"></th>
            <th scope="col" class="rev-tbl__num" data-bind="revenue-annee-col-n"></th>
            <th scope="col" class="rev-tbl__num" data-bind="revenue-annee-col-n1"></th>
            <th scope="col" class="rev-tbl__num" data-i18n="revenue.annee_col_ecart"></th>
          </tr></thead>
          <tbody data-list="revenue-annee-lignes"></tbody>
        </table>
      </div>
      <!-- La forme telephone du meme tableau, pour la meme raison que la vue
           Mois : a 390 px, quatre colonnes ne tiennent pas. -->
      <ul class="rev-liste rev-liste--annee" data-list="revenue-annee-cartes"></ul>

      <p class="caption muted" data-bind="revenue-annee-note"></p>
      <!-- ⚠ LE TABLEAU DOUBLE LA LIGNE POINTILLEE, IL NE LA REMPLACE PAS.
           Au niveau du compte, l'axe est tire par le pic d'ete : deux
           pointilles a 2 k € sur un axe a 16 k € se tassent au ras de l'axe,
           et l'ecart qui est le SUJET ne se lit pas. Mesure au banc le
           28 octobre 2026. Une ligne qu'on ne peut pas lire gagne a etre
           doublee d'un nombre (decision de Thierry). -->
      <div class="rev-rad" data-bind="revenue-annee-rad" hidden>
        <h3 class="caption rev-rad__titre" data-i18n="revenue.annee_rad_titre"></h3>
        <div class="rev-tbl-wrap rev-rad-tbl">
          <table class="rev-tbl">
            <thead><tr>
              <th scope="col" data-i18n="revenue.annee_rad_col_mois"></th>
              <th scope="col" class="rev-tbl__num" data-i18n="revenue.annee_rad_col_auj"></th>
              <th scope="col" class="rev-tbl__num" data-bind="revenue-annee-rad-col-n1"></th>
              <th scope="col" class="rev-tbl__num" data-i18n="revenue.annee_col_ecart"></th>
            </tr></thead>
            <tbody data-list="revenue-annee-rad-lignes"></tbody>
          </table>
        </div>
        <ul class="rev-liste rev-rad-liste" data-list="revenue-annee-rad-cartes"></ul>
      </div>
      <p class="caption muted" data-bind="revenue-annee-comparables-tous" hidden></p>
      <p class="caption muted" data-bind="revenue-annee-comparables" hidden></p>
      <p class="caption muted" data-bind="revenue-annee-reserves" hidden></p>
    </div>

    <!-- ⚠ LA NOTE DE BAS DE BLOC PORTE L'HONNETETE DE TOUT CE QUI PRECEDE
         (spec §4, decision Q9 de Thierry) : ces montants sont CALCULES selon
         les delais des plateformes, et non confirmes par la banque. Dette 95. -->
    <p class="caption muted" data-i18n="revenue.note"></p>

    <!-- Aucun logement : le MEME etat que la page Logements, rendu par le MEME
         module (Q7). Sans lui, l'accueil d'un hote qui debute n'offre plus
         aucune action, le bouton d'ajout ayant quitte l'en-tete.
         ⚠ IL A SUIVI LE BLOC LOGEMENTS QUAND CELUI-CI EST PARTI : un hote sans
         bien n'a pas de revenus non plus, et c'est le dernier bloc de la page,
         donc le bon endroit pour la seule action qui lui reste. -->
    <div class="card log-etat" data-bind="etat-vide" hidden role="status" aria-live="polite"></div>
  </section>
</main>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { requireAuth } from '/components/auth-guard.js'
// ⚠ `signOut` EST LE GESTE COMPLET : purge des caches, fermeture de la session,
// puis le formulaire. On n'appelle pas ses moities separement — c'est ce que ma
// premiere version du 401 avait fait, et il en resultait une boucle de
// redirection, `login` renvoyant vers l'accueil tant que la session locale
// existait.
import { supabase, signOut } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { logger } from '/shared/logger.js'
import { escapeHtml as esc } from '/shared/properties.js'
import { courbeMensuelle } from '/shared/courbe-mensuelle.js'
// ⚠ `enteteCompte()` sur chaque fetch : les endpoints lus ici honorent X-Compte
// (compteDelegue) ; sans l'en-tête, un membre verrait SON compte pendant que
// les lectures Supabase, juste à côté, lisent le compte consulté.
import { compteCourant, moi, peutLire, peutEcrire, estTitulaire, comptes, basculerVers, enteteCompte }
  from '/shared/compte-courant.js'
// ⚠ L'ETAT VIDE VIENT DU MODULE COMMUN, il n'est pas recopie ici : la page
// Logements rend exactement la meme zone, et deux copies divergent.
import { etatHtml, libelleDuCanal } from '/shared/logements-liste.js'
// Le bloc « Derniers avis » : vue pure et rendu, hors de la page (etape 2).
import { vueDesAvis, blocAvisHtml, enTeteAvisHtml, carteAvisHtml, MUETS } from '/shared/avis-recents.js'
import * as R from '/shared/aujourdhui.js'
import * as CacheEcran from '/shared/cache-ecran.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (sel) => document.querySelector(sel)
const icone = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="/shared/icons.svg#${id}"/></svg>`

// ─── État de la page : chaque lecture le complète, chaque rendu le relit ────
const etat = {
  aujourdHui: R.jourParis(),
  // Le mois demande au serveur pour le bloc Revenus. `null` = celui qu'il
  // choisit, c'est-a-dire le mois courant a Paris.
  moisRevenus: null,
  // La vue affichee du bloc Revenus : 'mois' ou 'annee'. ⚠ ELLE N'EST PAS
  // PERSISTEE : l'accueil s'ouvre sur le mois, qui est la question du jour.
  vueRevenus: 'mois',
  // L'annee demandee, et sa charge. Les deux vues coexistent dans l'etat :
  // un aller-retour entre elles ne recharge donc rien.
  anneeRevenus: null,
  annee: null,
  anneeEtat: 'vide',
  // Les bandes de comparables deja chargees, par bien. ⚠ UN CACHE, pour qu'une
  // pastille deja vue ne rappelle pas le reseau : revenir sur « La bulle » apres
  // un detour par « Colomiers » ne doit rien couter.
  comparablesParBien: {},
  // Le logement dont la COURBE est tracee, ou `null` pour le compte entier.
  // ⚠ IL NE FILTRE QUE LA COURBE : le total de l'en-tete et le tableau restent
  // ceux du compte. Voir le commentaire de `renderAnnee`.
  filtreAnnee: null,
  biens: [], bookings: [], menages: [], prestataires: [],
  menagesOk: null, etatsArrivee: {}, conversations: new Set(),
  taches: [], tachesOk: null,
  alarmes: [],
  // ⚠ `parBien` A DISPARU AVEC LES DEUX APPELS `/api/yield` PAR BIEN : plus
  // personne ne l'ecrit, et une Map vide que des lecteurs interrogent est une
  // source de « non calculable » qu'aucun calcul n'explique.
  noteGlobale: null,
  derniersAvis: null, avisRefuse: false, avisConnu: false,
  compteurs: [],
  // La réponse de `/api/ecran/aujourdhui` — un seul appel pour six blocs.
  ecran: null,
  // L'âge des données affichées, quand elles viennent du cache. `null` = elles
  // viennent du serveur.
  ageCache: null
}

// ⚠ UN SEUL APPEL POUR SIX BLOCS — lot (b) du chantier performance.
// Il remplace CINQ appels (`incidents-acquitter`, `messages`,
// `messages?stats=ia`, `avis?action=notes`) et CINQ lectures directes du
// navigateur sous RLS (`properties`, `agent_tasks`, et trois comptages).
//
// ⚠ ET IL NE PASSE PLUS PAR `/api/messages`. Mesure du 22 octobre 2026 contre
// la production : cet appel coûtait 18 requêtes et 437 212 octets — 42 % du
// poids de la page — pour deux champs (`arrivee.codeEtat` et la liste des
// réservations qui ont un fil). L'endpoint d'écran les lit directement :
// 1 requête et 3 244 octets pour les fils, 2 requêtes pour l'état du code.
//
// ⚠ CE QU'IL NE REMPLACE PAS, ET C'EST ASSUMÉ : `/api/menages` (la fenêtre de
// 400 jours, domaine ménage, repliée au lot (d)) et `/api/yield` (le CA et le
// TO, remplacés par des tables de résumé au lot (c)).
// Le numero du chargement en cours : une reponse plus ancienne ne doit pas
// ecraser une plus recente. Declare AVANT la fonction qui le lit — un `let`
// place apres marcherait (la fonction n'est appelee que plus tard) mais se
// relirait mal.
let sequenceEcran = 0
async function chargerEcran () {
  // ⚠ LE MOIS DEMANDE VA DANS L'URL, et rien ne le passait jusqu'au
  // 27 octobre 2026 : l'endpoint acceptait `?mois=` depuis le debut, et l'ecran
  // retombait donc toujours sur le mois courant. Consequence relevee par
  // Thierry a la recette : « le 1er du mois le bloc est vide et on ne peut pas
  // recetter un vrai total ».
  //
  // `null` veut dire « celui que le serveur choisit » — le mois courant a
  // Paris. On ne met pas le mois courant en dur dans l'URL : l'horloge du
  // navigateur et celle du serveur peuvent differer d'un jour en fin de mois,
  // et c'est le serveur qui doit trancher.
  const q = etat.moisRevenus ? `?mois=${encodeURIComponent(etat.moisRevenus)}` : ''
  // ⚠ UN NUMERO DE SEQUENCE, PARCE QUE DEUX CHARGEMENTS PEUVENT SE CROISER.
  // Constat d'une review du 27 octobre 2026 : les fleches sont cablees dans
  // `init()` AVANT la phase reseau, et sur cache chaud la section est deja
  // visible — donc cliquables pendant tout le chargement. `navEnCours` ne
  // protegeait que deux navigations entre elles, pas une navigation contre le
  // chargement initial. Les deux ecrivent `etat.ecran`, et le dernier RESOLU
  // gagnait : soit le mois choisi par l'hote etait defait sous ses yeux, soit
  // `init()` ecrivait le cache avec le `mois` d'une periode passee.
  const monTour = ++sequenceEcran
  const recu = await appel('/api/ecran/aujourdhui' + q)
  // Une reponse arrivee apres une plus recente ne s'ecrit pas : elle est
  // perimee, et ce n'est pas une erreur — c'est une course qu'on a perdue.
  if (monTour !== sequenceEcran) return etat.ecran
  etat.ecran = recu
  return etat.ecran
}

// Le mois voisin. « 2026-10 » + 1 -> « 2026-11 », et le passage d'annee marche.
function moisDecale (mois, pas) {
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(mois || ''))) return null
  const [an, m] = String(mois).split('-').map(Number)
  // ⚠ EN UTC, ET LE 1er DU MOIS : `new Date(an, m - 1 + pas, 1)` en heure
  // locale suffirait, mais un decalage de fuseau sur le 1er a minuit ferait
  // reculer d'un mois. Le depot a deja paye ce defaut sur les dates de sejour.
  const d = new Date(Date.UTC(an, m - 1 + pas, 1))
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`
}

// ⚠ LA NAVIGATION RECHARGE L'ECRAN ENTIER, et c'est voulu : l'endpoint est
// unique, il rend les six blocs d'un coup. Les autres blocs ne dependent pas du
// mois, donc ils se repeignent a l'identique — et le cache local, lui, n'accepte
// le bloc revenus que s'il porte le mois COURANT, donc naviguer dans le passe ne
// le pollue pas.
let navEnCours = false
async function allerAuMois (pas) {
  if (navEnCours) return
  // Le mois SERVI fait foi ; a defaut, celui du jour de reference (Paris).
  const actuel = (etat.ecran && etat.ecran.mois) || String(etat.aujourdHui).slice(0, 7)
  const cible = moisDecale(actuel, pas)
  if (!cible) return
  navEnCours = true
  // ⚠ `aria-disabled` ET NON `disabled` : desactiver un bouton qui a le focus le
  // fait perdre au `<body>`, donc un hote au clavier devrait re-tabuler depuis
  // le haut de la page a chaque mois. Le refus effectif est le `navEnCours`
  // ci-dessus, qui sort avant tout travail.
  for (const b of document.querySelectorAll('.rev-nav__btn')) b.setAttribute('aria-disabled', 'true')
  etat.moisRevenus = cible
  try {
    await chargerEcran()
    renderRevenus()
  } catch (e) {
    // ⚠ UN ECHEC NE LAISSE PAS L'ECRAN SUR UN MOIS QU'IL N'A PAS LU. On
    // revient au mois precedemment affiche, sinon les fleches et les chiffres
    // ne parlent plus de la meme periode.
    console.error('[aujourdhui] navigation de mois', e && e.message)
    etat.moisRevenus = actuel
    renderRevenus()
  } finally {
    navEnCours = false
    for (const b of document.querySelectorAll('.rev-nav__btn')) b.removeAttribute('aria-disabled')
  }
}

// ⚠ LA VUE ANNEE SE CHARGE AU CLIC, ET UNE SEULE FOIS PAR ANNEE. L'appel
// d'ouverture coute deux requetes, et un test les compte : y ajouter douze mois
// de deux annees ferait payer a chaque hote, a chaque visite, un ecran qu'il
// n'ouvrira peut-etre jamais.
//
// ⚠ ET UN NUMERO DE SEQUENCE, parce que deux chargements peuvent se croiser :
// les fleches restent cliquables pendant le reseau, et le dernier RESOLU
// gagnerait sinon — l'annee affichee ne serait plus celle du libelle.
let sequenceAnnee = 0
let anneeEnCours = false
async function chargerAnnee (an) {
  const cible = Number(an)
  if (!Number.isInteger(cible)) return
  // Deja en main : on ne redemande pas.
  if (etat.annee && etat.anneeRevenus === cible && etat.anneeEtat === 'ok') return
  const monTour = ++sequenceAnnee
  anneeEnCours = true
  etat.anneeRevenus = cible
  etat.anneeEtat = 'chargement'
  renderRevenus()
  try {
    const recu = await appel(`/api/ecran/revenus-annee?annee=${encodeURIComponent(cible)}`)
    if (monTour !== sequenceAnnee) return
    etat.annee = recu
    etat.anneeEtat = 'ok'
  } catch (e) {
    if (monTour !== sequenceAnnee) return
    console.error('[aujourdhui] chargement annee', e && e.message)
    // ⚠ UN ECHEC SE DIT, IL NE LAISSE PAS L'ANNEE PRECEDENTE A L'ECRAN SOUS UN
    // LIBELLE QUI EN ANNONCE UNE AUTRE.
    etat.annee = null
    etat.anneeEtat = 'echec'
  } finally {
    if (monTour === sequenceAnnee) anneeEnCours = false
    renderRevenus()
  }
}

// Changer de vue. ⚠ Aucun appel reseau pour revenir au mois : il est deja la.
// La bande des comparables d'UN logement. ⚠ ELLE NE SE CHARGE QU'AU CLIC SUR SA
// PASTILLE, jamais a l'ouverture : le budget de l'ecran est de deux appels au
// chargement, et une bande que personne n'a demandee n'en vaut pas un troisieme.
async function chargerComparables (bienId) {
  // ⚠ LA CLE PORTE L'ANNEE, et elle ne la portait pas. La reponse ne couvre que
  // [annee-1, annee+1) : une pastille cliquee en 2026 puis une fleche vers 2024
  // laissait le cache repondre pour la mauvaise fenetre — plus de bande, plus
  // de note, aucune explication, et aucun appel ne l'aurait jamais rechargee.
  const cle = `${etat.anneeRevenus}|${String(bienId || '')}`
  if (!bienId || Object.prototype.hasOwnProperty.call(etat.comparablesParBien, cle)) return
  // ⚠ ON POSE LA CLE AVANT L'APPEL : deux clics rapides sur la meme pastille ne
  // doivent pas partir deux fois. `undefined` pendant le vol, la valeur apres.
  etat.comparablesParBien[cle] = undefined
  try {
    const recu = await appel(`/api/ecran/revenus-annee?annee=${encodeURIComponent(etat.anneeRevenus)}&bien=${encodeURIComponent(bienId)}`)
    // ⚠ `null` EST UNE REPONSE, ET IL VEUT DIRE « lecture ratee ». On le garde
    // tel quel : l'ecran dira « non calculable », pas « aucun comparable ».
    etat.comparablesParBien[cle] = recu && Object.prototype.hasOwnProperty.call(recu, 'comparables')
      ? recu.comparables
      : null
  } catch (e) {
    etat.comparablesParBien[cle] = null
  }
  renderAnnee()
}

async function allerALaVue (vue) {
  if (vue !== 'mois' && vue !== 'annee') return
  etat.vueRevenus = vue
  if (vue === 'annee') {
    const an = etat.anneeRevenus
      || Number(String((etat.ecran && etat.ecran.mois) || etat.aujourdHui).slice(0, 4))
    await chargerAnnee(an)
  } else {
    renderRevenus()
  }
}

// ⚠ LES FLECHES AVANCENT D'UN MOIS OU D'UNE ANNEE SELON LA VUE (decision 5 de
// Thierry). Une seule paire, dont le pas suit ce qu'on regarde : deux paires
// distinctes auraient demande a l'hote de savoir laquelle agit.
async function allerAuPas (pas) {
  if (etat.vueRevenus === 'annee') {
    if (anneeEnCours) return
    const actuel = etat.anneeRevenus
      || Number(String((etat.ecran && etat.ecran.mois) || etat.aujourdHui).slice(0, 4))
    return chargerAnnee(actuel + pas)
  }
  return allerAuMois(pas)
}

// fetch d'un endpoint, avec la session et le compte consulté.
// ⚠ UNE SESSION PERDUE RENVOIE A LA CONNEXION, ELLE NE LAISSE PAS L'ECRAN
// AFFICHER LE CACHE. Constat de la recette de Thierry du 27 octobre 2026 :
// « l'ecran affiche "Lecture impossible" mais "Fait pour vous" montre des 0
// comme des faits ».
//
// La cause n'etait pas les compteurs — `chargerCompteurs` filtre deja les
// `null`, donc un ecran jamais lu masque la tuile. C'etait le CACHE LOCAL : la
// page peint d'abord ce qu'elle a garde (12 h), puis l'appel rejette en 401, et
// les chiffres de la session precedente RESTENT a l'ecran. Un hote dont le
// jeton a expire lisait donc des compteurs de la veille comme des faits du
// jour, a cote d'un bloc qui annoncait une panne.
//
// Aucun bloc ne peut se rattraper seul : ce n'est pas une donnee qui manque,
// c'est la session. On va donc la refaire, comme `requireAuth` le fait quand il
// n'y a pas de session du tout — meme destination, meme geste.
let sessionPerdue = false
// ⚠ UNE SESSION PERDUE SE REFERME, ELLE NE SE CONTOURNE PAS. Et ma premiere
// version faisait les deux erreurs qu'une review a mesurees le 27 octobre 2026 :
//
//   · elle purgeait les caches puis faisait `replace('/pages/login.html')` SANS
//     fermer la session Supabase. Or `pages/login.html` renvoie vers l'accueil
//     des qu'il trouve une session locale : aujourdhui -> purge -> login ->
//     session trouvee -> aujourdhui -> 401 -> ... Une BOUCLE infinie de
//     navigations JS, qu'aucun garde-fou de navigateur n'arrete, et chaque tour
//     detruisait le compte courant d'un membre delegue.
//     J'avais ecrit « c'est le geste partage, celui des cinq chemins de
//     sortie » : seule la MOITIE l'etait. Le geste complet est
//     `purgerCachesLocaux()` PUIS `auth.signOut()` PUIS la navigation, et c'est
//     exactement `signOut()` — deja importe dans cette page pour le menu.
//
//   · et elle ne gardait pas `session === null`. `getSession()` rafraichit
//     lui-meme un jeton expire ; quand le rafraichissement ECHOUE — jeton de
//     rafraichissement perime, rotation deja consommee par un autre onglet — il
//     rend `{ data: { session: null } }`. On levait alors un TypeError sur
//     `session.access_token` AVANT d'atteindre la branche 401 : aucune purge,
//     aucune redirection, et les chiffres du cache restaient a l'ecran. C'est
//     la forme DOMINANTE de « session expiree », et c'est le constat n. 1 de
//     Thierry qui se reproduisait a l'identique.
//     `pages/messages.html` a deja la bonne ligne ; on la copie.
async function appel (chemin) {
  const { data: { session } } = await supabase.auth.getSession()
  if (!session || !session.access_token) return refermerLaSession()
  const r = await fetch(chemin, {
    headers: { Authorization: 'Bearer ' + session.access_token, ...enteteCompte() }
  })
  const corps = await r.json().catch(() => ({}))
  if (r.status === 401) return refermerLaSession()
  if (!r.ok) { const e = new Error(corps.error || `HTTP ${r.status}`); e.status = r.status; throw e }
  return corps
}

// ⚠ UN SEUL CHEMIN DE SORTIE, ET IL LEVE TOUJOURS. `signOut()` navigue, mais
// une navigation ne stoppe pas l'execution : sans la levee, les six blocs
// continueraient de se peindre avec les donnees perimees qu'on vient de purger.
function refermerLaSession () {
  // Une seule fois : six blocs partent en parallele, et six sorties
  // empileraient autant d'entrees dans l'historique.
  if (!sessionPerdue) {
    sessionPerdue = true
    // `signOut` purge les caches, ferme la session, puis va au formulaire.
    // Son echec ne doit pas laisser la page sur des chiffres perimes : on leve
    // de toute facon, juste apres.
    Promise.resolve(signOut()).catch(e => console.error('[aujourdhui] sortie de session', e && e.message))
  }
  const e = new Error('session expiree'); e.status = 401; throw e
}

// Exécute des tâches asynchrones par paquets : /api/yield lit tout l'historique
// du compte à chaque appel, on ne lance pas dix lectures d'un coup.
async function parPaquets (taches, taille) {
  for (let i = 0; i < taches.length; i += taille) {
    await Promise.allSettled(taches.slice(i, i + taille).map(f => f()))
  }
}

// Une date calendaire de Paris (YYYY-MM-DD) affichée telle quelle, quel que soit
// le fuseau du navigateur : midi UTC, formaté en UTC.
function dateDuJour (jour, opts) {
  const [a, m, d] = jour.split('-').map(Number)
  return I18n.date(new Date(Date.UTC(a, m - 1, d, 12)), { ...opts, timeZone: 'UTC' })
}
const monnaie = (n, devise) => I18n.money(n, devise || 'EUR')

// La vignette d'un logement : sa photo, ou son initiale a defaut.
// ⚠ ELLE VIT ICI PARCE QUE DEUX VUES L'AFFICHENT — le tableau du mois et celui
// de l'annee. La regle du depot est nommee : *une regle partagee par deux
// versions vit dans un module commun, jamais recopiee dans chaque page* ; deux
// copies divergent, et c'est exactement ce qui a fait afficher une reservation
// Booking en rouge Airbnb sur le calendrier du telephone.
// ⚠ ET SON ABSENCE N'EST PAS UN TROU : un bien sans photo rend une pastille
// portant son initiale. Un `<img>` sans `src` afficherait l'icone de fichier
// casse du navigateur.
const vignetteDuBien = (b) => b && b.photo_url
  ? `<img class="rev-tbl__photo" src="${esc(b.photo_url)}" alt="" loading="lazy" decoding="async">`
  : `<span class="rev-tbl__photo rev-tbl__photo--vide" aria-hidden="true">`
    + `${esc(String((b && b.name) || '?').slice(0, 1).toLocaleUpperCase(I18n.lang))}</span>`

// Les douze initiales de mois, DANS LA LANGUE DE L'HOTE.
// ⚠ LE REPLI DU MODULE DE COURBE EST FRANCAIS, et l'espagnol ne le partage pas :
// janvier y est « E » (Enero), pas « J ». `scripts/i18n-check.js` ne lit que les
// fichiers de locale — un « J » en dur dans un module ne lui aurait rien dit.
// `month: 'narrow'` les fait rendre par `Intl`, donc pour toute langue a venir.
const initialesDesMois = () => Array.from({ length: 12 }, (_, m) =>
  dateDuJour(`2026-${String(m + 1).padStart(2, '0')}-15`, { month: 'narrow' }))

// ⚠ LE REPERE DE LA COURBE SUIT LA LARGEUR DE L'ECRAN, et c'est une question de
// LISIBILITE, pas de gout. Le `viewBox` est mis a l'echelle de son cadre, donc
// les textes aussi : a 390 px, un repere de 680 unites affiche ses libelles a
// 5,8 px. Mesure au banc le 27 octobre 2026 — graduations et initiales de mois
// illisibles, sans qu'aucun test ni aucun avertissement ne le dise.
// Le seuil est celui de `shared/ui.css` (`min-width: 561px`) : une seule
// frontiere pour toute la page.
// ⚠ `matchMedia` PEUT MANQUER, et son absence ne doit pas vider l'ecran. Elle
// est evaluee au CHARGEMENT du module : une exception ici n'ampute pas la
// courbe, elle empeche la page entiere de se construire — et le `.catch` du
// demarrage l'ecrirait dans un journal que personne ne lit. Mesure du
// 27 octobre 2026 : 36 tests rouges, tous sur `window.matchMedia is not a
// function`. Sans repere connu, on rend le repere LARGE, qui est le defaut du
// module.
const ECRAN_ETROIT = typeof window.matchMedia === 'function'
  ? window.matchMedia('(max-width: 560px)')
  : null
const repereDeCourbe = () => (ECRAN_ETROIT && ECRAN_ETROIT.matches)
  ? { largeur: 360, hauteur: 200 }
  : { largeur: 680, hauteur: 220 }
// La date d'un avis : un INSTANT (`received_at`), pas un jour calendaire —
// `dateDuJour` ne vaut que pour les « YYYY-MM-DD » du coeur.
const dateEnClair = (iso) => I18n.date(new Date(iso), { day: 'numeric', month: 'long' })

// ⚠ `delta`, `deltaPct` ET `deltaPoints` SONT TOUS PARTIS, et les deux premiers
// a l'etape 4 — constat de la review du 26 octobre 2026. `deltaPoints` avait
// quitte la page avec la bande « 30 jours » ; `delta` et `deltaPct` sont restes
// parce que la VARIATION du CA par bien les appelait, sur les cartes de
// logement. Les cartes partent avec le bloc « Vos logements », donc leur dernier
// appelant avec elles.
//
// ⚠ ET ILS MAINTENAIENT QUATRE CLES i18n EN VIE — `kpi.up`, `kpi.down`,
// `kpi.same`, `kpi.delta_hint`, soit douze entrees sur trois langues, dont ce
// code mort etait le SEUL lecteur du depot (mesure : `grep -rln` ne rend que ce
// fichier). C'est mot pour mot le motif pour lequel j'ai retire `quand()` dix
// lignes plus bas — « une fonction morte qui lit une cle fait croire que la cle
// est utilisee, et la cle survit au nettoyage » — et je l'ai applique a `quand()`
// sans regarder ses voisines.
//
// La variation contre la periode precedente n'est PAS perdue par omission : le
// bloc « Revenus nets » ne la porte pas parce que la vue MOIS n'a rien a quoi se
// comparer ; c'est la vue ANNEE (courbe N contre N-1) qui la rendra, avec son
// propre formatage. Si elle revient ici, ces deux fonctions sont dans
// l'historique de ce commit.

// ─── 1. La date, à droite du titre ──────────────────────────────────────────
// ⚠ CE QUI A DISPARU ICI, ET CE QUI NE DOIT PAS DISPARAITRE AVEC. La ligne
// résumé comptée — « {date} · N arrivées · N départs · N à traiter » — est
// retirée (décision de Thierry du 24 octobre 2026). Elle portait DEUX choses :
// la date, qui passe ici, et le COMPTE DES CHOSES A TRAITER, qui passe à côté
// du titre « À valider » (`renderTaches`). Le retirer des deux endroits aurait
// été un retrait par omission, celui que l'inventaire existe pour empêcher.
//
// ⚠ ET LE FORMAT COURT N'EST PAS UN CHOIX DE CSS. « samedi 24 octobre » sur un
// écran de 390 px pousse la date sous le titre ou déborde ; la maquette
// mobile dit « sam. 24 oct. ». Un texte ne se raccourcit pas en CSS : c'est le
// rendu qui choisit, sur la largeur réelle.
// ⚠ 720 px, LE POINT DE BASCULE DE LA PAGE — et j'avais ecrit 640 (constat
// MOYEN 4 de la revue). `shared/ui.css` passe en mise en page telephone a
// `max-width: 720px` : entre 641 et 720 px, la page etait deja en telephone
// (carte sombre, `only-desktop` masque) avec la date LONGUE. Un point de
// bascule propre a un element se desaccorde du reste de l'ecran, et personne
// ne le voit avant une tablette en portrait.
const TELEPHONE = '(max-width: 720px)'
function renderDate () {
  const mq = typeof window.matchMedia === 'function' ? window.matchMedia(TELEPHONE) : null
  const opts = (mq && mq.matches)
    ? { weekday: 'short', day: 'numeric', month: 'short' }
    : { weekday: 'long', day: 'numeric', month: 'long' }
  $('[data-bind="date"]').textContent = dateDuJour(etat.aujourdHui, opts)
}
// ⚠ ET LE FORMAT SE RECALCULE, parce qu'un texte ne se raccourcit pas en CSS.
// Il etait choisi UNE fois au chargement : une rotation de telephone
// portrait -> paysage gardait « sam. 24 oct. », et une fenetre reduite de 1200 a
// 500 px gardait « samedi 24 octobre ». Le depot a deja ce geste sur le
// calendrier. `change` sur la media query, pas `resize` : il ne se declenche
// qu'au FRANCHISSEMENT, pas a chaque pixel.
function suivreLaLargeur () {
  const mq = typeof window.matchMedia === 'function' ? window.matchMedia(TELEPHONE) : null
  if (!mq) return
  if (typeof mq.addEventListener === 'function') mq.addEventListener('change', renderDate)
  else if (typeof mq.addListener === 'function') mq.addListener(renderDate)
}

// ─── Alarmes de surréservation ──────────────────────────────────────────────
function nomDuBien (ref) {
  const b = etat.biens.find(x => String(x.id) === String(ref) || String(x.provider_property_id) === String(ref))
  return b ? b.name : null
}
function renderAlarmes () {
  const zone = $('[data-list="alarms"]')
  zone.hidden = !etat.alarmes.length
  const acquittable = peutEcrire('reservations')
  zone.innerHTML = etat.alarmes.map(a => {
    const nom = nomDuBien(a.property_id)
    return `<div class="alert" role="alert">
      ${icone('i-alert', 'icon icon--lg')}
      <span class="alert__title">${esc(nom ? t('alarm.title', { name: nom }) : t('alarm.title_anon'))}</span>
      <span class="small">${esc(a.detail?.message || t('alarm.default'))}</span>
      <span class="caption muted">${esc(t('alarm.since', { date: I18n.date(new Date(a.created_at), { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) }))}</span>
      ${acquittable ? `<button type="button" class="btn btn--primary" data-acquitter="${esc(a.id)}">${esc(t('alarm.ack'))}</button>` : ''}
    </div>`
  }).join('')
  zone.querySelectorAll('[data-acquitter]').forEach(b => b.addEventListener('click', () => acquitter(b)))
}
async function chargerAlarmes () {
  // Vient de l'appel d'écran. `null` = droit refusé ou lecture indisponible —
  // dans les deux cas on n'affiche aucune alarme, et on ne prétend pas qu'il
  // n'y en a pas.
  const a = etat.ecran && etat.ecran.alarmes
  etat.alarmes = Array.isArray(a) ? a : []
}

async function acquitter (b) {
  b.disabled = true
  b.textContent = t('alarm.acking')
  try {
    const { data: { session } } = await supabase.auth.getSession()
    const rep = await fetch('/api/incidents-acquitter', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json', ...enteteCompte() },
      body: JSON.stringify({ id: b.dataset.acquitter })
    })
    if (!rep.ok) throw new Error('echec')
    // ⚠ ON RETIRE LA LIGNE ICI, ET ON REND. `chargerAlarmes()` ne fait plus de
    // réseau depuis ce lot : elle relisait `etat.ecran.alarmes`, la réponse
    // CAPTURÉE AU CHARGEMENT, qui contient encore l'incident qu'on vient
    // d'acquitter — et aucun rendu ne suivait. L'hôte voyait le bouton rester
    // désactivé sur « Acquittement… », l'alarme rester à l'écran, puis, en
    // cliquant de nouveau, un échec : le POST est idempotent
    // (`.is('acquitted_at', null)`), donc le second part en 404 et le bouton
    // bascule sur « Réessayer ». Un acquittement RÉUSSI rapporté comme un
    // échec.
    const id = b.dataset.acquitter
    const reste = (x) => String(x.id) !== String(id)
    if (etat.ecran && Array.isArray(etat.ecran.alarmes)) {
      etat.ecran.alarmes = etat.ecran.alarmes.filter(reste)
    }
    etat.alarmes = (etat.alarmes || []).filter(reste)
    renderAlarmes()
  } catch (e) {
    b.disabled = false
    b.textContent = t('alarm.retry')
  }
}

// ─── 2. Aujourd'hui : arrivées et départs ───────────────────────────────────
function evenements () {
  return R.evenementsDuJour({
    bookings: etat.bookings, biens: etat.biens, menages: etat.menages,
    prestataires: etat.prestataires, etatsArrivee: etat.etatsArrivee, aujourdHui: etat.aujourdHui
  })
}
function lienConversation (e) {
  // La messagerie V5 (etape 4) : l'ancienne page est une redirection, on
  // pointe directement /messages — qui ouvre le fil par ?conv= seul.
  return `/messages?conv=${encodeURIComponent(e.bookingId)}`
}
function phraseMenage (m, heure) {
  const parts = [heure ? t('today.cleaning_after', { time: heure }) : t('today.cleaning_after_notime')]
  const s = m.statut
  if (s === 'accepted' && m.prestataire) parts.push(t('today.cleaning_confirmed', { name: m.prestataire }))
  else if (s === 'started' && m.prestataire) parts.push(t('today.cleaning_started', { name: m.prestataire }))
  else if (s === 'completed' && m.prestataire) parts.push(t('today.cleaning_done', { name: m.prestataire }))
  else if (s === 'offered' && m.proposeeA) parts.push(t('today.cleaning_offered', { name: m.proposeeA }))
  else if (s === 'unassigned' || s === 'orphaned') parts.push(t('today.cleaning_unassigned'))
  return parts.join(', ')
}
// ⚠ LA GRILLE SE MET A PLAT QUAND LE JOUR N'A QU'UNE LIGNE A DIRE, et la
// bascule vit ICI parce que c'est le seul endroit qui sait dans quel etat le
// bloc est rendu. Mesure au banc, a 1280 px, avant correctif : bloc gauche
// 21 px, bloc droit 716 px, et 695 px de BLANC a gauche — la ligne de grille
// fait la hauteur de sa colonne la plus haute. Le bloc ne s'etirait pas (c'est
// ce que `align-items: start` garantit deja) ; c'est la PLACE RESERVEE qui
// etait vide. A plat, « A valider » prend la largeur et le blanc disparait.
// ⚠ LES DEUX ETATS D'UNE LIGNE Y PASSENT, pas seulement « rien aujourd'hui » :
// « les menages ne sont pas lisibles » fait exactement la meme hauteur, et
// laisserait exactement le meme blanc.
const aPlat = (oui) => {
  const duo = $('[data-bind="today-duo"]')
  if (duo) duo.classList.toggle('auj-duo--plat', !!oui)
}
function renderEvenements () {
  const zone = $('[data-list="events"]')
  if (etat.menagesOk === false) { aPlat(true); zone.innerHTML = `<p class="muted">${esc(t('today.unavailable'))}</p>`; return }
  const evts = evenements()
  if (!evts.length) { aPlat(true); zone.innerHTML = `<p class="muted">${esc(t('today.empty'))}</p>`; return }
  aPlat(false)
  zone.innerHTML = evts.map(e => {
    const arrivee = e.type === 'arrivee'
    const libelle = t(arrivee ? 'today.arrival' : 'today.departure')
    const sous = [e.voyageur || t('today.guest')]
    if (arrivee) {
      if (e.nuits != null) sous.push(t('today.nights', { n: e.nuits }))
      if (e.codeEtat === 'transmis') sous.push(t('today.code_sent'))
      else if (e.codeEtat === 'cree') sous.push(t('today.code_pending'))
    } else {
      sous.push(phraseMenage(e.menage, e.heure))
    }
    // Le fil seulement s'il EXISTE : sinon la messagerie répond « conversation
    // introuvable » (constat de revue). À défaut, la fiche du bien.
    const href = arrivee
      ? (etat.conversations.has(e.bookingId) ? lienConversation(e) : `/logements/${encodeURIComponent(e.bienId)}`)
      : '/menages'
    // Un code à envoyer porte son geste en toutes lettres (demande de
    // Thierry) ; le bouton ouvre le fil, où l'envoi se valide.
    const fin = e.action
      ? `<span class="btn btn--primary" style="height: 40px">${esc(t(e.action === 'code' ? 'today.send_code' : 'today.view'))}</span>`
      : icone('i-chevron')
    return `<a class="event" href="${esc(href)}">
      <span class="event__time num">${esc(e.heure || '')}</span>
      <span class="tile-icon${e.action ? ' tile-icon--pending' : ''}" role="img" aria-label="${esc(libelle)}">${icone(arrivee ? 'i-arrival' : 'i-departure', 'icon icon--lg')}</span>
      <span style="min-width: 0">
        <span class="event__title">${esc(libelle)} · ${esc(e.bien)}</span>
        <span class="event__sub">${esc(sous.join(' · '))}</span>
      </span>
      ${fin}
    </a>`
  }).join('')
}

async function chargerReservations () {
  if (!peutLire('menages')) { etat.menagesOk = false; return }
  try {
    // Les réservations ACTIVES dont le départ est aujourd'hui ou plus tard :
    // les arrivées et départs du jour, « occupé ce soir » et la prochaine
    // arrivée. Lues par l'endpoint du planning ménage (coeur seul, aucun
    // provider), avec les ménages et les prestataires du même compte.
    const r = await appel(`/api/menages?from=${etat.aujourdHui}&to=${R.ajouterJours(etat.aujourdHui, 400)}`)
    etat.bookings = r.bookings || []
    etat.menages = r.menages || []
    etat.prestataires = r.prestataires || []
    etat.menagesOk = true
  } catch (e) {
    logger.error('Aujourdhui', 'reservations', e)
    etat.menagesOk = false
  }
}

// L'état du code d'accès (envoyé / créé non envoyé) et la date du dernier
// message par conversation : la preuve « code transmis » est un message
// sortant qui contient le code (api/messages.js, etatsDArrivee), et le
// dernier message date l'ouverture d'une conversation (règle des tâches).
async function chargerEtatsArrivee () {
  if (!peutLire('messages')) return
  const e = etat.ecran || {}
  // ⚠ LES DEUX MOITIÉS VIENNENT DU MÊME APPEL, mais elles ne portent pas la
  // même chose : `conversations` dit quelles réservations ont un fil (pour la
  // cible du lien), `etats_arrivee` dit l'état du code des seules arrivées du
  // jour et du lendemain.
  etat.conversations = new Set(Array.isArray(e.conversations) ? e.conversations.map(String) : [])
  etat.etatsArrivee = (e.etats_arrivee && typeof e.etats_arrivee === 'object') ? e.etats_arrivee : {}
}

async function chargerTaches () {
  if (!peutLire('messages')) return
  const t = etat.ecran && etat.ecran.taches
  // ⚠ `null` N'EST PAS `[]`. L'endpoint rend `null` quand il n'a PAS pu lire :
  // afficher « aucune tâche » serait affirmer un fait qu'on ignore.
  if (!Array.isArray(t)) { etat.tachesOk = false; return }
  etat.taches = t
  etat.tachesOk = true
}

function carteTache (tache, sombre) {
  const titre = tache.status === 'pending_validation' && tache.guest_name
    ? t('validate.reply_to', { name: tache.guest_name }) : t('validate.task')
  const texte = tache.status === 'pending_validation' && tache.suggested_reply ? tache.suggested_reply : (tache.summary || '')
  const href = `/messages?conv=${encodeURIComponent(tache.book_id || '')}`
  return { titre, texte, href, sombre }
}
// Les tâches encore À TRAITER (règle du 11 octobre : séjours à venir ou en
// cours seulement) — shared/aujourdhui.js, avec le repli sur les dates que la
// tâche porte elle-même (profil sans droit ménages, panne de /api/menages).
function tachesVisibles () {
  return R.tachesOuvertes(etat.taches, {
    bookings: etat.bookings, aujourdHui: etat.aujourdHui
  })
}
// ⚠ LA LISTE DES TACHES EST PLAFONNEE A 200 CHEZ LE SERVEUR, ET ELLE L'EST
// DEJA : le compte de Thierry porte 222 taches ouvertes. L'endpoint l'annonce
// dans `tronquees` — un signal que ce lot produisait et que PERSONNE ne lisait,
// si bien que l'ecran affichait un nombre exact que le serveur avait lui-meme
// marque comme un minorant.
function tachesPlafonnees () {
  const tr = etat.ecran && etat.ecran.tronquees
  return Array.isArray(tr) && tr.includes('taches')
}

function renderTaches () {
  const section = $('[data-bind="validate-section"]')
  const mobile = $('[data-bind="validate-mobile"]')
  if (!etat.tachesOk) { section.hidden = true; mobile.hidden = true; return }
  section.hidden = false
  const liste = $('[data-list="pending"]')
  const visibles = tachesVisibles()
  // ⚠ LE COMPTE DES CHOSES A TRAITER, HERITE DE LA LIGNE RESUME RETIREE (Q6).
  // Il compte ce que CE bloc contient, pas les trois sources de l'ancienne
  // ligne (tâches + arrivées à traiter + alarmes) : un nombre posé à côté d'un
  // titre doit décrire la liste qui le suit, sinon il la contredit à chaque
  // ouverture. Les arrivées portent déjà leur geste dans le bloc du haut, et
  // l'alarme est un bandeau qu'on ne peut pas manquer.
  // ⚠ ET LE « + » SURVIT : le serveur plafonne à 200, et le compte de Thierry
  // est DEJA plafonné (222 tâches ouvertes). Afficher « 200 » serait un nombre
  // faux avec aplomb.
  $('[data-bind="validate-count"]').textContent = visibles.length
    ? (tachesPlafonnees() ? t('validate.count_capped', { n: visibles.length }) : I18n.num(visibles.length))
    : ''
  if (!visibles.length) {
    liste.innerHTML = `<p class="muted small">${esc(t('validate.empty'))}</p>`
    mobile.hidden = true
    return
  }
  liste.innerHTML = visibles.slice(0, 3).map(x => {
    const c = carteTache(x)
    return `<div class="card">
      <span style="font-weight: var(--fw-semibold)">${esc(c.titre)}</span>
      ${c.texte ? `<span class="small muted clamp-2" style="line-height: 1.5">${esc(c.texte)}</span>` : ''}
      <a class="btn btn--primary" style="height: 40px" href="${esc(c.href)}">${esc(t('validate.view'))}</a>
    </div>`
  }).join('') + (visibles.length > 3
    ? `<a class="link small" href="/messages?filtre=avalider">${
      esc(tachesPlafonnees()
        ? t('validate.capped', { n: visibles.length - 3 })
        : t('validate.more', { n: visibles.length - 3 }))}</a>` : '')
  const premiere = carteTache(visibles[0])
  mobile.hidden = false
  mobile.href = premiere.href
  mobile.innerHTML = `<span class="caption" style="opacity: .8">${esc(t('validate.title'))}</span>
    <span style="font-weight: var(--fw-bold)">${esc(premiere.titre)}</span>
    ${premiere.texte ? `<span class="small clamp-2">${esc(premiere.texte)}</span>` : ''}
    ${visibles.length > 1 ? `<span class="caption" style="opacity: .8">${esc(
      tachesPlafonnees() ? t('validate.capped', { n: visibles.length - 1 })
        : t('validate.more', { n: visibles.length - 1 }))}</span>` : ''}`
}

// ─── 4. Fait pour vous, 7 jours ─────────────────────────────────────────────
// Chaque tuile est une REQUÊTE DE COMPTE sur le coeur, et n'apparaît que si le
// profil a le droit de lire la table (sinon la RLS rendrait 0, un faux zéro).
// « Messages envoyés » n'y est PAS : message_sent_log est aussi écrit en Mode
// Test et ne dit pas si le voyageur a reçu le message (KB aujourdhui.md §3).
// ⚠ `compter()` A DISPARU, ET AVEC LUI QUATRE LECTURES DU NAVIGATEUR.
// Les trois comptages de « Fait pour vous » — ménages acceptés, prix poussés
// par le moteur, surréservations — étaient des `head: true` faits en direct
// sous RLS, plus un appel à `/api/messages?stats=ia`. Ils viennent maintenant
// de l'appel d'écran, où ils tournent en parallèle avec le reste.
//
// ⚠ ET LE DROIT SE VÉRIFIE DÉSORMAIS CÔTÉ SERVEUR, ce qui est un durcissement
// et pas une simple économie : `price_display_log` a une RLS
// `user_id = auth.uid()`, donc le navigateur ne pouvait de toute façon lire
// que le sien. L'endpoint, lui, travaille en clé de service — qui CONTOURNE la
// RLS — donc il vérifie `estTitulaireDuCompte` explicitement. C'est la raison
// d'être de `requirePermission`, et la règle absolue du dépôt : un masquage
// par droit se double d'une garde serveur.
async function chargerCompteurs () {
  const f = (etat.ecran && etat.ecran.fait_pour_vous) || {}
  // ⚠ `null` = refusé ou illisible, et la tuile se masque. Un `0` affiché là
  // où on ne sait pas dirait « rien ne s'est passé cette semaine », ce qui est
  // un fait — et c'est précisément ce que la dette 62 interdit (la tuile des
  // codes d'accès est masquée pour cette raison, pas affichée à zéro).
  const defs = [
    { icon: 'i-ai', cle: 'done.ia_messages', n: f.messages_ia },
    { icon: 'i-cleaning', cle: 'done.cleanings', n: f.menages },
    { icon: 'i-price', cle: 'done.prices', n: f.prix },
    { icon: 'i-shield', cle: 'done.overbooking', n: f.surreservation }
  ]
  etat.compteurs = defs.filter(d => d.n != null)
}
function renderCompteurs () {
  const section = $('[data-bind="done-section"]')
  section.hidden = !etat.compteurs.length
  $('[data-list="done"]').innerHTML = etat.compteurs.map(c => `<div class="stat">
    ${icone(c.icon, 'icon icon--lg')}
    <span class="kpi num">${esc(I18n.num(c.n))}</span>
    <span class="caption">${esc(t(c.cle, { n: c.n }))}</span>
  </div>`).join('')
}

// ─── 5. Derniers avis ───────────────────────────────────────────────────────
// ⚠ DEUX SOURCES, UN SEUL BLOC, ET ELLES PEUVENT ECHOUER SEPAREMENT. Les
// commentaires viennent de `derniers_avis`, la moyenne et le compte de `notes`
// — deux lectures du meme appel d'ecran. Une moyenne illisible ne doit pas
// emporter les commentaires, ni l'inverse : la vue tranche les deux.
async function chargerDerniersAvis () {
  const e = etat.ecran || {}
  // ⚠ LE REFUS SE LIT DANS LA REPONSE, PAS DANS LE NAVIGATEUR. `peutLire('avis')`
  // repond pour le compte courant ; c'est le SERVEUR qui a tranche pour le
  // compte CONSULTE, et il le dit dans `refuses`. Les deux divergent sur un
  // compte delegue — exactement le defaut de la classe « masquage par droit ».
  etat.avisRefuse = Array.isArray(e.refuses) && e.refuses.includes('avis')
  // ⚠ « PAS ENCORE DEMANDE » N'EST PAS « PAS LISIBLE ». Le cache d'ecran ne
  // porte plus ce bloc (il descend un prenom de voyageur) : au premier
  // affichage la cle est ABSENTE, et la traiter comme `null` afficherait « Les
  // avis ne sont pas lisibles » a chaque ouverture, pendant un aller-retour.
  etat.avisConnu = Object.prototype.hasOwnProperty.call(e, 'derniers_avis')
  etat.derniersAvis = Array.isArray(e.derniers_avis) ? e.derniers_avis : null
}

function renderDerniersAvis () {
  const section = $('[data-bind="reviews-section"]')
  const vue = vueDesAvis({
    derniers: etat.derniersAvis,
    notes: etat.noteGlobale ? { global: etat.noteGlobale } : null,
    biens: Array.isArray(etat.biens) ? etat.biens : [],
    refuse: etat.avisRefuse,
    connu: etat.avisConnu,
    perimetreVide: !!(etat.ecran && etat.ecran.perimetre_vide)
  })
  const outils = { t, esc, icone, nombre: (x, d = 1) => I18n.num(x, { minimumFractionDigits: d, maximumFractionDigits: d }), libelleDuCanal, dateEnClair }
  // ⚠ ON EFFACE, PUIS ON MASQUE — JAMAIS L'INVERSE, ET JAMAIS L'UN SANS
  // L'AUTRE. `hidden` cache, il n'efface pas : des cartes laissees dans le DOM
  // restent lisibles dans la source. Le cas reel se produit en deux temps —
  // un premier affichage rend les avis, puis la reponse du serveur refuse le
  // droit (membre revoque en cours de session). Le module rend la chaine vide
  // pour tous les etats muets ; il suffit de l'ecrire.
  $('[data-bind="reviews-head"]').innerHTML = enTeteAvisHtml(vue, outils)
  $('[data-list="reviews"]').innerHTML = blocAvisHtml(vue, outils)
  section.hidden = MUETS.has(vue.etat)
  // ⚠ LA SUITE SE RE-ARME A CHAQUE RENDU, parce que ce rendu REMPLACE le
  // contenu : la sentinelle d'avant a disparu avec, et l'observateur d'avant
  // pointerait un noeud detache. Un rendu arrive aussi quand la moyenne
  // arrive apres les cartes, ou au changement de compte.
  armerLaSuiteDesAvis(vue, outils)
}

// ─── LA SUITE DES AVIS, AU DEFILEMENT ───────────────────────────────────────
//
// ⚠ TROIS AU DEPART, PUIS TROIS PAR TROIS, ET SEULEMENT SUR 30 JOURS.
// Decision de Thierry du 28 octobre 2026, option 3 : « 30 jours, puis un lien
// vers /avis ». Mesure en production le meme jour : 16 avis avec texte sur
// 30 jours contre 645 au total — paginer jusqu'au premier avis aurait fait de
// l'accueil un second /avis, et rendu FAUX le compte de son propre en-tete
// (« N avis notes sur 30 jours »).
//
// ⚠ UN SEUL MECANISME POUR LES DEUX ECRANS, et c'est ce qui le rend juste :
// `IntersectionObserver` avec la FENETRE pour racine. A l'ordinateur,
// `.grid-avis` est une grille de trois colonnes qui s'allonge vers le bas, et
// la sentinelle entre dans la fenetre quand la PAGE defile. Au telephone,
// c'est un rail horizontal (`.scroll-x`, `overflow-x: auto`) : la sentinelle
// est alors hors de la zone visible de ce rail, et le navigateur tient compte
// du rognage des ancetres — elle n'intersecte donc la fenetre qu'une fois le
// rail defile jusqu'a elle. Deux gestes differents, une seule regle.
//
// ⚠ ET LE BLOC RESTE EN LECTURE SEULE (spec §3) : aucune action n'est ajoutee,
// la derniere carte est un LIEN vers /avis.
let sentinelleAvis = null
// ⚠ ON N'OBSERVE QU'APRES LE PREMIER DEFILEMENT, ET C'EST UNE MESURE QUI L'A
// DECIDE. Le vrai `IntersectionObserver` appelle son rappel DES LA PREMIERE
// OBSERVATION si la cible est dans la fenetre — il ne demande aucun geste.
// Mesure au banc chrome-headless le 28 octobre 2026, sur le BALISAGE REEL de
// cette page, dans le cas « journee vide » (celui que la retouche 3 raccourcit
// le plus, donc le pire) :
//   ordinateur 1280x900 : haut de la sentinelle a 1077 px, fenetre 900 px,
//     `rootMargin` 200 px -> 1077 < 1100, DONC ELLE INTERSECTE AU CHARGEMENT ;
//   telephone   390x844 : bord gauche a 858 px, hors de 390 + 200 -> non.
// Sans cette garde, l'accueil partait donc a TROIS appels au chargement sur
// ordinateur, alors que son budget est de DEUX et qu'un test le garde. Et
// « quand on fait defiler on charge » sont les mots de la demande : le geste
// fait partie du contrat, ce n'est pas un garde-fou de performance ajoute
// par-dessus.
// ⚠ `capture: true` ATTRAPE AUSSI LE DEFILEMENT DU RAIL. Un evenement `scroll`
// ne remonte pas (il ne bouillonne pas) : sans la phase de capture, defiler le
// rail des avis au telephone — le seul geste possible la-bas — n'armerait
// jamais rien.
let aDefile = false
const auPremierDefilement = []
if (typeof window.addEventListener === 'function') {
  window.addEventListener('scroll', () => {
    aDefile = true
    while (auPremierDefilement.length) auPremierDefilement.pop()()
  }, { capture: true, passive: true, once: true })
}

function armerLaSuiteDesAvis (vue, outils) {
  if (sentinelleAvis) { sentinelleAvis.disconnect(); sentinelleAvis = null }
  const zone = $('[data-list="reviews"]')
  if (!zone || vue.etat !== 'liste') return
  // Le curseur part de la DERNIERE carte rendue — la plus ancienne des trois.
  const der = vue.cartes[vue.cartes.length - 1]
  if (!der || !der.recu_le || der.id == null) return
  let curseur = { recu_le: String(der.recu_le), id: String(der.id) }
  let enCours = false

  // ⚠ `IntersectionObserver` N'EXISTE PAS PARTOUT, et son absence ne doit pas
  // retirer les trois premieres cartes. Sans lui, le bloc reste ce qu'il
  // etait : trois avis et le lien de l'en-tete.
  if (typeof window.IntersectionObserver !== 'function') return

  const marque = document.createElement('div')
  marque.setAttribute('data-bind', 'reviews-sentinelle')
  marque.className = 'avis-suite'
  zone.appendChild(marque)

  // ⚠ CHAQUE ARMEMENT GARDE **SON** OBSERVATEUR DANS UNE LOCALE, et tout ce qui
  // suit verifie qu'il est encore celui du module. C'est le constat GRAVE de la
  // review du 28 octobre 2026, et il cassait la fonction dans le chemin NORMAL :
  // `renderDerniersAvis()` est appele DEUX FOIS a chaque chargement (l. 2851
  // depuis le cache, l. 2907 apres la lecture serveur). Le vrai
  // `IntersectionObserver` appelle son rappel DES LA PREMIERE OBSERVATION si la
  // cible est dans la fenetre — donc un chargement pouvait partir au rendu 1,
  // le rendu 2 remplacait `zone.innerHTML` (DETACHANT la sentinelle 1), puis la
  // promesse du rendu 1 se resolvait et : (a) `insertAdjacentHTML('beforebegin')`
  // sur un noeud sans parent LEVE en navigateur, (b) son `finir()` lisait le
  // `sentinelleAvis` de MODULE — devenu celui du rendu 2 — et le coupait. Plus
  // aucun chargement pour le reste de la session, sans rien a l'ecran.
  // ⚠ ET `enCours` NE SUFFISAIT PAS : il est par-closure, il serialise un
  // observateur avec lui-meme, jamais deux rendus entre eux.
  const mien = () => sentinelleAvis === mon && marque.parentNode
  let mon = null

  // La derniere carte du rail : le geste vers l'historique complet.
  const finir = () => {
    if (!mien()) return
    mon.disconnect()
    sentinelleAvis = null
    marque.innerHTML = `<a class="link small" href="/avis">${esc(t('reviews.all'))}</a>`
  }

  const suivante = async () => {
    if (enCours || !mien()) return
    enCours = true
    try {
      const r = await appel('/api/ecran/avis-recents'
        + `?depuis=${encodeURIComponent(curseur.recu_le)}`
        + `&apres_id=${encodeURIComponent(curseur.id)}`)
      // ⚠ `null` N'EST PAS `[]` ICI NON PLUS : une lecture qui a ECHOUE ne dit
      // pas « plus rien ». On arrete sans affirmer la fin, et le lien vers
      // /avis reste le chemin.
      // ⚠ ET AUCUN TEST NE DISTINGUE CETTE GARDE, mesure par mutation : la
      // retirer laisse la suite verte, parce que `vueDesAvis` rend lui aussi
      // l'etat « illisible » sur un `derniers` qui n'est pas un tableau, donc
      // zero carte et la meme sortie. Elle reste parce qu'elle dit le contrat a
      // l'endroit du choix — pas parce qu'elle change quelque chose aujourd'hui.
      // ⚠ ON REVERIFIE APRES L'ATTENTE. Un rendu a pu passer pendant l'appel :
      // ecrire dans une sentinelle detachee leve, et couper l'observateur
      // courant au nom d'un rendu perime est exactement le defaut d'avant.
      if (!mien()) return
      if (!r || !Array.isArray(r.avis)) { finir(); return }
      const vueSuite = vueDesAvis({
        derniers: r.avis,
        notes: null,
        biens: Array.isArray(etat.biens) ? etat.biens : [],
        connu: true
      })
      for (const c of vueSuite.cartes) {
        marque.insertAdjacentHTML('beforebegin', carteAvisHtml(c, outils))
      }
      const dernier = vueSuite.cartes[vueSuite.cartes.length - 1]
      if (r.fin || !dernier || !dernier.recu_le || dernier.id == null) { finir(); return }
      // ⚠ ET LE CURSEUR DOIT AVANCER. S'il ne bouge pas — un serveur qui rend
      // trois fois la meme ligne —, le defilement redemanderait la MEME page
      // indefiniment et empilerait les doublons sans borne. On s'arrete, et le
      // lien vers /avis reste le chemin. Constat de la review du 29 octobre.
      const neuf = { recu_le: String(dernier.recu_le), id: String(dernier.id) }
      if (neuf.recu_le === curseur.recu_le && neuf.id === curseur.id) { finir(); return }
      curseur = neuf
    } catch (e) {
      logger.error('Aujourdhui', 'avis-suite', e)
      finir()
    } finally {
      enCours = false
    }
  }


  // `rootMargin` : on charge AVANT que la sentinelle soit vraiment visible,
  // pour que le defilement ne s'arrete pas sur un trou.
  // ⚠ LE RAPPEL **REND** SA PROMESSE. Le navigateur ignore cette valeur ; un
  // test, lui, ne peut pas attendre autrement — et sans l'attendre il asserte
  // AVANT le premier `await` interne d'`appel()`, donc avant que la requete
  // soit partie. C'est le faux vert « un test qui n'attend pas sa promesse »,
  // deja paye dans ce depot ; ici il s'est manifeste a l'envers, en faux
  // ROUGE, ce qui est la chance de l'histoire.
  mon = new window.IntersectionObserver((entrees) => {
    if (entrees.some(x => x.isIntersecting)) return suivante()
  }, { rootMargin: '200px' })
  sentinelleAvis = mon
  // Le geste d'abord, l'observation ensuite. Si l'hote a deja defile une fois
  // dans la session, on observe tout de suite.
  if (aDefile) mon.observe(marque)
  else auPremierDefilement.push(() => { if (mien()) mon.observe(marque) })
}

// ─── 6 et 7. LES DEUX APPELS A `/api/yield` PAR BIEN SONT RETIRES ───────────
//
// ⚠ C'EST LE GAIN DE PERFORMANCE LE PLUS GROS DE TOUTE LA REFONTE, et il etait
// chiffre dans CLAUDE.md avant d'etre fait. Mesure du 22 octobre 2026 en
// production, compte reel a 4 logements : `/api/yield`, appele DEUX FOIS PAR
// BIEN, portait 72 requetes Supabase et 586 Ko — a lui seul 72 % des requetes
// de la page, pour du CA et du TO sur 30 jours, c'est-a-dire exactement de la
// donnee NON URGENTE.
//
// `chargerChiffresBien` alimentait trois affichages, et les trois ont trouve
// leur place :
//   · le CA 30 j par bien -> remplace par le bloc « Revenus nets », en mois de
//     VERSEMENT (decision Q3 de Thierry, inventaire I29) ;
//   · les min/max mensuels sur 12 mois -> deplaces dans la fiche du logement,
//     bloc Prix (Q4, I30) ;
//   · le repli « non raccorde » (409) -> la page /logements le dit deja.
//
// ⚠ ET LA MOITIE DEPLACEE N'EST PAS ENCORE ARRIVEE : c'est la DETTE 96, et
// c'est la seule perte reelle de ce retrait. Les min/max par bien quittent la
// production aujourd'hui et la fiche du logement ne les porte pas encore. La
// dette nomme le fichier de spec ou les ecrire et les trois fonctions pures de
// `shared/aujourdhui.js` conservees POUR ce report — `occupation`,
// `minMaxMensuel`, `totaux`. Elles n'ont plus aucun consommateur de production
// depuis l'etape 1 ; si le lot Logements tranche autrement, elles se
// supprimeront avec lui, mais pas en silence.
//
// `etat.parBien` disparait avec cet appel.

async function chargerNotes () {
  if (!peutLire('avis')) return
  // ⚠ LA SOURCE CHANGE, LES GARDES RESTENT — et c'est délibéré. Ce bloc venait
  // de `/api/avis?action=notes` ; il vient maintenant de l'appel d'écran, qui
  // appelle la MÊME fonction `notesDuPerimetre` côté serveur. Tout le
  // raisonnement ci-dessous sur `tronque` et sur « les deux côtés jugent la
  // même chose » reste valable mot pour mot, et il a été payé par deux
  // mesures : il ne se jette pas parce que la source a changé.
  const r = (etat.ecran && etat.ecran.notes) || null
  if (r && r.tronque) logger.error('Aujourdhui', 'avis', 'lecture des notes incomplete')
  const lu = r && !r.tronque && r.global && typeof r.global === 'object' ? r : null
  // ⚠ LA NOTE GLOBALE RESTE DANS L'ETAT, ET ELLE EST LUE. La revue l'a trouvee
  // en ecriture seule apres le retrait de la bande « 30 jours » (constat
  // FAIBLE 1) ; plutot que de la supprimer, l'etape 2 la REBRANCHE : c'est elle
  // que l'en-tete du bloc « Derniers avis » affiche. Une seule memoire de la
  // note dans la page, au lieu de deux lectures de `etat.ecran.notes`.
  etat.noteGlobale = lu ? lu.global : null
  // ⚠ `notesParBien` A ETE RETIREE A L'ETAPE 4, ET C'EST LA DEUXIEME FOIS QUE
  // CETTE MEMOIRE SE TROUVE EN ECRITURE SEULE. La revue de l'etape 2 avait fait
  // le constat pour `noteGlobale` apres le retrait de la bande « 30 jours » ;
  // celle-ci a survecu parce que l'ETOILE de chaque carte de logement la lisait.
  // Les cartes partent avec le bloc « Vos logements » (inventaire I28), donc
  // plus personne ne lit la Map : la garder serait garder du code mort, et un
  // code mort fait croire qu'une donnee est disponible.
  //
  // ⚠ ET LE GARDE-FOU `hasOwnProperty` QU'ELLE PORTAIT NE DISPARAIT PAS : il
  // protegeait d'un bien dont la cle provider vaudrait `constructor`, `toString`
  // ou `valueOf` — une lecture directe de `par_bien[ref]` rendrait alors une
  // FONCTION heritee d'Object, vraie, donc le repli ne serait jamais pris. La
  // regle vit maintenant la ou `par_bien` est encore lu : cote serveur, dans
  // `lib/stats-avis.js`. Son test est transpose dans
  // `tests/accueil-rapide.test.js`, qui verifie que l'accueil n'affiche plus de
  // note PAR BIEN du tout — ce qui est la seule chose qu'on puisse encore
  // garder ici.
  //
  // La note par bien revient a la fiche du logement : /logements la rend deja.
  renderRevenus()
}

// ⚠ `renderKpis` A ETE RETIREE AVEC LA BANDE « 30 jours » (etape 1). Ce qu'elle
// rendait ne disparait pas pour autant : la NOTE revient a l'etape 2, en tete du
// bloc « Derniers avis », avec la meme regle — elle descend deja sur 5 et ne se
// redivise jamais ; les REVENUS reviennent a l'etape 4, en mois de versement ;
// l'OCCUPATION et les min/max mensuels partent dans la fiche du logement.
// `chargerNotes` reste : les etoiles des cartes de logement en vivent.
// ⚠ `quand()` EST PARTIE AVEC LES CARTES DE LOGEMENT. Elle rendait
// « aujourd'hui » ou « lun. 3 nov. » pour la prochaine arrivee d'un bien ; cet
// affichage vit maintenant sur /logements. Une fonction sans appelant qui lit
// une cle i18n fait croire que la cle est utilisee, et la cle survit au
// nettoyage — c'est ainsi qu'un dictionnaire grossit de textes que personne ne
// voit jamais.
// ─── Le bloc « Revenus nets » (etape 4) ─────────────────────────────────────
//
// ⚠ IL REMPLACE `renderBiens`, QUI PEIGNAIT LES CARTES DE LOGEMENT. Ce qui
// disparait de l'accueil est trace element par element dans
// docs/specs/inventaire-aujourdhui.md (I25 a I32) : les cartes vivent sur
// /logements, qui les rend mieux (photo, note, occupation, prochaine arrivee),
// et le lien « Voir tout » part avec le bloc. L'occupation 30 j et les min/max
// mensuels sont PROMIS a la fiche du logement et n'y sont pas encore : c'est la
// dette 96, et c'est la seule perte reelle de ce remplacement.
//
// ⚠ ET LE BLOC N'AFFICHE QUE DES FAITS. Un montant non calculable ne vaut pas
// zero, un BRUT n'est pas un net, et un sejour qu'on ne sait pas ranger est
// compte a part — jamais saute. Les trois se ressemblent dans une somme et ne
// disent pas la meme chose.

// Les centimes du coeur, en monnaie de l'hote. ⚠ `null` N'EST PAS ZERO : la
// fonction rend `null`, et l'appelant decide du texte.
const euros = (cents, devise) =>
  (Number.isFinite(cents) ? monnaie(cents / 100, devise) : null)

/**
 * Repartir des centimes en EUROS ENTIERS dont la somme vaut l'arrondi de LEUR
 * PROPRE somme.
 *
 * ⚠ ELLE NE PREND PLUS DE TOTAL EN PARAMETRE, ET C'EST UN CORRECTIF (releve par
 * la session chef de file le 27 octobre 2026). Ma premiere version recevait
 * `T.recu_cents` — l'agregat de TOUT le compte — alors que la liste ne porte
 * que les biens AFFICHES. Les deux ne coincident pas toujours :
 * `revenus_du_mois` groupe par `property_uuid` sans jointure sur `properties`,
 * donc un sejour d'un logement SUPPRIME garde son uuid, entre dans le total, et
 * n'a aucune ligne a l'ecran.
 *
 * Consequences mesurees : l'invariant tombait des que l'ecart depassait le
 * nombre de lignes (la boucle n'ajoute qu'un euro par ligne), et surtout les
 * euros manquants se posaient sur les lignes des biens VIVANTS — une ligne
 * portait de l'argent qui n'est pas le sien.
 *
 * En calculant sa cible elle-meme, la fonction rend ce mesusage IMPOSSIBLE.
 *
 * ⚠ ET CE QUI RESTE EST DIT A L'HOTE, contrairement a ce que j'avais ecrit ici.
 * J'avais recopie « la reserve `hors_biens` ne compte que les `property_uuid`
 * NULS » — c'etait vrai de la migration 3, REMPLACEE depuis. La migration 5
 * (`2026-10-26-revenus-hors-biens.sql`), celle qui est deployee, compte aussi
 * les uuid dont `not exists (select 1 from properties …)`, donc les logements
 * supprimes. L'ecran rend alors la reserve : « N sejours rattaches a aucun de
 * vos logements : X € dans le total, SUR AUCUNE LIGNE ». Le bandeau peut donc
 * depasser la somme des lignes, et la phrase qui l'explique est juste dessous.
 * Verifie contre la production le 27 octobre 2026 : zero uuid orphelin
 * aujourd'hui, et le filtre `not exists` est bien dans la fonction deployee.
 *
 * ⚠ RECETTE DE THIERRY, 27 octobre 2026 : « A venir octobre affiche 935 €
 * alors que les lignes font 168 + 160 + 608 = 936 ». Ce n'est pas un calcul
 * faux, c'est de l'arithmetique : `I18n.money` arrondit a l'euro
 * (`maximumFractionDigits: 0`), et arrondir chacun puis sommer ne donne pas
 * arrondir la somme. Mesure du jour :
 *   167,68 + 159,54 + 608,04 = 935,26
 *   arrondis un par un : 168 + 160 + 608 = 936
 *   arrondi de la somme :                  935
 *
 * METHODE DU PLUS FORT RESTE. On arrondit chacun VERS LE BAS, puis on
 * distribue les euros manquants aux lignes dont la partie decimale est la plus
 * grande, jusqu'a atteindre la cible. Ici : 167 + 159 + 608 = 934, il manque 1,
 * et la plus forte decimale est ,68 — donc 168, 159, 608 = 935.
 *
 * ⚠ CE QUE CA COUTE, ET IL FAUT LE DIRE : une ligne peut afficher 1 € de moins
 * que son propre arrondi (159 pour 159,54). C'est le prix de la concordance, et
 * c'est le choix de Thierry — « arrondir de facon que les lignes et le total
 * concordent a l'euro ». L'alternative serait d'afficher les centimes partout,
 * ou le probleme n'existe pas.
 *
 * ⚠ LES MONTANTS NEGATIFS PASSENT (un remboursement en porterait), ET LE RESTE,
 * LUI, N'EST JAMAIS NEGATIF. Ma premiere version portait une seconde boucle
 * pour ce cas, et mon message de commit affirmait l'avoir eprouvee — le test
 * passait en realite par le chemin positif. Deux mesures l'ont montre : une
 * mutation qui retirait la boucle ne faisait rougir aucun test, puis 300 000
 * tirages de -6 000 a +6 000 € n'ont jamais produit un reste negatif.
 *
 * L'algebre le dit aussi : `floor(e) <= e` donc `Somme(floor) <= Somme(e)`, et
 * `round(S) >= S - 0,5` ; donc `reste >= -0,5`, et comme il est ENTIER,
 * `reste >= 0`. La boucle etait du code mort deguise en precaution — la forme
 * la plus couteuse, parce qu'elle se lit comme une garantie.
 */
function repartirEnEuros (listeCents) {
  const somme = listeCents.reduce((a, c) => a + (Number(c) || 0), 0)
  const cible = Math.round(somme / 100)
  const euro = listeCents.map(c => (Number(c) || 0) / 100)
  const bas = euro.map(e => Math.floor(e))
