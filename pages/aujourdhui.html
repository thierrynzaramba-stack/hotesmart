<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- ⚠ LA LANDING NE RECHAUFFE PLUS LE CDN. Avant le 20 octobre 2026, un hote
     connecte passait par `/`, qui chargeait supabase-js : la poignee de main
     jsdelivr et le cache HTTP etaient deja faits en arrivant ici. La sonde de la
     landing part maintenant AVANT tout contact avec le CDN — cette page paie
     donc le cout a froid, et elle ne decouvrait l'URL qu'apres avoir lu
     shared/supabase.js, soit un niveau d'aller-retour de plus.
     Le prechargement est sur l'URL EPINGLEE : c'est l'epinglage qui le rend sur.
     `tests/accueil-rapide.test.js` refuse qu'elle s'ecarte de shared/supabase.js
     — deux versions divergentes, ce serait deux telechargements. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « AUJOURD'HUI » — refonte UI V5, lot 1. Spec : docs/specs/spec-refonte-ui-v5.md §4.
     KB : docs/kb/aujourdhui.md (sources de chaque chiffre, et ce qui n'est PAS affiché).
     RÈGLES : aucun hexa, aucun texte en dur, aucune icône dessinée ici.
     Couleurs → theme.css · Textes → i18n/*.json · Icônes → icons.svg
     Règles de comptage → shared/aujourdhui.js (fonctions pures, testées). -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page">

  <!-- Alarme de surréservation : reprise de l'ancien accueil (pages/index.html).
       Son bouton est le SEUL moyen d'arrêter la réémission des SMS
       (spec-reservation-manuelle.md §4). Vide et invisible sans alarme. -->
  <div class="stack" data-list="alarms" hidden></div>

  <!-- 1. Titre -->
  <div class="row" style="flex-wrap: wrap; align-items: flex-end; gap: var(--gap-m)">
    <div style="flex: 1 1 300px">
      <h1 class="h1" data-bind="greeting"></h1>
      <p class="muted" style="margin-top: 6px; font-size: 16px" data-bind="summary" data-i18n="common.loading"></p>
    </div>
    <a class="btn btn--outline btn--lg" href="/logements/nouveau" data-bind="add-property" hidden>
      <svg class="icon" style="width:16px;height:16px" aria-hidden="true"><use href="/shared/icons.svg#i-plus"/></svg>
      <span data-i18n="today.add_property"></span>
    </a>
  </div>

  <!-- Mobile : « À valider » devient UNE carte sombre en tête (spec §4) -->
  <a class="card card--dark only-mobile" data-bind="validate-mobile" hidden></a>

  <!-- 2 + 3. Aujourd'hui / À valider -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; align-items: start">

    <section style="grid-column: span 2; min-width: 0" aria-labelledby="h-today">
      <h2 class="h2" id="h-today" style="margin-bottom: 8px" data-i18n="today.title"></h2>
      <div data-list="events"><p class="muted" data-i18n="common.loading"></p></div>
    </section>

    <section class="stack only-desktop" style="gap: 12px" aria-labelledby="h-validate" data-bind="validate-section" hidden>
      <h2 class="h2" id="h-validate" data-i18n="validate.title"></h2>
      <div class="stack" style="gap: 12px" data-list="pending"></div>
      <a class="link small" href="/messages" data-i18n="validate.settings"></a>
    </section>
  </div>

  <!-- 4. Fait pour vous : seulement les tuiles COMPTÉES (voir le KB) -->
  <section class="stack" style="gap: var(--gap-m)" aria-labelledby="h-done" data-bind="done-section" hidden>
    <div class="section-head"><h2 class="h2" id="h-done" data-i18n="done.title"></h2><span class="muted" data-i18n="done.period"></span></div>
    <div class="grid-auto scroll-x" data-list="done"></div>
  </section>

  <!-- 5. 30 jours (totaux du compte) -->
  <section style="display: flex; flex-wrap: wrap; gap: 48px; padding: 28px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line)" data-bind="kpi-section" hidden>
    <div class="stack" style="gap: 4px" data-bind="kpi-revenue" hidden><span class="small muted" data-i18n="kpi.revenue"></span><span class="row" style="align-items: baseline; gap: 10px" data-bind="revenue"></span></div>
    <div class="stack" style="gap: 4px" data-bind="kpi-rating" hidden><span class="small muted" data-i18n="kpi.rating"></span><span class="row" style="align-items: baseline; gap: 10px" data-bind="rating"></span></div>
    <div class="stack" style="gap: 4px" data-bind="kpi-occupancy" hidden><span class="small muted" data-i18n="kpi.occupancy"></span><span class="row" style="align-items: baseline; gap: 10px" data-bind="occupancy"></span></div>
  </section>

  <!-- 6. Logements -->
  <section class="stack" style="gap: 20px" aria-labelledby="h-props" data-bind="props-section" hidden>
    <div class="section-head"><h2 class="h2" id="h-props" data-i18n="properties.title"></h2><a class="link small" href="/logements" data-i18n="properties.see_all"></a></div>
    <div class="property-grid scroll-x" data-list="properties"></div>
  </section>
</main>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { requireAuth } from '/components/auth-guard.js'
import { supabase, signOut } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { logger } from '/shared/logger.js'
import { escapeHtml as esc } from '/shared/properties.js'
// ⚠ `enteteCompte()` sur chaque fetch : les endpoints lus ici honorent X-Compte
// (compteDelegue) ; sans l'en-tête, un membre verrait SON compte pendant que
// les lectures Supabase, juste à côté, lisent le compte consulté.
import { compteCourant, moi, peutLire, peutEcrire, estTitulaire, comptes, basculerVers, enteteCompte }
  from '/shared/compte-courant.js'
import * as R from '/shared/aujourdhui.js'
import * as CacheEcran from '/shared/cache-ecran.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (sel) => document.querySelector(sel)
const icone = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="/shared/icons.svg#${id}"/></svg>`

// ─── État de la page : chaque lecture le complète, chaque rendu le relit ────
const etat = {
  aujourdHui: R.jourParis(),
  biens: [], bookings: [], menages: [], prestataires: [],
  menagesOk: null, etatsArrivee: {}, conversations: new Set(),
  taches: [], tachesOk: null,
  alarmes: [],
  parBien: new Map(), notesParBien: new Map(), noteGlobale: null,
  compteurs: [],
  // La réponse de `/api/ecran/aujourdhui` — un seul appel pour six blocs.
  ecran: null,
  // L'âge des données affichées, quand elles viennent du cache. `null` = elles
  // viennent du serveur.
  ageCache: null
}

// ⚠ UN SEUL APPEL POUR SIX BLOCS — lot (b) du chantier performance.
// Il remplace CINQ appels (`incidents-acquitter`, `messages`,
// `messages?stats=ia`, `avis?action=notes`) et CINQ lectures directes du
// navigateur sous RLS (`properties`, `agent_tasks`, et trois comptages).
//
// ⚠ ET IL NE PASSE PLUS PAR `/api/messages`. Mesure du 22 octobre 2026 contre
// la production : cet appel coûtait 18 requêtes et 437 212 octets — 42 % du
// poids de la page — pour deux champs (`arrivee.codeEtat` et la liste des
// réservations qui ont un fil). L'endpoint d'écran les lit directement :
// 1 requête et 3 244 octets pour les fils, 2 requêtes pour l'état du code.
//
// ⚠ CE QU'IL NE REMPLACE PAS, ET C'EST ASSUMÉ : `/api/menages` (la fenêtre de
// 400 jours, domaine ménage, repliée au lot (d)) et `/api/yield` (le CA et le
// TO, remplacés par des tables de résumé au lot (c)).
async function chargerEcran () {
  etat.ecran = await appel('/api/ecran/aujourdhui')
  return etat.ecran
}

// fetch d'un endpoint, avec la session et le compte consulté.
async function appel (chemin) {
  const { data: { session } } = await supabase.auth.getSession()
  const r = await fetch(chemin, {
    headers: { Authorization: 'Bearer ' + session.access_token, ...enteteCompte() }
  })
  const corps = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(corps.error || `HTTP ${r.status}`); e.status = r.status; throw e }
  return corps
}

// Exécute des tâches asynchrones par paquets : /api/yield lit tout l'historique
// du compte à chaque appel, on ne lance pas dix lectures d'un coup.
async function parPaquets (taches, taille) {
  for (let i = 0; i < taches.length; i += taille) {
    await Promise.allSettled(taches.slice(i, i + taille).map(f => f()))
  }
}

// Une date calendaire de Paris (YYYY-MM-DD) affichée telle quelle, quel que soit
// le fuseau du navigateur : midi UTC, formaté en UTC.
function dateDuJour (jour, opts) {
  const [a, m, d] = jour.split('-').map(Number)
  return I18n.date(new Date(Date.UTC(a, m - 1, d, 12)), { ...opts, timeZone: 'UTC' })
}
const monnaie = (n, devise) => I18n.money(n, devise || 'EUR')

// ▲ / ▼ / = + valeur ; jamais la couleur seule (spec §2, statuts).
function delta (v, formatte) {
  if (v == null) return ''
  // Le sens suit la valeur AFFICHÉE : « ▼ 0 % » pour -0,3 % se contredirait.
  const arrondi = Math.round(v * 100)
  const cle = arrondi > 0 ? 'kpi.up' : arrondi < 0 ? 'kpi.down' : 'kpi.same'
  return `<span class="delta" title="${esc(t('kpi.delta_hint'))}">${esc(t(cle, { v: formatte }))}</span>`
}
const deltaPct = v => delta(v, v == null ? '' : I18n.pct(Math.abs(v)))
const deltaPoints = v => delta(v, v == null ? '' : t('kpi.points', { v: I18n.num(Math.abs(v * 100), { maximumFractionDigits: 0 }) }))

// ─── 1. Titre et sous-titre comptés ─────────────────────────────────────────
function renderTitre () {
  const evts = evenements()
  const arrivees = evts.filter(e => e.type === 'arrivee').length
  const departs = evts.filter(e => e.type === 'depart').length
  const todos = evts.filter(e => e.action).length + tachesVisibles().length + etat.alarmes.length
  const el = $('[data-bind="summary"]')
  el.removeAttribute('data-i18n')
  el.textContent = t('today.summary', {
    date: dateDuJour(etat.aujourdHui, { weekday: 'long', day: 'numeric', month: 'long' }),
    arrivals: t('today.arrivals', { n: arrivees }),
    departures: t('today.departures', { n: departs }),
    todos: t('today.todos', { n: todos })
  })
}

// ─── Alarmes de surréservation ──────────────────────────────────────────────
function nomDuBien (ref) {
  const b = etat.biens.find(x => String(x.id) === String(ref) || String(x.provider_property_id) === String(ref))
  return b ? b.name : null
}
function renderAlarmes () {
  const zone = $('[data-list="alarms"]')
  zone.hidden = !etat.alarmes.length
  const acquittable = peutEcrire('reservations')
  zone.innerHTML = etat.alarmes.map(a => {
    const nom = nomDuBien(a.property_id)
    return `<div class="alert" role="alert">
      ${icone('i-alert', 'icon icon--lg')}
      <span class="alert__title">${esc(nom ? t('alarm.title', { name: nom }) : t('alarm.title_anon'))}</span>
      <span class="small">${esc(a.detail?.message || t('alarm.default'))}</span>
      <span class="caption muted">${esc(t('alarm.since', { date: I18n.date(new Date(a.created_at), { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) }))}</span>
      ${acquittable ? `<button type="button" class="btn btn--primary" data-acquitter="${esc(a.id)}">${esc(t('alarm.ack'))}</button>` : ''}
    </div>`
  }).join('')
  zone.querySelectorAll('[data-acquitter]').forEach(b => b.addEventListener('click', () => acquitter(b)))
}
async function chargerAlarmes () {
  // Vient de l'appel d'écran. `null` = droit refusé ou lecture indisponible —
  // dans les deux cas on n'affiche aucune alarme, et on ne prétend pas qu'il
  // n'y en a pas.
  const a = etat.ecran && etat.ecran.alarmes
  etat.alarmes = Array.isArray(a) ? a : []
}

async function acquitter (b) {
  b.disabled = true
  b.textContent = t('alarm.acking')
  try {
    const { data: { session } } = await supabase.auth.getSession()
    const rep = await fetch('/api/incidents-acquitter', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json', ...enteteCompte() },
      body: JSON.stringify({ id: b.dataset.acquitter })
    })
    if (!rep.ok) throw new Error('echec')
    // ⚠ ON RETIRE LA LIGNE ICI, ET ON REND. `chargerAlarmes()` ne fait plus de
    // réseau depuis ce lot : elle relisait `etat.ecran.alarmes`, la réponse
    // CAPTURÉE AU CHARGEMENT, qui contient encore l'incident qu'on vient
    // d'acquitter — et aucun rendu ne suivait. L'hôte voyait le bouton rester
    // désactivé sur « Acquittement… », l'alarme rester à l'écran, puis, en
    // cliquant de nouveau, un échec : le POST est idempotent
    // (`.is('acquitted_at', null)`), donc le second part en 404 et le bouton
    // bascule sur « Réessayer ». Un acquittement RÉUSSI rapporté comme un
    // échec.
    const id = b.dataset.acquitter
    const reste = (x) => String(x.id) !== String(id)
    if (etat.ecran && Array.isArray(etat.ecran.alarmes)) {
      etat.ecran.alarmes = etat.ecran.alarmes.filter(reste)
    }
    etat.alarmes = (etat.alarmes || []).filter(reste)
    renderAlarmes(); renderTitre()
  } catch (e) {
    b.disabled = false
    b.textContent = t('alarm.retry')
  }
}

// ─── 2. Aujourd'hui : arrivées et départs ───────────────────────────────────
function evenements () {
  return R.evenementsDuJour({
    bookings: etat.bookings, biens: etat.biens, menages: etat.menages,
    prestataires: etat.prestataires, etatsArrivee: etat.etatsArrivee, aujourdHui: etat.aujourdHui
  })
}
function lienConversation (e) {
  // La messagerie V5 (etape 4) : l'ancienne page est une redirection, on
  // pointe directement /messages — qui ouvre le fil par ?conv= seul.
  return `/messages?conv=${encodeURIComponent(e.bookingId)}`
}
function phraseMenage (m, heure) {
  const parts = [heure ? t('today.cleaning_after', { time: heure }) : t('today.cleaning_after_notime')]
  const s = m.statut
  if (s === 'accepted' && m.prestataire) parts.push(t('today.cleaning_confirmed', { name: m.prestataire }))
  else if (s === 'started' && m.prestataire) parts.push(t('today.cleaning_started', { name: m.prestataire }))
  else if (s === 'completed' && m.prestataire) parts.push(t('today.cleaning_done', { name: m.prestataire }))
  else if (s === 'offered' && m.proposeeA) parts.push(t('today.cleaning_offered', { name: m.proposeeA }))
  else if (s === 'unassigned' || s === 'orphaned') parts.push(t('today.cleaning_unassigned'))
  return parts.join(', ')
}
function renderEvenements () {
  const zone = $('[data-list="events"]')
  if (etat.menagesOk === false) { zone.innerHTML = `<p class="muted">${esc(t('today.unavailable'))}</p>`; return }
  const evts = evenements()
  if (!evts.length) { zone.innerHTML = `<p class="muted">${esc(t('today.empty'))}</p>`; return }
  zone.innerHTML = evts.map(e => {
    const arrivee = e.type === 'arrivee'
    const libelle = t(arrivee ? 'today.arrival' : 'today.departure')
    const sous = [e.voyageur || t('today.guest')]
    if (arrivee) {
      if (e.nuits != null) sous.push(t('today.nights', { n: e.nuits }))
      if (e.codeEtat === 'transmis') sous.push(t('today.code_sent'))
      else if (e.codeEtat === 'cree') sous.push(t('today.code_pending'))
    } else {
      sous.push(phraseMenage(e.menage, e.heure))
    }
    // Le fil seulement s'il EXISTE : sinon la messagerie répond « conversation
    // introuvable » (constat de revue). À défaut, la fiche du bien.
    const href = arrivee
      ? (etat.conversations.has(e.bookingId) ? lienConversation(e) : `/logements/${encodeURIComponent(e.bienId)}`)
      : '/menages'
    // Un code à envoyer porte son geste en toutes lettres (demande de
    // Thierry) ; le bouton ouvre le fil, où l'envoi se valide.
    const fin = e.action
      ? `<span class="btn btn--primary" style="height: 40px">${esc(t(e.action === 'code' ? 'today.send_code' : 'today.view'))}</span>`
      : icone('i-chevron')
    return `<a class="event" href="${esc(href)}">
      <span class="event__time num">${esc(e.heure || '')}</span>
      <span class="tile-icon${e.action ? ' tile-icon--pending' : ''}" role="img" aria-label="${esc(libelle)}">${icone(arrivee ? 'i-arrival' : 'i-departure', 'icon icon--lg')}</span>
      <span style="min-width: 0">
        <span class="event__title">${esc(libelle)} · ${esc(e.bien)}</span>
        <span class="event__sub">${esc(sous.join(' · '))}</span>
      </span>
      ${fin}
    </a>`
  }).join('')
}

async function chargerReservations () {
  if (!peutLire('menages')) { etat.menagesOk = false; return }
  try {
    // Les réservations ACTIVES dont le départ est aujourd'hui ou plus tard :
    // les arrivées et départs du jour, « occupé ce soir » et la prochaine
    // arrivée. Lues par l'endpoint du planning ménage (coeur seul, aucun
    // provider), avec les ménages et les prestataires du même compte.
    const r = await appel(`/api/menages?from=${etat.aujourdHui}&to=${R.ajouterJours(etat.aujourdHui, 400)}`)
    etat.bookings = r.bookings || []
    etat.menages = r.menages || []
    etat.prestataires = r.prestataires || []
    etat.menagesOk = true
  } catch (e) {
    logger.error('Aujourdhui', 'reservations', e)
    etat.menagesOk = false
  }
}

// L'état du code d'accès (envoyé / créé non envoyé) et la date du dernier
// message par conversation : la preuve « code transmis » est un message
// sortant qui contient le code (api/messages.js, etatsDArrivee), et le
// dernier message date l'ouverture d'une conversation (règle des tâches).
async function chargerEtatsArrivee () {
  if (!peutLire('messages')) return
  const e = etat.ecran || {}
  // ⚠ LES DEUX MOITIÉS VIENNENT DU MÊME APPEL, mais elles ne portent pas la
  // même chose : `conversations` dit quelles réservations ont un fil (pour la
  // cible du lien), `etats_arrivee` dit l'état du code des seules arrivées du
  // jour et du lendemain.
  etat.conversations = new Set(Array.isArray(e.conversations) ? e.conversations.map(String) : [])
  etat.etatsArrivee = (e.etats_arrivee && typeof e.etats_arrivee === 'object') ? e.etats_arrivee : {}
}

async function chargerTaches () {
  if (!peutLire('messages')) return
  const t = etat.ecran && etat.ecran.taches
  // ⚠ `null` N'EST PAS `[]`. L'endpoint rend `null` quand il n'a PAS pu lire :
  // afficher « aucune tâche » serait affirmer un fait qu'on ignore.
  if (!Array.isArray(t)) { etat.tachesOk = false; return }
  etat.taches = t
  etat.tachesOk = true
}

function carteTache (tache, sombre) {
  const titre = tache.status === 'pending_validation' && tache.guest_name
    ? t('validate.reply_to', { name: tache.guest_name }) : t('validate.task')
  const texte = tache.status === 'pending_validation' && tache.suggested_reply ? tache.suggested_reply : (tache.summary || '')
  const href = `/messages?conv=${encodeURIComponent(tache.book_id || '')}`
  return { titre, texte, href, sombre }
}
// Les tâches encore À TRAITER (règle du 11 octobre : séjours à venir ou en
// cours seulement) — shared/aujourdhui.js, avec le repli sur les dates que la
// tâche porte elle-même (profil sans droit ménages, panne de /api/menages).
function tachesVisibles () {
  return R.tachesOuvertes(etat.taches, {
    bookings: etat.bookings, aujourdHui: etat.aujourdHui
  })
}
function renderTaches () {
  const section = $('[data-bind="validate-section"]')
  const mobile = $('[data-bind="validate-mobile"]')
  if (!etat.tachesOk) { section.hidden = true; mobile.hidden = true; return }
  section.hidden = false
  const liste = $('[data-list="pending"]')
  const visibles = tachesVisibles()
  if (!visibles.length) {
    liste.innerHTML = `<p class="muted small">${esc(t('validate.empty'))}</p>`
    mobile.hidden = true
    return
  }
  liste.innerHTML = visibles.slice(0, 3).map(x => {
    const c = carteTache(x)
    return `<div class="card">
      <span style="font-weight: var(--fw-semibold)">${esc(c.titre)}</span>
      ${c.texte ? `<span class="small muted clamp-2" style="line-height: 1.5">${esc(c.texte)}</span>` : ''}
      <a class="btn btn--primary" style="height: 40px" href="${esc(c.href)}">${esc(t('validate.view'))}</a>
    </div>`
  }).join('') + (visibles.length > 3
    ? `<a class="link small" href="/messages?filtre=avalider">${esc(t('validate.more', { n: visibles.length - 3 }))}</a>` : '')
  const premiere = carteTache(visibles[0])
  mobile.hidden = false
  mobile.href = premiere.href
  mobile.innerHTML = `<span class="caption" style="opacity: .8">${esc(t('validate.title'))}</span>
    <span style="font-weight: var(--fw-bold)">${esc(premiere.titre)}</span>
    ${premiere.texte ? `<span class="small clamp-2">${esc(premiere.texte)}</span>` : ''}
    ${visibles.length > 1 ? `<span class="caption" style="opacity: .8">${esc(t('validate.more', { n: visibles.length - 1 }))}</span>` : ''}`
}

// ─── 4. Fait pour vous, 7 jours ─────────────────────────────────────────────
// Chaque tuile est une REQUÊTE DE COMPTE sur le coeur, et n'apparaît que si le
// profil a le droit de lire la table (sinon la RLS rendrait 0, un faux zéro).
// « Messages envoyés » n'y est PAS : message_sent_log est aussi écrit en Mode
// Test et ne dit pas si le voyageur a reçu le message (KB aujourdhui.md §3).
// ⚠ `compter()` A DISPARU, ET AVEC LUI QUATRE LECTURES DU NAVIGATEUR.
// Les trois comptages de « Fait pour vous » — ménages acceptés, prix poussés
// par le moteur, surréservations — étaient des `head: true` faits en direct
// sous RLS, plus un appel à `/api/messages?stats=ia`. Ils viennent maintenant
// de l'appel d'écran, où ils tournent en parallèle avec le reste.
//
// ⚠ ET LE DROIT SE VÉRIFIE DÉSORMAIS CÔTÉ SERVEUR, ce qui est un durcissement
// et pas une simple économie : `price_display_log` a une RLS
// `user_id = auth.uid()`, donc le navigateur ne pouvait de toute façon lire
// que le sien. L'endpoint, lui, travaille en clé de service — qui CONTOURNE la
// RLS — donc il vérifie `estTitulaireDuCompte` explicitement. C'est la raison
// d'être de `requirePermission`, et la règle absolue du dépôt : un masquage
// par droit se double d'une garde serveur.
async function chargerCompteurs () {
  const f = (etat.ecran && etat.ecran.fait_pour_vous) || {}
  // ⚠ `null` = refusé ou illisible, et la tuile se masque. Un `0` affiché là
  // où on ne sait pas dirait « rien ne s'est passé cette semaine », ce qui est
  // un fait — et c'est précisément ce que la dette 62 interdit (la tuile des
  // codes d'accès est masquée pour cette raison, pas affichée à zéro).
  const defs = [
    { icon: 'i-ai', cle: 'done.ia_messages', n: f.messages_ia },
    { icon: 'i-cleaning', cle: 'done.cleanings', n: f.menages },
    { icon: 'i-price', cle: 'done.prices', n: f.prix },
    { icon: 'i-shield', cle: 'done.overbooking', n: f.surreservation }
  ]
  etat.compteurs = defs.filter(d => d.n != null)
}
function renderCompteurs () {
  const section = $('[data-bind="done-section"]')
  section.hidden = !etat.compteurs.length
  $('[data-list="done"]').innerHTML = etat.compteurs.map(c => `<div class="stat">
    ${icone(c.icon, 'icon icon--lg')}
    <span class="kpi num">${esc(I18n.num(c.n))}</span>
    <span class="caption">${esc(t(c.cle, { n: c.n }))}</span>
  </div>`).join('')
}

// ─── 5 et 6. Chiffres 30 jours et logements ─────────────────────────────────
// Source : /api/yield (CA réparti par nuit, au prix VOYAGEUR — jamais le
// `amount` des réservations, qui est un net hôte pour Airbnb).
async function chargerChiffresBien (b) {
  if (!b.provider_property_id) { etat.parBien.set(b.id, { nonRaccorde: true }); return }
  // Bornes calculées sur la DATE de Paris, jamais par pas de 24 h (heure d'été).
  const j0 = etat.aujourdHui
  const fin = R.ajouterJours(j0, -1)
  const debut = R.ajouterJours(j0, -60)
  const milieu = R.ajouterJours(j0, -30)
  const avantMilieu = R.ajouterJours(j0, -31)
  const douze = R.douzeMoisComplets(etat.aujourdHui)
  const base = `/api/yield?property_id=${encodeURIComponent(b.id)}`
  try {
    const j = await appel(`${base}&debut=${debut}&fin=${fin}&granularite=jour`)
    const actuel = R.chiffresFenetre(j.realise || [], milieu, fin)
    const precedent = R.chiffresFenetre(j.realise || [], debut, avantMilieu)
    let mois = null
    try {
      const m = await appel(`${base}&debut=${douze.jourDebut}&fin=${douze.jourFin}&granularite=mois`)
      mois = R.minMaxMensuel(m.realise || [], douze.moisDebut, douze.moisFin)
    } catch (e) { logger.error('Aujourdhui', 'yield mois', e) }
    etat.parBien.set(b.id, { actuel, precedent, mois })
  } catch (e) {
    if (e.status === 409) etat.parBien.set(b.id, { nonRaccorde: true })
    else { logger.error('Aujourdhui', 'yield jour', e); etat.parBien.set(b.id, { erreur: true }) }
  }
}
async function chargerNotes () {
  if (!peutLire('avis')) return
  // ⚠ LA SOURCE CHANGE, LES GARDES RESTENT — et c'est délibéré. Ce bloc venait
  // de `/api/avis?action=notes` ; il vient maintenant de l'appel d'écran, qui
  // appelle la MÊME fonction `notesDuPerimetre` côté serveur. Tout le
  // raisonnement ci-dessous sur `tronque` et sur « les deux côtés jugent la
  // même chose » reste valable mot pour mot, et il a été payé par deux
  // mesures : il ne se jette pas parce que la source a changé.
  const r = (etat.ecran && etat.ecran.notes) || null
  if (r && r.tronque) logger.error('Aujourdhui', 'avis', 'lecture des notes incomplete')
  const lu = r && !r.tronque && r.global && typeof r.global === 'object' ? r : null
  const parBien = (lu && lu.par_bien) || {}
  etat.noteGlobale = lu ? lu.global : null
  for (const b of etat.biens) {
    if (!b.provider_property_id) continue
    const ref = String(b.provider_property_id)
    // ⚠ `hasOwnProperty`, pas `parBien[ref]`. `par_bien` vient de `JSON.parse` :
    // pour un bien dont la clé provider vaudrait `constructor`, `toString` ou
    // `valueOf`, une lecture directe rendrait une FONCTION héritée d'Object —
    // vraie, donc le repli ne serait jamais pris, et `etat.notesParBien`
    // porterait une fonction au lieu d'une note.
    const sienne = Object.prototype.hasOwnProperty.call(parBien, ref) ? parBien[ref] : null
    // Un bien sans avis sur la période n'a pas de clé : c'est zéro, et c'est
    // exactement ce que rendait l'appel par bien qu'on remplace.
    etat.notesParBien.set(b.id, lu ? (sienne || { note_sur_5: null, notes: 0 }) : null)
  }
  renderKpis()
  renderBiens()
}

function deviseUnique () {
  const devises = new Set(etat.biens.map(b => b.currency || 'EUR'))
  return devises.size === 1 ? [...devises][0] : null
}
function renderKpis () {
  const section = $('[data-bind="kpi-section"]')
  let visible = false
  const lignes = etat.biens.map(b => etat.parBien.get(b.id))
  const tousCharges = peutLire('reservations') && etat.biens.length && lignes.every(Boolean)
  if (tousCharges) {
    const tot = R.totaux(lignes)
    const devise = deviseUnique()
    const nc = `<span class="small muted">${esc(t('kpi.not_computable'))}</span>`
    $('[data-bind="revenue"]').innerHTML = tot.ca != null && devise
      ? `<span class="kpi num">${esc(monnaie(tot.ca, devise))}</span>${deltaPct(tot.caVariation)}` : nc
    // Occupation non calculable : tuile MASQUÉE, pas de texte (demande de
    // Thierry du 10 octobre 2026) ; le revenu, lui, dit « non calculable ».
    if (tot.occupation != null) {
      $('[data-bind="occupancy"]').innerHTML = `<span class="kpi num">${esc(I18n.pct(tot.occupation))}</span>${deltaPoints(tot.occupationEcart)}`
      $('[data-bind="kpi-occupancy"]').hidden = false
    }
    $('[data-bind="kpi-revenue"]').hidden = false
    visible = true
  }
  if (etat.noteGlobale) {
    const n = etat.noteGlobale
    // ⚠ PLUS DE DIVISION ICI. L'endpoint descend `note_sur_5`, deja ramenee sur
    // 5 et arrondie UNE SEULE FOIS. La version d'avant divisait une moyenne
    // elle-meme arrondie : deux arrondis, donc Colomiers affichait 4,8 la ou le
    // calcul juste donne 4,7 (mesure du 20 octobre 2026).
    $('[data-bind="rating"]').innerHTML = n.note_sur_5 != null
      ? `<span class="kpi num row" style="gap: 6px">${icone('i-review', 'icon icon--fill')}${esc(I18n.num(n.note_sur_5, { minimumFractionDigits: 1, maximumFractionDigits: 1 }))}</span><span class="small muted">${esc(t('kpi.reviews', { n: n.notes }))}</span>`
      : `<span class="small muted">${esc(t('kpi.reviews', { n: 0 }))}</span>`
    $('[data-bind="kpi-rating"]').hidden = false
    visible = true
  }
  section.hidden = !visible
}

function quand (jour) {
  if (jour === etat.aujourdHui) return t('properties.today')
  return dateDuJour(jour, { weekday: 'short', day: 'numeric', month: 'short' })
}
function renderBiens () {
  const section = $('[data-bind="props-section"]')
  section.hidden = !etat.biens.length
  const etats = R.etatDesBiens({ bookings: etat.bookings, biens: etat.biens, aujourdHui: etat.aujourdHui })
  $('[data-list="properties"]').innerHTML = etat.biens.map(b => {
    const href = `/logements/${encodeURIComponent(b.id)}`
    if (!b.provider_property_id) {
      // Pas de clé provider = aucun canal relié : un FAIT de la base, contrairement
      // à `ota_connect_status`, que rien ne rafraîchit (KB aujourdhui.md §3).
      return `<a class="property" href="${esc(href)}">
        <span class="property__photo property__photo--empty">${icone('i-link', 'icon icon--lg')}<span class="link caption" style="color: var(--ink)">${esc(t('properties.connect'))}</span></span>
        <span class="property__name"><span>${esc(b.name)}</span></span>
        <span class="small muted">${esc(t('properties.no_channel'))}</span>
      </a>`
    }
    const e = etats.get(String(b.provider_property_id)) || {}
    const chiffres = etat.parBien.get(b.id)
    const note = etat.notesParBien.get(b.id)
    // ⚠ « Aucune arrivée prévue » EST UN FAIT, et il demande d'avoir lu les
    // séjours. `etat.menagesOk` vaut `null` tant que la fenêtre ménage n'a pas
    // répondu — au premier affichage depuis le cache, par exemple — et la
    // version précédente affirmait quand même l'absence d'arrivée sur chaque
    // carte. La puce d'occupation était déjà gardée ; cette ligne ne l'était
    // pas.
    const arrivee = etat.menagesOk === true
      ? (e.prochaineArrivee ? t('properties.next_arrival', { when: quand(e.prochaineArrivee) }) : t('properties.no_arrival'))
      : null
    const lieu = [b.city, arrivee].filter(Boolean).join(' · ')
    let ca = ''
    if (chiffres && chiffres.actuel) {
      ca = chiffres.actuel.ca != null
        ? `<span><strong class="num">${esc(monnaie(chiffres.actuel.ca, b.currency))}</strong> <span class="muted">${esc(t('properties.revenue_30'))}</span> ${deltaPct(R.variation(chiffres.actuel.ca, chiffres.precedent?.ca))}</span>`
        : `<span class="small muted">${esc(t('properties.revenue_not_computable'))}</span>`
    } else if (chiffres && chiffres.erreur) {
      ca = `<span class="small muted">${esc(t('properties.revenue_not_computable'))}</span>`
    }
    const mm = chiffres && chiffres.mois
      ? `<span class="caption muted num">${esc(t('properties.range', { min: monnaie(chiffres.mois.min, b.currency), max: monnaie(chiffres.mois.max, b.currency) }))}</span>`
      : ''
    const etoile = note && note.note_sur_5 != null
      ? `<span class="property__rating">${icone('i-review', 'icon icon--fill')}${esc(I18n.num(note.note_sur_5, { minimumFractionDigits: 1, maximumFractionDigits: 1 }))}</span>` : ''
    const puce = etat.menagesOk
      ? `<span class="chip">${esc(t(e.occupeCeSoir ? 'properties.occupied' : 'properties.free'))}</span>` : ''
    // La photo de couverture (properties.photo_url, lot photos) ; sans elle,
    // le fond neutre reste.
    const photo = b.photo_url
      ? `<span class="property__photo"><img src="${esc(b.photo_url)}" alt="" loading="lazy">${puce}</span>`
      : `<span class="property__photo property__photo--none">${icone('i-home')}${puce}</span>`
    return `<a class="property" href="${esc(href)}">
      ${photo}
      <span class="property__name"><span>${esc(b.name)}</span>${etoile}</span>
      <span class="small muted">${esc(lieu)}</span>
      ${ca}
      ${mm}
    </a>`
  }).join('')
}

// ─── Démarrage ──────────────────────────────────────────────────────────────
// Le prénom du profil titulaire ; à sa création il vaut la partie locale de
// l'e-mail (trigger du schéma initial) : on lui préfère alors le nom saisi à
// l'inscription.
async function prenom (user) {
  const local = String(user?.email || '').split('@')[0]
  const plein = String(user?.user_metadata?.full_name || '').trim().split(/\s+/)[0] || ''
  let profil = ''
  try {
    const { data } = await supabase.from('profiles').select('first_name')
      .eq('member_user_id', moi()).eq('is_owner', true).limit(1)
    profil = (data && data[0] && data[0].first_name) || ''
  } catch { /* repli ci-dessous */ }
  if (profil && profil !== local) return profil
  return plein || profil
}

async function init () {
  // I18n ne dépend pas de la session : les deux partent ENSEMBLE. Le `.catch`
  // vide n'avale rien — `await i18nPrêt` lèvera quand même plus bas ; il évite
  // seulement une promesse non traitée si `requireAuth` redirige entre-temps.
  const i18nPret = I18n.init()
  i18nPret.catch(() => {})
  const session = await requireAuth()
  if (!session) return
  await i18nPret
  document.addEventListener('i18n:changed', () => location.reload())

  // `session.user` vient de `requireAuth` : plus de `getUser()`, qui refaisait
  // un aller-retour vers /auth/v1/user.
  // ⚠ CE N'EST PAS TOUT A FAIT LE MÊME OBJET. `getUser()` lisait la ligne
  // COURANTE ; `session.user` est celle qui a été figée dans la session stockée,
  // et elle ne se rafraîchit qu'au renouvellement du jeton. Un e-mail changé
  // depuis un autre appareil, ou un `user_metadata` mis à jour, met donc jusqu'à
  // la durée de vie d'un jeton à apparaître dans le bonjour et les initiales.
  // Affichage seul : toute lecture de données passe par RLS, avec un jeton
  // vérifié à chaque requête. Dette 72.
  const user = session.user
  // La création de bien n'est pas déléguée (cf. pages/biens.html).
  $('[data-bind="add-property"]').hidden = !estTitulaire()

  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
    // PROVISOIRE (décision de Thierry du 10 octobre 2026) : les outils sans
    // onglet V5, retirés lot par lot. Mêmes droits que l'ancienne barre
    // latérale : YieldFlow est délégable (lecture des réservations), les
    // autres travaillent sur le compte propre et restent au titulaire.
    outils: [
      peutLire('reservations') && { href: '/apps/yield', key: 'nav.tool_yield', icon: 'i-price' },
      estTitulaire() && { href: '/apps/serrures', key: 'nav.tool_locks', icon: 'i-key' },
      estTitulaire() && { href: '/apps/sms', key: 'nav.tool_sms', icon: 'i-send' },
      estTitulaire() && { href: '/apps/reservation-directe', key: 'nav.tool_direct', icon: 'i-calendar' },
      estTitulaire() && { href: '/connexions', key: 'nav.tool_connections', icon: 'i-link' },
      estTitulaire() && { href: '/abonnement', key: 'nav.tool_billing', icon: 'i-euro' }
    ].filter(Boolean)
  })

  // Le prénom et les biens ne dépendent que du contexte de compte, déjà chargé
  // par `requireAuth` : les deux requêtes partent ENSEMBLE, elles s'attendaient
  // l'une l'autre pour rien.
  //
  // Les biens : lecture directe sous RLS (`properties_select` = périmètre du
  // profil). Pas /api/channel-property, qui interroge Beds24 en direct.
  // ⚠ LES BIENS VIENNENT DE L'APPEL D'ÉCRAN, PLUS D'UNE LECTURE DIRECTE.
  // C'était une lecture `properties` sous RLS depuis le navigateur — 9
  // colonnes, toutes les lignes du compte, sans limite. Elle part maintenant
  // avec les cinq autres blocs, en parallèle côté serveur, et son périmètre est
  // appliqué EXPLICITEMENT par `refsDuPerimetre` : la clé de service CONTOURNE
  // la RLS, donc le filtre ne peut plus être implicite.
  const lireBiens = async () => {
    const b = etat.ecran && etat.ecran.biens
    return Array.isArray(b) ? b : []
  }

  // ⚠ ILS PARTENT ENSEMBLE, ILS N'ARRIVENT PAS ENSEMBLE. Un `Promise.all` sur
  // les deux resultats faisait attendre au bonjour et aux initiales — qui ne
  // dependent que de `prenom()` — la lecture `properties`, la plus lourde des
  // deux et sans limite de lignes. Dans un lot dont l'objet est le premier
  // affichage, c'est l'element le plus visible de la page qu'on retardait.
  // Chacun ecrit donc a SA resolution ; l'attente commune ne sert plus qu'a la
  // suite, qui a besoin de `etat.biens`.
  const pNom = prenom(user).then(brut => {
    // En capitale à l'affichage (demande de Thierry) : le profil porte parfois
    // la partie locale de l'e-mail, en minuscules.
    const nom = brut ? brut.charAt(0).toLocaleUpperCase('fr') + brut.slice(1) : ''
    $('[data-bind="greeting"]').textContent = nom ? t('today.greeting', { name: nom }) : t('today.greeting_anon')
    $('[data-bind="initials"]').textContent = (nom || user?.email || '').slice(0, 2).toUpperCase()
  })
  const pBiens = lireBiens().then(biens => { etat.biens = biens })
  await Promise.all([pNom, pBiens])
  // ⚠ PLUS DE `liens` : l'entrée Calendrier mène à l'écran V5 `/calendrier`,
  // le même depuis toutes les pages. Épingler ici le premier bien donnait à
  // cet onglet deux comportements selon la page d'où on cliquait.
  // ⚠ L'AFFICHAGE INSTANTANÉ — principe 3 de la spec performance.
  // On montre les dernières données connues AVANT le premier aller-retour, puis
  // on rafraîchit. L'écran n'est jamais vide au deuxième chargement de la
  // journée.
  //
  // ⚠ ET IL NE MONTRE JAMAIS UN ÉTAT CRITIQUE. Le module retire `etats_arrivee`,
  // `alarmes`, `taches`, `arrivees` et `conversations` à l'ÉCRITURE : ce qui
  // n'est pas écrit ne peut pas fuiter par un lecteur distrait. C'est
  // l'interdit 2 de la spec, et il n'est pas négociable — un code affiché
  // depuis le cache ferait croire à l'hôte qu'un voyageur l'a reçu.
  //
  // ⚠ ET IL NE REND QUE CE QUE LE CACHE PORTE VRAIMENT — la review a mesuré
  // l'inverse. Je rendais ici `renderTaches()` et `renderTitre()`, alors que
  // `etat.bookings` est encore VIDE à ce point (la fenêtre ménage ne part que
  // vingt lignes plus bas, et elle n'est pas dans le cache). Conséquences,
  // toutes affirmées comme des faits : « À valider » vide parce que la règle
  // des tâches a besoin des séjours, « 0 arrivée · 0 départ · 0 à traiter »,
  // et « Aucune arrivée prévue » sur chaque carte de bien. L'hôte ouvrait sa
  // deuxième visite de la journée sur un écran qui dit qu'il n'y a rien à
  // faire — puis tout changeait.
  // Ce qui s'affiche instantanément est donc ce qui ne périme pas en une
  // heure : la LISTE DES BIENS avec photos et notes, et les quatre compteurs
  // de la semaine. C'est moins que ce que j'annonçais, et c'est vrai.
  const duCache = CacheEcran.lire('aujourdhui', moi(), compteCourant())
  if (duCache) {
    etat.ecran = duCache.donnees
    etat.ageCache = duCache.age_ms
    await Promise.all([chargerCompteurs(), chargerNotes()])
    etat.biens = await lireBiens()
    renderCompteurs(); renderBiens()
  }

  const nav = (badge) => HSNav.render({
    badges: { pendingMessages: badge },
    peutLire
  })
  nav(0)

  // /api/messages dans le même lot : la règle des tâches et l'état des codes
  // en dépendent — un premier rendu sans lui afficherait un compte faux.
  // ⚠ L'APPEL D'ÉCRAN ET LA FENÊTRE MÉNAGE PARTENT ENSEMBLE. Deux appels, pas
  // treize — et pas en file : `/api/menages` ne dépend pas de l'écran.
  // `chargerTaches`, `chargerAlarmes`, `chargerCompteurs`, `chargerEtatsArrivee`
  // et `chargerNotes` ne font plus de réseau : ils lisent `etat.ecran`.
  // ⚠ `ecranFrais` DIT SI LA RÉPONSE VIENT DU SERVEUR, et sans ce drapeau le
  // cache ne périmait JAMAIS. Quand `chargerEcran()` échoue, `etat.ecran`
  // garde l'objet restauré du cache : la suite remettait `ageCache = null`
  // (« elles viennent du serveur ») puis RÉÉCRIVAIT ce contenu périmé avec un
  // horodatage neuf. Deux jours de 503 et l'hôte lisait les chiffres de
  // lundi, re-datés à chaque ouverture, le plafond de 12 h hors d'atteinte.
  // Pire cas : un membre révoqué en cours de session reçoit 403 de la garde et
  // continue de voir les chiffres du compte dont il vient d'être retiré.
  let ecranFrais = false
  await Promise.all([
    chargerEcran().then(() => { ecranFrais = true })
      .catch(e => { logger.error('Aujourdhui', 'ecran', e) }),
    chargerReservations()
  ])
  etat.biens = await lireBiens()
  await Promise.all([chargerTaches(), chargerAlarmes(), chargerCompteurs(), chargerEtatsArrivee(), chargerNotes()])
  // L'âge ne repasse à « rien » que si les données viennent VRAIMENT du serveur.
  if (ecranFrais) etat.ageCache = null
  nav(tachesVisibles().filter(x => x.status === 'pending_validation').length)
  // ⚠ `renderAlarmes()` EST DANS CETTE LISTE, ET IL N'Y ÉTAIT PLUS.
  // L'ancienne `chargerAlarmes()` finissait par `renderAlarmes(); renderTitre()` ;
  // en déplaçant la lecture vers l'appel d'écran, j'ai emporté l'appel de
  // rendu avec elle. Mesure : `grep -rn renderAlarmes` ne trouvait QUE sa
  // définition. La bannière de surréservation ne pouvait donc plus jamais
  // s'afficher — et avec elle le bouton « Acquitter », que le commentaire de
  // cette page désigne comme « le SEUL moyen d'arrêter la réémission des SMS »
  // (spec-reservation-manuelle.md §4). L'alarme comptait dans le total « à
  // traiter » sans que rien ne la montre, et l'alerte au fondateur ne pouvait
  // plus être éteinte.
  renderEvenements(); renderTaches(); renderAlarmes(); renderCompteurs(); renderBiens(); renderTitre()
  // ⚠ ON GARDE CE QU'ON VIENT D'AFFICHER. Le cache ne sert qu'à un premier
  // affichage instantané au prochain chargement ; les trois états critiques en
  // sont retirés à l'écriture par le module lui-même.
  if (ecranFrais && etat.ecran) CacheEcran.ecrire('aujourdhui', moi(), compteCourant(), etat.ecran)

  if (peutLire('reservations')) {
    await parPaquets(etat.biens.map(b => async () => { await chargerChiffresBien(b); renderBiens() }), 2)
    renderKpis()
  }
}

init().catch(e => logger.error('Aujourdhui', e.message, e))
</script>
</body>
</html>
