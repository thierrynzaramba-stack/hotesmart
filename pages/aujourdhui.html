  let reste = cible - bas.reduce((a, b) => a + b, 0)
  // Par decimale decroissante ; a egalite, l'ordre d'affichage tranche.
  // ⚠ CE DEPARTAGE EST UNE CEINTURE, PAS UNE BRETELLE : `Array.sort` est STABLE
  // depuis ES2019, donc deux lignes de meme decimale gardent deja leur ordre, et
  // AUCUN test ne peut distinguer sa presence de son absence (mesure : la
  // mutation qui le retire ne fait rougir personne). On le garde parce qu'il
  // rend la regle LISIBLE au lieu de la faire reposer sur une garantie
  // implicite du langage — mais il ne faut pas le croire teste.
  const ordre = euro
    .map((e, i) => ({ i, frac: e - Math.floor(e) }))
    .sort((a, b) => (b.frac - a.frac) || (a.i - b.i))
  for (let k = 0; k < ordre.length && reste > 0; k++) { bas[ordre[k].i]++; reste-- }
  return bas
}

// La devise du compte : celle du premier bien lu. ⚠ Un compte multidevise
// afficherait un total melange — le depot n'en a pas, et `/api/yield` fait le
// meme choix. A revoir le jour ou un hote aura deux devises.
const deviseDuCompte = () =>
  ((etat.biens || []).find(b => b && b.currency) || {}).currency || 'EUR'

function renderRevenus () {
  const section = $('[data-bind="revenue-section"]')
  if (!section) return
  const vide = $('[data-bind="etat-vide"]')

  // ⚠ TROIS ETATS, PAS DEUX, ET C'EST L'ANCIEN BLOC QUI LES AVAIT RAISONNES.
  // Ma premiere version les ecrasait en un seul test (`biens.length === 0`), et
  // le garde-fou M2 de `tests/accueil-rapide.test.js` l'a dit tout de suite. Les
  // trois se transposent ici mot pour mot :
  //
  // 1. `etat.biens === null` — la lecture a ECHOUE. Masquer la section
  //    reviendrait a affirmer « cet hote n'a aucun logement ».
  // ⚠ LE MOTIF, PAS SEULEMENT L'ABSENCE. La regle du depot dit qu'un `null`
  // s'affiche « non calculable » AVEC SON MOTIF — et ces deux-la ne demandent
  // pas la meme chose a l'hote. « non calculable » decrit un defaut : il n'y a
  // rien a attendre. « Calcul en cours » decrit un etat transitoire, celui des
  // minutes qui suivent le collage d'une migration ou une nuit de rattrapage :
  // il faut revenir. Afficher le premier pour le second ferait conclure a une
  // panne, et c'est exactement ce qu'un hote signale au fondateur.
  const calculEnCours = () => {
    const ind = (etat.ecran && etat.ecran.indisponibles) || []
    return ind.includes('revenus_calcul_en_cours')
  }
  const videDuTotal = () => {
    // ⚠⚠ LE LIBELLE DES FLECHES SE MET A JOUR MEME QUAND LE BLOC NE DIT RIEN.
    // Constat BLOQUANT d'une review du 27 octobre 2026, et c'est le premier clic
    // de la recette qui le rencontrait : sur un mois dont les colonnes derivees
    // ne sont pas remplies, l'endpoint rend `revenus: null`, ce rendu-ci efface
    // `revenue-month`… et le libelle entre les fleches gardait le mois
    // PRECEDENT. L'hote ne savait plus quel mois il regardait, le clic suivant
    // repartait du mois servi et semblait sauter deux mois, et `aria-live`
    // n'annoncait rien puisque le texte n'avait pas change.
    //
    // Le mois SERVI est toujours dans le payload, meme quand `revenus` est
    // `null` : c'est lui qui fait foi ici. Mon commentaire plus bas disait deja
    // « les fleches et le chiffre doivent parler de la MEME periode » — il ne
    // couvrait que le chemin ou il y a un chiffre.
    const nav = $('[data-bind="revenue-month-nav"]')
    if (nav) nav.textContent = moisEnClair(etat.ecran && etat.ecran.mois)
    const n = $('[data-bind="revenue-total"]')
    if (n) n.textContent = t(calculEnCours() ? 'revenue.computing' : 'revenue.unavailable')
    for (const sel of ['revenue-received', 'revenue-upcoming']) {
      const x = $(`[data-bind="${sel}"]`); if (x) x.textContent = ''
    }
    const liste = $('[data-list="revenue-rows"]'); if (liste) liste.innerHTML = ''
    const cartes = $('[data-list="revenue-cards"]'); if (cartes) cartes.innerHTML = ''
    const w = document.querySelector('.rev-tbl-wrap'); if (w) w.hidden = true
    const res = $('[data-bind="revenue-reserves"]'); if (res) res.hidden = true
  }
  if (!Array.isArray(etat.biens)) {
    section.hidden = false
    if (vide) vide.hidden = true
    videDuTotal()
    return
  }

  // 2. « Ajoutez votre premier logement » NE SE DIT QUE SUR UNE LECTURE REUSSIE,
  //    ET PAS DEPUIS LE CACHE. `etat.biens` vaut `[]` aussi longtemps que
  //    l'appel d'ecran n'a pas repondu : l'afficher avant ferait lire « Ajoutez
  //    votre premier logement » a un hote qui en a quatre — et, a l'onboarding,
  //    une reconciliation contre une liste amputee CREE des biens en double chez
  //    le canal. Et un `biens: []` garde douze heures satisfait « la liste a ete
  //    lue » : l'hote qui vient de relier un canal rouvrait son accueil sur
  //    l'etat vide, boutons compris, pendant un aller-retour. C'est la liste
  //    rendue par le serveur MAINTENANT qui fait foi.
  const listeLue = !!(etat.ecran && Array.isArray(etat.ecran.biens)) && etat.ageCache == null
  const rev = etat.ecran && etat.ecran.revenus

  // 3. Liste lue et VIDE : l'etat vide, par le MEME module que la page
  //    Logements (Q7). Il a suivi ce bloc quand « Vos logements » est parti —
  //    un hote sans bien n'a pas de revenus, et c'est la seule action qui lui
  //    reste ici. Les actions sont gardees par le droit DANS le module : un
  //    membre delegue sans logement confie lit « Aucun logement ne vous est
  //    confie sur ce compte », sans boutons, parce que les deux menent a des
  //    pages NON DELEGABLES et « on ne montre jamais ce qui mene a un refus ».
  if (!etat.biens.length) {
    section.hidden = !listeLue
    if (vide) {
      vide.hidden = !listeLue
      if (listeLue) { vide.innerHTML = etatHtml('vide', { peutAjouter: estTitulaire() }); I18n.apply(vide) }
    }
    videDuTotal()
    return
  }
  if (vide) vide.hidden = true

  // ⚠ PAS DE DROIT, PAS DE BLOC — et le masquage se DOUBLE d'une garde serveur,
  // qui est dans l'endpoint (`if (!droits.reservations) return null`). Le
  // masquage est un confort d'interface : il tombe sur une feuille de style
  // absente. La regle absolue du depot est que les deux existent.
  const aLeDroit = !etat.ecran || !etat.ecran.droits || etat.ecran.droits.reservations !== false
  if (!aLeDroit) { section.hidden = true; return }

  // ⚠ `null` N'EST PAS UN MOIS A ZERO. L'endpoint rend `null` quand il n'a PAS
  // pu lire — table de delais illisible, lecture en erreur. Afficher « 0 € »
  // dirait « ce mois n'a rien rapporte », ce qui est un FAIT, et faux.
  //
  // ⚠ ET UNE LISTE DE BIENS ILLISIBLE COMPTE COMME UNE LECTURE MANQUEE, ce que
  // ma premiere version ne voyait pas : `etat.biens` a `null` faisait tomber la
  // boucle des lignes sur `(etat.biens || [])`, donc un bloc avec son total mais
  // SANS AUCUNE LIGNE — un ecran qui a l'air complet et ne montre rien. Defaut
  // trouve en relisant le garde-fou « des biens ILLISIBLES ne s'affichent pas
  // comme aucun bien », qui tenait deja cette regle pour l'ancien bloc.
  if (!rev || !rev.total) {
    section.hidden = false
    videDuTotal()
    return
  }

  section.hidden = false
  const devise = deviseDuCompte()
  const T = rev.total

  // ⚠⚠ LA MEME GARDE QUE LA LIGNE DU BIEN, ET LE BANDEAU NE L'AVAIT PAS.
  // Constat BLOQUANT de la review du 26 octobre 2026. La ligne d'un logement
  // dit « non calculable » quand son total vaut zero ET qu'un montant a ete
  // refuse (plus bas, avec son test) ; le bandeau, lui, ecrivait
  // `euros(T.total_cents)` sans condition.
  //
  // Mesure sur les donnees de staging : `revenus_du_mois(2026-10)` rend
  // `{sejours: 2, total_cents: 0, sans_montant: 2}`. L'ecran afficherait donc
  // « 0,00 € · Recu 0,00 € · A venir 0,00 € » au bandeau, « non calculable »
  // sur la ligne du bien, et « 2 sejour(s) dont le montant n'est pas
  // calculable » en reserve. Les deux moities du meme ecran se contredisent —
  // et c'est le bandeau qui porte le chiffre que l'hote retient.
  //
  // ⚠ ET AUCUN TEST NE POUVAIT LE VOIR : le banc DOM stube `I18n.money` pour
  // rendre la chaine vide, donc le texte du bandeau est toujours `''` pour
  // toute la suite. Le test ajoute avec ce correctif mesure la CLASSE du noeud,
  // pas son texte.
  const toutRefuse = T.total_cents === 0 && (T.refuses ? T.refuses.montant : 0) > 0
  const noeudTotal = $('[data-bind="revenue-total"]')
  noeudTotal.classList.toggle('muted', toutRefuse)
  // ⚠ LE GRAND TOTAL EST LA SOMME DES DEUX CHIFFRES AFFICHES, pas l'arrondi du
  // total exact — et les deux peuvent differer d'un euro. Le bandeau montre
  // trois nombres cote a cote : si « Total » n'est pas « Recu » plus
  // « A venir » SOUS LES YEUX de l'hote, c'est l'incoherence la plus visible de
  // l'ecran. On prefere donc un total qui s'additionne a l'ecran a un total
  // exact qui ne s'additionne pas. Ecart maximal : 1 €.
  const recuE = Math.round((Number(T.recu_cents) || 0) / 100)
  const avenirE = Math.round((Number(T.a_venir_cents) || 0) / 100)
  noeudTotal.textContent = toutRefuse
    ? t('revenue.unavailable')
    : monnaie(recuE + avenirE, devise)
  $('[data-bind="revenue-received"]').textContent = toutRefuse ? '' : monnaie(recuE, devise)
  $('[data-bind="revenue-upcoming"]').textContent = toutRefuse ? '' : monnaie(avenirE, devise)
  // Le mois SERVI, pas le mois demande : l'endpoint retombe sur le mois courant
  // si la valeur recue est hors forme, et l'ecran doit dire ce qu'il montre.
  // ⚠ LE LIBELLE DE LA NAVIGATION DIT LE MOIS SERVI, pas le mois demande. Si le
  // serveur retombe sur le mois courant — un `?mois=` malforme, par exemple —
  // les fleches et le chiffre doivent parler de la MEME periode, sinon l'hote
  // navigue a l'aveugle.
  const labelNav = $('[data-bind="revenue-month-nav"]')
  // ⚠ LE LIBELLE SUIT LA VUE : « octobre 2026 » ou « 2026 ». Les fleches
  // avancent du meme pas, donc le libelle doit dire ce qu'elles deplacent.
  if (labelNav) {
    labelNav.textContent = etat.vueRevenus === 'annee'
      ? String(etat.anneeRevenus || '')
      : moisEnClair(rev.mois || (etat.ecran && etat.ecran.mois))
  }
  // ⚠ LE SELECTEUR GARDE « Mois | Annee », ET NON LES PERIODES DE LA MAQUETTE.
  // Celle-ci montre « Octobre | 2026 » — essaye, mesure au banc le 27 octobre
  // 2026, puis ECARTE : le libelle des fleches, juste a cote, dit deja la
  // periode servie, et l'ecran affichait alors « ‹ 2026 › [Octobre | 2026] ».
  // C'est exactement le constat de Thierry que `tests/accueil-rapide.test.js`
  // garde depuis — « le mois est encore affiche a cote du total : il y est deux
  // fois a l'ecran ».
  // ⚠ ET LA MAQUETTE N'A PAS DE FLECHES : elle peut mettre la periode dans le
  // selecteur parce que rien d'autre ne la porte. Ici la decision 5 de Thierry
  // demande des fleches, donc un libelle de periode ; le selecteur retrouve sa
  // fonction, qui est de nommer les deux VUES.
  for (const b of document.querySelectorAll('.seg__btn[data-vue]')) {
    const actif = b.dataset.vue === etat.vueRevenus
    b.classList.toggle('is-on', actif)
    b.setAttribute('aria-pressed', actif ? 'true' : 'false')
  }
  renderAnnee()

  // ─── Ce que le total ne dit pas ───────────────────────────────────────────
  // Trois reserves, chacune avec son compte. Elles ne se melangent pas : un
  // montant manquant se repare dans le payload du provider, une date manquante
  // dans la table des delais, et un brut attend que la plateforme transmette
  // sa commission.
  const reserves = []
  if (T.bruts > 0) reserves.push(t('revenue.gross_count', { n: T.bruts }))
  if (T.refuses && T.refuses.montant > 0) reserves.push(t('revenue.no_amount', { n: T.refuses.montant }))
  // ⚠ « TOUS MOIS CONFONDUS », ET IL FAUT LE DIRE. Un sejour sans date de
  // versement n'appartient a aucun mois : le compteur agrege donc toutes les
  // periodes, et un hote qui lit « 1 sejour sans date » en novembre pourrait
  // croire qu'il s'agit d'un sejour de novembre.
  if (rev.hors_mois && rev.hors_mois.sejours > 0) {
    reserves.push(t('revenue.no_date', { n: rev.hors_mois.sejours }))
  }
  // ⚠ L'ARGENT QUI N'EST SUR AUCUNE LIGNE SE DIT, et c'est le second constat
  // GRAVE de la review : 1 000 € d'ecart muet entre le bandeau et la somme des
  // lignes, mesure. Un `property_id` nul, une cle laissee par un re-keying, un
  // bien supprime — les trois entrent dans le total et sortent de l'affichage.
  // Le bandeau reste juste (l'argent a bien ete touche) ; ce qui manquait etait
  // la phrase qui explique l'ecart.
  if (rev.hors_biens && rev.hors_biens.sejours > 0) {
    reserves.push(t('revenue.hors_biens', {
      n: rev.hors_biens.sejours,
      montant: euros(rev.hors_biens.total_cents, devise)
    }))
  }
  if (rev.tronque) reserves.push(t('revenue.truncated'))
  const res = $('[data-bind="revenue-reserves"]')
  if (res) {
    res.hidden = reserves.length === 0
    res.textContent = reserves.join(' · ')
  }

  // ─── Une ligne par bien ───────────────────────────────────────────────────
  // ⚠ L'ORDRE SUIT LA LISTE DES BIENS, pas le montant. Un classement par
  // revenu ferait sauter les lignes d'un mois a l'autre, et l'hote cherche son
  // logement par son nom.
  const parBien = rev.par_bien || {}
  // ⚠ LES DEUX COLONNES SONT REPARTIES AVANT LE RENDU, pour que la somme des
  // lignes AFFICHEES vaille le chiffre AFFICHE du bandeau — constat de la
  // recette de Thierry du 27 octobre 2026. On repartit `recu` et `a venir`, et
  // le total de chaque ligne est la SOMME de ses deux valeurs affichees : les
  // trois colonnes concordent alors dans les deux sens, en ligne et en colonne.
  //
  // ⚠ ET ON NE REPARTIT PAS LA COLONNE « Total » SEPAREMENT : elle tomberait
  // juste en colonne et faux en ligne — un bien afficherait 159 + 0 = 160.
  const donnees = (etat.biens || []).map(b => parBien[String(b.id)] || null)
  const recusParBien = repartirEnEuros(donnees.map(d => (d ? d.recu_cents : 0)))
  const avenirParBien = repartirEnEuros(donnees.map(d => (d ? d.a_venir_cents : 0)))
  const lignesRev = (etat.biens || []).map((b, idx) => {
    // ⚠ LA CLE EST MAINTENANT L'UUID DU BIEN, ET C'EST UN RENVERSEMENT ASSUME
    // (27 octobre 2026, architecture decidee par Thierry). Jusqu'ici l'endpoint
    // groupait par `bookings_snapshot.property_id`, c'est-a-dire la cle
    // PROVIDER en TEXTE, et cette ligne joignait donc par
    // `b.provider_property_id`.
    //
    // L'agregat SQL groupe desormais par `property_uuid` — la colonne derivee
    // qui porte l'IDENTITE du bien. C'est tout son objet : la cle provider
    // change au re-keying et a la bascule, l'UUID non. C'etait la cause racine
    // des 1 000 EUR d'ecart muet entre le bandeau et les lignes.
    //
    // La regle dure du depot n'est pas contredite, elle est HONOREE : on ne
    // joint jamais un UUID a une cle TEXTE. Les deux cotes sont des UUID, et
    // c'est le writer qui a fait la resolution une fois, a l'ecriture, en
    // comparant le COUPLE (compte, cle provider).
    const d = parBien[String(b.id)]
    // ⚠ LA PHOTO, EXIGEE PAR LA SPEC §4 (« une ligne par bien : photo, nom,
    // nombre de sejours, barre, recu, a venir, total ») — et mon commentaire
    // citait cette enumeration mot pour mot en n'en rendant aucune. La regle du
    // depot veut qu'un element de la maquette soit « conserve, deplace ou
    // retire AVEC RAISON » : retire par omission sous un commentaire qui le
    // cite, c'est exactement ce que cette regle nomme.
    //
    // ⚠ ET SON ABSENCE N'EST PAS UN TROU : un bien sans photo rend une pastille
    // portant son initiale, comme la liste des logements. Un `<img>` sans `src`
    // afficherait l'icone de fichier casse du navigateur.
    const photo = vignetteDuBien(b)
    const nom = `<span class="small" style="min-width: 0">${esc(b.name)}</span>`
    if (!d) {
      // Aucun sejour range ce mois-ci pour ce bien. C'est un FAIT — zero euro
      // encaisse — et non une absence de donnee : le bien a ete lu, sa ligne
      // simplement ne porte rien.
      const zero = `<span class="num small">${esc(euros(0, devise))}</span>`
      return {
        tr: `<tr>
        <th scope="row" class="rev-tbl__bien">
          <span class="rev-tbl__bien-int">
            ${photo}
            <span class="rev-tbl__nom">${nom}</span>
            <span class="caption muted" data-i18n="revenue.none"></span>
          </span>
        </th>
        <td class="rev-tbl__barre"></td>
        <td class="rev-tbl__num">${zero}</td>
        <td class="rev-tbl__num">${zero}</td>
        <td class="rev-tbl__num">${zero}</td>
      </tr>`,
        carte: `<li class="rev-carte">
        <div class="rev-carte__tete">
          <span class="rev-carte__bien">${photo}<span class="rev-tbl__nom">${nom}</span></span>
          <strong class="num rev-carte__total">${esc(euros(0, devise))}</strong>
        </div>
        <p class="caption muted" data-i18n="revenue.none"></p>
      </li>`
      }
    }
    const part = T.total_cents > 0 ? Math.round((d.total_cents / T.total_cents) * 100) : 0
    // La barre : plein = recu, hachure = a venir. Sa largeur est la PART du
    // total, pas une valeur absolue — sinon un petit mois donnerait des barres
    // minuscules et un gros mois des barres saturees.
    const partRecue = d.total_cents > 0 ? Math.round((d.recu_cents / d.total_cents) * 100) : 0

    // ⚠ CHAQUE LIGNE DIT CE QU'ELLE NE SAIT PAS, ET C'ETAIT LE DEFAUT LE PLUS
    // COUTEUX DU LOT — constat GRAVE de la review du 26 octobre 2026. Le module
    // SAIT qu'un montant manque (`d.refuses.montant`, `d.motifs`), et la ligne
    // ne lisait ni l'un ni l'autre : seule la pastille « brut » existait.
    //
    // Mesure : un bien dont le seul sejour a un Host Fee illisible affichait
    // « 0,00 € » — un FAIT, au niveau du bien, sous un total juste. Et le faux
    // zero etait PIRE que l'absence : un bien qui n'a vraiment rien touche n'a
    // pas de cle, donc affiche « aucun versement ce mois-ci » SANS chiffre.
    // L'ecran avait deux rendus, et c'est le FAUX qui portait le nombre.
    const refuses = (d.refuses && d.refuses.montant) || 0
    const marques = []
    if (d.bruts > 0) marques.push(t('revenue.gross'))
    if (refuses > 0) marques.push(t('revenue.no_amount_short', { n: refuses }))

    // ⚠ LE COMPTE DES SEJOURS EST CELUI DE TOUS LES SEJOURS, et ma version
    // precedente le soustrayait — ce que Thierry a releve a la recette du
    // 27 octobre 2026 : « 0 sejours · 2 sans montant se contredit ».
    //
    // J'avais ecrit l'inverse en commentaire : que soustraire EVITAIT la
    // contradiction. C'etait faux. « 0 sejours » est un FAIT faux — il y a bien
    // deux sejours ce mois-ci sur ce logement — et il entrait en conflit avec
    // le « 2 sans montant » de la ligne suivante. Deux nombres qui se
    // contredisent, et c'est le mien qui mentait.
    //
    // La forme juste est celle que Thierry a dictee : le NOMBRE REEL de
    // sejours, et le montant qui dit qu'il n'est pas calculable.
    const toutRefuse = refuses > 0 && d.total_cents === 0
    const montant = toutRefuse
      // Zero euro ET aucun montant calculable : on ne sait pas, on le dit.
      // Afficher « 0,00 € » ici affirmerait que ce logement n'a rien rapporte.
      ? `<span class="caption muted">${esc(t('revenue.unavailable'))}</span>`
      : `<strong class="num small">${esc(monnaie(recusParBien[idx] + avenirParBien[idx], devise))}</strong>`
    // ⚠ LA MARQUE « N SANS MONTANT » RESTE, MEME QUAND LE TOTAL DIT DEJA
    // « non calculable ». Ma premiere version la retirait dans ce cas, au motif
    // qu'elle serait redondante — et un test existant l'a refuse, avec raison :
    // `total_cents === 0 && refuses > 0` ne veut PAS dire « tous les sejours
    // sont refuses ». Deux sejours dont un refuse et l'autre a zero euro reel
    // donnent le meme etat, et la marque est alors la seule chose qui dit
    // COMBIEN manquent. Un compte n'est jamais redondant avec un etat.

    // ⚠ JAMAIS DE TIRET MUET, et mes cinq cellules en etaient. La regle du
    // depot est nommee : « un indicateur `null` s'affiche "non calculable" AVEC
    // SON MOTIF EN CLAIR, jamais 0, jamais un tiret muet »
    // (docs/kb/restitution-yield.md, cite par CLAUDE.md).
    //
    // ⚠ ET MON SIGNE ETAIT INVERSE ENTRE LES DEUX CAS, ce qui est pire que le
    // tiret lui-meme :
    //   · un bien SANS sejour affichait `—`, alors que le commentaire juste
    //     au-dessus dit « C'est un FAIT — zero euro encaisse ». Un fait rendu
    //     avec le signe d'une absence. Il affiche donc 0,00 €.
    //   · et sur `toutRefuse`, la colonne Total disait « non calculable »
    //     (juste) pendant que les deux autres disaient `—` (muet) : la meme
    //     inconnue, rendue de deux facons dans la MEME ligne. C'est la famille
    //     du constat n. 2 de Thierry — deux cellules d'une ligne qui ne
    //     racontent pas la meme chose.
    // ⚠ ELLE RECOIT DES EUROS DEJA REPARTIS, plus des centimes : arrondir ici
    // reintroduirait l'ecart que la repartition vient de fermer.
    const cellule = (eur, refuse) => refuse
      ? `<span class="caption muted">${esc(t('revenue.unavailable'))}</span>`
      : `<span class="num small">${esc(monnaie(eur, devise))}</span>`

    // ⚠ `--recu` EST UN NOMBRE NU, PAS UN POURCENTAGE, et c'est LA cause du
    // constat 2 de Thierry (« un mois entierement recu s'affiche hachure »).
    // La couche pleine fait
    // `inline-size: calc(var(--part) * var(--recu) / 100)` : avec `--recu: 100%`
    // cela donne `calc(50% * 100% / 100)`, c'est-a-dire un POURCENTAGE MULTIPLIE
    // PAR UN POURCENTAGE — invalide en CSS. La declaration tombe en silence, la
    // couche pleine n'a jamais eu de largeur, et SEULES LES HACHURES
    // s'affichaient, sur tous les mois et tous les biens depuis la livraison.
    // Rien ne pouvait le voir : aucune assertion ne lit une largeur calculee,
    // et le pourcentage s'ecrivait « correctement » dans l'attribut.
    const barre = `<span class="revenue-bar" style="--part: ${part}%; --recu: ${partRecue}" aria-hidden="true"></span>`
    // ⚠ LA LEGENDE DE LA CARTE NE REPETE PAS CE QUE LE TOTAL DIT DEJA
    // (recette de Thierry, 27 octobre 2026 : « corrige le doublon mobile »).
    // Quand tout est refuse, la carte ecrivait « non calculable » DEUX FOIS —
    // en total et en legende — plus la pastille « 2 sans montant » : trois
    // affirmations du meme fait sur trois lignes de 390 px, dont deux
    // identiques au caractere.
    //
    // Ce qu'on garde est ce qui APPORTE : le total dit l'etat, la pastille dit
    // le COMBIEN (« un compte n'est jamais redondant avec un etat », regle du
    // depot), et la legende ne garde que le nombre de sejours. L'ordinateur
    // n'avait pas le defaut : ses trois colonnes de chiffres portent l'etat, et
    // la cellule du nom ne le repete pas.
    const detail = toutRefuse
      ? ''
      : ' · ' + esc(t('revenue.split', {
        recu: monnaie(recusParBien[idx], devise), avenir: monnaie(avenirParBien[idx], devise)
      }))
    const chips = marques.length ? `<span class="chip caption">${esc(marques.join(' · '))}</span>` : ''
    return {
      tr: `<tr>
      <th scope="row" class="rev-tbl__bien">
        <span class="rev-tbl__bien-int">
          ${photo}
          <span class="rev-tbl__nom">${nom}</span>
          <span class="caption muted">${esc(t('revenue.stays', { n: d.sejours }))}</span>
          ${chips}
        </span>
      </th>
      <td class="rev-tbl__barre">${barre}</td>
      <td class="rev-tbl__num">${cellule(recusParBien[idx], toutRefuse)}</td>
      <td class="rev-tbl__num">${cellule(avenirParBien[idx], toutRefuse)}</td>
      <td class="rev-tbl__num">${montant}</td>
    </tr>`,
      // ⚠ LA CARTE GARDE LE COMPTE DE SEJOURS, que la demande de Thierry ne
      // mentionnait pas (« nom + total sur une ligne, barre, x recus · y a
      // venir »). C'est la regle « LE MOBILE SUIT L'ORDINATEUR » : le tableau
      // le porte, et le retirer au telephone serait une fonction perdue par
      // omission. Il tient sur la meme ligne que le detail, en legende.
      carte: `<li class="rev-carte">
      <div class="rev-carte__tete">
        <span class="rev-carte__bien">${photo}<span class="rev-tbl__nom">${nom}</span></span>
        <!-- ⚠ PAS DE strong ICI : la variable montant apporte deja son
             propre element — un strong.num.small pour un chiffre, un
             span.caption.muted pour « non calculable ». L'envelopper donnait
             un strong DANS un strong, donc un gras sur un gras, et une
             mention discrete promue en fort.
             ⚠ Et ce commentaire n'a PAS d'accents graves : il vit DANS un
             gabarit de chaine, et le premier en fermerait la chaine. Mesure :
             32 tests en SyntaxError « Unexpected identifier montant ». -->
        <span class="rev-carte__total">${montant}</span>
      </div>
      ${barre}
      <p class="caption muted">${esc(t('revenue.stays', { n: d.sejours }))}${detail}</p>
      ${chips}
    </li>`
    }
  })
  $('[data-list="revenue-rows"]').innerHTML = lignesRev.map(l => l.tr).join('')
  const carteList = $('[data-list="revenue-cards"]')
  if (carteList) carteList.innerHTML = lignesRev.map(l => l.carte).join('')
  I18n.apply($('[data-list="revenue-rows"]'))
  if (carteList) I18n.apply(carteList)
  // ⚠ UN `thead` SANS RANGEE AFFICHERAIT QUATRE COLONNES VIDES. Le tableau se
  // masque donc avec son contenu — ce que la liste de `div` n'avait pas besoin
  // de faire, et qui est le prix de la forme tabulaire.
  //
  // ⚠ ET LE COMPTE VIENT DE L'ETAT, PAS DU DOM. Ma premiere version lisait
  // `$('[data-list="revenue-rows"]').children.length` : le banc de
  // `tests/accueil-rapide.test.js` ne simule pas `children`, donc les six tests
  // du bloc levaient un TypeError. C'est la DEUXIEME fois aujourd'hui que je
  // mesure ce que le banc ne fournit pas — la premiere, c'etait `classList` sur
  // le bandeau. La regle est la meme : si l'information est deja dans l'etat,
  // on la lit la, et le rendu ne depend plus de ce que le double imite.
  const sansBien = !(etat.biens || []).length
  // ⚠ LA VUE COMPTE AUTANT QUE L'ABSENCE DE BIENS, et c'est le constat 1 de la
  // recette du 28 octobre : `renderAnnee()` est appele AU MILIEU de cette
  // fonction (plus haut), il masque le tableau du mois — et ces trois lignes,
  // qui viennent APRES, le reaffichaient. L'hote voyait donc, sous la courbe
  // de l'annee, les lignes « aucun versement ce mois-ci » du mois courant.
  // ⚠ ET LE SELECTEUR DOIT EXCLURE LE TABLEAU DE L'ANNEE : `.rev-tbl-wrap` nu
  // prend le PREMIER du document. Il tombe sur celui du mois aujourd'hui, mais
  // c'est un accident d'ordre dans le balisage, pas une garantie.
  const enAnneeMaintenant = etat.vueRevenus === 'annee'
  const wrap = document.querySelector('.rev-tbl-wrap:not(.rev-an-tbl):not(.rev-rad-tbl)')
  if (wrap) wrap.hidden = sansBien || enAnneeMaintenant
  // ⚠ LES DEUX FORMES SE MASQUENT ENSEMBLE. C'est la media query qui choisit
  // laquelle s'affiche ; `hidden` dit s'il y a quelque chose a afficher. Les
  // confondre laisserait la liste du telephone visible sur un compte sans
  // logement, la ou le tableau disparait.
  if (carteList) carteList.hidden = sansBien || enAnneeMaintenant
}

// ─── LA VUE ANNEE ──────────────────────────────────────────────────────────

// Douze cases, `null` la ou l'annee ne porte RIEN. ⚠ `null` ET NON 0 : un mois
// sans ligne n'est pas un mois a zero — pour un logement ouvert en septembre,
// janvier veut dire « il n'existait pas ». L'endpoint ne comble aucun trou
// precisement pour que cette distinction arrive jusqu'ici, et la courbe coupe
// son trait sur un `null`.
//
// `de` et `a` bornent la tranche de mois rendue (1 a 12, inclus) : c'est ce qui
// permet de tracer le REALISE et le DEJA RESERVE comme deux traits d'une meme
// serie, qui se rejoignent sur le mois courant.
function douzeMois (parMois, an, champ, de = 1, a = 12) {
  const out = []
  for (let m = 1; m <= 12; m++) {
    const c = parMois && parMois[`${an}-${String(m).padStart(2, '0')}`]
    // ⚠ UN MOIS DONT AUCUN MONTANT N'EST CALCULABLE REND `null`, PAS 0 — et
    // c'est le defaut que la vue Mois a ferme en trois endroits le 27 octobre
    // (« le faux zero etait PIRE que l'absence »). Sans cette ligne, un mois a
    // `{sejours: 2, total_cents: 0, sans_montant: 2}` dessinait un POINT PLEIN
    // POSE SUR L'AXE : la courbe affirmait « ce mois-la, zero euro » la ou le
    // coeur dit « je ne sais pas ». Le module coupe le trait sur un `null`,
    // c'est deja son contrat.
    out.push((m >= de && m <= a && c && !refuseTout(c)) ? Number(c[champ] || 0) / 100 : null)
  }
  return out
}

// ⚠ « NON CALCULABLE » N'EST JAMAIS ZERO. Un mois ne refuse QUE si son total
// est nul ET qu'il porte des sejours sans montant : un mois a 3 sejours dont 1
// sans montant garde son total partiel — c'est une verite incomplete, et la
// reserve le dit en chiffres. Meme regle que `toutRefuse` de la vue Mois.
const refuseTout = (c) => !!c && Number(c.sans_montant || 0) > 0 && Number(c.total_cents || 0) === 0

// Le total d'une tranche, ET ce qu'il ne sait pas dire. ⚠ LES DEUX ENSEMBLE,
// parce que `0` tout seul ne distingue pas « rien encaisse » de « rien de
// calculable » — et que c'est exactement la confusion que l'ecran doit refuser.
const bilanPeriode = (parMois, an, champ, jusquAu = 12) => {
  let total = 0, sansMontant = 0, mesures = 0, lignes = 0
  for (let m = 1; m <= jusquAu; m++) {
    const c = parMois && parMois[`${an}-${String(m).padStart(2, '0')}`]
    if (!c) continue
    lignes++
    sansMontant += Number(c.sans_montant || 0)
    if (refuseTout(c)) continue
    total += Number(c[champ] || 0)
    mesures++
  }
  // ⚠ TROIS ETATS, ET « 0 € » N'EN EST QU'UN. `absente` = l'annee ne porte
  // AUCUNE ligne pour ce perimetre : le logement n'existait pas, ou n'a rien
  // vendu du tout. Ce n'est pas « il a encaisse zero euro » — constat 2 de la
  // recette du 28 octobre, « Studio Centre : colonne 2025 = 0 € alors qu'il n'a
  // aucun sejour en 2025 ». L'endpoint ne rend que les mois qui portent quelque
  // chose, donc l'absence de cle EST l'information.
  return {
    total, sansMontant, mesures, lignes,
    refuse: mesures === 0 && sansMontant > 0,
    absente: lignes === 0
  }
}

// La somme d'une TRANCHE de mois. ⚠ ELLE N'EST PAS TOUJOURS L'ANNEE ENTIERE, et
// c'est la decision 2 de Thierry : l'annee EN COURS se compare a date — janvier
// au mois courant, des deux cotes —, une annee PASSEE se compare en entier.
// Comparer dix mois de 2026 a douze de 2025 serait une baisse inventee.
const sommePeriode = (parMois, an, champ, jusquAu = 12) =>
  bilanPeriode(parMois, an, champ, jusquAu).total

// Les sejours sans montant d'une tranche, pour la reserve qui les compte.
const sansMontantDe = (parMois, an, jusquAu = 12) =>
  bilanPeriode(parMois, an, 'total_cents', jusquAu).sansMontant

// ⚠ L'ECART EN % N'EXISTE QUE SI LA BASE DE COMPARAISON EXISTE. Sans N-1, on
// ne rend pas « +100 % » ni « 0 % » : on rend `null`, et l'ecran le dit.
// « Pas comparable » n'est jamais « +0 % » — c'est la meme regle que
// « non calculable n'est jamais zero ».
function ecartPourcent (n, n1) {
  if (!Number.isFinite(n) || !Number.isFinite(n1) || n1 <= 0) return null
  return Math.round(((n - n1) / n1) * 100)
}

// Le nom du mois SEUL, sans son annee : « Janvier → octobre 2026 » porte
// l'annee une fois, a la fin. ⚠ `moisEnClair` ne convient pas ici — il rend
// « octobre 2026 », et la periode s'ecrirait « Janvier → octobre 2026 2026 ».
function moisSeul (mois) {
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(mois || ''))) return ''
  const [an, m] = String(mois).split('-').map(Number)
  return dateDuJour(`${an}-${String(m).padStart(2, '0')}-15`, { month: 'long' })
}

// La graduation de l'axe, en forme COURTE : « 10 k € » plutot que « 10 000 € ».
// ⚠ PAS DE « k » EN DUR : `notation: 'compact'` le fait dire par `Intl`, dans la
// langue et la devise du compte. Un « k€ » ecrit a la main serait faux en
// espagnol comme pour une devise non euro, et `scripts/i18n-check.js` ne lit
// que les fichiers de locale — il ne l'aurait jamais vu.
const monnaieCourte = (n, devise) => new Intl.NumberFormat(I18n.lang, {
  style: 'currency', currency: devise || 'EUR', notation: 'compact', maximumFractionDigits: 1
}).format(n)

// ⚠ J'AI ECRIT ICI UN REPLI QUI NE SERVAIT JAMAIS, ET JE L'AI RETIRE. Il
// comparait les libelles courts entre eux et retombait sur le montant plein si
// deux se repetaient — « une graduation qui se repete ne gradue plus rien ».
// Le raisonnement etait juste, la prudence inutile : depuis que le haut de
// l'axe est RELEVE a un palier rond, les paliers valent 0, p et 2p, et deux
// multiples distincts d'un meme pas ne s'ecrivent pas pareil.
// BALAYAGE de 1 € a 2 000 000 €, 27 octobre 2026 : **zero collision**.
// ⚠ CE QUE LA MESURE NE COUVRE PAS : elle a ete faite en francais et en euros.
// Une devise sans forme compacte dans une locale donnee rendrait des libelles
// plus longs — la marge gauche de la courbe s'y adapte deja — mais pas des
// libelles identiques. Un repli qu'aucun test ne peut faire rougir est une
// branche morte qui affirme qu'elle sert : c'est la lecon du reste negatif de
// la repartition, retire pour la meme raison.

function renderAnnee () {
  const bloc = $('[data-bind="revenue-annee"]')
  if (!bloc) return
  const enAnnee = etat.vueRevenus === 'annee'
  bloc.hidden = !enAnnee
  // Le bandeau et les listes du mois cedent la place, et reviennent au retour.
  // ⚠ LES NEGATIONS NOMMENT TOUTES LES FORMES DE L'ANNEE, pas seulement la
  // premiere. Le tableau « Reserve a date » a ajoute un 3e `.rev-tbl-wrap` et
  // une 2e `.rev-liste` : ces selecteurs les attrapaient, et ne rendaient juste
  // que parce que `querySelector` prend le PREMIER du document — « un accident
  // d'ordre dans le balisage, pas une garantie », dit le commentaire d'a cote.
  for (const sel of ['.rev-tbl-wrap:not(.rev-an-tbl):not(.rev-rad-tbl)',
    '.rev-liste:not(.rev-liste--annee):not(.rev-rad-liste)']) {
    const n = document.querySelector(sel)
    if (n) n.hidden = enAnnee || !(etat.biens || []).length
  }
  const bandeauMois = $('[data-bind="revenue-total"]')
  const carteMois = bandeauMois && bandeauMois.closest('.card')
  if (carteMois) carteMois.hidden = enAnnee
  if (!enAnnee) return

  const an = etat.anneeRevenus
  const devise = deviseDuCompte()
  const etatTexte = $('[data-bind="revenue-annee-etat"]')
  const dire = (cle) => {
    if (!etatTexte) return
    etatTexte.hidden = !cle
    etatTexte.textContent = cle ? t(cle) : ''
  }

  // ⚠ TROIS ETATS, PAS DEUX. « Je charge », « ça a echoue » et « je n'ai rien a
  // montrer » ne se confondent pas : le deuxieme est une panne, le troisieme un
  // fait. Les ecraser en un seul ferait lire « aucun revenu » sur une lecture
  // ratee.
  const vide = (s) => { const n = document.querySelector(s); if (n) n.innerHTML = '' }
  const videTout = () => {
    for (const b of ['revenue-annee-courbe', 'revenue-annee-legende']) vide(`[data-bind="${b}"]`)
    // ⚠ LES DEUX LISTES DU TABLEAU « RESERVE A DATE » EN SONT, et elles y
    // manquaient : constat GRAVE de la review du 28 octobre 2026. `renderAnnee`
    // sort par `return` AVANT le code du tableau quand l'etat est
    // « chargement » ou « echec » — donc le bloc gardait ses lignes. Mesure :
    // apres un rendu de 2026 puis un echec, l'ecran disait « Lecture
    // impossible » au-dessus d'un tableau peuplé des pourcentages de l'annee
    // qu'on venait de quitter. C'est la garantie que `chargerAnnee` enonce :
    // « un echec se dit, il ne laisse pas l'annee precedente a l'ecran sous un
    // libelle qui en annonce une autre. »
    for (const l of ['revenue-annee-filtres', 'revenue-annee-lignes', 'revenue-annee-cartes',
      'revenue-annee-rad-lignes', 'revenue-annee-rad-cartes']) vide(`[data-list="${l}"]`)
    // ⚠ LES EN-TETES DE COLONNE AUSSI. Sans elles, « Lecture impossible »
    // s'affichait au-dessus d'un tableau vide dont l'en-tete annoncait encore
    // « 2026 | 2025 | Ecart » : un cadre qui promet des chiffres qu'on n'a pas.
    for (const b of ['revenue-annee-periode', 'revenue-annee-n', 'revenue-annee-n1',
      'revenue-annee-n1-label', 'revenue-annee-note',
      'revenue-annee-col-n', 'revenue-annee-col-n1']) {
      const n = document.querySelector(`[data-bind="${b}"]`); if (n) n.textContent = ''
    }
    for (const sel of ['.rev-an-tbl', '.rev-liste--annee']) {
      const n = document.querySelector(sel); if (n) n.hidden = true
    }
    // ⚠ ET LE BLOC LUI-MEME, pas seulement ses lignes : son TITRE et son
    // en-tete de colonnes resteraient sinon au-dessus d'un tableau vide.
    const rad_ = $('[data-bind="revenue-annee-rad"]'); if (rad_) rad_.hidden = true
    const r = $('[data-bind="revenue-annee-reserves"]'); if (r) { r.hidden = true; r.textContent = '' }
  }
  if (etat.anneeEtat === 'chargement') { dire('revenue.computing'); videTout(); return }
  // ⚠ `!etat.annee.total` ET NON `=== null` : la vue Mois ecrit la forme lache
  // (l. 1340) et son commentaire dit pourquoi. Mesure de la review : avec un
  // `total` ABSENT mais un `par_bien` peuplé, la garde stricte laissait passer
  // — en-tete a « 0 € » au-dessus d'une ligne a « 1 234 € », sans message.
  if (etat.anneeEtat === 'echec' || !etat.annee || !etat.annee.total) {
    dire('revenue.unavailable'); videTout(); return
  }
  dire(null)

  const a = etat.annee
  // La tranche comparee : a date pour l'annee en cours, entiere sinon.
  const anneeCourante = Number(String(etat.aujourdHui).slice(0, 4))
  const moisCourant = Number(String(etat.aujourdHui).slice(5, 7))
  const enCours = an === anneeCourante
  const jusquAu = enCours ? moisCourant : 12

  // ─── L'en-tete : la periode nommee, le total, et N-1 a cote ─────────────
  // ⚠ LE TOTAL DE L'EN-TETE EST CELUI DU COMPTE, et il ne suit PAS la pastille
  // de filtre : les pastilles sont posees sur la ligne de la legende parce
  // qu'elles filtrent LA COURBE. Un grand chiffre qui changerait sous une
  // pastille serait ambigu — on ne saurait plus s'il parle du compte ou d'un
  // bien —, et le tableau en dessous donne deja le total de chaque logement.
  // Le tableau redevient visible apres un echec precedent.
  for (const sel of ['.rev-an-tbl', '.rev-liste--annee']) {
    const n = document.querySelector(sel); if (n) n.hidden = false
  }
  // ⚠ LA PASTILLE SE RESOUT AVANT L'EN-TETE, et c'est l'ordre qui a change le
  // 28 octobre : l'en-tete en depend desormais. Seuls les logements qui portent
  // quelque chose sur l'une des deux annees — une pastille qui ne tracerait
  // rien n'est pas un filtre, c'est un cul-de-sac.
  const avecDonnees = (etat.biens || []).filter(b => {
    const pm = a.par_bien && a.par_bien[String(b.id)]
    return pm && Object.keys(pm).length > 0
  })
  // Une pastille retiree ne laisse pas un filtre orphelin : le bien choisi peut
  // disparaitre d'un rechargement, et la selection perimee s'oublie. Son seul
  // effet reel est la : sans elle, `find` rend `undefined`, « Tous » se rallume
  // et la courbe montre le compte — rien ne se vide.
  if (etat.filtreAnnee && !avecDonnees.some(b => String(b.id) === etat.filtreAnnee)) {
    etat.filtreAnnee = null
  }
  const choisi = etat.filtreAnnee ? avecDonnees.find(b => String(b.id) === etat.filtreAnnee) : null

  // ⚠ L'EN-TETE SUIT LA PASTILLE DEPUIS LE 28 OCTOBRE (decision Q1 de Thierry),
  // et avec SON POURCENTAGE. Ce n'est pas un revirement sur la decision 1 :
  // celle-ci interdisait l'ecart au niveau du COMPTE, ou les deux annees ne
  // portent pas les memes logements. Au niveau d'un BIEN, elles parlent du
  // meme — l'ecart y est comparable, et c'est ce que la maquette des
  // comparables montre (« La bulle · janvier -> octobre 2026 », « +8 % »).
  const perimetreEntete = choisi ? (a.par_bien[String(choisi.id)] || {}) : a.total
  const bilanN = bilanPeriode(perimetreEntete, an, 'total_cents', jusquAu)
  const bilanN1 = bilanPeriode(perimetreEntete, an - 1, 'total_cents', jusquAu)
  const totalN = bilanN.total
  const totalN1 = bilanN1.total
  // ⚠ UN TOTAL QUI NE SAIT RIEN NE S'ECRIT PAS « 0 € ». Si aucun mois de la
  // tranche n'est calculable et que des sejours sont sans montant, le chiffre
  // n'existe pas : on le DIT. La vue Mois fait exactement cela (`toutRefuse`).
  // ⚠ « — » POUR UNE ABSENCE, « non calculable » POUR UN REFUS, le montant
  // sinon. Les trois disent des choses differentes et ne se remplacent pas :
  // « 0 € » affirme un encaissement nul, le tiret dit qu'il n'y a rien a
  // montrer, « non calculable » dit que le coeur ne sait pas. Le motif du
  // tiret vit a cote — colonne « Ecart » sur une ligne, reserve sous le bloc
  // pour l'en-tete (decision de Thierry, recette du 28 octobre : « — avec
  // motif, ou pas comparable »).
  const TIRET = '—'
  const montantOuRefus = (bilan) => bilan.absente
    ? TIRET
    : (bilan.refuse ? t('revenue.unavailable') : monnaie(Math.round(bilan.total / 100), devise))
  // ⚠ LA PERIODE NOMME LE LOGEMENT quand il y en a un : « La bulle · janvier ->
  // octobre 2026 ». Sans cela, le grand chiffre change sous la pastille sans
  // que rien ne dise de quoi il parle — exactement l'ambiguite que je
  // redoutais quand l'en-tete ne suivait pas.
  const prefixeBien = choisi ? `${String(choisi.name || '')} · ` : ''
  $('[data-bind="revenue-annee-periode"]').textContent = prefixeBien + (enCours
    ? t('revenue.annee_periode_cours', {
      mois: moisSeul(`${an}-${String(moisCourant).padStart(2, '0')}`), annee: String(an)
    })
    : t('revenue.annee_periode_entiere', { annee: String(an) }))
  $('[data-bind="revenue-annee-n"]').textContent = montantOuRefus(bilanN)
  $('[data-bind="revenue-annee-n1-label"]').textContent = String(an - 1)
  $('[data-bind="revenue-annee-n1"]').textContent = montantOuRefus(bilanN1)
  // L'ecart de l'en-tete : pour un BIEN seulement, jamais pour le compte.
  const noeudEcart = $('[data-bind="revenue-annee-ecart"]')
  if (noeudEcart) {
    // ⚠ `ecartPourcent` PROTEGE LE DENOMINATEUR, PAS LE NUMERATEUR. Mesure de
    // la review : un bien qui n'a de lignes qu'en 2025 affichait « — » comme
    // montant N et « −100 % » comme ecart, cote a cote — « je ne sais pas » et
    // une chute inventee dans la meme phrase. Les trois etats de `bilanPeriode`
    // existent pour eviter exactement cela ; l'en-tete ne les lisait pas.
    const comparable = !bilanN.absente && !bilanN.refuse && !bilanN1.absente && !bilanN1.refuse
    const pctEntete = choisi && comparable ? ecartPourcent(bilanN.total, bilanN1.total) : null
    noeudEcart.hidden = pctEntete === null
    noeudEcart.className = `caption rev-tbl__ecart${pctEntete !== null && pctEntete < 0 ? ' rev-tbl__ecart--bas' : ''}`
    noeudEcart.textContent = pctEntete === null ? '' : (pctEntete > 0 ? '+' : '') + pctEntete + ' %'
  }
  // ⚠ AUCUN POURCENTAGE ICI, ET C'EST LA DECISION 1 DE THIERRY, CONFIRMEE LE
  // 27 OCTOBRE APRES LA MAQUETTE. Le perimetre des deux annees n'est pas le
  // meme : un logement arrive en cours d'annee gonfle N sans rien devoir a
  // l'exploitation. La maquette le demontrait elle-meme — son « +14 % » devient
  // +0,2 % sans le bien « nouveau en 2026 ». L'ecart vit sur les LIGNES.

  // ─── Les pastilles de filtre ────────────────────────────────────────────
  const puce = (val, texte, actif) =>
    `<button type="button" class="rev-an-puce${actif ? ' is-on' : ''}" data-filtre="${esc(val)}" `
    + `aria-pressed="${actif ? 'true' : 'false'}">${esc(texte)}</button>`
  $('[data-list="revenue-annee-filtres"]').innerHTML =
    puce('', t('revenue.annee_filtre_tous'), !choisi)
    + avecDonnees.map(b => puce(String(b.id), String(b.name || ''), choisi && String(b.id) === String(choisi.id))).join('')

  // ─── La courbe, une seule, filtree par la pastille ──────────────────────
  // ⚠ LE REALISE ET LE DEJA RESERVE SONT DEUX TRAITS D'UNE MEME SERIE, qui se
  // REJOIGNENT sur le mois courant (`de: jusquAu`) : sans ce chevauchement d'un
  // mois, le trait se couperait au changement de style et la courbe aurait un
  // trou la ou il n'y en a pas. Le pointille dit « deja reserve », pas
  // « prevision » — la note de bas de bloc le repete en mots.
  const parMois = choisi ? (a.par_bien[String(choisi.id)] || {}) : a.total
  // ⚠ LA FRONTIERE SUIT LA DONNEE, PAS LE CALENDRIER — constat 3 de la recette
  // du 28 octobre : « octobre (0 € recu, 480 € a venir) se trace en plein ».
  // Ma premiere version coupait au MOIS COURANT : le mois courant entrait donc
  // dans le trait plein, et l'ecran affirmait « encaisse » un argent qui n'est
  // que reserve. Or un mois n'est pas realise parce qu'il a commence — il l'est
  // quand il a encaisse.
  //
  // On cherche donc le DERNIER mois qui a reellement recu quelque chose, et
  // c'est la que le plein s'arrete. Octobre a 0 € recu bascule du bon cote
  // tout seul ; un novembre a 300 € recu resterait plein, lui.
  // ⚠ LES DEUX TRAITS SE REJOIGNENT SUR CE MOIS-LA (`de: dernierRecu`), sinon
  // la courbe aurait un trou la ou il n'y en a pas.
  let dernierRecu = 0
  for (let m = 1; m <= jusquAu; m++) {
    const c = parMois && parMois[`${an}-${String(m).padStart(2, '0')}`]
    if (c && !refuseTout(c) && Number(c.recu_cents || 0) > 0) dernierRecu = m
  }
  // ─── « RESERVE A DATE » ─────────────────────────────────────────────────
  // ⚠ ELLE NE COUVRE QUE LES MOIS A VENIR. Sur un mois deja clos de N-1, le
  // revenu FINAL est connu et c'est lui qui vaut : comparer un etat
  // intermediaire a un resultat final serait comparer deux choses
  // differentes. Le trait gris plein, lui, reste sur les douze mois.
  const rad = a.reserve_a_date
  const radPerimetre = rad && (choisi
    ? (rad.par_bien && rad.par_bien[String(choisi.id)]) || {}
    : rad.mois)
  let radSousSeuil = 0
  let radReserves = 0
  const radValeurs = []
  for (let m = 1; m <= 12; m++) {
    const c = radPerimetre && radPerimetre[`${an - 1}-${String(m).padStart(2, '0')}`]
    // Un mois deja encaisse n'a pas de « reserve a date » a montrer.
    if (!c || !enCours || m <= dernierRecu) { radValeurs.push(null); continue }
    if (c.sous_seuil) {
      // ⚠ SOUS LE SEUIL, PAS DE POINT — ET UN COMPTE. L'endpoint ne rend
      // meme pas le montant : on ne peut pas le tracer par accident.
      radSousSeuil++
      radValeurs.push(null)
      continue
    }
    radReserves += Number(c.sans_date_annulation || 0) + Number(c.non_fiables || 0)
    radValeurs.push(Number(c.total_cents || 0) / 100)
  }
  const aDuReserveADate = radValeurs.some(v => Number.isFinite(v))

  const series = [
    { nom: String(an - 1), couleur: 'var(--muted)', epaisseur: 2,
      valeurs: douzeMois(parMois, an - 1, 'total_cents') },
    { nom: String(an), couleur: 'var(--ink)', epaisseur: 2.5,
      valeurs: douzeMois(parMois, an, 'total_cents', 1, dernierRecu) }
  ]
  // Y a-t-il quelque chose APRES le dernier mois encaisse ? C'est ca, le deja
  // reserve — et il n'existe que sur l'annee en cours.
  const aDuReserve = enCours
    && douzeMois(parMois, an, 'total_cents', dernierRecu + 1, 12).some(v => Number.isFinite(v))
  if (aDuReserve) {
    series.push({ nom: t('revenue.annee_reserve'), couleur: 'var(--ink)', epaisseur: 2,
      pointille: true, valeurs: douzeMois(parMois, an, 'total_cents', Math.max(1, dernierRecu), 12) })
  }
  // ⚠ GRIS ET POINTILLE : gris parce que c'est l'an dernier, pointille parce
  // que c'est un ETAT A UNE DATE et non un resultat. Les deux traits gris
  // coexistent, et c'est voulu — le plein dit ce que N-1 a FINI par faire, le
  // pointille ce qu'il avait VENDU au meme jour.
  if (aDuReserveADate) {
    series.push({
      // ⚠ LES DEUX PARAMETRES, ET C'EST LE DEFAUT DE RECETTE DU 28 OCTOBRE
      // 2026 (Thierry, en PRODUCTION) : `revenue.annee_rad_legende` vaut
      // « {annee} réservé au {date} », et seul `date` etait passe. `I18n.t`
      // laisse alors l'accolade TELLE QUELLE — c'est son repli explicite quand
      // une variable manque (`shared/i18n/i18n.js`, fonction `t`) —, donc la
      // legende affichait litteralement « {annee} réservé au 28 oct. » — et
      // l'info-bulle la reprenait. Aucun test ne pouvait le voir : le double
      // d'`I18n.t` du banc rend la CLEF, il ne substitue rien.
      nom: t('revenue.annee_rad_legende', {
        annee: String(an - 1),
        date: dateDuJour(String(rad.pivot), { day: 'numeric', month: 'short' })
      }),
      couleur: 'var(--muted)', epaisseur: 2, pointille: true, valeurs: radValeurs
    })
  }
  const PALIERS = 3
  // ⚠ RIEN A TRACER NE SE TRACE PAS. Avec un perimetre vide — le cas reel du
  // membre delegue sans bien —, le plancher `Math.max(1, …)` du module faisait
  // un axe « 0 € / 0,50 € / 1 € » sous un total de 0 € : un repere gradue en
  // centimes pour une courbe qui n'existe pas. On le dit en mots.
  const riendDuTout = !series.some(se => se.valeurs.some(v => Number.isFinite(v)))
  // ─── LA BANDE DES COMPARABLES ───────────────────────────────────────────
  // ⚠ DEUX BANDES, PAS UNE, et elles ne disent pas la meme chose :
  //   `clos`  = l'estimation AirROI du revenu de chaque comparable ;
  //   `futur` = la somme des PRIX AFFICHES de ses nuits indisponibles.
  // La seconde n'est pas du « deja reserve » — `available = false` confond une
  // nuit vendue, une nuit que l'hote a fermee et une nuit invendable par
  // sejour minimum. Les mots de l'ecran le disent (decision de Thierry) :
  // « occupe chez les comparables », jamais « reserve ».
  const comp = choisi ? etat.comparablesParBien[`${an}|${String(choisi.id)}`] : null
  // ⚠ UNE LECTURE RATEE SE DIT. `null` veut dire « on n'a pas pu lire », et
  // mon commentaire du chargeur affirmait que l'ecran dirait « non
  // calculable » — il ne disait rien du tout, et l'hote concluait qu'il n'a
  // pas de comparables. C'est le renversement exact de la regle du depot.
  const compEchoue = choisi && comp === null
  const compEnVol = choisi && comp === undefined
  const bandes = []
  let compDate = null
  let compNb = null
  let compPlusieursDates = false
  let compEcartes = 0
  if (comp && comp.mois) {
    const douze = (nature, champ) => {
      const out = []
      for (let m = 1; m <= 12; m++) {
        const c = comp.mois[`${an}-${String(m).padStart(2, '0')}`]
        out.push(c && c.nature === nature && Number.isFinite(Number(c[champ])) ? Number(c[champ]) / 100 : null)
      }
      return out
    }
    // ⚠ J'AVAIS ECRIT `var(--bg-sub)`, QUI N'EXISTE PAS dans `shared/theme.css`.
    // Une couleur inventee ne rougit nulle part : le module la refuse par sa
    // liste blanche et retombe sur `var(--ink)` — donc une bande NOIRE, pleine,
    // par-dessus la courbe. C'est la meme famille que le `[hidden]` sans
    // `!important` : le defaut ne casse rien, il rend juste l'ecran faux.
    // Les deux jetons ci-dessous existent, et ils suivent le mode sombre.
    // ⚠ DEUX JETONS, ET LE FUTUR EST LE PLUS CLAIR (decision E de Thierry).
    // `--border` pour le realise, `--line` pour l'occupe : les deux existent au
    // theme, `--line` y est plus clair que `--border`, et tous deux suivent le
    // mode sombre. J'avais mis `--amber-soft` pour le futur — quasi invisible
    // sur fond blanc.
    // ⚠ ET AUCUNE VALEUR HEXA ICI, MEME EN COMMENTAIRE : le garde-fou
    // « aucun hexa hors de shared/theme.css » les compte aussi, et il a raison
    // — une couleur ecrite a la main dans un commentaire devient la reference
    // de qui le lit, puis se recopie dans du code.
    // ⚠ LE MEME GRIS A DEUX DENSITES, et non deux gris voisins. `--border` et
    // `--line` ne different que de quatorze points de luminosite : a l'ecran,
    // Thierry les a vues « trop proches » (recette du 28 octobre). Le remede
    // n'est pas une couleur vive — ce sont deux OPACITES du meme `--muted`,
    // qui restent grises, tiennent en mode sombre, et se distinguent d'un coup
    // d'oeil parce que c'est la DENSITE qui change, pas la teinte.
    // ⚠ ET ELLES SONT BEAUCOUP PLUS CLAIRES DEPUIS LA RECETTE DU 29 OCTOBRE
    // 2026 (Thierry, en production) : « le gris est trop fonce, l'adoucir
    // beaucoup, elle doit rester un fond discret derriere les courbes ».
    // Elles etaient a 0,34 et 0,11 — la premiere posait un gris franc
    // PAR-DESSUS lequel les deux courbes devaient se lire. Une bande de
    // comparaison est un DECOR : si l'oeil la voit avant la courbe de l'hote,
    // le rapport est inverse.
    // ⚠ LE RAPPORT DE DEUX TIENT, et il est garde par un test : les deux
    // bandes doivent rester distinguables (constat de la recette du 28) ET
    // discretes (constat du 29). Baisser la seule foncee aurait referme le
    // premier defaut en ouvrant le second.
    for (const [nature, opacite] of [['clos', 0.15], ['futur', 0.07]]) {
      const min = douze(nature, 'min_cents')
      const max = douze(nature, 'max_cents')
      if (min.some(v => Number.isFinite(v))) bandes.push({ nature, min, max, couleur: 'var(--muted)', opacite })
    }
    // ⚠ LE COMPTE ET LA DATE SE TIRENT DES MOIS REELLEMENT TRACES, pas de tout
    // ce que l'endpoint a rendu. Il couvre TROIS annees (N-1 a N+1) : mon
    // premier jet prenait le MAXIMUM de comparables et la date la plus RECENTE,
    // tous mois confondus — la note annoncait donc « parmi vos 8 logements »
    // pour une bande dont un mois n'en porte que 2, et une date qui pouvait
    // venir d'un mois non affiche.
    const tracés = []
    for (let m = 1; m <= 12; m++) {
      const c = comp.mois[`${an}-${String(m).padStart(2, '0')}`]
      if (c) tracés.push(c)
    }
    // Les comparables ECARTES faute d'activite, sur les mois traces.
    compEcartes = tracés.reduce((t, c) => Math.max(t, Number(c.sans_activite) || 0), 0)
    const nbs = tracés.map(c => Number(c.comparables) || 0).filter(n => n > 0)
    compNb = nbs.length ? { min: Math.min(...nbs), max: Math.max(...nbs) } : null
    const dates = [...new Set(tracés.map(c => String(c.releve_le)).filter(Boolean))].sort()
    compDate = dates.length ? dates[dates.length - 1] : null
    compPlusieursDates = dates.length > 1
  }
  const noeudCourbe = $('[data-bind="revenue-annee-courbe"]')
  if (noeudCourbe && riendDuTout) {
    noeudCourbe.innerHTML = `<p class="caption muted">${esc(t('revenue.annee_vide'))}</p>`
  } else if (noeudCourbe) {
    noeudCourbe.innerHTML = courbeMensuelle({
      series,
      bandes,
      ...repereDeCourbe(),
      graduations: PALIERS,
      // ⚠ L'AXE SE RELEVE A UN PALIER ROND : sans cela, trois paliers calcules
      // sur le maximum reel ecrivaient « 0 € / 6,3 k € / 12,6 k € » (banc du
      // 27 octobre). Un axe sert a situer, et 6,3 k ne situe rien.
      arrondir: true,
      // ⚠ LE MOIS COURANT EN GRAS, et seulement pour l'annee EN COURS : sur une
      // annee passee, aucun mois n'est « maintenant ».
      moisFort: enCours ? moisCourant - 1 : undefined,
      graduation: (v) => monnaieCourte(v, devise),
      bulle: (v, k, s) => `${s.nom} · ${monnaie(Math.round(v), devise)}`,
      initiales: initialesDesMois(),
      resume: choisi
        ? t('revenue.courbe_bien_resume', { bien: String(choisi.name || ''), n: String(an), n1: String(an - 1) })
        : t('revenue.courbe_resume', { n: String(an), n1: String(an - 1) })
    })
  }
  // La legende : trois marques au plus, et la troisieme n'apparait que si le
  // trait pointille existe vraiment.
  const noeudLeg = $('[data-bind="revenue-annee-legende"]')
  if (noeudLeg && riendDuTout) {
    noeudLeg.innerHTML = ''
  } else if (noeudLeg) {
    const marque = (classe, texte) =>
      `<span><i class="rev-an-marque rev-an-marque--${classe}"></i>${esc(texte)}</span>`
    noeudLeg.innerHTML = marque('plein', String(an))
      + (aDuReserve ? marque('pointille', t('revenue.annee_reserve')) : '')
      + marque('n1', String(an - 1))
      // ⚠ LA MARQUE DE LA BANDE N'APPARAIT QUE SI LA BANDE EXISTE : une
      // legende qui nomme un trait absent est un mensonge de plus.
      // ⚠ UNE MARQUE PAR BANDE, chacune nommee. Deux polygones de couleurs
      // differentes sous une seule etiquette laissaient l'hote devant une
      // bande que rien ne nommait, et une note qui attribuait tout a l'autre.
      + (aDuReserveADate ? marque('n1-pointille', t('revenue.annee_rad_legende', {
        annee: String(an - 1),
        date: dateDuJour(String(rad.pivot), { day: 'numeric', month: 'short' })
      })) : '')
      + bandes.map(b => marque(
        b.nature === 'clos' ? 'bande' : 'bande-futur',
        t(b.nature === 'clos' ? 'revenue.annee_comparables_legende' : 'revenue.annee_comparables_legende_futur')
      )).join('')
  }

  // ─── Le tableau par logement ────────────────────────────────────────────
  // ⚠ LES MONTANTS AFFICHES SONT REPARTIS, PAS ARRONDIS UN PAR UN, et c'est le
  // constat de recette de Thierry du 27 octobre sur la vue Mois : deux biens a
  // 100,50 € donnaient « 201 € » en tete et « 101 € + 101 € » en lignes. Ici le
  // grand total et les lignes sont dans le MEME bloc, donc l'incoherence est
  // encore plus visible. `repartirEnEuros` est la regle du depot, et elle etait
  // deja ecrite a dix lignes d'ici.
  const brutsN = avecDonnees.map(b => bilanPeriode(a.par_bien[String(b.id)] || {}, an, 'total_cents', jusquAu))
  const brutsN1 = avecDonnees.map(b => bilanPeriode(a.par_bien[String(b.id)] || {}, an - 1, 'total_cents', jusquAu))
  const eurosN = repartirEnEuros(brutsN.map(x => x.total))
  const eurosN1 = repartirEnEuros(brutsN1.map(x => x.total))
  const lignes = avecDonnees.map((b, i) => {
    const pm = a.par_bien[String(b.id)] || {}
    const pct = ecartPourcent(brutsN[i].total, brutsN1[i].total)
    // ⚠ « NOUVEAU EN 2026 » EST UN FAIT, ET IL SE VERIFIE SUR L'ANNEE ENTIERE,
    // PAS SUR LA FENETRE COMPAREE. Mesure de la review : un bien qui a vendu en
    // DECEMBRE 2025 et qui a du deja-reserve en NOVEMBRE 2026 n'a rien entre
    // janvier et octobre des deux cotes — il etait donc annonce « nouveau en
    // 2026 », alors qu'il exploite depuis l'an dernier. Un fait faux.
    //
    // Trois cas distincts, trois phrases distinctes :
    //   · aucune ligne en N-1 du tout        -> « nouveau en {annee} »
    //   · des lignes en N-1, mais pas dans la fenetre -> « pas comparable »
    //   · N-1 chiffre                        -> l'ecart
    // ⚠ Et la deuxieme phrase avait ete SUPPRIMEE par ce lot : ce diff retirait
    // `revenue.sans_comparaison` (« pas d'annee precedente a comparer ») pour la
    // remplacer par la seule affirmation. On troquait une absence declaree
    // contre un fait invente ; la clef revient, avec un texte qui nomme la
    // fenetre.
    const existeEnN1 = Object.keys(pm).some(k => k.startsWith(`${an - 1}-`))
    // ⚠ MEME DECISION ICI : 0 % en gris neutre. Les deux tableaux de ce bloc
    // se lisent l'un sous l'autre ; un zero vert dans l'un et gris dans
    // l'autre serait une difference que rien ne justifie.
    const ecart = pct !== null
      ? `<span class="rev-tbl__ecart${pct < 0 ? ' rev-tbl__ecart--bas' : (pct === 0 ? ' rev-tbl__ecart--nul' : '')}">`
        + `${esc((pct > 0 ? '+' : '') + pct + ' %')}</span>`
      : `<span class="muted">${esc(existeEnN1
        ? t('revenue.sans_comparaison')
        : t('revenue.annee_nouveau', { annee: String(an) }))}</span>`
    return {
      b,
      // ⚠ MEME REGLE QUE L'EN-TETE, et c'est le constat 2 : une annee sans
      // AUCUNE ligne rend « — », pas « 0 € ». Le motif est sur la meme ligne,
      // dans la colonne « Ecart » : « nouveau en {annee} ».
      tN: brutsN[i].absente ? TIRET : (brutsN[i].refuse ? t('revenue.unavailable') : monnaie(eurosN[i], devise)),
      tN1: brutsN1[i].absente ? TIRET : (brutsN1[i].refuse ? t('revenue.unavailable') : monnaie(eurosN1[i], devise)),
      ecart
    }
  })
  $('[data-bind="revenue-annee-col-n"]').textContent = String(an)
  $('[data-bind="revenue-annee-col-n1"]').textContent = String(an - 1)
  $('[data-list="revenue-annee-lignes"]').innerHTML = lignes.map(l => `<tr>
      <th scope="row" class="rev-tbl__bien"><span class="rev-tbl__bien-int">
        ${vignetteDuBien(l.b)}<span class="rev-tbl__nom">${esc(l.b.name)}</span>
      </span></th>
      <td class="rev-tbl__num">${esc(l.tN)}</td>
      <td class="rev-tbl__num muted">${esc(l.tN1)}</td>
      <td class="rev-tbl__num caption">${l.ecart}</td>
    </tr>`).join('')
  $('[data-list="revenue-annee-cartes"]').innerHTML = lignes.map(l => `<li class="rev-carte">
      <div class="rev-carte__tete">
        <span class="rev-carte__bien">${vignetteDuBien(l.b)}<span class="rev-tbl__nom"><span class="small">${esc(l.b.name)}</span></span></span>
        <span class="rev-carte__total">${esc(l.tN)}</span>
      </div>
      <p class="caption muted">${esc(String(an - 1))} · ${esc(l.tN1)} ${l.ecart}</p>
    </li>`).join('')

  // ─── La note de bas de bloc, et les reserves ────────────────────────────
  // ⚠ LA NOTE DIT AUSSI CE QUE LE TRAIT GRIS COUVRE. La serie N-1 trace les
  // DOUZE mois (c'est la maquette : on voit la saison entiere de l'an dernier),
  // alors que le total, le tableau et l'ecart s'arretent au mois courant. Sans
  // cette phrase, l'hote lit la fin du trait gris et la colonne N-1 du tableau
  // et trouve deux chiffres differents pour la meme annee.
  // ─── LE TABLEAU « RESERVE A DATE » ──────────────────────────────────────
  // ⚠ IL SUIT LA PASTILLE, comme la ligne : `radPerimetre` est deja le
  // perimetre choisi. Un tableau qui montrerait le compte sous une courbe
  // filtree serait la meme superposition de perimetres que la ligne evitait.
  const noeudRad = $('[data-bind="revenue-annee-rad"]')
  if (noeudRad) {
    const lignesRad = []
    // ⚠ SANS AGREGAT, LE TABLEAU NE DIT RIEN — IL N'INVENTE PAS UN MOTIF.
    // `reserve_a_date` est `null` quand la RPC a echoue (l'endpoint pousse
    // alors `reserve_a_date` dans `indisponibles`). Ma premiere version
    // confondait ce cas avec le refus du seuil : tous les `l.lan` etant
    // absents, chaque ligne affirmait « pas assez de ventes a cette date l'an
    // dernier » sur une annee qui avait pourtant bien vendu — un fait que
    // l'ecran n'a AUCUN moyen de connaitre — et l'en-tete rendait
    // « Meme date l'an dernier () ». Constat de la review du 28 octobre 2026.
    // La panne se nomme plus bas, dans les reserves du bloc.
    for (let m = 1; rad && m <= 12; m++) {
      // Les mois A VENIR seulement : ailleurs, le revenu final est connu.
      if (!enCours || m <= dernierRecu) continue
      const cleM = `${an}-${String(m).padStart(2, '0')}`
      const auj = parMois && parMois[cleM]
      const lan = radPerimetre && radPerimetre[`${an - 1}-${String(m).padStart(2, '0')}`]
      // Rien ni d'un cote ni de l'autre : le mois n'a pas de ligne.
      if (!auj && !lan) continue
      lignesRad.push({ m, cleM, auj, lan })
    }
    noeudRad.hidden = lignesRad.length === 0
    $('[data-bind="revenue-annee-rad-col-n1"]').textContent = rad
      ? t('revenue.annee_rad_col_n1', { date: dateDuJour(String(rad.pivot), { day: 'numeric', month: 'short' }) })
      : ''

    // ⚠ UN MOIS PARTIELLEMENT MESURE LE DIT DANS SON COMPTE DE SEJOURS —
    // MAIS SEULEMENT DANS LA COLONNE DU JOUR, et c'est une restriction, pas un
    // oubli : l'agregat « reserve a date » ne rend AUCUN `sans_montant` (la RPC
    // compte par `count(*)` et somme par `sum()`, qui ignore les NULL), donc
    // `sejoursDuMois` est inerte sur `l.lan`. Dette 123 du registre.
    // « 480 € · 3 sejours » avec deux sejours sans montant presente le total de
    // UN sejour comme celui de trois : le chiffre est juste, la phrase est
    // fausse. `refuseTout` ne mord pas ici — le mois garde son total partiel,
    // c'est une verite INCOMPLETE — donc c'est le compte qui doit le dire
    // (recette de Thierry du 28 octobre 2026).
    const sejoursDuMois = (c) => {
      const n = Number((c && c.sejours) || 0)
      const k = Number((c && c.sans_montant) || 0)
      return k > 0
        ? t('revenue.annee_rad_sejours_partiel', { n: Math.max(0, n - k), k })
        : t('revenue.stays', { n })
    }

    const cellules = (l) => {
      // ⚠ TROIS ETATS, COMME PARTOUT DANS CE BLOC, et « 0 € » n'en est qu'un.
      // Ma premiere version lisait `total_cents` brut : un mois a venir ne
      // portant qu'un sejour SANS MONTANT (blocage saisi en resa, canal sans
      // prix) affichait « 0 € » et un « -100 % » EN ROUGE, alors que la courbe
      // coupe son trait et que la reserve dit « 1 sejour sans montant ». Une
      // absence transformee en fait — mesure de la review du 28 octobre 2026,
      // et c'est le defaut que ce meme ecran avait deja corrige en trois
      // endroits le 27. `refuseTout` tranche, exactement comme `bilanPeriode`.
      const refuseAuj = refuseTout(l.auj)
      // `null` et non `0` : `ecartPourcent` protege son DENOMINATEUR, pas son
      // numerateur, et rend `null` sur un numerateur non fini — donc « — ».
      const nAuj = (!l.auj || refuseAuj) ? null : Number(l.auj.total_cents || 0)
      const montantAuj = !l.auj
        ? `<span class="muted">${esc(TIRET)}</span>`
        : (refuseAuj
            ? `<span class="muted">${esc(t('revenue.unavailable'))}</span>`
            : `${esc(monnaie(Math.round(nAuj / 100), devise))} <span class="muted">${esc(sejoursDuMois(l.auj))}</span>`)
      // ⚠ SOUS LE SEUIL, LA LIGNE LE DIT A LA PLACE DU CHIFFRE. L'endpoint ne
      // rend meme pas le montant : il ne PEUT pas etre affiche par accident.
      // ⚠ `!l.lan` DIT BIEN LE SEUIL, ET C'EST VRAI : l'agregat ne rend que
      // les mois qui portent une vente, donc une ligne absente vaut ZERO vente
      // a cette date — et zero est sous le seuil de 5. Le cas qu'il ne fallait
      // PAS ranger ici est l'agregat entierement absent ; il est traite plus
      // haut, par un tableau qui se tait.
      if (!l.lan || l.lan.sous_seuil) {
        return {
          // ⚠ `sousSeuil` EXISTE POUR LA CARTE, PAS POUR LE TABLEAU. Au
          // telephone, la phrase etait precedee de « l'an dernier a la meme
          // date : » et suivie d'un « — » : trois formulations du meme refus
          // sur une ligne (recette de Thierry du 28 octobre 2026). La carte
          // rend la phrase SEULE ; le tableau, lui, a ses en-tetes de colonne
          // pour dire de quoi on parle.
          sousSeuil: true,
          n1: `<span class="muted">${esc(t('revenue.annee_rad_sous_seuil_court'))}</span>`,
          ecart: '<span class="muted">—</span>', montantAuj
        }
      }
      const nLan = Number(l.lan.total_cents || 0)
      const pct = ecartPourcent(nAuj, nLan)
      // ⚠ LE SIGNE PORTE LE SENS AUTANT QUE LA COULEUR : un hote qui ne
      // distingue pas le vert du rouge lit « +12 % » et « -68 % » (le trait d'union que rend `String(-68)`, pas un signe moins typographique).
      // ⚠ ZERO N'EST NI UNE AVANCE NI UN RETARD, donc ni vert ni rouge : gris
      // neutre (decision de Thierry du 28 octobre 2026). Le vert s'etendait
      // jusqu'a 0 % par le seul fait que la condition testait `< 0`.
      const classe = pct === null ? ''
        : (pct < 0 ? ' rev-tbl__ecart--retard' : (pct === 0 ? ' rev-tbl__ecart--nul' : ''))
      return {
        montantAuj,
        n1: `${esc(monnaie(Math.round(nLan / 100), devise))} <span class="muted">${esc(t('revenue.stays', { n: Number(l.lan.sejours || 0) }))}</span>`,
        ecart: pct === null
          ? '<span class="muted">—</span>'
          : `<span class="rev-tbl__ecart${classe}">${esc((pct > 0 ? '+' : '') + pct + ' %')}</span>`
      }
    }
    $('[data-list="revenue-annee-rad-lignes"]').innerHTML = lignesRad.map(l => {
      const c = cellules(l)
      return `<tr>
        <th scope="row" class="rev-tbl__bien">${esc(moisSeul(l.cleM))}</th>
        <td class="rev-tbl__num">${c.montantAuj}</td>
        <td class="rev-tbl__num">${c.n1}</td>
        <td class="rev-tbl__num caption">${c.ecart}</td>
      </tr>`
    }).join('')
    $('[data-list="revenue-annee-rad-cartes"]').innerHTML = lignesRad.map(l => {
      const c = cellules(l)
      return `<li class="rev-carte">
        <div class="rev-carte__tete">
          <span class="rev-carte__bien"><span class="small">${esc(moisSeul(l.cleM))}</span></span>
          <span class="rev-carte__total">${c.montantAuj}</span>
        </div>
        <p class="caption muted">${c.sousSeuil
          ? esc(t('revenue.annee_rad_sous_seuil_court'))
          : `${esc(t('revenue.annee_rad_mobile_n1'))} ${c.n1} ${c.ecart}`}</p>
      </li>`
    }).join('')
  }

  // ⚠ LA NOTE DES COMPARABLES DIT TROIS CHOSES, et aucune n'est decorative :
  // d'ou vient la bande, qu'elle est une ESTIMATION a partir des prix
  // affiches, et A QUELLE DATE elle a ete relevee. Sans la date, l'hote
  // compare son mois en cours a une photo dont il ignore l'age.
  // ⚠ SOUS « TOUS », ON DIT POURQUOI IL N'Y A PAS DE BANDE. Ne rien afficher
  // etait juste — un min/max de comparables n'a aucun sens pour un compte,
  // chaque logement ayant les siens — mais un silence se lit comme une panne.
  // Constat 1 de la recette du 28 octobre.
  const noteSansBien = $('[data-bind="revenue-annee-comparables-tous"]')
  if (noteSansBien) {
    noteSansBien.hidden = !!choisi
    noteSansBien.textContent = choisi ? '' : t('revenue.annee_comparables_tous')
  }
  const noteComp = $('[data-bind="revenue-annee-comparables"]')
  if (noteComp) {
    const dire = bandes.length && compDate && compNb
    noteComp.hidden = !dire && !compEchoue && !compEnVol
    if (compEchoue) noteComp.textContent = t('revenue.annee_comparables_echec')
    else if (compEnVol) noteComp.textContent = t('revenue.computing')
    else noteComp.textContent = dire
      ? t('revenue.annee_comparables_note', {
        n: compNb && compNb.min === compNb.max ? String(compNb.min) : `${compNb.min}–${compNb.max}`,
        date: dateDuJour(String(compDate), { day: 'numeric', month: 'long', year: 'numeric' })
      }) + (compPlusieursDates ? ' ' + t('revenue.annee_comparables_dates') : '')
        + (compEcartes > 0 ? ' ' + t('revenue.annee_comparables_fermes', { n: compEcartes }) : '')
      : ''
  }
  $('[data-bind="revenue-annee-note"]').textContent = enCours
    ? t('revenue.annee_note_cours', {
      mois: moisSeul(`${an}-${String(moisCourant).padStart(2, '0')}`), annee: String(an - 1)
    })
    : t('revenue.annee_note_entiere')

  // ⚠ CINQ RESERVES, ET CHACUNE EST UN FAIT MESURE, pas une precaution de
  // style. Les taire ferait un total qu'aucune ligne n'explique — c'est le
  // constat GRAVE deja paye sur la vue Mois (« 1 000 € d'ecart muet entre le
  // bandeau et la somme des lignes »).
  const reserves = []

  // 0. L'an dernier n'existe pas du tout. ⚠ L'EN-TETE REND ALORS « — », et le
  //    tiret seul ne dit pas POURQUOI : contrairement aux lignes du tableau, il
  //    n'a pas de colonne « Ecart » a cote de lui pour porter le motif. C'est
  //    cette phrase qui le porte (decision de Thierry : « — avec motif »).
  if (bilanN1.absente) reserves.push(t('revenue.annee_sans_n1', { annee: String(an - 1) }))

  // 1. Les sejours dont le montant n'est pas calculable. ⚠ SUR LES DEUX
  //    ANNEES : un refus en N-1 fausse l'ecart en % de la meme facon qu'un
  //    refus en N fausse le total.
  const refusN = sansMontantDe(a.total, an, jusquAu)
  const refusN1 = sansMontantDe(a.total, an - 1, jusquAu)
  if (refusN + refusN1 > 0) reserves.push(t('revenue.no_amount', { n: refusN + refusN1 }))

  // 2. Les montants BRUTS : la commission n'a pas ete transmise, donc ils
  //    entrent dans le total comme s'ils etaient nets. ⚠ LA VUE MOIS LE DIT
  //    DEUX FOIS et la vue Annee ne le disait pas du tout — un retrait de fond
  //    par omission de forme, ce que la regle de refonte interdit nommement.
  const brutsAn = sommePeriode(a.total, an, 'bruts', jusquAu)
    + sommePeriode(a.total, an - 1, 'bruts', jusquAu)
  if (brutsAn > 0) reserves.push(t('revenue.gross_count', { n: brutsAn }))

  // 3. L'argent qui est dans le total et sur aucune ligne. ⚠ SUR LES DEUX
  //    ANNEES AUSSI, et c'est le second constat GRAVE : un bien SUPPRIME qui
  //    avait encaisse en N-1 mettait son montant dans le grand chiffre de N-1
  //    et sur aucune ligne, SANS UN MOT. Le libelle nomme l'annee, sinon deux
  //    reserves identiques se suivent sans qu'on sache laquelle parle de quoi.
  for (const annee of [an, an - 1]) {
    const n = sommePeriode(a.hors_biens, annee, 'sejours', jusquAu)
    if (n <= 0) continue
    reserves.push(t('revenue.annee_hors_biens', {
      annee: String(annee),
      n,
      montant: monnaie(Math.round(sommePeriode(a.hors_biens, annee, 'total_cents', jusquAu) / 100), devise)
    }))
  }

  // 4. Les logements qui n'ont aucune ligne du tout.
  const sansLigne = (etat.biens || []).filter(b => !avecDonnees.some(x => String(x.id) === String(b.id)))
  if (sansLigne.length) {
    reserves.push(t('revenue.annee_sans_ligne', {
      n: sansLigne.length, noms: sansLigne.map(b => String(b.name || '')).join(', ')
    }))
  }

  // 5. Le perimetre : un logement present d'un cote et absent de l'autre suffit
  //    a rendre les deux totaux non comparables. C'est exactement le cas que le
  //    « +14 % » de la maquette masquait.
  const perimetreBouge = avecDonnees.some(b => {
    const pm = a.par_bien[String(b.id)] || {}
    const n = sommePeriode(pm, an, 'sejours', jusquAu)
    const n1 = sommePeriode(pm, an - 1, 'sejours', jusquAu)
    return (n > 0) !== (n1 > 0)
  })
  if (perimetreBouge) reserves.push(t('revenue.annee_perimetre'))

  // ⚠ UN MOIS REFUSE PAR LE SEUIL SE DIT. Sans cette phrase, l'hote voit un
  // trait qui s'arrete et croit a un trou dans la donnee, alors que c'est un
  // refus raisonne : trop peu de ventes a cette date l'an dernier pour que la
  // comparaison veuille dire quelque chose.
  if (radSousSeuil > 0) {
    reserves.push(t('revenue.annee_rad_sous_seuil', { n: radSousSeuil, seuil: (rad && rad.seuil) || 0 }))
  }
  // Et ce que l'agregat n'a pas su juger : annulations sans date (Channex n'en
  // fournit aucune) et dates de vente non fiables.
  if (radReserves > 0) reserves.push(t('revenue.annee_rad_reserve', { n: radReserves }))
  // ⚠ ET SI L'AGREGAT LUI-MEME MANQUE, ON LE DIT. Le tableau et la ligne se
  // taisent alors (voir plus haut) : sans cette phrase, leur silence se lirait
  // comme « l'an dernier n'a rien vendu ».
  if (enCours && !rad) reserves.push(t('revenue.annee_rad_indispo'))

  const noeudRes = $('[data-bind="revenue-annee-reserves"]')
  if (noeudRes) {
    noeudRes.hidden = reserves.length === 0
    noeudRes.textContent = reserves.join(' · ')
  }
}

// Le mois, en clair et dans la langue de l'hote. « 2026-11 » -> « novembre 2026 ».
function moisEnClair (mois) {
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(mois || ''))) return ''
  const [an, m] = String(mois).split('-').map(Number)
  // Le 15 : jamais le 1er ni le 31, pour qu'aucun decalage de fuseau ne fasse
  // changer de mois a l'affichage.
  return dateDuJour(`${an}-${String(m).padStart(2, '0')}-15`, { month: 'long', year: 'numeric' })
}

// ─── Démarrage ──────────────────────────────────────────────────────────────
// ⚠ LA PAGE NE LIT PLUS AUCUNE TABLE EN DIRECT, et c'est l'en-tete retire qui
// le permet. Le « Bonjour {prenom} » etait le dernier lecteur de `profiles` de
// cet ecran — une requete sous RLS que `/api/membres` avait deja faite dans
// `requireAuth` (dette 73), sur un objet de session fige qui pouvait porter un
// e-mail perime (dette 72). Les deux dettes sont sans objet ici.
//
// Les INITIALES restent, dans le bouton du menu : elles se lisent de l'e-mail
// de la session, qui est exactement le repli que `prenom()` appliquait deja
// quand le profil n'avait pas de prenom.

async function init () {
  // I18n ne dépend pas de la session : les deux partent ENSEMBLE. Le `.catch`
  // vide n'avale rien — `await i18nPrêt` lèvera quand même plus bas ; il évite
  // seulement une promesse non traitée si `requireAuth` redirige entre-temps.
  const i18nPret = I18n.init()
  i18nPret.catch(() => {})
  const session = await requireAuth()
  if (!session) return
  await i18nPret
  document.addEventListener('i18n:changed', () => location.reload())

  // `session.user` vient de `requireAuth` : plus de `getUser()`, qui refaisait
  // un aller-retour vers /auth/v1/user.
  // ⚠ CE N'EST PAS TOUT A FAIT LE MÊME OBJET. `getUser()` lisait la ligne
  // COURANTE ; `session.user` est celle qui a été figée dans la session stockée,
  // et elle ne se rafraîchit qu'au renouvellement du jeton. Un e-mail changé
  // depuis un autre appareil, ou un `user_metadata` mis à jour, met donc jusqu'à
  // la durée de vie d'un jeton à apparaître dans le bonjour et les initiales.
  // Affichage seul : toute lecture de données passe par RLS, avec un jeton
  // vérifié à chaque requête. Dette 72.
  const user = session.user
  // ⚠ LES INITIALES PREFERENT LE NOM, PUIS L'E-MAIL — et ma premiere version
  // prenait l'e-mail d'abord (constat FAIBLE 5 de la revue). Une hote « Marie »
  // dont le compte est `contact@gite-du-lac.fr` voyait sa pastille passer de MA
  // a CO. `user_metadata.full_name` est dans la session : aucune lecture de
  // plus, donc la dette 73 reste soldee.
  const nomSession = String(user?.user_metadata?.full_name || '').trim()
  $('[data-bind="initials"]').textContent =
    (nomSession || String(user?.email || '')).slice(0, 2).toLocaleUpperCase('fr')
  renderDate()
  suivreLaLargeur()
  // ⚠ LES DEUX FLECHES SE CABLENT UNE SEULE FOIS, A L'INIT, et pas dans
  // `renderRevenus` : ce rendu est rappele a chaque navigation, donc y poser
  // les ecouteurs les empilerait — un clic finirait par declencher autant
  // d'appels que de mois deja visites. Les boutons sont dans le HTML statique,
  // ils ne sont jamais remplaces : un seul branchement suffit.
  for (const b of document.querySelectorAll('.rev-nav__btn')) {
    b.addEventListener('click', () => allerAuPas(b.dataset.mois === 'prec' ? -1 : 1))
  }
  // Le selecteur Mois / Annee, branche une seule fois lui aussi.
  for (const b of document.querySelectorAll('.seg__btn[data-vue]')) {
    b.addEventListener('click', () => allerALaVue(b.dataset.vue))
  }
  // ⚠ LES PASTILLES DE FILTRE SE DELEGUENT, parce qu'elles sont RECONSTRUITES a
  // chaque rendu : un ecouteur pose sur chaque bouton serait perdu au rendu
  // suivant, et un ecouteur pose a chaque rendu s'empilerait. Un seul ecouteur
  // sur le conteneur, qui lui ne bouge pas, repond aux deux problemes.
  // ⚠ ET IL NE RECHARGE RIEN : l'annee est deja en memoire, filtrer la courbe
  // est un rendu local. Un appel reseau par pastille serait un appel pour une
  // donnee qu'on tient deja.
  // ⚠ ET LE FRANCHISSEMENT DU SEUIL REDESSINE. Sans cela, un telephone tourne
  // en paysage — ou une fenetre qu'on elargit — garderait le repere etroit,
  // donc une courbe dessinee pour 360 unites etiree sur 1 200 px. Le rendu est
  // local : il ne redemande rien au serveur.
  if (ECRAN_ETROIT) ECRAN_ETROIT.addEventListener('change', () => renderAnnee())
  const filtres = $('[data-list="revenue-annee-filtres"]')
  if (filtres) {
    filtres.addEventListener('click', (e) => {
      const b = e.target.closest('.rev-an-puce')
      if (!b || !filtres.contains(b)) return
      etat.filtreAnnee = b.dataset.filtre || null
      renderAnnee()
      // La bande suit la pastille, et elle arrive apres : le rendu ci-dessus
      // montre deja la courbe du bien, celui du chargeur ajoutera la bande.
      if (etat.filtreAnnee) chargerComparables(etat.filtreAnnee)
    })
  }

  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
