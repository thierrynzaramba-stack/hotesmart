<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="supabase-url" content="https://cjmrizpdyhrcurmgyrhs.supabase.co">
  <meta name="supabase-key" content="sb_publishable_cCOixH5aKHWUq5OzNPX7qw_ub0RQ5rD">
  <title>HôteSmart — Invitation</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    body { background: var(--bg2); padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .wrap { max-width: 440px; width: 100%; }
    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 28px; text-align: center; }
    .logo { font-size: 20px; font-weight: 500; color: #C97B5C; margin-bottom: 22px; }
    h1 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
    p { font-size: 13px; color: var(--text2); line-height: 1.6; margin: 0 0 16px; }
    .compte { font-size: 15px; font-weight: 500; color: var(--text); }
    .btn { background: #C97B5C; color: #fff; border: 0; border-radius: var(--radius); padding: 11px 20px; cursor: pointer; font-size: 14px; font-family: inherit; width: 100%; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 0.5px solid var(--border); color: var(--text2); border-radius: var(--radius); padding: 10px 18px; cursor: pointer; font-size: 13px; font-family: inherit; width: 100%; margin-top: 8px; }
    .note { font-size: 11px; color: var(--text2); line-height: 1.6; background: var(--bg2); border-radius: var(--radius); padding: 11px 13px; margin-top: 16px; text-align: left; }
    .err { font-size: 13px; color: #7F1D1D; background: #FEE2E2; border: 0.5px solid #FCA5A5; border-radius: var(--radius); padding: 12px; line-height: 1.5; }
    .ok  { font-size: 13px; color: #065F46; background: #D1FAE5; border: 0.5px solid #6EE7B7; border-radius: var(--radius); padding: 12px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="logo">HôteSmart</div>
    <div id="contenu"><p>Vérification de l’invitation…</p></div>
  </div>
</div>

<script type="module">
import { supabase } from '/shared/supabase.js'
import { api } from '/shared/api-client.js'

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const $ = id => document.getElementById(id)
// ⚠ FILET DE RETOUR. Le chemin normal ramene ici par `?next=`. Mais un parcours
// de connexion qui passe par une confirmation d'email ou un lien magique perd
// cette URL : l'invite atterrirait sur un tableau de bord vide sans comprendre.
// Le jeton mis de cote avant la connexion est donc RELU ici.
const jetonUrl = new URLSearchParams(location.search).get('token') || ''
const jeton = jetonUrl || sessionStorage.getItem('invitation_token') || ''
if (jetonUrl) sessionStorage.setItem('invitation_token', jetonUrl)

function afficher (html) { $('contenu').innerHTML = html }

if (!jeton) {
  afficher('<div class="err">Ce lien est incomplet. Demandez à la personne qui vous a invité de vous le renvoyer.</div>')
} else {
  try {
    const info = await api.membres.apercu(jeton)
    const { data: { session } } = await supabase.auth.getSession()

    if (!session) {
      afficher(`
        <h1>Vous êtes invité</h1>
        <p><span class="compte">${esc(info.compte)}</span> vous invite à rejoindre son compte HôteSmart.</p>
        <p>Connectez-vous ou créez votre compte : vous reviendrez ici pour confirmer.</p>
        <button class="btn" id="b-login">Se connecter</button>
        <button class="btn-ghost" id="b-signup">Créer un compte</button>
        <div class="note">Vous garderez votre propre compte. Rejoindre celui de ${esc(info.compte)} vous
        donne accès aux biens et aux fonctions qu’il a choisis pour vous, rien de plus.</div>`)
      const retour = '?next=' + encodeURIComponent('/invitation?token=' + jeton)
      $('b-login').onclick  = () => { location.href = '/pages/login.html' + retour }
      $('b-signup').onclick = () => { location.href = '/pages/login.html' + retour + '&mode=signup' }
    } else {
      afficher(`
        <h1>Rejoindre ce compte ?</h1>
        <p><span class="compte">${esc(info.compte)}</span> vous invite à rejoindre son compte HôteSmart
        en tant que <strong>${esc(info.invite)}</strong>.</p>
        <p>Vous êtes connecté avec <strong>${esc(session.user.email)}</strong>.</p>
        <button class="btn" id="b-ok">Rejoindre le compte de ${esc(info.compte)}</button>
        <button class="btn-ghost" id="b-non">Ce n’est pas moi</button>
        <div class="note">Votre propre compte reste le vôtre. Vous pourrez être retiré à tout moment par
        ${esc(info.compte)}, et vous ne verrez que ce qu’il a autorisé.</div>`)
      $('b-ok').onclick = async () => {
        $('b-ok').disabled = true
        try {
          const r = await api.membres.accepter(jeton)
          sessionStorage.removeItem('invitation_token')
          afficher(`<div class="ok">Vous avez rejoint le compte de ${esc(r.compte.nom)}.</div>
            <button class="btn" style="margin-top:14px" onclick="location.href='/pages/index.html'">Continuer</button>`)
        } catch (e) {
          afficher(`<div class="err">${esc(e.message)}</div>
            <button class="btn-ghost" onclick="location.reload()">Réessayer</button>`)
        }
      }
      $('b-non').onclick = async () => {
        await supabase.auth.signOut()
        location.reload()
      }
    }
  } catch (e) {
    // Invitation morte : on retire le jeton mis de cote, sinon il rejouerait le
    // meme echec a chaque passage.
    sessionStorage.removeItem('invitation_token')
    afficher(`<div class="err">${esc(e.message)}</div>
      <p style="margin-top:14px">Demandez une nouvelle invitation à la personne qui vous a invité.</p>`)
  }
}
</script>
</body>
</html>
