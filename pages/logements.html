<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « LOGEMENTS » — refonte UI V5, lot Logements, ÉTAPE 1 : LECTURE SEULE.
     Une carte par logement : photo, nom, ville · capacité, pastilles de canaux
     lues DANS LE CŒUR (dette 59 — aucun appel partenaire à l'affichage), la
     note et le nombre TOTAL d'avis du logement, et un seul signal.
     ⚠ LA CARTE N'AFFICHE PLUS LE FAIT DATÉ (demande de Thierry du 20 octobre
     2026 : « au lieu de Fermé jusqu'au mercredi 21 octobre, met les avis total
     sur le logement »). Le fait reste dans la réponse de l'endpoint — compté
     depuis les réservations ET les fermetures de l'hôte — et c'est la FICHE
     (étape 2) qui l'affiche.
     Spec : docs/specs/logements-v5/spec-logements-v5.md (§2 pour cette liste) ;
     fond : docs/specs/inventaire-biens.md et le tableau de conformité §9.
     Données : GET /api/logement (étape 0), lecture seule, aucun identifiant du
     partenaire dans la réponse.

     ⚠ CE QUE L'ÉTAPE 1 NE FAIT PAS, ET POURQUOI :
     · la carte n'est PAS encore un lien. La spec §2 la veut « entièrement
       cliquable → fiche », mais la fiche V5 est l'étape 2, et `/biens/:id`
       mène aujourd'hui à l'IFRAME DORMANTE que la spec §1 ordonne de
       supprimer (fonction 18 retirée). Envoyer l'hôte là serait livrer un clic
       qui le dépose dans du code mort ;
     · aucune action d'écriture : ni photo, ni kill switch, ni suppression
       (étape 3). Le bouton « Ajouter un logement » est le seul geste, et il
       mène au formulaire EXISTANT.

     RÈGLES : aucun hexa (jetons de theme.css), aucun texte en dur (i18n
     `logements.*`), icônes du sprite, zones de clic ≥ 44 px, pas de
     défilement horizontal à 390 px, `X-Compte` posé par api-client. -->
<style>
  /* .log-page (conteneur et marge basse) vit dans shared/ui.css : il est commun
     aux deux écrans du lot, et son `padding` raccourci écrasait ici la marge
     qui dégage la barre du bas. */
  .log-entete { display: flex; align-items: center; justify-content: space-between;
    gap: var(--gap-m); margin-bottom: var(--gap-l); flex-wrap: wrap; }

  /* ⚠ `auto-fill` ET `minmax`, pas « 4 colonnes » en dur : la spec demande
     quatre colonnes à l'ordinateur et des lignes au téléphone, et c'est la
     MÊME règle — la largeur minimale d'une carte décide du nombre de colonnes.
     Un `repeat(4, 1fr)` plus une requête de média par palier redonnerait deux
     descriptions de la même mise en page, donc deux occasions de diverger. */
  .log-grille { display: grid; gap: var(--gap-m);
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }

  .log-carte { display: flex; flex-direction: column; gap: var(--gap-s);
    padding: var(--gap-m); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card);
    /* Le repère du lien étendu ci-dessous : sans lui, le lien couvrirait la
       page entière au lieu de la carte. */
    position: relative; }
  .log-carte:hover { border-color: var(--muted-2); }
  .log-carte:has(.log-lien:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ⚠ LE LIEN PORTE LE NOM ET S'ÉTEND À LA CARTE. Un `<a>` autour de toute la
     carte ferait lire au lecteur d'écran les pastilles et la note comme nom du
     lien ; ici il annonce le logement, et le doigt garde la carte entière.
     Le `::after` passe SOUS les autres contenus (z-index 0) pour ne pas
     recouvrir un élément cliquable qu'on ajouterait demain. */
  .log-lien { color: inherit; text-decoration: none; }
  .log-lien:hover { text-decoration: underline; }
  .log-lien::after { content: ''; position: absolute; inset: 0; z-index: 0; }

  /* La photo : rapport fixe, pour que la grille ne saute pas pendant le
     chargement des images — et un fond neutre quand il n'y en a pas. */
  .log-photo { aspect-ratio: 3 / 2; border-radius: var(--radius-tile);
    background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
  .log-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .log-photo svg { width: var(--icon-size-lg); height: var(--icon-size-lg); color: var(--muted-2); }

  /* ⚠ UN NOM SANS ESPACE NE DOIT PAS POUSSER LA CARTE. C'est le défaut D7 que
     ce lot ferme : sans ça, un seul logement mal nommé provoque un défilement
     horizontal sur tout l'écran. */
  .log-nom { font-weight: var(--fw-semibold); letter-spacing: var(--tracking-tight);
    overflow-wrap: anywhere; }
  .log-sous { color: var(--muted); overflow-wrap: anywhere; }

  .log-fraicheur { margin: calc(-1 * var(--gap-s)) 0 var(--gap-m); }
  /* ⚠ PAS D'AMBRE : la charte §7 le réserve au badge de navigation, et le rouge
     à la suppression et aux erreurs. Un relevé vieux n'est ni l'un ni l'autre —
     c'est un fait à lire. On le rend simplement plus lisible : l'encre normale
     au lieu du gris, et le poids d'un texte qu'on veut voir. */
  .log-fraicheur--vieille { color: var(--ink); font-weight: var(--fw-medium); }

  /* ⚠ LES PASTILLES DE CANAUX ET LA NOTE ONT MIGRÉ DANS `shared/ui.css`
     (21 octobre 2026, étape 2 du lot). Leur RENDU est partagé — `canauxHtml`
     et `avisHtml` de `shared/logements-liste.js` — et la fiche l'appelle. Leur
     FORME vivait ici seule : la fiche affichait donc trois noms de canaux
     collés, sans pastille ni point d'état. Une règle partagée par deux écrans
     vit dans un module commun (CLAUDE.md), sinon les deux copies divergent. */

  /* Un seul signal, en gris neutre : la charte réserve le rouge à la
     suppression et aux erreurs, et l'ambre au badge de navigation. */
  .log-signal { display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 8px; border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--muted); font-size: var(--fs-caption); }
  .log-signal svg { width: 14px; height: 14px; }

  .log-etat { display: flex; flex-direction: column; gap: var(--gap-m);
    align-items: flex-start; }
  .log-etat__actions { display: flex; gap: var(--gap-s); flex-wrap: wrap; }

  /* Zones de clic ≥ 44 px (D7 / charte §7), y compris au téléphone. */
  .log-page .btn { min-height: 44px; }

  /* ⚠ AU TÉLÉPHONE, UNE LIGNE — PAS UNE CARTE (spec §2 : « desktop 4 colonnes,
     mobile en lignes »). Ma première version empilait des cartes à photo pleine
     largeur : deux logements remplissaient l'écran à 390 px, et il fallait
     faire défiler pour voir le troisième. Une vignette à gauche, le texte à
     droite : six logements tiennent dans un écran.
     La règle de mise en page reste UNIQUE — c'est le même module de rendu, et
     seule la forme change ici. */
  @media (max-width: 560px) {
    .log-entete { align-items: stretch; }
    .log-entete .btn { width: 100%; }
    .log-grille { gap: var(--gap-s); }
    /* ⚠ LES ZONES SE DÉSIGNENT PAR CLASSE, PAS PAR POSITION. Ma première
       version plaçait les blocs par `:nth-child`, et c'était juste tant que la
       carte avait toujours ses cinq enfants. La ligne des avis, elle, DISPARAÎT
       quand on n'a pas pu les lire (ou qu'on n'a pas le droit) : le signal
       devenait alors le 4e enfant, donc prenait la zone des avis, et la carte
       d'un bien en pause se décalait d'une ligne. Un sélecteur positionnel
       décrit l'ordre du HTML, pas le rôle des blocs. */
    .log-carte { display: grid; grid-template-columns: 84px 1fr;
      grid-template-areas: "photo texte" "photo canaux" "photo avis" "signal signal";
      column-gap: var(--gap-m); row-gap: 4px; align-items: start; padding: var(--gap-s); }
    .log-photo { grid-area: photo; }
    .log-texte { grid-area: texte; }
    .log-canaux { grid-area: canaux; }
    .log-avis { grid-area: avis; }
    .log-signal-ligne { grid-area: signal; }
    .log-photo { aspect-ratio: 1; width: 84px; }
    .log-photo svg { width: var(--icon-size); height: var(--icon-size); }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- nav.js --></div>
  </div>
</header>

<main class="log-page">
  <div class="log-entete">
    <h1 class="h2" data-i18n="logements.title"></h1>
    <!-- ⚠ MASQUÉ PAR DROIT **ET** GARDÉ PAR LE SERVEUR. Ajouter un logement est
         un geste de TITULAIRE : api/channel-property.js refuse en 403 un membre
         délégué depuis le 19 octobre 2026 (mesuré sur staging). Le `hidden`
         ci-dessous est un confort, pas la protection — et il ne masque que
         parce que `[hidden] { display: none !important }` est en tête de
         theme.css, chargé par cette page. -->
    <!-- `btn--primary` : « bouton blanc bord noir » (spec §2). `btn--secondary`
         prend un bord gris, et l'action principale de l'écran ne se distingue
         plus de rien. -->
    <a class="btn btn--primary" href="/logements/nouveau" data-bind="ajouter" hidden>
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-plus"/></svg>
      <span data-i18n="logements.add"></span>
    </a>
  </div>

  <!-- ⚠ LA FRAÎCHEUR DU RELEVÉ, UNE SEULE FOIS, EN HAUT. C'est la décision de
       Thierry du 19 octobre 2026 : le relevé est au grain du COMPTE, donc
       répéter le message sous chaque carte « dirait dix fois la même chose et
       laisserait croire à dix pannes ». On montre la date la PLUS ANCIENNE du
       compte — la plus récente ferait passer pour frais un relevé dont la
       moitié date. -->
  <p class="caption muted log-fraicheur" data-bind="fraicheur" hidden></p>

  <!-- Vide / refus / panne : une seule zone, un seul message à la fois. -->
  <section class="card log-etat" data-bind="etat" hidden role="status" aria-live="polite"></section>

  <!-- Le chargement se DIT. Un `aria-busy` sur une grille vide n'est annoncé
       par presque aucun lecteur d'écran, et à l'œil une zone blanche est
       indiscernable de « aucun logement ». -->
  <p class="caption muted" data-bind="chargement" data-i18n="logements.chargement"></p>

  <div class="log-grille" data-bind="grille" aria-busy="true"></div>
</main>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { requireAuth } from '/components/auth-guard.js'
import { getUser, signOut } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { logger } from '/shared/logger.js'
import { escapeHtml as esc } from '/shared/properties.js'
import { chargerContexte, peutLire, estTitulaire, comptes, compteCourant, basculerVers }
  from '/shared/compte-courant.js'
import { api } from '/shared/api-client.js'
import { carteHtml, etatHtml, etatDeLaPage, fraicheurDuCompte } from '/shared/logements-liste.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (s) => document.querySelector(s)
const icone = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="/shared/icons.svg#${id}"/></svg>`

// ⚠ PAR `I18n.date`, PAS A LA MAIN (constat de la revue : c'etait la TROISIEME
// copie de la meme regle). Le moteur du depot le dit lui-meme : « Formats :
// jamais a la main ». On ne garde ici que la decision d'AFFICHAGE — l'annee
// n'apparait que si elle diffère de l'annee courante : « samedi 25 octobre » se
// lit, « samedi 25 octobre 2026 » encombre une carte, et sur une date lointaine
// l'annee est au contraire indispensable.
function dateEnClair (iso) {
  if (!iso) return ''
  const d = new Date(`${iso}T12:00:00`)
  if (Number.isNaN(d.getTime())) return iso
  const opts = { weekday: 'long', day: 'numeric', month: 'long' }
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric'
  try { return I18n.date(d, opts) } catch { return iso }
}

// ⚠ LE FORMAT DU NOMBRE PAR `I18n.num`, PAS A LA MAIN. « 4.9 » se lit mal en
// francais, et `toFixed(1)` donne un point decimal quelle que soit la langue.
// Meme geste que l'accueil (`pages/aujourdhui.html`, la note du bien).
const nombre = (x) => { try { return I18n.num(x, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) } catch { return String(x) } }

// ⚠ PLUS DE `dateEnClair` ICI (constat m4) : `carteHtml` ne le destructure plus
// depuis que le fait date a quitte la carte. `dateEnClair` reste utilise par le
// bandeau de fraicheur, en direct. Un outil passe a un module qui ne le lit pas
// est du cablage dormant, et ce lot en supprime.
const OUTILS = { t, esc, icone, nombre }

function montrerEtat (quoi) {
  const zone = $('[data-bind="etat"]')
  const grille = $('[data-bind="grille"]')
  grille.innerHTML = ''
  grille.removeAttribute('aria-busy')
  $('[data-bind="chargement"]').hidden = true
  $('[data-bind="fraicheur"]').hidden = true
  if (quoi === 'liste') { zone.hidden = true; return }
  zone.hidden = false
  // ⚠ `peutAjouter` : les deux actions de l'état vide mènent à des pages NON
  // DÉLÉGABLES, et leur geste est refusé en 403 à un membre. On ne montre
  // jamais ce qui mène à un refus (décision de Thierry, 20 octobre).
  zone.innerHTML = etatHtml(quoi, { peutAjouter: estTitulaire() })
  I18n.apply(zone)
  const bouton = zone.querySelector('[data-bind="reessayer"]')
  if (bouton) {
    bouton.addEventListener('click', () => charger())
    // ⚠ LE FOCUS SUIT. `innerHTML` détruit le bouton cliqué : sans ça, le
    // clavier repart du début du document à chaque tentative.
    bouton.focus()
  }
}

// La fraîcheur du compte, dite une seule fois.
//
// ⚠ SANS BOUTON « ACTUALISER » À L'ÉTAPE 1, ET DONC SANS ALARME. Le relevé est
// une ÉCRITURE (POST `relever_canaux`), et l'étape 1 est en lecture seule : le
// bouton arrive avec les actions, à l'étape 3. La revue a posé la bonne règle —
// « afficher l'alarme sans le remède est la seule combinaison à écarter » — donc
// on informe (« non vérifiés depuis le … ») sans promettre un geste qui
// n'existe pas encore. Noté aux constats de l'étape.
function montrerFraicheur (biens) {
  const zone = $('[data-bind="fraicheur"]')
  const f = fraicheurDuCompte(biens)
  if (!f) { zone.hidden = true; return }
  zone.hidden = false
  zone.textContent = t(f.vieux ? 'logements.fraicheur_vieille' : 'logements.fraicheur',
    { quand: dateEnClair(String(f.quand).slice(0, 10)) })
  zone.classList.toggle('log-fraicheur--vieille', f.vieux)
}

let enVol = false
async function charger () {
  if (enVol) return
  enVol = true
  const grille = $('[data-bind="grille"]')
  grille.setAttribute('aria-busy', 'true')
  $('[data-bind="chargement"]').hidden = false
  try {
    const r = await api.logement.liste()
    const etat = etatDeLaPage({ biens: r.biens })
    if (etat !== 'liste') { montrerEtat(etat); return }
    $('[data-bind="etat"]').hidden = true
    $('[data-bind="chargement"]').hidden = true
    // ⚠ « PAS PU LIRE » ET « PAS LE DROIT » NE SE DISENT PAS PAREIL, et les deux
    // valent `avis: null` sur le bien. Le motif, lui, est au grain du COMPTE :
    // `indisponibles` dit la panne, `refuses` dit le refus. On ne passe le
    // drapeau que pour la panne — « on ne montre jamais ce qui mene a un refus »
    // (regle de Thierry du 20 octobre), et la panne, elle, se dit.
    const outils = { ...OUTILS,
      avisIndisponibles: Array.isArray(r.indisponibles) && r.indisponibles.includes('avis') }
    grille.innerHTML = r.biens.map(b => carteHtml(b, outils)).join('')
    grille.removeAttribute('aria-busy')
    montrerFraicheur(r.biens)
    // ⚠ Les cartes portent des `data-i18n` dans leurs sous-éléments d'état :
    // il faut les traduire APRÈS insertion.
    I18n.apply(grille)
  } catch (e) {
    logger.error('Logements', e.message, { status: e.status })
    montrerEtat(etatDeLaPage({ erreur: e }))
  } finally {
    enVol = false
  }
}

async function init () {
  await requireAuth()
  await I18n.init()
  const user = await getUser()
  await chargerContexte(user.id)

  const initiales = (user.email || '?').slice(0, 2).toUpperCase()
  const pastilleInitiales = $('[data-bind="initials"]')
  if (pastilleInitiales) pastilleInitiales.textContent = initiales

  HSNav.render({ peutLire })
  // ⚠ LE JEU COMPLET, et c'est un constat de la revue du 20 octobre : ma
  // premiere version passait `{ peutLire, estTitulaire, moiEmail }` — TROIS
  // options qui n'existent pas dans `shared/nav.js`. Le menu ne contenait donc
  // que l'aide, la langue et une « Deconnexion » MORTE (`options.onDeconnexion?.()`
  // sur `undefined` est un no-op).
  //
  // Sur une page DELEGABLE, c'est le pire endroit pour ca : le compte consulte
  // est memorise en localStorage, donc un hote bascule sur le compte d'un autre
  // arrivait ici sans selecteur de compte, sans la mention « compte partage »,
  // et SANS AUCUN MOYEN DE REVENIR — exactement le contresens que
  // `tests/pages-non-delegables.test.js` decrit en tete.
  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
    // PROVISOIRE (decision de Thierry du 10 octobre 2026) : les outils sans
    // onglet V5, retires lot par lot. Memes droits que la barre laterale.
    outils: [
      peutLire('reservations') && { href: '/apps/yield', key: 'nav.tool_yield', icon: 'i-price' },
      estTitulaire() && { href: '/apps/serrures', key: 'nav.tool_locks', icon: 'i-key' },
      estTitulaire() && { href: '/apps/sms', key: 'nav.tool_sms', icon: 'i-send' },
      estTitulaire() && { href: '/apps/reservation-directe', key: 'nav.tool_direct', icon: 'i-calendar' },
      estTitulaire() && { href: '/connexions', key: 'nav.tool_connections', icon: 'i-link' },
      estTitulaire() && { href: '/abonnement', key: 'nav.tool_billing', icon: 'i-euro' }
    ].filter(Boolean)
  })

  // ⚠ MASQUAGE PAR DROIT — DOUBLÉ D'UNE GARDE SERVEUR (règle absolue). Ajouter
  // un logement est un geste de titulaire, et le serveur refuse en 403 depuis
  // le 19 octobre 2026. Ici on ne fait que ne pas le PROPOSER.
  const ajouter = $('[data-bind="ajouter"]')
  if (ajouter) ajouter.hidden = !estTitulaire()

  document.title = `HôteSmart — ${t('logements.title')}`
  await charger()
}

init().catch(e => logger.error('Logements', e.message, e))
</script>
</body>
</html>
