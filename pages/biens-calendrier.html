<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HôteSmart — Calendrier</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    /* CSS spécifique au calendrier (conservé tel quel, ne dépend pas de style.css) */
    .cal-page * { box-sizing: border-box; }
    .cal-page { -webkit-user-select: none; user-select: none; }
    .cal-controls { background: var(--bg); padding: 14px 20px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 20; }
    .cal-controls .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: #f0f0f0; border: 1px solid #e5e5e7; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; color: #1d1d1f; }
    .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .toggle { display: inline-flex; background: #f0f0f0; border-radius: 8px; padding: 3px; }
    .toggle button { background: transparent; border: none; padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 6px; color: #6e6e73; font-weight: 500; }
    .toggle button.active { background: #fff; color: #1d1d1f; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .multi-select { position: relative; }
    .multi-select .ms-trigger { padding: 7px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; min-width: 190px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .multi-select .ms-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid #d2d2d7; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); min-width: 250px; max-height: 320px; overflow-y: auto; z-index: 30; padding: 6px; }
    .multi-select.open .ms-panel { display: block; }
    .multi-select .ms-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; color:#1d1d1f; }
    .multi-select .ms-option:hover { background: #f5f5f7; }
    .period-select { padding: 7px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; background: #fff; font-family: inherit; color:#1d1d1f; }
    .cal-main { padding: 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 100px; color:#1d1d1f; }
    .month-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .month-pill { background: #fff; border: 1px solid #d2d2d7; border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer; color: #1d1d1f; font-weight: 500; text-transform: capitalize; }
    .month-pill:hover { background: #eef4ff; border-color: #007aff; }
    .month-pill.active { background: #007aff; color: #fff; border-color: #007aff; }
    .scroll-shell { background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; }
    .scroll-area { overflow-x: auto; }
    table.month-band { border-collapse: collapse; table-layout: fixed; }
    table.month-band td { height: 26px; font-size: 12px; font-weight: 700; color: #1d1d1f; text-align: left; padding-left: 8px; white-space: nowrap; border-bottom: 1px solid #e5e5e7; text-transform: capitalize; }
    table.month-band td.month-start { border-left: 2px solid #007aff; }
    table.month-band .corner { width: 120px; min-width: 120px; position: sticky; left: 0; background: #fff; z-index: 5; border-bottom: 1px solid #e5e5e7; }
    .bien-section { padding: 0 0 16px; margin-bottom: 4px; }
    .bien-section:not(:last-child) { border-bottom: 3px solid #eef0f3; }
    .bien-title { font-size: 18px; font-weight: 700; margin: 16px 0 12px; padding: 0 14px; display: inline-flex; align-items: center; gap: 10px; position: sticky; left: 0; background: #fff; z-index: 6; max-width: 90vw; }
    table.cal .row-label.bien-head { font-size: 14px; font-weight: 700; color: #1d1d1f; border-left: 4px solid #007aff; vertical-align: middle; line-height: 1.2; }
    table.cal .row-label.bien-head .cap-h { display: block; font-size: 10px; font-weight: 400; color: #86868b; margin-top: 2px; }
    .bien-section { padding-top: 18px; }
    .bien-title::before { content: ''; width: 5px; height: 22px; background: #007aff; border-radius: 3px; display: inline-block; }
    .bien-title .cap { font-size: 12px; font-weight: 400; color: #86868b; }
    table.cal { border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    table.cal th, table.cal td { padding: 9px 1px; text-align: center; white-space: nowrap; width: 34px; min-width: 34px; }
    table.cal thead th { border-bottom: 1px solid #e5e5e7; }
    table.cal .row-label { text-align: left; padding-left: 8px; font-size: 11px; color: #6e6e73; width: 120px; min-width: 120px; background: #fff; position: sticky; left: 0; z-index: 2; border-right: 1px solid #e5e5e7; font-weight: 500; }
    table.cal thead .row-label { z-index: 4; }
    table.cal .day-num { font-weight: 600; font-size: 12px; color: #1d1d1f; }
    table.cal .day-name { font-size: 9px; color: #86868b; text-transform: uppercase; }
    table.cal .weekend { background: rgba(0,0,0,0.022); }
    table.cal .month-start { border-left: 2px solid #007aff; }
    table.cal .today { background: #e6f0ff !important; box-shadow: inset 2px 0 0 #007aff, inset -2px 0 0 #007aff; }
    table.cal td.edit-cell { cursor: pointer; position: relative; }
    table.cal td.edit-cell:hover { background: #eef4ff; }
    table.cal td.edit-cell.selected { background: #d4e4ff !important; box-shadow: inset 0 0 0 1px #007aff; }
    table.cal td.rate-cell { font-weight: 600; }
    table.cal td.maxrate-cell { font-weight: 500; color: #6e6e73; }
    table.cal td.modified::after { content: ''; position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; background: #f59e0b; border-radius: 50%; }
    .rate-input { width: 100%; border: none; background: #fff; text-align: center; font-size: 12px; font-weight: 600; font-family: inherit; padding: 3px 0; outline: 2px solid #007aff; border-radius: 3px; }
    table.cal .resa-cell { position: relative; padding: 0 !important; height: 24px; }
    .resa-bar { position: absolute; top: 3px; bottom: 3px; color: white; font-size: 10px; font-weight: 600; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 3px; white-space: nowrap; overflow: hidden; border-radius: 11px; }
    .resa-bar.blue { background: #0d4ea6; } .resa-bar.green { background: #1f6f23; } .resa-bar.red { background: #d52a44; }
    .resa-bar.airbnb { background: #d52a44; } .resa-bar.booking { background: #0d4ea6; } .resa-bar.direct { background: #1f6f23; }
    .resa-bar.cliquable { cursor: pointer; }
    .resa-bar.cliquable:hover { filter: brightness(1.15); box-shadow: 0 0 0 2px rgba(255,255,255,0.6) inset; }
    .resa-bar .ava { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .resa-bar .ava svg { width: 10px; height: 10px; }
    td.cell-closed { background: #ffeced !important; }
    td.cell-reserved { background: #dde7f5 !important; }
    .float-bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(140%); background: #1d1d1f; color: #fff; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); transition: transform 0.22s ease; z-index: 50; max-width: calc(100% - 32px); }
    .float-bar.visible { transform: translateX(-50%) translateY(0); }
    .float-bar .sel-info { font-size: 13px; } .float-bar .sel-info strong { font-weight: 600; }
    .float-bar button { border: none; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .float-bar .btn-params { background: #007aff; color: #fff; }
    .float-bar .btn-clear { background: transparent; color: #a1a1a6; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .overlay.visible { display: flex; }
    .popup-lg { background: #fff; border-radius: 16px; width: 100%; max-width: 740px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; color:#1d1d1f; }
    .popup-head { padding: 20px 24px 14px; border-bottom: 1px solid #f0f0f0; }
    .popup-head h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
    .range-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .range-row input[type=date] { padding: 7px 10px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 13px; font-family: inherit; }
    .popup-body { display: flex; flex: 1; min-height: 300px; overflow: hidden; }
    .popup-menu { width: 185px; min-width: 185px; border-right: 1px solid #f0f0f0; overflow-y: auto; padding: 8px; }
    .popup-menu .mi { padding: 9px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; color: #1d1d1f; margin-bottom: 2px; }
    .popup-menu .mi:hover { background: #f5f5f7; }
    .popup-menu .mi.active { background: #007aff; color: #fff; font-weight: 600; }
    .popup-menu .mi.config-dot::after { content: '\2022'; color: #f59e0b; margin-left: 6px; font-size: 16px; }
    .popup-menu .mi.active.config-dot::after { color: #fff; }
    .popup-menu .mi-sep { border-top: 1px solid #f0f0f0; margin: 8px 4px; }
    .popup-content { flex: 1; padding: 20px 24px; overflow-y: auto; }
    .popup-content h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .popup-content .desc { font-size: 12px; color: #86868b; margin-bottom: 16px; line-height: 1.5; }
    .dow-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .dow-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .dow-chip input { margin: 0; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .field input[type=number], .field select { width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 15px; font-family: inherit; }
    .seg { display: inline-flex; border: 1px solid #d2d2d7; border-radius: 8px; overflow: hidden; }
    .seg button { background: #fff; border: none; padding: 8px 14px; font-size: 14px; cursor: pointer; border-right: 1px solid #d2d2d7; font-weight: 500; color: #6e6e73; }
    .seg button:last-child { border-right: none; }
    .seg button.active { background: #007aff; color: #fff; }
    .preview-box { background: #f0f9ff; border: 1px solid #cce4ff; border-radius: 8px; padding: 12px; font-size: 13px; color: #0d4ea6; line-height: 1.6; margin-top: 12px; }
    .display-list { display: flex; flex-direction: column; gap: 4px; }
    .display-list label { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .display-list label:hover { background: #f5f5f7; }
    .popup-foot { padding: 14px 24px; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .popup-foot .hint { font-size: 12px; color: #86868b; }
    .btn-cancel { background: #f0f0f0; color: #1d1d1f; border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-apply { background: #007aff; color: #fff; border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1f6f23; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: all 0.25s; z-index: 200; }
    .toast.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main cal-page">
    <div class="topbar">
      <div>
        <div class="page-title">📅 Calendrier</div>
        <div class="page-sub"><a href="/biens" style="color:var(--green);text-decoration:none">← Retour à Mes biens</a></div>
      </div>
    </div>

    <div class="cal-controls">
      <div class="left">
        <div class="multi-select" id="multi-select">
          <div class="ms-trigger" id="ms-trigger"><span id="ms-label">Choisir des biens</span><span>&#9662;</span></div>
          <div class="ms-panel" id="ms-panel"></div>
        </div>
        <select class="period-select" id="period-select"><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">1 an</option></select>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-undo" title="Annuler" disabled>&#8634;</button>
        <div class="toggle"><button id="btn-simple" class="active">Simplifiee</button><button id="btn-complete">Complete</button></div>
      </div>
    </div>

    <!-- Limite produit : les biens Beds24 ne se pilotent pas ici. Message rempli
         par annoncerBiensBeds24(), masque quand le compte n'a aucun bien Beds24. -->
    <div id="avis-beds24" style="display:none;margin:0 16px 12px;padding:10px 13px;
         background:#FEF3C7;border:0.5px solid #FCD34D;border-radius:8px;
         font-size:12px;color:#92400E;line-height:1.5"></div>
    <div id="avis-lecture" style="display:none;margin:0 16px 12px;padding:10px 13px;
         background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;
         font-size:12px;color:var(--text2);line-height:1.5"></div>

    <div class="cal-main" id="main">
      <div class="month-pills" id="month-pills"></div>
      <div class="scroll-shell"><div class="scroll-area" id="scroll-area"><div id="month-band-wrap"></div><div id="blocks"></div></div></div>
    </div>
  </div>
</div>

  <div class="float-bar" id="float-bar">
    <span class="sel-info"><strong id="sel-count">0</strong> jour(s)</span>
    <button class="btn-params" id="btn-open-popup">Plus de parametres</button>
    <!-- Seconde action de la selection (spec §5) : masquee par defaut, montree
         seulement sur un bien Channex, avec le droit d'ecrire, et hors lecture
         seule. On ne propose pas un bouton qui echouerait. -->
    <button class="btn-params" id="btn-ajouter-resa" style="background:#1f6f23;display:none">+ Ajouter une réservation</button>
    <button class="btn-clear" id="btn-clear-sel">Annuler</button>
  </div>

  <!-- FICHE D'UNE RESERVATION — consultation, et actions si elle est Offline.
       Overlay distinct de celui de configuration : les deux peuvent coexister
       sans que l'un ecrase l'etat de l'autre. -->
  <!-- FORMULAIRE D'AJOUT — pre-rempli depuis la selection et l'inventaire. -->
  <div class="overlay" id="overlay-ajout">
    <div class="popup-lg" style="max-width:520px">
      <div class="popup-head">
        <h3>Ajouter une réservation</h3>
        <div class="hint" id="ajout-sous-titre"></div>
      </div>
      <div style="padding:18px 24px;overflow-y:auto">
        <div id="ajout-recap" style="background:#f5f5f7;border-radius:10px;padding:12px;margin-bottom:16px;font-size:13px"></div>
        <label style="font-size:12px;color:#86868b">Nom du voyageur *</label>
        <input id="ajout-nom" type="text" placeholder="Prénom Nom" style="width:100%;padding:9px;margin:4px 0 12px;border:1px solid #d2d2d7;border-radius:8px">
        <label style="font-size:12px;color:#86868b">Email</label>
        <input id="ajout-email" type="email" placeholder="facultatif" style="width:100%;padding:9px;margin:4px 0 12px;border:1px solid #d2d2d7;border-radius:8px">
        <label style="font-size:12px;color:#86868b">Téléphone</label>
        <input id="ajout-tel" type="tel" placeholder="facultatif" style="width:100%;padding:9px;margin:4px 0 12px;border:1px solid #d2d2d7;border-radius:8px">
        <div style="display:flex;gap:12px">
          <div style="flex:1"><label style="font-size:12px;color:#86868b">Adultes</label>
            <input id="ajout-adultes" type="number" min="1" value="2" style="width:100%;padding:9px;margin-top:4px;border:1px solid #d2d2d7;border-radius:8px"></div>
          <div style="flex:1"><label style="font-size:12px;color:#86868b">Enfants</label>
            <input id="ajout-enfants" type="number" min="0" value="0" style="width:100%;padding:9px;margin-top:4px;border:1px solid #d2d2d7;border-radius:8px"></div>
        </div>
        <label style="font-size:12px;color:#86868b;display:block;margin-top:12px">Prix par nuit</label>
        <input id="ajout-prix" type="number" step="0.01" min="0.01" style="width:100%;padding:9px;margin:4px 0 12px;border:1px solid #d2d2d7;border-radius:8px">
        <label style="font-size:12px;color:#86868b">Note interne</label>
        <input id="ajout-ref" type="text" placeholder="facultatif — visible de vous seul" style="width:100%;padding:9px;margin:4px 0;border:1px solid #d2d2d7;border-radius:8px">
      </div>
      <div class="popup-foot">
        <span class="hint" id="ajout-etat"></span>
        <div style="display:flex;gap:10px">
          <button class="btn-cancel" id="ajout-annuler">Annuler</button>
          <button class="btn-apply" id="ajout-valider">Créer la réservation</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay-resa">
    <div class="popup-lg" style="max-width:520px">
      <div class="popup-head">
        <h3 id="resa-titre">Réservation</h3>
        <div class="hint" id="resa-sous-titre"></div>
      </div>
      <div style="padding:18px 24px;overflow-y:auto" id="resa-corps"></div>
      <div class="popup-foot">
        <span class="hint" id="resa-note"></span>
        <div style="display:flex;gap:10px" id="resa-actions"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="popup-lg">
      <div class="popup-head">
        <h3 id="popup-title">Configurer les dates</h3>
        <div class="range-row"><span>Du</span><input type="date" id="range-start" /><span>au</span><input type="date" id="range-end" /></div>
      </div>
      <div class="popup-body">
        <div class="popup-menu" id="popup-menu"></div>
        <div class="popup-content" id="popup-content"></div>
      </div>
      <div class="popup-foot">
        <span class="hint">Chaque rubrique a ses propres jours. Enregistrer applique tout.</span>
        <div style="display:flex;gap:10px"><button class="btn-cancel" id="btn-cancel">Annuler</button><button class="btn-apply" id="btn-apply">Enregistrer</button></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Modifications enregistrees</div>

  <script type="module">
    import { requireAuth }   from '/components/auth-guard.js'
    import { renderSidebar } from '/components/sidebar.js'
    import { api } from '/shared/api-client.js'
    import { peutEcrire } from '/shared/compte-courant.js'
    import { PARAMS, ROW_DEFAULTS, CELL_W, dayNames, dowOrder, dowLabels, monthShort, monthFull, toISO, fmtShort, curSym, computeDays, buildStateFromInventory, configuredRowParams, loadCalendarData } from '/shared/calendar-core.js'

    // Sur mobile : bascule vers la version tactile (PWA), en conservant l'ID du bien.
    if (window.innerWidth <= 768) {
      const m = window.location.pathname.match(/\/biens\/([^/]+)\/calendrier/)
      const bid = m ? m[1] : ''
      window.location.replace('/m/calendrier' + (bid ? '?bien=' + encodeURIComponent(bid) : ''))
    }

    const session = await requireAuth()
    if (!session) throw new Error('Non authentifié')
    await renderSidebar('biens-calendrier')

    // id du bien depuis l'URL /biens/:id/calendrier
    function bienIdFromUrl(){
      const m = window.location.pathname.match(/\/biens\/([^/]+)\/calendrier/)
      return m ? decodeURIComponent(m[1]) : null
    }
    const URL_BIEN_ID = bienIdFromUrl()

    // PARAMS / ROW_DEFAULTS : deplaces verbatim dans shared/calendar-core.js.
    let pinnedSimple = new Set()

    let MONTHS=1, days=[]
    // Constantes dates (dayNames..CELL_W) : deplacees verbatim dans shared/calendar-core.js.

    function buildDays(){
      // Largeur dispo lue au DOM (specifique desktop), puis calcul PUR dans le coeur.
      // Fallback identique a l'ancien code : si le DOM echoue, containerW null -> pas de fit.
      let containerW=null
      try{
        const main=document.getElementById('main')
        containerW = (main && main.clientWidth) ? main.clientWidth : ((window.innerWidth||1200)-260)
      }catch(e){}
      days=computeDays(MONTHS, containerW)
    }
    function isMonthStart(i){ return i===0||days[i].getDate()===1 }
    function isToday(i){ return i===0 }

    let BIENS=[]
    const ppConfig={}
    const invByBien={}

    const states={}
    function initState(b){ states[b.id]=buildStateFromInventory(days, invByBien[b.id]||{}, b.base) }

    function maxRateOf(bien, dayRate){ const cfg=ppConfig[bien.id]||{included:bien.included,extraFee:bien.extraFee}; const extra=Math.max(0, bien.capacity-cfg.included); return dayRate + extra*(cfg.extraFee||0) }
    // configuredRowParams : deplace dans shared/calendar-core.js (appele avec selectedBiens, states).

    let sel={bienId:null, idx:new Set(), row:'rate'}
    const undoStack=[]
    function pushUndo(bid){ undoStack.push({bid,snap:JSON.stringify(states[bid]),pp:JSON.stringify(ppConfig[bid])}); document.getElementById('btn-undo').disabled=false }
    function doUndo(){ if(!undoStack.length)return; const u=undoStack.pop(); states[u.bid]=JSON.parse(u.snap); ppConfig[u.bid]=JSON.parse(u.pp); if(!undoStack.length)document.getElementById('btn-undo').disabled=true; renderBlocks(); showToast('Action annulee') }

    let selectedBiens=[]

      if(!popupBienId){overlay.classList.remove('visible');return}
      const st=states[popupBienId];const bien=BIENS.find(b=>b.id===popupBienId)
      const sISO=document.getElementById('range-start').value,eISO=document.getElementById('range-end').value
      pushUndo(popupBienId)
      let touched=0
      const segments=[]
      if(pending.perPerson){ ppConfig[popupBienId]={included:pending.perPerson.included,extraFee:pending.perPerson.extraFee}; touched++
        segments.push({ kind:'perPerson', included:pending.perPerson.included, extra_guest_fee:pending.perPerson.extraFee })
      }
      PARAMS.forEach(p=>{
        if(p.type==='perperson')return
        const pv=pending[p.key]; if(!pv)return
        const hasVal = p.type==='price' ? (pv.value!==''&&!isNaN(parseFloat(pv.value))) : (p.type==='num' ? pv.value!=='' : pv.value!=='keep')
        if(!hasVal)return
        const daysArr=[]; for(const k in pv.dow){ if(pv.dow[k]) daysArr.push(parseInt(k,10)) }
        days.forEach((d,i)=>{ const iso=toISO(d); if(iso>=sISO&&iso<=eISO&&pv.dow[d.getDay()]){ if(p.type==='price'){st[i][p.key]=computeNewRate(st[i][p.key],pv.mode,pv.unit,parseFloat(pv.value));st[i].modified=true}else if(p.type==='num'){st[i][p.key]=parseInt(pv.value,10)||0;st[i].modified=true}else{st[i][p.key]=pv.value;st[i].modified=true} } })
        const seg={ date_from:sISO, date_to:eISO, days:daysArr }
        if(p.key==='rate'){
          if(pv.mode==='set'&&pv.unit==='eur'){ seg.rate=parseFloat(pv.value) }
          else { seg.__perDate=true }
        }
        else if(p.key==='minStayArr') seg.min_stay_arrival=parseInt(pv.value,10)||0
        else if(p.key==='minStayThrough') seg.min_stay_through=parseInt(pv.value,10)||0
        else if(p.key==='maxStay') seg.max_stay=parseInt(pv.value,10)||0
        else if(p.key==='cta') seg.cta=(pv.value==='closed')
        else if(p.key==='ctd') seg.ctd=(pv.value==='closed')
        else if(p.key==='stopSell') seg.stop_sell=(pv.value==='closed')
        else if(p.key==='avail') seg.avail=(pv.value==='closed')?0:1
        segments.push(seg)
        touched++
      })

      const finalSegments=[]
      segments.forEach(seg=>{
        if(seg.kind==='perPerson'){ finalSegments.push(seg); return }
        if(seg.__perDate){
          days.forEach((d,i)=>{ const iso=toISO(d); if(iso>=seg.date_from&&iso<=seg.date_to&&(!seg.days.length||seg.days.includes(d.getDay()))){ finalSegments.push({ date_from:iso, date_to:iso, rate:st[i].rate }) } })
        } else { delete seg.__perDate; finalSegments.push(seg) }
      })

      overlay.classList.remove('visible');sel={bienId:null,idx:new Set(),row:'rate'};hideFloatBar();renderBlocks()

      if(touched>0){
        showToast('Enregistrement...')
        try{
          const resp=await api.calendar.save(popupBienId, finalSegments)
          const tids = resp && resp.task_ids ? [resp.task_ids.restrictions, resp.task_ids.availability].filter(Boolean) : []
          if(tids.length){ try{ await navigator.clipboard.writeText(tids.join('\n')) }catch(e){} }
          // ⚠ Le TEXTE des avertissements est affiche, pas leur nombre : un echec
          // d'enregistrement de la configuration s'y lisait « 1 avertissement »,
          // donc pas du tout.
          if(resp && resp.config_saved === false){ showToast('Erreur: ' + resp.warnings.join(' · '), 6500) }
          else if(resp && resp.local_only){ showToast(resp.warnings.join(' · '), 6500) }
          else if(resp && resp.warnings && resp.warnings.length){ showToast('Enregistre — ' + resp.warnings.join(' · ') + (tids.length?' — task ID copie':''), 6500) }
          else { showToast('Enregistre et publie' + (tids.length?' — task ID copie : '+tids[0]:'')) }
          await reloadInventory()
        }catch(err){ showToast('Erreur: ' + (err.message||'sauvegarde')) }
      } else { showToast('Aucune modification') }
    })

    document.getElementById('btn-undo').addEventListener('click',doUndo)

    btnS.addEventListener('click',()=>{showComplete=false;btnS.classList.add('active');btnC.classList.remove('active');renderBlocks()})
    btnC.addEventListener('click',()=>{showComplete=true;btnC.classList.add('active');btnS.classList.remove('active');renderBlocks()})

    let toastTimer=null
    // ═══════════════════════════════════════════════════════════════════════
    // AJOUT D'UNE RESERVATION DIRECTE (spec-reservation-manuelle.md §5)
    // ═══════════════════════════════════════════════════════════════════════
    //
    // Chemin : selection existante -> ce formulaire -> l'endpoint, qui applique
    // le verrou et la capacite de l'etape 2 -> Channex -> retour PAR LE FEED.
    // Aucune ecriture directe du snapshot, jamais : la reservation apparait
    // quand le cœur l'a apprise, comme une reservation OTA.
    function bornesSelection(){
      if(!sel.bienId || sel.idx.size===0) return null
      const tries=[...sel.idx].sort((a,b)=>a-b)
      // La selection porte sur des NUITS ; le depart est le lendemain de la
      // derniere nuit selectionnee. C'est ce que fait Channex, et c'est ce qui
      // laisse la borne libre pour l'arrivee suivante.
      const depart=new Date(days[tries[tries.length-1]]); depart.setDate(depart.getDate()+1)
      return { arrival: toISO(days[tries[0]]), departure: toISO(depart), nuits: tries.length }
    }

    function ouvrirFormulaireAjout(){
      const b = bornesSelection()
      const bien = BIENS.find(x=>x.id===sel.bienId)
      if(!b||!bien) { showToast('Sélectionnez d\'abord des dates'); return }
      if(!peutEcrire('reservations')||LECTURE_SEULE){ showToast('Vous n\'avez pas le droit de créer une réservation'); return }

      document.getElementById('ajout-sous-titre').textContent = bien.name
      document.getElementById('ajout-recap').innerHTML =
        '<strong>' + b.arrival + '</strong> → <strong>' + b.departure + '</strong>'
        + ' · ' + b.nuits + ' nuit' + (b.nuits>1?'s':'')
      // Prix prerempli depuis l'inventaire du premier jour selectionne, a defaut
      // le prix de base du bien.
      const st = states[sel.bienId]
      const premier = [...sel.idx].sort((a,b)=>a-b)[0]
      // `bien.base` : c'est le nom du champ dans mapBien (`base_price` cote API).
      const prix = (st && st[premier] && st[premier].rate) || bien.base || ''
      document.getElementById('ajout-prix').value = prix
      document.getElementById('ajout-nom').value = ''
      document.getElementById('ajout-email').value = ''
      document.getElementById('ajout-tel').value = ''
      document.getElementById('ajout-ref').value = ''
      document.getElementById('ajout-etat').textContent = ''
      // ⚠ Reinitialiser le bouton : apres une creation reussie il restait
      // desactive et affiche « Envoi… », rendant toute deuxieme saisie
      // impossible sans recharger la page.
      const btnV = document.getElementById('ajout-valider')
      btnV.disabled = false; btnV.textContent = 'Créer la réservation'
      document.getElementById('overlay-ajout').classList.add('visible')
      document.getElementById('ajout-nom').focus()
    }

    function fermerFormulaireAjout(){ document.getElementById('overlay-ajout').classList.remove('visible') }

    async function validerAjout(){
      const b = bornesSelection()
      const bien = BIENS.find(x=>x.id===sel.bienId)
      if(!b||!bien) return
      const nomComplet = document.getElementById('ajout-nom').value.trim()
      if(!nomComplet){ document.getElementById('ajout-etat').textContent='Le nom du voyageur est obligatoire.'; return }
      const prix = parseFloat(document.getElementById('ajout-prix').value)
      if(!(prix>0)){ document.getElementById('ajout-etat').textContent='Prix par nuit invalide.'; return }

      const morceaux = nomComplet.split(' ')
      const btn = document.getElementById('ajout-valider')
      btn.disabled = true; btn.textContent = 'Envoi…'
      // ⚠ CONFIRMATION EN DEUX TEMPS (spec §5). Premier temps : le canal a
      // accepte. Le second — « visible dans HôteSmart » — ne peut PAS etre
      // affirme ici : la reservation n'existe dans le cœur qu'apres le passage
      // du feed. Le dire autrement serait mentir.
      document.getElementById('ajout-etat').textContent = 'Envoi au canal…'
      try{
        const r = await api.reservationDirecte.creer({
          propertyId: bien.provider_property_id,
          arrival: b.arrival, departure: b.departure,
          prixParNuit: prix,
          customer: {
            name: morceaux[0] || nomComplet,
            surname: morceaux.slice(1).join(' '),
            mail: document.getElementById('ajout-email').value.trim() || null,
            phone: document.getElementById('ajout-tel').value.trim() || null
          },
          occupancy: {
            adults: parseInt(document.getElementById('ajout-adultes').value, 10) || 1,
            children: parseInt(document.getElementById('ajout-enfants').value, 10) || 0
          },
          reference: document.getElementById('ajout-ref').value.trim() || null
        })
        fermerFormulaireAjout()
        sel={bienId:null,idx:new Set(),row:'rate'}; updateSelectionUI(); hideFloatBar()
        showToast('Envoyée au canal ✓ — visible dans HôteSmart au prochain rafraîchissement', 7000)
        // Second temps : on relit le cœur. Si le feed a deja remonte, la
        // reservation apparait ; sinon elle apparaitra au rafraichissement
        // suivant, et le message ci-dessus l'a annonce.
        setTimeout(()=>{ reloadInventory().catch(()=>{}) }, 8000)
      }catch(e){
        // 409 = refus METIER (nuit deja prise, saisie concurrente). On le dit
        // dans les mots du metier, pas en jargon technique.
        const msg = e.status===409
          ? (e.message || 'Ces dates ne sont plus disponibles.')
          : ('Erreur : ' + (e.message||'envoi'))
        document.getElementById('ajout-etat').textContent = msg
        btn.disabled=false; btn.textContent='Créer la réservation'
      }
    }

    document.getElementById('btn-ajouter-resa')?.addEventListener('click', ouvrirFormulaireAjout)
    document.getElementById('ajout-annuler')?.addEventListener('click', fermerFormulaireAjout)
    document.getElementById('ajout-valider')?.addEventListener('click', validerAjout)

    // FICHE D'UNE RESERVATION (spec-reservation-manuelle.md §5)
    // ═══════════════════════════════════════════════════════════════════════
    //
    // ⚠ CONSULTATION POUR TOUTES, ACTIONS POUR LES SEULES « Offline ».
    // Une reservation venue d'une OTA ne peut etre ni modifiee ni annulee par
    // nous : Airbnb et Booking.com sont maitres de leurs reservations, et le CRS
    // ne sert qu'a nos propres ecritures. Afficher un bouton qui echouerait
    // promettrait un pouvoir qu'on n'a pas — mieux vaut dire pourquoi il n'y en
    // a pas. C'est la regle de l'amendement UI, et elle vaut aussi pour les
    // biens Beds24 : le module est Channex-only par spec.
    let resaCourante = null

    function fermerFiche(){ document.getElementById('overlay-resa').classList.remove('visible'); resaCourante=null }

    function ligneFiche(label, valeur){
      if(valeur===null||valeur===undefined||valeur==='') return ''
      return '<div style="display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid #f5f5f7">'
        + '<span style="color:#86868b;font-size:13px">'+escapeHtmlLocal(label)+'</span>'
        + '<span style="font-size:13px;font-weight:500;text-align:right">'+escapeHtmlLocal(String(valeur))+'</span></div>'
    }

    const LIBELLE_CANAL = { airbnb:'Airbnb', booking:'Booking.com', direct:'Direct' }

    function ouvrirFicheResa(bienId, resaId){
      const bien = BIENS.find(x=>x.id===bienId)
      const resa = (bien&&bien.resa||[]).find(r=>String(r.id)===String(resaId))
      if(!bien||!resa) { showToast('Réservation introuvable'); return }
      resaCourante = { bien, resa }

      const nuits = Math.max(1, Math.round((new Date(resa.checkout+'T00:00:00') - new Date(resa.startISO+'T00:00:00'))/86400000))
      const voyageurs = [resa.numAdult?resa.numAdult+' adulte'+(resa.numAdult>1?'s':''):null,
                         resa.numChild?resa.numChild+' enfant'+(resa.numChild>1?'s':''):null].filter(Boolean).join(', ')
      const montant = resa.amount!=null ? (resa.amount+' '+(resa.currency||'EUR')) : null
      // `sourceBrute` est la verite du provider (« Offline », « AirBNB »…) ;
      // le libelle n'est qu'un habillage.
      const canal = resa.offline ? 'Direct (saisie HôteSmart)'
                                 : (LIBELLE_CANAL[resa.source] || resa.sourceBrute || resa.source)

      document.getElementById('resa-titre').textContent = resa.name
      document.getElementById('resa-sous-titre').textContent = bien.name
      document.getElementById('resa-corps').innerHTML =
          ligneFiche('Arrivée', resa.startISO + (resa.arrivalHour?' à '+resa.arrivalHour:''))
        + ligneFiche('Départ', resa.checkout)
        + ligneFiche('Nuits', nuits)
        + ligneFiche('Voyageurs', voyageurs)
        + ligneFiche('Canal', canal)
        + ligneFiche('Montant', montant)
        + ligneFiche('Commission', resa.commission!=null ? resa.commission+' '+(resa.currency||'EUR') : null)
        + ligneFiche('Référence OTA', resa.otaCode)
        + ligneFiche('Identifiant', resa.id)

      const actions = document.getElementById('resa-actions')
      const note = document.getElementById('resa-note')
      actions.innerHTML = '<button class="btn-cancel" id="resa-fermer">Fermer</button>'

      const channex = (bien.provider==='channex'||bien.provider==='channel')
      if(resa.offline && channex && peutEcrire('reservations') && !LECTURE_SEULE){
        actions.insertAdjacentHTML('afterbegin',
          '<button class="btn-cancel" id="resa-annuler" style="color:#c0392b">Annuler la réservation</button>')
        note.textContent = 'Réservation directe : modifiable depuis HôteSmart.'
      } else if(resa.offline && channex){
        note.textContent = 'Réservation directe — vous n\'avez pas le droit de la modifier.'
      } else {
        // On DIT pourquoi il n'y a pas de bouton, plutot que de laisser un vide.
        note.textContent = channex
          ? 'Réservation venue de ' + canal + ' : modifiable uniquement chez ' + canal + '.'
          : 'Bien synchronisé hors HôteSmart : consultation seule.'
      }
      document.getElementById('resa-fermer').addEventListener('click', fermerFiche)
      const btnAnn = document.getElementById('resa-annuler')
      if(btnAnn) btnAnn.addEventListener('click', annulerResaCourante)
      document.getElementById('overlay-resa').classList.add('visible')
    }

    async function annulerResaCourante(){
      if(!resaCourante) return
      const { bien, resa } = resaCourante
      if(!confirm('Annuler la réservation de '+resa.name+' du '+resa.startISO+' au '+resa.checkout+' ?\n\nLes dates seront rouvertes à la vente.')) return
      const btn = document.getElementById('resa-annuler')
      if(btn){ btn.disabled=true; btn.textContent='Annulation…' }
      try{
        // `api.reservationDirecte` : Authorization et X-Compte poses par
        // api-client, comme tous les autres appels de cette page.
        await api.reservationDirecte.annuler({
          propertyId: bien.provider_property_id, bookingId: resa.id
        })
        fermerFiche()
        // ⚠ On ne retire PAS la reservation de l'affichage : elle disparaitra
        // quand le cœur l'aura apprise par le feed. Retirer tout de suite
        // afficherait une date libre qui ne l'est pas encore cote Channex.
        showToast('Annulation envoyée — visible dans HôteSmart au prochain rafraîchissement', 6000)
      }catch(e){
        if(btn){ btn.disabled=false; btn.textContent='Annuler la réservation' }
        showToast('Erreur : '+(e.message||'annulation'), 6000)
      }
    }

    function showToast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),ms||1800)}

    const COLORS_BY_SOURCE = { airbnb:'red', booking:'blue', direct:'green' }
    function rangeISO(){ return { start: toISO(days[0]), end: toISO(days[days.length-1]) } }

    function mapBien(p){
      // ⚠ `provider_property_id` EST INDISPENSABLE : c'est l'identifiant que
      // l'API de reservation directe attend. Sans lui, JSON.stringify supprime
      // la cle et le serveur repond « propertyId manquant » — creation et
      // annulation echouaient a 100 % des cas.
      return { id:p.id, name:p.name, capacity:p.capacity||1, base:Number(p.base_price)||0,
        included:p.included_guests||p.capacity||1, extraFee:Number(p.extra_guest_fee)||0,
        currency:p.currency||'EUR', provider:p.provider||'channex',
        provider_property_id:p.provider_property_id||null, resa:[] }
    }
    // ⚠ LA SOURCE EST CELLE DU CŒUR, PAS UNE COULEUR TIREE AU SORT.
    // L'ancienne version faisait `SRC[idx % 3]` : airbnb, booking et direct en
    // rotation par index. Les pastilles de canal du planning etaient donc
    // DECORATIVES et fausses — une reservation Airbnb pouvait s'afficher en
    // « direct ». L'endpoint sert la vraie source depuis bookings_snapshot.
    //
    // `id` : indispensable a la fiche de consultation. Sans lui, le bandeau
    // n'est qu'un rectangle et rien ne peut etre ouvert au clic.
    function familleSource(src){
      const v=String(src||'').toLowerCase()
      if(v.includes('airbnb')||v.includes('abb')) return 'airbnb'
      if(v.includes('booking')||v.includes('bdc')) return 'booking'
      // « Offline » = reservation directe creee par nous (spec reservation
      // manuelle). Elle partage la couleur du direct : c'en est une.
      if(v==='offline'||v.includes('direct')) return 'direct'
      return 'direct'
    }
    function estOffline(src){ return String(src||'').toLowerCase()==='offline' }

    function mapResa(list){
      return (list||[]).filter(function(b){return String(b.status||'').toLowerCase()!=='cancelled'}).map(b=>{
        const ci=new Date(b.checkin+'T00:00:00'), co=new Date(b.checkout+'T00:00:00')
        const span=Math.max(1, Math.round((co-ci)/86400000))
        const src=familleSource(b.source)
        return {
          id: b.booking_id || null,
          startISO:b.checkin, checkout:b.checkout, span,
          name:b.guest_name||'Reservation',
          source:src, sourceBrute:b.source||null, offline:estOffline(b.source),
          color:COLORS_BY_SOURCE[src]||'green',
          amount:b.amount ?? null, currency:b.currency||null,
          commission:b.commission ?? null,
          numAdult:b.numAdult ?? null, numChild:b.numChild ?? null,
          otaCode:b.otaReservationCode||null, arrivalHour:b.arrivalHour||null,
          statut:b.status||null
        }
      })
    }
    function platformLogo(src){
      if(src==='airbnb') return '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2c-1.1 0-2 .7-2.5 1.8C8 6.5 4 15 4 18a4 4 0 0 0 7 2.6A4 4 0 0 0 18 18c0-3-4-11.5-5.5-14.2C12 2.7 11.1 2 12 2zm0 12a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>'
      if(src==='booking') return '<svg viewBox="0 0 24 24" fill="#fff"><text x="12" y="17" font-size="15" font-weight="700" text-anchor="middle">B</text></svg>'
      return '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3l9 7v11h-6v-6H9v6H3V10z"/></svg>'
    }

    const PREF_KEY_D='hs_cal_desktop_prefs'
    function savePrefsD(){ try{ localStorage.setItem(PREF_KEY_D, JSON.stringify({ biens:selectedBiens, months:MONTHS })) }catch(e){} }
    function loadPrefsD(){ try{ return JSON.parse(localStorage.getItem(PREF_KEY_D)||'null') }catch(e){ return null } }

    async function loadData(){
      let all=[]
      try { const r=await api.channel.listProperties(); all=r.properties||[] } catch(e){ showToast('Erreur chargement biens'); }
      BIENS = all.map(mapBien)

      // ⚠ AVANT toute sortie anticipee. Un membre dont le perimetre ne resout
      // aucun bien, ou n'importe quel hote sur un echec reseau, gardait sinon les
      // boutons d'ecriture dans le DOM et ne voyait jamais l'avis de lecture
      // seule. Ces boutons vivent dans l'en-tete, hors de #main : ils survivent
      // au remplacement ci-dessous.
      appliquerLectureSeule()

      // Aucun bien -> etat vide explicite (pas de grille blanche, pas de fausses donnees).
      if(!BIENS.length){
        const m=document.getElementById('main')
        // ⚠ « Connectez votre PMS » ne s'adresse qu'a un TITULAIRE. Un membre n'a
        // aucun PMS a connecter : son calendrier est vide parce que son perimetre
        // ne contient aucun bien, ce qui n'est pas la meme chose.
        if(m) m.innerHTML = peutEcrire('reservations')
          ? `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px 20px;color:#6e6e73">
          <div style="font-size:40px;margin-bottom:14px">&#128197;</div>
          <h2 style="font-size:17px;color:#1d1d1f;margin-bottom:8px">Votre calendrier apparaîtra ici</h2>
          <p style="font-size:14px;max-width:440px;margin-bottom:24px;line-height:1.5">Une fois votre PMS connecté, vous piloterez ici les tarifs, les disponibilités et le séjour minimum de chaque logement, avec vos réservations.</p>
          <a href="/pages/onboarding.html" style="display:inline-block;background:#007aff;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px">Connecter mon logement</a>
        </div>`
          : `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px 20px;color:#6e6e73">
          <div style="font-size:40px;margin-bottom:14px">&#128197;</div>
          <h2 style="font-size:17px;color:#1d1d1f;margin-bottom:8px">Aucun bien à afficher</h2>
          <p style="font-size:14px;max-width:440px;line-height:1.5">Aucun bien de ce compte ne vous a été attribué. Le titulaire peut élargir votre périmètre depuis ses réglages.</p>
        </div>`
        return
      }
      const prefs=loadPrefsD()
      if(prefs && prefs.months){ MONTHS=prefs.months; const ps=document.getElementById('period-select'); if(ps) ps.value=String(MONTHS); buildDays(); renderMonthPills(); renderMonthBand() }
      const editable=b=>b && b.provider!=='beds24'
      if(prefs && Array.isArray(prefs.biens) && prefs.biens.length){ selectedBiens=prefs.biens.filter(id=>{const b=BIENS.find(x=>x.id===id);return editable(b)}) }
      if(!selectedBiens.length && URL_BIEN_ID && editable(BIENS.find(b=>b.id===URL_BIEN_ID))) selectedBiens=[URL_BIEN_ID]
      if(!selectedBiens.length){ const first=BIENS.find(editable); if(first) selectedBiens=[first.id] }
      BIENS.forEach(b=>{ ppConfig[b.id]={included:b.included, extraFee:b.extraFee} })
      renderMultiSelect()
      annoncerBiensBeds24()
      await reloadInventory()
    }

    // ⚠ LECTURE SEULE VISIBLE. Un membre `reservations: read` consulte le
    // calendrier mais ne publie rien. Les boutons d'ecriture sont retires plutot
    // que desactives : un bouton grise invite a chercher pourquoi, un bouton
    // absent avec un message dit ce qu'il en est.
    function appliquerLectureSeule(){
      if(peutEcrire('reservations')) return
      LECTURE_SEULE = true
      // ⚠ On retire les BOUTONS D'ACTION, jamais `float-bar` : `showFloatBar()`
      // et `btn-clear-sel` la lisent, et sa suppression provoquait un TypeError a
      // chaque clic sur une cellule — la selection restait alors surlignee sans
      // aucun moyen de l'effacer. La selection est bloquee en amont (attachEvents).
      for(const id of ['btn-open-popup','btn-undo']){
        const el=document.getElementById(id); if(el) el.remove()
      }
      const z=document.getElementById('avis-lecture')
      if(z){ z.textContent='Lecture seule : vous ne pouvez pas modifier les prix ni les disponibilités de ce compte.'; z.style.display='block' }
    }

    // ⚠ LIMITE PRODUIT ASSUMEE, rendue EXPLICITE.
    // Les prix et disponibilites d'un bien Beds24 se pilotent DANS Beds24 :
    // HoteSmart n'y pousse pas d'ARI (voir docs/kb/menage.md et le calendrier).
    // Jusqu'ici, la seule mention vivait dans le selecteur multiple — il fallait
    // l'ouvrir pour la voir. Un hote 100 % Beds24 arrivait donc sur un calendrier
    // vide sans explication, et un membre dont le perimetre ne contient que du
    // Beds24 encore plus : lui ne peut meme pas changer de bien.
    function annoncerBiensBeds24(){
      const zone = document.getElementById('avis-beds24')
      if(!zone) return
      const beds24 = BIENS.filter(b => b.provider === 'beds24')
      if(!beds24.length){ zone.style.display='none'; return }

      const noms = beds24.map(b => b.name).join(', ')
      const aucunPilotable = !BIENS.some(b => b.provider !== 'beds24')
      zone.innerHTML = aucunPilotable
        ? `<strong>Aucun bien pilotable ici.</strong> ${escapeHtmlLocal(noms)} ${beds24.length > 1 ? 'sont gérés' : 'est géré'} dans Beds24 :
           leurs prix et disponibilités se modifient directement depuis Beds24, pas depuis HôteSmart.`
        : `${escapeHtmlLocal(noms)} ${beds24.length > 1 ? 'sont gérés' : 'est géré'} dans Beds24 :
           ${beds24.length > 1 ? 'leurs prix et disponibilités se modifient' : 'ses prix et disponibilités se modifient'}
           directement depuis Beds24. Les autres biens restent pilotables ici.`
      zone.style.display='block'
    }

    function escapeHtmlLocal(v){ return String(v==null?'':v).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

    async function reloadInventory(){
      if(!selectedBiens.length){ renderBlocks(); return }
      const {start,end}=rangeISO()
      try{
        const {inv,pp,propsById,bookings}=await loadCalendarData(selectedBiens, start, end)
        ;(selectedBiens).forEach(id=>{ invByBien[id]=inv[id] })
        if(bookings){ BIENS.forEach(b=>{ if(bookings[b.id]) b.resa=mapResa(bookings[b.id]) }) }
        for(const id in pp){ ppConfig[id]=pp[id]
          const bb=BIENS.find(x=>x.id===id); if(bb){ bb.base=propsById[id].base||bb.base; bb.included=pp[id].included; bb.extraFee=pp[id].extraFee } }
      }catch(e){ showToast('Erreur chargement calendrier') }
      Object.keys(states).forEach(k=>delete states[k])
      renderBlocks()
    }

    buildDays(); renderMonthPills(); renderMonthBand()
    await loadData()
  </script>
</body>
</html>
