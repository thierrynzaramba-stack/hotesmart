    // ─── Fermer / Rouvrir a la vente, depuis la selection de dates ───────────
    // ⚠ UI SEULEMENT : aucune logique nouvelle. On passe par `api.calendar.save`
    // avec des segments `stop_sell`, exactement ce que fait deja la rubrique
    // « Stop vente » de la popup — c'est le meme chemin serveur, qui memorise
    // l'INTENTION dans `calendar_inventory` et la restitue apres toute poussee
    // d'inventaire (docs/kb/reservation-directe.md §8). Ce bouton ne fait que
    // supprimer trois clics.
    // Regroupement en PLAGES CONTIGUES d'indices : [[a,b], ...]
    function plagesContigues(idxs){
      const plages=[]; let debut=idxs[0], prec=idxs[0]
      for(let k=1;k<idxs.length;k++){
        if(idxs[k]===prec+1){ prec=idxs[k]; continue }
        plages.push([debut,prec]); debut=idxs[k]; prec=idxs[k]
      }
      plages.push([debut,prec]); return plages
    }
    function afficherVerdict(resp, sinon){
      if(resp && resp.config_saved === false){ showToast('Erreur: ' + resp.warnings.join(' · '), 6500) }
      else if(resp && resp.push_failed){ showToast('NON PUBLIE — ' + resp.warnings.join(' · '), 12000) }
      else if(resp && resp.local_only){ showToast(resp.warnings.join(' · '), 6500) }
      else if(resp && resp.warnings && resp.warnings.length){ showToast('Enregistre — ' + resp.warnings.join(' · '), 6500) }
      else { showToast(sinon) }
    }
    // Poser une fermeture par plage contigue : `api.calendar.fermer` cree
    // l'objet ET memorise stop_sell par le writer — un seul chemin serveur.
    async function poserFermeture(bienId, idxs, raison){
      const plages = plagesContigues(idxs)
      pushUndo(bienId)
      const st = states[bienId]
      idxs.forEach(i=>{ st[i].stopSell='closed'; st[i].modified=true })
      sel={bienId:null, idx:new Set(), row:'rate'}; hideFloatBar(); renderBlocks()
      showToast('Fermeture de '+idxs.length+' jour'+(idxs.length>1?'s':'')+'…')
      // ⚠ UNE PLAGE = UN APPEL, ET LE VERDICT EST CELUI DU PIRE — releve en
      // review : montrer la derniere reponse cachait un `push_failed` sur la
      // premiere plage derriere un toast vert. On continue apres un echec pour
      // que l'hote sache ce qui a ete pose et ce qui ne l'a pas ete.
      const reponses=[], echecs=[]
      for(const [a,b] of plages){
        const libelle=fmtJourFr(toISO(days[a]))+(a!==b?'→'+fmtJourFr(toISO(days[b])):'')
        try{ reponses.push(await api.calendar.fermer(bienId, toISO(days[a]), toISO(days[b]), raison)) }
        catch(err){ echecs.push(libelle+' : '+(err.message||'fermeture')) }
      }
      const pire = reponses.find(r=>r&&r.push_failed) || reponses.find(r=>r&&r.local_only) || reponses.find(r=>r&&r.warnings&&r.warnings.length) || reponses[0]
      if(echecs.length) showToast((reponses.length?reponses.length+' plage(s) fermée(s). ':'')+'NON FERMÉ — '+echecs.join(' · '), 12000)
      else afficherVerdict(pire, 'Fermé à la vente — '+raison)
      await reloadInventory()
    }
    // Retirer une fermeture : rouvre TOUTE sa periode, et le dit avant.
    async function retirerFermeture(bienId, id){
      if(!peutEcrire('reservations') || LECTURE_SEULE){ showToast('Vous n\'avez pas le droit de modifier la vente'); return }
      const f=(fermByBien[bienId]||[]).find(x=>x.id===id); if(!f) return
      if(!window.confirm('Retirer cette fermeture rouvre à la vente TOUTE la période du '+fmtJourFr(f.date_debut)+' au '+fmtJourFr(f.date_fin)+'. Continuer ?')) return
      showToast('Réouverture…')
      try{
        const resp = await api.calendar.rouvrirFermeture(bienId, id)
        afficherVerdict(resp, 'Rouvert à la vente')
      }catch(err){ showToast('Erreur: ' + (err.message||'réouverture'), 6000) }
      await reloadInventory()
    }
    async function basculerStopSell(){
      if(!sel.bienId || !sel.idx.size) return
      // Garde d'interface doublee cote serveur (api/calendar.js, droit
      // `reservations` en ecriture) : celle-ci n'est qu'un confort.
      if(!peutEcrire('reservations') || LECTURE_SEULE){
        showToast('Vous n\'avez pas le droit de modifier la vente'); return
      }
      const bienId = sel.bienId, st = states[bienId]
      const fermer = !selectionToutFermee()
      const idxs = [...sel.idx].sort((a,b)=>a-b)

      // ⚠ SUR UN BIEN PILOTE PAR YIELDFLOW, FERMER = POSER UNE FERMETURE (lot
      // 4.6.2). Un simple stop_sell y serait indistinguable d'une fermeture
      // CALCULEE par le moteur, qui pourrait la rouvrir au prochain passage. La
      // fermeture (debut, fin, raison) est la frontiere que Yield ne franchit
      // jamais — et la raison est ce que le calendrier affichera. Rouvrir, lui,
      // reste le chemin commun : le serveur scinde la fermeture touchee.
      if(fermer && estPiloteYield(bienId)){
        const raison = window.prompt('Pourquoi fermez-vous ces dates ? (travaux, usage personnel…)\nYieldFlow ne rouvrira jamais cette période.')
        if(raison==null) return
        if(!raison.trim()){ showToast('Dites pourquoi vous fermez : c\'est ce que le calendrier affichera.'); return }
        await poserFermeture(bienId, idxs, raison.trim())
        return
      }

      // Regroupement en PLAGES CONTIGUES : un segment par jour ferait autant de
      // lignes a pousser que de jours selectionnes. Sur un mois entier, c'est la
      // difference entre un appel et trente.
      const plages=[]; let debut=idxs[0], prec=idxs[0]
      for(let k=1;k<idxs.length;k++){
        if(idxs[k]===prec+1){ prec=idxs[k]; continue }
        plages.push([debut,prec]); debut=idxs[k]; prec=idxs[k]
      }
      plages.push([debut,prec])
      // ⚠ ROUVRIR DOIT AUSSI RELEVER `avail`, SINON LE JOUR RESTE INVENDABLE.
      // La rubrique « Disponibilité → Fermé » de la popup ecrit `avail = 0` ET
      // `stop_sell = true` (api/calendar.js). Ne renvoyer que `stop_sell: false`
      // laissait `avail = 0` : la relecture ramenait la cellule en rouge apres
      // qu'un toast avait annonce « Rouvert à la vente ».
      // Fermer, en revanche, n'envoie QUE `stop_sell` : c'est l'intention
      // memorisee de l'hote, et la disponibilite reste une consequence calculee
      // (docs/kb/reservation-directe.md §8) — on ne touche pas au stock.
      const segments = plages.map(([a,b])=>{
        const seg = { date_from: toISO(days[a]), date_to: toISO(days[b]), stop_sell: fermer }
        if(!fermer) seg.avail = 1
        return seg
      })

      pushUndo(bienId)
      // Rendu optimiste : les hachures apparaissent tout de suite. On ne modifie
      // localement QUE ce qui est reellement envoye — a la fermeture `avail`
      // n'est pas touche, donc on ne le repeint pas non plus, sinon la relecture
      // « annulerait » un changement que l'hote croyait acquis.
      idxs.forEach(i=>{ st[i].stopSell = fermer?'closed':'open'
                        if(!fermer) st[i].avail = 'open'
                        st[i].modified = true })
      const n = idxs.length
      sel={bienId:null, idx:new Set(), row:'rate'}; hideFloatBar(); renderBlocks()
      showToast((fermer?'Fermeture':'Réouverture')+' de '+n+' jour'+(n>1?'s':'')+'…')
      try{
        const resp = await api.calendar.save(bienId, segments)
        if(resp && resp.config_saved === false){ showToast('Erreur: ' + resp.warnings.join(' · '), 6500) }
        else if(resp && resp.push_failed){ showToast('NON PUBLIE — ' + resp.warnings.join(' · '), 12000) }
        else if(resp && resp.local_only){ showToast(resp.warnings.join(' · '), 6500) }
        else if(resp && resp.warnings && resp.warnings.length){ showToast('Enregistre — ' + resp.warnings.join(' · '), 6500) }
        else { showToast(fermer?'Fermé à la vente':'Rouvert à la vente') }
        // Relecture : l'etat affiche redevient celui du cœur, jamais le pari
        // optimiste ci-dessus.
        await reloadInventory()
      }catch(err){
        showToast('Erreur: ' + (err.message||'sauvegarde'), 6000)
        await reloadInventory()
      }
    }
    document.getElementById('ajout-annuler')?.addEventListener('click', fermerFormulaireAjout)
    document.getElementById('ajout-valider')?.addEventListener('click', validerAjout)

    // ═══════════════════════════════════════════════════════════════════════
    // FICHE D'UNE RESERVATION (spec-reservation-manuelle.md §5)
    // ═══════════════════════════════════════════════════════════════════════
    //
    // ⚠ CONSULTATION POUR TOUTES, ACTIONS POUR LES SEULES « Offline ».
    // Une reservation venue d'une OTA ne peut etre ni modifiee ni annulee par
    // nous : Airbnb et Booking.com sont maitres de leurs reservations, et le CRS
    // ne sert qu'a nos propres ecritures. Afficher un bouton qui echouerait
    // promettrait un pouvoir qu'on n'a pas — mieux vaut dire pourquoi il n'y en
    // a pas. C'est la regle de l'amendement UI, et elle vaut aussi pour les
    // biens Beds24 : le module est Channex-only par spec.
    let resaCourante = null

    function fermerFiche(){ document.getElementById('overlay-resa').classList.remove('visible'); resaCourante=null }

    function ligneFiche(label, valeur){
      if(valeur===null||valeur===undefined||valeur==='') return ''
      return '<div style="display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid #f5f5f7">'
        + '<span style="color:#86868b;font-size:13px">'+escapeHtmlLocal(label)+'</span>'
        + '<span style="font-size:13px;font-weight:500;text-align:right">'+escapeHtmlLocal(String(valeur))+'</span></div>'
    }

    const LIBELLE_CANAL = { airbnb:'Airbnb', booking:'Booking.com', direct:'Direct' }

    function ouvrirFicheResa(bienId, resaId){
      const bien = BIENS.find(x=>x.id===bienId)
      const resa = (bien&&bien.resa||[]).find(r=>String(r.id)===String(resaId))
      if(!bien||!resa) { showToast('Réservation introuvable'); return }
      resaCourante = { bien, resa }

      const nuits = Math.max(1, Math.round((new Date(resa.checkout+'T00:00:00') - new Date(resa.startISO+'T00:00:00'))/86400000))
      const voyageurs = [resa.numAdult?resa.numAdult+' adulte'+(resa.numAdult>1?'s':''):null,
                         resa.numChild?resa.numChild+' enfant'+(resa.numChild>1?'s':''):null].filter(Boolean).join(', ')
      const montant = resa.amount!=null ? (resa.amount+' '+(resa.currency||'EUR')) : null
      // `sourceBrute` est la verite du provider (« Offline », « AirBNB »…) ;
      // le libelle n'est qu'un habillage.
      const canal = resa.offline ? 'Direct (saisie HôteSmart)'
                                 : (LIBELLE_CANAL[resa.source] || resa.sourceBrute || resa.source)

      const channex = (bien.provider==='channex'||bien.provider==='channel')
      // ⚠ MODIFIABLE = LES MEMES QUATRE CONDITIONS QUE L'ANNULATION. Une resa OTA
      // reste en consultation seule : Airbnb et Booking sont maitres de leurs
      // reservations, et le CRS ne sert qu'a nos propres ecritures.
      // ⚠ « Offline » NE VEUT PAS DIRE « saisie par l'hote ». Le moteur de
      // reservation public cree lui aussi des sejours `ota_name: "Offline"`, mais
      // PAYES par le voyageur : en deplacer dates ou prix depuis le planning ne
      // declencherait ni remboursement ni complement. Le serveur les refuse (409
      // `reservation_moteur`) ; on ne propose donc pas les champs.
      const venteEnLigne = resa.metaSource === 'hotesmart-engine'
      const modifiable = !!(resa.offline && channex && !venteEnLigne
                            && peutEcrire('reservations') && !LECTURE_SEULE)

      document.getElementById('resa-titre').textContent = resa.name
      document.getElementById('resa-sous-titre').textContent = bien.name
      document.getElementById('resa-corps').innerHTML =
          blocConversation(bien, resa)
        + (modifiable ? champsModifiables(bien, resa, nuits) : (
            ligneFiche('Arrivée', resa.startISO + (resa.arrivalHour?' à '+resa.arrivalHour:''))
          + ligneFiche('Départ', resa.checkout)
          + ligneFiche('Nuits', nuits)
          + ligneFiche('Voyageurs', voyageurs)
          + ligneFiche('Montant', montant)))
        + ligneFiche('Canal', canal)
        + badgeSansEmail(resa)
        + ligneFiche('Commission', resa.commission!=null ? resa.commission+' '+(resa.currency||'EUR') : null)
        + ligneFiche('Référence OTA', resa.otaCode)
        + ligneFiche('Identifiant', resa.id)

      const actions = document.getElementById('resa-actions')
      const note = document.getElementById('resa-note')
      actions.innerHTML = '<button class="btn-cancel" id="resa-fermer">Fermer</button>'

      if(modifiable){
        actions.insertAdjacentHTML('afterbegin',
          '<button class="btn-cancel" id="resa-annuler" style="color:#c0392b">Annuler la réservation</button>'
          + '<button class="btn-apply" id="resa-enregistrer">Enregistrer</button>')
        note.textContent = 'Réservation directe : modifiable depuis HôteSmart.'
      } else if(venteEnLigne && channex){
        note.textContent = 'Vendue par votre moteur de réservation et payée en ligne : '
                         + 'toute modification passe par un remboursement ou un complément.'
      } else if(resa.offline && channex){
        note.textContent = 'Réservation directe — vous n\'avez pas le droit de la modifier.'
      } else {
        // On DIT pourquoi il n'y a pas de bouton, plutot que de laisser un vide.
        note.textContent = channex
          ? 'Réservation venue de ' + canal + ' : modifiable uniquement chez ' + canal + '.'
          : 'Bien synchronisé hors HôteSmart : consultation seule.'
      }
      document.getElementById('resa-fermer').addEventListener('click', fermerFiche)
      const btnAnn = document.getElementById('resa-annuler')
      if(btnAnn) btnAnn.addEventListener('click', annulerResaCourante)
      const btnEnr = document.getElementById('resa-enregistrer')
      if(btnEnr) btnEnr.addEventListener('click', enregistrerResaCourante)
      resoudreConversation(bien, resa)
      if(modifiable) ['fiche-arrivee','fiche-depart','fiche-prix','fiche-adultes','fiche-enfants']
        .forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', rafraichirFiche) })
      if(modifiable) rafraichirFiche()
      document.getElementById('overlay-resa').classList.add('visible')
    }

    // ─── « Pas d'e-mail — messages non envoyés » ──────────────────────────────
    // ⚠ UN ETAT QUI SE VOIT, PARCE QU'IL NE SE SIGNALE PAS AUTREMENT.
    // Une réservation directe sans adresse ne reçoit RIEN : ni confirmation, ni
    // consignes d'arrivée, ni code d'accès. Le cron n'écrit alors aucune ligne de
    // journal et n'alerte pas — c'est un état, pas une panne, et une alarme qui
    // sonnerait toutes les heures sans qu'aucun geste ne la fasse taire est une
    // alarme qu'on apprend à ignorer.
    //
    // Reste donc à le MONTRER là où l'hôte regarde la réservation. Sans ce badge,
    // il découvrirait le silence le jour de l'arrivée, devant un voyageur qui
    // n'a jamais reçu son code.
    //
    // ⚠ SEULEMENT SUR LES RÉSERVATIONS SANS MESSAGERIE OTA. Une résa Airbnb n'a pas
    // d'adresse non plus — la plateforme ne la communique jamais — et ses messages
    // passent très bien par la messagerie de l'OTA. Le badge y serait faux, et un
    // badge faux apprend à ignorer les vrais.
    //
    // ⚠ « OFFLINE » N'EST PAS LE SEUL CAS, et la première version le croyait.
    // Une saisie directe côté Beds24 arrive avec `source: 'direct'` : elle n'a pas
    // davantage de fil de messagerie (`lib/canal-voyageur.js` la classe
    // `sans_canal`), elle ne reçoit rien non plus, et la fiche affichait « Canal :
    // Direct » sans le moindre avertissement. L'hôte découvrait le silence le jour
    // de l'arrivée — le scénario même que ce badge existe pour empêcher.
    // Constat de review.
    function sansMessagerieOta(resa){
      if(resa.offline) return true
      const src = String(resa.sourceBrute || resa.source || '').trim().toLowerCase()
      return src === '' || src === 'direct'
    }

    function badgeSansEmail(resa){
      if(!sansMessagerieOta(resa) || resa.aEmail) return ''
      return '<div style="margin:10px 0;padding:10px 12px;border-radius:8px;'
        + 'background:#fdf3e7;border:1px solid #e8c9a0;font-size:12px;line-height:1.55;color:#7a4b12">'
        + '<strong>Pas d\'e-mail — messages non envoyés.</strong><br>'
        + 'Cette réservation directe n\'a pas d\'adresse : ni confirmation, ni consignes '
        + 'd\'arrivée, ni code d\'accès ne peuvent partir. Transmettez-les vous-même, '
        + 'ou saisissez l\'adresse à la création pour les prochaines.'
        + '</div>'
    }

    // ─── Acces a la conversation du voyageur ─────────────────────────────────
    // La messagerie s'ouvre sur `booking_id` : c'est la cle du cœur, la meme que
    // `messages.booking_id` et que `conversations.book_id`.
    //
    // ⚠ GRISE QUAND IL N'Y A RIEN A OUVRIR, avec la raison : un bouton actif qui
    // mene a une liste vide est pire qu'un bouton eteint, l'hote croit a une
    // panne. Le cas le plus frequent est la reservation directe, ou le voyageur
    // n'a jamais ecrit par le canal.
    // Le bouton nait DESACTIVE et se resout a l'ouverture de la fiche
    // (`resoudreConversation`). Naitre actif puis s'eteindre ferait rater un clic
    // parti trop tot vers une page vide.
    function blocConversation(bien, resa){
      return '<div style="margin-bottom:14px">'
        + '<button class="btn-apply" id="resa-conversation" disabled'
        + ' style="width:100%;background:#e8e8ed;color:#86868b;cursor:progress">'
        + '&#128172; Ouvrir la conversation</button>'
        + '<div id="resa-conversation-note" style="font-size:12px;color:#86868b;margin-top:6px">Recherche du fil…</div>'
        + '</div>'
    }

    // ⚠ INTERROGE A L'OUVERTURE, UNE RESERVATION A LA FOIS. L'endpoint calendrier
    // servait ce booleen pour toute la fenetre : `messages` etant un journal, le
    // rendu depassait le plafond de 1000 lignes de PostgREST sans erreur, et des
    // fiches grisaient un bouton vers un fil bien reel.
    async function resoudreConversation(bien, resa){
      const btn = document.getElementById('resa-conversation')
      const note = document.getElementById('resa-conversation-note')
      if(!btn||!note) return
      const eteindre = (texte)=>{ btn.style.cursor='not-allowed'; note.textContent = texte }
      if(!resa.id){ eteindre('Réservation sans identifiant : aucune conversation rattachable.'); return }
      let r
      try { r = await api.messages.aUneConversation(resa.id) }
      catch(e){
        // ⚠ ON NE DIT PAS « aucun fil » QUAND ON N'A PAS PU REGARDER : ce serait
        // affirmer au sujet du voyageur quelque chose qu'on ignore.
        eteindre('Fil indisponible pour le moment — réessayez.'); return
      }
      // La fiche a pu etre fermee ou changee pendant l'appel : on ne touche que
      // si c'est toujours la meme reservation qui est a l'ecran.
      if(!resaCourante || String(resaCourante.resa.id)!==String(resa.id)) return
      if(r && r.has_conversation){
        btn.disabled=false; btn.style.background='#1f6f23'; btn.style.color='#fff'; btn.style.cursor='pointer'
        note.textContent=''
        btn.addEventListener('click', ()=>ouvrirConversation(bien, resa))
      } else {
        eteindre(resa.offline
          ? 'Aucun message : cette réservation directe n\'a pas de fil voyageur.'
          : 'Aucun message reçu pour cette réservation.')
      }
    }

    function ouvrirConversation(bien, resa){
      // `bien` accompagne `conv` : sans lui, un filtre de bien deja actif dans la
      // messagerie peut masquer la conversation visee.
      const url = '/apps/agent-ai/messagerie?conv=' + encodeURIComponent(resa.id)
        + (bien.provider_property_id ? '&bien=' + encodeURIComponent(bien.provider_property_id) : '')
      window.location.href = url
    }

    // ─── Champs modifiables (reservations « Offline » uniquement) ────────────
    // Dates, prix vendu et voyageurs. Le reste de la fiche reste en consultation :
    // le nom du client et la reference OTA ne se corrigent pas depuis un planning.
    function champsModifiables(bien, resa, nuitsActuelles){
      // ⚠ PRIX INCONNU : on laisse le champ VIDE, on n'invente pas le prix de
      // base du bien. Pre-rempli, il partait a l'enregistrement comme s'il etait
      // le prix de vente du sejour — et le repricait chez Channex alors que
      // l'hote n'y avait pas touche. Vide, le serveur garde le montant du cœur.
      const montantConnu = Number(resa.amount) > 0 && nuitsActuelles > 0
      const parNuit = montantConnu ? (Number(resa.amount)/nuitsActuelles) : ''
      const champ = (id,label,type,valeur,extra)=>
        '<div style="flex:1"><label style="font-size:12px;color:#86868b">'+label+'</label>'
        + '<input id="'+id+'" type="'+type+'" value="'+escapeHtmlLocal(valeur)+'" '+(extra||'')
        + ' style="width:100%;padding:9px;margin-top:4px;border:1px solid #d2d2d7;border-radius:8px"></div>'
      return '<div style="display:flex;gap:12px;margin-bottom:12px">'
          + champ('fiche-arrivee','Arrivée','date',resa.startISO)
          + champ('fiche-depart','Départ','date',resa.checkout)
        + '</div>'
        + '<div style="display:flex;gap:12px;margin-bottom:6px">'
          + champ('fiche-adultes','Adultes','number',resa.numAdult||1,'min="1"')
          + champ('fiche-enfants','Enfants','number',resa.numChild||0,'min="0"')
        + '</div>'
        + '<div id="fiche-alerte" style="font-size:12px;color:#c0392b;margin-bottom:8px"></div>'
        + '<div style="display:flex;gap:12px;margin-bottom:6px">'
          + champ('fiche-prix','Prix par nuit','number',
                  montantConnu ? (Math.round(parNuit*100)/100) : '',
                  'step="0.01" min="0.01" placeholder="inchangé"')
        + '</div>'
        + '<div id="fiche-total" style="background:#f5f5f7;border-radius:8px;padding:10px 12px;margin:10px 0 14px;font-size:14px"></div>'
    }

    // Nuits, total et plafond recalcules a chaque frappe. Affichage seulement :
    // le serveur refait tout le calcul et revalide la capacite.
    function rafraichirFiche(){
      if(!resaCourante) return
      const bien = resaCourante.bien
      const a = document.getElementById('fiche-arrivee'), d = document.getElementById('fiche-depart')
      const zone = document.getElementById('fiche-total'), alerte = document.getElementById('fiche-alerte')
      if(!a||!d||!zone) return
      const n = Math.round((new Date(d.value+'T00:00:00') - new Date(a.value+'T00:00:00'))/86400000)
      const prix = parseFloat(document.getElementById('fiche-prix').value)
      const adultes = parseInt(document.getElementById('fiche-adultes').value,10)||0
      const enfants = parseInt(document.getElementById('fiche-enfants').value,10)||0
      const sym = curSym(bien && bien.currency)
      if(!(n>0)) zone.innerHTML = '<span style="color:#c0392b">Le départ doit suivre l\'arrivée.</span>'
      else if(!(prix>0)){
        // ⚠ CHAMP VIDE NE VEUT PAS DIRE « MEME TOTAL ». Le serveur ne conserve le
        // montant exact du cœur que si la DUREE n'a pas bouge ; sinon il repart
        // du prix par nuit actuel. Afficher « inchangé » avec le nouveau nombre
        // de nuits faisait lire « 300 € (inchangé, 5 nuits) » a un hote qui
        // allongeait un sejour de 3 nuits — pendant que 500 € partaient chez
        // Channex et seraient factures au voyageur.
        const montant = Number(resaCourante.resa.amount)
        const nOrig = Math.round((new Date(resaCourante.resa.checkout+'T00:00:00')
                                - new Date(resaCourante.resa.startISO+'T00:00:00'))/86400000)
        if(!(montant>0) || !(nOrig>0)) zone.textContent = '—'
        else if(n===nOrig) zone.innerHTML = '<strong>Total du séjour : '+montant.toFixed(2)+' '+sym+'</strong>'
                          + ' <span style="color:#86868b">(inchangé, '+n+' nuit'+(n>1?'s':'')+')</span>'
        else {
          const parNuitActuel = montant/nOrig
          zone.innerHTML = '<strong>Total du séjour : '+(Math.round(parNuitActuel*n*100)/100).toFixed(2)+' '+sym+'</strong>'
            + ' <span style="color:#86868b">('+n+' nuit'+(n>1?'s':'')+' au tarif actuel de '
            + (Math.round(parNuitActuel*100)/100).toFixed(2)+' '+sym+'/nuit)</span>'
        }
      }
      else zone.innerHTML = '<strong>Total du séjour : '+(Math.round(prix*n*100)/100).toFixed(2)+' '+sym+'</strong>'
                          + ' <span style="color:#86868b">('+n+' nuit'+(n>1?'s':'')+')</span>'
      if(alerte){
        const personnes = adultes+enfants
        alerte.textContent = adultes<1 ? 'Il faut au moins un adulte.'
          : (personnes>bien.capacity
              ? 'Ce bien accueille '+bien.capacity+' personne'+(bien.capacity>1?'s':'')+' au maximum — vous en avez saisi '+personnes+'.'
              : '')
      }
    }

    async function annulerResaCourante(){
      if(!resaCourante) return
      const { bien, resa } = resaCourante
      if(!confirm('Annuler la réservation de '+resa.name+' du '+resa.startISO+' au '+resa.checkout+' ?\n\nLes dates seront rouvertes à la vente.')) return
      const btn = document.getElementById('resa-annuler')
      if(btn){ btn.disabled=true; btn.textContent='Annulation…' }
      try{
        // `api.reservationDirecte` : Authorization et X-Compte poses par
        // api-client, comme tous les autres appels de cette page.
        await api.reservationDirecte.annuler({
          propertyId: bien.provider_property_id, bookingId: resa.id
        })
        fermerFiche()
        // ⚠ On ne retire PAS la reservation de l'affichage : elle disparaitra
        // quand le cœur l'aura apprise par le feed. Retirer tout de suite
        // afficherait une date libre qui ne l'est pas encore cote Channex.
        showToast('Annulation envoyée — visible dans HôteSmart au prochain rafraîchissement', 6000)
      }catch(e){
        if(btn){ btn.disabled=false; btn.textContent='Annuler la réservation' }
        showToast('Erreur : '+(e.message||'annulation'), 6000)
      }
    }

    // ─── Enregistrement d'une modification (Offline uniquement) ─────────────
    // ⚠ CES CONTROLES SONT UN CONFORT, PAS UNE GARDE. Le serveur refait dates,
    // prix et plafond de voyageurs, et repasse par le verrou anti-surreservation
    // (api/reservation-directe.js, methode PUT). Les faire ici evite seulement
    // un aller-retour pour une faute de frappe.
    async function enregistrerResaCourante(){
      if(!resaCourante) return
      const { bien, resa } = resaCourante
      const arrivee = document.getElementById('fiche-arrivee').value
      const depart  = document.getElementById('fiche-depart').value
      const prix    = parseFloat(document.getElementById('fiche-prix').value)
      const adultes = parseInt(document.getElementById('fiche-adultes').value,10)||0
      const enfants = parseInt(document.getElementById('fiche-enfants').value,10)||0
      const n = Math.round((new Date(depart+'T00:00:00') - new Date(arrivee+'T00:00:00'))/86400000)
      if(!(n>0))    { showToast('Le départ doit suivre l\'arrivée', 4000); return }
      if(adultes<1) { showToast('Il faut au moins un adulte', 4000); return }
      if(adultes+enfants>bien.capacity){
        showToast('Ce bien accueille '+bien.capacity+' personne'+(bien.capacity>1?'s':'')+' au maximum', 5000); return
      }
      // ⚠ CHAMP VIDE = PRIX INCHANGE, ET ON NE L'ENVOIE PAS.
      // Envoyer un prix « reconstitue » (montant du cœur / nuits, arrondi au
      // centime) rejouait l'arrondi a chaque enregistrement : 100,00 sur 3 nuits
      // repartait a 99,99. Omis, le serveur garde le montant exact du cœur.
      const prixTouche = document.getElementById('fiche-prix').value.trim() !== ''
      if(prixTouche && !(prix>0)){ showToast('Prix par nuit invalide', 4000); return }

      const memePrix = !prixTouche
        || (Number(resa.amount) > 0 && Math.abs(prix*n - Number(resa.amount)) < 0.005)
      const rien = (arrivee===resa.startISO && depart===resa.checkout
                    && (resa.numAdult||1)===adultes && (resa.numChild||0)===enfants
                    && memePrix)
      if(rien){ showToast('Aucune modification'); return }

      const btn = document.getElementById('resa-enregistrer')
      if(btn){ btn.disabled=true; btn.textContent='Envoi…' }
      try{
        const charge = {
          propertyId: bien.provider_property_id, bookingId: resa.id,
          arrival: arrivee, departure: depart,
          occupancy: { adults: adultes, children: enfants }
        }
        // `prixParNuit` ABSENT quand l'hote n'y a pas touche : le serveur
        // distingue « pas de prix fourni » de « ce prix-la », et garde alors le
        // montant exact du cœur au lieu de le recalculer.
        if(prixTouche) charge.prixParNuit = prix
        await api.reservationDirecte.modifier(charge)
        fermerFiche()
        // ⚠ On ne redessine PAS la reservation avec les nouvelles valeurs : elle
        // reviendra par le feed, comme a la creation et a l'annulation. L'afficher
        // deja deplacee montrerait un etat que Channex n'a pas encore confirme.
        showToast('Modification envoyée — visible dans HôteSmart au prochain rafraîchissement', 6000)
      }catch(e){
        if(btn){ btn.disabled=false; btn.textContent='Enregistrer' }
        // 409 = refus METIER (nuits deja prises, sejour annule, vente du moteur,
        // saisie concurrente). On le dit dans les mots du metier, comme le fait
        // deja la creation — pas en « Erreur : » suivi d'un jargon.
        showToast(e.status===409
          ? (e.message || 'Ces dates ne sont plus disponibles.')
          : ('Erreur : '+(e.message||'modification')), 7000)
      }
    }

    function showToast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),ms||1800)}

    const COLORS_BY_SOURCE = { airbnb:'red', booking:'blue', direct:'green' }
    function rangeISO(){ return { start: toISO(days[0]), end: toISO(days[days.length-1]) } }

    function mapBien(p){
      // ⚠ `provider_property_id` EST INDISPENSABLE : c'est l'identifiant que
      // l'API de reservation directe attend. Sans lui, JSON.stringify supprime
      // la cle et le serveur repond « propertyId manquant » — creation et
      // annulation echouaient a 100 % des cas.
      return { id:p.id, name:p.name, capacity:p.capacity||1, base:Number(p.base_price)||0,
        included:p.included_guests||p.capacity||1, extraFee:Number(p.extra_guest_fee)||0,
        currency:p.currency||'EUR', provider:p.provider||'channex',
        provider_property_id:p.provider_property_id||null,
        // ⚠ LOT 4.5 — QUI ECRIT LES PRIX DE CE BIEN (spec §2 bis).
        // Sert a EXPLIQUER, jamais a garder : le refus est tenu par
        // `api/calendar.js`. Une restriction d'UI n'est pas une restriction.
        pilote:p.pilote_tarifaire==='yieldflow'?'yieldflow':'calendrier', resa:[] }
    }
    // ⚠ LA SOURCE EST CELLE DU CŒUR, PAS UNE COULEUR TIREE AU SORT.
    // L'ancienne version faisait `SRC[idx % 3]` : airbnb, booking et direct en
    // rotation par index. Les pastilles de canal du planning etaient donc
    // DECORATIVES et fausses — une reservation Airbnb pouvait s'afficher en
    // « direct ». L'endpoint sert la vraie source depuis bookings_snapshot.
    //
    // `id` : indispensable a la fiche de consultation. Sans lui, le bandeau
    // n'est qu'un rectangle et rien ne peut etre ouvert au clic.
    function familleSource(src){
      const v=String(src||'').toLowerCase()
      if(v.includes('airbnb')||v.includes('abb')) return 'airbnb'
      if(v.includes('booking')||v.includes('bdc')) return 'booking'
      // « Offline » = reservation directe creee par nous (spec reservation
      // manuelle). Elle partage la couleur du direct : c'en est une.
      if(v==='offline'||v.includes('direct')) return 'direct'
      return 'direct'
    }
    function estOffline(src){ return String(src||'').toLowerCase()==='offline' }

    function mapResa(list){
      // ⚠ `demapped` EST MASQUE COMME `cancelled` : un sejour neutralise par un
      // demappage n'occupe plus rien cote coeur (ses nuits repartent en vente).
      // Le montrer comme une reservation aurait fait lire a l'hote une
      // occupation sur des nuits disponibles.
      return (list||[]).filter(function(b){var st=String(b.status||'').toLowerCase();return st!=='cancelled'&&st!=='demapped'}).map(b=>{
        const ci=new Date(b.checkin+'T00:00:00'), co=new Date(b.checkout+'T00:00:00')
        const span=Math.max(1, Math.round((co-ci)/86400000))
        const src=familleSource(b.source)
        return {
          id: b.booking_id || null,
          startISO:b.checkin, checkout:b.checkout, span,
          name:b.guest_name||'Reservation',
          source:src, sourceBrute:b.source||null, offline:estOffline(b.source),
          color:COLORS_BY_SOURCE[src]||'green',
          amount:b.amount ?? null, currency:b.currency||null,
          commission:b.commission ?? null,
          numAdult:b.numAdult ?? null, numChild:b.numChild ?? null,
          otaCode:b.otaReservationCode||null, arrivalHour:b.arrivalHour||null,
          statut:b.status||null,
          // Sous-origine : distingue une saisie de l'hote d'une vente du moteur
          // public, toutes deux `ota_name: "Offline"`. Voir `estModifiable`.
          metaSource: b.metaSource || null,
          // Le cœur porte-t-il une adresse pour ce voyageur ? Booléen : le
          // serveur ne sert pas l'adresse elle-même pour un badge.
          aEmail: b.aEmail === true
        }
      })
    }
    // `platformLogo` a ete SUPPRIMEE de cette page : la pastille OTA n'apportait
    // aucune information que la couleur de la bulle ne donnait deja, et mangeait
    // la place du nom du voyageur — sur une bulle d'une nuit, elle le faisait
    // disparaitre entierement. La source reste lisible dans la fiche (« Canal »).
    // La grille mobile garde la sienne : elle n'affiche pas le meme contenu.

    const PREF_KEY_D='hs_cal_desktop_prefs'
    function savePrefsD(){ try{ localStorage.setItem(PREF_KEY_D, JSON.stringify({ biens:selectedBiens, months:MONTHS })) }catch(e){} }
    function loadPrefsD(){ try{ return JSON.parse(localStorage.getItem(PREF_KEY_D)||'null') }catch(e){ return null } }

    async function loadData(){
      let all=[]
      try { const r=await api.channel.listProperties(); all=r.properties||[] } catch(e){ showToast('Erreur chargement biens'); }
      BIENS = all.map(mapBien)

      // ⚠ AVANT toute sortie anticipee. Un membre dont le perimetre ne resout
      // aucun bien, ou n'importe quel hote sur un echec reseau, gardait sinon les
      // boutons d'ecriture dans le DOM et ne voyait jamais l'avis de lecture
      // seule. Ces boutons vivent dans l'en-tete, hors de #main : ils survivent
      // au remplacement ci-dessous.
      appliquerLectureSeule()

      // Aucun bien -> etat vide explicite (pas de grille blanche, pas de fausses donnees).
      if(!BIENS.length){
        const m=document.getElementById('main')
        // ⚠ « Connectez votre PMS » ne s'adresse qu'a un TITULAIRE. Un membre n'a
        // aucun PMS a connecter : son calendrier est vide parce que son perimetre
        // ne contient aucun bien, ce qui n'est pas la meme chose.
        if(m) m.innerHTML = peutEcrire('reservations')
          ? `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px 20px;color:#6e6e73">
          <div style="font-size:40px;margin-bottom:14px">&#128197;</div>
          <h2 style="font-size:17px;color:#1d1d1f;margin-bottom:8px">Votre calendrier apparaîtra ici</h2>
          <p style="font-size:14px;max-width:440px;margin-bottom:24px;line-height:1.5">Une fois votre PMS connecté, vous piloterez ici les tarifs, les disponibilités et le séjour minimum de chaque logement, avec vos réservations.</p>
          <a href="/pages/onboarding.html" style="display:inline-block;background:#007aff;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px">Connecter mon logement</a>
        </div>`
          : `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px 20px;color:#6e6e73">
          <div style="font-size:40px;margin-bottom:14px">&#128197;</div>
          <h2 style="font-size:17px;color:#1d1d1f;margin-bottom:8px">Aucun bien à afficher</h2>
          <p style="font-size:14px;max-width:440px;line-height:1.5">Aucun bien de ce compte ne vous a été attribué. Le titulaire peut élargir votre périmètre depuis ses réglages.</p>
        </div>`
        return
      }
      const prefs=loadPrefsD()
      if(prefs && prefs.months){ MONTHS=prefs.months; const ps=document.getElementById('period-select'); if(ps) ps.value=String(MONTHS); buildDays(); renderMonthPills(); renderMonthBand() }
      const editable=b=>b && b.provider!=='beds24'
      if(prefs && Array.isArray(prefs.biens) && prefs.biens.length){ selectedBiens=prefs.biens.filter(id=>{const b=BIENS.find(x=>x.id===id);return editable(b)}) }
      if(!selectedBiens.length && URL_BIEN_ID && editable(BIENS.find(b=>b.id===URL_BIEN_ID))) selectedBiens=[URL_BIEN_ID]
      if(!selectedBiens.length){ const first=BIENS.find(editable); if(first) selectedBiens=[first.id] }
      BIENS.forEach(b=>{ ppConfig[b.id]={included:b.included, extraFee:b.extraFee} })
      renderMultiSelect()
      annoncerBiensBeds24()
      await reloadInventory()
    }

    // ⚠ LECTURE SEULE VISIBLE. Un membre `reservations: read` consulte le
    // calendrier mais ne publie rien. Les boutons d'ecriture sont retires plutot
    // que desactives : un bouton grise invite a chercher pourquoi, un bouton
    // absent avec un message dit ce qu'il en est.
    function appliquerLectureSeule(){
      if(peutEcrire('reservations')) return
      LECTURE_SEULE = true
      // ⚠ On retire les BOUTONS D'ACTION, jamais `float-bar` : `showFloatBar()`
      // et `btn-clear-sel` la lisent, et sa suppression provoquait un TypeError a
      // chaque clic sur une cellule — la selection restait alors surlignee sans
      // aucun moyen de l'effacer. La selection est bloquee en amont (attachEvents).
      for(const id of ['btn-open-popup','btn-undo']){
        const el=document.getElementById(id); if(el) el.remove()
      }
      const z=document.getElementById('avis-lecture')
      if(z){ z.textContent='Lecture seule : vous ne pouvez pas modifier les prix ni les disponibilités de ce compte.'; z.style.display='block' }
    }

    // ⚠ LIMITE PRODUIT ASSUMEE, rendue EXPLICITE.
    // Les prix et disponibilites d'un bien Beds24 se pilotent DANS Beds24 :
    // HoteSmart n'y pousse pas d'ARI (voir docs/kb/menage.md et le calendrier).
    // Jusqu'ici, la seule mention vivait dans le selecteur multiple — il fallait
    // l'ouvrir pour la voir. Un hote 100 % Beds24 arrivait donc sur un calendrier
    // vide sans explication, et un membre dont le perimetre ne contient que du
    // Beds24 encore plus : lui ne peut meme pas changer de bien.
    function annoncerBiensBeds24(){
      const zone = document.getElementById('avis-beds24')
      if(!zone) return
      const beds24 = BIENS.filter(b => b.provider === 'beds24')
      if(!beds24.length){ zone.style.display='none'; return }

      const noms = beds24.map(b => b.name).join(', ')
      const aucunPilotable = !BIENS.some(b => b.provider !== 'beds24')
      zone.innerHTML = aucunPilotable
        ? `<strong>Aucun bien pilotable ici.</strong> ${escapeHtmlLocal(noms)} ${beds24.length > 1 ? 'sont gérés' : 'est géré'} dans Beds24 :
           leurs prix et disponibilités se modifient directement depuis Beds24, pas depuis HôteSmart.`
        : `${escapeHtmlLocal(noms)} ${beds24.length > 1 ? 'sont gérés' : 'est géré'} dans Beds24 :
           ${beds24.length > 1 ? 'leurs prix et disponibilités se modifient' : 'ses prix et disponibilités se modifient'}
           directement depuis Beds24. Les autres biens restent pilotables ici.`
      zone.style.display='block'
    }

    function escapeHtmlLocal(v){ return String(v==null?'':v).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

    // ⚠ UNE REPONSE EN RETARD NE REPEINT PAS UNE FENETRE QU'ON A QUITTEE.
    // Les fleches de navigation ne se desactivent pas pendant le chargement :
    // deux clics rapides lancent deux lectures, et rien ne garantissait leur
    // ordre d'arrivee. Si celle de -30 revenait apres celle de -60, elle
    // ecrasait `invByBien` et les reservations, puis `renderBlocks` reconstruisait
    // l'etat contre les `days` de -60 : dates absentes retombant au prix de base,
    // barres de reservation d'une autre plage. L'hote lisait de faux tarifs.
    let lectureEnCours=0
    async function reloadInventory(){
      if(!selectedBiens.length){ renderBlocks(); return }
      const monTour=++lectureEnCours
      const {start,end}=rangeISO()
      try{
        const {inv,pp,propsById,bookings,fermetures}=await loadCalendarData(selectedBiens, start, end)
        if(monTour!==lectureEnCours) return   // une lecture plus recente a pris la main
        ;(selectedBiens).forEach(id=>{ invByBien[id]=inv[id]; fermByBien[id]=(fermetures&&fermetures[id])||[] })
        if(bookings){ BIENS.forEach(b=>{ if(bookings[b.id]) b.resa=mapResa(bookings[b.id]) }) }
        for(const id in pp){ ppConfig[id]=pp[id]
          const bb=BIENS.find(x=>x.id===id); if(bb){ bb.base=propsById[id].base||bb.base; bb.included=pp[id].included; bb.extraFee=pp[id].extraFee } }
      }catch(e){
        if(monTour!==lectureEnCours) return
        showToast('Erreur chargement calendrier')
      }
      Object.keys(states).forEach(k=>delete states[k])
      renderBlocks()
    }

    buildDays(); renderMonthPills(); renderMonthBand()
    await loadData()
  </script>
</body>
