<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HôteSmart — Calendrier</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    /* CSS spécifique au calendrier (conservé tel quel, ne dépend pas de style.css) */
    .cal-page * { box-sizing: border-box; }
    .cal-page { -webkit-user-select: none; user-select: none; }
    .cal-controls { background: var(--bg); padding: 14px 20px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 20; }
    .cal-controls .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: #f0f0f0; border: 1px solid #e5e5e7; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; color: #1d1d1f; }
    .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .toggle { display: inline-flex; background: #f0f0f0; border-radius: 8px; padding: 3px; }
    .toggle button { background: transparent; border: none; padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 6px; color: #6e6e73; font-weight: 500; }
    .toggle button.active { background: #fff; color: #1d1d1f; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .multi-select { position: relative; }
    .multi-select .ms-trigger { padding: 7px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; min-width: 190px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .multi-select .ms-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid #d2d2d7; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); min-width: 250px; max-height: 320px; overflow-y: auto; z-index: 30; padding: 6px; }
    .multi-select.open .ms-panel { display: block; }
    .multi-select .ms-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; color:#1d1d1f; }
    .multi-select .ms-option:hover { background: #f5f5f7; }
    .period-select { padding: 7px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; background: #fff; font-family: inherit; color:#1d1d1f; }
    .nav-periode { display: inline-flex; align-items: center; gap: 6px; }
    /* « Aujourd'hui » porte un mot, pas un signe : il lui faut sa largeur. */
    .nav-periode #btn-aujourdhui { width: auto; padding: 0 12px; font-size: 13px; font-weight: 500; }
    /* ⚠ LE BAS DE PAGE ETAIT INACCESSIBLE A PARTIR DE 3-4 BIENS.
       `.layout` est `height:100vh; overflow:hidden` et `.main` est
       `overflow:hidden` (public/style.css) : dans ce gabarit, SEUL `.content`
       porte `flex:1; overflow-y:auto`. Cette page utilise `.cal-main` a la
       place et n'avait ni l'un ni l'autre — tout ce qui depassait la hauteur de
       l'ecran etait donc coupe, sans barre de defilement pour y acceder.
       `min-height:0` est OBLIGATOIRE : sans lui, un enfant flex refuse de
       descendre sous la hauteur de son contenu et le debordement revient. */
    .cal-main { padding: 16px; display: flex; flex-direction: column; gap: 12px; color:#1d1d1f;
                flex: 1; min-height: 0; overflow: hidden; }
    .month-pills { flex-shrink: 0; }
    .month-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .month-pill { background: #fff; border: 1px solid #d2d2d7; border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer; color: #1d1d1f; font-weight: 500; text-transform: capitalize; }
    .month-pill:hover { background: #eef4ff; border-color: #007aff; }
    .month-pill.active { background: #007aff; color: #fff; border-color: #007aff; }
    .scroll-shell { background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden;
                    flex: 1; min-height: 0; display: flex; }
    /* ⚠ UN SEUL CONTENEUR DE DEFILEMENT, POUR LES DEUX AXES.
       `overflow-x:auto` seul ne suffisait pas : quand un axe vaut `auto`, CSS
       force l'autre a `auto` aussi. `.scroll-area` devenait donc un conteneur
       de defilement VERTICAL sans hauteur bornee — les en-tetes collants s'y
       seraient ancres au lieu de suivre la page. On borne ici, et tout le
       `position: sticky` ci-dessous s'y refere. */
    .scroll-area { overflow: auto; flex: 1; min-height: 0; min-width: 0; }
    /* Le dernier bien ne doit pas rester sous la barre d'action flottante. */
    #blocks { padding-bottom: 96px; }
    /* ─── EN-TETES COLLANTS ────────────────────────────────────────────────
       Deux etages, dans cet ordre de haut en bas :
         0px            la bande des mois (hauteur BANDE_H)
         BANDE_H        la ligne des jours du bien en cours
       Le second se cale SOUS le premier — d'ou le `top` non nul. Avec plusieurs
       biens, la ligne de jours de chacun prend la place de la precedente quand
       on l'atteint : c'est le comportement attendu d'un planning multi-biens.
       ⚠ Un en-tete collant DOIT porter un fond opaque, sinon le contenu defile
       visiblement dessous. Week-end et jour courant restent prioritaires (leur
       selecteur est plus specifique, et `.today` porte `!important`). */
    .cal-page { --bande-h: 27px; }
    #month-band-wrap { position: sticky; top: 0; z-index: 8; background: #fff; width: max-content; min-width: 100%; }
    table.month-band { border-collapse: collapse; table-layout: fixed; }
    table.month-band td { height: 26px; font-size: 12px; font-weight: 700; color: #1d1d1f; text-align: left; padding-left: 8px; white-space: nowrap; border-bottom: 1px solid #e5e5e7; text-transform: capitalize; background: #fff; }
    table.month-band td.month-start { border-left: 2px solid #007aff; }
    /* L'angle cumule les deux : colle a gauche ET fait partie de la bande. */
    table.month-band .corner { width: 120px; min-width: 120px; position: sticky; left: 0; background: #fff; z-index: 9; border-bottom: 1px solid #e5e5e7; }
    .bien-section { padding: 0 0 16px; margin-bottom: 4px; }
    .bien-section:not(:last-child) { border-bottom: 3px solid #eef0f3; }
    table.cal .row-label.bien-head { font-size: 14px; font-weight: 700; color: #1d1d1f; border-left: 4px solid #007aff; vertical-align: middle; line-height: 1.2; }
    table.cal .row-label.bien-head .cap-h { display: block; font-size: 10px; font-weight: 400; color: #86868b; margin-top: 2px; }
    .bien-section { padding-top: 18px; }
    /* `.bien-title` a ete supprime : plus aucun element ne le portait (le nom du
       bien vit dans `.bien-head`, dans le thead). Son `z-index: 6` serait passe
       AU-DESSUS de la ligne de jours desormais collante (z-index 3) — du CSS mort
       qui attendait de devenir un defaut.
    table.cal { border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    /* Colonne elargie (34 -> 46px) et lignes plus hautes : sans cela, une bulle
       d'une nuit n'affiche aucun nom. Doit rester d'accord avec CELL_W
       (shared/calendar-core.js), qui sert au calcul du nombre de jours. */
    table.cal th, table.cal td { padding: 11px 1px; text-align: center; white-space: nowrap; width: 46px; min-width: 46px; }
    /* Ligne des jours : collee sous la bande des mois. Fond opaque obligatoire. */
    /* ⚠ `box-shadow` ET NON `border-bottom` : sous `border-collapse: collapse`, la
       bordure appartient au TABLEAU et non a la cellule — une cellule collante ne
       l'emporte pas avec elle, et le trait de separation disparaissait des que la
       ligne de jours se figeait. */
    table.cal thead th { box-shadow: inset 0 -1px 0 #e5e5e7; background: #fff;
                         position: sticky; top: var(--bande-h); z-index: 3; }
    /* ⚠ z-index 3, pas 2 : les bulles de reservation portent z-index 2 et vivent
       toutes dans la PREMIERE cellule, juste a droite de cette colonne figee.
       A egalite, c'est le dernier dans le DOM qui gagne — la bulle passait donc
       PAR-DESSUS le libelle des que l'on defilait horizontalement. */
    table.cal .row-label { text-align: left; padding-left: 8px; font-size: 11px; color: #6e6e73; width: 120px; min-width: 120px; background: #fff; position: sticky; left: 0; z-index: 3; border-right: 1px solid #e5e5e7; font-weight: 500; }
    /* L'angle du bien cumule les deux ancrages : gauche ET haut. */
    table.cal thead .row-label { z-index: 6; top: var(--bande-h); }
    table.cal .day-num { font-weight: 600; font-size: 12px; color: #1d1d1f; }
    table.cal .day-name { font-size: 9px; color: #86868b; text-transform: uppercase; }
    /* WEEK-ENDS — lisibles d'un coup d'œil sur un mois entier.
       L'ancien rgba(0,0,0,0.022) etait invisible au-dela de quelques colonnes :
       reperer un samedi imposait de lire les en-tetes un a un. Fond de colonne
       franc + en-tete en gras colore, les deux ensemble (le fond seul se perd
       sous les cellules colorees, l'en-tete seul ne marque pas la colonne). */
    table.cal .weekend { background: #eef1f6; }
    table.cal thead th.weekend { background: #e3e9f2; }
    table.cal thead th.weekend .day-name { color: #3a6ea5; font-weight: 700; }
    table.cal thead th.weekend .day-num  { color: #1f4e79; font-weight: 700; }
    /* Liseres lateraux : ils dessinent le bloc samedi-dimanche comme une unite. */
    table.cal .weekend.we-debut { box-shadow: inset 2px 0 0 #c3d0e2; }
    table.cal .weekend.we-fin   { box-shadow: inset -2px 0 0 #c3d0e2; }
    table.cal .weekend.we-debut.we-fin { box-shadow: inset 2px 0 0 #c3d0e2, inset -2px 0 0 #c3d0e2; }
    table.cal .month-start { border-left: 2px solid #007aff; }
    table.cal .today { background: #e6f0ff !important; box-shadow: inset 2px 0 0 #007aff, inset -2px 0 0 #007aff; }
    /* ⚠ `box-shadow` NE SE CUMULE PAS ENTRE REGLES : la derniere gagne en entier.
       Les cellules d'en-tete qui portent deja une ombre (week-end, jour courant)
       perdraient donc le trait de separation du bas — on le rajoute a leur
       declaration plutot que de compter sur une superposition qui n'existe pas. */
    table.cal thead th.weekend.we-debut { box-shadow: inset 2px 0 0 #c3d0e2, inset 0 -1px 0 #e5e5e7; }
    table.cal thead th.weekend.we-fin   { box-shadow: inset -2px 0 0 #c3d0e2, inset 0 -1px 0 #e5e5e7; }
    table.cal thead th.weekend.we-debut.we-fin { box-shadow: inset 2px 0 0 #c3d0e2, inset -2px 0 0 #c3d0e2, inset 0 -1px 0 #e5e5e7; }
    table.cal thead th.today { box-shadow: inset 2px 0 0 #007aff, inset -2px 0 0 #007aff, inset 0 -1px 0 #e5e5e7; }
    table.cal td.edit-cell { cursor: pointer; position: relative; }
    table.cal td.edit-cell:hover { background: #eef4ff; }
    /* Jour revolu : consultable, pas modifiable. Le curseur le dit avant le clic. */
    table.cal td.jour-passe { color: #a1a1a6; cursor: default; }
    table.cal td.edit-cell.selected { background: #d4e4ff !important; box-shadow: inset 0 0 0 1px #007aff; }
    table.cal td.rate-cell { font-weight: 600; }
    table.cal td.maxrate-cell { font-weight: 500; color: #6e6e73; }
    table.cal td.modified::after { content: ''; position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; background: #f59e0b; border-radius: 50%; }
    .rate-input { width: 100%; border: none; background: #fff; text-align: center; font-size: 12px; font-weight: 600; font-family: inherit; padding: 3px 0; outline: 2px solid #007aff; border-radius: 3px; }
    table.cal .resa-cell { position: relative; padding: 0 !important; height: 36px; }
    .resa-bar { position: absolute; top: 4px; bottom: 4px; color: white; font-size: 11px; font-weight: 600; display: flex; align-items: center; padding: 0 9px; white-space: nowrap; overflow: hidden; border-radius: 14px; }
    /* ⚠ LE NOM EST TRONQUE PAR LE CSS, PAS PAR LE JS.
       Une coupe a 16 caracteres ne sait rien de la largeur reelle : elle
       amputait « Marie-Christine » sur une bulle de dix nuits qui avait la place,
       et debordait sur une bulle d'une nuit qui ne l'avait pas. L'ellipse suit la
       place disponible ; le nom complet reste dans `title`.
       `min-width:0` est OBLIGATOIRE — sans lui, un enfant flex refuse de
       retrecir sous sa largeur de contenu et l'ellipse ne se declenche jamais. */
    .resa-bar .nom { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
    /* Sejour coupe par le bord de la fenetre : bord droit, pas arrondi — l'arrondi
       ferait lire « le sejour s'arrete ici » alors qu'il continue hors ecran.
       Meme convention que la grille mobile. */
    .resa-bar.cont-left  { border-top-left-radius: 0; border-bottom-left-radius: 0; padding-left: 8px; }
    .resa-bar.cont-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .resa-bar.blue { background: #0d4ea6; } .resa-bar.green { background: #1f6f23; } .resa-bar.red { background: #d52a44; }
    .resa-bar.airbnb { background: #d52a44; } .resa-bar.booking { background: #0d4ea6; } .resa-bar.direct { background: #1f6f23; }
    .resa-bar.cliquable { cursor: pointer; }
    /* Sejour termine : recule visuellement sans disparaitre. Le survol le
       ramene a pleine opacite — on doit pouvoir le lire pour le consulter. */
    .resa-bar.passee { opacity: 0.45; }
    .resa-bar.passee:hover { opacity: 0.9; }
    .resa-bar.cliquable:hover { filter: brightness(1.15); box-shadow: 0 0 0 2px rgba(255,255,255,0.6) inset; }
    td.cell-closed { background: #ffeced !important; }
    /* FERME A LA VENTE — hachures grises sur toute la colonne du bien.
       `stop_sell` est une INTENTION memorisee de l'hote (docs/kb/reservation-directe.md
       §8) : elle doit se voir sur toutes les lignes, pas seulement sur le tarif,
       sans quoi un bien ferme se lit comme un bien simplement vide.
       Les hachures, et non un aplat : un aplat gris se confondrait avec une
       cellule desactivee, alors que la fermeture est une decision, pas une
       absence. `background-image` laisse la couleur de fond (reservee, du jour,
       week-end) visible dessous au lieu de l'ecraser. */
    table.cal td.jour-ferme, table.cal th.jour-ferme {
      background-image: repeating-linear-gradient(135deg,
        rgba(110,110,115,0.26) 0, rgba(110,110,115,0.26) 2px,
        transparent 2px, transparent 6px);
    }
    table.cal td.jour-ferme.rate-cell { color: #6e6e73; text-decoration: line-through; }
    /* Les fermetures de l'hote (lot 4.6.2) : sous la grille du bien, la periode
       et sa raison — ce que la memoire ligne a ligne ne sait pas dire. */
    .fermetures-liste { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 6px 8px 10px 120px; font-size: 12px; color: #6e6e73; }
    .fermetures-liste .fermeture { display: inline-flex; align-items: center; gap: 6px; background: #fff3f3; border: 1px solid #f3c9c9; border-radius: 8px; padding: 3px 8px; color: #1d1d1f; }
    .fermetures-liste .fermeture .raison { color: #6e6e73; font-style: italic; }
    .fermetures-liste .fermeture-retirer { border: none; background: transparent; color: #007aff; cursor: pointer; font-size: 12px; font-weight: 600; padding: 0 2px; }
    td.cell-reserved { background: #dde7f5 !important; }
    .float-bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(140%); background: #1d1d1f; color: #fff; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); transition: transform 0.22s ease; z-index: 50; max-width: calc(100% - 32px); }
    .float-bar.visible { transform: translateX(-50%) translateY(0); }
    .float-bar .sel-info { font-size: 13px; } .float-bar .sel-info strong { font-weight: 600; }
    .float-bar button { border: none; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .float-bar .btn-params { background: #007aff; color: #fff; }
    .float-bar .btn-clear { background: transparent; color: #a1a1a6; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .overlay.visible { display: flex; }
    .popup-lg { background: #fff; border-radius: 16px; width: 100%; max-width: 740px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; color:#1d1d1f; }
    .popup-head { padding: 20px 24px 14px; border-bottom: 1px solid #f0f0f0; }
    .popup-head h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
    .range-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .range-row input[type=date] { padding: 7px 10px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 13px; font-family: inherit; }
    .popup-body { display: flex; flex: 1; min-height: 300px; overflow: hidden; }
    .popup-menu { width: 185px; min-width: 185px; border-right: 1px solid #f0f0f0; overflow-y: auto; padding: 8px; }
    .popup-menu .mi { padding: 9px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; color: #1d1d1f; margin-bottom: 2px; }
    .popup-menu .mi:hover { background: #f5f5f7; }
    .popup-menu .mi.active { background: #007aff; color: #fff; font-weight: 600; }
    .popup-menu .mi.config-dot::after { content: '\2022'; color: #f59e0b; margin-left: 6px; font-size: 16px; }
    .popup-menu .mi.active.config-dot::after { color: #fff; }
    .popup-menu .mi-sep { border-top: 1px solid #f0f0f0; margin: 8px 4px; }
    .popup-content { flex: 1; padding: 20px 24px; overflow-y: auto; }
    .popup-content h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .popup-content .desc { font-size: 12px; color: #86868b; margin-bottom: 16px; line-height: 1.5; }
    .dow-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .dow-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .dow-chip input { margin: 0; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .field input[type=number], .field select { width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 15px; font-family: inherit; }
    .seg { display: inline-flex; border: 1px solid #d2d2d7; border-radius: 8px; overflow: hidden; }
    .seg button { background: #fff; border: none; padding: 8px 14px; font-size: 14px; cursor: pointer; border-right: 1px solid #d2d2d7; font-weight: 500; color: #6e6e73; }
    .seg button:last-child { border-right: none; }
    .seg button.active { background: #007aff; color: #fff; }
    .preview-box { background: #f0f9ff; border: 1px solid #cce4ff; border-radius: 8px; padding: 12px; font-size: 13px; color: #0d4ea6; line-height: 1.6; margin-top: 12px; }
    .display-list { display: flex; flex-direction: column; gap: 4px; }
    .display-list label { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .display-list label:hover { background: #f5f5f7; }
    .popup-foot { padding: 14px 24px; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .popup-foot .hint { font-size: 12px; color: #86868b; }
    .btn-cancel { background: #f0f0f0; color: #1d1d1f; border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-apply { background: #007aff; color: #fff; border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1f6f23; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: all 0.25s; z-index: 200; }
    .toast.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main cal-page">
    <div class="topbar">
      <div>
        <div class="page-title">📅 Calendrier</div>
        <div class="page-sub"><a href="/biens" style="color:var(--green);text-decoration:none">← Retour à Mes biens</a></div>
      </div>
    </div>

    <div class="cal-controls">
      <div class="left">
        <div class="multi-select" id="multi-select">
          <div class="ms-trigger" id="ms-trigger"><span id="ms-label">Choisir des biens</span><span>&#9662;</span></div>
          <div class="ms-panel" id="ms-panel"></div>
        </div>
        <select class="period-select" id="period-select"><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">1 an</option></select>
        <!-- Navigation dans le temps. La grille demarrait a AUJOURD'HUI sans
             aucun moyen de reculer : les sejours passes etaient hors d'atteinte,
             alors qu'on les consulte pour un litige ou une facture. -->
        <div class="nav-periode">
          <button class="icon-btn" id="btn-passe" title="Mois précédent">&#8249;</button>
          <button class="icon-btn" id="btn-aujourdhui" title="Revenir à aujourd'hui">Aujourd'hui</button>
          <button class="icon-btn" id="btn-futur" title="Mois suivant">&#8250;</button>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-undo" title="Annuler" disabled>&#8634;</button>
        <div class="toggle"><button id="btn-simple" class="active">Simplifiee</button><button id="btn-complete">Complete</button></div>
      </div>
    </div>

    <!-- Limite produit : les biens Beds24 ne se pilotent pas ici. Message rempli
         par annoncerBiensBeds24(), masque quand le compte n'a aucun bien Beds24. -->

  <!-- FICHE D'UNE RESERVATION — consultation, et actions si elle est Offline.

  <!-- FORMULAIRE D'AJOUT — pre-rempli depuis la selection et l'inventaire. -->

  <div class="toast" id="toast">Modifications enregistrees</div>

  <script type="module">
    import { requireAuth }   from '/components/auth-guard.js'
    import { renderSidebar } from '/components/sidebar.js'
    import { api } from '/shared/api-client.js'
    import { peutEcrire } from '/shared/compte-courant.js'
    import { PARAMS, ROW_DEFAULTS, CELL_W, dayNames, dowOrder, dowLabels, monthShort, monthFull, toISO, fmtShort, curSym, computeDays, buildStateFromInventory, configuredRowParams, loadCalendarData } from '/shared/calendar-core.js'

    // Sur mobile : bascule vers la version tactile (PWA), en conservant l'ID du bien.
    if (window.innerWidth <= 768) {
      const m = window.location.pathname.match(/\/biens\/([^/]+)\/calendrier/)
      const bid = m ? m[1] : ''
      window.location.replace('/m/calendrier' + (bid ? '?bien=' + encodeURIComponent(bid) : ''))
    }

    const session = await requireAuth()
    if (!session) throw new Error('Non authentifié')
    await renderSidebar('biens-calendrier')

    // id du bien depuis l'URL /biens/:id/calendrier
    function bienIdFromUrl(){
      const m = window.location.pathname.match(/\/biens\/([^/]+)\/calendrier/)
      return m ? decodeURIComponent(m[1]) : null
    }
    const URL_BIEN_ID = bienIdFromUrl()

    // PARAMS / ROW_DEFAULTS : deplaces verbatim dans shared/calendar-core.js.
    let pinnedSimple = new Set()

    let MONTHS=1, days=[]
    // Constantes dates (dayNames..CELL_W) : deplacees verbatim dans shared/calendar-core.js.

    // Depart de la grille, en jours par rapport a aujourd'hui. Negatif = passe.
    // ⚠ NON PERSISTE, volontairement : rouvrir le calendrier doit ramener sur
    // aujourd'hui. Un hote qui retrouverait sa fenetre trois mois en arriere sans
    // s'en apercevoir lirait un planning « vide » et le croirait casse.
    let DECALAGE=0
    // ⚠ RELU AUSSI AU RETOUR SUR L'ONGLET, pas seulement a la construction.
    // Ce commentaire promettait qu'un onglet laisse ouvert toute la nuit
    // repererait le bon jour au matin — c'etait faux : `buildDays` ne tourne
    // qu'au chargement, au changement de periode et a la navigation. Passe
    // minuit, le repere bleu restait sur la veille, et `jourPasse` tenait hier
    // pour modifiable — precisement la garde qu'on vient d'ajouter.
    let ISO_AUJOURDHUI=toISO(new Date())

    // Le jour a-t-il change depuis le dernier rendu ? Si oui, on redessine :
    // seuls le repere du jour et les bulles grisees en dependent, un rendu
    // suffit — inutile de relire l'inventaire, la plage n'a pas bouge.
    function verifierChangementDeJour(){
      const maintenant=toISO(new Date())
      if(maintenant===ISO_AUJOURDHUI) return
      ISO_AUJOURDHUI=maintenant
      renderBlocks()
    }
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) verifierChangementDeJour() })
    window.addEventListener('focus', verifierChangementDeJour)

    function buildDays(){
      // Largeur dispo lue au DOM (specifique desktop), puis calcul PUR dans le coeur.
      // Fallback identique a l'ancien code : si le DOM echoue, containerW null -> pas de fit.
      let containerW=null
      try{
        const main=document.getElementById('main')
        containerW = (main && main.clientWidth) ? main.clientWidth : ((window.innerWidth||1200)-260)
      }catch(e){}
      ISO_AUJOURDHUI=toISO(new Date())
      days=computeDays(MONTHS, containerW, DECALAGE)
      majBoutonsPeriode()
    }
    function isMonthStart(i){ return i===0||days[i].getDate()===1 }
    // ⚠ COMPARAISON DE DATES, plus `i===0`. Le jour 0 de la grille n'est
    // aujourd'hui que tant qu'on ne navigue pas : des le premier pas dans le
    // passe, l'ancien test peignait le repere bleu sur une date quelconque.
    function isToday(i){ return toISO(days[i])===ISO_AUJOURDHUI }
    // Un sejour est TERMINE quand sa nuit de depart est passee ou en cours :
    // la nuit du depart n'est pas occupee (regle des nuits, KB §3).
    function resaPassee(bk){ return bk.checkout <= ISO_AUJOURDHUI }
    // ⚠ UN JOUR REVOLU NE S'EDITE PAS, et c'est la contrepartie de la navigation.
    // Avant celle-ci, le passe etait hors d'atteinte : aucune cellule passee ne
    // pouvait etre selectionnee. Maintenant qu'on peut y aller, une selection
    // tiree un peu trop loin pousserait des tarifs sur des nuits deja vendues ou
    // ecoulees — vers le canal, pour rien. On y regarde, on n'y ecrit pas.
    function jourPasse(i){ return toISO(days[i]) < ISO_AUJOURDHUI }

    let BIENS=[]
    const ppConfig={}
    const invByBien={}

    const states={}
    function initState(b){ states[b.id]=buildStateFromInventory(days, invByBien[b.id]||{}, b.base) }
    // Les fermetures de l'hote (lot 4.6.2), par bien, telles que le cœur les rend.
    // ⚠ AFFICHAGE SEULEMENT : la vendabilite d'une nuit se lit dans `states`
    // (calendar_inventory), jamais ici. Une nuit fermee sans fermeture est
    // simplement fermee ; une fermeture porte en plus le POURQUOI.
    const fermByBien={}
    function raisonFermeture(bienId, iso){
      const f=(fermByBien[bienId]||[]).find(x=>iso>=x.date_debut && iso<=x.date_fin)
      return f ? f.raison : null
    }
    const fmtJourFr=(iso)=>{ const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y.slice(2) }
    function echapper(t){ return String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

    function maxRateOf(bien, dayRate){ const cfg=ppConfig[bien.id]||{included:bien.included,extraFee:bien.extraFee}; const extra=Math.max(0, bien.capacity-cfg.included); return dayRate + extra*(cfg.extraFee||0) }
    // configuredRowParams : deplace dans shared/calendar-core.js (appele avec selectedBiens, states).

    let sel={bienId:null, idx:new Set(), row:'rate'}
    const undoStack=[]
    function pushUndo(bid){ undoStack.push({bid,snap:JSON.stringify(states[bid]),pp:JSON.stringify(ppConfig[bid])}); document.getElementById('btn-undo').disabled=false }
    function doUndo(){ if(!undoStack.length)return; const u=undoStack.pop(); states[u.bid]=JSON.parse(u.snap); ppConfig[u.bid]=JSON.parse(u.pp); if(!undoStack.length)document.getElementById('btn-undo').disabled=true; renderBlocks(); showToast('Action annulee') }

    let selectedBiens=[]
    function renderMultiSelect(){ const p=document.getElementById('ms-panel'); p.innerHTML=''; BIENS.forEach(b=>{const o=document.createElement('label');o.className='ms-option';if(b.provider==='beds24'){o.style.opacity='0.5';o.style.cursor='not-allowed';o.innerHTML='<input type="checkbox" disabled/> '+b.name+' <span style="color:#86868b;font-size:11px">(gere dans Beds24)</span>';p.appendChild(o);return}o.innerHTML='<input type="checkbox" value="'+b.id+'" '+(selectedBiens.includes(b.id)?'checked':'')+'/> '+b.name+' <span style="color:#86868b;font-size:12px">(cap. '+b.capacity+')</span>';o.querySelector('input').addEventListener('change',async e=>{if(e.target.checked){if(!selectedBiens.includes(b.id))selectedBiens.push(b.id)}else{selectedBiens=selectedBiens.filter(x=>x!==b.id)}updateMsLabel();savePrefsD();await reloadInventory()});p.appendChild(o)});updateMsLabel() }
    function updateMsLabel(){ const l=document.getElementById('ms-label'); if(!selectedBiens.length)l.textContent='Choisir des biens'; else if(selectedBiens.length===1){const b=BIENS.find(x=>x.id===selectedBiens[0]);l.textContent=b?b.name:'1 bien'}else l.textContent=selectedBiens.length+' biens' }
    document.getElementById('ms-trigger').addEventListener('click',()=>document.getElementById('multi-select').classList.toggle('open'))
    document.addEventListener('click',e=>{const ms=document.getElementById('multi-select');if(!ms.contains(e.target))ms.classList.remove('open')})

    function renderMonthPills(){ const w=document.getElementById('month-pills');w.innerHTML='';const seen=new Set();days.forEach((d,idx)=>{const k=d.getFullYear()+'-'+d.getMonth();if(!seen.has(k)){seen.add(k);const p=document.createElement('button');p.className='month-pill';p.textContent=monthFull[d.getMonth()];p.addEventListener('click',()=>{document.getElementById('scroll-area').scrollTo({left:idx*CELL_W,behavior:'smooth'});w.querySelectorAll('.month-pill').forEach(x=>x.classList.remove('active'));p.classList.add('active')});w.appendChild(p)}});const f=w.querySelector('.month-pill');if(f)f.classList.add('active') }
    function renderMonthBand(){ const w=document.getElementById('month-band-wrap');let h='<table class="month-band"><tr><td class="corner"></td>';let i=0;while(i<days.length){const m=days[i].getMonth();let span=0;while(i+span<days.length&&days[i+span].getMonth()===m)span++;h+='<td colspan="'+span+'" class="month-start" style="width:'+(span*CELL_W)+'px;min-width:'+(span*CELL_W)+'px">'+monthFull[m]+' '+days[i].getFullYear()+'</td>';i+=span}h+='</tr></table>';w.innerHTML=h }

    const blocksEl=document.getElementById('blocks')
    let showComplete=false
    const paramLabel=(k)=>(PARAMS.find(p=>p.key===k)||{}).label||k

    // curSym : deplace verbatim dans shared/calendar-core.js.
    function cellDisplay(param,s,bien){
      switch(param){
        // « — » quand aucun tarif n'est defini : la nuit est fermee faute de
        // prix, elle n'est pas a vendre a zero.
        case 'rate': return s.rate == null ? '—' : (s.rate+curSym(bien.currency))
        case 'maxRate': return maxRateOf(bien,s.rate)+curSym(bien.currency)
        case 'avail': return s.avail==='closed'?'<span style="color:#d52a44">Ferme</span>':'<span style="color:#d2d2d7">.</span>'
        case 'minStayArr': return s.minStayArr>0?'<span style="color:#6e6e73">&#127769;'+s.minStayArr+'</span>':'<span style="color:#d2d2d7">.</span>'
        case 'minStayThrough': return s.minStayThrough>0?'<span style="color:#6e6e73">'+s.minStayThrough+'</span>':'<span style="color:#d2d2d7">.</span>'
        case 'maxStay': return s.maxStay>0?'<span style="color:#6e6e73">'+s.maxStay+'</span>':'<span style="color:#d2d2d7">.</span>'
        case 'cta': return s.cta==='closed'?'<span style="color:#d52a44;font-size:13px">&#10060;</span>':'<span style="color:#d2d2d7">.</span>'
        case 'ctd': return s.ctd==='closed'?'<span style="color:#ff9500;font-size:13px">&#9938;</span>':'<span style="color:#d2d2d7">.</span>'
        case 'stopSell': return s.stopSell==='closed'?'<span style="color:#d52a44">Stop</span>':'<span style="color:#d2d2d7">.</span>'
      } return ''
    }

    function visibleRows(bien){
      const rows=['rate']
      const configured=configuredRowParams(selectedBiens, states)
      if(showComplete || pinnedSimple.has('maxRate')) rows.push('maxRate')
      PARAMS.forEach(p=>{
        if(p.key==='rate'||p.key==='perPerson')return
        const show = showComplete ? (configured.has(p.key)||pinnedSimple.has(p.key)) : pinnedSimple.has(p.key)
        if(show)rows.push(p.key)
      })
      return rows
    }

    function renderBlocks(){ blocksEl.innerHTML=''; selectedBiens.forEach(bid=>{const b=BIENS.find(x=>x.id===bid);if(!b)return;if(!states[bid]||states[bid].length!==days.length)initState(b);blocksEl.appendChild(renderBienBlock(b))}); attachEvents() }

    // Classes communes a l'en-tete et a toutes les lignes d'un meme jour.
    // Les trois rendus les recopiaient : un marquage ajoute a l'un (le week-end,
    // justement) manquait aux deux autres et la colonne se lisait de travers.
    // `we-debut` / `we-fin` dessinent samedi-dimanche comme un bloc encadre.
    function classesJour(i){
      const j=days[i].getDay(), c=[]
      if(j===6) c.push('weekend','we-debut')
      else if(j===0) c.push('weekend','we-fin')
      if(isToday(i)) c.push('today')
      if(isMonthStart(i)) c.push('month-start')
      return c
    }

    // ─── Geometrie des bulles de reservation ────────────────────────────────
    // RENDU CHANNEL MANAGER : une resa du 15 au 16 part du MILIEU du 15 et finit
    // au MILIEU du 16. Le jour d'arrivee et le jour de depart sont donc PARTAGES
    // visuellement avec la resa voisine — c'est ce qui montre qu'une rotation le
    // meme jour n'est pas un conflit.
    //
    // ⚠ L'ancien calcul `width:(span-0.5)*100%` avec `left:50%` s'arretait a la
    // FIN du dernier jour occupe, soit une demi-cellule trop tot : la bulle ne
    // touchait jamais le jour de depart, et deux sejours qui s'enchainent
    // laissaient un blanc la ou ils doivent se croiser.
    //
    // ⚠ Une resa COMMENCEE AVANT la fenetre ne s'affichait pas du tout : la
    // barre n'etait rendue que dans la cellule `startISO`, absente de la grille.
    // La grille demarrant AUJOURD'HUI, tout sejour en cours etait invisible —
    // un planning qui montre libre la nuit ou quelqu'un dort. On rend donc
    // toutes les barres depuis la premiere cellule, en coordonnees de colonnes,
    // ce qui gere le debordement des deux cotes.
    function barresResa(bien){
      if(!days.length) return ''
      const iso0=toISO(days[0]), isoN=toISO(days[days.length-1])
      const indexDe=(iso)=>{ for(let k=0;k<days.length;k++){ if(toISO(days[k])===iso) return k } return null }
      let out=''
      ;(bien.resa||[]).forEach(bk=>{
        // Chevauchement avec la fenetre : depart APRES le premier jour affiche
        // (la nuit de depart n'est pas occupee) et arrivee avant le dernier.
        if(!(bk.startISO<=isoN && bk.checkout>iso0)) return
        const iDebut = bk.startISO<iso0 ? -1 : indexDe(bk.startISO)
        const iFin   = bk.checkout>isoN ? days.length : indexDe(bk.checkout)
        if(iDebut===null||iFin===null) return
        // Milieu de la cellule d'arrivee -> milieu de la cellule de depart.
        const gauche=Math.max(0, iDebut+0.5), droite=Math.min(days.length, iFin+0.5)
        if(droite<=gauche) return
        const coupeG = iDebut<0, coupeD = iFin>days.length-1
        const nameShort=escapeHtmlLocal(bk.name||'Reservation')
        const px=(n)=>(n*CELL_W)
        // ⚠ TOUT CE QUI VIENT DU PROVIDER EST ECHAPPE, pas seulement le nom.
        // `source`, `booking_id` et les dates arrivent de `bookings_snapshot` :
        // ce sont des donnees externes, et un guillemet dans l'une d'elles
        // casserait l'attribut qui la porte. Le nom l'etait deja ; les autres
        // ne l'etaient pas.
        // ⚠ GRISEE, PAS MASQUEE NI RENDUE INERTE : un sejour termine reste
        // consultable au clic (litige, facture, avis). Seule l'opacite change.
        const passee = resaPassee(bk)
        out+='<div class="resa-bar '+escapeHtmlLocal(bk.source)+(bk.id?' cliquable':'')
           + (coupeG?' cont-left':'')+(coupeD?' cont-right':'')+(passee?' passee':'')+'"'
           + ' data-resa="'+escapeHtmlLocal(bk.id||'')+'" data-bien="'+escapeHtmlLocal(bien.id)+'"'
           + ' title="'+escapeHtmlLocal(bk.name||'')+' — '+escapeHtmlLocal(bk.startISO)+' au '+escapeHtmlLocal(bk.checkout)
           + (passee?' — séjour terminé':'')+(bk.id?' — cliquer pour le detail':'')+'"'
           + ' style="left:'+px(gauche)+'px;width:'+(px(droite-gauche)-2)+'px;z-index:2">'
           + '<span class="nom">'+nameShort+'</span></div>'
      })
      return out
    }

    // ⚠ UNE SEULE DEFINITION DE « FERME », partagee par les hachures, la cellule
    // rouge du tarif et le libelle du bouton Fermer/Rouvrir. Les hachures ne
    // regardaient que `stopSell` pendant que `cell-closed` regardait les deux :
    // un jour ferme par « Disponibilité → Fermé » sortait rouge mais SANS
    // hachures, et le bouton proposait « Fermer » sur un jour deja ferme.
    const jourFerme = (s) => !!(s && (s.stopSell === 'closed' || s.avail === 'closed'))

    function renderBienBlock(bien){

    function autoScrollStep(){

      const EDGE=60, SPEED=18
      let scrolled=false
      if(lastMouseX > rect.right - EDGE){ area.scrollLeft += SPEED; scrolled=true }
      else if(lastMouseX < rect.left + 120 + EDGE){ area.scrollLeft -= SPEED; scrolled=true }
      if(scrolled){ extendSelTo(colIndexUnderX(lastMouseX)) }
      autoScrollRAF=requestAnimationFrame(autoScrollStep)

    function estPiloteYield(bienId){ const b=BIENS.find(x=>x.id===bienId); return !!b&&b.pilote==='yieldflow' }

        if(p.type==='perperson')return
        const pv=pending[p.key]; if(!pv)return
        const hasVal = p.type==='price' ? (pv.value!==''&&!isNaN(parseFloat(pv.value))) : (p.type==='num' ? pv.value!=='' : pv.value!=='keep')
        if(!hasVal)return
        // ⚠ EN MODE YIELDFLOW, LE TARIF NE S'ECRIT NULLE PART — PAS MEME A
        // L'ECRAN. Et cette garde est ICI, AVANT la boucle qui suit.
        //
        // Premiere version : elle etait posee APRES, donc elle empechait bien
        // l'ENVOI mais pas la MUTATION de l'etat local — `st[i].rate` etait
        // deja ecrase et `renderBlocks()` peignait le nouveau prix. Comme plus
        // aucune requete ne partait, aucun `catch` ne se declenchait, donc
        // aucune relecture du cœur : le prix refuse restait AFFICHE jusqu'au
        // prochain rechargement. Defaut trouve par Thierry en recette sur
        // staging, le 20 septembre 2026 — « un hote croirait son prix pris en
        // compte ».
        //
        // La lecon, et elle depasse ce fichier : empecher l'envoi ne suffit
        // pas quand l'ecran a deja peint. Un refus doit intercepter AVANT la
        // mutation, sinon il faut defaire — et defaire, ca s'oublie.
        //
        // Le RESTE de la saisie passe toujours : le serveur refuse toute la
        // requete des qu'elle porte un `rate`, donc laisser filer le tarif
        // ferait perdre la fermeture saisie au meme moment (arbitrage B).
        if(p.key==='rate'&&estPiloteYield(popupBienId)){ tarifIgnore=true; return }
        const daysArr=[]; for(const k in pv.dow){ if(pv.dow[k]) daysArr.push(parseInt(k,10)) }
        days.forEach((d,i)=>{ const iso=toISO(d); if(iso>=sISO&&iso<=eISO&&iso>=ISO_AUJOURDHUI&&pv.dow[d.getDay()]){ if(p.type==='price'){st[i][p.key]=computeNewRate(st[i][p.key],pv.mode,pv.unit,parseFloat(pv.value));st[i].modified=true}else if(p.type==='num'){st[i][p.key]=parseInt(pv.value,10)||0;st[i].modified=true}else{st[i][p.key]=pv.value;st[i].modified=true} } })
        const seg={ date_from:sISO, date_to:eISO, days:daysArr }
        if(p.key==='rate'){
          if(pv.mode==='set'&&pv.unit==='eur'){ seg.rate=parseFloat(pv.value) }
          else { seg.__perDate=true }
        }
        else if(p.key==='minStayArr') seg.min_stay_arrival=parseInt(pv.value,10)||0
        else if(p.key==='minStayThrough') seg.min_stay_through=parseInt(pv.value,10)||0
        else if(p.key==='maxStay') seg.max_stay=parseInt(pv.value,10)||0
        else if(p.key==='cta') seg.cta=(pv.value==='closed')
        else if(p.key==='ctd') seg.ctd=(pv.value==='closed')
        else if(p.key==='stopSell') seg.stop_sell=(pv.value==='closed')
        else if(p.key==='avail') seg.avail=(pv.value==='closed')?0:1
        segments.push(seg)
        touched++
      })

      const finalSegments=[]
      segments.forEach(seg=>{
        if(seg.kind==='perPerson'){ finalSegments.push(seg); return }
        if(seg.__perDate){
          days.forEach((d,i)=>{ const iso=toISO(d); if(iso>=seg.date_from&&iso<=seg.date_to&&iso>=ISO_AUJOURDHUI&&(!seg.days.length||seg.days.includes(d.getDay()))){ finalSegments.push({ date_from:iso, date_to:iso, rate:st[i].rate }) } })
        } else { delete seg.__perDate; finalSegments.push(seg) }
      })

      overlay.classList.remove('visible');sel={bienId:null,idx:new Set(),row:'rate'};hideFloatBar();renderBlocks()

      // ⚠ UN TARIF RETIRE EN SILENCE EST UN TARIF QUE L'HOTE CROIT AVOIR POSE.
      // On le dit AVANT l'enregistrement du reste, pour qu'il ne lise pas
      // « Enregistre » en pensant que son prix en faisait partie.
      if(tarifIgnore){ showToast('Le tarif n\'a pas été enregistré : les prix de ce logement sont pilotés par YieldFlow. Le reste de votre saisie, lui, est bien pris en compte.',8000) }
      if(finalSegments.length===0){ if(tarifIgnore) return }
      if(touched>0){
        showToast('Enregistrement...')
        try{
          const resp=await api.calendar.save(popupBienId, finalSegments)
          const tids = resp && resp.task_ids ? [resp.task_ids.restrictions, resp.task_ids.availability].filter(Boolean) : []
          if(tids.length){ try{ await navigator.clipboard.writeText(tids.join('\n')) }catch(e){} }
          // ⚠ Le TEXTE des avertissements est affiche, pas leur nombre : un echec
          // d'enregistrement de la configuration s'y lisait « 1 avertissement »,
          // donc pas du tout.
          if(resp && resp.config_saved === false){ showToast('Erreur: ' + resp.warnings.join(' · '), 6500) }
          else if(resp && resp.push_failed){ showToast('NON PUBLIE — ' + resp.warnings.join(' · '), 12000) }
          else if(resp && resp.local_only){ showToast(resp.warnings.join(' · '), 6500) }
          else if(resp && resp.warnings && resp.warnings.length){ showToast('Enregistre — ' + resp.warnings.join(' · ') + (tids.length?' — task ID copie':''), 6500) }
          else { showToast('Enregistre et publie' + (tids.length?' — task ID copie : '+tids[0]:'')) }
          await reloadInventory()
        }catch(err){
          showToast('Erreur: ' + (err.message||'sauvegarde'), 8000)
          // ⚠ ON RELIT LE CŒUR APRES UN ECHEC — releve en review.
          // L'etat local a deja ete mute et re-rendu AVANT l'envoi : sans cette
          // relecture, l'hote lit un message d'erreur en VOYANT ses nouveaux
          // prix a l'ecran. Il les croit enregistres. Le chemin fermeture /
          // reouverture le faisait deja ; celui-ci l'avait oublie, et le refus
          // du pilote tarifaire le rend routinier.
          await reloadInventory()
        }
      } else { showToast('Aucune modification') }
    })

    btnS.addEventListener('click',()=>{showComplete=false;btnS.classList.add('active');btnC.classList.remove('active');renderBlocks()})

    // Reconstruction complete de la grille : memes gestes pour un changement de
    // periode et pour un deplacement dans le temps. Les `states` sont indexes par
    // POSITION dans `days` : les garder apres un decalage ferait lire les tarifs
    // d'un jour sur un autre.
    async function rebatirGrille(){
      buildDays()
      Object.keys(states).forEach(k=>delete states[k])
      // ⚠ L'HISTORIQUE D'ANNULATION TOMBE AVEC LES ETATS. `undoStack` garde des
      // `JSON.stringify(states[bid])` indexes par POSITION dans `days`, comme
      // `states` : le conserver apres un changement de fenetre faisait reposer
      // les prix d'une plage sur des dates qui ne sont plus les memes. Pire en
      // retrecissant la periode (1 an -> 1 mois) : le tableau restitue etait

      // laissant le bien sans rendu du tout.
      undoStack.length=0
      const bu=document.getElementById('btn-undo'); if(bu) bu.disabled=true
      sel={bienId:null,idx:new Set(),row:'rate'}
      hideFloatBar(); renderMonthPills(); renderMonthBand()

    let toastTimer=null
    // ═══════════════════════════════════════════════════════════════════════
    // AJOUT D'UNE RESERVATION DIRECTE (spec-reservation-manuelle.md §5)
    // ═══════════════════════════════════════════════════════════════════════
    //
    // Chemin : selection existante -> ce formulaire -> l'endpoint, qui applique
    // le verrou et la capacite de l'etape 2 -> Channex -> retour PAR LE FEED.
    // Aucune ecriture directe du snapshot, jamais : la reservation apparait
    // quand le cœur l'a apprise, comme une reservation OTA.
    function bornesSelection(){
      if(!sel.bienId || sel.idx.size===0) return null
      const tries=[...sel.idx].sort((a,b)=>a-b)
      // La selection porte sur des NUITS ; le depart est le lendemain de la
      // derniere nuit selectionnee. C'est ce que fait Channex, et c'est ce qui
      // laisse la borne libre pour l'arrivee suivante.
      const depart=new Date(days[tries[tries.length-1]]); depart.setDate(depart.getDate()+1)
      return { arrival: toISO(days[tries[0]]), departure: toISO(depart), nuits: tries.length }
    }

    function ouvrirFormulaireAjout(){
      const b = bornesSelection()
      const bien = BIENS.find(x=>x.id===sel.bienId)

        + ' · ' + b.nuits + ' nuit' + (b.nuits>1?'s':'')
      // Prix prerempli depuis l'inventaire du premier jour selectionne, a defaut
      // le prix de base du bien.

      const premier = [...sel.idx].sort((a,b)=>a-b)[0]
      // `bien.base` : c'est le nom du champ dans mapBien (`base_price` cote API).

      document.getElementById('ajout-prix').value = prix

    // annonce au voyageur : le lui cacher jusqu'a la validation l'obligerait a
    // le calculer de tete.
    function rafraichirTotal(){
      const b = bornesSelection(); if(!b) return
      const bien = BIENS.find(x=>x.id===sel.bienId)
      const prix = parseFloat(document.getElementById('ajout-prix').value)
      const zone = document.getElementById('ajout-total')
      if(!(prix>0)){ zone.textContent = '—'; return }
      // ⚠ La devise vient du BIEN (`curSym`, comme partout ailleurs dans cette
      // page), jamais « € » en dur : sur un bien en GBP, le prix par nuit etait
      // en livres et le total annonce en euros — or c'est le montant que l'hote
      // annonce au voyageur.
      const sym = curSym(bien && bien.currency)
      const total = prix * b.nuits
      zone.innerHTML = '<strong>Total du séjour : ' + total.toFixed(2) + ' ' + sym + '</strong>'
        + ' <span style="color:#86868b">(' + prix.toFixed(2) + ' ' + sym + ' × ' + b.nuits + ' nuit' + (b.nuits>1?'s':'') + ')</span>'
    }

    // Voyageurs plafonnes a la capacite du bien, dit AVANT la validation.
    function depassementCapacite(){

      const a = parseInt(document.getElementById('ajout-adultes').value, 10) || 0
      const e = parseInt(document.getElementById('ajout-enfants').value, 10) || 0
      if(a < 1) return 'Il faut au moins un adulte.'
      const total = a + e
      return total > bien.capacity
        ? 'Ce bien accueille ' + bien.capacity + ' personne' + (bien.capacity>1?'s':'') + ' au maximum — vous en avez saisi ' + total + '.'
        : null

      const btn = document.getElementById('ajout-valider')

      document.getElementById('ajout-etat').textContent = 'Envoi au canal…'

        setTimeout(()=>{ reloadInventory().catch(()=>{}) }, 8000)

        const msg = e.status===409
          ? (e.message || 'Ces dates ne sont plus disponibles.')
