<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HôteSmart — Dashboard</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="welcome">Bonjour !</div>
        <div class="page-sub" id="status">Chargement...</div>
      </div>
    </div>

    <div class="content">

      <!-- ALARME SURRESERVATION — bandeau d'acquittement.
           Vide et invisible tant qu'aucune alarme n'est ouverte. C'est le SEUL
           moyen d'arreter la reemission des SMS : aucune extinction automatique
           tant que le conflit dure (spec-reservation-manuelle.md §4). -->
      <div id="alarmes-overbooking" hidden></div>

      <div class="section-header">
        <div class="section-title">Mes biens</div>
        <a href="/biens/nouveau" class="btn btn-primary" id="btn-ajouter-bien" hidden>+ Ajouter un bien</a>
      </div>
      <div class="apps-grid" id="properties-grid">
        <div class="app-card">Chargement...</div>
      </div>

      <div class="section-title">Mes apps</div>
      <div class="apps-grid" id="apps-grid">
        <div class="app-card">Chargement...</div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { requireAuth } from '/components/auth-guard.js'
  import { renderSidebar } from '/components/sidebar.js'
  import { getUser, supabase } from '/shared/supabase.js'
  import CONFIG from '/shared/config.js'
  import { initErrorHandler } from '/shared/error-handler.js'
  import { logger } from '/shared/logger.js'
  import {
    loadAllProperties, provenanceBadge, hydrateChannelBadges, escapeHtml
  } from '/shared/properties.js'
  // ⚠ `enteteCompte()` : l'endpoint des alarmes declare `compteDelegue: true`.
  // Sans cet en-tete, un profil delegue verrait les alarmes de SON compte et non
  // de celui qu'il consulte — et son acquittement viserait le mauvais compte.
  // Regle du depot, verifiee par tests/pages-identifiants.test.js.
  import { enteteCompte } from '/shared/compte-courant.js'

  initErrorHandler()

  async function init() {
    try {
      const session = await requireAuth()
      if (!session) return

      const user = await getUser()
      logger.info('Dashboard', 'Connecté', { email: user?.email })

      await renderSidebar('accueil')

      const name = user?.user_metadata?.full_name || user?.email?.split('@')[0] || 'là'
      document.getElementById('welcome').textContent = `Bonjour ${name} !`

      // Charge les biens (Beds24 + channel manager)
      await loadProperties()

      // Charge les apps
      renderApps()
      chargerAlarmes()

    } catch (err) {
      logger.error('Dashboard', err.message, err)
    }
  }

  // Carte compacte de l'accueil. Le chrome differe de /pages/biens (.app-card vs
  // .property-card, pas de boutons d'action ici) ; seules la SOURCE des biens et
  // les badges sont partages, via /shared/properties.js.
  function renderPropertyCard(p) {
    const card = document.createElement('div')
    card.className = 'app-card'

    // Beds24 expose address/city + horaires ; le channel manager expose city/country.
    const location = p._source === 'beds24'
      ? [p.address, p.city].filter(Boolean).join(', ')
      : [p.city, p.country].filter(Boolean).join(', ')

    const hours = (p.checkInStart && p.checkOutEnd)
      ? `<div class="app-desc" style="margin-top:4px">Check-in : ${escapeHtml(p.checkInStart)} · Check-out : ${escapeHtml(p.checkOutEnd)}</div>`
      : ''

    card.innerHTML = `
      <div class="app-icon" style="background:#E1F5EE">🏠</div>
      <div class="app-name">${escapeHtml(p.name)}</div>
      <div class="app-desc">${escapeHtml(location)}</div>
      ${hours}
      <span class="badge">${escapeHtml(provenanceBadge(p))}</span>
      <div class="channel-badges" data-channels></div>
    `
    return card
  }

  // Cf. pages/biens.html : la creation de bien n'est pas encore delegable.
  async function ajusterInterfaceSelonCompte() {
    try {
      const { estTitulaire } = await import('/shared/compte-courant.js')
      const btn = document.getElementById('btn-ajouter-bien')
      if (btn) btn.hidden = !estTitulaire()
    } catch {
      const btn = document.getElementById('btn-ajouter-bien')
      if (btn) btn.hidden = false
    }
  }

  async function loadProperties() {
    await ajusterInterfaceSelonCompte()
    const grid = document.getElementById('properties-grid')
    const status = document.getElementById('status')

    try {
      const { properties, allFailed, refuse } = await loadAllProperties()

      // Refus de droits : etat normal d'un membre, pas un incident.
      if (refuse) {
        grid.innerHTML = '<div class="app-card"><div class="app-desc">Vous n’avez pas accès aux biens de ce compte.</div></div>'
        status.textContent = ''
        return
      }

      if (allFailed) {
        grid.innerHTML = '<div class="app-card"><div class="app-desc">Erreur de chargement des biens.</div></div>'
        status.textContent = 'Chargement impossible'
        return
      }

      if (!properties.length) {
        // Le bouton "Ajouter un bien" de l'en-tete reste le seul point d'entree.
        grid.innerHTML = '<div class="app-card"><div class="app-desc">Aucun bien pour le moment.</div></div>'
        status.textContent = 'Aucun bien'
        return
      }

      // Libelle neutre : l'accueil ne parle plus de Beds24, les deux backends coexistent.
      status.textContent = `${properties.length} bien(s)`

      grid.innerHTML = ''
      for (const p of properties) {
        const card = renderPropertyCard(p)
        grid.appendChild(card)
        // Canaux charges en differe : la carte s'affiche sans attendre Channex.
        hydrateChannelBadges(p, card.querySelector('[data-channels]'))
      }
    } catch (err) {
      logger.error('Dashboard', 'Erreur chargement biens', err)
      grid.innerHTML = '<div class="app-card"><div class="app-desc">Erreur de chargement des biens.</div></div>'
    }
  }

  // ─── Alarmes de surréservation ─────────────────────────────────────────
  // Une surréservation ne se rattrape pas après coup : l'alarme réémet un SMS
  // toutes les ~45 min et ne s'arrête QUE par ce bouton. Elle s'éteint seule
  // dans un seul cas — quand le conflit a disparu (annulation, dates déplacées).
  async function chargerAlarmes() {
    const zone = document.getElementById('alarmes-overbooking')
    if (!zone) return
    try {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return
      const r = await fetch('/api/incidents-acquitter?type=overbooking', {
        headers: { Authorization: 'Bearer ' + session.access_token, ...enteteCompte() }
      })
      if (!r.ok) return
      const { alarmes } = await r.json()
      if (!alarmes || !alarmes.length) { zone.hidden = true; zone.innerHTML = ''; return }

      zone.hidden = false
      zone.innerHTML = alarmes.map(a => `
        <div class="app-card" style="border:2px solid #c0392b;background:#fff5f4;margin-bottom:12px">
          <div class="app-name" style="color:#c0392b">⚠ Surréservation — bien ${escapeHtml(String(a.property_id))}</div>
          <div class="app-desc">${escapeHtml(a.detail?.message || 'Deux séjours sur la même nuit.')}</div>
          <div class="app-desc" style="margin-top:6px;color:#86868b">
            Détectée le ${escapeHtml(String(a.created_at).slice(0, 16).replace('T', ' à '))}.
            Cette alerte se répète jusqu'à acquittement.
          </div>
          <button class="btn btn-primary" style="margin-top:10px;background:#c0392b"
                  data-acquitter="${escapeHtml(a.id)}">J'ai vu — arrêter l'alerte</button>
        </div>`).join('')

      zone.querySelectorAll('[data-acquitter]').forEach(b => {
        b.addEventListener('click', async () => {
          b.disabled = true
          b.textContent = 'Acquittement…'
          try {
            const { data: { session: s2 } } = await supabase.auth.getSession()
            const rep = await fetch('/api/incidents-acquitter', {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + s2.access_token,
                'Content-Type': 'application/json',
                ...enteteCompte()
              },
              body: JSON.stringify({ id: b.dataset.acquitter })
            })
            if (!rep.ok) throw new Error('echec')
            await chargerAlarmes()
          } catch (e) {
            b.disabled = false
            b.textContent = 'Échec — réessayer'
          }
        })
      })
    } catch (err) {
      logger.error('Dashboard', 'Erreur chargement alarmes', err)
    }
  }

  function renderApps() {
    const grid = document.getElementById('apps-grid')
    // Pas de ligne de statut ici : elle etait ecrite en dur ("○ Inactif") et
    // affichait donc Inactif pour toutes les apps, y compris celles utilisees.
    // `app.active` ne mesure pas l'usage, il dit si l'app est livree (filtre
    // du catalogue ci-dessous). Un vrai indicateur (plutot "configure / a
    // parametrer", pour l'onboarding) demandera une source d'usage par app.
    grid.innerHTML = CONFIG.apps.filter(app => app.active !== false).map(app => `
      <a class="app-card" href="/apps/${app.id}">
        <div class="app-icon" style="background:${app.color}">${app.icon}</div>
        <div class="app-name">${app.name}</div>
        <div class="app-desc">Cliquez pour configurer</div>
      </a>
    `).join('')
  }

  init()
</script>

</body>
</html>
