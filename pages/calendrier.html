<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- PAGE « CALENDRIER » — refonte UI V5, lot 3 ÉTAPE 1 : grille (4 états en
     couleur, dette 20), les cinq actions, popup, formulaire avec « Bloquer
     les dates » (dette 64), fiches — UNE page, deux dispositions (planning
     ≥ 900 px, mois < 900 px). Spec :
     docs/specs/spec-refonte-ui-v5-lot-calendrier.md §3-§7, §9, §11-§12.
     YieldFlow INTACT à cette étape (recadrage du 12 octobre) : pas de
     volets, pas d'interrupteur ; lien « Tarification » dans le menu ⋯.
     RÈGLES : aucun hexa, aucun texte en dur, icônes du sprite, aucun appel
     provider ni moteur ; X-Compte sur chaque appel ; la vendabilité se lit
     EXCLUSIVEMENT dans calendar_inventory. -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- nav.js --></div>
  </div>
</header>

<main class="cal-page">
  <div class="cal-entete">
    <h1 class="h2" data-i18n="cal.title"></h1>
  </div>

  <div class="row cal-nav">
    <button type="button" class="btn btn--secondary btn--icon" data-nav="-1" data-i18n-attr="aria-label:cal.prev">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-chevron" transform="rotate(180 12 12)"/></svg>
    </button>
    <button type="button" class="btn btn--secondary" data-nav="0" data-i18n="cal.today"></button>
    <button type="button" class="btn btn--secondary btn--icon" data-nav="1" data-i18n-attr="aria-label:cal.next">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-chevron"/></svg>
    </button>
    <div class="cal-periode" data-bind="periode" role="group" data-i18n-attr="aria-label:cal.period">
      <button type="button" class="tab" data-mois="1">1 m</button>
      <button type="button" class="tab" data-mois="3">3 m</button>
      <button type="button" class="tab" data-mois="6">6 m</button>
      <button type="button" class="tab" data-mois="12">12 m</button>
    </div>
    <span class="h2 cal-nav__mois" data-bind="mois-libelle" hidden></span>
    <select class="cal-vue" data-bind="vue-mobile" hidden data-i18n-attr="aria-label:cal.mobile_view"></select>
    <details class="bulle-menu cal-menu" data-bind="menu-plus" style="margin-inline-start: auto">
      <summary class="msg-btnrond" data-i18n-attr="aria-label:cal.more;title:cal.more;data-legende:cal.more">
        <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-more"/></svg>
      </summary>
      <div class="bulle-menu__liste bulle-menu__liste--bas cal-menu__liste">
        <a href="/apps/yield/prix" data-i18n="cal.link_pricing"></a>
      </div>
    </details>
  </div>

  <p class="card cal-avis" data-bind="avis-lecture" hidden data-i18n="cal.readonly"></p>
  <p class="card cal-avis" data-bind="avis-beds24" hidden></p>
  <div class="cal-vide" data-bind="etat-vide" hidden></div>

  <div class="cal-planning" data-bind="planning" hidden>
    <div class="cal-bande" data-bind="bande"></div>
    <div data-bind="grilles"></div>
    <p class="caption muted cal-legende" data-bind="legende-canaux"></p>
  </div>

  <div class="cal-mois" data-bind="grille-mobile" hidden></div>

  <!-- Biens NON affiches : une bulle chacun (photo ronde + nom), clic =
       le bloc se deploie ; Beds24 grisee, non cliquable (retouche du
       12 octobre, point 4). -->
  <div class="cal-bulles" data-bind="bulles"></div>

  <p class="caption muted" style="padding: 0 var(--page-pad) 10px" data-bind="etat-charge" hidden></p>
</main>

<div class="cal-flottante" data-bind="flottante" hidden>
  <span class="small" data-bind="flottante-compte"></span>
  <span class="row" style="gap: 8px; flex-wrap: wrap" data-bind="flottante-actions"></span>
  <span class="caption muted" data-bind="flottante-note" hidden></span>
  <button type="button" class="link small" data-bind="flottante-annuler" data-i18n="cal.cancel_selection"></button>
</div>

<aside class="msg-tiroir cal-feuille" data-bind="feuille" hidden aria-labelledby="h-feuille">
  <div class="msg-tiroir__entete">
    <h2 class="h2" id="h-feuille" style="font-size: 17px; margin: 0" data-bind="feuille-titre"></h2>
    <button type="button" class="btn btn--secondary btn--icon" data-bind="feuille-fermer" data-i18n-attr="aria-label:messages.close">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-close"/></svg>
    </button>
  </div>
  <div class="msg-tiroir__corps" data-bind="feuille-corps"></div>
  <p class="caption msg-tiroir__note" data-bind="feuille-note" hidden></p>
</aside>

<script type="module">
import { requireAuth } from '/components/auth-guard.js'
import { supabase, getUser, signOut } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { logger } from '/shared/logger.js'
import { escapeHtml as esc } from '/shared/properties.js'
import { compteCourant, peutLire, peutEcrire, estTitulaire, comptes, basculerVers, enteteCompte }
  from '/shared/compte-courant.js'
import { api } from '/shared/api-client.js'
import { toISO, computeDays, buildStateFromInventory, loadCalendarData, PARAMS }
  from '/shared/calendar-core.js'
import { mapResa, familleSource, LIBELLE_CANAL, libelleStatut, droitsResa, badgeSansEmailVisible,
  TEXTE_SANS_EMAIL, urlConversation, messageCapacite, nuitsEntre, brancherEvaluation }
  from '/shared/calendrier-resa.js'
import { ACTIONS_BARRE, RUBRIQUES_POPUP, CHAMPS_FICHE, etatDeNuit, prixIntl, dateIntl }
  from '/shared/calendrier-contrat.js'
import { detecterOrphelines } from '/shared/nuits-orphelines.js'
import { bandeJoursHtml } from '/shared/bande-jours.js'
import { brancherReordonnancement, deplacer } from '/shared/reordonner-biens.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (s) => document.querySelector(s)
const icone = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="/shared/icons.svg#${id}"/></svg>`
const AUJOURDHUI = toISO(new Date())
const estLarge = () => window.matchMedia('(min-width: 900px)').matches
const langue = () => (window.I18n && I18n.lang) || document.documentElement.lang || 'fr'

const etat = {
  biens: [],               // /api/channel-property : {id(uuid), name, provider, provider_property_id, capacity, base_price, currency, photo_url, included_guests, extra_guest_fee, pilote_tarifaire}
  choisis: [],             // uuids affiches (multi >=900, un seul <900)
  months: 3, decalage: 0,  // ordinateur ; NON persiste (decision conservee)
  annee: null, mois: null, // telephone : mois calendaire, PERSISTE
  vueMobile: 'rate',       // selecteur de vue (arbitrage (a) : garde a l'etape 1)
  choisisDefinis: false,   // prefs lues : un tableau vide est un choix, pas un defaut
  jours: [],               // Date[] de la plage ordinateur
  inv: {}, pp: {}, propsById: {}, rawProps: {}, bookings: {}, fermetures: {},
  states: {},              // uuid -> etats par jour (desktop) / par iso (mobile via index)
  fenetres: new Map(),     // uuid -> { fin: iso } du pilote (4e etat) ; absent = pas de fenetre
  orphelines: new Map(),   // uuid -> Set iso
  sel: null,               // { bien, a, b } indices desktop / { bien, duIso, auIso } mobile
  lectureSeule: false, chargement: 0, dernierSave: null
}
const PREFS_CLE = 'hs_cal_v5_prefs'
function lirePrefs () {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_CLE) || '{}')
    if (Array.isArray(p.choisis)) { etat.choisis = p.choisis; etat.choisisDefinis = true }
    if ([1, 3, 6, 12].includes(p.months)) etat.months = p.months
    if (Number.isInteger(p.annee) && Number.isInteger(p.mois)) { etat.annee = p.annee; etat.mois = p.mois }
    if (typeof p.vueMobile === 'string' && VUES.some(v => v.id === p.vueMobile)) etat.vueMobile = p.vueMobile
  } catch {}
}
function ecrirePrefs () {
  try {
    localStorage.setItem(PREFS_CLE, JSON.stringify({
      choisis: etat.choisis, months: etat.months, annee: etat.annee, mois: etat.mois,
      vueMobile: etat.vueMobile
    }))
  } catch {}
}

// ─── Toasts (verdicts du writer, « Annuler » = vraie ecriture inverse) ──────
function toast (texte, { duree = 5000, erreur = false, annuler = null } = {}) {
  const zone = $('[data-bind="toasts"]')
  const el = document.createElement('div')
  el.className = 'cal-toast' + (erreur ? ' cal-toast--erreur' : '')
  el.innerHTML = `<span>${esc(texte)}</span>` + (annuler
    ? `<button type="button" class="link" data-annuler>${esc(t('cal.undo'))}</button>` : '')
  zone.appendChild(el)
  if (annuler) el.querySelector('[data-annuler]').addEventListener('click', () => { el.remove(); annuler() })
  setTimeout(() => el.remove(), duree)
}

// ─── Chargement ──────────────────────────────────────────────────────────────
async function chargerBiens () {
  const r = await api.channel.listProperties()
  etat.biens = (r && r.properties) || []
  const pilotables = etat.biens.filter(b => b.provider !== 'beds24')
  const avaitDesIds = etat.choisis.length > 0
  etat.choisis = etat.choisis.filter(id => pilotables.some(b => b.id === id))
  if (avaitDesIds && !etat.choisis.length) etat.choisisDefinis = false
  if (!etat.choisisDefinis && !etat.choisis.length) {
    etat.choisis = estLarge() ? pilotables.map(b => b.id) : pilotables.slice(0, 1).map(b => b.id)
  }
}
function bornesLecture () {
  if (estLarge()) {
    const planning = $('[data-bind="planning"]')
    const col = parseInt(getComputedStyle(planning).getPropertyValue('--cal-col')) || 110
    const largeur = (planning.clientWidth || 1200) - (col - 120)
    const jours = computeDays(etat.months, largeur, etat.decalage)
    etat.jours = jours
    return { start: toISO(jours[0]), end: toISO(jours[jours.length - 1]) }
  }
  const d = new Date()
  if (etat.annee == null) { etat.annee = d.getFullYear(); etat.mois = d.getMonth() }
  const debut = new Date(etat.annee, etat.mois, 1)
  const fin = new Date(etat.annee, etat.mois + 1, 0)
  // marge pour les sejours a cheval et la detection d'orphelines
  debut.setDate(debut.getDate() - 10); fin.setDate(fin.getDate() + 10)
  return { start: toISO(debut), end: toISO(fin) }
}
let jetonLecture = 0
async function charger () {
  const jeton = ++jetonLecture
  $('[data-bind="etat-charge"]').hidden = false
  $('[data-bind="etat-charge"]').textContent = t('common.loading')
  const { start, end } = bornesLecture()
  try {
    const refs = etat.choisis
    const [donnees] = await Promise.all([
      loadCalendarData(refs, start, end),
      chargerFenetres(refs)
    ])
    if (jeton !== jetonLecture) return   // reponse en retard : on ne repeint pas
    Object.assign(etat, { inv: donnees.inv, pp: donnees.pp, propsById: donnees.propsById, rawProps: donnees.rawProps, fermetures: donnees.fermetures })
    etat.bookings = donnees.bookings || {}
    construireEtats(start, end)
    $('[data-bind="etat-charge"]').hidden = true
    renderTout()
  } catch (e) {
    if (jeton !== jetonLecture) return
    logger.error('Calendrier', 'chargement', e)
    $('[data-bind="etat-charge"]').hidden = false
    $('[data-bind="etat-charge"]').textContent = t('cal.load_error')
  }
}
// La fenetre du pilote (4e etat « pas encore ouverte », dette 20) : fin
// calculee par le SERVEUR (fenetre_fin, regle du moteur) ; repli client de
// /api/yield-pilote pour les seuls biens PILOTES — jamais d'etat invente, un
// bien illisible n'a simplement pas de 4e etat ce coup-ci.
async function chargerFenetres (refs) {
  etat.fenetres = new Map()
  const pilotes = etat.biens.filter(b => refs.includes(b.id) && b.pilote_tarifaire === 'yieldflow' && b.provider_property_id)
  await Promise.all(pilotes.map(async (b) => {
    try {
      const r = await appel(`/api/yield-pilote?bien=${encodeURIComponent(b.provider_property_id)}`)
      if (r && typeof r.fenetre_fin === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.fenetre_fin)) {
        etat.fenetres.set(b.id, { fin: r.fenetre_fin })
        return
      }
      const f = r && r.fenetre
      if (!f || !f.valeur) return
      const jours = f.type === 'mois' ? Math.round(Number(f.valeur) * 30) : Number(f.valeur)
      if (!Number.isFinite(jours) || jours <= 0) return
      const fin = new Date(); fin.setDate(fin.getDate() + jours)
      etat.fenetres.set(b.id, { fin: toISO(fin) })
    } catch (e) { logger.error('Calendrier', 'fenetre pilote', e) }
  }))
}
async function appel (chemin, corpsPost) {
  const { data: { session } } = await supabase.auth.getSession()
  const r = await fetch(chemin, {
    method: corpsPost ? 'POST' : 'GET',
    headers: { Authorization: 'Bearer ' + session.access_token, ...(corpsPost ? { 'Content-Type': 'application/json' } : {}), ...enteteCompte() },
    ...(corpsPost ? { body: JSON.stringify(corpsPost) } : {})
  })
  const corps = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(corps.message || corps.error || `HTTP ${r.status}`); e.status = r.status; e.code = corps.code || corps.error; throw e }
  return corps
}

function construireEtats (start, end) {
  etat.states = {}
  etat.orphelines = new Map()
  const joursISO = []
  for (let d = new Date(start + 'T12:00:00'); toISO(d) <= end; d.setDate(d.getDate() + 1)) joursISO.push(toISO(d))
  etat.joursISO = joursISO
  for (const id of etat.choisis) {
    const bien = etat.biens.find(b => b.id === id) || {}
    const base = Number.isFinite(Number(etat.propsById[id]?.base)) ? Number(etat.propsById[id].base) : (Number(bien.base_price) || null)
    const dates = joursISO.map(iso => new Date(iso + 'T12:00:00'))
    const st = buildStateFromInventory(dates, etat.inv[id], base)
    const parIso = {}
    joursISO.forEach((iso, i) => { parIso[iso] = st[i] })
    etat.states[id] = parIso
    // Nuits vendues du bien (barres + etat « vendue » de chaque nuit).
    const resas = mapResa((etat.bookings && etat.bookings[id]) || [])
    etat.states[id].__resas = resas
    const vendue = new Set()
    for (const r of resas) {
      for (let d = new Date(r.startISO + 'T12:00:00'); toISO(d) < r.checkout; d.setDate(d.getDate() + 1)) vendue.add(toISO(d))
    }
    etat.states[id].__vendues = vendue
    // Orphelines (module commun, constat 8) : jours libres non couvrables.
    const libre = (iso) => {
      const s = parIso[iso]
      if (!s) return false
      return !vendue.has(iso) && !nuitFermee(s)
    }
    etat.orphelines.set(id, detecterOrphelines(joursISO, {
      estLibre: libre,
      inventaire: (iso) => (etat.inv[id] || {})[iso]
    }))
  }
}
// L'etat d'une nuit (§4.1) — la SEULE regle, pour les deux ecrans.
// Un BLOCAGE de l'hote prime sur « pas encore ouverte » : les nuits hors
// fenetre sont fermees PAR LE MOTEUR (retrait de la vente), celles d'un
// blocage le sont PAR L'HOTE — elles restent « fermees » a l'ecran.
// « Fermee » a UNE definition dans toute la page (inv, jamais les
// fermetures : la vendabilite se lit EXCLUSIVEMENT dans calendar_inventory).
function nuitFermee (s) { return s.avail === 'closed' || s.stopSell === 'closed' }
function etatNuit (bienId, iso) {
  const s = etat.states[bienId]?.[iso]
  if (!s) return 'ouverte'
  const vendue = etat.states[bienId].__vendues.has(iso)
  const fermee = nuitFermee(s)
  const fenetre = etat.fenetres.get(bienId)
  const horsFenetre = !!(fenetre && iso > fenetre.fin) && !fermeeParBlocage(bienId, iso)
  return etatDeNuit({ vendue, fermee, horsFenetre })
}
function fermeeParBlocage (bienId, iso) {
  const ref = String(etat.biens.find(b => b.id === bienId)?.provider_property_id || '')
  const liste = etat.fermetures[bienId] || etat.fermetures[ref] || []
  return (liste || []).some(f => iso >= String(f.date_debut).slice(0, 10) && iso <= String(f.date_fin).slice(0, 10))
}

// ─── Rendu : tronc commun ────────────────────────────────────────────────────
function renderTout () {
  renderBulles(); renderBandeaux()
  if (estLarge()) { $('[data-bind="grille-mobile"]').hidden = true; renderPlanning() }
  else { $('[data-bind="planning"]').hidden = true; renderGrilleMobile() }
  renderFlottante()
}
// L'identite d'un bien : photo (36 px rayon 10) + nom + capacite, et le
// bouton reduire — UNE construction pour grille, mobile et bulles (une
// copie par ecran diverge : vecu du 30 septembre).
const photoBien = (b) => b.photo_url ? `<img src="${esc(b.photo_url)}" alt="" loading="lazy">` : icone('i-home')
function identiteBien (bien, { mobile = false } = {}) {
  const peut = !etat.lectureSeule && peutEcrire('reservations')
  return `<div class="cal-bien__bandeau${mobile ? ' cal-bien__bandeau--mobile' : ''}"><div class="cal-bien__bandeau-int">
      <span class="cal-poigne" data-poigne title="${esc(t('cal.drag_hint'))}" aria-label="${esc(t('cal.drag_hint'))}">${icone('i-menu')}</span>
      <span class="cal-photo cal-bien__photo">${photoBien(bien)}</span>
      <b class="cal-bien__nom">${esc(bien.name || '')}</b>
      ${boutonYfHtml(bien)}
      ${mobile ? '' : `<span class="caption muted">${esc(t('cal.capacity', { n: bien.capacity || '—' }))}</span>`}
      ${mobile && peut ? `<button type="button" class="cal-btn-plus" data-plus="${esc(bien.id)}" title="${esc(t('cal.add_title'))}" aria-label="${esc(t('cal.add_title'))}">${icone('i-plus')}</button>` : ''}
      <button type="button" class="cal-bien__reduire" data-reduire="${esc(bien.id)}"
        title="${esc(t('cal.reduce'))}" aria-label="${esc(t('cal.reduce'))}">${icone('i-close')}</button>
    </div></div>`
}
// Le prix affiche d'une nuit : UNE regle pour les deux ecrans (une nuit
// « pas encore ouverte » n'affiche rien, une nuit sans ligne affiche —).
function prixAffiche (e, s, bien) {
  return e === 'attente' ? '' : (s.sansPrix ? '—' : prixIntl(s.rate, bien.currency, langue()) || '—')
}
// La regle du marquage week-end, UNE fois (bande, fond des resas,
// cellules de prix) : trois copies divergeraient (vecu du 30 septembre).
function classesWE (jourSemaine) {
  return [0, 6].includes(jourSemaine)
    ? ' cal-we' + (jourSemaine === 6 ? ' cal-we--debut' : ' cal-we--fin') : ''
}
// Le fond de la ligne des reservations : une case par jour, QUADRILLAGE et
// week-ends compris — sans eux, impossible de lire la date d'une barre
// (constat de recette du 12 octobre). Identique pour tous les biens :
// calcule UNE fois par render.
function fondsResas () {
  return etat.joursISO.map(iso => {
    const we = classesWE(new Date(iso + 'T12:00:00').getDay())
    return `<span class="cal-resas__jour${we}"></span>`
  }).join('')
}

// Les biens NON affiches, en bulles SOUS la grille (retouche point 4) :
// photo ronde + nom ; clic = le bloc se deploie (ordinateur : s'ajoute ;
// telephone : remplace le bien courant). Beds24 : grisee, non cliquable.
function bullesHtml () {
  const caches = etat.biens.filter(b => b.provider === 'beds24' || !etat.choisis.includes(b.id))
  return caches.map(b => {
    const beds24 = b.provider === 'beds24'
    return `<button type="button" class="cal-bulle${beds24 ? ' cal-bulle--grise' : ''}"
      data-bulle="${esc(b.id)}" ${beds24 ? 'disabled' : ''}
      title="${esc(beds24 ? t('cal.beds24_hint') : t('cal.bubble_show', { nom: b.name || '' }))}">
      <span class="cal-photo cal-bulle__photo">${photoBien(b)}</span>
      <span class="cal-bulle__nom">${esc(b.name || '')}</span>
      ${beds24 ? `<span class="caption muted">${esc(t('cal.beds24_tag'))}</span>` : ''}
    </button>`
  }).join('')
}
// L'angle de la bande (ordinateur) : le selecteur des biens masques —
// puce nommee, miniatures empilees, compteur ; le menu liste chaque bien
// avec « Afficher », et « Tout afficher » en bas. Jamais d'icone sans sens :
// aucun masque = « Tous les biens ».
function angleHtml () {
  const masques = etat.biens.filter(b => b.provider !== 'beds24' && !etat.choisis.includes(b.id))
  if (!masques.length) return `<span class="caption muted">${esc(t('cal.all_shown'))}</span>`
  const minis = masques.slice(0, 4).map(b => `<span class="cal-photo cal-angle__mini">${photoBien(b)}</span>`).join('')
  return `<details class="cal-angle__menu">
    <summary class="cal-angle__puce" title="${esc(t('cal.hidden_props'))}">
      <span class="cal-angle__pile">${minis}</span>
      <b>${masques.length}</b>
      <span class="caption">${esc(t('cal.hidden_props'))}</span>
    </summary>
    <div class="cal-angle__liste">
      ${masques.map(b => `<button type="button" data-afficher="${esc(b.id)}">
        <span class="cal-photo cal-angle__mini">${photoBien(b)}</span>
        <span class="cal-angle__nom">${esc(b.name || '')}</span>
        <span class="link small">${esc(t('cal.show_one'))}</span>
      </button>`).join('')}
      <button type="button" class="cal-angle__tout" data-tout-afficher>${esc(t('cal.show_all'))}</button>
    </div>
  </details>`
}
function brancherAngle (zone) {
  const afficher = (ids) => {
    etat.choisis = [...new Set([...etat.choisis, ...ids])]
    etat.choisisDefinis = true
    viderSelection(); ecrirePrefs(); charger()
  }
  zone.querySelectorAll('[data-afficher]').forEach(b => b.addEventListener('click', () => afficher([b.dataset.afficher])))
  const tout = zone.querySelector('[data-tout-afficher]')
  if (tout) tout.addEventListener('click', () => afficher(etat.biens.filter(b => b.provider !== 'beds24').map(b => b.id)))
  const det = zone.querySelector('.cal-angle__menu')
  if (det) {
    det.addEventListener('toggle', () => {
      if (!det.open) return
      const r = det.querySelector('summary').getBoundingClientRect()
      const liste = det.querySelector('.cal-angle__liste')
      liste.style.top = (r.bottom + 4) + 'px'
      liste.style.insetInlineStart = Math.max(8, r.left) + 'px'
    })
    $('[data-bind="planning"]').addEventListener('scroll', () => { det.open = false }, { passive: true })
  }
  const menuPlus = $('[data-bind="menu-plus"]')
  if (menuPlus && !menuPlus.dataset.fermeAuScroll) {
    menuPlus.dataset.fermeAuScroll = '1'
    window.addEventListener('scroll', () => { menuPlus.open = false }, { passive: true })
  }
}
function brancherBulles (zone) {
  zone.querySelectorAll('[data-bulle]:not([disabled])').forEach(p => p.addEventListener('click', () => {
    etat.choisis = [...etat.choisis, p.dataset.bulle]
    etat.choisisDefinis = true
    viderSelection(); ecrirePrefs(); charger()
  }))
}
// ─── ACCES YIELDFLOW : le bouton de la ligne du bien, et son menu ──────────
// Lot du 28 octobre 2026. Spec : docs/specs/spec-yf-bouton-calendrier.md.
//
// ⚠ RIEN DE NEUF N'EST CALCULE AU CHARGEMENT DU CALENDRIER. La couleur du
// bouton se lit dans `pilote_tarifaire`, deja servi par /api/channel-property
// avec la liste des biens. Les faits du menu — le compteur et les quatre
// reperes — partent sur le CLIC, pour le SEUL bien clique. C'est l'exception
// datee du 28 octobre 2026 a la regle « donnee non urgente = resume
// pre-calcule » (spec §6 bis) : elle ne tient QUE parce que le comptage suit
// un geste. Le jour ou l'un de ces chiffres s'affiche sans clic, il faut la
// table de resume, le cron, et l'heure du calcul affichee.
//
// ⚠ ET LE MENU N'ECRIT RIEN. Il ouvre des pages. La bascule du pilote reste
// le parcours d'activation de `apps/yield/prix`, avec sa confirmation
// « N nuits ont deja un prix au calendrier » comptee SERVEUR : jamais de
// bascule en un clic depuis le calendrier.
const yfPilote = (bien) => bien.pilote_tarifaire === 'yieldflow'
function boutonYfHtml (bien) {
  // Beds24 : YieldFlow ne pilote que Channex (`peutPasserEnYieldflow`). Un
  // bouton qui ouvrirait un menu sans issue est pire qu'une absence — et les
  // biens Beds24 sont deja grises et non cochables partout ailleurs ici.
  if (bien.provider === 'beds24') return ''
  const on = yfPilote(bien)
  const label = t(on ? 'cal.yf_open_on' : 'cal.yf_open_off', { nom: bien.name || '' })
  return `<button type="button" class="cal-yf ${on ? 'cal-yf--on' : 'cal-yf--off'}"
    data-yf="${esc(bien.id)}" aria-haspopup="dialog" aria-expanded="false"
    title="${esc(label)}" aria-label="${esc(label)}">${icone('i-chart')}</button>`
}

// Les quatre entrees, dans l'ordre de la spec §4. `evenements=1` et non une
// page a part : `apps/yield/evenements.html` est une REDIRECTION vers
// `prix?evenements=1` depuis le 22 septembre 2026 — l'ecran Evenements est une
// pop-up DANS la Prediction de prix. Et « Donnees marche » vise
// `marche-global`, la seule des trois pages marche qui soit au menu.
const ENTREES_YF = [
  { cle: 'cal.yf_prediction',  icone: 'i-price',    page: 'prix',          repere: 'fenetre' },
  { cle: 'cal.yf_market',      icone: 'i-globe',    page: 'marche-global', repere: 'marche' },
  { cle: 'cal.yf_events',      icone: 'i-calendar', page: 'prix',          repere: 'evenements', params: { evenements: '1' } },
  { cle: 'cal.yf_comparables', icone: 'i-home',     page: 'comparables',   repere: 'comparables' }
]
const urlYf = (page, bienId, params) =>
  `/apps/yield/${page}?` + new URLSearchParams({ bien: bienId, ...(params || {}) })

// Le repere d'une entree. ⚠ IL NE S'AFFICHE QUE S'IL EST SERVI : `null` =
// illisible, et on se tait. Un entier, lui, est un fait — 0 compris.
function repereYf (quoi, d) {
  if (!d) return ''
  if (quoi === 'fenetre') {
    const f = d.fenetre
    if (!f || !Number.isFinite(Number(f.valeur))) return ''
    return t(f.type === 'mois' ? 'cal.yf_window_months' : 'cal.yf_window_days', { n: f.valeur })
  }
  if (quoi === 'marche') return d.marche || ''
  if (quoi === 'evenements') return Number.isInteger(d.evenements) ? t('cal.yf_events_count', { n: d.evenements }) : ''
  // ⚠ ZERO COMPARABLE EST UN FAIT, ET IL APPELLE UN GESTE (demande de Thierry,
  // 28 octobre 2026). « 0 retenus » se lit comme un echec ; « A choisir » dit
  // ce qu'il reste a faire. La distinction avec l'ILLISIBLE tient toujours :
  // `null` ne rend rien du tout.
  if (quoi === 'comparables') {
    if (!Number.isInteger(d.comparables)) return ''
    return d.comparables === 0 ? t('cal.yf_comparables_none') : t('cal.yf_comparables_count', { n: d.comparables })
  }
  return ''
}

const menuYf = { bien: null, bouton: null }
function menuYfHtml (bien, d) {
  // ⚠ L'ETAT VIENT DE LA REPONSE DES QU'ELLE EST LA, PAS DE LA PAGE — constat
  // de la re-review du 28 octobre 2026. `bien.pilote_tarifaire` date du
  // CHARGEMENT du calendrier ; l'hote a pu activer le pilote dans un autre
  // onglet entre-temps. Le menu annoncait alors « Prix manuels » et proposait
  // « Activer le pilote automatique » sur un bien DEJA pilote — et ce clic ne
  // menait nulle part, puisque la page d'arrivee refuse d'ouvrir un parcours
  // sur un bien pilote. Un cul-de-sac que la valeur fraiche, deja en main,
  // suffit a fermer.
  // Au premier rendu (`d` absent), on n'a que la valeur de la page : c'est
  // elle qui colore le bouton, et elle est juste dans le cas courant.
  const on = d && d.pilote ? d.pilote === 'yieldflow' : yfPilote(bien)
  // La ligne ambre : bien pilote SEULEMENT, et masquee a 0 — comme elle est
  // masquee quand le compte est illisible (`null`). On n'ecrit jamais « 0 »
  // a la place d'une absence : un 0 de remplacement transforme une absence en
  // fait, et l'ecran l'affiche avec l'aplomb des vrais chiffres.
  const n = d && d.prix_ajustes
  const ajuste = (on && Number.isInteger(n) && n > 0)
    ? `<p class="cal-yf-menu__ajuste">${icone('i-alert')}<span>${esc(t('cal.yf_adjusted', { n }))}</span></p>` : ''
  const entrees = ENTREES_YF.map(e => `<a class="cal-yf-menu__entree" href="${esc(urlYf(e.page, bien.id, e.params))}">
      ${icone(e.icone)}<span class="cal-yf-menu__nom">${esc(t(e.cle))}</span>
      ${(r => r ? `<span class="cal-yf-menu__repere">${esc(r)}</span>` : '')(repereYf(e.repere, d))}
    </a>`).join('')
  // Le pied. Les deux gestes touchent au reglage tarifaire : masques sans le
  // droit `reglages` en ecriture — et la garde REELLE reste le serveur, qui
  // refuse la bascule a qui ne l'a pas (`/api/yield-pilote`, reglages write).
  // Ici on ne fait qu'ouvrir une page : un masquage suffit a ne pas proposer
  // un geste impossible, il ne protege rien et n'a pas a le faire.
  const peutRegler = !etat.lectureSeule && peutEcrire('reglages')
  const pied = !peutRegler ? '' : on
    ? `<div class="cal-yf-menu__pied"><a class="link cal-yf-menu__lien" href="${esc(urlYf('prix', bien.id))}">${esc(t('cal.yf_settings'))}</a></div>`
    : `<div class="cal-yf-menu__pied"><a class="cal-yf-menu__activer" href="${esc(urlYf('prix', bien.id, { activer: '1' }))}">${esc(t('cal.yf_activate'))}</a></div>`
  return `<div class="cal-yf-menu__entete">
      <span class="cal-yf-menu__titre" id="h-yf">${esc(t('cal.yf_title'))}</span>
      <span class="cal-yf-menu__bien">${esc(bien.name || '')}</span>
      <span class="cal-yf-menu__pastille cal-yf-menu__pastille--${on ? 'on' : 'off'}">${esc(t(on ? 'cal.yf_state_on' : 'cal.yf_state_off'))}</span>
    </div>
    ${ajuste}${entrees}${pied}`
}

function placerMenuYf (bouton) {
  const menu = $('[data-bind="yf-menu"]')
  // Au telephone, le volet du bas est pose par la feuille de style : on EFFACE
  // les coordonnees du popover, sinon le style en ligne les garderait d'une
  // ouverture a l'autre quand on tourne l'appareil.
  if (!estLarge()) { menu.style.top = ''; menu.style.insetInlineStart = ''; return }
  const r = bouton.getBoundingClientRect()
  const large = menu.offsetWidth || 320
  const gauche = Math.min(Math.max(8, r.left), window.innerWidth - large - 8)
  const place = window.innerHeight - r.bottom
  menu.style.insetInlineStart = gauche + 'px'
  // Sous le bouton s'il y a la place, au-dessus sinon — un menu qui deborde
  // en bas de la fenetre est un menu qu'on ne lit pas.
  if (place < (menu.offsetHeight || 260) + 12 && r.top > place) {
    menu.style.top = Math.max(8, r.top - (menu.offsetHeight || 260) - 6) + 'px'
  } else {
    menu.style.top = (r.bottom + 6) + 'px'
  }
}

// ⚠ LE FOCUS NE SE REPREND QUE SUR UNE FERMETURE DEMANDEE — constat de la
// review du 28 octobre 2026. Le rendre a chaque chemin de fermeture faisait
// deux degats, tous deux invisibles au developpeur :
//   · l'hote ouvre le menu, puis clique une case de prix pour taper un
//     montant. La case est `tabIndex = 0` et sa saisie vit dans un `keydown` :
//     le clic dehors fermait le menu ET ramenait le focus sur le bouton, donc
//     le chiffre tape ensuite tombait sur le bouton. Aucun prix saisi, et rien
//     a l'ecran pour dire pourquoi.
//   · un defilement ferme le menu : `focus()` ramenait alors le bandeau du
//     bien dans la vue, donc DEFAISAIT le defilement de l'hote.
// Escape et le second clic sur le bouton sont des fermetures DEMANDEES : la
// main est au clavier, et lui rendre le focus est ce qu'on attend. Un clic
// ailleurs, un defilement, un redimensionnement ne le sont pas.
function fermerMenuYf ({ rendreLeFocus = false } = {}) {
  const menu = $('[data-bind="yf-menu"]')
  const voile = $('[data-bind="yf-voile"]')
  if (menu.hidden) return
  menu.hidden = true
  voile.hidden = true
  if (menuYf.bouton && document.contains(menuYf.bouton)) {
    menuYf.bouton.setAttribute('aria-expanded', 'false')
    if (rendreLeFocus) menuYf.bouton.focus()
  }
  menuYf.bien = null
  menuYf.bouton = null
}

async function ouvrirMenuYf (bienId, bouton) {
  const bien = etat.biens.find(b => b.id === bienId)
  if (!bien) return
  const dejaOuvert = menuYf.bien === bienId && !$('[data-bind="yf-menu"]').hidden
  // Second clic sur le MEME bouton : fermeture demandee, le focus lui revient.
  // Clic sur un AUTRE bouton : on ferme le premier sans lui rendre le focus,
  // sinon il reprendrait celui que le nouveau menu s'apprete a recevoir.
  fermerMenuYf({ rendreLeFocus: dejaOuvert })
  if (dejaOuvert) return
  const menu = $('[data-bind="yf-menu"]')
  const voile = $('[data-bind="yf-voile"]')
  menuYf.bien = bienId
  menuYf.bouton = bouton
  bouton.setAttribute('aria-expanded', 'true')
  // Le menu s'ouvre TOUT DE SUITE avec ce qu'on sait deja (l'etat du pilote,
  // le nom), et les reperes arrivent apres : un menu qui attend le reseau pour
  // s'afficher donne un ecran qui ne repond pas au doigt.
  menu.innerHTML = menuYfHtml(bien, null) + `<p class="cal-yf-menu__attente">${esc(t('common.loading'))}</p>`
  menu.hidden = false
  voile.hidden = estLarge()   // le voile n'est qu'au telephone
  placerMenuYf(bouton)
  menu.querySelector('.cal-yf-menu__entree')?.focus()
  let faits = null
  try {
    faits = await appel(`/api/yield-menu?bien=${encodeURIComponent(bienId)}`)
  } catch (e) {
    // ⚠ UNE PANNE DE REPERES NE FERME PAS LE MENU. Les quatre entrees mènent
    // a des pages qui savent se charger seules ; se taire sur les reperes est
    // exactement ce que la spec demande, et c'est tout ce qu'on perd.
    logger.error('Calendrier', 'menu yieldflow', e)
  }
  // L'hote a pu refermer, ou ouvrir un autre bien, pendant l'appel.
  if (menuYf.bien !== bienId || menu.hidden) return
  // ⚠ LE FOCUS NE SURVIT PAS A `innerHTML` — constat de la re-review du
  // 28 octobre 2026. Le noeud focalise est DETRUIT par le remplacement, et le
  // focus retombe sur `body` : un hote au clavier ouvre le menu, les reperes
  // arrivent cent millisecondes plus tard, et sa tabulation repart du haut du
  // document alors que le menu est ouvert. On ne le rend que s'il etait
  // DEDANS — sinon on le volerait a l'endroit ou l'hote l'a mis entre-temps.
  const focusDedans = menu.contains(document.activeElement)
  menu.innerHTML = menuYfHtml(bien, faits)
  if (focusDedans) menu.querySelector('.cal-yf-menu__entree')?.focus()
  placerMenuYf(bouton)
}

function brancherYf (zone) {
  zone.querySelectorAll('[data-yf]').forEach(b =>
    b.addEventListener('click', (e) => { e.stopPropagation(); ouvrirMenuYf(b.dataset.yf, b) }))
}
// Fermetures : le voile, la touche d'echappement, un clic dehors, et tout
// defilement — le popover est place en coordonnees FIXES, donc il se
// decrocherait de son bouton. Meme regle que le menu de l'angle de la bande.
$('[data-bind="yf-voile"]').addEventListener('click', () => fermerMenuYf())
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermerMenuYf({ rendreLeFocus: true }) })
document.addEventListener('click', (e) => {
  if (menuYf.bien && !e.target.closest('[data-bind="yf-menu"]') && !e.target.closest('[data-yf]')) fermerMenuYf()
})
// ⚠ `() => fermerMenuYf()` ET NON `fermerMenuYf` : passee directement, la
// fonction recevrait l'EVENEMENT comme premier argument, et `rendreLeFocus`
// serait lu dessus. Il vaut `undefined` aujourd'hui, donc le defaut serait
// inerte — et il cesserait de l'etre le jour ou un objet d'options porterait
// un nom present sur un evenement.
window.addEventListener('scroll', () => fermerMenuYf(), { passive: true })
$('[data-bind="planning"]').addEventListener('scroll', () => fermerMenuYf(), { passive: true })
window.addEventListener('resize', () => fermerMenuYf())

// ─── L'ORDRE des biens : la liste etat.choisis, persistee et COMMUNE aux
//     deux ecrans. On attrape un bloc par la POIGNEE de son bandeau ; au
//     doigt, la section sous le doigt devient la cible.
// Réordonner les blocs : LE module partagé (shared/reordonner-biens.js),
// souris et doigt — la page Ménages branche exactement le même geste.
function brancherDrag (zone) {
  brancherReordonnancement(zone, {
    ordre: () => etat.choisis,
    onOrdre: (liste) => { etat.choisis = liste; etat.choisisDefinis = true; ecrirePrefs(); renderTout() }
  })
}
function deplacerBien (id, cibleId) {
  const liste = deplacer(etat.choisis, id, cibleId)
  if (!liste) return
  etat.choisis = liste
  etat.choisisDefinis = true
  ecrirePrefs(); renderTout()
}
function renderBulles () {
  const zone = $('[data-bind="bulles"]')
  zone.innerHTML = estLarge() ? '' : bullesHtml()
  brancherBulles(zone)
}
// Le bouton « reduire » d'un bloc : le bien repart en bulle (persiste).
function reduireBien (id) {
  etat.choisis = etat.choisis.filter(x => x !== id)
  etat.choisisDefinis = true
  viderSelection(); ecrirePrefs(); renderTout()
}
function renderBandeaux () {
  $('[data-bind="avis-lecture"]').hidden = !etat.lectureSeule
  const beds = etat.biens.filter(b => b.provider === 'beds24')
  const avisB = $('[data-bind="avis-beds24"]')
  avisB.hidden = !beds.length
  if (beds.length) {
    avisB.textContent = t(beds.length === etat.biens.length ? 'cal.beds24_all' : 'cal.beds24_some',
      { noms: beds.map(b => b.name).join(', ') })
  }
  const vide = $('[data-bind="etat-vide"]')
  const aucun = !etat.biens.filter(b => b.provider !== 'beds24').length
  vide.hidden = !aucun
  if (aucun) {
    vide.innerHTML = beds.length
      ? `<p class="muted">${esc(t('cal.empty_beds24'))}</p>`
      : (peutEcrire('reservations') && !etat.lectureSeule
        ? `<p class="muted">${esc(t('cal.empty_owner'))}</p><a class="btn btn--primary" href="/pages/onboarding.html">${esc(t('cal.connect'))}</a>`
        : `<p class="muted">${esc(t('cal.empty_member'))}</p>`)
  }
}

// ─── Rendu ordinateur : planning multi-biens ────────────────────────────────
// Les VUES de la ligne de donnees — LA MEME liste et la MEME valeur sur les
// deux ecrans (13 octobre : le fonctionnement du telephone, « au lieu du
// prix on affiche la donnee selectionnee », remplace les lignes a cocher).
const VUES = [
  { id: 'rate', cle: 'cal.row_price' },
  { id: 'minStayArr', cle: 'cal.param_minStayArr' },
  { id: 'minStayThrough', cle: 'cal.param_minStayThrough' },
  { id: 'maxStay', cle: 'cal.param_maxStay' },
  { id: 'avail', cle: 'cal.param_avail' },
  { id: 'cta', cle: 'cal.param_cta' },
  { id: 'ctd', cle: 'cal.param_ctd' },
  { id: 'stopSell', cle: 'cal.param_stopSell' }
]
const VUES_OUVERT_FERME = new Set(PARAMS.filter(p => p.type === 'openclosed').map(p => p.key))
function valeurDeVue (e, s, bien) {
  if (etat.vueMobile === 'rate') return prixAffiche(e, s, bien)
  const v = s[etat.vueMobile]
  return VUES_OUVERT_FERME.has(etat.vueMobile)
    ? (v === 'closed' ? '✕' : '·') : (v ? String(v) : '·')
}
function libelleVue () {
  const v = VUES.find(x => x.id === etat.vueMobile) || VUES[0]
  return t(v.cle)
}
// Le selecteur de vue vit dans la nav (sa place), rempli pareil pour les
// deux ecrans ; le telephone le DEPLACE ensuite dans le bandeau du bien.
function majSelecteurVue () {
  const sel = $('[data-bind="vue-mobile"]')
  const nav = $('.cal-nav')
  if (nav && sel.parentElement !== nav) nav.insertBefore(sel, nav.querySelector('[data-bind="menu-plus"]'))
  sel.hidden = false
  sel.innerHTML = VUES.map(v => `<option value="${v.id}" ${etat.vueMobile === v.id ? 'selected' : ''}>${esc(t(v.cle))}</option>`).join('')
  return sel
}
function renderPlanning () {
  const planning = $('[data-bind="planning"]')
  planning.hidden = false
  $('[data-bind="mois-libelle"]').hidden = true
  majSelecteurVue()
  const jours = etat.jours
  if (!jours.length) return
  // Bande mois + jours, UNE fois pour tous les biens (décision 21/09/2026) —
  // le composant PARTAGÉ avec la page Ménages (shared/bande-jours.js).
  const { mois: bandeMois, jours: bandeJours } = bandeJoursHtml({
    jours: jours.map(toISO), langue: langue(), aujourdhui: AUJOURDHUI, esc
  })
  const bande = $('[data-bind="bande"]')
  const menuOuvert = !!bande.querySelector('.cal-angle__menu[open]')
  bande.innerHTML = `<div class="cal-bande__angle">${angleHtml()}</div>
    <div class="cal-bande__corps"><div class="cal-bande__l">${bandeMois}</div><div class="cal-bande__l">${bandeJours}</div></div>`
  brancherAngle(bande)
  if (menuOuvert) { const d = bande.querySelector('.cal-angle__menu'); if (d) d.open = true }
  $('[data-bind="legende-canaux"]').innerHTML = ['airbnb', 'booking', 'direct'].map(f =>
    `<span class="cal-legende__pt cal-barre--${f}"></span>${esc(LIBELLE_CANAL[f])}`).join(' · ')
    + ` · <span class="cal-legende__pt cal-legende__pt--blocage"></span>${esc(t('cal.blocked'))}`
  const aPilotables = etat.biens.some(b => b.provider !== 'beds24')
  const fonds = fondsResas()
  $('[data-bind="grilles"]').innerHTML = etat.choisis.length
    ? etat.choisis.map(id => grilleBien(id, fonds)).join('')
    : (aPilotables ? `<p class="muted" style="padding: 24px 16px">${esc(t('cal.all_reduced'))}</p>` : '')
  brancherPlanning()
  // Un re-render (changement de vue) reconstruit les cellules : la
  // selection en cours se repeint, sinon la flottante agit sur des nuits
  // invisibles (revue de a8debbf).
  if (etat.sel && etat.sel.a != null) peindreSelectionDesktop()
}
function grilleBien (bienId, fonds) {
  const bien = etat.biens.find(b => b.id === bienId) || {}
  const jours = etat.jours
  const st = etat.states[bienId] || {}
  const orphelines = etat.orphelines.get(bienId) || new Set()
  // Ligne des reservations : barres positionnees en colonnes.
  const resas = st.__resas || []
  const barres = resas.map(r => {
    const co = String(r.checkout).slice(0, 10)
    // CHEVAUCHEMENT : un sejour couvrant toute la plage visible avait ses
    // deux bornes hors fenetre et disparaissait (review).
    if (co <= etat.joursISO[0] || r.startISO > etat.joursISO[etat.joursISO.length - 1]) return ''
    const i0 = etat.joursISO.indexOf(r.startISO)
    const i1 = etat.joursISO.indexOf(co)
    const debut = i0 < 0 ? 0 : i0, fin = i1 < 0 ? etat.joursISO.length : i1
    const famille = familleSource(r.sourceBrute || r.source)
    const terminee = String(r.checkout).slice(0, 10) <= AUJOURDHUI
    // Sur la barre : le PRENOM (les initiales si une seule nuit) ; le nom
    // complet, les dates et le canal restent dans l'infobulle.
    const mots = String(r.name || '').trim().split(/\s+/).filter(Boolean)
    const court = (fin - debut) <= 1
      ? mots.map(m => m[0].toUpperCase()).join('')
      : (mots[0] || '')
    const canal = LIBELLE_CANAL[famille] || (r.sourceBrute || r.source || '')
    const total = r.amount != null ? t('cal.fiche_montant') + ' ' + prixIntl(r.amount, r.currency || bien.currency, langue()) : null
    return `<button type="button" class="cal-barre cal-barre--${famille}${terminee ? ' cal-barre--finie' : ''}${i0 < 0 ? ' cal-barre--coupe-g' : ''}${i1 < 0 ? ' cal-barre--coupe-d' : ''}"
      style="--d:${debut};--f:${fin}" ${r.id ? `data-resa="${esc(String(r.id))}"` : ''} data-bien="${esc(bienId)}"
      title="${esc((r.name || '') + ' · ' + dateIntl(r.startISO, langue()) + ' → ' + dateIntl(r.checkout, langue()) + ' · ' + canal + (total ? ' · ' + total : '') + (terminee ? ' · ' + t('cal.stay_over') : ''))}">${esc(court)}</button>`
  }).join('')
  const ref = String(bien.provider_property_id || '')
  const premierISO = etat.joursISO[0], dernierISO = etat.joursISO[etat.joursISO.length - 1]
  const blocages = ((etat.fermetures[bienId] || etat.fermetures[ref]) || []).map(f => {
    const fd = String(f.date_debut).slice(0, 10), ff = String(f.date_fin).slice(0, 10)
    // CHEVAUCHEMENT, pas « une borne visible » : un blocage couvrant toute la
    // plage avait ses deux bornes hors fenetre et disparaissait (review).
    if (ff < premierISO || fd > dernierISO) return ''
    const i0 = etat.joursISO.indexOf(fd), i1 = etat.joursISO.indexOf(ff)
    const debut = i0 < 0 ? 0 : i0, fin = (i1 < 0 ? etat.joursISO.length : i1 + 1)
    return `<button type="button" class="cal-barre cal-barre--blocage" style="--d:${debut};--f:${fin}"
      data-blocage="${esc(String(f.id))}" data-bien="${esc(bienId)}"
      title="${esc(t('cal.blocked_title', { du: dateIntl(f.date_debut, langue()), au: dateIntl(f.date_fin, langue()), raison: f.raison || '' }))}">${esc(f.raison || t('cal.blocked'))}</button>`
  }).join('')
  // Ligne de la DONNEE SELECTIONNEE (prix par defaut) : une cellule par
  // nuit, COULEUR = ETAT (§4.1) — la meme valeur que les cases du telephone.
  const cellules = etat.joursISO.map((iso, i) => {
    const s = st[iso] || {}
    const e = etatNuit(bienId, iso)
    const passe = iso < AUJOURDHUI
    const valeur = valeurDeVue(e, s, bien)
    const we = classesWE(new Date(iso + 'T12:00:00').getDay())
    return `<td class="cal-nuit cal-nuit--${e}${passe ? ' cal-nuit--passe' : ''}${we}"
      data-bien="${esc(bienId)}" data-i="${i}" data-iso="${iso}"${passe ? ' aria-disabled="true"' : ''}>
      ${orphelines.has(iso) ? `<span class="cal-orpheline" title="${esc(t('cal.orphan_hint'))}">${icone('i-alert')}</span>` : ''}
      <span class="cal-nuit__prix${etat.vueMobile === 'rate' && s.sansPrix && e !== 'attente' ? ' muted' : ''}">${esc(valeur)}</span>
    </td>`
  }).join('')
  return `<section class="cal-bien" data-bien-section="${esc(bienId)}">
    ${identiteBien(bien)}
    <div class="cal-bien__cadre">
      <div class="cal-bien__ligne">
        <div class="cal-bien__coin"><span class="caption">${esc(t('cal.row_resas'))}</span></div>
        <div class="cal-bien__resas" style="--n:${etat.joursISO.length}"><span class="cal-resas__fond">${fonds}</span>${barres}${blocages}</div>
      </div>
      <table class="cal-table"><tbody>
        <tr data-ligne-prix><th class="cal-libelle caption">${esc(libelleVue())}</th>${cellules}</tr>
      </tbody></table>
    </div>
  </section>`
}

// ─── Rendu téléphone : grille mensuelle ─────────────────────────────────────
function renderGrilleMobile () {

  // Multi-biens au telephone (13 octobre) : le mois et le selecteur de vue

  $('[data-bind="mois-libelle"]').hidden = true
  const sel = majSelecteurVue()
  if (!etat.choisis.length) {
    sel.hidden = true
    zone.innerHTML = etat.biens.some(b => b.provider !== 'beds24')
      ? `<p class="muted">${esc(t('cal.all_reduced'))}</p>` : ''
    return
  }
  const moisTitre = dateIntl(`${etat.annee}-${String(etat.mois + 1).padStart(2, '0')}-01`, langue(), { month: 'long', year: 'numeric' })

// Le calendrier d'UN bien au telephone : bandeau (nom au-dessus), en-tetes
// de jours, semaines avec leur calque de barres.
function blocBienMobile (bienId) {
  const bien = etat.biens.find(b => b.id === bienId) || {}
  const st = etat.states[bienId] || {}
  const orphelines = etat.orphelines.get(bienId) || new Set()
  const premier = new Date(etat.annee, etat.mois, 1)
  const dernier = new Date(etat.annee, etat.mois + 1, 0)
  const decale = (premier.getDay() + 6) % 7   // Lun=0
  const entetes = [1, 2, 3, 4, 5, 6, 0].map(d =>
    `<span class="cal-mois__jour caption muted${classesWE(d)}">${esc(new Intl.DateTimeFormat(langue(), { weekday: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(2024, 0, d === 0 ? 7 : d))))}</span>`).join('')
  const cells = []
  for (let i = 0; i < decale; i++) cells.push(null)
  for (let j = 1; j <= dernier.getDate(); j++) {
    const dte = new Date(etat.annee, etat.mois, j)
    cells.push({ j, iso: toISO(dte), dow: dte.getDay() })
  }
  while (cells.length % 7 !== 0) cells.push(null)
  const resas = st.__resas || []
  const ref = String(bien.provider_property_id || '')
  const fermes = (etat.fermetures[bienId] || etat.fermetures[ref]) || []
  let semaines = ''
  for (let w = 0; w < cells.length / 7; w++) {
    const slice = cells.slice(w * 7, w * 7 + 7)
    const isoByCol = slice.map(c => c && c.iso)
    const cases = slice.map(c => {
      if (!c) return '<span class="cal-case cal-case--vide"></span>'
      const { j, iso } = c
      const s = st[iso] || {}
      const e = etatNuit(bienId, iso)
      const passe = iso < AUJOURDHUI
      const valeur = valeurDeVue(e, s, bien)
      const selection = etat.sel && etat.sel.bien === bienId && etat.sel.duIso && iso >= etat.sel.duIso && iso <= etat.sel.auIso
      return `<button type="button" class="cal-case cal-nuit--${e}${passe ? ' cal-nuit--passe' : ''}${classesWE(c.dow)}${iso === AUJOURDHUI ? ' cal-auj' : ''}${selection ? ' cal-case--sel' : ''}"
        data-case="${iso}" data-bien="${esc(bienId)}" ${passe ? 'data-passe="1" aria-disabled="true"' : ''}>
        <span class="cal-case__num">${j}</span>
        ${orphelines.has(iso) ? `<span class="cal-orpheline">${icone('i-alert')}</span>` : ''}
        <span class="cal-case__valeur">${esc(valeur)}</span>
      </button>`
    }).join('')
    const colW = 100 / 7
    let barres = ''
    for (const f of fermes) {
      const fd = String(f.date_debut).slice(0, 10), ff = String(f.date_fin).slice(0, 10)
      let a = -1, z = -1
      for (let col = 0; col < 7; col++) {
        const iso = isoByCol[col]; if (!iso) continue
        if (iso >= fd && iso <= ff) { if (a < 0) a = col; z = col }
      }
      if (a < 0) continue
      const debutIci = isoByCol[a] === fd, finIci = isoByCol[z] === ff
      barres += `<button type="button" class="cal-mbar cal-mbar--blocage${debutIci ? '' : ' cal-mbar--coupe-g'}${finIci ? '' : ' cal-mbar--coupe-d'}"
        style="left: calc(${a * colW}% + 2px); width: calc(${(z + 1 - a) * colW}% - 4px); z-index: 1"
        data-blocage="${esc(String(f.id))}" data-bien="${esc(bienId)}">${esc(debutIci ? (f.raison || t('cal.blocked')) : '')}</button>`
    }
    for (const r of resas) {
      const ci = r.startISO, co = String(r.checkout).slice(0, 10)
      let a = -1, z = -1
      for (let col = 0; col < 7; col++) {
        const iso = isoByCol[col]; if (!iso) continue
        if (iso >= ci && iso <= co) { if (a < 0) a = col; z = col }
      }
      if (a < 0) continue
      const commence = isoByCol[a] === ci, finit = isoByCol[z] === co
      const gauche = (a + (commence ? 0.5 : 0)) * colW
      const largeur = ((z + (finit ? 0.5 : 1)) - (a + (commence ? 0.5 : 0))) * colW
      if (largeur <= 0) continue
      const famille = familleSource(r.sourceBrute || r.source)
      const terminee = co <= AUJOURDHUI
      barres += `<button type="button" class="cal-mbar cal-barre--${famille}${commence ? '' : ' cal-mbar--coupe-g'}${finit ? '' : ' cal-mbar--coupe-d'}${terminee ? ' cal-mbar--finie' : ''}"
        style="left: calc(${gauche}% + 2px); width: calc(${largeur}% - 4px); z-index: 2"
        ${r.id ? `data-resa="${esc(String(r.id))}"` : ''} data-bien="${esc(bienId)}">${esc(commence ? (r.name || '') : '')}</button>`
    }
    semaines += `<div class="cal-sem">${cases}${barres ? `<span class="cal-sem__couche">${barres}</span>` : ''}</div>`
  }
  return `<section class="cal-bien-mobile" data-bien-section="${esc(bienId)}">
    ${identiteBien(bien, { mobile: true })}
    <div class="cal-mois__grille">${entetes}</div>
    <div class="cal-mois__semaines">${semaines}</div>
  </section>`
}

// ─── Sélection (les DEUX écrans) et barre flottante ─────────────────────────
function viderSelection () { etat.sel = null; peindreSelection(); renderFlottante() }
function joursSelection () {
  if (!etat.sel) return []
  if (etat.sel.a != null) {
    const [a, b] = [Math.min(etat.sel.a, etat.sel.b), Math.max(etat.sel.a, etat.sel.b)]
    return etat.joursISO.slice(a, b + 1).filter(iso => iso >= AUJOURDHUI)
  }
  return (etat.joursISO || []).filter(iso => iso >= etat.sel.duIso && iso <= etat.sel.auIso && iso >= AUJOURDHUI)
}
function renderFlottante () {
  const barre = $('[data-bind="flottante"]')
  const jours = joursSelection()
  // ⚠ LE RETOUR ANTICIPE DOIT LIBERER LA PLACE, SINON ELLE RESTE RESERVEE.
  // Trouve par le test de la reserve : vider la selection passait par ici et
  // laissait le bas de page degage pour une barre absente.
  if (!jours.length || etat.lectureSeule || !peutEcrire('reservations')) {
    barre.hidden = true
    reserverLaPlaceDeLaBarre(barre)
    degagerLaSelection()
    return
  }
  barre.hidden = false
  $('[data-bind="flottante-compte"]').textContent = t('cal.n_days', { n: jours.length })
  const bienId = etat.sel.bien
  const st = etat.states[bienId] || {}
  const toutFerme = jours.every(iso => nuitFermee(st[iso] || {}))
  // ⚠ BIEN PILOTE : LE REFUS SE VOIT AVANT LE GESTE, PAS APRES (decision de
  // Thierry du 21 octobre 2026, apres sa recette). La SELECTION reste — Fermer
  // et Bloquer en ont besoin sur un bien pilote — mais le bouton Prix s'affiche
  // grise des la selection, et la barre porte le message. Avant, on laissait
  // cliquer pour refuser ensuite : l'hote apprenait son droit par l'echec.
  const bienSel = etat.biens.find(b => b.id === bienId) || {}
  const pilote = bienSel.pilote_tarifaire === 'yieldflow'
  // LES CINQ ACTIONS, depuis le CONTRAT partagé (§14) — jamais une copie.
  $('[data-bind="flottante-actions"]').innerHTML = ACTIONS_BARRE.map(a => {
    const cle = a.id === 'fermer' && toutFerme ? a.cleInverse : a.cle
    const off = pilote && a.id === 'prix'
    return `<button type="button" class="btn ${a.id === 'prix' ? 'btn--primary' : 'btn--secondary'}" data-action="${a.id}"${off ? ` disabled aria-disabled="true" title="${esc(t('cal.piloted_price'))}"` : ''}>
      ${icone(a.icone)}${esc(t(cle))}${off ? `<span class="sr-only"> ${esc(t('cal.piloted_price'))}</span>` : ''}</button>`
  }).join('')
  const note = $('[data-bind="flottante-note"]')
  if (note) {
    note.textContent = pilote ? t('cal.piloted_price') : ''
    note.hidden = !pilote
  }
  barre.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => actionBarre(b.dataset.action, toutFerme)))
  reserverLaPlaceDeLaBarre(barre)
  degagerLaSelection()
}

// ⚠ LA BARRE EST ANCREE AU BAS DE LA FENETRE, PAS A LA SELECTION
// (`position: fixed; bottom: 76px`). Sur une fenetre peu haute elle remonte
// jusqu'au milieu de la page et tombe sur les lignes Prix : la case qu'il faut
// CLIQUER pour saisir est dessous. Mesure de la recette du 21 octobre, fenetre
// de 666 px : la barre atteignait y ~ 355, pile sur la ligne selectionnee —
// invisible sur un grand ecran, systematique sur un portable ou console
// ouverte. Le premier correctif masquait la barre PENDANT la saisie ; il ne
// reglait donc que le symptome d'apres, pas l'ACCES a la case.
//
// ⚠ ET ON N'ANCRE PAS LA BARRE A LA SELECTION, bien que ce soit le
// comportement « popover » attendu : il se calcule par `getBoundingClientRect`,
// que jsdom rend a zero — on livrerait de la geometrie qu'aucun test ne garde.
// C'est la meme raison qui a fait abandonner le glisser au doigt. A trancher
// par Thierry comme un lot a lui, avec un banc a mise en page reelle.
function reserverLaPlaceDeLaBarre (barre) {
  const page = document.querySelector('.cal-page')
  if (!page) return
  const h = barre && !barre.hidden ? (barre.offsetHeight || 0) : 0
  // la barre decolle de 76px du bas : on degage sa hauteur PLUS son decalage
  page.style.setProperty('--cal-reserve', h ? `${h + 88}px` : '0px')
}
// On ne defile qu'au CHANGEMENT de selection : sinon chaque rendu de la barre
// ramenerait la page sous le curseur de l'hote en pleine manipulation.
let derniereSelPeinte = null
function degagerLaSelection () {
  const jours = joursSelection()
  const signature = jours.length && etat.sel ? `${etat.sel.bien}|${jours[0]}|${jours[jours.length - 1]}` : null
  if (signature === derniereSelPeinte) return
  derniereSelPeinte = signature
  if (!signature) return
  const cible = document.querySelector(`[data-ligne-prix] .cal-nuit[data-bien="${CSS.escape(etat.sel.bien)}"][data-iso="${jours[0]}"]`)
    || document.querySelector(`.cal-case[data-bien="${CSS.escape(etat.sel.bien)}"][data-case="${jours[0]}"]`)
  if (!cible || typeof cible.scrollIntoView !== 'function') return
  try { cible.scrollIntoView({ block: 'center', behavior: 'auto' }) } catch {}
}
function actionBarre (id, toutFerme) {
  const jours = joursSelection()
  if (!jours.length) return
  // ⚠ UN BOUTON GRISE EST UN CONFORT, PAS UNE PROTECTION (regle absolue du
  // depot). `actionPrix` garde son refus, et celui-ci le double : un clic
  // programme sur le bouton desactive ne doit rien tenter.
  if (id === 'prix' && (etat.biens.find(b => b.id === etat.sel?.bien) || {}).pilote_tarifaire === 'yieldflow') {
    return toast(t('cal.piloted_price'), { duree: 7000 })
  }
  if (id === 'prix') { return actionPrix(jours) }
  if (id === 'fermer') { return toutFerme ? rouvrir(jours) : fermer(jours) }
  if (id === 'bloquer') { return ouvrirFormulaire('bloquer', jours) }
  if (id === 'reservation') { return ouvrirFormulaire('reservation', jours) }
  if (id === 'plus') { return ouvrirPopup(jours) }
}

// ⚠ TROIS INFORMATIONS, PAS UNE : d'ou part le geste, s'il a BOUGE, et s'il
// est parti DANS la selection deja posee. C'est la troisieme qui separe les
// deux gestes que l'hote attend — un GLISSER refait une selection, un CLIC
// SIMPLE dans la selection ouvre la saisie pour TOUTE la selection.
//
// Vecu (21 octobre 2026, « Ofuro Futari », rapporte par Thierry) : « je
// selectionne des jours, je clique dans la case, impossible d'ecrire
// dedans ». Aucun clic n'ouvrait la saisie — seul le bouton « Prix » de la
// barre flottante le faisait — et le `preventDefault()` du glisser empechait
// en plus la cellule de prendre le focus, donc la saisie au clavier ne
// partait jamais a la souris. Rien n'etait ecrit, et l'ecran ne disait rien.
let glisse = null
// Le geste du TELEPHONE (et de la vue etroite a la souris) vit lui aussi au
// module : `brancherMobile` est rappele a chaque rendu, un ecouteur de
// document pose la-dedans s'empilerait a chaque fois.
let glisseMobile = null, presseLongue = null
// ⚠ UN STYLET N'EST PAS UNE SOURIS. `=== 'touch'` rangeait le stylet (`'pen'`)
// et le pointeur indetermine (`''`, que la spec autorise) du cote de la
// SOURIS : le glisser posait alors une selection sans aucun appui long, et
// l'hote qui voulait faire defiler le mois au stylet se retrouvait avec trois
// nuits selectionnees, a un geste d'une ecriture de prix. La question n'est pas
// « est-ce un doigt » mais « est-ce une manipulation DIRECTE » — doigt, stylet,
// ou inconnu —, auquel cas l'appui long est necessaire pour ne pas voler le
// defilement.
const manipulationDirecte = (e) => (e.pointerType || '') !== 'mouse'
// ⚠ UN GESTE PERIME NE DOIT PAS SE REVEILLER SUR LE CLIC SUIVANT. Si le bouton
// est relache hors de la page (barre des taches, alt-tab, menu contextuel), le
// `mouseup`/`pointerup` ne nous parvient jamais et le geste reste arme : le
// prochain clic n'importe ou le cloturait, et la saisie de prix s'ouvrait
// toute seule. On jette donc le geste en cours au DEBUT de chaque nouvel
// appui — en phase de CAPTURE, donc avant le gestionnaire de la cellule, qui
// en pose un neuf juste apres. Releve en review de b238432.
document.addEventListener('mousedown', () => { glisse = null }, true)
// Le geste du telephone se cloture ICI, pour les deux sorties (relachement et
// annulation par le navigateur quand il prend la main pour faire defiler).
function finirGesteMobile (e) {
  if (!glisseMobile) return null
  // ⚠ UN SECOND DOIGT NE VOLE PAS LE GESTE DU PREMIER (constat 10) : seul le
  // pointeur qui a commence le geste peut le finir. Sans ce test, une pince ou
  // une paume posee a cote ouvrait la popup sur un jour jamais touche.
  if (e && e.pointerId != null && e.pointerId !== glisseMobile.id) return null
  const g = glisseMobile
  glisseMobile = null
  clearTimeout(presseLongue)
  return g
}
// ⚠ UN APPUI ABANDONNE N'EST PAS UN CLIC. `click` offrait gratuitement l'ancre
// « appuyer et relacher sur le MEME element » ; en passant au pointeur au
// niveau du document, on l'a perdue. L'hote qui appuie sur la mauvaise date,
// s'en apercoit, glisse hors de la grille et relache ailleurs voyait donc
// s'ouvrir la fiche du jour qu'il venait d'abandonner. On exige que le
// relachement atterrisse sur une case DU MEME BIEN.
const caseSousLeRelachement = (e, sel) =>
  (e && e.target && e.target.closest) ? e.target.closest(sel) : null
document.addEventListener('pointerup', (e) => {
  const g = finirGesteMobile(e)
  if (!g) return
  // Le geste a POSE une plage (glisser, ou appui long) : il n'ouvre rien.
  if (g.bouge || g.long) { renderFlottante(); return }
  const sur = caseSousLeRelachement(e, '.cal-case[data-case]')
  if (!sur || sur.dataset.bien !== g.bien || sur.dataset.case !== g.depuis) return
  agirSurLaCaseTapee(g.bien, g.depuis)
})
document.addEventListener('pointercancel', (e) => { finirGesteMobile(e) })

function brancherPlanning () {
  const zone = $('[data-bind="grilles"]')
  // Selection cliquer-glisser sur la ligne Prix, un bien a la fois ; jours
  // passes exclus cellule par cellule (A.3, conserve). `glisse` vit au
  // module : le mouseup qui la clot est PERMANENT et pose UNE fois (un
  // { once: true } par render etait consomme par le premier clic — review).
  zone.querySelectorAll('[data-ligne-prix] .cal-nuit').forEach(td => {
    td.addEventListener('mousedown', (e) => {
      if (etat.lectureSeule || !peutEcrire('reservations')) return
      if (venuDeLaSaisie(e)) return
      // ⚠ LE BOUTON DROIT ET LE BOUTON DU MILIEU NE GESTENT RIEN (constat 7).
      // Sans ce test, un clic droit dans la selection ouvrait la saisie de prix
      // DERRIERE le menu contextuel du navigateur, et refermer ce menu
      // enregistrait le prix pre-rempli.
      if (e.button !== 0) return
      if (td.dataset.iso < AUJOURDHUI) return
      const i = Number(td.dataset.i)
      glisse = { bien: td.dataset.bien, a: i, b: i, bouge: false, dansSel: dansSelectionDesktop(td.dataset.bien, i) }
      // Un clic DANS la selection ne la detruit pas : on attend de savoir si
      // le geste bouge. Hors selection, on selectionne tout de suite — l'hote
      // voit ou il en est.
      if (!glisse.dansSel) { etat.sel = { bien: glisse.bien, a: i, b: i }; peindreSelectionDesktop() }

      // La version du 21 octobre en posait un pour que le glisser ne
      // selectionne pas de texte — role que `.cal-nuit { user-select: none }`
      // (shared/ui.css) tient DEJA, et le glisser de reordonnancement est
      // ferme de son cote par `shared/reordonner-biens.js`, qui annule tout
      // `dragstart` non arme par la poignee.
      // Ce `preventDefault()` ne gagnait donc rien, et coutait trois defauts
      // mesures en review : il fallait rendre le focus a la main, ce focus
      // volait celui de la case de saisie ouverte, et le `blur` de cette case
      // ENREGISTRAIT le prix pre-rempli — un double-clic poussait quatre
      // nuits au canal sans que personne ait rien tape. Laisser le navigateur
      // faire : il donne le focus a la cellule, et la case de saisie garde le
      // sien.
    })
    td.addEventListener('mouseenter', (e) => {
      if (!glisse) return
      // ⚠ PLUS DE BOUTON TENU, PLUS DE GESTE (constat 6). Un survol sans
      // bouton faisait suivre la selection au curseur nu, apres un
      // relachement que la page n'avait jamais recu.
      if (e.buttons === 0) { glisse = null; return }
      // ⚠ `bouge` SE POSE AVANT LES REFUS (constat 8). Un glisser qui ne
      // traverse que des cases refusees — jours passes, autre bien — A BOUGE :
      // le compter comme un clic simple rouvrait la saisie sur l'ancienne
      // selection, et le `blur` suivant l'enregistrait.
      glisse.bouge = true
      if (td.dataset.bien !== glisse.bien) return
      if (td.dataset.iso < AUJOURDHUI) return
      glisse.b = Number(td.dataset.i)
      etat.sel = { bien: glisse.bien, a: glisse.a, b: glisse.b }
      peindreSelectionDesktop()
    })
    // Clavier : Entree / F2 / chiffre = saisie inline (A.5, conserve).
    td.addEventListener('keydown', (e) => {
      // Memes gardes que le pointeur : lecture seule et jour passe refusent
      // AUSSI au clavier (revue de 6f3d6af).
      if (etat.lectureSeule || !peutEcrire('reservations')) return
      if (venuDeLaSaisie(e)) return
      if (td.dataset.iso < AUJOURDHUI) return
      const chiffre = /^[0-9]$/.test(e.key)
      if (chiffre && etat.vueMobile !== 'rate') return
      if (e.key === 'Enter' || e.key === 'F2' || chiffre) {
        e.preventDefault()
        // ⚠ NE PAS ECRASER UNE SELECTION QUI CONTIENT DEJA CETTE CELLULE :
        // taper un chiffre juste apres un glisser doit viser les nuits
        // selectionnees, pas la seule case sous le curseur.
        const i = Number(td.dataset.i)
        if (!dansSelectionDesktop(td.dataset.bien, i)) etat.sel = { bien: td.dataset.bien, a: i, b: i }
        actionPrix(joursSelection(), chiffre ? e.key : '')
      }

  zone.querySelectorAll('[data-resa]').forEach(b => b.addEventListener('click', () => ouvrirFicheResa(b.dataset.bien, b.dataset.resa)))
  zone.querySelectorAll('[data-blocage]').forEach(b => b.addEventListener('click', () => ouvrirFicheBlocage(b.dataset.bien, b.dataset.blocage)))

  brancherDrag(zone)
}
// La navigation de mois (telephone) : UNE regle, sens 0 = retour au mois
// courant (le bouton « Aujourd'hui » du haut est masque au telephone).
function naviguerMois (sens) {
  if (sens === 0) { const d = new Date(); etat.annee = d.getFullYear(); etat.mois = d.getMonth() }
  else {
    etat.mois += sens
    if (etat.mois < 0) { etat.mois = 11; etat.annee-- }
    if (etat.mois > 11) { etat.mois = 0; etat.annee++ }
  }
  viderSelection(); ecrirePrefs(); charger()
}
// Peindre, pas re-rendre : un innerHTML au milieu d'un glisser detruit
// l'element sous le pointeur, et le geste s'arrete net.
// ⚠ ET LA PEINTURE DOIT SAVOIR EFFACER. `viderSelection` l'appelle avec
// `etat.sel` a null : sans ce cas, la selection restait DESSINEE apres un
// enregistrement, sur un etat qui n'existait plus (point 6 du 21 octobre).
function peindreSelectionDesktop () {
  const s = etat.sel
  const pose = !!s && s.a != null
  const a = pose ? Math.min(s.a, s.b) : -1
  const b = pose ? Math.max(s.a, s.b) : -1
  document.querySelectorAll('[data-ligne-prix] .cal-nuit').forEach(td => {
    const dans = pose && td.dataset.bien === s.bien
      && Number(td.dataset.i) >= a && Number(td.dataset.i) <= b && td.dataset.iso >= AUJOURDHUI
    td.classList.toggle('cal-nuit--sel', dans)
  })
}
function peindreSelectionMobile () {
  const s = etat.sel
  const pose = !!s && !!s.duIso
  document.querySelectorAll('[data-bind="grille-mobile"] .cal-case[data-case]').forEach(c => {
    const iso = c.dataset.case
    const dans = pose && c.dataset.bien === s.bien && iso >= s.duIso && iso <= s.auIso && iso >= AUJOURDHUI
    c.classList.toggle('cal-case--sel', dans)
