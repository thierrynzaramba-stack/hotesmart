const peindreSelection = () => (estLarge() ? peindreSelectionDesktop() : peindreSelectionMobile())
// La selection contient-elle DEJA cette nuit ? C'est ce qui distingue
// « je refais une selection » de « j'ouvre la saisie sur celle-ci ».
// ⚠ UN EVENEMENT NE DU CHAMP DE SAISIE N'EST PAS UN EVENEMENT DE LA CELLULE,
// meme s'il remonte jusqu'a elle. Le champ vit DANS la cellule : son
// `mousedown` et son `keydown` bulent. Sans cette sortie :
//   - cliquer dans le champ pour placer le curseur refaisait une selection
//     d'un jour, et le `preventDefault()` empechait la frappe (le defaut
//     rapporte par Thierry le 21 octobre) ;
//   - valider par Entree rouvrait IMMEDIATEMENT une nouvelle saisie, parce
//     que le `keydown` de la cellule voyait passer la meme touche — trouve
//     par le banc DOM, pas a la lecture.
const venuDeLaSaisie = (e) => !!(e.target && e.target.closest && e.target.closest('.cal-nuit__saisie'))
function dansSelectionDesktop (bienId, i) {
  const s = etat.sel
  return !!s && s.a != null && s.bien === bienId
    && i >= Math.min(s.a, s.b) && i <= Math.max(s.a, s.b)
}
function brancherMobile () {
  const zone = $('[data-bind="grille-mobile"]')
  // Appui court = popup Configurer pre-remplie sur ce jour (arbitrage (a) :
  // le detail de nuit viendra a l'etape 2) ; appui LONG puis glisser =
  // selection -> barre d'actions (§9). Jour passe : rien (garde commune).
  // MULTI-BIENS : chaque case porte SON bien — la popup et la selection
  // visent le bien tape, jamais le premier de la liste.
  // ⚠ POINTEUR, PLUS TOUCHER (point 5 du 21 octobre 2026, constate en prod).
  // `touchstart` n'existe pas a la souris : sous 900 px avec une souris — une
  // fenetre d'ordinateur reduite —, AUCUNE selection n'etait possible et
  // chaque clic rouvrait la popup du jour. Les evenements de pointeur servent
  // les deux entrees, et c'est `pointerType` qui decide de l'appui long : au
  // doigt il est NECESSAIRE (sinon le scroll selectionnerait), a la souris il
  // n'a pas de sens — le bouton tenu suffit.
  zone.querySelectorAll('[data-case]').forEach(c => {
    const iso = c.dataset.case
    const bienId = c.dataset.bien
    c.addEventListener('pointerdown', (e) => {
      if (iso < AUJOURDHUI || etat.lectureSeule || !peutEcrire('reservations')) return
      // Bouton droit ou milieu : rien (constat 7). Un doigt n'a pas de bouton.
      if (manipulationDirecte(e) === false && e.button !== 0) return
      if (glisseMobile) {
        // Un second DOIGT ne vole pas le geste du premier (constat 10) ; un
        // geste de SOURIS perime — bouton relache hors de la page — se
        // remplace.
        if (glisseMobile.direct) return
        finirGesteMobile(null)
      }
      glisseMobile = { id: e.pointerId, bien: bienId, depuis: iso, bouge: false, long: false,
        direct: manipulationDirecte(e) }
      if (!glisseMobile.direct) return
      presseLongue = setTimeout(() => {
        if (!glisseMobile) return
        glisseMobile.long = true
        etat.sel = { bien: bienId, duIso: iso, auIso: iso }
        peindreSelectionMobile(); renderFlottante()
      }, 450)
    })
    c.addEventListener('pointerenter', (e) => {
      // ⚠ A LA SOURIS SEULEMENT, ET C'EST UNE LIMITE ASSUMEE. Un pointeur
      // TACTILE est capture implicitement par la case ou il a commence :
      // `pointerenter` n'atteint JAMAIS ses voisines. Le commentaire du
      // 21 octobre promettait « appui long puis glisser » au doigt — ce geste
      // n'a jamais pu fonctionner, ni avant ni apres. Au doigt, l'extension se
      // fait par TAP sur une seconde date (agirSurLaCaseTapee) ; l'etendre au
      // glisser demanderait `pointermove` + `elementFromPoint`, donc de la
      // geometrie, que jsdom ne sait pas rendre — on ne livre pas un geste
      // qu'aucun test ne peut prouver.
      if (!glisseMobile || glisseMobile.direct) return
      if (e.buttons === 0) { finirGesteMobile(null); return }
      glisseMobile.bouge = true
      if (glisseMobile.bien !== bienId) return
      if (iso < AUJOURDHUI) return
      const [du, au] = [glisseMobile.depuis, iso].sort()
      etat.sel = { bien: bienId, duIso: du, auIso: au }
      // Peindre, JAMAIS re-rendre : un innerHTML sous le pointeur arreterait
      // le geste en detruisant la case survolee.
      peindreSelectionMobile(); renderFlottante()
    })
    // ⚠ LES CASES SONT DES BOUTONS FOCALISABLES, DONC ELLES DOIVENT REPONDRE
    // AU CLAVIER (constat 5, et c'est deja grave dans
    // apps/menages/prestataires.html). Entree et Espace produisent un `click`
    // SANS aucun evenement de pointeur : en remplacant `click` par le
    // pointeur, la version du 21 octobre avait rendu chaque case muette au
    // clavier et a la technologie d'assistance. `detail === 0` distingue le
    // clic synthetique du clavier de celui qui suit un geste de pointeur.
    c.addEventListener('click', (e) => {
      if (iso < AUJOURDHUI || etat.lectureSeule || !peutEcrire('reservations')) return
      if (e.detail > 0) return
      agirSurLaCaseTapee(bienId, iso)
    })
  })
  zone.querySelectorAll('[data-reduire]').forEach(b => b.addEventListener('click', () => reduireBien(b.dataset.reduire)))
  zone.querySelectorAll('[data-resa]').forEach(b => b.addEventListener('click', () => ouvrirFicheResa(b.dataset.bien, b.dataset.resa)))
  zone.querySelectorAll('[data-blocage]').forEach(b => b.addEventListener('click', () => ouvrirFicheBlocage(b.dataset.bien, b.dataset.blocage)))
  // ‹ mois › global, bouton + PAR BIEN (arrivee aujourd'hui par defaut),
  // et reordonnancement par la poignee du bandeau.
  zone.querySelectorAll('[data-mois-nav]').forEach(b => b.addEventListener('click', () => naviguerMois(Number(b.dataset.moisNav))))
  // ⚠ `viderSelection()`, PAS `etat.sel = null` (constat 9). Le raccourci
  // laissait la barre d'actions AFFICHEE, annoncant deux nuits, avec tous ses
  // boutons inertes — le defaut exact que le point 6 dit fermer ailleurs.
  zone.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', () => { viderSelection(); ouvrirFormulaire('reservation', [AUJOURDHUI], b.dataset.plus) }))
  brancherYf(zone)
  brancherDrag(zone)
}

// ─── Écritures : save + verdicts + « Annuler » (vraie écriture inverse) ─────
function verdictToast (r) {
  if (!r) return
  if (r.config_saved === false) return toast(t('cal.save_error'), { erreur: true, duree: 8000 })
  if (r.push_failed) return toast(t('cal.push_failed'), { erreur: true, duree: 12000 })
  if (r.local_only) return toast(t('cal.local_only'), { duree: 8000 })
  if (r.warnings && r.warnings.length) toast(String(r.warnings[0]), { duree: 8000 })
  if (r.task_ids && (r.task_ids.restrictions || r.task_ids.availability)) {
    const ids = [r.task_ids.restrictions, r.task_ids.availability].filter(Boolean).join(', ')
    try { navigator.clipboard.writeText(ids) } catch {}
    toast(t('cal.task_copied', { ids }), { duree: 6000 })
  }
}
// Enregistre des segments et propose « Annuler » : les valeurs PRECEDENTES
// des dates touchees sont relevees AVANT l'ecriture, et « Annuler » les
// REECRIT par le meme writer — jamais un undo d'affichage (§11.1).
async function saveAvecAnnulation (bienId, segments, { cle = 'rate', valeursAvant = null, sansPrix = 0 } = {}) {
  try {
    const r = await appel('/api/calendar', { action: 'save', property_id: bienId, segments })
    verdictToast(r)
    if (r && r.config_saved !== false && !r.push_failed && valeursAvant && valeursAvant.length) {
      toast(t('cal.saved'), {
        duree: 10000,
        annuler: async () => {
          try {
            const inverse = valeursAvant.map(v => ({ date_from: v.iso, date_to: v.iso, [cle]: v.valeur }))
            const r2 = await appel('/api/calendar', { action: 'save', property_id: bienId, segments: inverse })
            verdictToast(r2)
            if (sansPrix > 0) toast(t('cal.undo_partial', { n: sansPrix }), { duree: 8000 })
            await charger()
          } catch (e) { logger.error('Calendrier', 'annulation', e); toast(t('cal.save_error'), { erreur: true }) }
        }
      })
    }
    await charger()
    return r
  } catch (e) {
    // Bien pilote par YieldFlow : le refus tarifaire du serveur, en clair,
    // AVANT toute mutation locale (texte-contrat, §13).
    if (e.code === 'pilote_yieldflow' || /yieldflow/i.test(e.message || '')) {
      toast(t('cal.piloted_price'), { erreur: true, duree: 8000 })
    } else {
      logger.error('Calendrier', 'save', e)
      toast(e.message || t('cal.save_error'), { erreur: true, duree: 8000 })
    }
    return null
  }
}
// Prix : saisie INLINE dans la premiere cellule selectionnee (A.6 conserve,
// jamais un prompt) ; au telephone, la popup s'ouvre sur la rubrique prix.
function actionPrix (jours, amorce = '') {
  const bienId = etat.sel.bien
  const bien = etat.biens.find(b => b.id === bienId) || {}
  // Bien pilote : refus AVANT toute saisie (A.6, texte-contrat §13).
  if (bien.pilote_tarifaire === 'yieldflow') {
    return toast(t('cal.piloted_price'), { duree: 7000 })
  }
  if (!estLarge() || etat.vueMobile !== 'rate') return ouvrirPopup(jours, 'rate')
  const premier = jours[0]
  const td = document.querySelector(`[data-ligne-prix] .cal-nuit[data-bien="${CSS.escape(bienId)}"][data-iso="${premier}"]`)
  if (!td) return
  const valeurActuelle = etat.states[bienId]?.[premier]?.rate
  const html = td.innerHTML
  td.innerHTML = `<input class="cal-nuit__saisie" type="text" inputmode="decimal" value="${esc(amorce || (valeurActuelle != null ? String(valeurActuelle) : ''))}">`
  const input = td.querySelector('input')
  input.focus()
  // ⚠ RECETTE DU 21 OCTOBRE : `select()` SUR UNE AMORCE PERDAIT LE CHIFFRE.
  // Selection puis touche « 1 » : la saisie s'ouvrait avec « 1 » DEJA
  // SELECTIONNE, donc la frappe suivante le remplacait — taper 175 donnait 75,
  // et 75 partait au canal. Sur une amorce, le curseur va donc en FIN de
  // texte ; sur une valeur existante, `select()` reste juste, c'est ce qui
  // permet de retaper un prix par-dessus l'ancien.
  if (amorce) { const n = input.value.length; input.setSelectionRange(n, n) } else { input.select() }
  // ⚠ LA BARRE FLOTTANTE RECOUVRAIT LA SAISIE (meme recette) : elle est fixee
  // en bas au centre, et quand la ligne selectionnee tombe dessous, la case en
  // cours d'edition est invisible. On la retire pendant la saisie — elle n'y
  // sert a rien, et c'est une cible de clic en moins, donc un `blur` en moins.
  const barre = $('[data-bind="flottante"]')
  const barreEtaitVisible = barre && !barre.hidden
  if (barre) barre.hidden = true
  // ⚠ ET LE `blur` N'ENREGISTRE QUE CE QUE QUELQU'UN A TAPE. Thierry a demande
  // la validation « par clic ailleurs » : elle reste. Mais la saisie est
  // pre-remplie avec le prix du PREMIER jour et vaut pour TOUTE la plage —
  // donc un clic ailleurs sans frappe poussait le prix du jour 1 sur les jours
  // 2 a N, que personne n'avait tape. Mesure de la recette : saisie ouverte sur
  // 180, clic sur une autre cellule, POST rate 180 et toast « Enregistre ».
  // Mon test ne l'avait pas vu parce que sa fixture n'avait AUCUN prix
  // pre-rempli : le refus « prix invalide » rendait le vert pour la mauvaise
  // raison. Un test doit contenir la condition que son nom annonce.
  let touche = !!amorce
  input.addEventListener('input', () => { touche = true })
  let fini = false
  const terminer = (commit) => {
    if (fini) return
    fini = true
    const brut = input.value
    td.innerHTML = html
    if (barreEtaitVisible && barre) barre.hidden = false
    if (!commit) return
    const prix = Number(String(brut).replace(',', '.'))
    if (!Number.isFinite(prix) || prix <= 0) return toast(t('cal.price_invalid'), { erreur: true })
    const inv = etat.inv[bienId] || {}
    const valeursAvant = jours.map(iso => ({ iso, valeur: inv[iso] && inv[iso].rate != null ? inv[iso].rate : null }))
      .filter(v => v.valeur != null)
    const segments = [{ date_from: premier, date_to: jours[jours.length - 1], rate: prix }]
    viderSelection()
    saveAvecAnnulation(bienId, segments, { valeursAvant, sansPrix: jours.length - valeursAvant.length })
  }
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') terminer(true)
    if (e.key === 'Escape') terminer(false)
  })
  input.addEventListener('blur', () => terminer(touche))
}
// Fermer / Rouvrir a la vente : regles A.5 MOT POUR MOT.
async function fermer (jours) {
  const bienId = etat.sel.bien
  const bien = etat.biens.find(b => b.id === bienId) || {}
  // Bien pilote YieldFlow : un stop_sell nu serait indistinguable d'une
  // fermeture calculee du moteur -> bascule vers « Bloquer les dates ».
  if (bien.pilote_tarifaire === 'yieldflow') return ouvrirFormulaire('bloquer', jours)
  const segments = plagesContigues(jours).map(p => ({ date_from: p[0], date_to: p[1], stop_sell: true }))
  viderSelection()
  await saveAvecAnnulation(bienId, segments, { valeursAvant: null })
}
async function rouvrir (jours) {
  const bienId = etat.sel.bien
  // Nuit couverte par un blocage : refus + fiche (le serveur refuse 409 de meme).
  const bloquee = jours.find(iso => fermeeParBlocage(bienId, iso))
  if (bloquee) {
    toast(t('cal.blocked_reopen'), { erreur: true, duree: 7000 })
    const ref = String(etat.biens.find(b => b.id === bienId)?.provider_property_id || '')
    const f = ((etat.fermetures[bienId] || etat.fermetures[ref]) || []).find(f => bloquee >= String(f.date_debut).slice(0, 10) && bloquee <= String(f.date_fin).slice(0, 10))
    if (f) ouvrirFicheBlocage(bienId, String(f.id))
    viderSelection()
    return
  }
  const segments = plagesContigues(jours).map(p => ({ date_from: p[0], date_to: p[1], stop_sell: false, avail: 1 }))
  viderSelection()
  await saveAvecAnnulation(bienId, segments, { valeursAvant: null })
}
function plagesContigues (jours) {
  const plages = []
  let debut = jours[0], prec = jours[0]
  for (const iso of jours.slice(1)) {
    const attendu = toISO(new Date(new Date(prec + 'T12:00:00').getTime() + 86400000))
    if (iso !== attendu) { plages.push([debut, prec]); debut = iso }
    prec = iso
  }
  plages.push([debut, prec])
  return plages
}

function joursCochés (corps, id) {
  return new Set([...corps.querySelectorAll(`[data-chip="${id}"]:checked`)].map(x => Number(x.value)))
}
function datesDeLaPlage (corps) {
  // SERRAGE a aujourd'hui, les deux ecrans (constat 5) ; plage passee = refus.
  let du = corps.querySelector('[data-champ="cfg-du"]').value
  const au = corps.querySelector('[data-champ="cfg-au"]').value
  if (du < AUJOURDHUI) du = AUJOURDHUI
  if (!du || !au || au < du) return null
  const dates = []
  for (let d = new Date(du + 'T12:00:00'); toISO(d) <= au; d.setDate(d.getDate() + 1)) dates.push(toISO(d))
  return dates
}
async function enregistrerPopup (bienId, corps) {
  const bien = etat.biens.find(b => b.id === bienId) || {}
  const dates = datesDeLaPlage(corps)
  if (!dates) return noteFeuille(t('cal.range_invalid'))
  const segments = []
  // Prix : mode set = un segment par PLAGE contigue (90 jours faisaient 90
  // segments — review) ; inc/dec = un segment PAR date, le calcul depend de
  // la valeur actuelle de chaque nuit.
  const rvBrut = corps.querySelector('[data-champ="rate-valeur"]').value
  if (String(rvBrut).trim() !== '') {
    const mode = corps.querySelector('[data-champ="rate-mode"]').value
    const unite = corps.querySelector('[data-champ="rate-unite"]').value
    const v = Number(String(rvBrut).replace(',', '.'))
    if (!Number.isFinite(v)) return noteFeuille(t('cal.price_invalid'))
    const jours = joursCochés(corps, 'rate')
    if (mode === 'set') {
      for (const p of plagesParJours(dates, jours)) {
        segments.push({ date_from: p[0], date_to: p[1], rate: Math.max(0, Math.round(v * 100) / 100) })
      }
    } else {
      const st = etat.states[bienId] || {}
      for (const iso of dates) {
        if (!jours.has(new Date(iso + 'T12:00:00').getDay())) continue
        const actuel = st[iso]?.rate
        if (actuel == null) continue
        const delta = unite === 'pct' ? actuel * v / 100 : v
        const prix = mode === 'inc' ? actuel + delta : actuel - delta
        segments.push({ date_from: iso, date_to: iso, rate: Math.max(0, Math.round(prix * 100) / 100) })
      }
    }
  }
  // Numeriques et ouvert/ferme.
  const num = { minStayArrival: 'min_stay_arrival', minStayThrough: 'min_stay_through', maxStay: 'max_stay' }
  for (const [id, col] of Object.entries(num)) {
    const brut = corps.querySelector(`[data-champ="${id}-valeur"]`)?.value
    if (String(brut ?? '').trim() === '') continue
    const jours = joursCochés(corps, id)
    for (const p of plagesParJours(dates, jours)) segments.push({ date_from: p[0], date_to: p[1], [col]: Number(brut) })
  }
  const oc = { avail: (v) => ({ avail: v === 'open' ? 1 : 0 }), cta: (v) => ({ cta: v === 'closed' }), ctd: (v) => ({ ctd: v === 'closed' }), stopSell: (v) => ({ stop_sell: v === 'closed' }) }
  for (const [id, f] of Object.entries(oc)) {
    const v = corps.querySelector(`[data-champ="${id}-valeur"]`)?.value
    if (!v) continue
    const jours = joursCochés(corps, id)
    for (const p of plagesParJours(dates, jours)) segments.push({ date_from: p[0], date_to: p[1], ...f(v) })
  }
  // Prix par personne : configuration du BIEN (domaine reglages), seulement
  // si la valeur change reellement.
  const ppIncl = Number(corps.querySelector('[data-champ="pp-included"]')?.value)
  const ppFee = Number(String(corps.querySelector('[data-champ="pp-fee"]')?.value || '').replace(',', '.'))
  const ppActuel = etat.pp[bienId] || {}
  if (Number.isFinite(ppIncl) && Number.isFinite(ppFee) && (ppIncl !== ppActuel.included || ppFee !== ppActuel.extraFee)) {
    segments.push({ kind: 'perPerson', included: ppIncl, extra_guest_fee: ppFee })
  }
  // Nuits orphelines (arbitrage (d) : rubrique de la popup a l'etape 1) —
  // memes colonnes que l'ancienne app, stop_sell delibere absent de l'autofix.
  const brut = etat.rawProps[bienId] || {}
  const oAuto = corps.querySelector('[data-champ="orph-autofix"]').checked
  const oPrix = corps.querySelector('[data-champ="orph-prix"]').checked
  const oMode = corps.querySelector('[data-champ="orph-mode"]').value
  const oUnite = corps.querySelector('[data-champ="orph-unite"]').value
  // Virgule decimale normalisee ; un champ VIDE garde l'ancienne valeur
  // (le serveur ignore null — l'effacement passe par decocher la case).
  const oSaisie = String(corps.querySelector('[data-champ="orph-valeur"]').value).trim().replace(',', '.')
  const oValeur = oSaisie !== '' ? oSaisie : (brut.orphan_price_value ?? null)
  if (oAuto !== !!brut.orphan_autofix || oPrix !== !!brut.orphan_price_enabled
    || oMode !== (brut.orphan_price_mode || 'set') || oUnite !== (brut.orphan_price_unit || 'eur')
    || String(oValeur ?? '') !== String(brut.orphan_price_value ?? '')) {
    segments.push({ kind: 'orphanConfig', orphan_autofix: oAuto, orphan_price_enabled: oPrix, orphan_price_mode: oMode, orphan_price_unit: oUnite, orphan_price_value: oValeur })
  }
  if (!segments.length) return noteFeuille(t('cal.nothing_to_save'))
  // Garde YieldFlow : le TARIF est retire des segments AVANT toute mutation
  // (le reste part quand meme), texte-contrat dit.
  let finaux = segments
  if (bien.pilote_tarifaire === 'yieldflow') {
    const sansTarif = segments.filter(s => s.rate === undefined)
    if (sansTarif.length !== segments.length) toast(t('cal.piloted_price'), { duree: 7000 })
    finaux = sansTarif
    if (!finaux.length) return
  }
  fermerFeuille()
  // La selection a fait son office : elle se vide, et la barre d'actions avec
  // elle (point 6 du 21 octobre). Sinon l'hote enregistre, et la barre reste
  // la a proposer d'agir sur des nuits qu'il croit deja traitees.
  // ⚠ MAIS SEULEMENT SI CE SONT BIEN SES NUITS. On exige deux choses : que la
  // popup ait ete ouverte DEPUIS la selection, et que la plage enregistree
  // soit encore celle de la selection — l'hote a pu corriger « du / au » a la
  // main avant d'enregistrer.
  const sel = etat.sel
  const memePlage = !!sel && sel.bien === bienId && (sel.duIso
    ? (dates[0] === sel.duIso && dates[dates.length - 1] === sel.auIso)
    : (dates[0] === joursSelection()[0] && dates[dates.length - 1] === joursSelection().slice(-1)[0]))
  if (popupDepuisSelection && memePlage) viderSelection()
  popupDepuisSelection = false
  await saveAvecAnnulation(bienId, finaux, { valeursAvant: null })
}
function plagesParJours (dates, jours) {
  const retenues = dates.filter(iso => jours.has(new Date(iso + 'T12:00:00').getDay()))
  return retenues.length ? plagesContigues(retenues) : []
}

        const adultes = Number(corps.querySelector('[data-aj="adultes"]').value)
        const enfants = Number(corps.querySelector('[data-aj="enfants"]').value)
        if (messageCapacite(adultes, enfants, Number(bien.capacity) || 99)) { etatEl.textContent = messageCapacite(adultes, enfants, Number(bien.capacity) || 99); bouton.disabled = false; return }
        const prix = Number(String(corps.querySelector('[data-aj="prix"]').value).replace(',', '.'))
        if (!Number.isFinite(prix) || prix <= 0) { etatEl.textContent = t('cal.price_invalid'); bouton.disabled = false; return }
        etatEl.textContent = t('cal.sending')
        // Le CONTRAT de api/reservation-directe, a l'identique de l'ancienne
        // page : customer/occupancy, et la « Note interne » EST `reference`.
        await appel('/api/reservation-directe', {
          propertyId: bien.provider_property_id,
          arrival: duV, departure: departV,
          prixParNuit: prix,
          customer: {
            name: prenom, surname: nom,
            mail: corps.querySelector('[data-aj="email"]').value.trim() || null,
            phone: corps.querySelector('[data-aj="tel"]').value.trim() || null
          },
          occupancy: { adults: adultes || 1, children: enfants || 0 },
          reference: corps.querySelector('[data-aj="note"]').value.trim() || null
        })
        fermerFeuille(); viderSelection()
        // Confirmation EN DEUX TEMPS : le coeur apprend la resa par le feed.
        toast(t('cal.booking_sent'), { duree: 9000 })
        setTimeout(() => charger(), 8000)
      }
    } catch (e) {
      logger.error('Calendrier', 'creation', e)
      etatEl.textContent = e.message || t('cal.save_error')
      bouton.disabled = false
    }
  })
}

// ─── Fiches : UN composant pour les deux écrans (§7) ────────────────────────
function ouvrirFicheResa (bienId, resaId) {
  const bien = etat.biens.find(b => b.id === bienId) || {}
  const r = (etat.states[bienId]?.__resas || []).find(x => String(x.id) === String(resaId))
  if (!r) return
  const droits = droitsResa(bien, r, peutEcrire('reservations') && !etat.lectureSeule)
  const famille = familleSource(r.sourceBrute || r.source)
  const valeurs = {
    statut: libelleStatut(r.statut),
    arrivee: dateIntl(r.startISO, langue()) + (r.arrivalHour ? ' · ' + r.arrivalHour : ''),
    depart: dateIntl(r.checkout, langue()),
    nuits: String(r.span || nuitsEntre(r.startISO, r.checkout)),
    voyageurs: [r.numAdult, r.numChild].filter(v => v != null).join(' + ') || null,
    montant: r.amount != null ? prixIntl(r.amount, r.currency || bien.currency, langue()) : null,
    canal: LIBELLE_CANAL[famille] || r.source || null,
    commission: r.commission != null ? prixIntl(r.commission, r.currency || bien.currency, langue()) : null,
    reference: r.otaCode || null,
    identifiant: String(r.id)
  }
  // CHAMPS_FICHE : le contrat partage — la ligne Statut sur les DEUX ecrans.
  const lignes = CHAMPS_FICHE
    .filter(c => valeurs[c.id] != null && valeurs[c.id] !== '')
    .map(c => `<div class="cal-fiche__ligne"><span class="caption muted">${esc(t(c.cle))}</span><span>${esc(valeurs[c.id])}</span></div>`)
    .join('')
  ouvrirFeuille(r.name || t('cal.booking'), `
    <div class="msg-tiroir__bloc">
      <span class="row" style="gap: 8px"><span class="cal-ligne-resa__point cal-barre--${famille}"></span>${esc(LIBELLE_CANAL[famille] || '')}</span>
      ${badgeSansEmailVisible(r) ? `<p class="caption msg-echec">${esc(t('cal.no_email'))}</p><p class="caption muted">${esc(TEXTE_SANS_EMAIL)}</p>` : ''}
      ${lignes}
      <span data-fiche-detail data-resa="${esc(String(r.id))}"></span>
      <span data-fiche-evaluation></span>
      <button type="button" class="btn btn--secondary" data-fiche-conv disabled>${esc(t('cal.open_conversation'))}</button>
      <p class="caption muted" data-fiche-conv-note hidden></p>
    </div>
    ${droits.modifiable ? `<div class="msg-tiroir__bloc">
      <label class="caption muted">${esc(t('cal.fiche_arrivee'))}</label><input type="date" data-f="arrivee" value="${r.startISO}">
      <label class="caption muted">${esc(t('cal.fiche_depart'))}</label><input type="date" data-f="depart" value="${String(r.checkout).slice(0, 10)}">
      <div class="row" style="gap: 10px">
        <span><label class="caption muted">${esc(t('cal.adults'))}</label><input type="number" min="1" data-f="adultes" value="${r.numAdult || 1}" style="width: 70px"></span>
        <span><label class="caption muted">${esc(t('cal.children'))}</label><input type="number" min="0" data-f="enfants" value="${r.numChild || 0}" style="width: 70px"></span>
      </div>
      <label class="caption muted">${esc(t('cal.price_night'))}</label>
      <input type="text" inputmode="decimal" data-f="prix" placeholder="${esc(t('cal.price_unchanged'))}">
      <p class="caption muted" data-f-total></p>
      <span class="row" style="gap: 8px">
        <button type="button" class="btn btn--primary" data-f-save>${esc(t('cal.save'))}</button>
        <button type="button" class="link" data-f-annuler-resa>${esc(t('cal.cancel_booking'))}</button>
      </span>
      <p class="caption" data-f-etat></p>
    </div>` : `<p class="caption muted" style="padding: 0 18px 14px">${esc(droits.note || '')}</p>`}`)
  const corps = $('[data-bind="feuille-corps"]')
  // « Ouvrir la conversation » : nait DESACTIVE, resolu par booking_id —
  // UNE resa a la fois ; la raison est DITE, on n'affirme jamais « aucun
  // fil » sans avoir pu regarder.
  const resaCourante = String(r.id)
  const encoreCetteResa = () => {
    const z = $('[data-bind="feuille-corps"]').querySelector('[data-fiche-detail]')
    return !!z && z.dataset.resa === resaCourante
  }
  // Le DETAIL (coordonnees, date de reservation, prix par nuit, decomposition
  // du total) vient d'un second appel, par booking_id : jamais dans le
  // listing (minimisation). Une lecture echouee n'affiche rien — la fiche
  // reste juste, pas de champ invente.
  appel(`/api/calendar?property_ids=${encodeURIComponent(bienId)}&start=${r.startISO}&end=${String(r.checkout).slice(0, 10)}&booking=${encodeURIComponent(resaCourante)}`).then(d => {
    // Reponse en retard : la feuille peut montrer une AUTRE reservation —
    // on n'ecrit que si c'est encore la meme (sinon le tel: de A s'injecte
    // dans la fiche de B).
    if (!encoreCetteResa()) return
    const zone = $('[data-bind="feuille-corps"]').querySelector('[data-fiche-detail]')
    if (!d || !d.booking_id) return
    const devise = d.currency || r.currency || bien.currency
    const lignesSup = []
    if (d.guestPhone) lignesSup.push(`<div class="cal-fiche__ligne"><span class="caption muted">${esc(t('cal.fiche_phone'))}</span><a href="tel:${esc(String(d.guestPhone).replace(/[^+\d]/g, ''))}">${esc(d.guestPhone)}</a></div>`)
    if (d.guestEmail) lignesSup.push(`<div class="cal-fiche__ligne"><span class="caption muted">${esc(t('cal.fiche_email'))}</span><a href="mailto:${esc(d.guestEmail)}" style="overflow-wrap: anywhere">${esc(d.guestEmail)}</a></div>`)
    if (d.vendueLe && d.vendueLe.valeur) {
      lignesSup.push(`<div class="cal-fiche__ligne"><span class="caption muted">${esc(t('cal.fiche_vendue'))}</span><span>${esc(dateIntl(d.vendueLe.valeur, langue()))}${d.vendueLe.fiable ? '' : ' ' + esc(t('cal.date_indicative'))}</span></div>`)
    }
    // « Detail du prix » : la decomposition du total paye, puis le prix par
    // nuit TEL QUE LE CANAL LE SERT (absent chez Beds24 — on le dit).
    const deco = []
    if (d.totalVoyageur && d.totalVoyageur.valeur != null) {
      deco.push([t('cal.price_total_paid'), prixIntl(d.totalVoyageur.valeur, devise, langue())])
      if (d.taxeSejour) deco.push([t('cal.incl_tourist_tax'), prixIntl(d.taxeSejour, devise, langue())])
    } else {
      const raison = d.totalVoyageur && d.totalVoyageur.raison
      deco.push([t('cal.price_total_paid'), t('cal.price_total_unknown') + (raison ? ' — ' + raison : '')])
    }
    // Taxe de sejour NON incluse dans le total : collectee en sus (montant
    // transmis), ou collectee par la plateforme sans montant — on le DIT.
    const ts = d.taxeSejourInfo || {}
    if (!d.taxeSejour && !ts.incluse) {
      if (ts.montant > 0) deco.push([t('cal.tourist_tax'), prixIntl(ts.montant, devise, langue()) + ' ' + t('cal.tt_extra')])
      else if (ts.collecteur === 'plateforme') deco.push([t('cal.tourist_tax'), t('cal.tt_platform_unknown')])
    }
    // Frais Airbnb (retenue hote transmise) — le frais de SERVICE voyageur
    // d'Airbnb n'est transmis par aucun canal.
    if (d.fraisCanal) deco.push([t('cal.airbnb_fee'), prixIntl(d.fraisCanal, devise, langue())])
    for (const f of d.factures || []) deco.push([f.libelle, prixIntl(f.montant, devise, langue())])
    const parNuit = (d.prixParNuit || []).map(n =>
      `<div class="cal-fiche__ligne"><span class="caption muted">${esc(dateIntl(n.date, langue(), { day: 'numeric', month: 'short' }))}</span><span>${esc(prixIntl(n.montant, devise, langue()) || '')}</span></div>`).join('')
    zone.innerHTML = lignesSup.join('') + `
      <details class="cal-rub cal-rub--fiche">
        <summary>${esc(t('cal.price_detail'))}</summary>
        <div class="cal-rub__corps">
          ${deco.map(([l, v]) => `<div class="cal-fiche__ligne"><span class="caption muted">${esc(l)}</span><span>${esc(v || '')}</span></div>`).join('')}
          ${parNuit ? `<p class="caption muted" style="margin: 8px 0 0">${esc(t('cal.price_per_night'))}</p>${parNuit}` : `<p class="caption muted">${esc(t('cal.per_night_unavailable'))}</p>`}
        </div>
      </details>`
  }).catch(e => logger.error('Calendrier', 'detail reservation', e))
  appel(`/api/messages?booking_id=${encodeURIComponent(resaCourante)}`).then(rep => {
    // Reponse en retard : la feuille peut montrer une AUTRE resa — le bouton
    // de conversation de A ne doit pas s'armer dans la fiche de B.
    if (!encoreCetteResa()) return
    const btn = corps.querySelector('[data-fiche-conv]')
    if (!btn) return
    if (rep && rep.has_conversation) {
      btn.disabled = false
      btn.addEventListener('click', () => { location.href = urlConversation(bien, r) })
    } else {
      const note = corps.querySelector('[data-fiche-conv-note]')
      note.hidden = false
      note.textContent = t(r.offline || familleSource(r.sourceBrute || r.source) === 'direct' ? 'cal.no_thread_direct' : 'cal.no_thread')
    }
  }).catch(() => {
    if (!encoreCetteResa()) return
    const note = corps.querySelector('[data-fiche-conv-note]')
    if (note) { note.hidden = false; note.textContent = t('cal.thread_unavailable') }
  })
  // Evaluation du voyageur : par le BUS, des le JOUR du depart (module commun).
  brancherEvaluation({ resa: { id: r.id, checkout: r.checkout }, cible: corps.querySelector('[data-fiche-evaluation]'), encoreAffichee: () => !$('[data-bind="feuille"]').hidden && encoreCetteResa() })
    .catch(e => logger.error('Calendrier', 'evaluation', e))
  if (!droits.modifiable) return
  const majTotal = () => {
    const a = corps.querySelector('[data-f="arrivee"]').value
    const d = corps.querySelector('[data-f="depart"]').value
    const brut = corps.querySelector('[data-f="prix"]').value
    const nuits = nuitsEntre(a, d)
    const zone = corps.querySelector('[data-f-total]')
    if (nuits <= 0) { zone.textContent = ''; return }
    // Les TROIS cas du total (A.9) : prix saisi x nuits ; duree inchangee =
    // montant inchange ; duree changee sans prix saisi = « au tarif actuel ».
    if (String(brut).trim() !== '') {
      const p = Number(String(brut).replace(',', '.'))
      zone.textContent = Number.isFinite(p) ? t('cal.total_stay', { total: prixIntl(p * nuits, r.currency || bien.currency, langue()), n: nuits }) : ''
    } else if (nuits === (r.span || nuitsEntre(r.startISO, r.checkout)) ) {
      zone.textContent = r.amount != null ? t('cal.total_unchanged', { total: prixIntl(r.amount, r.currency || bien.currency, langue()) }) : ''
    } else {
      const parNuit = r.amount != null && r.span ? r.amount / r.span : null
      zone.textContent = parNuit != null ? t('cal.total_at_current', { total: prixIntl(parNuit * nuits, r.currency || bien.currency, langue()), prix: prixIntl(parNuit, r.currency || bien.currency, langue()) }) : ''
    }
  }
  corps.querySelectorAll('[data-f]').forEach(x => x.addEventListener('input', majTotal))
  majTotal()
  corps.querySelector('[data-f-save]').addEventListener('click', async () => {
    const etatEl = corps.querySelector('[data-f-etat]')
    const charge = {
      propertyId: bien.provider_property_id, bookingId: r.id,
      arrival: corps.querySelector('[data-f="arrivee"]').value,
      departure: corps.querySelector('[data-f="depart"]').value,
      occupancy: {
        adults: Number(corps.querySelector('[data-f="adultes"]').value) || 1,
        children: Number(corps.querySelector('[data-f="enfants"]').value) || 0
      }
    }
    // Le PRIX est ABSENT du payload s'il n'est pas touche. Le champ est
    // PREREMPLI, donc « non vide » ne suffit pas : meme prix qu'en base
    // (a l'arrondi pres, sur les nuits d'ORIGINE) = pas touche — sinon
    // l'arrondi rejouait (100,00 / 3 nuits -> 99,99).
    const brut = corps.querySelector('[data-f="prix"]').value
    if (String(brut).trim() !== '') {
      const p = Number(String(brut).replace(',', '.'))
      if (!Number.isFinite(p) || p <= 0) { etatEl.textContent = t('cal.price_invalid'); return }
      const memePrix = r.amount != null && r.span && Math.abs(p * r.span - r.amount) < 0.005
      if (!memePrix) charge.prixParNuit = p
    }
    if (charge.arrival === r.startISO && charge.departure === String(r.checkout).slice(0, 10)
      && charge.occupancy.adults === (r.numAdult || 1) && charge.occupancy.children === (r.numChild || 0)
      && charge.prixParNuit === undefined) {
      etatEl.textContent = t('cal.no_change'); return
    }
    try {
      etatEl.textContent = t('cal.sending')
      await fetch('/api/reservation-directe', { method: 'PUT', headers: await entetesJson(), body: JSON.stringify(charge) }).then(reponseOuErreur)
      fermerFeuille()
      // On ne redessine PAS : le retour vient du feed.
      toast(t('cal.booking_sent'), { duree: 9000 })
      setTimeout(() => charger(), 8000)
    } catch (e) { etatEl.textContent = e.message || t('cal.save_error') }
  })
  corps.querySelector('[data-f-annuler-resa]').addEventListener('click', async () => {
    if (!window.confirm(t('cal.cancel_confirm'))) return
    const etatEl = corps.querySelector('[data-f-etat]')
    try {
      etatEl.textContent = t('cal.sending')
      await fetch('/api/reservation-directe', { method: 'DELETE', headers: await entetesJson(), body: JSON.stringify({ propertyId: bien.provider_property_id, bookingId: r.id }) }).then(reponseOuErreur)
      fermerFeuille()
      // La barre RESTE affichee : les dates ne sont pas encore libres cote canal.
      toast(t('cal.booking_cancelled'), { duree: 9000 })
      setTimeout(() => charger(), 8000)
    } catch (e) { etatEl.textContent = e.message || t('cal.save_error') }
  })
}
async function entetesJson () {
  const { data: { session } } = await supabase.auth.getSession()
  return { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json', ...enteteCompte() }
}
async function reponseOuErreur (r) {
  const corps = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(corps.message || corps.error || `HTTP ${r.status}`); e.status = r.status; throw e }
  return corps
}
function ouvrirFicheBlocage (bienId, blocageId) {
  const bien = etat.biens.find(b => b.id === bienId) || {}
  const ref = String(bien.provider_property_id || '')
  const f = ((etat.fermetures[bienId] || etat.fermetures[ref]) || []).find(x => String(x.id) === String(blocageId))
  if (!f) return
  const ecrit = peutEcrire('reservations') && !etat.lectureSeule
  ouvrirFeuille(t('cal.block_title', { raison: f.raison || '' }), `
    <div class="msg-tiroir__bloc">
      <label class="caption muted">${esc(t('cal.first_night'))}</label>
      <input type="date" data-b="debut" value="${String(f.date_debut).slice(0, 10)}" ${ecrit ? '' : 'disabled'}>
      <label class="caption muted">${esc(t('cal.last_night'))}</label>
      <input type="date" data-b="fin" value="${String(f.date_fin).slice(0, 10)}" ${ecrit ? '' : 'disabled'}>
      <label class="caption muted">${esc(t('cal.block_reason'))}</label>
      <input type="text" maxlength="200" data-b="raison" value="${esc(f.raison || '')}" ${ecrit ? '' : 'disabled'}>
      <p class="caption muted">${esc(t('cal.block_hint'))}</p>
      ${ecrit ? `<span class="row" style="gap: 8px">
        <button type="button" class="btn btn--primary" data-b-save>${esc(t('cal.save'))}</button>
        <button type="button" class="link" data-b-suppr>${esc(t('cal.block_delete'))}</button>
      </span><p class="caption" data-b-etat></p>` : ''}
    </div>`)
  if (!ecrit) return
  const corps = $('[data-bind="feuille-corps"]')
  corps.querySelector('[data-b-save]').addEventListener('click', async () => {
    const etatEl = corps.querySelector('[data-b-etat]')
    const debut = corps.querySelector('[data-b="debut"]').value
    const fin = corps.querySelector('[data-b="fin"]').value
    const raison = corps.querySelector('[data-b="raison"]').value.trim()
    if (!debut || !fin || fin < debut) { etatEl.textContent = t('cal.range_invalid'); return }
    if (!raison) { etatEl.textContent = t('cal.block_reason_required'); return }
    if (debut === String(f.date_debut).slice(0, 10) && fin === String(f.date_fin).slice(0, 10) && raison === (f.raison || '')) {
      etatEl.textContent = t('cal.no_change'); return
    }
    try {
      await api.calendar.modifierFermeture(bienId, f.id, debut, fin, raison)
      fermerFeuille(); toast(t('cal.saved')); await charger()
    } catch (e) { etatEl.textContent = e.message || t('cal.save_error') }
  })
  corps.querySelector('[data-b-suppr]').addEventListener('click', async () => {
    if (!window.confirm(t('cal.block_delete_confirm'))) return
    const etatEl = corps.querySelector('[data-b-etat]')
    try {
      await api.calendar.rouvrirFermeture(bienId, f.id)
      fermerFeuille(); toast(t('cal.block_deleted')); await charger()
    } catch (e) { etatEl.textContent = e.message || t('cal.save_error') }
  })
}

// ─── Démarrage ──────────────────────────────────────────────────────────────
async function init () {
  const session = await requireAuth()
  if (!session) return
  await I18n.init()
  document.addEventListener('i18n:changed', () => location.reload())
  const user = await getUser()
  $('[data-bind="initials"]').textContent = (user?.email || '').slice(0, 2).toUpperCase()
  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
    outils: [
      peutLire('reservations') && { href: '/apps/yield', key: 'nav.tool_yield', icon: 'i-price' },
      estTitulaire() && { href: '/apps/serrures', key: 'nav.tool_locks', icon: 'i-key' },
      estTitulaire() && { href: '/apps/sms', key: 'nav.tool_sms', icon: 'i-send' },
      estTitulaire() && { href: '/apps/reservation-directe', key: 'nav.tool_direct', icon: 'i-calendar' },
      estTitulaire() && { href: '/connexions', key: 'nav.tool_connections', icon: 'i-link' },
      estTitulaire() && { href: '/abonnement', key: 'nav.tool_billing', icon: 'i-euro' }
    ].filter(Boolean)
  })
  HSNav.render({ peutLire })
  if (!peutLire('reservations')) {
    $('[data-bind="etat-vide"]').hidden = false
    $('[data-bind="etat-vide"]').innerHTML = `<p class="muted">${esc(t('cal.no_access'))}</p>`
    return
  }
  etat.lectureSeule = !peutEcrire('reservations')
  lirePrefs()
  // Lien profond ?bien=<uuid> (redirections des anciennes routes
  // /biens/:id/calendrier) : ce bien s'affiche, en tete.
  const bienDemande = new URLSearchParams(location.search).get('bien')
  if (bienDemande) {
    etat.choisis = [bienDemande, ...etat.choisis.filter(x => x !== bienDemande)]
    etat.choisisDefinis = true
  }
  // Periode (ordinateur).
  document.querySelectorAll('[data-mois]').forEach(b => {
    b.setAttribute('aria-pressed', String(Number(b.dataset.mois) === etat.months))
    b.addEventListener('click', () => {
      etat.months = Number(b.dataset.mois)
      document.querySelectorAll('[data-mois]').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
      viderSelection(); ecrirePrefs(); charger()
    })
  })
  // Navigation : pas de 30 jours (ordinateur) / mois calendaire (telephone).
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    const sens = Number(b.dataset.nav)
    if (estLarge()) {
      etat.decalage = sens === 0 ? 0 : etat.decalage + sens * 30
      viderSelection(); charger()
    } else naviguerMois(sens)
  }))
  $('[data-bind="vue-mobile"]').addEventListener('change', (e) => {
    etat.vueMobile = e.target.value
    ecrirePrefs(); renderTout()
  })
  $('[data-bind="feuille-fermer"]').addEventListener('click', fermerFeuille)
  $('[data-bind="flottante-annuler"]').addEventListener('click', () => { viderSelection(); renderTout() })
  // Changement de jour : re-rendu si la date a change (onglet ouvert la nuit).
  let jourVu = AUJOURDHUI
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && toISO(new Date()) !== jourVu) location.reload()
  })
  // Bascule de disposition au passage du seuil 900 px.
  let large = estLarge()
  window.addEventListener('resize', () => {
    if (estLarge() !== large) { large = estLarge(); viderSelection(); chargerBiens().then(charger) }
  })
  await chargerBiens()
  await charger()
}
init().catch(e => logger.error('Calendrier', e.message, e))

</script>
