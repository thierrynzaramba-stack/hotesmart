<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « MESSAGES » — refonte UI V5, lot 2, ÉTAPES 1 à 3 : liste + fil,
     envoi manuel, « Proposer une réponse », propositions dans le fil avec
     Envoyer / Modifier / Rejeter, pagination serveur, état lu. Spec :
     docs/specs/spec-refonte-ui-v5-lot-messages.md §3-§6 et §11.
     Reste l'étape 4 (Test/Auto, tiroir réglages, redirection ancienne page).
     RÈGLES : aucun hexa, aucun texte en dur, aucune icône dessinée ici,
     aucun appel provider ; X-Compte sur chaque appel. -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="msg-layout">

  <section class="msg-liste" aria-labelledby="h-liste">
    <div class="msg-liste__outils">
      <h1 class="h2" id="h-liste" data-i18n="messages.title"></h1>
      <label class="msg-recherche">
        <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-search"/></svg>
        <input type="search" data-bind="recherche" data-i18n-attr="placeholder:messages.search;aria-label:messages.search">
      </label>
      <div class="msg-filtres" role="group" data-i18n-attr="aria-label:messages.filters">
        <button type="button" class="tab" data-filtre="tous" aria-pressed="true" data-i18n="messages.filter_all"></button>
        <button type="button" class="tab" data-filtre="nonlus" aria-pressed="false"></button>
        <button type="button" class="tab" data-filtre="avalider" aria-pressed="false"></button>
      </div>
    </div>
    <div class="msg-deroule" data-list="conversations"><p class="muted" style="padding: 14px" data-i18n="common.loading"></p></div>
  </section>

  <section class="msg-fil" aria-labelledby="h-fil">
    <div class="msg-fil__entete" data-bind="fil-entete" hidden>
      <button type="button" class="btn btn--secondary btn--icon msg-retour" data-bind="retour" data-i18n-attr="aria-label:messages.back">
        <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-chevron" transform="rotate(180 12 12)"/></svg>
      </button>
      <span class="conv__avatar" data-bind="fil-avatar"></span>
      <div class="msg-fil__titre">
        <h2 class="h2" id="h-fil" style="font-size: 17px" data-bind="fil-nom"></h2>
        <span class="small muted" data-bind="fil-sous"></span>
      </div>
      <span class="row" style="margin-inline-start: auto; gap: 12px">
        <span class="row caption muted" style="gap: 5px" data-bind="fil-code" hidden>
          <svg class="icon" style="width:15px;height:15px" aria-hidden="true"><use href="/shared/icons.svg#i-key"/></svg>
          <span data-bind="fil-code-texte"></span>
        </span>
        <span class="row" style="gap: 12px" data-bind="fil-extras"></span>
        <a class="link caption" data-bind="fil-resa" hidden data-i18n="messages.booking_link"></a>
      </span>
    </div>
    <div class="msg-fil__deroule" data-list="fil" hidden></div>
    <div class="msg-vide" data-bind="fil-vide">
      <svg class="icon" style="width:36px;height:36px" aria-hidden="true"><use href="/shared/icons.svg#i-message"/></svg>
      <span data-i18n="messages.select"></span>
    </div>
    <div class="msg-saisie" data-bind="saisie" hidden>
      <textarea rows="1" data-bind="texte" data-i18n-attr="placeholder:messages.write;aria-label:messages.write"></textarea>
      <button type="button" class="btn btn--secondary btn--icon" data-bind="proposer" data-i18n-attr="aria-label:messages.propose;title:messages.propose">
        <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-ai"/></svg>
      </button>
      <button type="button" class="btn btn--primary btn--icon" data-bind="envoyer" data-i18n-attr="aria-label:messages.send;title:messages.send">
        <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-send"/></svg>
      </button>
    </div>
    <p class="caption muted" style="margin: 0; padding: 0 20px 10px" data-bind="saisie-etat" hidden></p>
  </section>
</main>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { requireAuth } from '/components/auth-guard.js'
import { supabase, getUser, signOut } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { logger } from '/shared/logger.js'
import { escapeHtml as esc } from '/shared/properties.js'
import { compteCourant, peutLire, peutEcrire, estTitulaire, comptes, basculerVers, enteteCompte }
  from '/shared/compte-courant.js'
// La règle « à traiter » est PARTAGÉE avec l'accueil (séjours à venir ou en
// cours seulement, décision du 11 octobre) : jamais recopiée.
import { tachesOuvertes, jourParis, ajouterJours, STATUTS_SANS_SEJOUR } from '/shared/aujourdhui.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (sel) => document.querySelector(sel)
const icone = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="/shared/icons.svg#${id}"/></svg>`

const PAGE = 50            // conversations affichées, puis « afficher plus » (spec §3.2)
// Une date illisible ne fait tomber NI la liste NI le fil.
const valide = (iso) => iso != null && Number.isFinite(new Date(iso).getTime())
const etat = {
  aujourdHui: jourParis(),
  conversations: [], chargementOk: null,
  taches: [],              // pending_validation OUVERTES, par la règle du lot 1
  biens: new Map(),        // provider_property_id -> { uuid, name }
  filtre: 'tous', recherche: '', anciennes: false,
  hasMore: false, nextBefore: null, nextBeforeId: null,   // pagination SERVEUR (etape 2)
  pauses: {},                          // provider_property_id -> kill switch
  envois: new Map(),                   // bookId -> [{ texte, etatEnvoi }] en cours / echoues
  enEdition: null,         // { tacheId, bookId } : proposition descendue dans la saisie (etape 3)
  ouverte: null            // bookId de la conversation ouverte
}
const peutEcrireMessages = () => { try { return peutEcrire('messages') } catch { return false } }

async function appel (chemin, corpsPost) {
  const { data: { session } } = await supabase.auth.getSession()
  if (!session || !session.access_token) { const e = new Error(t('messages.load_error')); e.status = 401; throw e }
  const r = await fetch(chemin, {
    method: corpsPost ? 'POST' : 'GET',
    headers: { Authorization: 'Bearer ' + session.access_token, ...(corpsPost ? { 'Content-Type': 'application/json' } : {}), ...enteteCompte() },
    ...(corpsPost ? { body: JSON.stringify(corpsPost) } : {})
  })
  const corps = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(corps.message || corps.error || `HTTP ${r.status}`); e.status = r.status; e.code = corps.error; throw e }
  return corps
}

// ─── Lectures ────────────────────────────────────────────────────────────────
async function charger () {
  const lectures = [
    appel(`/api/messages?limit=${PAGE}`).then(r => {
      etat.conversations = r.conversations || []
      etat.hasMore = r.has_more === true
      etat.nextBefore = r.next_before != null ? r.next_before : null
      etat.nextBeforeId = r.next_before_id || null
      etat.chargementOk = true
    })
      .catch(e => { logger.error('Messages', 'conversations', e); etat.chargementOk = false }),
    appel('/api/property-automation').then(r => { etat.pauses = r.paused || {} })
      .catch(() => { etat.pauses = {} }),
    // Les noms des biens (la sous-ligne « {bien} · {dates} ») : lecture directe
    // sous RLS, jamais /api/channel-property (il interroge Beds24 en direct).
    supabase.from('properties').select('id, name, provider_property_id, photo_url').eq('user_id', compteCourant())
      .then(({ data, error }) => {
        if (error) { logger.error('Messages', 'biens', error); return }
        for (const b of data || []) if (b.provider_property_id) etat.biens.set(String(b.provider_property_id), { uuid: b.id, name: b.name, photo: b.photo_url || null })
      }),
    supabase.from('agent_tasks')
      .select('id, book_id, property_id, guest_name, task_type, summary, suggested_reply, status, created_at')
      .in('status', ['pending_validation']).eq('user_id', compteCourant())
      .order('created_at', { ascending: false }).limit(200)
      .then(({ data, error }) => { if (error) logger.error('Messages', 'taches', error); else etat.taches = data || [] })
  ]
  await Promise.all(lectures)
  // La règle d'ouverture s'évalue sur les SÉJOURS des conversations (départ =
  // lastNight) et leurs derniers messages — mêmes entrées que le lot 1.
  // Seuls comptent les sejours A VENIR ou EN COURS (regle du 11 octobre) —
  // statuts exclus partages avec l'accueil (STATUTS_SANS_SEJOUR). Une tache
  // dont la conversation n'est pas dans la page chargee survit par ses
  // propres dates (agent_tasks.departure) : voir tachesOuvertes.
  const sejoursEnCours = etat.conversations
    .filter(c => c.lastNight && !STATUTS_SANS_SEJOUR.has(String(c.status || '').toLowerCase()))
    .map(c => ({ id: c.bookId, propId: c.propertyId, departure: String(c.lastNight).slice(0, 10) }))
  etat.taches = tachesOuvertes(etat.taches, {
    bookings: sejoursEnCours, aujourdHui: etat.aujourdHui
  })
  indexerTaches()
}

// ─── Lecture des conversations : tri, filtres, recherche ────────────────────
// Index reconstruit apres chaque chargement : la recherche re-filtre a chaque
// frappe, un balayage lineaire par ligne et par comparaison coutait
// conversations x taches (releve en review).
let tachesParResa = new Map()
function indexerTaches () {
  tachesParResa = new Map()
  for (const x of etat.taches) {
    const k = String(x.book_id)
    if (!tachesParResa.has(k)) tachesParResa.set(k, [])
    tachesParResa.get(k).push(x)
  }
}
const tachesDe = (c) => tachesParResa.get(String(c.bookId)) || []
// Non lu = dernier message ENTRANT posterieur a la derniere LECTURE — et
// repondre vaut lecture : la reference est le plus recent de read_at (pose a
// l'ouverture du fil, etape 2) et du dernier message sortant. Sans l'un ni
// l'autre, un entrant est non lu.
const nonLue = (c) => {
  const dernierEntrant = [...c.messages].reverse().find(m => m.direction === 'inbound')
  if (!dernierEntrant) return false
  const dernierSortant = [...c.messages].reverse().find(m => m.direction === 'outbound')
  const refs = [c.readAt, dernierSortant && dernierSortant.sent_at].filter(Boolean).map(x => new Date(x).getTime())
  if (!refs.length) return true
  return new Date(dernierEntrant.sent_at).getTime() > Math.max(...refs)
}
const enCours = (c) => c.lastNight && String(c.lastNight).slice(0, 10) >= etat.aujourdHui
  && String(c.status || '').toLowerCase() !== 'cancelled'
// Arrivee du jour (0), de demain (1), autre (2) — fonction CONSERVEE de
// l'ancienne messagerie (inventaire §12 de la spec) : ces fils priment.
function groupeArrivee (c) {
  const arr = String(c.firstNight || '').slice(0, 10)
  if (!arr || STATUTS_SANS_SEJOUR.has(String(c.status || '').toLowerCase())) return 2
  if (arr === etat.aujourdHui) return 0
  if (arr === ajouterJours(etat.aujourdHui, 1)) return 1
  return 2
}
function visibles () {
  const q = etat.recherche.trim().toLowerCase()
  let liste = etat.conversations.filter(c => etat.anciennes || !c.archivee)
  if (etat.filtre === 'nonlus') liste = liste.filter(nonLue)
  if (etat.filtre === 'avalider') liste = liste.filter(c => tachesDe(c).length)
  if (q) {
    liste = liste.filter(c => (c.guestName || '').toLowerCase().includes(q)
      || (etat.biens.get(String(c.propertyId))?.name || '').toLowerCase().includes(q))
  }
  // Tri (décision de Thierry du 11 octobre 2026, qui PRIME sur la spec §3.2) :
  // les arrivées du JOUR toujours en premières lignes, celles de DEMAIN en
  // secondes, puis à valider, puis non lus, puis date décroissante.
  // ⚠ Le rang se calcule UNE fois par conversation, jamais dans le
  // comparateur (nonLue recopie le fil, la recherche re-trie a chaque frappe
  // — meme famille que l'index des taches, releve en review).
  const rang = c => { const g = groupeArrivee(c); return g < 2 ? g : tachesDe(c).length ? 2 : nonLue(c) ? 3 : 4 }
  return liste
    .map(c => ({ c, rg: rang(c), t: new Date(c.lastTime || 0).getTime() }))
    .sort((x, y) => x.rg - y.rg || y.t - x.t)
    .map(x => x.c)
}

// ─── Rendu : liste ───────────────────────────────────────────────────────────
const LETTRE_CANAL = { airbnb: 'A', booking: 'B', direct: 'D' }
// Un canal inconnu reste NEUTRE : la premiere lettre de « Autre OTA » se
// lisait Airbnb (releve en review).
const lettreCanal = (c) => LETTRE_CANAL[c.platform] || '·'
// La pastille : lettre + COULEUR DE MARQUE (le nom du canal en infobulle),
// et le grand cercle porte la MINIATURE du logement quand il en a une —
// repli : les initiales du voyageur (demande de Thierry, 11 octobre 2026).
const CLASSE_CANAL = { airbnb: 'conv__canal--airbnb', booking: 'conv__canal--booking', direct: 'conv__canal--direct' }
// Le LOGO du canal (demande de Thierry) : le belo Airbnb (sprite, trace CC0),
// le « B. » Booking (son logo EST cette lettre), la maison pour le direct ;
// inconnu = point neutre. Le nom du canal reste en infobulle.
function pastilleCanal (c) {
  const dedans = c.platform === 'airbnb' ? icone('i-canal-airbnb', 'icon icon--fill')
    : c.platform === 'booking' ? 'B.'
    : c.platform === 'direct' ? icone('i-home')
    : lettreCanal(c)
  return `<span class="conv__canal ${CLASSE_CANAL[c.platform] || ''}" title="${esc(c.ota || '')}">${dedans}</span>`
}
function avatarConv (c) {
  const bien = etat.biens.get(String(c.propertyId))
  const photo = bien?.photo ? `<img src="${esc(bien.photo)}" alt="" loading="lazy">` : ''
  return `${photo}${photo ? '' : esc(initiales(c.guestName))}${pastilleCanal(c)}`
}
const initiales = (nom) => (nom || '').trim().split(/\s+/).slice(0, 2).map(m => m[0] || '').join('').toUpperCase() || '·'
function periode (c) {
  const j = x => { const [a, m, d] = String(x).slice(0, 10).split('-').map(Number); return I18n.date(new Date(Date.UTC(a, m - 1, d, 12)), { day: 'numeric', month: 'short', timeZone: 'UTC' }) }
  return c.firstNight && c.lastNight ? `${j(c.firstNight)} → ${j(c.lastNight)}` : ''
}
function heureCourte (iso) {
  if (!valide(iso)) return ''
  const d = new Date(iso)
  const jour = jourParis(d.getTime())
  if (jour === etat.aujourdHui) return I18n.time(d)
  return I18n.date(d, { day: 'numeric', month: 'short' })
}
function renderFiltres () {
  // Chargement en echec : pas de compte du tout — un « 0 » calcule sur des
  // donnees absentes serait un fait invente (releve en review).
  if (etat.chargementOk === false) { $('.msg-liste__outils').hidden = true; return }
  const toutes = etat.conversations.filter(c => etat.anciennes || !c.archivee)
  $('[data-filtre="nonlus"]').textContent = `● ${toutes.filter(nonLue).length}`
  $('[data-filtre="nonlus"]').setAttribute('aria-label', t('messages.filter_unread'))
  $('[data-filtre="avalider"]').textContent = `${t('messages.filter_validate')} (${toutes.filter(c => tachesDe(c).length).length})`
  for (const b of document.querySelectorAll('[data-filtre]')) {
    b.setAttribute('aria-pressed', String(b.dataset.filtre === etat.filtre))
  }
}
function renderListe () {
  const zone = $('[data-list="conversations"]')
  if (etat.chargementOk === false) { zone.innerHTML = `<p class="muted" style="padding: 14px">${esc(t('messages.load_error'))}</p>`; return }
  const liste = visibles()
  if (!liste.length && !etat.hasMore) { zone.innerHTML = `<p class="muted" style="padding: 14px">${esc(t('messages.empty'))}</p>`; return }
  const masqueesAnciennes = !etat.anciennes && etat.conversations.some(c => c.archivee)
  // Étiquettes de groupe et séparation visuelle (demande de Thierry) : les
  // arrivées du jour, puis celles de demain, puis le reste derrière une
  // coupure nette.
  let groupePrecedent = null
  zone.innerHTML = liste.map(c => {
    const dernier = c.messages[c.messages.length - 1]
    const bien = etat.biens.get(String(c.propertyId))
    const proposition = tachesDe(c).length > 0
    const parIA = dernier && dernier.direction === 'outbound' && dernier.kind === 'auto'
    const g = groupeArrivee(c)
    let entete = ''
    if (g !== groupePrecedent) {
      if (g === 0) entete = `<div class="msg-groupe">${icone('i-arrival', 'icon')}${esc(t('messages.arrives_today'))}</div>`
      else if (g === 1) entete = `<div class="msg-groupe">${icone('i-arrival', 'icon')}${esc(t('messages.arrives_tomorrow'))}</div>`
      else if (groupePrecedent !== null) entete = '<div class="msg-separe" role="presentation"></div>'
      groupePrecedent = g
    }
    return `${entete}<div class="conv" role="button" tabindex="0" data-conv="${esc(c.bookId)}" aria-current="${c.bookId === etat.ouverte}">
      <span class="conv__avatar">${avatarConv(c)}</span>
      <span style="min-width: 0">
        <span class="conv__nom">${esc(c.guestName || t('messages.guest'))}<time>${dernier ? esc(heureCourte(dernier.sent_at)) : ''}</time></span>
        <span class="conv__apercu">
          ${proposition ? icone('i-ai', 'icon icon--robot') : ''}
          ${parIA && !proposition ? icone('i-check', 'icon icon--fait') : ''}
          <span>${esc(dernier ? dernier.body : '')}</span>
        </span>
        <span class="conv__sous"><span class="conv__etat${enCours(c) ? ' conv__etat--encours' : ''}"></span>${esc([bien?.name, periode(c)].filter(Boolean).join(' · '))}</span>
        ${badgeArrivee(c)}
      </span>
      ${nonLue(c) ? `<span class="conv__nonlu" role="img" data-i18n-attr="aria-label:messages.unread"></span>` : ''}
    </div>`
  }).join('')
    + (etat.hasMore ? `<button type="button" class="btn btn--secondary btn--block" style="margin: 10px auto; width: calc(100% - 28px)" data-plus>${esc(t('messages.show_more_srv'))}</button>` : '')
    + (masqueesAnciennes ? `<button type="button" class="link small" style="display: block; margin: 8px auto 16px; background: none; border: 0" data-anciennes>${esc(t('messages.show_old'))}</button>` : '')
  I18n.apply(zone)
  zone.querySelectorAll('[data-conv]').forEach(b => {
    b.addEventListener('click', (e) => { if (!e.target.closest('[data-tel]')) ouvrir(b.dataset.conv) })
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrir(b.dataset.conv) } })
  })
  zone.querySelector('[data-plus]')?.addEventListener('click', chargerPageSuivante)
  zone.querySelector('[data-anciennes]')?.addEventListener('click', () => { etat.anciennes = true; renderFiltres(); renderListe() })
}

// Page suivante : le curseur du SERVEUR (etape 2), plus un decoupage client.
async function chargerPageSuivante () {
  if (etat.nextBefore == null) { etat.hasMore = false; renderListe(); return }
  try {
    const r = await appel(`/api/messages?limit=${PAGE}&before=${encodeURIComponent(etat.nextBefore)}&before_id=${encodeURIComponent(etat.nextBeforeId || '')}`)
    const connus = new Set(etat.conversations.map(c => String(c.bookId)))
    for (const c of r.conversations || []) if (!connus.has(String(c.bookId))) etat.conversations.push(c)
    etat.hasMore = r.has_more === true
    etat.nextBefore = r.next_before != null ? r.next_before : null
    etat.nextBeforeId = r.next_before_id || null
    renderFiltres(); renderListe()
  } catch (e) { logger.error('Messages', 'page suivante', e) }
}

// Pastilles d'arrivée (liste) : POSITIVES seulement, l'absence se lit « pas
// encore » (règle de l'ancienne page). Le TÉLÉPHONE vit dans la ligne pour
// les arrivées (demande de Thierry du 11 octobre) : l'étiquette de groupe
// porte déjà « Arrive aujourd'hui / demain », plus de badge par ligne.
function badgeArrivee (c) {
  const g = groupeArrivee(c)
  if (g > 1) return ''
  const etats = []
  if (c.arrivee?.menage === 'fait') etats.push(`<span class="row caption" style="gap: 3px">${icone('i-cleaning', 'icon icon--fait')}${esc(t('messages.cleaning_done'))}</span>`)
  if (c.arrivee?.codeEtat === 'transmis') etats.push(`<span class="row caption" style="gap: 3px">${icone('i-key', 'icon icon--fait')}${esc(t('messages.code_sent'))}</span>`)
  const tel = lienTelephone(c)
  if (!etats.length && !tel) return ''
  return `<span class="row caption muted" style="gap: 12px; margin-top: 3px; flex-wrap: wrap">${etats.join('')}${tel}</span>`
}
// Le téléphone en lien d'appel, pour les arrivées du jour et de demain
// seulement (fonction conservée) : `tel:` n'accepte que chiffres et « + ».
// Un numéro livré « 33 6… » SANS le plus ne se compose pas : on le rétablit
// (demande de Thierry du 11 octobre) — 0033 devient +33, 33XXXXXXXXX aussi ;
// un numéro national (06…) ou déjà international reste tel quel.
function numeroAppelable (brut) {
  const premier = String(brut).trim().split(/[\/,;]|\s+ou\s+/)[0].trim()
  let num = premier.replace(/[^\d+]/g, '')
  if (num.startsWith('00')) num = '+' + num.slice(2)
  if (!num.startsWith('+') && /^33\d{8,}$/.test(num)) num = '+' + num
  return num
}
function lienTelephone (c) {
  if (groupeArrivee(c) > 1 || !c.guestPhone) return ''
  const num = numeroAppelable(c.guestPhone)
  if (num.replace(/\D/g, '').length < 6) return ''
  return `<a class="link caption row" style="gap: 5px" href="tel:${esc(num)}" data-tel aria-label="${esc(t('messages.call'))}">${icone('i-phone', 'icon icon--tel')}${esc(num)}</a>`
}

// ─── Rendu : fil ─────────────────────────────────────────────────────────────
function jourDe (iso) { return jourParis(new Date(iso).getTime()) }
function renderFil () {
  const c = etat.conversations.find(x => String(x.bookId) === String(etat.ouverte))
  const entete = $('[data-bind="fil-entete"]'), deroule = $('[data-list="fil"]'), vide = $('[data-bind="fil-vide"]')
  if (!c) { entete.hidden = true; deroule.hidden = true; vide.hidden = false; delete document.body.dataset.fil; return }
  document.body.dataset.fil = '1'
  entete.hidden = false; deroule.hidden = false; vide.hidden = true
  $('[data-bind="fil-avatar"]').innerHTML = avatarConv(c)
  $('[data-bind="fil-nom"]').textContent = c.guestName || t('messages.guest')
  const bien = etat.biens.get(String(c.propertyId))
  $('[data-bind="fil-sous"]').textContent = [bien?.name, periode(c)].filter(Boolean).join(' · ')
  const code = $('[data-bind="fil-code"]')
  if (c.arrivee && (c.arrivee.codeEtat === 'transmis' || c.arrivee.codeEtat === 'cree')) {
    code.hidden = false
    $('[data-bind="fil-code-texte"]').textContent = t(c.arrivee.codeEtat === 'transmis' ? 'messages.code_sent' : 'messages.code_pending')
  } else code.hidden = true
  // Ménage fait et téléphone (arrivées j / j+1) : fonctions CONSERVÉES.
  const extras = $('[data-bind="fil-extras"]')
  extras.innerHTML = [
    c.arrivee?.menage === 'fait' ? `<span class="row caption muted" style="gap: 5px">${icone('i-cleaning', 'icon')}${esc(t('messages.cleaning_done'))}</span>` : '',
    lienTelephone(c)
  ].filter(Boolean).join('')
  const resa = $('[data-bind="fil-resa"]')
  if (bien) { resa.hidden = false; resa.href = `/biens/${encodeURIComponent(bien.uuid)}/calendrier` } else resa.hidden = true

  // Les messages et les PROPOSITIONS ouvertes, fondus à leur place
  // chronologique (spec §3.3), avec Envoyer / Modifier / Rejeter (étape 3) —
  // Rejeter dans le menu ⋯, boutons RETIRÉS sans droit d'écriture. Une
  // proposition descendue dans la saisie (« Modifier ») se masque ici.
  // La proposition sans `created_at` prend la place du dernier message, un
  // message sans date va en fin de fil.
  const dernierInstant = c.lastTime && valide(c.lastTime) ? c.lastTime : new Date().toISOString()
  const entrees = [
    ...c.messages.map(m => ({ quand: valide(m.sent_at) ? m.sent_at : dernierInstant, type: 'message', m })),
    ...tachesDe(c)
      .filter(x => !(etat.enEdition && String(etat.enEdition.tacheId) === String(x.id)))
      .map(x => ({ quand: valide(x.created_at) ? x.created_at : dernierInstant, type: 'proposition', x }))
  ].sort((a, b) => new Date(a.quand) - new Date(b.quand))
  let jour = null
  deroule.innerHTML = entrees.map(e => {
    const morceaux = []
    const j = jourDe(e.quand)
    if (j !== jour) { jour = j; morceaux.push(`<span class="msg-jour">${esc(dateLongue(j))}</span>`) }
    if (e.type === 'proposition') {
      const x = e.x
      const enCoursEnvoi = x.etatEnvoi === 'en_cours'
      const boutons = peutEcrireMessages() && !enCoursEnvoi ? `<span class="bulle__actions">
          <details class="bulle-menu">
            <summary aria-label="${esc(t('messages.more_actions'))}" title="${esc(t('messages.more_actions'))}">${icone('i-more')}</summary>
            <div class="bulle-menu__liste"><button type="button" data-rejeter="${esc(String(x.id))}">${esc(t('messages.proposal_reject'))}</button></div>
          </details>
          <button type="button" class="btn btn--secondary" data-modifier="${esc(String(x.id))}">${esc(t('messages.proposal_edit'))}</button>
          <button type="button" class="btn btn--primary" data-envoyer-prop="${esc(String(x.id))}">${icone('i-send')}${esc(t('messages.send'))}</button>
        </span>` : ''
      morceaux.push(`<div class="bulle bulle--proposition${x.etatEnvoi === 'echec' ? ' bulle--echec' : ''}">
        <span class="bulle__entete">${icone('i-ai', 'icon icon--robot')}${esc(t('messages.proposal'))}</span>${esc(x.suggested_reply || x.summary || '')}${boutons}</div>
        <span class="bulle-meta">${enCoursEnvoi ? esc(t('messages.sending'))
          : x.etatEnvoi === 'echec' ? `<span class="msg-echec">${esc(t('messages.not_sent'))}</span> · <button type="button" class="link caption msg-reessayer" data-envoyer-prop="${esc(String(x.id))}">${esc(t('messages.retry'))}</button>` : ''}</span>`)
    } else {
      const m = e.m
      const voyageur = m.direction === 'inbound'
      morceaux.push(`<div class="bulle ${voyageur ? 'bulle--voyageur' : 'bulle--hote'}">${esc(m.body || '')}</div>
        <span class="bulle-meta${voyageur ? ' bulle-meta--voyageur' : ''}">${!voyageur && m.kind === 'auto' ? icone('i-ai') : ''}${esc(valide(m.sent_at) ? I18n.time(new Date(m.sent_at)) : '')}</span>`)
    }
    return morceaux.join('')
  }).join('')
    // Les envois en cours ou ECHOUES, toujours en bas du fil : le texte ne se
    // perd jamais (spec §3.4), « Réessayer » rejoue le même envoi.
    + (etat.envois.get(String(c.bookId)) || []).map((e, i) => `
      <div class="bulle bulle--hote${e.etatEnvoi === 'echec' ? ' bulle--echec' : ''}">${esc(e.texte)}</div>
      <span class="bulle-meta">${e.etatEnvoi === 'echec'
        ? `<span class="msg-echec">${esc(t('messages.not_sent'))}</span> · <button type="button" class="link caption msg-reessayer" data-reessayer="${i}">${esc(t('messages.retry'))}</button>`
        : esc(t('messages.sending'))}</span>`).join('')
  deroule.querySelectorAll('[data-reessayer]').forEach(b =>
    b.addEventListener('click', () => reessayer(c, Number(b.dataset.reessayer))))
  deroule.querySelectorAll('[data-envoyer-prop]').forEach(b =>
    b.addEventListener('click', () => envoyerProposition(b.dataset.envoyerProp)))
  deroule.querySelectorAll('[data-modifier]').forEach(b =>
    b.addEventListener('click', () => modifierProposition(b.dataset.modifier)))
  deroule.querySelectorAll('[data-rejeter]').forEach(b =>
    b.addEventListener('click', () => rejeterProposition(b.dataset.rejeter)))
  deroule.scrollTop = deroule.scrollHeight

  // La saisie (etape 2) : retiree sans droit d'ecriture, jamais grisee.
  const saisie = $('[data-bind="saisie"]')
  saisie.hidden = !peutEcrireMessages()
  const enPause = etat.pauses[String(c.propertyId)] === true
  const btnIA = $('[data-bind="proposer"]')
  btnIA.disabled = enPause
  btnIA.title = enPause ? t('messages.paused') : t('messages.propose')
}

// ─── Envoi manuel (etape 2) ──────────────────────────────────────────────────
// UN SEUL ENDROIT qui choisit l'endpoint, la regle de l'ancienne page : un
// bien Channex (reference UUID) passe par /api/channel-message — qui route
// cote serveur par la SOURCE (fil OTA, ou e-mail pour une resa Offline) — et
// un bien Beds24 (reference numerique) par /api/beds24. JAMAIS un provider
// depuis la page.
async function posterMessage (c, texte) {
  const isChannex = String(c.propertyId || '').includes('-')
  const endpoint = isChannex ? '/api/channel-message' : '/api/beds24'
  const payload = isChannex
    ? { bookingId: c.bookId, message: texte, propertyId: c.propertyId || null }
    : { action: 'sendMessage', bookingId: c.bookId, message: texte, propertyId: c.propertyId || null }
  return appel(endpoint, payload)
}
function envoisDe (bookId) {
  const k = String(bookId)
  if (!etat.envois.has(k)) etat.envois.set(k, [])
  return etat.envois.get(k)
}
async function lancerEnvoi (c, entree) {
  entree.etatEnvoi = 'en_cours'
  renderFil()
  try {
    await posterMessage(c, entree.texte)
    // Parti : la bulle definitive viendra du coeur (double ecriture messages).
    const liste = envoisDe(c.bookId)
    liste.splice(liste.indexOf(entree), 1)
    // Un envoi apres « Modifier » VALIDE la proposition descendue dans la
    // saisie (etape 3) : meme sequence que l'ancienne page — l'envoi est
    // parti, la cloture suit. La bulle porte l'avatar hote, pas le robot.
    const ed = etat.enEdition
    if (ed && String(ed.bookId) === String(c.bookId)) {
      const x = etat.taches.find(v => String(v.id) === String(ed.tacheId))
      etat.enEdition = null
      if (x) { await cloreTache(x, 'done', entree.texte, c); return }
    }
    c.messages.push({ direction: 'outbound', body: entree.texte, sent_at: new Date().toISOString(), kind: 'message' })
    c.lastTime = new Date().toISOString()
    renderFil(); renderListe()
  } catch (err) {
    logger.error('Messages', 'envoi', err)
    entree.etatEnvoi = 'echec'
    renderFil()
  }
}
async function envoyer () {
  const c = etat.conversations.find(x => String(x.bookId) === String(etat.ouverte))
  const zone = $('[data-bind="texte"]')
  const texte = zone.value.trim()
  if (!c || !texte) return
  zone.value = ''
  ajusterHauteur(zone)
  const entree = { texte, etatEnvoi: 'en_cours' }
  envoisDe(c.bookId).push(entree)
  lancerEnvoi(c, entree)
}
function reessayer (c, index) {
  const entree = (etat.envois.get(String(c.bookId)) || [])[index]
  if (entree) lancerEnvoi(c, entree)
}

// ─── Propositions : Envoyer / Modifier / Rejeter (etape 3) ───────────────────
// « Envoyer » suit LE CHEMIN DE L'ANCIENNE PAGE (messagerie.html) : d'abord
// posterMessage (routage par source, le meme que l'envoi manuel), PUIS la
// cloture — statut + journal — par l'action `proposition` de /api/messages.
// Jamais un second chemin d'envoi.
const tacheParId = (id) => etat.taches.find(x => String(x.id) === String(id))
async function envoyerProposition (id) {
  const c = etat.conversations.find(x => String(x.bookId) === String(etat.ouverte))
  const x = tacheParId(id)
  if (!c || !x || x.etatEnvoi === 'en_cours') return
  x.etatEnvoi = 'en_cours'
  renderFil()
  try {
    await posterMessage(c, x.suggested_reply || '')
    await cloreTache(x, 'done', x.suggested_reply || '', c)
  } catch (err) {
    logger.error('Messages', 'envoi proposition', err)
    x.etatEnvoi = 'echec'
    renderFil()
  }
}
function modifierProposition (id) {
  const x = tacheParId(id)
  if (!x) return
  const zone = $('[data-bind="texte"]')
  zone.value = x.suggested_reply || ''
  ajusterHauteur(zone)
  etat.enEdition = { tacheId: x.id, bookId: String(etat.ouverte) }
  renderFil()
  zone.focus()
}
async function rejeterProposition (id) {
  const x = tacheParId(id)
  if (!x || x.etatEnvoi === 'en_cours') return
  const c = etat.conversations.find(v => String(v.bookId) === String(etat.ouverte))
  await cloreTache(x, 'ignored', null, c)
}
// Cloture cote serveur, puis retrait de l'ecran et badge a jour. Si la cloture
// echoue APRES un envoi reussi, la bulle part quand meme (le message EST
// parti) ; au rechargement la proposition reviendra au-dessus du message
// envoye et « Rejeter » la fermera — on ne renvoie jamais deux fois tout seul.
async function cloreTache (x, statut, texte, c) {
  try {
    await appel('/api/messages', { action: 'proposition', task_id: String(x.id), statut, ...(texte ? { texte } : {}) })
  } catch (err) {
    // 409 deja_close : fermee ailleurs (ancienne page, autre onglet) — meme sortie.
    if (err.status !== 409) logger.error('Messages', 'cloture proposition', err)
  }
  etat.taches = etat.taches.filter(v => String(v.id) !== String(x.id))
  indexerTaches()
  if (etat.enEdition && String(etat.enEdition.tacheId) === String(x.id)) etat.enEdition = null
  if (statut === 'done' && c) {
    c.messages.push({ direction: 'outbound', body: texte, sent_at: new Date().toISOString(), kind: 'message' })
    c.lastTime = new Date().toISOString()
  }
  majBadge()
  renderFiltres(); renderListe(); renderFil()
}
function majBadge () {
  HSNav.render({ badges: { pendingMessages: etat.taches.length }, peutLire })
}

// ─── « Proposer une reponse » (etape 2) ──────────────────────────────────────
async function proposer () {
  const c = etat.conversations.find(x => String(x.bookId) === String(etat.ouverte))
  if (!c) return
  const btn = $('[data-bind="proposer"]'), note = $('[data-bind="saisie-etat"]')
  btn.disabled = true
  note.hidden = false
  note.textContent = t('messages.proposing')
  try {
    const r = await appel('/api/guestflow-proposer', { bookingId: c.bookId, propertyId: null })
    if (r.proposition) {
      note.hidden = true
      await rechargerTaches()
      renderFiltres(); renderListe(); renderFil()
    } else {
      note.textContent = r.message || t('messages.no_proposal')
    }
  } catch (err) {
    note.textContent = err.message || t('messages.no_proposal')
  } finally {
    btn.disabled = etat.pauses[String(c.propertyId)] === true
  }
}
async function rechargerTaches () {
  const { data, error } = await supabase.from('agent_tasks')
    .select('id, book_id, property_id, guest_name, task_type, summary, suggested_reply, status, created_at')
    .in('status', ['pending_validation']).eq('user_id', compteCourant())
    .order('created_at', { ascending: false }).limit(200)
  if (error) return
  const sejours = etat.conversations
    .filter(c => c.lastNight && !STATUTS_SANS_SEJOUR.has(String(c.status || '').toLowerCase()))
    .map(c => ({ id: c.bookId, propId: c.propertyId, departure: String(c.lastNight).slice(0, 10) }))
  etat.taches = tachesOuvertes(data || [], { bookings: sejours, aujourdHui: etat.aujourdHui })
  indexerTaches()
  majBadge()
}

// La zone de texte grandit jusqu'a 6 lignes (spec §3.4).
function ajusterHauteur (zone) {
  zone.style.height = 'auto'
  zone.style.height = Math.min(zone.scrollHeight, 6 * 24 + 16) + 'px'
}
function dateLongue (jour) {
  const [a, m, d] = jour.split('-').map(Number)
  return I18n.date(new Date(Date.UTC(a, m - 1, d, 12)), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
}
function ouvrir (bookId) {
  // Changer de fil pendant un « Modifier » : la proposition REVIENT dans son
  // fil (elle n'est pas close), le texte reste dans la saisie (jamais perdu) —
  // mais l'envoyer ailleurs ne validera rien.
  if (etat.enEdition && String(etat.enEdition.bookId) !== String(bookId)) etat.enEdition = null
  etat.ouverte = bookId
  const c = etat.conversations.find(x => String(x.bookId) === String(bookId))
  // L'ouverture POSE l'etat lu (etape 2) — optimiste a l'ecran, silencieux en
  // cas de refus (un profil en lecture seule n'ecrit pas, l'heuristique reste).
  if (c && nonLue(c) && peutEcrireMessages()) {
    c.readAt = new Date().toISOString()
    appel('/api/messages', { action: 'lu', booking_id: String(bookId) })
      .catch(e => logger.error('Messages', 'read_at', e))
  }
  renderListe(); renderFil()
}

// ─── Démarrage ──────────────────────────────────────────────────────────────
async function init () {
  const session = await requireAuth()
  if (!session) return
  await I18n.init()
  document.addEventListener('i18n:changed', () => location.reload())
  const user = await getUser()
  $('[data-bind="initials"]').textContent = (user?.email || '').slice(0, 2).toUpperCase()
  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
    outils: [
      peutLire('reservations') && { href: '/apps/yield', key: 'nav.tool_yield', icon: 'i-price' },
      estTitulaire() && { href: '/apps/serrures', key: 'nav.tool_locks', icon: 'i-key' },
      estTitulaire() && { href: '/apps/sms', key: 'nav.tool_sms', icon: 'i-send' },
      estTitulaire() && { href: '/apps/reservation-directe', key: 'nav.tool_direct', icon: 'i-calendar' },
      estTitulaire() && { href: '/connexions', key: 'nav.tool_connections', icon: 'i-link' },
      estTitulaire() && { href: '/abonnement', key: 'nav.tool_billing', icon: 'i-euro' }
    ].filter(Boolean)
  })
  if (!peutLire('messages')) {
    $('.msg-liste__outils').hidden = true
    $('[data-list="conversations"]').innerHTML = `<p class="muted" style="padding: 14px">${esc(t('messages.no_access'))}</p>`
    HSNav.render({ peutLire })
    return
  }
  await charger()
  HSNav.render({ badges: etat.chargementOk ? { pendingMessages: etat.taches.length } : {}, peutLire })
  renderFiltres(); renderListe()

  $('[data-bind="recherche"]').addEventListener('input', (e) => { etat.recherche = e.target.value; renderListe() })
  document.querySelectorAll('[data-filtre]').forEach(b => b.addEventListener('click', () => {
    etat.filtre = b.dataset.filtre; renderFiltres(); renderListe()
  }))
  $('[data-bind="retour"]').addEventListener('click', () => { etat.ouverte = null; renderListe(); renderFil() })
  // Saisie (etape 2) : Ctrl/⌘+Entree envoie, Entree = retour a la ligne.
  const zoneTexte = $('[data-bind="texte"]')
  zoneTexte.addEventListener('input', () => ajusterHauteur(zoneTexte))
  zoneTexte.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); envoyer() }
  })
  $('[data-bind="envoyer"]').addEventListener('click', envoyer)
  $('[data-bind="proposer"]').addEventListener('click', proposer)

  // Ouverture directe `?conv=` (liens de l'accueil, plus tard) : seulement si
  // le fil existe — jamais un écran « introuvable » depuis un lien interne.
  const demandee = new URLSearchParams(location.search).get('conv')
  if (demandee && etat.conversations.some(x => String(x.bookId) === String(demandee))) ouvrir(String(demandee))
}

init().catch(e => logger.error('Messages', e.message, e))
</script>
