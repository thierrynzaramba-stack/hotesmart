    // l'automatique est un geste d'URGENCE. Il part a la seconde ou la case
    // change, comme avant. Un kill switch qui attend un « Enregistrer » n'est
    // pas un kill switch.
    + `<div class="msg-tiroir__bloc" style="border-bottom: 0">
      <button type="button" class="btn btn--primary btn--block" data-panneau-save ${etat.modeEnCours ? 'disabled' : ''}>${icone('i-check')}${esc(t('messages.panneau_save'))}</button>
      <p class="caption muted" style="margin: 0">${esc(t('messages.alerts_hint'))}</p>
    </div>`
}

// ── Volet « Alertes » : 2 types x 2 canaux, porte Brevo, test apres
// enregistrement (le serveur n'accepte que des destinataires EN BASE).
function voletAlertes (ref) {
  if (etat.configIA === null) {
    return `<p class="caption muted" style="padding: 14px 18px">${esc(t('messages.load_error'))}</p>`
  }
  const cfg = etat.configIA[ref] || {}
  const types = [['intervention', 'messages.alert_intervention'], ['info_unknown', 'messages.alert_info']]
  return types.map(([k, cle]) => {
    const a = cfg[k] || {}
    return `<div class="msg-tiroir__bloc">
      <span class="msg-tiroir__nom">${esc(t(cle))}</span>
      <div class="msg-tiroir__canal">
        <label class="row caption" style="gap: 6px">
          <input type="checkbox" data-alerte="${k}|sms_enabled" ${a.sms_enabled && etat.brevo ? 'checked' : ''} ${etat.brevo && !etat.modeEnCours ? '' : 'disabled'}>
          ${esc(t('messages.channel_sms'))}
        </label>
        ${etat.brevo
          ? `<textarea rows="2" data-alerte="${k}|sms_lines" ${etat.modeEnCours ? 'disabled' : ''} placeholder="${esc(t('messages.recipients_sms_ph'))}">${esc(a.sms_lines || '')}</textarea>
            <button type="button" class="link caption" data-tester="${k}|sms">${esc(t('messages.test_send'))}</button>`
          : `<p class="caption muted">${esc(t('messages.sms_needs_brevo'))} <a class="link" href="/connexions">${esc(t('messages.sms_connect'))}</a></p>`}
      </div>
      <div class="msg-tiroir__canal">
        <label class="row caption" style="gap: 6px">
          <input type="checkbox" data-alerte="${k}|email_enabled" ${a.email_enabled !== false ? 'checked' : ''} ${etat.modeEnCours ? 'disabled' : ''} style="accent-color: var(--info)">
          ${esc(t('messages.channel_email'))}
        </label>
        <textarea rows="2" data-alerte="${k}|email_lines" ${etat.modeEnCours ? 'disabled' : ''} placeholder="${esc(t('messages.recipients_email_ph'))}">${esc(a.email_lines || '')}</textarea>
        <button type="button" class="link caption" data-tester="${k}|email">${esc(t('messages.test_send'))}</button>
      </div>
    </div>`
  }).join('')
  // Le bouton des alertes a disparu : un seul « Enregistrer » couvre le
  // panneau (voir la note en fin de voletIA).
}

function brancherTiroir (corps, ref) {
  const d = delaisEnCours(ref)
  // Les pilules : un clic POSE la valeur dans l'etat d'edition, et re-rend.
  // Rien ne part au serveur avant « Enregistrer » (demande de Thierry : un
  // seul bouton pour tout le panneau).
  corps.querySelectorAll('[data-delai]').forEach(x =>
    x.addEventListener('click', () => {
      const [champ, val] = x.dataset.delai.split('|')
      const cle = champ === 'reponse' ? 'reponse_ia' : 'alerte_info'
      if (val === 'autre') {
        // « Autre… » ouvre les deux champs sans changer la valeur, SAUF si la
        // valeur courante est une pilule : on part alors d'un pas qui n'est
        // aucune des pilules, pour que les champs apparaissent vraiment.
        if (VALEURS_PILULES.includes(d[cle]) || d[cle] === null) d[cle] = 30
      } else {
        d[cle] = Number(val)
      }
      renderTiroir()
    }))
  // « Je valide chaque reponse » : l'ancien Mode Test, dit par son effet.
  //
  // ⚠ LA CONFIRMATION DE THIERRY SURVIT AU CHANGEMENT D'INTERRUPTEUR, et je
  // l'avais perdue en route. L'ancien ecran demandait confirmation pour passer
  // en Auto, « parce que tout ce que l'IA sait part sans validation » — c'est
  // sa demande du 11 octobre 2026. Le toggle a disparu ; LE GESTE, lui, est
  // toujours la : quitter « Je valide chaque reponse » autorise des envois
  // sans relecture. Un remplacement d'ecran ne doit pas emporter une garde
  // produit en silence.
  //
  // Et c'est le SEUL chemin pour en sortir : les pilules ne sont pas rendues
  // en mode manuel. Une seule place a garder.
  corps.querySelector('[data-delai-manuel]')?.addEventListener('click', () => {
    if (d.reponse_ia === null && !window.confirm(t('messages.mode_confirm_auto'))) return
    d.reponse_ia = d.reponse_ia === null ? 0 : null
    renderTiroir()
  })
  // Les champs h/min : l'etat suit la frappe, mais on ne RE-REND pas (le
  // re-render replacerait le curseur au debut a chaque touche).
  const lireSurMesure = (champ) => {
    const cle = champ === 'reponse' ? 'reponse_ia' : 'alerte_info'
    const h = Number(corps.querySelector('[data-delai-h="' + champ + '"]')?.value || 0)
    const m = Number(corps.querySelector('[data-delai-m="' + champ + '"]')?.value || 0)
    const total = (Number.isFinite(h) ? h : 0) * 60 + (Number.isFinite(m) ? m : 0)
    // Bornes du contrat serveur (lib/guestflow/delais-contrat.js) : 0 a 1440.
    d[cle] = Math.max(0, Math.min(1440, total))
  }
  corps.querySelectorAll('[data-delai-h]').forEach(x =>
    x.addEventListener('input', () => lireSurMesure(x.dataset.delaiH)))
  corps.querySelectorAll('[data-delai-m]').forEach(x =>
    x.addEventListener('input', () => lireSurMesure(x.dataset.delaiM)))
  // La sourdine : la case re-rend (elle ouvre/ferme rien, mais l'etat doit
  // suivre), les heures non.
  corps.querySelector('[data-sourdine-active]')?.addEventListener('change', (e) => {
    d.sourdine.active = e.target.checked === true
  })
  corps.querySelector('[data-sourdine-debut]')?.addEventListener('change', (e) => {
    d.sourdine.debut = e.target.value || '22:00'
  })
  corps.querySelector('[data-sourdine-fin]')?.addEventListener('change', (e) => {
    d.sourdine.fin = e.target.value || '08:00'
  })
  // ⚠ LA PAUSE RESTE IMMEDIATE : couper l'automatique est un geste d'urgence,
  // il n'attend pas un « Enregistrer ».
  corps.querySelector('[data-tiroir-pause]')?.addEventListener('change', (e) =>
    basculerPause(ref, e.target.checked))
  corps.querySelector('[data-panneau-save]')?.addEventListener('click', () => enregistrerPanneau(corps, ref))
  corps.querySelectorAll('[data-tester]').forEach(x => x.addEventListener('click', () => {
    const [type, canal] = x.dataset.tester.split('|')
    testerCanal(corps, ref, type, canal)
  }))
}

// Lire TOUT le panneau, en une fois, AVANT que quoi que ce soit ne re-rende.
// C'est la seule facon de ne rien perdre : le conteneur est reconstruit a
// chaque `renderTiroir()`, et ce qui n'a pas ete lu avant est perdu.
function lireLePanneau (corps, ref) {
  // ⚠ SANS CLE BREVO, LES CHAMPS SMS N'EXISTENT PAS A L'ECRAN — ET LES LIRE
  // QUAND MEME LES EFFACE. `sms_enabled: etat.brevo && …checked` donnait
  // `false` chez un hote sans Brevo : enregistrer le panneau aurait DESACTIVE
  // ses SMS d'alerte sans qu'il touche a ce reglage. Le repli sur la valeur
  // enregistree est la garde de l'ancien chemin.
  const avant = (etat.configIA && etat.configIA[ref]) || {}
  const lireType = (k) => ({
    sms_enabled: etat.brevo
      ? corps.querySelector('[data-alerte="' + k + '|sms_enabled"]')?.checked === true
      : (avant[k] && avant[k].sms_enabled === true),
    sms_lines: etat.brevo
      ? (corps.querySelector('[data-alerte="' + k + '|sms_lines"]')?.value || '')
      : ((avant[k] && avant[k].sms_lines) || ''),
    email_enabled: corps.querySelector('[data-alerte="' + k + '|email_enabled"]')?.checked === true,
    email_lines: corps.querySelector('[data-alerte="' + k + '|email_lines"]')?.value || ''
  })
  return {
    alertes: { intervention: lireType('intervention'), info_unknown: lireType('info_unknown') },
    consignes: {
      global: (corps.querySelector('[data-consignes="global"]')?.value || '').trim(),
      bien: (corps.querySelector('[data-consignes="bien"]')?.value || '').trim()
    }
  }
}

// ─── UN SEUL « ENREGISTRER », TROIS ECRITURES ───────────────────────────────
//
// ⚠ ELLES NE PEUVENT PAS VOYAGER ENSEMBLE, et ce n'est pas un choix : les
// delais et les alertes sont deux CIBLES de /api/agent-config, et l'endpoint
// refuse par 400 une requete qui en porte deux (garde posee en review — un
// POST du blob entier depuis deux onglets s'ecrasait). Les consignes, elles,
// vivent dans `agent_prompting`, sous RLS.
//
// ⚠ DONC L'ECHEC EST PARTIEL, ET IL SE DIT PARTIE PAR PARTIE. Un « erreur »
// global laisserait l'hote relancer les trois a l'aveugle, sans savoir
// laquelle est passee — et re-poster les delais qui ont deja reussi n'est pas
// anodin : ils gouvernent les envois.
async function enregistrerPanneau (corps, ref) {
  if (etat.modeEnCours) return

  // ⚠ LE FORMULAIRE SE LIT AVANT TOUT RE-RENDU, ET C'EST UN CONSTAT GRAVE DE LA
  // SECONDE REVUE. J'appelais `renderTiroir()` d'abord : il fait
  // `corps.innerHTML = voletIA(ref)` sur le MEME conteneur, donc il reconstruit
  // les champs depuis `etat.configIA` et `etat.prompting` — c'est-a-dire depuis
  // la BASE. Un hote qui tapait un nouveau destinataire d'alerte puis cliquait
  // « Enregistrer » envoyait les ANCIENNES valeurs, et lisait « enregistré ».
  // Une perte de saisie silencieuse, sur le bouton qui existe pour enregistrer.
  //
  // Les deux fonctions que ce bouton remplace (`enregistrerAlertes`,
  // `enregistrerConsignes`) lisaient le DOM SANS re-rendre : la regression est
  // entree avec la fusion en un seul bouton. Seuls les delais survivaient,
  // parce qu'ils vivent dans `etat.delaisEdit`.
  const d = delaisEnCours(ref)
  const saisi = lireLePanneau(corps, ref)

  etat.modeEnCours = true
  geler(corps, true)
  renderTiroir()
  const echoues = []

  // 1. Les delais (cible `delais`).
  try {
    await appel('/api/agent-config', { delais_ref: ref, delais: {
      reponse_ia: d.reponse_ia === null ? null : Math.max(0, Math.min(1440, d.reponse_ia)),
      alerte_info: Math.max(0, Math.min(1440, d.alerte_info)),
      sourdine: { active: d.sourdine.active === true, debut: d.sourdine.debut, fin: d.sourdine.fin }
    } })
  } catch (err) {
    logger.error('Messages', 'delais', err)
    echoues.push(t('messages.partie_delais'))
  }

  // 2. Les alertes (cible `alertes`) — memes champs qu'avant.
  try {
    await appel('/api/agent-config', { alertes_ref: ref, alertes: saisi.alertes })
  } catch (err) {
    logger.error('Messages', 'alertes', err)
    echoues.push(t('messages.partie_alertes'))
  }

  // 3. Les consignes (table `agent_prompting`, RLS).
  if (etat.prompting !== null) {
    try {
      await ecrireConsigne(compteCourant(), null, saisi.consignes.global)
      await ecrireConsigne(compteCourant(), ref, saisi.consignes.bien)
      etat.prompting.global = saisi.consignes.global
      etat.prompting.overrides[ref] = saisi.consignes.bien
    } catch (err) {
      logger.error('Messages', 'consignes', err)
      echoues.push(t('messages.partie_consignes'))
    }
  }

  // ⚠ LE BLOB EST RELU, TOUJOURS : l'ecran montre l'etat REEL en base, jamais
  // l'etat suppose (demande de Thierry du 11 octobre 2026). Une relecture
  // echouee ferme le volet plutot que de montrer un faux vide.
  try {
    const relu = await appel('/api/agent-config')
    etat.configIA = relu.config || {}
    etat.modes = modesDe(relu.config)
  } catch (err) {
    logger.error('Messages', 'panneau relecture', err)
    etat.configIA = null
  }
  // L'etat d'edition repart de la base : ce qui n'est pas passe redevient
  // visible tel qu'il est enregistre, et l'hote voit ce qu'il doit refaire.
  etat.delaisEdit = null
  etat.modeEnCours = false
  renderTiroir()
  noteReglage(echoues.length
    ? t('messages.panneau_partiel', { parties: echoues.join(', ') })
    : t('messages.panneau_saved'), echoues.length === 0)
}

// Les consignes : meme table, meme RLS que l'ancienne page, mais INSERT
// D'ABORD puis suppression des AUTRES lignes (.neq sur l'id insere) — le
// delete-puis-insert de l'ancienne page perdait les consignes quand l'insert
// echouait, et un delete en echec non lu laissait des DOUBLONS que le
// maybeSingle du cron lisait comme « aucune consigne » (releve en review).
async function ecrireConsigne (uid, propertyId, texte) {
  const portee = (q) => propertyId === null ? q.is('property_id', null) : q.eq('property_id', propertyId)
  if (texte) {
    const { data: neuve, error: eI } = await supabase.from('agent_prompting')
      .insert({ user_id: uid, property_id: propertyId, instructions: texte }).select('id').single()
    if (eI) throw eI
    const { error: eD } = await portee(supabase.from('agent_prompting').delete().eq('user_id', uid)).neq('id', neuve.id)
    if (eD) throw eD
  } else {
    const { error: eD } = await portee(supabase.from('agent_prompting').delete().eq('user_id', uid))
    if (eD) throw eD
  }
}
// Pendant une ecriture, les champs du volet gelent : une frappe pendant le
// POST serait silencieusement ecartee par le re-render (releve en review).
function geler (corps, fige) {
  corps.querySelectorAll('textarea, input, button, select').forEach(x => { x.disabled = fige })
}


// Le test part au premier destinataire EN BASE (api/alert-test n'accepte que
// ceux-la — piege documente par l'ancienne page). Si l'ecran porte une
// edition NON enregistree, on refuse : le test partirait a l'ANCIEN
// destinataire en affichant un succes (releve en review).
async function testerCanal (corps, ref, type, canal) {
  if (etat.configIA === null) return
  const cfg = (etat.configIA[ref] || {})[type] || {}
  const lignes = String(canal === 'sms' ? cfg.sms_lines || '' : cfg.email_lines || '')
  const champ = canal === 'sms' ? 'sms_lines' : 'email_lines'
  const ecran = corps.querySelector(`[data-alerte="${type}|${champ}"]`)
  if (ecran && ecran.value.trim() !== lignes.trim()) { noteReglage(t('messages.test_first_save')); return }
  const premier = lignes.split('\n').map(l => l.trim()).filter(Boolean)[0] || ''
  const to = premier.includes(':') ? premier.slice(premier.indexOf(':') + 1).trim() : premier
  if (!to) { noteReglage(t('messages.test_first_save')); return }
  try {
    await appel('/api/alert-test', { channel: canal, to })
    noteReglage(t('messages.test_sent'), true)
  } catch (err) {
    logger.error('Messages', 'test alerte', err)
    noteReglage(err.message || t('messages.mode_error'))
  }
}

function ouvrirTiroir (ouvert) {
  const tiroir = $('[data-bind="tiroir"]')
  tiroir.hidden = !ouvert
  $('[data-bind="tiroir-note"]').hidden = true
  // L'etat ouvert/ferme s'ANNONCE (les onglets retires portaient
  // aria-pressed ; les boutons portent aria-expanded — releve en review).
  document.querySelectorAll('[data-ouvre-volet]').forEach(b =>
    b.setAttribute('aria-expanded', String(ouvert && etat.tiroirVolet === b.dataset.ouvreVolet)))
  if (ouvert) renderTiroir()
}

// ─── Epingle et archivage manuel (etape 4, portes de l'ancienne page) ──────
// L'etat affiche vient de la REPONSE du writer, pas de l'etat suppose.
function noteErreur (err) {
  const note = $('[data-bind="saisie-etat"]')
  note.hidden = false
  note.textContent = (err && err.message) || t('messages.load_error')
}
async function basculerEpingle (c) {
  try {
    const r = await appel('/api/messages', { action: c.epinglee ? 'desepingler' : 'epingler', booking_id: String(c.bookId) })
    c.epinglee = r.epinglee === true
  } catch (err) { logger.error('Messages', 'epingle', err); noteErreur(err) }
  renderListe(); renderFil()
}
async function basculerArchive (c) {
  try {
    const r = await appel('/api/messages', { action: c.archivee ? 'desarchiver' : 'archiver', booking_id: String(c.bookId) })
    c.archivee = r.archivee === true
  } catch (err) { logger.error('Messages', 'archivage', err); noteErreur(err) }
  renderFiltres(); renderListe(); renderFil()
}

// ─── « Evaluer {prenom} ? » au depart du voyageur (dette 67) ─────────────────
// RIEN avant le depart ; silencieux sans bus ou sans droit ; « publiee ✓ »
// quand c'est fait. Le statut vient du BUS (avis.statut) et le geste OUVRE
// la fenetre standard du coeur (avis.evaluer, les boutons a niveaux du
// chantier avis) — meme writer que la fiche resa, rien de duplique.
function sejourTerminePour (c) {
  // La regle du « quand » est PARTAGEE avec la fiche resa (des le JOUR du
  // depart) : jamais recopiee, les deux copies divergeaient d'un jour.
  return departEvaluable(c.lastNight, etat.aujourdHui)
    && !STATUTS_SANS_SEJOUR.has(String(c.status || '').toLowerCase())
}
function peindreEvaluation (c, cible) {
  if (!cible || !sejourTerminePour(c)) return
  const connu = etat.evaluations.get(String(c.bookId))
  if (connu === 'rien' || connu === 'encours') return
  if (connu) { peindreEtatEvaluation(c, cible, connu); return }
  chargerEvaluation(c)
}
async function chargerEvaluation (c) {
  const bookId = String(c.bookId)
  // 'encours' bloque la redemande PENDANT ce rendu seulement : un echec
  // transitoire ne se fige jamais (le cache s'invalide a chaque ouverture
  // du fil — revue de 658d758), une reponse « rien » si.
  etat.evaluations.set(bookId, 'encours')
  try {
    const { hsBus: bus } = await import('/shared/hs-bus.js')
    if (!bus) { etat.evaluations.delete(bookId); return }
    const r = await bus.demander('avis.statut', { booking_uid: bookId })
    if (!r || !r.ok || !r.data) { etat.evaluations.delete(bookId); return }
    if (r.data.etat === 'publiee') etat.evaluations.set(bookId, 'publiee')
    else if (r.data.evaluable && peutEcrireMessages() && await bus.disponible('avis.evaluer')) {
      etat.evaluations.set(bookId, 'evaluable')
    } else { etat.evaluations.set(bookId, 'rien'); return }
    if (String(etat.ouverte) === bookId) renderFil()
  } catch (err) {
    logger.error('Messages', 'evaluation', err)
    etat.evaluations.delete(bookId)
  }
}
function peindreEtatEvaluation (c, cible, statut) {
  if (statut === 'publiee') {
    cible.outerHTML = `<span class="msg-jour">${icone('i-review', 'icon')} ${esc(t('messages.review_published'))}</span>`
    return
  }
  const prenom = String(c.guestName || '').trim().split(/\s+/)[0] || t('messages.guest')
  const parent = cible.parentElement
  cible.outerHTML = `<div class="bulle bulle--proposition">
      <span class="bulle__entete">${icone('i-review', 'icon icon--robot')}${esc(t('messages.review_ask', { name: prenom }))}</span>
      <span class="bulle__actions">
        <button type="button" class="btn btn--primary" data-evaluer>${esc(t('messages.review_open'))}</button>
      </span>
    </div>`
  // Dans le DEROULE seulement : le premier [data-evaluer] du document
  // pourrait etre ailleurs (revue de 658d758).
  parent?.querySelector('[data-evaluer]')?.addEventListener('click', () => ouvrirEvaluation(c))
}
async function ouvrirEvaluation (c) {
  let bus = null
  try { bus = (await import('/shared/hs-bus.js')).hsBus } catch { return }
  if (!bus) return
  try {
    await bus.ouvrir('avis.evaluer', { booking_uid: String(c.bookId) })
  } catch (err) { logger.error('Messages', 'evaluer', err) }
  // Au retour de la fenetre : le statut se RELIT (publiee ✓ sans rechargement).
  etat.evaluations.delete(String(c.bookId))
  chargerEvaluation(c)
}

// La zone de texte grandit jusqu'a 6 lignes (spec §3.4).
function ajusterHauteur (zone) {
  zone.style.height = 'auto'
  zone.style.height = Math.min(zone.scrollHeight, 6 * 24 + 16) + 'px'
}
function dateLongue (jour) {
  const [a, m, d] = jour.split('-').map(Number)
  return I18n.date(new Date(Date.UTC(a, m - 1, d, 12)), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
}
function ouvrir (bookId) {
  // Le statut d'evaluation se REDEMANDE a chaque ouverture : une publication
  // faite depuis la fiche resa, ou un echec transitoire, ne fige rien.
  etat.evaluations.delete(String(bookId))
  // Changer de fil pendant un « Modifier » : la proposition REVIENT dans son
  // fil (elle n'est pas close). Le texte descendu NON retouche repart avec
  // elle (rien n'est perdu, et il n'atterrit pas chez un autre voyageur —
  // releve en review) ; un texte RETOUCHE reste dans la saisie (on ne jette
  // jamais ce que l'hote a tape), mais l'envoyer ailleurs ne validera rien.
  if (etat.enEdition && String(etat.enEdition.bookId) !== String(bookId)) {
    // Quitter le fil, c'est quitter l'editeur : le texte part en base d'abord.
    enregistrerBrouillonEnCours()
    const zone = $('[data-bind="texte"]')
    const xEd = tacheParId(etat.enEdition.tacheId)
    if (xEd && zone.value.trim() === String(xEd.suggested_reply || '').trim()) {
      zone.value = ''
      ajusterHauteur(zone)
    }
    etat.enEdition = null
  }
  etat.ouverte = bookId
  const c = etat.conversations.find(x => String(x.bookId) === String(bookId))
  // L'ouverture POSE l'etat lu (etape 2) — optimiste a l'ecran, silencieux en
  // cas de refus (un profil en lecture seule n'ecrit pas, l'heuristique reste).
  if (c && nonLue(c) && peutEcrireMessages()) {
    c.readAt = new Date().toISOString()
    appel('/api/messages', { action: 'lu', booking_id: String(bookId) })
      .catch(e => logger.error('Messages', 'read_at', e))
  }
  renderListe(); renderFil()
}

// ─── Démarrage ──────────────────────────────────────────────────────────────
async function init () {
  const session = await requireAuth()
  if (!session) return
  await I18n.init()
  document.addEventListener('i18n:changed', () => location.reload())
  const user = await getUser()
  $('[data-bind="initials"]').textContent = (user?.email || '').slice(0, 2).toUpperCase()
  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
    outils: [
      peutLire('reservations') && { href: '/apps/yield', key: 'nav.tool_yield', icon: 'i-price' },
      estTitulaire() && { href: '/apps/serrures', key: 'nav.tool_locks', icon: 'i-key' },
      estTitulaire() && { href: '/apps/sms', key: 'nav.tool_sms', icon: 'i-send' },
      estTitulaire() && { href: '/apps/reservation-directe', key: 'nav.tool_direct', icon: 'i-calendar' },
      estTitulaire() && { href: '/connexions', key: 'nav.tool_connections', icon: 'i-link' },
      estTitulaire() && { href: '/abonnement', key: 'nav.tool_billing', icon: 'i-euro' }
    ].filter(Boolean)
  })
  if (!peutLire('messages')) {
    $('.msg-liste__outils').hidden = true
    $('[data-list="conversations"]').innerHTML = `<p class="muted" style="padding: 14px">${esc(t('messages.no_access'))}</p>`
    HSNav.render({ peutLire })
    return
  }
  await charger()
  HSNav.render({ badges: etat.chargementOk ? { pendingMessages: etat.taches.length } : {}, peutLire })
  renderFiltres(); renderListe()

  // Les deux boutons d'en-tete (retouche du 12 octobre) : un volet par
  // bouton — Messages programmes, et Reponses de l'IA (alertes en bas).
  document.querySelectorAll('[data-ouvre-volet]').forEach(b => {
    b.hidden = !reglagesIci()
    b.addEventListener('click', () => {
      const tiroir = $('[data-bind="tiroir"]')
      const deja = !tiroir.hidden && etat.tiroirVolet === b.dataset.ouvreVolet
      etat.tiroirVolet = b.dataset.ouvreVolet
      ouvrirTiroir(!deja)
    })
  })
  $('[data-bind="tiroir-fermer"]').addEventListener('click', () => ouvrirTiroir(false))
  $('[data-bind="tiroir-bien"]').addEventListener('change', (e) => {
    etat.tiroirBien = e.target.value
    renderTiroir()
  })

  $('[data-bind="recherche"]').addEventListener('input', (e) => { etat.recherche = e.target.value; renderListe() })
  document.querySelectorAll('[data-filtre]').forEach(b => b.addEventListener('click', () => {
    etat.filtre = b.dataset.filtre; renderFiltres(); renderListe()
  }))
  $('[data-bind="retour"]').addEventListener('click', () => { etat.ouverte = null; renderListe(); renderFil() })
  // Saisie (etape 2) : Ctrl/⌘+Entree envoie, Entree = retour a la ligne.
  const zoneTexte = $('[data-bind="texte"]')
  zoneTexte.addEventListener('input', () => ajusterHauteur(zoneTexte))
  // ⚠ LE BROUILLON DE L'HOTE S'ENREGISTRE QUAND IL QUITTE L'EDITEUR
  // (decision 6 de Thierry, 27 octobre 2026). Sans ca, la reprise du compte a
  // rebours enverrait le texte de l'IA — la version que l'hote avait
  // justement commence a corriger.
  //
  // ⚠ AU `blur`, PAS A LA FRAPPE : aucun appel pendant qu'il ecrit. C'est la
  // consigne, et c'est aussi ce qui evite une requete par touche.
  zoneTexte.addEventListener('blur', () => enregistrerBrouillonEnCours())
  zoneTexte.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); envoyer() }
  })
  $('[data-bind="envoyer"]').addEventListener('click', envoyer)
  $('[data-bind="proposer"]').addEventListener('click', proposer)

  // Filtre demandé par l'URL (lien « n de plus » de l'accueil, étape 4).
  const params = new URLSearchParams(location.search)
  // Volet demandé par les redirections de l'ancienne app (?volet=ia ou
  // programmes) : le panneau s'ouvre à l'arrivée — titulaire seulement,
  // comme les boutons qui y mènent.
  const voletDemande = params.get('volet')
  if ((voletDemande === 'ia' || voletDemande === 'programmes') && reglagesIci()) {
    etat.tiroirVolet = voletDemande
    ouvrirTiroir(true)
  }
  const filtreDemande = params.get('filtre')
  if (filtreDemande === 'nonlus' || filtreDemande === 'avalider') {
    etat.filtre = filtreDemande
    renderFiltres(); renderListe()
  }
  // Ouverture directe `?conv=` (liens de l'accueil) : seulement si
  // le fil existe — jamais un écran « introuvable » depuis un lien interne.
  const demandee = params.get('conv')
  if (demandee && etat.conversations.some(x => String(x.bookId) === String(demandee))) ouvrir(String(demandee))
}

init().catch(e => logger.error('Messages', e.message, e))
</script>
</body>
</html>
