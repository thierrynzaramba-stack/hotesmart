<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- PAGE « AVIS » — refonte V5, lot Avis, étape 1.
     Spec : docs/specs/avis-v5/spec-refonte-ui-v5-lot-avis.md ; maquettes dans
     docs/specs/avis-v5/maquette/. Avis vit dans le menu ≡ (spec V5 §3) : aucun
     onglet de la barre n'est actif ici.
     Le contenu (cartes, « À traiter », chiffres) est rendu par
     /core/avis/cartes.js : les avis sont une fonctionnalité du cœur, la page
     n'en porte que l'en-tête, les filtres et les deux fenêtres.
     ⚠ UN APPEL AU CHARGEMENT : /api/ecran/avis (tests/budget-ecran.test.js).
     Les autres ne partent que sur un geste.
     RÈGLES V5 : aucun hexa, aucun texte en dur, aucune icône dessinée ici. -->

<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>

    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>

<main class="page avp">
  <div class="avp-tete">
    <div class="avp-tete__titre">
      <h1 class="h1" data-i18n="avis.titre"></h1>
      <!-- L'état de la publication automatique, sur UNE ligne (demande de
           Thierry du 2 octobre 2026), avec le lien vers son réglage. -->
      <p class="avp-auto" data-bind="auto" hidden></p>
    </div>
    <!-- ⚠ Les deux gestes n'existent qu'au droit `avis: write` (nés cachés) ;
         le serveur revalide chaque geste : ce masquage est un confort. -->
    <button type="button" class="btn btn--secondary btn--icon" data-action="reglages" hidden data-i18n-attr="aria-label:avis.reglages;title:avis.reglages">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-settings"/></svg>
    </button>
    <button type="button" class="btn btn--secondary avp-saisir" data-action="saisir" hidden data-i18n-attr="aria-label:avis.saisir_aria">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-plus"/></svg>
      <span class="avp-saisir__mot" data-i18n="avis.saisir"></span>
    </button>
  </div>

  <div class="avp-filtres">
    <!-- Les périodes viennent du serveur (`PERIODES` fait foi) ; les logements
         de la réponse, donc sans les biens archivés. -->
    <div class="avp-pastilles" role="group" data-bind="periodes" data-i18n-attr="aria-label:avis.periode_aria"></div>
    <div class="avp-pastilles" role="group" data-bind="biens" data-i18n-attr="aria-label:avis.biens_aria"></div>
  </div>

  <div class="avp-chiffres" data-bind="stats" hidden></div>

  <div class="avp-contenu" data-bind="cartes"><p class="muted" data-i18n="common.loading"></p></div>
</main>

<!-- Saisie d'un avis reçu en direct (droit avis = write). -->
<dialog class="avp-feuille" data-bind="saisie" aria-labelledby="avp-saisie-titre">
  <form method="dialog" class="avp-feuille__corps" data-bind="saisie-form" novalidate>
    <div class="avp-feuille__tete">
      <h2 class="avp-h2" id="avp-saisie-titre" data-i18n="avis.saisie_titre"></h2>
      <button type="button" class="btn btn--secondary btn--icon" data-action="saisie-fermer" data-i18n-attr="aria-label:avis.fermer">
        <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-close"/></svg>

    <p class="muted small" data-i18n="avis.saisie_aide"></p>
    <label class="avp-champ"><span data-i18n="avis.saisie_bien"></span><select data-bind="s-bien"></select></label>
    <label class="avp-champ"><span data-i18n="avis.saisie_source"></span>
      <select data-bind="s-source">
        <option value="sms" data-i18n="avis.source_sms"></option>
        <option value="email" data-i18n="avis.source_email"></option>
        <option value="oral" data-i18n="avis.source_oral"></option>
      </select>
    </label>
    <label class="avp-champ"><span data-i18n="avis.saisie_date"></span><input type="date" data-bind="s-date"></label>
    <label class="avp-champ"><span><span data-i18n="avis.saisie_sejour"></span> <span class="muted" data-i18n="avis.facultatif"></span></span>
      <select data-bind="s-sejour"><option value="" data-i18n="avis.sans_rattachement"></option></select>
    </label>
    <label class="avp-champ"><span data-i18n="avis.saisie_texte"></span>
      <textarea data-bind="s-texte" maxlength="5000" rows="5" data-i18n-attr="placeholder:avis.saisie_ph"></textarea>
    </label>
    <p class="avp-erreur" data-bind="s-retour" role="status"></p>
    <div class="avp-feuille__pied">
      <button type="button" class="btn btn--secondary" data-action="saisie-fermer" data-i18n="avis.annuler"></button>
      <button type="button" class="btn btn--primary" data-action="saisie-envoyer" data-i18n="avis.enregistrer"></button>
    </div>
  </form>
</dialog>

<!-- Les réglages des avis, DANS l'app (décision de Thierry du 2 octobre 2026) :
     un volet à droite à l'ordinateur, plein écran au téléphone. -->
<dialog class="avp-volet" data-bind="reglages" aria-labelledby="avp-reglages-titre">
  <div class="avp-volet__tete">
    <h2 class="avp-h2" id="avp-reglages-titre" data-i18n="avis.reglages_titre"></h2>
    <button type="button" class="btn btn--secondary btn--icon" data-action="reglages-fermer" data-i18n-attr="aria-label:avis.fermer">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-close"/></svg>
    </button>
  </div>
  <div class="avp-volet__corps" data-bind="reglages-zone"></div>
</dialog>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { requireAuth } from '/components/auth-guard.js'
import { signOut, supabase } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { logger } from '/shared/logger.js'
import { escapeHtml as esc } from '/shared/properties.js'
import { compteCourant, peutLire, peutEcrire, estTitulaire, comptes, basculerVers, enteteCompte } from '/shared/compte-courant.js'
import { lire as lireCache, ecrire as ecrireCache, oublier as oublierCache } from '/shared/cache-ecran.js'
import { monter as monterCartes } from '/core/avis/cartes.js'

initErrorHandler()
// ⚠ LES MODULES DU CŒUR AVIS (réglages, fenêtre d'évaluation) appellent le
// serveur par `core/avis/appel.js`, qui lit la session et le compte ICI
// (tests/avis-pages-session.test.js) : la même session, le même compte que la
// page, plutôt qu'une seconde lecture qui pourrait diverger.
window._supabase = supabase
window.enteteCompte = enteteCompte
const t = (k, v) => I18n.t(k, v)
const $ = (sel) => document.querySelector(sel)

// ⚠ LES DEUX SEULS ENDPOINTS DE LA PAGE. L'écran se peint avec le premier, en
// UN appel ; le second ne sert qu'aux gestes (corriger, confirmer, saisir).
const ECRAN = '/api/ecran/avis'
const AVIS = '/api/avis'

// L'appel : jeton RELU à chaque fois (un onglet ouvert plus d'une heure aurait
// un jeton expiré), compte délégué par `X-Compte`. Il LÈVE sur réponse non-ok,
// avec le statut porté par l'erreur : chaque appelant l'attrape.
async function appelAPI (url, methode = 'GET', corps = null) {
  let jeton = null
  try {
    const { data } = await supabase.auth.getSession()
    jeton = (data && data.session && data.session.access_token) || null
  } catch { /* pas de session : le serveur répondra 401 */ }
  const opts = {
    method: methode,
    headers: { 'Content-Type': 'application/json', ...(jeton ? { Authorization: `Bearer ${jeton}` } : {}), ...enteteCompte() }
  }
  if (corps) opts.body = JSON.stringify(corps)
  const res = await fetch(url, opts)
  const data = await res.json().catch(() => ({}))
  if (!res.ok) {
    const err = new Error(data.error || t('avis.erreur_serveur'))
    err.status = res.status
    throw err
  }
  return data
}

// ─── État de la page ────────────────────────────────────────────────────────
const PERIODES_CONNUES = ['15j', '30j', '6mois', 'toujours']
const etat = { periode: '30j', bien: '', biens: [], periodes: [], recharger: null, moi: null, compte: null, envoiEnCours: false, reglagesMontes: false }

// La période retenue : celle mémorisée si elle est connue, sinon 30 jours.
// ⚠ Mémorisée PAR NAVIGATEUR, pas en base : un confort d'affichage. Le stockage
// peut lever (navigation privée) : on retombe sur le défaut.
function periodeVoulue () {
  try {
    const memo = localStorage.getItem('avis_periode')
    if (memo && PERIODES_CONNUES.includes(memo)) return memo
  } catch { /* stockage indisponible */ }
  return '30j'
}

// ─── Filtres ────────────────────────────────────────────────────────────────
const vignette = (b) => b.photo_url
  ? `<img class="avp-pastille__photo" src="${esc(b.photo_url)}" alt="" loading="lazy" decoding="async">`
  : `<span class="avp-pastille__photo avp-pastille__photo--vide" aria-hidden="true">${esc(String(b.name || '?').trim().charAt(0).toUpperCase())}</span>`

function peindreFiltres () {
  const p = $('[data-bind="periodes"]')
  p.innerHTML = etat.periodes.map(cle => `<button type="button" class="avp-pastille" data-periode="${esc(cle)}" aria-pressed="${cle === etat.periode}">${esc(t('avis.periode_' + cle))}</button>`).join('')
  const b = $('[data-bind="biens"]')
  b.innerHTML = `<button type="button" class="avp-pastille" data-bien="" aria-pressed="${etat.bien === ''}">${esc(t('avis.tous'))}</button>`
    + etat.biens.map(x => `<button type="button" class="avp-pastille avp-pastille--photo" data-bien="${esc(x.provider_property_id)}" aria-pressed="${String(x.provider_property_id) === etat.bien}">${vignette(x)}<span>${esc(x.name)}</span></button>`).join('')
}

document.addEventListener('click', (ev) => {
  const pe = ev.target.closest && ev.target.closest('[data-periode]')
  if (pe) {
    etat.periode = pe.dataset.periode
    try { localStorage.setItem('avis_periode', etat.periode) } catch { /* sans mémoire */ }
    peindreFiltres()
    if (etat.recharger) etat.recharger()
    return
  }
  const bi = ev.target.closest && ev.target.closest('[data-bien]')
  if (bi) {
    etat.bien = bi.dataset.bien
    peindreFiltres()
    if (etat.recharger) etat.recharger()
  }
})

// ─── La ligne de publication automatique ────────────────────────────────────
// Un échec de lecture se tait : ce n'est qu'une information.
function peindreAuto (pa) {
  const el = $('[data-bind="auto"]')
  if (!pa) { el.hidden = true; return }
  const texte = pa.actifs ? t('avis.auto_actif', { n: pa.actifs, m: pa.total }) : t('avis.auto_inactif')
  const lien = $('[data-action="reglages"]').hidden ? '' : ` · <a href="#" data-action="reglages-lien">${esc(t('avis.reglages'))}</a>`
  el.innerHTML = esc(texte) + lien
  el.hidden = false
}

// Les filtres et le formulaire se remplissent à la réponse : les biens et les
// périodes viennent du serveur.
function surDonnees (d) {
  etat.biens = (d && d.biens) || []
  etat.periodes = ((d && d.periodes) || []).filter(p => PERIODES_CONNUES.includes(p))
  // Une liste vide ne doit pas faire boucler la correction ci-dessous.
  if (!etat.periodes.length) etat.periodes = ['30j']
  // Un filtre que le serveur ne propose plus (période retirée, logement sorti
  // du périmètre) est remis au défaut — ET L'ÉCRAN SE RELIT : sinon « Tous »
  // serait pressé au-dessus des cartes d'un seul logement.
  let corrige = false
  if (!etat.periodes.includes(etat.periode)) { etat.periode = etat.periodes.includes('30j') ? '30j' : etat.periodes[0]; corrige = true }
  if (etat.bien && !etat.biens.some(b => String(b.provider_property_id) === etat.bien)) { etat.bien = ''; corrige = true }
  peindreFiltres()
  peindreAuto(d && d.publication_auto)
  const sel = $('[data-bind="s-bien"]')
  const garde = sel.value
  sel.innerHTML = etat.biens.map(b => `<option value="${esc(b.provider_property_id)}">${esc(b.name)}</option>`).join('')
  if (garde) sel.value = garde
  if (corrige && etat.recharger) etat.recharger()
}

// ─── L'écran ────────────────────────────────────────────────────────────────
// L'affichage instantané : clé utilisateur + compte, vidée à la déconnexion
// (shared/cache-ecran.js), et pour la vue par défaut seulement (tous les
// logements, sans les anciens).
// ⚠ ON NE GARDE QUE CE QUI N'EST PAS NOMINATIF (revue du lot Avis V5,
// constat 1) : les chiffres, les logements, les périodes, l'état de la
// publication automatique. Les CARTES portent des noms de voyageurs, des dates
// de séjour et le texte des avis ; le cache ne connaît que l'utilisateur et le
// compte, jamais les droits, et n'est vidé qu'à la déconnexion. Un membre à
// qui l'on retire un logement ou le droit `reservations` les reverrait jusqu'à
// douze heures. Elles attendent le serveur — c'est la même règle que
// `derniers_avis` de l'accueil.
const GARDE_DU_CACHE = ['stats', 'biens', 'periodes', 'publication_auto']
const vueParDefaut = (params) => !/(^|&)(bien|anciens)=/.test(params)

async function lireEcran (params) {
  const d = await appelAPI(ECRAN + (params ? '?' + params : ''))
  if (vueParDefaut(params) && etat.moi && etat.compte) {
    const gardee = Object.fromEntries(GARDE_DU_CACHE.filter(k => d && k in d).map(k => [k, d[k]]))
    // ⚠ LA PÉRIODE DE LA LECTURE, PAS CELLE DE L'ÉCRAN : un filtre cliqué
    // pendant la lecture changerait `etat.periode`, et les chiffres des
    // 30 jours seraient rangés sous « 6 mois » (revue, constat 2).
    ecrireCache('avis', etat.moi, etat.compte, { ...gardee, vue_periode: new URLSearchParams(params).get('periode') || '' })
  }
  return d
}

const actions = {
  requalifier: (id, verdict) => appelAPI(AVIS, 'POST', { action: 'requalifier', id, verdict }),
  valider: (id, statut) => appelAPI(AVIS, 'POST', { action: 'valider', id, statut })
}

// ─── Saisie d'un avis reçu ──────────────────────────────────────────────────
const dateNue = (d) => {
  if (!d) return ''
  const j = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d))
  const x = j ? new Date(Number(j[1]), Number(j[2]) - 1, Number(j[3])) : new Date(d)
  return isNaN(x) ? '' : I18n.date(x, { day: 'numeric', month: 'short', year: 'numeric' })
}

async function chargerSejours () {
  const ref = $('[data-bind="s-bien"]').value
  const sel = $('[data-bind="s-sejour"]')
  sel.innerHTML = `<option value="">${esc(t('avis.sans_rattachement'))}</option>`
  if (!ref) return
  let d
  try {
    d = await appelAPI(AVIS + '?action=sejours&bien=' + encodeURIComponent(ref))
  } catch {
    // Le rattachement est facultatif : son échec n'empêche pas la saisie.
    return
  }
  for (const s of (d && d.sejours) || []) {
    const dates = [dateNue(s.arrival), dateNue(s.departure)].filter(Boolean).join(' → ')
    sel.insertAdjacentHTML('beforeend', `<option value="${esc(s.booking_uid)}">${esc(dates + (s.nom ? ' · ' + s.nom : ''))}</option>`)
  }
}

function ouvrir (dlg) {
  if (typeof dlg.showModal === 'function') { try { dlg.showModal(); return } catch { /* déjà ouverte */ } }
  dlg.setAttribute('open', '')
}
function fermer (dlg) {
  if (typeof dlg.close === 'function') { try { dlg.close(); return } catch { /* déjà fermée */ } }
  dlg.removeAttribute('open')
}

// Aujourd'hui, au jour LOCAL : `toISOString` donne le jour UTC, donc la veille
// entre minuit et deux heures à Paris.
const aujourdhui = () => {
  const d = new Date()
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
}

function ouvrirSaisie () {
  $('[data-bind="s-date"]').value = aujourdhui()
  $('[data-bind="s-retour"]').textContent = ''
  ouvrir($('[data-bind="saisie"]'))
  chargerSejours()
}

async function envoyerSaisie () {
  // Garde anti-double-clic : l'identifiant est un UUID tiré à chaque appel,
  // deux envois créeraient DEUX avis identiques.
  if (etat.envoiEnCours) return
  const retour = $('[data-bind="s-retour"]')
  const texte = $('[data-bind="s-texte"]').value.trim()
  if (!$('[data-bind="s-bien"]').value) { retour.textContent = t('avis.choisir_bien'); return }
  if (!texte) { retour.textContent = t('avis.texte_requis'); return }
  etat.envoiEnCours = true
  const bouton = $('[data-action="saisie-envoyer"]')
  bouton.disabled = true
  retour.textContent = t('avis.enregistrement')
  try {
    await appelAPI(AVIS, 'POST', {
      action: 'create',
      bien: $('[data-bind="s-bien"]').value,
      source: $('[data-bind="s-source"]').value,
      date: $('[data-bind="s-date"]').value || null,
      booking_uid: $('[data-bind="s-sejour"]').value || null,
      texte
    })
  } catch (e) {
    retour.textContent = (e && e.message) || t('avis.enregistrement_ko')
    return
  } finally {
    etat.envoiEnCours = false
    bouton.disabled = false
  }
  $('[data-bind="s-texte"]').value = ''
  retour.textContent = ''
  fermer($('[data-bind="saisie"]'))
  if (etat.recharger) await etat.recharger()
}

// ─── Réglages, dans un volet ────────────────────────────────────────────────
// Montés à la demande, une fois ; refermés, ils relisent l'écran (un bien
// vient peut-être d'être activé en publication automatique).
async function ouvrirReglages () {
  const dlg = $('[data-bind="reglages"]')
  ouvrir(dlg)
  if (etat.reglagesMontes) return
  etat.reglagesMontes = true
  const zone = $('[data-bind="reglages-zone"]')
  try {
    const { monter } = await import('/core/avis/ecran-reglages.js')
    await monter(zone, { avertir: (m) => logger.info('Avis', 'réglages : ' + m) })
  } catch (e) {
    // ⚠ UN ÉCHEC DE CHARGEMENT SE DIT, et la prochaine ouverture réessaie.
    logger.error('Avis', 'réglages', e)
    etat.reglagesMontes = false
    zone.innerHTML = `<p class="avp-erreur">${esc(t('avis.reglages_ko'))}</p>`
  }
}

document.addEventListener('click', (ev) => {
  const a = ev.target.closest && ev.target.closest('[data-action]')
  if (!a) return
  const quoi = a.dataset.action
  if (quoi === 'saisir') ouvrirSaisie()
  else if (quoi === 'saisie-fermer') fermer($('[data-bind="saisie"]'))
  else if (quoi === 'saisie-envoyer') envoyerSaisie()
  else if (quoi === 'reglages' || quoi === 'reglages-lien') { ev.preventDefault(); ouvrirReglages() }
  else if (quoi === 'reglages-fermer') fermer($('[data-bind="reglages"]'))
})
$('[data-bind="reglages"]').addEventListener('close', () => { if (etat.recharger) etat.recharger() })
$('[data-bind="s-bien"]').addEventListener('change', chargerSejours)
// ⚠ ENTRÉE DANS UN CHAMP SOUMET LE FORMULAIRE, et `method="dialog"` fermait
// alors la fenêtre sans rien enregistrer ni rien dire (revue, constat 7).
// L'enregistrement ne part que du bouton.
$('[data-bind="saisie-form"]').addEventListener('submit', (ev) => ev.preventDefault())

// ─── Démarrage ──────────────────────────────────────────────────────────────
async function init () {
  const session = await requireAuth()
  if (!session) return
  await I18n.init()
  document.addEventListener('i18n:changed', () => location.reload())
  // L'utilisateur vient de la SESSION déjà lue : pas un aller-retour de plus
  // avant l'appel d'écran.
  const user = session.user || null
  $('[data-bind="initials"]').textContent = ((user && user.email) || '').slice(0, 2).toUpperCase()
  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis')
  })
  HSNav.render({ peutLire })
  I18n.apply(document)

  // Les deux gestes n'apparaissent qu'avec le droit d'écriture sur `avis`.
  const peut = peutEcrire('avis')
  $('[data-action="saisir"]').hidden = !peut
  $('[data-action="reglages"]').hidden = !peut

  etat.moi = user && user.id
  etat.compte = compteCourant()
  etat.periode = periodeVoulue()
  const cache = (etat.moi && etat.compte) ? lireCache('avis', etat.moi, etat.compte) : null
  const initiales = cache && cache.donnees && cache.donnees.vue_periode === etat.periode ? cache.donnees : null

  let hsBus = null
  try { hsBus = (await import('/shared/hs-bus.js')).hsBus } catch { hsBus = null }

  const r = await monterCartes($('[data-bind="cartes"]'), {
    charger: lireEcran,
    actions,
    bus: hsBus,
    peutEcrire: peut,
    filtres: () => ({ periode: etat.periode, bien: etat.bien }),
    surDonnees,
    zoneStats: $('[data-bind="stats"]'),
    initiales,
    surPret: (recharger) => { etat.recharger = recharger },
    // ⚠ UN REFUS DU SERVEUR EFFACE CE QUE LE CACHE AVAIT PEINT : les logements
    // et les chiffres d'un périmètre que l'on n'a plus (re-review, A.1).
    surEchec: (err) => {
      if (!err || (err.status || err.statut) !== 403) return
      if (etat.moi && etat.compte) oublierCache('avis', etat.moi, etat.compte)
      etat.biens = []
      etat.bien = ''
      peindreFiltres()
    },
    t,
    langue: I18n.lang
  })
  etat.recharger = r.recharger

  const u = new URL(location.href)
  // ⚠ `?evaluer=<booking_uid>` OUVRE LA FENÊTRE D'ÉVALUATION (spec §10 : le lien
  // de la notification « évaluez le voyageur » mène ici). Par le bus : droit
  // absent ou séjour inconnu = rien ne s'ouvre. Le paramètre est retiré, pour
  // qu'un rechargement ne rouvre pas la fenêtre.
  const aEvaluer = u.searchParams.get('evaluer')
  if (aEvaluer && aEvaluer.length <= 200 && hsBus) {
    try { history.replaceState(null, '', location.pathname) } catch { /* sans historique */ }
    const o = await hsBus.ouvrir('avis.evaluer', { booking_uid: aEvaluer })
    if (o && o.ok === true) await r.recharger()
  }
  // L'ancien chemin /settings?onglet=avis renvoie ici avec ?reglages=1.
  if (u.searchParams.get('reglages') === '1' && peut) {
    u.searchParams.delete('reglages')
    try { history.replaceState(null, '', u.pathname + u.search) } catch { /* sans historique */ }
    ouvrirReglages()
  }
}

// ⚠ UNE PAGE VIDE ET MUETTE EST LE PIRE RETOUR : l'hôte ne sait pas s'il n'a
// pas d'avis ou si quelque chose est cassé.
init().catch(e => {
  logger.error('Avis', e && e.message, e)
  const z = $('[data-bind="cartes"]')
  if (z) z.innerHTML = `<p class="avp-erreur">${esc(t('avis.page_ko'))}</p>`
})
</script>
</body>
</html>
