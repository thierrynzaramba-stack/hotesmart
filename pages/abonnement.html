<!doctype html>
<html lang="fr" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HôteSmart</title>
<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/ui.css">
<!-- PAGE « MON ABONNEMENT » — intégrée au socle V5 le 15 novembre 2026
     (docs/specs/spec-integration-v5-lot-1.md). Elle était AUTONOME (styles et
     en-tête à elle) : elle prend la barre V5 et le menu ≡, et garde tout le
     reste — mêmes lectures, mêmes appels à /api/stripe, mêmes gestes.
     ⚠ ARGENT : un défaut ici se voit sur un relevé, pas à l'écran du
     développeur. Recette avec Thierry juste après le merge (CLAUDE.md, règle 5).
     RÈGLES V5 : aucun hexa, aucun texte en dur, aucune icône dessinée ici. -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- rempli par nav.js --></div>
  </div>
</header>

<main class="page out">
  <div class="out-tete">
    <div class="out-tete__titre">
      <h1 class="h1" data-i18n="abo.titre"></h1>
      <p class="out-sous" data-i18n="abo.sous_titre"></p>
    </div>
    <!-- « Mon compte » : l'ancienne en-tête de la page y menait, et aucun
         écran V5 n'y mène (spec §3.5 et §8, point 2). Gardé ici. -->
    <div class="out-tete__actions">
      <a class="btn btn--secondary" href="/pages/compte.html"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-users"/></svg><span data-i18n="abo.mon_compte"></span></a>
    </div>
  </div>

  <div class="out-pile" id="banners"></div>
  <div id="content"><p class="out-vide" data-i18n="common.loading"></p></div>
</main>

<!-- Fenêtre « quantité » : un <dialog> natif, plein écran au téléphone. -->
<dialog class="out-feuille" id="qty-modal" aria-labelledby="qty-title">
  <div class="out-feuille__corps">
    <h2 class="h2" id="qty-title" data-i18n="abo.qty_titre_defaut"></h2>
    <p class="out-sous" id="qty-desc" data-i18n="abo.qty_desc_defaut"></p>
    <div class="out-champ">
      <label for="qty-input" data-i18n="abo.nombre"></label>
      <input class="out-saisie num" type="number" id="qty-input" min="1" max="50" value="1">
    </div>
    <div class="out-feuille__pied">
      <button type="button" class="btn btn--secondary" id="qty-cancel" data-i18n="outil.annuler"></button>
      <button type="button" class="btn btn--primary" id="qty-confirm" data-i18n="abo.confirmer"></button>
    </div>
  </div>
</dialog>

<nav class="bottombar" data-i18n-attr="aria-label:nav.menu"><!-- rempli par nav.js --></nav>

<script src="/shared/i18n/i18n.js"></script>
<script src="/shared/nav.js"></script>
<script type="module">
import { exigerCompteProprePage, compteCourant, peutLire, estTitulaire, comptes, basculerVers } from '/shared/compte-courant.js'
import { supabase, getUser, signOut } from '/shared/supabase.js'
import { esc, monterCoquille } from '/shared/page-outil.js'

const t = (k, v) => I18n.t(k, v)
// Un prix au centime, dans la langue de la page (`I18n.money` arrondit à
// l'euro : 19,99 € deviendrait 20 €).
const prix = (euros) => I18n.num(euros, { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 })

// ⚠ LES MONTANTS SONT CEUX DE L'ANCIENNE PAGE, AU CENTIME. Ils ne décident de
// rien : Stripe facture ce que son produit porte (api/stripe.js). Ils ne sont
// qu'affichés, comme avant.
const MODULES = [
  {
    id: 'guestflow',
    required: true,
    price: 19.99,
    detail: () => t('abo.detail_guestflow', { prix: prix(9.90) }),
    unite: 'abo.unite_biens'
  },
  {
    id: 'menage',
    required: false,
    price: 6.90,
    detail: () => t('abo.detail_menage'),
    unite: 'abo.unite_biens'
  },
  {
    id: 'serrure',
    required: false,
    price: 9.99,
    detail: () => t('abo.detail_serrure', { prix: prix(2.99) }),
    unite: 'abo.unite_serrures'
  },
  {
    id: 'caution',
    required: false,
    price: 9.99,
    detail: () => t('abo.detail_caution'),
    unite: 'abo.unite_biens',
    comingSoon: true
  }
]

// Le libellé de chaque état d'un abonnement Stripe ; un état inconnu
// s'affiche tel quel, comme avant.
const STATUTS = ['trialing', 'active', 'past_due', 'canceled', 'incomplete', 'incomplete_expired', 'unpaid']
const libelleStatut = (s) => (STATUTS.includes(s) ? t('abo.statut_' + s) : s)
const TON = { trialing: 'ok', active: 'ok', past_due: 'attente', unpaid: 'attente' }

const content = document.getElementById('content')
const banners = document.getElementById('banners')
const banniere = (texte, type = 'ok') => `<p class="out-retour out-retour--${type}" role="${type === 'erreur' ? 'alert' : 'status'}">${esc(texte)}</p>`
const jour = (d) => I18n.date(new Date(d), { day: '2-digit', month: '2-digit', year: 'numeric' })
let user = null

async function loadAndRender () {
  // BETA : compte flague accounts.is_beta => aucun ecran de paiement. On affiche un etat
  // neutre et on n'affiche jamais les offres ni le checkout. (Table accounts possiblement absente.)
  try {
    const { data: acct } = await supabase
      .from('accounts')
      .select('is_beta')
      .eq('user_id', user.id)
      .maybeSingle()
    if (acct && acct.is_beta === true) {
      content.innerHTML = banniere(t('abo.beta'))
      return
    }
  } catch (e) { /* colonne absente ou lecture KO : parcours normal */ }

  // Charger les subs de l'user
  const { data: subs, error } = await supabase
    .from('subscriptions')
    .select('module, status, trial_ends_at, current_period_end, cancel_at_period_end, quantity')
    .eq('user_id', user.id)

  if (error) {
    content.innerHTML = banniere(t('abo.erreur_chargement', { message: error.message }), 'erreur')
    return
  }

  const subByModule = {}
  ;(subs || []).forEach(s => { subByModule[s.module] = s })

  render(subByModule)
}

function render (subByModule) {
  const cards = MODULES.map(m => renderCard(m, subByModule[m.id])).join('')
  content.innerHTML = '<div class="out-grille out-grille--2">' + cards + '</div>'

  // Bind boutons
  document.querySelectorAll('[data-action="start"]').forEach(btn => {
    btn.onclick = () => openQtyModal(btn.dataset.module)
  })
  document.querySelectorAll('[data-action="cancel"]').forEach(btn => {
    btn.onclick = () => cancelSub(btn.dataset.module)
  })
  document.querySelectorAll('[data-action="portal"]').forEach(btn => {
    btn.onclick = () => openPortal()
  })
}

function renderCard (mod, sub) {
  const status = sub ? sub.status : 'none'
  const statusLabel = sub ? libelleStatut(status) : t('abo.statut_none')
  const unite = t(mod.unite)
  const requiredTag = mod.required ? `<span class="out-puce out-puce--fort">${esc(t('abo.requis'))}</span>` : ''
  const comingSoonTag = mod.comingSoon ? `<span class="out-puce">${esc(t('abo.bientot'))}</span>` : ''

  let meta = ''
  if (sub) {
    if (status === 'trialing' && sub.trial_ends_at) {
      meta = `<p class="out-aide">${esc(t('abo.essai_jusqu', { date: jour(sub.trial_ends_at) }))}</p>`
    } else if (status === 'active' && sub.current_period_end) {
      const label = sub.cancel_at_period_end
        ? t('abo.se_termine', { date: jour(sub.current_period_end) })
        : t('abo.renouvellement', { date: jour(sub.current_period_end) })
      meta = `<p class="out-aide">${esc(label)}</p>`
    } else if (status === 'past_due') {
      meta = `<p class="out-aide">${esc(t('abo.past_due_aide'))}</p>`
    }
    if (sub.quantity) {
      meta += `<p class="out-aide">${esc(t('abo.quantite', { n: sub.quantity, unite }))}</p>`
    }
  }

  const bouton = (classe, action, cle, extra = '') =>
    `<button type="button" class="btn ${classe}"${action ? ` data-action="${action}"` : ''}${action === 'start' || action === 'cancel' ? ` data-module="${esc(mod.id)}"` : ''}${extra}>${esc(t(cle))}</button>`
  let actions = ''
  if (mod.comingSoon) {
    actions = bouton('btn--secondary', null, 'abo.bientot_dispo', ' disabled')
  } else if (!sub || status === 'canceled' || status === 'incomplete_expired') {
    actions = bouton('btn--primary', 'start', 'abo.demarrer')
  } else if (status === 'trialing' || status === 'active') {
    if (sub.cancel_at_period_end) {
      actions = bouton('btn--secondary', 'portal', 'abo.gerer')
    } else {
      actions = bouton('btn--secondary', 'portal', 'abo.gerer') + bouton('btn--secondary out-danger', 'cancel', 'abo.annuler')
    }
  } else if (status === 'past_due' || status === 'unpaid') {
    actions = bouton('btn--primary', 'portal', 'abo.maj_cb')
  } else {
    actions = bouton('btn--secondary', 'portal', 'abo.gerer')
  }

  return [
    `<article class="out-carte${mod.required ? ' out-carte--fort' : ''}">`,
    '<div class="out-carte__tete">',
    `<h2 class="out-carte__titre">${esc(t('abo.module_' + mod.id))}</h2>`,
    requiredTag || comingSoonTag,
    '</div>',
    `<span class="out-etat${TON[status] ? ' out-etat--' + TON[status] : ''}" data-statut="${esc(status)}">${esc(statusLabel)}</span>`,
    `<p class="out-prix"><b class="num">${esc(prix(mod.price))}</b> <small>${esc(mod.detail())}</small></p>`,
    `<p class="out-sous">${esc(t('abo.desc_' + mod.id))}</p>`,
    meta,
    `<div class="out-actions">${actions}</div>`,
    '</article>'
  ].join('')
}

// ── Fenêtre quantité ───────────────────────────────────────────────────────
let currentModule = null
const qtyModal = document.getElementById('qty-modal')
const qtyTitle = document.getElementById('qty-title')
const qtyDesc = document.getElementById('qty-desc')
const qtyInput = document.getElementById('qty-input')

function openQtyModal (moduleId) {
  const mod = MODULES.find(m => m.id === moduleId)
  if (!mod) return
  currentModule = mod
  const unite = t(mod.unite)
  qtyTitle.textContent = t('abo.combien', { unite })
  qtyDesc.textContent = mod.id === 'guestflow'
    ? t('abo.qty_guestflow', { prix1: prix(19.99), prix2: prix(9.90) })
    : mod.id === 'serrure'
      ? t('abo.qty_serrure', { prix1: prix(9.99), prix2: prix(2.99) })
      : t('abo.qty_autre', { unite })
  qtyInput.value = '1'
  qtyInput.min = '1'
  qtyInput.max = '50'
  qtyModal.showModal()
}
function closeQtyModal () { qtyModal.close(); currentModule = null }
document.getElementById('qty-cancel').onclick = closeQtyModal
qtyModal.onclick = (e) => { if (e.target === qtyModal) closeQtyModal() }

document.getElementById('qty-confirm').onclick = async () => {
  if (!currentModule) return
  const qty = Math.max(1, Math.min(50, Number(qtyInput.value) || 1))
  const btn = document.getElementById('qty-confirm')
  btn.disabled = true
  btn.textContent = t('abo.redirection')
  try {
    const { data: { session } } = await supabase.auth.getSession()
    const r = await fetch('/api/stripe?action=create_checkout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({ action: 'create_checkout', module: currentModule.id, quantity: qty })
    })
    const data = await r.json()
    if (!r.ok || !data.url) {
      banners.innerHTML = banniere(data.error || t('abo.erreur_paiement'), 'erreur')
      btn.disabled = false
      btn.textContent = t('abo.confirmer')
      closeQtyModal()
      return
    }
    window.location.href = data.url
  } catch (err) {
    console.error('[abonnement] checkout error:', err)
    banners.innerHTML = banniere(t('outil.erreur_reseau'), 'erreur')
    btn.disabled = false
    btn.textContent = t('abo.confirmer')
    closeQtyModal()
  }
}

async function cancelSub (moduleId) {
  if (!confirm(t('abo.annuler_confirmer'))) return
  try {
    const { data: { session } } = await supabase.auth.getSession()
    const r = await fetch('/api/stripe?action=cancel_subscription', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({ action: 'cancel_subscription', module: moduleId })
    })
    const data = await r.json()
    if (!r.ok) {
      banners.innerHTML = banniere(data.error || t('outil.erreur'), 'erreur')
      return
    }
    banners.innerHTML = banniere(t('abo.annulation_ok'))
    await loadAndRender()
  } catch (err) {
    banners.innerHTML = banniere(t('outil.erreur_reseau'), 'erreur')
  }
}

async function openPortal () {
  try {
    const { data: { session } } = await supabase.auth.getSession()
    const r = await fetch('/api/stripe?action=portal', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({ action: 'portal' })
    })
    const data = await r.json()
    if (!r.ok || !data.url) {
      banners.innerHTML = banniere(data.error || t('abo.erreur_portail'), 'erreur')
      return
    }
    window.location.href = data.url
  } catch (err) {
    banners.innerHTML = banniere(t('outil.erreur_reseau'), 'erreur')
  }
}

async function init () {
  await I18n.init()
  // ⚠ PAGE NON DELEGABLE : elle montre les donnees de la personne connectee,
  // pas celles du compte sur lequel on travaille. Sans ce garde-fou, elle
  // s'ouvrait par URL directe en mode basculé et affichait un contresens.
  await exigerCompteProprePage({ nomPage: t('abo.titre') })
  document.addEventListener('i18n:changed', () => location.reload())

  // ── Bannières success/canceled (URL params depuis redirect Stripe)
  const params = new URLSearchParams(window.location.search)
  if (params.get('success') === 'true') {
    const mod = params.get('module') || ''
    banners.innerHTML = banniere(mod ? t('abo.succes_module', { module: mod }) : t('abo.succes'))
    history.replaceState({}, '', '/pages/abonnement.html')
  }
  if (params.get('canceled') === 'true') {
    banners.innerHTML = banniere(t('abo.annule'), 'attente')
    history.replaceState({}, '', '/pages/abonnement.html')
  }

  user = await getUser()
  if (!user) { window.location.replace('/pages/login.html'); return }

  monterCoquille({
    HSNav, I18n, session: { user },
    compte: { comptes, compteCourant, basculerVers, estTitulaire, peutLire },
    // ── Déconnexion : comme l'ancien lien « Se déconnecter » de la page, la
    // session d'onglet est vidée AVANT la déconnexion.
    deconnexion: async () => { try { sessionStorage.clear() } catch { /* stockage indisponible */ } await signOut() }
  })

  await loadAndRender()
}

init().catch(e => console.error('[abonnement]', e))
</script>
</body>
</html>
