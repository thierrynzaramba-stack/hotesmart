     barre = jours où elle est LA GARDE CALCULÉE (api/garde.js, même brique
     que le moteur), pastille = ménage. « Personne » = trou de garde d'un
     bien GÉRÉ seulement (décision du 3 septembre : un bien sans prestataire
     n'affiche aucune ligne, jamais de rouge). Pas de bulle « À traiter »
     (étape 2), aucune action d'écriture (étape 3).
     Spec : docs/specs/lot-menages-v5/spec-refonte-ui-v5-lot-menages.md
     (+ §13, les décisions) ; fond : docs/specs/inventaire-menages.md.
     RÈGLES : aucun hexa, aucun texte en dur, icônes du sprite, aucun appel
     provider ; X-Compte sur chaque appel ; la vérité « fait » vient du
     serveur (menage_done), jamais du localStorage de l'ancien écran. -->

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (s) => document.querySelector(s)
const icone = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="/shared/icons.svg#${id}"/></svg>`

// « il y a 3 heures », dans la langue de l'écran, SANS clé par unité : c'est
// exactement ce que `Intl.RelativeTimeFormat` sait faire, et une table de
// clés maison divergerait des pluriels de chaque langue.
function ilYa (iso) {
  const ms = Date.now() - Date.parse(iso)
  if (!Number.isFinite(ms)) return ''
  const rtf = new Intl.RelativeTimeFormat(I18n.lang || 'fr', { numeric: 'auto' })
  const min = Math.round(ms / 60000)
  if (min < 60) return rtf.format(-Math.max(min, 1), 'minute')
  const h = Math.round(min / 60)
  if (h < 24) return rtf.format(-h, 'hour')
  return rtf.format(-Math.round(h / 24), 'day')
}
const AUJOURDHUI = toISO(new Date())
// Le MEME selecteur que le calendrier (recette du 13 octobre) : des mois.
// L'endpoint refuse au-dela de 92 jours : au-dela, la page lit par TRANCHES.
const MOIS = [1, 3, 6, 12]
const JOURS_PAR_MOIS = { 1: 30, 3: 91, 6: 182, 12: 364 }
const TRANCHE_MAX = 92
const langue = () => (window.I18n && I18n.lang) || document.documentElement.lang || 'fr'

const etat = {
  biens: [],            // réponse /api/garde : [{id(ref provider), name, photo}]
  garde: [],            // [{propertyId, gere, jours: [{date, responsable, remplacante, trou}]}]
  menages: [],          // [{propertyId, bookingId, date, status, fait, porteur, proposeesA, expireLe, raison, retour, differe}]
  menagesBulle: [],     // ceux de la bulle (J−30 → J+30), pour l'état d'une fiche
  bulleLue: false,      // faux = pas encore lue, ou lecture en panne
  avecNoms: false, avecAvis: false, tronque: false,
  jours: [],            // les iso de la fenêtre
  mois: 1,              // 1 / 3 / 6 / 12 (persisté, comme le calendrier)
  decalage: 0,          // en jours, NON persisté (même règle que le calendrier)
  masques: [],          // refs des biens masqués (persisté PAR COMPTE)
  ordre: [],            // ordre des biens (poignée de déplacement, persisté)
  aTraiter: [],         // lignes de la bulle (fenêtre PROPRE : J−30 → J+30)
  aTraiterTronque: false,
  prestataires: [],     // annuaire pour « changer la prestataire » (vide sans le droit)
  toutVoir: false,      // « Tout voir » déplié
  equipe: null,         // [{id, prenom, nom, actif, aRegler, biens, retours}] — null = pas encore lu
  equipeAvecAvis: false,
  equipePersonnes: true, // faux = pas le droit de voir QUI compose l'équipe
  fiche: null,          // le ménage ouvert dans la fiche
  ficheVoisins: null,   // les autres ménages du même jour, s'il y en a
  notesLues: true       // faux = les consignes n'ont pas pu être lues
}
// ⚠ Une clé PAR COMPTE : la page est délégable, et une ref provider masquée
// sur un compte ne doit pas faire disparaître le bien homonyme d'un autre
// (constat de la revue de 4235a21).
const prefsCle = () => `hs_menages_v5_prefs:${compteCourant() || 'moi'}`
function lirePrefs () {
  try {
    const p = JSON.parse(localStorage.getItem(prefsCle()) || '{}')
    if (Array.isArray(p.masques)) etat.masques = p.masques.map(String)
    if (Array.isArray(p.ordre)) etat.ordre = p.ordre.map(String)
    if (MOIS.includes(p.mois)) etat.mois = p.mois
  } catch {}
}
function ecrirePrefs () {
  try { localStorage.setItem(prefsCle(), JSON.stringify({ masques: etat.masques, ordre: etat.ordre, mois: etat.mois })) } catch {}
}

// ─── Dates (Intl, jamais de formatage à la main) ────────────────────────────
const dateCourte = iso => new Intl.DateTimeFormat(langue(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })
  .format(new Date(iso + 'T12:00:00Z'))
const dateLongue = iso => new Intl.DateTimeFormat(langue(), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
  .format(new Date(iso + 'T12:00:00Z'))
const estLarge = () => window.matchMedia('(min-width: 900px)').matches
// Les traces portent une HEURE (« modifié par elle le 1er oct. à 21:02 ») :
// une date seule ne distingue pas deux gestes du même jour.
const dateHeure = iso => new Intl.DateTimeFormat(langue(),
  { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(iso))
// La règle des week-ends vient du MODULE, comme la bande : une seule
// implémentation pour les deux plannings (revue de 742fa7f).
const classesWE = iso => classesWEDuJour(new Date(iso + 'T12:00:00').getDay())
const photoBien = b => b.photo ? `<img src="${esc(b.photo)}" alt="" loading="lazy">` : icone('i-home')

function fenetre () {
  const base = new Date(AUJOURDHUI + 'T12:00:00Z')
  base.setUTCDate(base.getUTCDate() + etat.decalage)
  const jours = []
  for (let i = 0; i < JOURS_PAR_MOIS[etat.mois]; i++) {
    const d = new Date(base); d.setUTCDate(d.getUTCDate() + i)
    jours.push(d.toISOString().slice(0, 10))
  }
  return jours
}


// ─── Chargement ─────────────────────────────────────────────────────────────
async function appel (chemin) {
  const { data: { session } } = await supabase.auth.getSession()
  const r = await fetch(chemin, {
    headers: { Authorization: 'Bearer ' + session.access_token, ...enteteCompte() }
  })
  const corps = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(corps.message || corps.error || `HTTP ${r.status}`); e.status = r.status; throw e }
  return corps
}
// ⚠ LA BULLE A SA PROPRE FENÊTRE (spec §3.1) : aujourd'hui → J+30, et
// J−30 → hier pour « non terminé » et « mauvais retour ». Elle ne suit donc
// PAS la période choisie — un hôte en vue 12 mois doit voir les mêmes
// alertes qu'en vue 1 mois. 61 jours : une seule requête, sous le plafond.
async function poster (chemin, corps) {
  const { data: { session } } = await supabase.auth.getSession()
  const r = await fetch(chemin, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json', ...enteteCompte() },
    body: JSON.stringify(corps)
  })
  const c = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(c.message || c.error || `HTTP ${r.status}`); e.status = r.status; throw e }
  return c
}

// Un mot à l'écran après un geste, avec son « Annuler » quand le geste se
// défait vraiment (⚠ jamais un « Annuler » qui ne rejoue pas l'inverse réel).
function toast (texte, { annuler = null } = {}) {
  const zone = $('[data-bind="toasts"]')
  const el = document.createElement('div')
  el.className = 'cal-toast'
  el.innerHTML = `<span>${esc(texte)}</span>` +
    (annuler ? `<button type="button" class="link" data-annuler>${esc(t('menages.annuler'))}</button>` : '')
  zone.appendChild(el)
  if (annuler) el.querySelector('[data-annuler]').addEventListener('click', () => { el.remove(); annuler() })
  setTimeout(() => el.remove(), 6000)
}

let jetonBulle = 0
async function chargerATraiter () {
  const jeton = ++jetonBulle
  const d = new Date(AUJOURDHUI + 'T12:00:00Z')
  d.setUTCDate(d.getUTCDate() - 30)
  const du = d.toISOString().slice(0, 10)
  d.setUTCDate(d.getUTCDate() + 60)
  const au = d.toISOString().slice(0, 10)
  try {
    const r = await appel(`/api/garde?du=${du}&au=${au}`)
    if (jeton !== jetonBulle) return
    etat.aTraiter = lignesATraiter({
      biens: r.biens || [], garde: r.garde || [], menages: r.menages || [],
      avecAvis: !!r.avec_avis, aujourdhui: AUJOURDHUI,
      // ⚠ « Pas vu » NE S'INVENTE PAS. `vues_lues: false` (panne de lecture)
      // laisse le module muet sur ce type : une carte vide voudrait dire
      // « aucune ne l'a jamais ouverte », donc une alerte sur toute l'équipe.
      vues: r.vues || null, vuesLues: !!r.vues_lues
    })
    // ⚠ LA BULLE A SA PROPRE TRONCATURE : sa fenêtre n'est pas celle du
    // planning, donc le bandeau de `charger()` ne la couvre pas. Taire
    // celle-ci ferait d'un compte incomplet un compte qui paraît complet.
    etat.aTraiterTronque = !!r.tronque
    etat.prestataires = r.prestataires || []
    // ⚠ L'EN-TÊTE DE LA FICHE LIT CETTE FENÊTRE-LÀ, pas celle du planning
    // (constat de la revue de 6d007f3). Le planning suit le sélecteur de
    // l'hôte et peut n'être pas encore chargé, ou avoir échoué : son tableau
    // vide se lisait alors « aucun ménage », donc « À jour » en vert — un
    // rassurant et faux. La bulle, elle, est lue au démarrage et couvre
    // J−30 → J+30, indépendamment de ce que l'hôte regarde.
    etat.menagesBulle = r.menages || []
    etat.vuesBulle = r.vues || null
    etat.bulleLue = true
  } catch (e) {
    if (jeton !== jetonBulle) return
    // ⚠ UNE BULLE QUI N'A PAS PU LIRE NE DIT PAS « RIEN À TRAITER » : elle se
    // tait et le dit. Annoncer le calme sur une panne est le pire des deux.
    logger.error('Menages', 'à traiter', e)
    etat.aTraiter = null
    // ⚠ UNE PANNE NE DIT PAS « RIEN À VOIR » : sans cette remise à zéro,
    // l'en-tête de la fiche aurait conclu « À jour » sur la lecture d'avant.
    etat.bulleLue = false
  }
  renderBulle()
  majBadge()
  // ⚠ LE NUMÉRO N'EST CHARGÉ QUE S'IL SERT. L'équipe se lit à l'ouverture du
  // volet ; une alerte « Pas vu » a besoin du numéro tout de suite, et sans
  // elle cette lecture — un comptage d'avis par personne — ne se justifie pas
  // au démarrage de la page.
  if (Array.isArray(etat.aTraiter) && etat.aTraiter.some(l => l.type === 'pas_vu') &&
      !equipeChargee && !equipeEnCours) {
    chargerEquipe().then(renderBulle).catch(() => {})
  }
}

let jetonLecture = 0
async function charger () {
  const jeton = ++jetonLecture
  const chargeEl = $('[data-bind="etat-charge"]')
  chargeEl.hidden = false
  chargeEl.textContent = t('common.loading')
  const jours = fenetre()
  try {
    // L'endpoint refuse une fenetre > 92 jours (troncature silencieuse
    // interdite) : 6 et 12 mois se lisent par TRANCHES consecutives, fusionnees
    // ici — les biens viennent de la premiere, le reste se concatene.
    const tranches = []
    for (let i = 0; i < jours.length; i += TRANCHE_MAX) {
      const bloc = jours.slice(i, i + TRANCHE_MAX)
      tranches.push([bloc[0], bloc[bloc.length - 1]])
    }
    const reponses = await Promise.all(tranches.map(([du, au]) => appel(`/api/garde?du=${du}&au=${au}`)))
    if (jeton !== jetonLecture) return   // réponse en retard : on ne repeint pas
    const d0 = reponses[0]
    const gardeParBien = new Map()
    for (const r of reponses) {
      for (const g of (r.garde || [])) {
        const cle = String(g.propertyId)
        if (!gardeParBien.has(cle)) gardeParBien.set(cle, { propertyId: cle, gere: g.gere, jours: [] })
        gardeParBien.get(cle).jours.push(...(g.jours || []))
      }
    }
    etat.jours = jours
    etat.biens = d0.biens || []
    etat.garde = [...gardeParBien.values()]
    etat.menages = reponses.flatMap(r => r.menages || [])
    etat.notesLues = reponses.every(r => r.notes_lues !== false)
    etat.avecNoms = !!d0.avec_noms
    etat.avecAvis = !!d0.avec_avis
    etat.tronque = reponses.some(r => !!r.tronque)
    chargeEl.hidden = true
    renderTout()
  } catch (e) {
    if (jeton !== jetonLecture) return
    logger.error('Menages', 'chargement', e)
    chargeEl.hidden = true
    const vide = $('[data-bind="etat-vide"]')
    vide.hidden = false
    vide.innerHTML = `<p class="muted">${esc(e.status === 403 ? t('menages.no_access') : t('menages.load_error'))}</p>`
    $('[data-bind="planning"]').hidden = true
    // L'en-tete collant suit le corps : des dates perimees au-dessus d'une
    // erreur diraient une fenetre qu'on n'affiche pas (revue de bad5d25).
    $('[data-bind="tete"]').hidden = true
  }
}

// ─── L'état d'un ménage → sa pastille. TROIS états, lisibles sans légende
// (décision de Thierry, 13 octobre) : à faire (pris OU à venir), fait,
// personne pour le faire (proposition sans preneur, orphelin, non assigné).
function etatPastille (m) {
  if (m.fait) return 'fait'
  if (m.porteur) return 'afaire'
  // ⚠ UN REFUS N'EST PAS UN REPORT. Le serveur rend `differe: true` pour un
  // ménage `orphaned` (offres effacées, verrou `manual`, jamais repris par
  // le moteur) : le peindre « à faire » cachait le refus jusqu'à J−7. La
  // bulle et le planning disent la même chose (revue de c197a10).
  if (m.differe && m.status !== 'orphaned') return 'afaire'
  return 'alerte'
}
const CLASSE_MK = { fait: 'men-mk--fait', afaire: '', alerte: 'men-mk--alerte' }
const ICONE_MK = { fait: 'i-check', afaire: 'i-cleaning', alerte: 'i-alert' }
// Gravité d'affichage quand plusieurs ménages partagent une case : l'alarme
// passe devant le travail, le travail devant le terminé.
const GRAVITE = { alerte: 2, afaire: 1, fait: 0 }

function nomOu (p, defaut) {
  if (!p) return t(defaut)
  return p.prenom || t('menages.quelquun')
}
// Infobulle : état · prénom · date (décision du 13 octobre).
// ⚠ L'ÉTAT DIT DOIT S'ACCORDER AU PRÉNOM DIT. Les trois pastilles fusionnent
// « proposé, en attente » et « personne » dans le même rouge ; l'infobulle,
// elle, les distingue — sinon elle annonçait « Personne pour le faire ·
// Marie », deux affirmations contradictoires (revue de 742fa7f).
function infobulle (m) {
  const qui = m.porteur || (m.proposeesA || [])[0] || null
  const e = etatPastille(m)
  const cle = (e === 'alerte' && (m.proposeesA || []).length) ? 'menages.tt_propose' : 'menages.tt_' + e
  // Un retour de propreté ne vit pas QUE dans la couleur du badge
  // (theme.css : « jamais la couleur seule »).
  const retour = m.retour
    ? ' · ' + t(m.retour.verdict === 'remarque' ? 'menages.retour_mauvais' : 'menages.retour_bon') : ''
  return `${t(cle)} · ${nomOu(qui, 'menages.sans_presta')} · ${dateLongue(m.date)}${retour}`
}

// ─── Construction des lignes d'un bien ──────────────────────────────────────
// Une ligne par prestataire : (a) responsable d'au moins un jour de la
// fenêtre ; (b) porteuse ou proposée d'un ménage de la fenêtre (ligne
// TEMPORAIRE, sans barre — décision §13 « remplaçante »). Sans
// `prestataires:read` : UNE ligne neutre par bien.
const CLE_COUVERTURE = '__couverture'
const CLE_SANS = '__sans'
function lignesDuBien (bien, g, menagesDuBien) {
  const lanes = new Map()
  const lane = (cle) => {
    if (!lanes.has(cle)) {
      lanes.set(cle, { cle, prenom: null, actif: null, aRegler: false, jours: new Set(), menages: new Map() })
    }
    return lanes.get(cle)
  }
  const cleDe = p => (p && etat.avecNoms && p.id) ? String(p.id) : CLE_COUVERTURE
  const responsableDu = {}
  for (const j of (g ? g.jours : [])) {
    responsableDu[j.date] = j.responsable || null
    if (!j.responsable) continue
    const l = lane(cleDe(j.responsable))
    l.jours.add(j.date)
    if (j.responsable.prenom) l.prenom = j.responsable.prenom
    if (j.responsable.actif === false) l.actif = false
    if (j.responsable.a_regler) l.aRegler = true
  }
  // Une ABSENCE est une case VIDE (décision du 13 octobre : moins de bruit) —
  // la barre s'arrête d'elle-même, puisque la garde ne la désigne pas.
  for (const m of menagesDuBien) {
    const e = etatPastille(m)
    let cle
    if (m.porteur) cle = cleDe(m.porteur)
    else if ((m.proposeesA || []).length) cle = cleDe(m.proposeesA[0])
    else if (m.differe) cle = cleDe(responsableDu[m.date])
    else cle = CLE_SANS
    const l = lane(cle)
    const p = m.porteur || (m.proposeesA || [])[0]
    if (p && p.prenom && !l.prenom) l.prenom = p.prenom
    if (!l.menages.has(m.date)) l.menages.set(m.date, [])
    l.menages.get(m.date).push(m)
  }
  // « Sans prestataire » toujours en dernier ; les autres par premier jour de barre.
  return [...lanes.values()].sort((a, b) => {
    if (a.cle === CLE_SANS) return 1
    if (b.cle === CLE_SANS) return -1
    const ja = [...a.jours].sort()[0] || '9999', jb = [...b.jours].sort()[0] || '9999'
    return ja < jb ? -1 : ja > jb ? 1 : 0
  })
}

// Fond des colonnes, peint en PREMIER dans chaque ligne : une cellule par
// jour (filet, teinte week-end, rails d'aujourd'hui) — la même grammaire que
// la ligne Réservations du calendrier (cal-resas__jour).
// ⚠ UN CONTENEUR DÉDIÉ, comme `cal-resas__fond` du calendrier : dans la
// piste elle-même, les cellules sont suivies des barres et des pastilles,
// donc `:last-child` ne désignait jamais le dernier jour et le filet de
// droite doublait la bordure du cadre (revue de 742fa7f).
//
// ⚠ LE FOND PORTE AUSSI LES JOURS SANS PERSONNE (recette du 13 octobre) :
// plus de ligne « Personne » dédiée — la COLONNE du bien passe en rouge
// hachuré, et un « ! » la nomme sur la première ligne du bloc.
const fondsCache = new Map()
function fondsJours (trous, marque) {
  const cle = `${marque ? 'M' : '-'}|${[...(trous || [])].sort().join(',')}`
  if (!fondsCache.has(cle)) {
    fondsCache.set(cle, `<span class="men-fond">` + etat.jours.map(iso => {
      const trou = !!(trous && trous.has(iso))
      const bang = trou && marque ? `<span class="men-jj__bang" aria-hidden="true">!</span>` : ''
      const titre = trou ? ` title="${esc(t('menages.personne_jour') + ' — ' + dateLongue(iso))}"` : ''
      return `<span class="men-jj${classesWE(iso)}${iso === AUJOURDHUI ? ' cal-auj' : ''}${trou ? ' men-jj--trou' : ''}"${titre}>${bang}</span>`
    }).join('') + `</span>`)
  }
  return fondsCache.get(cle)
}

// Les suites de jours consécutifs d'un ensemble, en indices de la fenêtre.
function suites (joursSet) {
  const idx = etat.jours.map((iso, i) => joursSet.has(iso) ? i : -1).filter(i => i >= 0)
  const runs = []
  for (const i of idx) {
    const r = runs[runs.length - 1]
    if (r && i === r.fin + 1) r.fin = i
    else runs.push({ debut: i, fin: i })
  }
  return runs
}

// ─── Rendu ──────────────────────────────────────────────────────────────────
function renderTout () {
  const cal = $('[data-bind="cal"]')
  const calTete = $('[data-bind="cal-tete"]')
  const tete = $('[data-bind="tete"]')
  const planning = $('[data-bind="planning"]')
  const vide = $('[data-bind="etat-vide"]')
  $('[data-bind="avis-tronque"]').hidden = !etat.tronque
  document.querySelectorAll('[data-mois]').forEach(b =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.mois) === etat.mois)))
  fondsCache.clear()

  // L'ordre des biens suit la poignée (persisté, biens masqués compris).
  const rang = new Map(ordreComplet().map((id, i) => [id, i]))
  const visibles = etat.biens
    .filter(b => !etat.masques.includes(String(b.id)))
    .sort((a, b) => rang.get(String(a.id)) - rang.get(String(b.id)))
  if (!etat.biens.length) {
    planning.hidden = true
    tete.hidden = true
    vide.hidden = false
    vide.innerHTML = `<p class="muted">${esc(t('menages.empty'))}</p>`
    renderBulles()
    return
  }
  vide.hidden = true
  planning.hidden = false
  tete.hidden = false

  // LA bande du calendrier (composant partagé shared/bande-jours.js) ; son
  // angle porte le sélecteur des biens masqués, comme au Calendrier.
  const bande = bandeJoursHtml({ jours: etat.jours, langue: langue(), aujourdhui: AUJOURDHUI, esc })
  calTete.innerHTML = `<div class="cal-bande">
    <div class="cal-bande__angle">${angleHtml()}</div>
    <div class="cal-bande__corps"><div class="cal-bande__l">${bande.mois}</div><div class="cal-bande__l">${bande.jours}</div></div>
  </div>`
  brancherAngle(calTete)

  const parBienGarde = new Map(etat.garde.map(g => [String(g.propertyId), g]))
  const joursSet = new Set(etat.jours)
  const menagesParBien = new Map()
  for (const m of etat.menages) {
    const cle = String(m.propertyId)
    if (!menagesParBien.has(cle)) menagesParBien.set(cle, [])
    menagesParBien.get(cle).push(m)
  }

  // Un BLOC BORDÉ par bien, comme le calendrier : titre hors cadre (poignée,
  // photo ronde, nom, ×), lignes dans le cadre.
  const blocs = visibles.map(bien => {
    const g = parBienGarde.get(String(bien.id))
    const gere = !!(g && g.gere)
    const menagesDuBien = (menagesParBien.get(String(bien.id)) || []).filter(m => joursSet.has(m.date))
    const enteteBien = `<div class="cal-bien__bandeau"><div class="cal-bien__bandeau-int">
      <span class="cal-poigne" data-poigne title="${esc(t('cal.drag_hint'))}" aria-label="${esc(t('cal.drag_hint'))}">${icone('i-menu')}</span>
      <span class="cal-photo cal-bien__photo">${photoBien(bien)}</span>
      <b class="cal-bien__nom">${esc(bien.name || '')}</b>
      <button type="button" class="cal-bien__reduire" data-reduire="${esc(bien.id)}"
        title="${esc(t('cal.reduce'))}" aria-label="${esc(t('cal.reduce'))}">${icone('i-close')}</button>
    </div></div>`
    // Un bien non confié : aucune ligne, jamais de rouge (décision du 3 sept.).
    // Un bien non confié n'a PAS de jours « sans personne » : il n'a confié
    // aucun ménage (décision du 3 septembre, pas de rouge permanent).
    const trous = gere ? trousDuBien(g) : new Set()
    const corps = !gere
      ? (menagesDuBien.length ? renderLignes(bien, g, menagesDuBien, trous)
         : `<p class="men-nonconfie caption muted" data-i18n="menages.non_confie"></p>`)
      : renderLignes(bien, g, menagesDuBien, trous)
    return `<section class="men-bloc" data-bien-section="${esc(bien.id)}">
      ${enteteBien}<div class="men-cadre">${corps}</div>
    </section>`
  }).join('')

  cal.innerHTML = blocs
  I18n.apply(cal)
  cal.querySelectorAll('[data-reduire]').forEach(b => b.addEventListener('click', () => {
    etat.masques = [...new Set([...etat.masques, String(b.dataset.reduire)])]
    ecrirePrefs(); renderTout()
  }))
  brancherPoignees(cal)
  // Le clic sur une pastille ouvre la fiche du ménage qu'elle représente.
  cal.querySelectorAll('[data-fiche]').forEach(b => b.addEventListener('click', () => {
    const bien = etat.biens.find(x => String(x.id) === String(b.dataset.ficheBien))
    if (!bien) return
    const ids = String(b.dataset.fiche).split('~')
    const ms = ids.map(id => etat.menages.find(x => String(x.bookingId) === id &&
      String(x.propertyId) === String(b.dataset.ficheBien) &&
      String(x.date) === String(b.dataset.ficheDate))).filter(Boolean)
    if (ms.length) ouvrirFiche(ms[0], bien, ms)
  }))
  renderBulles()
}

// Réordonner les blocs : LE module partagé (shared/reordonner-biens.js) —
// souris ET doigt, insertion correcte, poignée seule, payload filtré. La
// page avait réécrit ce geste et en avait repayé les quatre défauts.
function brancherPoignees (zone) {
  brancherReordonnancement(zone, {
    // ⚠ L'ORDRE COMPLET, biens masqués compris : reconstruire depuis les
    // seules sections visibles faisait revenir en DERNIER un bien masqué
    // puis ré-affiché, dont la place avait été réglée à la main.
    ordre: () => ordreComplet(),
    onOrdre: (liste) => { etat.ordre = liste; ecrirePrefs(); renderTout() }
  })
}
// L'ordre de référence : ce que les préférences disent, complété par les
// biens que le serveur a rendus et que les préférences ne connaissent pas.
function ordreComplet () {
  const connus = etat.ordre.filter(id => etat.biens.some(b => String(b.id) === id))
  const neufs = etat.biens.map(b => String(b.id)).filter(id => !connus.includes(id))
  return [...connus, ...neufs]
}


function renderLignes (bien, g, menagesDuBien, trous) {
  const lanes = lignesDuBien(bien, g, menagesDuBien)
  const nb = etat.jours.length
  return lanes.map((l, rang) => {
    const sans = l.cle === CLE_SANS
    const anonyme = l.cle === CLE_COUVERTURE
    const coul = sans || anonyme ? 'var(--surface-2)' : couleurDe(l.cle)
    const nom = sans ? t('menages.sans_presta') : (l.prenom || t('menages.quelquun'))
    const regler = l.aRegler
      ? `<span class="men-regler" data-i18n-attr="title:menages.a_regler">${icone('i-settings')}</span>` : ''
    const off = l.actif === false
    // Une désactivée = prénom grisé, LIGNE VIDE (décision du 13 octobre).
    const barres = (sans || off) ? '' : suites(l.jours).map(r =>
      `<span class="men-barre" style="grid-column: ${r.debut + 1} / ${r.fin + 2}; --coul: ${coul}"></span>`).join('')
    const pastilles = [...l.menages.entries()].map(([iso, ms]) => {
      const i = etat.jours.indexOf(iso)
      if (i < 0) return ''
      // ⚠ LE PLUS GRAVE L'EMPORTE sur une pastille agrégée (revue de 4235a21 :
      // un « non pris » rouge se cachait derrière un « fait » vert chiffré —
      // surtout sans prestataires:read, où TOUT le bien tient sur une ligne).
      // Même règle que l'ancien Planning de garde (GRAVITE, A.2).
      const m = ms.reduce((pire, x) => GRAVITE[etatPastille(x)] > GRAVITE[etatPastille(pire)] ? x : pire, ms[0])
      const e = etatPastille(m)
      const retour = (e === 'fait' && m.retour)
        ? `<span class="men-mk__retour${m.retour.verdict === 'remarque' ? ' men-mk__retour--mauvais' : ''}" title="${esc(t(m.retour.verdict === 'remarque' ? 'menages.retour_mauvais' : 'menages.retour_bon'))}">${icone(m.retour.verdict === 'remarque' ? 'i-thumb-down' : 'i-thumb-up')}</span>` : ''
      const n = ms.length > 1 ? `<span class="men-mk__n">${ms.length}</span>` : ''
      const titres = ms.map(infobulle).join('\n—\n')
      // ⚠ TOUS LES MENAGES DE LA CASE sont atteignables : la pastille affiche
      // le plus grave, mais s'il y en a deux, le second doit aussi avoir sa
      // fiche — l'ancien écran, que ce lot remplace, les listait tous les deux.
      return `<button type="button" class="men-case" style="grid-column: ${i + 1}" title="${esc(titres)}"
        data-fiche="${esc(ms.map(x => x.bookingId).join('~'))}" data-fiche-bien="${esc(bien.id)}" data-fiche-date="${esc(iso)}">
        <span class="men-mk ${CLASSE_MK[e]}">${icone(ICONE_MK[e])}${retour}${n}</span>
      </button>`
    }).join('')
    return `<div class="men-ligne">
      <div class="cal-bien__coin"><span class="men-qui${sans || off ? ' men-qui--off' : ''}"><span class="men-prenom">${esc(nom)}</span>${regler}</span></div>
      <span class="men-lane" style="--n: ${nb}">${fondsJours(trous, rang === 0)}${barres}${pastilles}</span>
    </div>`
  }).join('')
}

// Les jours où AUCUNE prestataire n'est disponible pour le bien. Ils ne
// font plus une LIGNE à eux (recette du 13 octobre) : c'est la COLONNE du
// bien qui passe en rouge hachuré, avec un « ! » — une ligne nommée
// « Personne » laissait croire à une personne de plus dans l'équipe.
function trousDuBien (g) {
  const dans = new Set(etat.jours)
  return new Set((g ? g.jours : []).filter(j => j.trou && dans.has(j.date)).map(j => j.date))
}

// ─── Fiche d'un ménage (étape 3) ────────────────────────────────────────────
const heureIntl = v => new Intl.DateTimeFormat(langue(), {
  day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris'
}).format(new Date(v))

// ⚠ TROIS ÉTAPES, PAS CINQ (Q1 de l'inventaire). `started` et `completed`
// existent au schéma, mais aucun code ne les écrit : une frise « Arrivée →
// Photos → Terminé » afficherait des jalons qu'on ne sait pas dater. On ne
// montre que ce qui est enregistré — et chaque étape porte SA date.
function frise (m) {
  const e = m.etapes || {}
  const pas = [
    { cle: 'propose', quand: e.propose, faite: !!e.propose },
    { cle: 'pris', quand: e.pris, faite: !!e.pris || !!m.porteur },
    { cle: 'fait', quand: e.fait, faite: !!m.fait }
  ]
  return `<ol class="men-frise">${pas.map(p => `
    <li class="men-frise__pas${p.faite ? ' men-frise__pas--ok' : ''}">
      <span class="men-frise__point">${p.faite ? icone('i-check') : ''}</span>
      <span class="men-frise__nom" data-i18n="menages.etape_${p.cle}"></span>
      <span class="caption muted">${p.quand ? esc(heureIntl(p.quand)) : '—'}</span>
    </li>`).join('')}</ol>` +
    (m.fait && e.parElle === false
      ? `<p class="caption muted" style="margin: 6px 0 0" data-i18n="menages.fait_par_hote"></p>` : '')
}

function ouvrirFiche (m, bien, voisins = null) {
  etat.fiche = { ...m, bienNom: bien.name, bienId: String(bien.id) }
  etat.ficheVoisins = (voisins && voisins.length > 1) ? { bien, liste: voisins } : null
  $('[data-bind="fiche-titre"]').textContent = `${bien.name} · ${dateLongue(m.date)}`
  $('[data-bind="fiche"]').hidden = false
  $('[data-bind="voile"]').hidden = false
  document.body.classList.add('men-volet-ouvert')
  renderFiche()
  $('[data-bind="fermer-fiche"]').focus()
}
function fermerFiche () {
  $('[data-bind="fiche"]').hidden = true
  if ($('[data-bind="volet"]').hidden) {
    $('[data-bind="voile"]').hidden = true
    document.body.classList.remove('men-volet-ouvert')
  }
  etat.fiche = null
}

function renderFiche () {
  const m = etat.fiche
  if (!m) return
  const corps = $('[data-bind="fiche-corps"]')
  const qui = m.porteur ? nomOu(m.porteur, 'menages.sans_presta') : null
  const tour = (m.proposeesA || []).filter(Boolean)
  const retour = m.retour
    ? `<p class="men-fiche__retour${m.retour.verdict === 'remarque' ? ' men-fiche__retour--mauvais' : ''}">
         ${icone(m.retour.verdict === 'remarque' ? 'i-thumb-down' : 'i-thumb-up')}
         <span>${esc(t(m.retour.verdict === 'remarque' ? 'menages.retour_mauvais' : 'menages.retour_bon'))}${
           m.retour.prive ? ' · ' + esc(t('menages.retour_prive')) : ''}</span>
       </p>${m.retour.extrait ? `<p class="caption men-fiche__extrait">« ${esc(m.retour.extrait)} »</p>` : ''}`
    : ''

  // Deux ménages le même jour : on passe de l'un à l'autre.
  const v = etat.ficheVoisins
  const bascule = v
    ? `<div class="row" style="gap: 6px; padding-bottom: 10px; flex-wrap: wrap">${v.liste.map((x, i) =>
        `<button type="button" class="btn btn--secondary men-fiche__presta" data-voisin="${i}"
           aria-pressed="${String(x.bookingId) === String(m.bookingId)}">${esc(t('menages.menage_n', { n: i + 1 }))}</button>`).join('')}</div>`
    : ''

  corps.innerHTML = `
    ${bascule}
    ${frise(m)}
    <div class="men-fiche__bloc">
      <p class="caption muted" style="margin: 0 0 4px" data-i18n="menages.fiche_qui"></p>
      <p style="margin: 0; font-weight: var(--fw-semibold)">${esc(qui || t('menages.sans_presta'))}</p>
      ${tour.length ? `<p class="caption muted" style="margin: 4px 0 0">${esc(
        t('menages.tt_tour', { noms: tour.map(p => nomOu(p, 'menages.quelquun')).join(', ') }))}${
        m.expireLe ? ' · ' + esc(t('menages.tt_expire', { quand: heureIntl(m.expireLe) })) : ''}</p>` : ''}
      ${m.raison ? `<p class="caption muted" style="margin: 4px 0 0">${esc(m.raison)}</p>` : ''}
    </div>
    ${retour ? `<div class="men-fiche__bloc">${retour}</div>` : ''}
    ${peutEcrire('menages') && etat.notesLues === false ? `<div class="men-fiche__bloc">
      <p class="caption muted" style="margin: 0" data-i18n="menages.note_illisible"></p>
    </div>` : ''}
    ${peutEcrire('menages') && etat.notesLues !== false ? `<div class="men-fiche__bloc">
      <label class="caption muted" for="f-note" data-i18n="menages.note_titre"></label>
      <textarea id="f-note" class="men-fiche__note" rows="3" maxlength="2000"
        data-i18n-attr="placeholder:menages.note_aide">${esc(m.note || '')}</textarea>
      <span class="row" style="gap: 8px; margin-top: 8px">
        <button type="button" class="btn btn--primary" data-note-save data-i18n="menages.note_enregistrer"></button>
        <span class="caption" data-note-etat></span>
      </span>
    </div>` : ''}
    ${peutEcrire('prestataires') ? `<div class="men-fiche__bloc">
      <p class="caption muted" style="margin: 0 0 6px" data-i18n="menages.changer_qui"></p>
      <span class="row" style="flex-wrap: wrap; gap: 6px" data-fiche-presta></span>
    </div>` : ''}`
  I18n.apply(corps)

  corps.querySelectorAll('[data-voisin]').forEach(b => b.addEventListener('click', () => {
    const x = etat.ficheVoisins.liste[Number(b.dataset.voisin)]
    if (x) ouvrirFiche(x, etat.ficheVoisins.bien, etat.ficheVoisins.liste)
  }))
  const save = corps.querySelector('[data-note-save]')
  if (save) save.addEventListener('click', () => enregistrerNote(corps))
  const zone = corps.querySelector('[data-fiche-presta]')
  if (zone) {
    // ⚠ LA MÊME FABRIQUE QUE LA BULLE. `qui` est la porteuse — la fiche la
    // nomme `porteur`, la bulle `qui` ; on ne garde qu'un vocabulaire ici.
    const cible = { bienId: m.bienId, bookingId: m.bookingId, date: m.date,
                    qui: m.porteur, proposeesA: m.proposeesA, expireLe: m.expireLe }
    zone.classList.add('men-chx')
    zone.innerHTML = htmlGestesAssignation(cible)
    brancherGestesAssignation(zone, cible, async () => { fermerFiche(); await rafraichir() })
  }
}

// ⚠ LA NOTE PART PAR LE SERVEUR (étape 3) : l'ancien écran l'écrivait depuis
// le navigateur, dans DEUX tables dont un journal de notifications. Et la
// réponse dit si elle a été TRANSMISE — enregistrée sans l'être, c'est une
// consigne que personne ne lira.
async function enregistrerNote (corps) {
  const m = etat.fiche
  const etatEl = corps.querySelector('[data-note-etat]')
  const bouton = corps.querySelector('[data-note-save]')
  const texte = corps.querySelector('#f-note').value
  etatEl.textContent = ''
  // ⚠ UN SEUL ENVOI : l'upsert de la note est idempotent, mais le fil est un
  // INSERT — deux clics envoyaient la même consigne DEUX FOIS à la prestataire.
  if (bouton.disabled) return
  bouton.disabled = true
  let r
  try {
    r = await poster('/api/menages', { action: 'note', property_id: m.bienId,
                                       booking_id: m.bookingId, departure_date: m.date, texte })
  } catch (e) { etatEl.textContent = e.message || t('menages.geste_echec'); bouton.disabled = false; return }
  finally { if (bouton) bouton.disabled = false }
  etat.fiche.note = texte.trim()
  // ⚠ `vide` : effacer n'est pas transmettre. Dire « transmise » sur un
  // retrait ferait croire que la consigne a disparu partout — elle reste dans
  // le fil de la prestataire tant qu'elle ne l'a pas lue.
  etatEl.textContent = r.vide ? t('menages.note_effacee')
    : (r.transmise ? t('menages.note_ok') : t('menages.note_non_transmise'))
  // ⚠ `rafraichir`, PAS `chargerATraiter` : la note vit dans `etat.menages`,
  // que seul `charger()` remplit. Sans lui, rouvrir la fiche réaffichait
  // l'ANCIENNE note — et un second enregistrement l'aurait réécrite par-dessus
  // la nouvelle (revue de 6822e47).
  await rafraichir()
}

// ─── Volet « Équipe ménage » ────────────────────────────────────────────────
// ⚠ IL NE CONFIGURE RIEN : un clic sur une ligne ouvre l'écran de
// configuration existant. Le volet dit QUI compose l'équipe, ce que chacune
// couvre, et ce que les voyageurs ont dit d'elle.
// `null` = jamais lu ou panne, `[]` = équipe vide (le serveur distingue).
let equipeChargee = false
let equipeEnCours = false
async function chargerEquipe () {
  if (equipeEnCours) return          // deux clics rapides, un seul appel
  equipeEnCours = true
  try {
    const r = await appel('/api/menages?equipe=1')
    etat.equipe = r.prestataires || []
    etat.equipeAvecAvis = !!r.avec_avis
    etat.equipePersonnes = r.avec_personnes !== false
    // ⚠ CHARGÉE SEULEMENT SUR SUCCÈS : marquer une panne comme « chargée »
    // figeait le volet sur « non lisible » pour toute la session, sans jamais
    // retenter — il fallait recharger la page (revue de dfcf8d4).
    equipeChargee = true
  } catch (e) {
    logger.error('Menages', 'équipe', e)
    // ⚠ Une panne ne se déguise pas en équipe vide : `null` fait dire « non
    // lisible », jamais « personne dans l'équipe ».
    etat.equipe = null
  } finally {
    equipeEnCours = false
  }
  renderEquipe()
}

function ouvrirEquipe () {
  $('[data-bind="volet"]').hidden = false
  $('[data-bind="voile"]').hidden = false
  document.body.classList.add('men-volet-ouvert')
  $('[data-bind="fermer-equipe"]').focus()
  renderEquipe()
  if (!equipeChargee) chargerEquipe()
}
function fermerEquipe () {
  $('[data-bind="volet"]').hidden = true
  $('[data-bind="voile"]').hidden = true
  document.body.classList.remove('men-volet-ouvert')
  const b = $('[data-bind="ouvrir-equipe"]')
  if (b) b.focus()
}

// Les biens couverts : miniatures rondes empilées, photo ou initiales.
function miniaturesBiens (biens) {
  if (!biens || !biens.length) return `<span class="caption muted">—</span>`
  return biens.slice(0, 4).map(b => `<span class="cal-photo men-mini" title="${esc(b.nom)}">${b.photo
    ? `<img src="${esc(b.photo)}" alt="" loading="lazy">`
    : `<span class="men-mini__ini" aria-hidden="true">${esc(String(b.nom || '').trim().slice(0, 2).toUpperCase())}</span>`}</span>`).join('') +
    (biens.length > 4 ? `<span class="caption muted men-mini__plus">+${biens.length - 4}</span>` : '')
}

// ⚠ LE COMPTE DE RETOURS, PAS UNE MOYENNE ÉTOILÉE (décision de Thierry du
// 13 octobre, inventaire H.6) : la note chiffrée `score_clean` n'est fiable
// que sur deux couples provider/OTA et absente des avis manuels — une étoile
// serait un chiffre faux-précis. C'est le MÊME chiffre, par la MÊME fonction
// et sur la MÊME période, que celui que la prestataire voit chez elle.
function retoursHtml (r) {
  if (!r || !r.total) return `<span class="men-note men-note--vide">—</span>`
  const bon = `<span class="men-note__bon${r.positif ? '' : ' men-note--vide'}">${icone('i-thumb-up')}<b>${r.positif}</b></span>`
  const mauvais = `<span class="men-note__mauvais${r.remarque ? '' : ' men-note--vide'}">${icone('i-thumb-down')}<b>${r.remarque}</b></span>`
  return `<span class="men-note">${bon}${mauvais}</span>`
}

function renderEquipe () {
  const liste = $('[data-bind="equipe-liste"]')
  const compte = $('[data-bind="equipe-compte"]')
  const pied = $('[data-bind="equipe-pied"]')

  if (!equipeChargee) {
    compte.textContent = ''
    liste.innerHTML = `<p class="caption muted" style="padding: 12px">${esc(t('common.loading'))}</p>`
  } else if (etat.equipe === null) {
    compte.textContent = ''
    liste.innerHTML = `<p class="caption muted" style="padding: 12px">${esc(t('menages.equipe.panne'))}</p>`
  } else if (!etat.equipe.length) {
    // ⚠ « VIDE » ET « PAS LE DROIT » NE SE DISENT PAS PAREIL : affirmer
    // l'équipe vide à un délégué qui n'a pas `prestataires: read` serait une
    // contre-vérité (revue de dfcf8d4).
    compte.textContent = ''
    liste.innerHTML = `<p class="caption muted" style="padding: 12px">${esc(
      etat.equipePersonnes ? t('menages.equipe.vide') : t('menages.equipe.sans_droit'))}</p>`
  } else {
    compte.textContent = etat.equipe.length
    liste.innerHTML = etat.equipe.map(p => {
      const nom = [p.prenom, p.nom].filter(Boolean).join(' ') || t('menages.quelquun')
      // Un nom de famille manquant se DIT : la fiche l'exige à la création,
      // mais les fiches anciennes n'en ont pas (règle non rétroactive, H.1).
      const manque = p.nom ? '' : ` <span class="men-eq__manque" data-i18n="menages.equipe.nom_manquant"></span>`
      const regler = p.aRegler
        ? `<span class="men-regler" data-i18n-attr="title:menages.a_regler">${icone('i-settings')}</span>` : ''
      // ⚠ L'aria-label COMPLÈTE le nom, il ne le remplace pas : « Configurer »
      // seul rendait huit lignes indistinguables au lecteur d'écran.
      // ⚠ UN BOUTON, PLUS UN LIEN : la configuration s'ouvre EN FENÊTRE, par
      // dessus le planning. L'hôte a déjà désigné qui il veut régler — le
      // sortir de sa page pour y revenir lui ferait perdre le fil.
      return `<button type="button" class="men-eq${p.actif ? '' : ' men-eq--off'}" data-cfg-ouvrir-presta="${esc(p.id)}"
         aria-label="${esc(t('menages.equipe.configurer') + ' — ' + nom)}">
        <span class="men-eq__id">
          <span class="men-eq__nom">${esc(nom)}${manque}</span>
          ${etat.equipeAvecAvis ? retoursHtml(p.retours) : ''}
        </span>
        <span class="men-eq__biens">${miniaturesBiens(p.biens)}</span>
        ${regler}
        <svg class="icon men-eq__chevron" aria-hidden="true"><use href="/shared/icons.svg#i-chevron"/></svg>
      </button>`
    }).join('')
  }

  // « Ajouter » : création réservée au TITULAIRE (décision D6), donc absent du
  // DOM pour un délégué — griser promettrait un geste qu'on refuserait.
  pied.innerHTML = estTitulaire()
    ? `<a class="btn btn--outline btn--block btn--lg" href="/apps/menages/prestataires?nouveau=1">
         ${icone('i-plus')}<span data-i18n="menages.equipe.ajouter"></span></a>`
    : ''
  I18n.apply($('[data-bind="volet"]'))
}

// ─── Les gestes de la bulle (étape 3, demandés en recette) ─────────────────
// ⚠ ILS ÉCRIVENT SUR LE SERVEUR, pas dans le navigateur. « Fait » marqué ici
// est le même fait que celui de la PWA : même table, même writer (écart D1).
async function validerMenage (l) {
  let r
  // ⚠ L'ÉCRITURE ET LA RELECTURE NE SE CONFONDENT PAS. Les mettre dans le même
  // `try` faisait dire « le geste n'a pas pu être enregistré » quand c'était la
  // RELECTURE qui échouait — l'hôte recommençait un geste déjà fait, et sur
  // « Changer » cela voulait dire deux personnes sollicitées (revue de 7f79406).
  try {
    r = await poster('/api/menages', { action: 'fait', property_id: l.bienId,
                                       booking_id: l.bookingId, departure_date: l.date })
  } catch (e) { toast(e.message || t('menages.geste_echec')); return }
  toast(t('menages.fait_ok', { bien: l.bienNom }), {
    // ⚠ « Annuler » N'EST OFFERT QUE SI LA LIGNE EST NÉE DE CE GESTE. Si la
    // prestataire avait marqué entre-temps, l'écriture est un no-op : annuler
    // supprimerait SA ligne, donc sa trace et son travail validé.
    annuler: r && r.insere
      ? async () => {
          try {
            await poster('/api/menages', { action: 'defaire', property_id: l.bienId,
                                           booking_id: l.bookingId, departure_date: l.date })
          } catch (e) { toast(e.message || t('menages.geste_echec')); return }
          await rafraichir()
        }
      : null
  })
  await rafraichir()
}

// ─── LES QUATRE GESTES D'ASSIGNATION, UNE SEULE FOIS ────────────────────────
//
// ⚠ CE QUE L'ANCIEN PLANNING FAISAIT ET QUE CET ÉCRAN NE FAISAIT PAS (étape 4,
// 14 octobre 2026). La V5 ne savait qu'ASSIGNER : un clic sur un prénom, et le
// ménage changeait de main sur-le-champ. Trois gestes manquaient, et le premier
// est le DÉFAUT du serveur :
//   · « Proposer » — elle confirme, et le ménage RESTE chez sa porteuse tant
//     que personne n'a accepté. Engager quelqu'un sans son accord doit rester
//     un choix explicite, pas ce qui arrive quand on touche un prénom.
//   · « Assigner » — transfert immédiat, sans confirmation. Le geste d'urgence :
//     quelqu'un se décommande à deux heures du départ.
//   · « Retirer la proposition » — elle s'efface, le ménage ne bouge pas.
//   · « Personne » — plus de porteuse du tout.
//
// ⚠ UNE SEULE FABRIQUE POUR LES DEUX SURFACES (la bulle et la fiche). Deux
// listes écrites à côté l'une de l'autre finiraient par offrir des gestes
// différents sur le même ménage — c'est le défaut que ce lot a déjà payé deux
// fois (les cases de jours, puis le badge « Vu »).
//
// `cible` : { bienId, bookingId, date, qui, proposeesA, expireLe }.
function htmlGestesAssignation (cible) {
  const dejaLa = cible.qui && cible.qui.id ? String(cible.qui.id) : null
  const offrables = (etat.prestataires || []).filter(p => String(p.id) !== dejaLa)
  // Une proposition court-elle ? Les deux surfaces ne nomment pas la même
  // chose : la bulle porte `expireLe`, la fiche `proposeesA`.
  const propose = !!((cible.proposeesA || []).length || cible.expireLe)
  const ligne = (p) => `<div class="men-chx__p">
      <span class="men-chx__nom">${esc(p.prenom || '')}</span>
      <button type="button" class="btn btn--secondary men-chx__b"
              data-presta="${esc(p.id)}" data-mode="proposer">${esc(t('menages.proposer'))}</button>
      <button type="button" class="btn btn--secondary men-chx__b"
              data-presta="${esc(p.id)}" data-mode="assigner">${esc(t('menages.assigner'))}</button>
    </div>`
  return `<p class="caption muted men-chx__t">${esc(t('menages.changer_qui'))}
      <span class="men-chx__aide">${esc(t('menages.proposer'))} : ${esc(t('menages.proposer_aide'))} ·
      ${esc(t('menages.assigner'))} : ${esc(t('menages.assigner_aide'))}</span></p>` +
    (offrables.length
      ? offrables.map(ligne).join('')
      : `<p class="caption muted men-chx__t">${esc(t('menages.changer_vide'))}</p>`) +
    (propose ? `<button type="button" class="btn btn--secondary men-chx__g" data-retirer-offre>
        ${esc(t('menages.retirer_proposition'))}</button>` : '') +
    (dejaLa ? `<button type="button" class="btn btn--secondary men-chx__g" data-personne>
        ${esc(t('menages.retirer_personne'))}</button>` : '')
}

// Le geste lui-même. ⚠ LE SERVEUR TRANCHE, et c'est SA réponse qu'on annonce :
// « proposé » et « assigné » ne se disent pas pareil, et l'écran ne doit pas
// promettre un transfert quand il n'a posé qu'une question.
async function gesteAssignation (cible, { providerId, mode }) {
  let r
  try {
    r = await poster('/api/menages', { property_id: cible.bienId, booking_id: cible.bookingId,
                                       departure_date: cible.date, provider_id: providerId, mode })
  } catch (e) { toast(e.message || t('menages.geste_echec')); return false }
  if (!providerId) toast(t('menages.retire_ok'))
  else if (r && r.retiree) toast(t('menages.proposition_retiree'))
  else if (r && r.assignee) toast(t('menages.change_ok', { prenom: r.prenom || '' }))
  else toast(t('menages.propose_ok', { prenom: (r && r.prenom) || '' }))
  return true
}

// ⚠ LE BRANCHEMENT EST COMMUN LUI AUSSI : une zone, les quatre gestes.
// `apres` est appelé après un geste réussi (refermer, rafraîchir).
function brancherGestesAssignation (zone, cible, apres) {
  zone.addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-presta],[data-retirer-offre],[data-personne]')
    if (!b || b.disabled) return
    ev.stopPropagation()
    // ⚠ « Retirer la proposition » = re-choisir la PORTEUSE actuelle, en mode
    // `assigner` : c'est ce que le serveur lit comme un retrait (api/menages.js
    // §« RE-CHOISIR LA PORTEUSE = RETIRER LA PROPOSITION »). Elle garde son
    // ménage, l'offre s'efface.
    const quoi = 'retirerOffre' in b.dataset
      ? { providerId: (cible.qui || {}).id, mode: 'assigner' }
      : ('personne' in b.dataset
          ? { providerId: null, mode: 'assigner' }
          : { providerId: b.dataset.presta, mode: b.dataset.mode })
    zone.querySelectorAll('button').forEach(x => { x.disabled = true })
    const ok = await gesteAssignation(cible, quoi)
    if (!ok) { zone.querySelectorAll('button').forEach(x => { x.disabled = false }); return }
    await apres()
  })
}

// Changer la prestataire : la liste des actives et les quatre gestes.
function ouvrirChangement (l, ancre) {
  document.querySelectorAll('.men-choix').forEach(x => x.remove())
  const choix = document.createElement('div')
  choix.className = 'men-choix'
  // ⚠ LA PERSONNE DÉJÀ SUR LE MÉNAGE N'EST PAS REPROPOSÉE dans la liste : elle
  // a son propre geste, « Retirer la proposition », qui dit ce qu'il fait.
  choix.innerHTML = htmlGestesAssignation(l)
  ancre.appendChild(choix)
  const fermer = () => choix.remove()
  setTimeout(() => document.addEventListener('click', fermer, { once: true }), 0)
  choix.addEventListener('click', e => e.stopPropagation())
  brancherGestesAssignation(choix, l, async () => { fermer(); await rafraichir() })
}

// Après un geste : la bulle ET le planning, puisque les deux lisent le cœur.
async function rafraichir () {
  // Les deux lectures disent elles-mêmes leurs pannes (bulle muette, bandeau
  // d'erreur du planning) : on ne les habille pas d'un message de geste raté.
  await Promise.all([chargerATraiter(), charger()])
}

// ─── La bulle « À traiter » ─────────────────────────────────────────────────
const MAX_LIGNES = 8

// Le badge ambre de l'onglet Ménages = le nombre de lignes de la bulle.
function majBadge () {
  // ⚠ SUR UNE PANNE, ON NE TOUCHE PAS AU BADGE. Le remettre à zéro ferait
  // dire à la navigation « rien à traiter » pendant que la bulle dit
  // « non lisible » — le calme annoncé sur une panne, encore (revue de
  // c197a10). Sans lecture, le badge garde ce qu'il montrait.
  if (!Array.isArray(etat.aTraiter)) return
  HSNav.render({ peutLire, badges: { menagesATraiter: etat.aTraiter.length } })
}

// ⚠ LE PROBLÈME EN TOUTES LETTRES, EN PREMIER (recette du 13 octobre).
// La ligne disait « Ofuro Futari · dim. 13 sept. » : l'hôte lisait un bien et
// une date, et devait deviner à l'icône POURQUOI elle était là. Le titre dit
// désormais ce qui ne va pas ; le bien, la date et le prénom suivent.
function ligneHtml (l) {
  // ⚠ PAS DE PICTOGRAMME DE TYPE (recette du 13 octobre) : depuis que le titre
  // dit le problème en toutes lettres, l'icône ne faisait que le répéter. La
  // MINIATURE DU BIEN reste, elle : elle identifie le logement d'un coup
  // d'œil. Sans photo, ses initiales — jamais une maison générique, qui ne
  // distinguerait aucun bien d'un autre.
  const photo = `<span class="cal-photo men-atr__photo">${l.photo
    ? `<img src="${esc(l.photo)}" alt="" loading="lazy">`
    : `<span class="men-atr__ini" aria-hidden="true">${esc(String(l.bienNom || '').trim().slice(0, 2).toUpperCase())}</span>`}</span>`
  const quand = l.type === 'sans_personnel'
    ? t('menages.n_jours', { n: l.nbJours })
    : dateCourte(l.date)
  const qui = l.qui && l.qui.prenom ? ` · ${esc(l.qui.prenom)}` : ''
  // ⚠ « Pas vu » DIT OÙ ELLE EN EST DE SA PAGE, sinon l'hôte ne sait pas
  // s'il doit appeler ou attendre cinq minutes : « page vue il y a 2 h et
  // toujours pas vu » et « page jamais ouverte » ne se traitent pas
  // pareil. Jamais ouverte est le cas le plus grave : il se dit en toutes
  // lettres, pas par une absence de date.
  // ⚠ `undefined` NE DIT RIEN — et ce n'est pas `null`. La lecture des
  // ouvertures peut être en panne alors que l'alerte, elle, tient (elle ne
  // dépend plus que du ménage) : afficher « page jamais ouverte » serait
  // alors une accusation inventée.
  const vue = l.type === 'pas_vu' && l.vueLe !== undefined
    ? ` · ${esc(l.vueLe ? t('menages.vue_il_y_a', { quand: ilYa(l.vueLe) }) : t('menages.vue_jamais'))}`
    : ''
  // Seul `pas_vu` garde un pictogramme (téléphone barré) : il ne dit pas un
  // problème de couverture, et le distinguer évite de le lire comme tel.
  const ico = l.type === 'pas_vu'
    ? `<span class="men-atr__type">${icone('i-phone-off')}</span>`
    : ''
  return `<div class="men-atr">
    ${photo}${ico}
    <span class="men-atr__texte">
      <b${l.type === 'pas_vu' ? ' class="men-atr__rouge"' : ''}>${esc(t('menages.type_' + l.type))}</b>
      <span class="caption muted">${esc(l.bienNom)} · ${esc(quand)}${qui}${vue}</span>
    </span>
    ${boutonsLigne(l)}
  </div>`
}

// ⚠ CHAQUE BOUTON SUIT SON DROIT, et un bouton non autorisé est ABSENT du DOM
// (décision G12) : griser promet un geste qu'on refusera.
function boutonsLigne (l) {
  const b = []
  // ⚠ APPELER EST LE SEUL GESTE QUI RÉSOUT « Pas vu » : rien dans HôteSmart
  // ne peut forcer quelqu'un à ouvrir son ménage — les deux
  // relances par SMS (la veille et le matin, 9 h) sont tout ce que la machine
  // sait faire. Le bouton est ABSENT sans numéro (on ne propose pas un appel
  // qu'on ne peut pas passer) — même règle que les droits : jamais grisé,
  // absent.
  if (l.type === 'pas_vu') {
    // ⚠ LE NUMERO VIENT DU VOLET ÉQUIPE, pas de `/api/garde` : cet endpoint
    // refuse les coordonnées (« qui est de garde » n'est pas « comment la
    // joindre »), et son test le garde.
    const tel = ((etat.equipe || []).find(p => l.qui && String(p.id) === String(l.qui.id)) || {}).tel
    if (tel) {
      b.push(`<a class="btn btn--secondary men-atr__btn" href="tel:${esc(String(tel).replace(/[^+0-9]/g, ''))}">`
        + `${icone('i-phone')}${esc(t('menages.appeler'))}</a>`)
    }
  }
  if (l.type === 'non_termine' && peutEcrire('menages')) {
    b.push(`<button type="button" class="btn btn--secondary men-atr__btn" data-valider>${esc(t('menages.valider'))}</button>`)
  }
  // Changer la prestataire : partout où quelqu'un doit faire le ménage.
  const dejaLa = l.qui && l.qui.id ? String(l.qui.id) : null
  const offrables = etat.prestataires.filter(p => String(p.id) !== dejaLa).length
  if (['non_termine', 'non_assigne', 'non_pris'].includes(l.type) &&
      peutEcrire('prestataires') && offrables) {
    b.push(`<button type="button" class="btn btn--secondary men-atr__btn" data-changer>${esc(t('menages.changer'))}</button>`)
  }
  return b.length ? `<span class="men-atr__actions">${b.join('')}</span>` : ''
}

function renderBulle () {
  const zone = $('[data-bind="bulle"]')
  zone.hidden = false
  // Panne de lecture : on le DIT, on n'annonce pas le calme.
  if (etat.aTraiter === null) {
    zone.className = 'men-bulle men-bulle--muette'
    zone.innerHTML = `<p class="caption muted" id="h-atraiter" style="margin: 0">${esc(t('menages.atraiter_panne'))}</p>`
    return
  }
  const lignes = etat.aTraiter
  // Rien à traiter : une ligne blanche avec une coche verte, SANS ambre.
  if (!lignes.length) {
    zone.className = 'men-bulle men-bulle--calme'
    zone.innerHTML = `<span class="men-atr__type men-atr__type--ok">${icone('i-check')}</span>
      <span id="h-atraiter" data-i18n="menages.atraiter_rien"></span>`
    I18n.apply(zone)
    return
  }
  zone.className = 'men-bulle'
  // ⚠ PLUS DE COMPTEURS PAR TYPE (recette du 13 octobre) : une rangée de
  // chiffres au-dessus d'une liste qui dit déjà tout en toutes lettres ne
  // faisait que répéter. La liste, partout, 8 lignes puis « Tout voir ».
  const filtrees = etat.toutVoir ? lignes : lignes.slice(0, MAX_LIGNES)
  const reste = lignes.length - filtrees.length
  zone.innerHTML = `
    <div class="men-bulle__tete">
      <h2 class="h2" id="h-atraiter" data-i18n="menages.atraiter"></h2>
      <span class="badge badge--amber">${lignes.length}</span>
      <span class="caption muted" style="margin-inline-start: auto" data-i18n="menages.atraiter_fenetre"></span>
    </div>
    ${etat.aTraiterTronque ? `<p class="caption" style="margin: 0; color: var(--warn)" data-i18n="menages.atraiter_tronque"></p>` : ''}
    <div class="men-atrs">${filtrees.map(ligneHtml).join('')}</div>
    ${reste > 0 ? `<button type="button" class="link small" data-tout-voir>${esc(t('menages.tout_voir', { n: reste }))}</button>` : ''}`
  I18n.apply(zone)
  const tv = zone.querySelector('[data-tout-voir]')
  if (tv) tv.addEventListener('click', () => { etat.toutVoir = true; renderBulle() })
  // Les gestes : la ligne connaît SA donnée par son rang dans la liste rendue.
  zone.querySelectorAll('.men-atr').forEach((el, i) => {
    const l = filtrees[i]
    if (!l) return
    const v = el.querySelector('[data-valider]')
    if (v) v.addEventListener('click', () => validerMenage(l))
    const c = el.querySelector('[data-changer]')
    if (c) c.addEventListener('click', (e) => { e.stopPropagation(); ouvrirChangement(l, el) })
  })
}

// MÊME UI QUE LE CALENDRIER. Ordinateur : le sélecteur vit dans l'angle de la
// bande (puce aux miniatures empilées + menu « Afficher » / « Tout
// afficher ») ; téléphone : des bulles photo au-dessus des dates.
function lesMasques () {
  return etat.biens.filter(b => etat.masques.includes(String(b.id)))
}
function angleHtml () {
  if (!estLarge()) return ''
  const masques = lesMasques()
  if (!masques.length) return `<span class="caption muted">${esc(t('cal.all_shown'))}</span>`
  const minis = masques.slice(0, 4).map(b => `<span class="cal-photo cal-angle__mini">${photoBien(b)}</span>`).join('')
  return `<details class="cal-angle__menu">
    <summary class="cal-angle__puce" title="${esc(t('cal.hidden_props'))}">
      <span class="cal-angle__pile">${minis}</span>
      <b>${masques.length}</b>
      <span class="caption">${esc(t('cal.hidden_props'))}</span>
    </summary>
    <div class="cal-angle__liste">
      ${masques.map(b => `<button type="button" data-afficher="${esc(b.id)}">
        <span class="cal-photo cal-angle__mini">${photoBien(b)}</span>
        <span class="cal-angle__nom">${esc(b.name || '')}</span>
        <span class="link small">${esc(t('cal.show_one'))}</span>
      </button>`).join('')}
      <button type="button" class="cal-angle__tout" data-tout-afficher>${esc(t('cal.show_all'))}</button>
    </div>
  </details>`
}
function brancherAngle (zone) {
  const afficher = ids => {
    etat.masques = etat.masques.filter(x => !ids.includes(x))
    ecrirePrefs(); renderTout()
  }
  zone.querySelectorAll('[data-afficher]').forEach(b => b.addEventListener('click', () => afficher([String(b.dataset.afficher)])))
  const tout = zone.querySelector('[data-tout-afficher]')
  if (tout) tout.addEventListener('click', () => afficher(etat.masques.slice()))
  const det = zone.querySelector('.cal-angle__menu')
  if (det) {
    det.addEventListener('toggle', () => {
      if (!det.open) return
      const r = det.querySelector('summary').getBoundingClientRect()
      const liste = det.querySelector('.cal-angle__liste')
      liste.style.top = (r.bottom + 4) + 'px'
      liste.style.insetInlineStart = Math.max(8, r.left) + 'px'
    })
    // ⚠ UNE SEULE FOIS : `[data-bind="planning"]` SURVIT aux rendus, et
    // brancherAngle est rappelé à chaque renderTout — un écouteur par rendu
    // s'empilait, chacun retenant un <details> détaché (revue de 742fa7f).
    const planning = $('[data-bind="planning"]')
    if (!planning.dataset.fermeAngle) {
      planning.dataset.fermeAngle = '1'
      planning.addEventListener('scroll', () => {
        const ouvert = $('[data-bind="tete"]').querySelector('.cal-angle__menu[open]')
        if (ouvert) ouvert.open = false
      }, { passive: true })
    }
  }
}
function renderBulles () {
  const zone = $('[data-bind="bulles"]')
  if (estLarge()) { zone.innerHTML = ''; return }
  zone.innerHTML = lesMasques().map(b =>
    `<button type="button" class="cal-bulle" data-afficher="${esc(b.id)}" title="${esc(t('cal.bubble_show', { nom: b.name || '' }))}">
      <span class="cal-photo cal-bulle__photo">${photoBien(b)}</span>
      <span class="cal-bulle__nom">${esc(b.name)}</span>
    </button>`).join('')
  zone.querySelectorAll('[data-afficher]').forEach(b => b.addEventListener('click', () => {
    etat.masques = etat.masques.filter(x => x !== String(b.dataset.afficher))
    ecrirePrefs(); renderTout()
  }))
}

// ─── Configuration d'une prestataire (fenêtre à trois onglets) ──────────────
//
// ⚠ LA PHRASE D'ÉTAT N'EST PAS CALCULÉE ICI. Elle vient de
// `shared/presta-etat.js`, qui applique la règle du MOTEUR (trois filtres plus
// la restriction de proposition). La recopier dans la page la ferait diverger
// du jour où le moteur change — et c'est la seule chose qui dise à l'hôte
// qu'un réglage ne produira jamais rien.
//
// ⚠ TOUT S'ENREGISTRE À MESURE (décision de Thierry). L'écran d'avant avait
// DEUX temporalités dans le même formulaire : les disponibilités et la
// visibilité s'écrivaient tout de suite, le reste au « Sauvegarder » — et
// « Annuler » n'annulait donc que la moitié de la fiche. Ici, un geste = une
// écriture, et le pied le dit.
//
// ⚠ L'ÉTAT EST CELUI DU SERVEUR. Chaque geste écrit PUIS RELIT : un écran qui
// se peint sur une écriture supposée réussie ment dès la première panne.
const CFG_ONGLETS = ['cal', 'param']
const CFG_JOURS = [{ n: 1, c: 'L' }, { n: 2, c: 'M' }, { n: 3, c: 'M' }, { n: 4, c: 'J' },
                   { n: 5, c: 'V' }, { n: 6, c: 'S' }, { n: 0, c: 'D' }]
const CFG_VISIBLES = [7, 14, 30, 60, 90]
const CFG_PERIODES = ['15j', '30j', '6mois', 'toujours']

const cfg = {
  profilId: null,
  onglet: 'cal',
  fiche: null,        // réponse de /api/menages?presta=… (null = pas lu)
  dispo: null,        // réponse de /api/disponibilites (null = pas lu)
  eval: null,         // réglages d'évaluation (bus avis), null = pas lu
  erreur: false,
  occupe: false
}

async function ouvrirConfig (profilId) {
  cfg.profilId = String(profilId)
  cfg.onglet = 'cal'
  cfg.fiche = null; cfg.dispo = null; cfg.eval = null; cfg.erreur = false
  $('[data-bind="cfg"]').hidden = false
  $('[data-bind="cfg-voile"]').hidden = false
  document.body.classList.add('men-cfg-ouvert')
  renderConfig()
  $('[data-bind="cfg-fermer"]').focus()
  await chargerConfig()
}

function fermerConfig () {
  $('[data-bind="cfg"]').hidden = true
  $('[data-bind="cfg-voile"]').hidden = true
  document.body.classList.remove('men-cfg-ouvert')
  cfg.profilId = null
  // ⚠ LE VOLET SE RAFRAÎCHIT : on vient peut-être de changer ses biens, son
  // nom ou de la retirer de l'équipe. Le laisser tel quel afficherait la ligne
  // d'avant, et l'hôte croirait son geste perdu.
  equipeChargee = false
  chargerEquipe().catch(() => {})
  chargerATraiter().catch(() => {})
}

async function chargerConfig () {
  const id = cfg.profilId
  try {
    // ⚠ TROIS PORTES, ET C'EST VOULU : la fiche (identité, biens, liaisons,
    // réglages du lien), le calendrier (`/api/disponibilites`, writer unique
    // des règles, exceptions, congés et « ce qu'elle voit des autres ») et les
    // réglages d'évaluation (le bus du cœur). Chacune a sa garde ; les
    // dupliquer ici créerait un second chemin à tenir à jour.
    const [fiche, dispo] = await Promise.all([
      appel(`/api/menages?presta=${encodeURIComponent(id)}`),
      appel(`/api/disponibilites?provider_id=${encodeURIComponent(id)}`).catch(e => {
        logger.error('Menages', 'config dispo', e); return null
      })
    ])
    if (cfg.profilId !== id) return      // fenêtre refermée ou changée entre-temps
    cfg.fiche = fiche
    cfg.dispo = dispo
    cfg.erreur = false
  } catch (e) {
    if (cfg.profilId !== id) return
    logger.error('Menages', 'config', e)
    cfg.erreur = true
  }
  renderConfig()
  // L'évaluation des voyageurs n'est pas bloquante : elle vit sur un autre bus
  // et son absence ne doit pas retarder le reste de la fenêtre.
  if (cfg.fiche && cfg.fiche.droits && cfg.fiche.droits.avis !== 'none') chargerEvalConfig(id)
}

async function chargerEvalConfig (id) {
  try {
    const r = await hsBus.demander('avis.reglages_prestataire', { profile_id: id })
    if (cfg.profilId !== id) return
    cfg.eval = r || null
  } catch (e) {
    logger.error('Menages', 'config éval', e)
    // `null` reste `null` : l'écran dira « non lisible » plutôt que d'afficher
    // des réglages qu'il n'a pas lus.
  }
  if (cfg.onglet === 'param') renderConfig()
}

// Un geste = une écriture, puis une relecture. ⚠ `occupe` empêche deux
// écritures concurrentes sur la même fiche : deux clics rapides sur deux biens
// enverraient deux listes de liaisons calculées sur le même état d'avant, et
// la seconde écraserait la première.
async function gesteConfig (fn) {
  if (cfg.occupe) return
  cfg.occupe = true
  renderConfig()
  try {
    await fn()
    await chargerConfig()
  } catch (e) {
    logger.error('Menages', 'config geste', e)
    toast(t('menages.equipe.config.echec'))
    await chargerConfig().catch(() => {})
  } finally {
    cfg.occupe = false
    renderConfig()
  }
}

// ─── L'en-tête, et la phrase d'état ─────────────────────────────────────────

function renderConfig () {
  const zone = $('[data-bind="cfg"]')
  if (zone.hidden) return
  const f = cfg.fiche
  const p = f && f.personne
  const nom = p ? ([p.prenom, p.nom].filter(Boolean).join(' ') || t('menages.quelquun')) : ''
  $('[data-bind="cfg-nom"]').textContent = cfg.erreur ? t('menages.equipe.panne') : (nom || t('common.loading'))

  // Sous-titre : les retours (le COMPTE, jamais une moyenne étoilée — décision
  // de Thierry, H.6) et la dernière ouverture de sa page.
  const sous = $('[data-bind="cfg-sous"]')
  if (!p) sous.innerHTML = ''
  else {
    const dansLEquipe = (etat.equipe || []).find(x => String(x.id) === String(p.id))
    const retours = (etat.equipeAvecAvis && dansLEquipe) ? retoursHtml(dansLEquipe.retours) : ''
    sous.innerHTML = `${retours}${vueHtml(p)}`
  }

  // Appeler / écrire : ABSENTS sans coordonnée — on ne propose pas un geste
  // qu'on ne peut pas faire.
  const actions = $('[data-bind="cfg-actions"]')
  actions.innerHTML = !p ? '' : [
    p.tel ? `<a class="btn btn--secondary btn--icon" href="tel:${esc(String(p.tel).replace(/[^+0-9]/g, ''))}"
                 aria-label="${esc(t('menages.appeler'))}">${icone('i-phone')}</a>` : '',
    p.email ? `<a class="btn btn--secondary btn--icon" href="mailto:${esc(p.email)}"
                  aria-label="${esc(t('menages.equipe.config.ecrire'))}">${icone('i-message')}</a>` : ''
  ].join('')

  renderEtatConfig()
  renderOngletsConfig()
  renderCorpsConfig()
  I18n.apply(zone)
}

// ⚠ DEUX ÉTATS, PAS UNE DATE (décision de Thierry, recette du 14 octobre).
// « Lien ouvert il y a trois jours » ne dit rien à l'hôte : ce qu'il veut
// savoir, c'est si ce qu'il vient de lui confier est ARRIVÉ chez elle. La date
// exacte reste, au survol seulement.
//
// ⚠ ET LA RÈGLE EST CELLE DE LA BULLE, FENÊTRE COMPRISE (`nonVuPar` et
// `JOURS_IMMINENT`, module partagé). La fiche regardait TOUT ce qui est à
// venir, ce qui se tenait quand la question était « a-t-elle ouvert sa page ? »
// — une réponse par personne. Depuis le 14 octobre 2026 la question est « a-t-
// elle validé CE ménage ? », et un ménage attribué d'office pour dans trois
// mois n'est validé par personne : sans borne, chaque prestataire serait rouge
// en permanence, et un rouge permanent n'est plus lu.
// Même fenêtre, donc : ce qui presse. Deux implémentations finiraient par
// afficher un bandeau vert au-dessus d'une ligne rouge sur la même personne.
//
// ⚠ ON NE SAIT PAS ≠ TOUT VA BIEN : sans la lecture de la bulle, on n'affiche
// RIEN plutôt qu'un « À jour » rassurant et faux.
function vueHtml (p) {
  if (!Object.prototype.hasOwnProperty.call(p, 'vue_le')) return ''
  // ⚠ ON NE CONCLUT RIEN SANS AVOIR LU. « Aucun ménage connu » et « la lecture
  // n'a pas eu lieu » se ressemblent dans un tableau vide, et seul le second
  // interdit de dire « À jour » (constat de la revue de 6d007f3).
  // ⚠ ET PAS DAVANTAGE SUR UNE LECTURE TRONQUÉE (constat de la re-revue de
  // e528ca1) : au-delà du plafond de lignes, les derniers ménages ne sont pas
  // rendus — un vert conclu sur une liste coupée est le même mensonge.
  if (!etat.bulleLue || etat.aTraiterTronque) return ''
  // La même borne que la bulle, calculée de la même façon : J + JOURS_IMMINENT
  // en jours CALENDAIRES, insensible au fuseau.
  const limite = limiteDeLImminence(AUJOURDHUI)
  const nonVus = (etat.menagesBulle || []).filter(m =>
    m.date >= AUJOURDHUI && m.date <= limite && !m.fait &&
    nonVuPar(m, p.id, p.vue_le) === true)
  // La date exacte au survol — et, quand elle n'a jamais ouvert, on le dit là
  // plutôt que de l'afficher en permanence : l'état répond à « est-ce arrivé
  // chez elle », pas à « depuis quand ».
  const titre = p.vue_le ? dateHeure(p.vue_le) : t('menages.equipe.config.vue_jamais')
  if (!nonVus.length) {
    return `<span class="men-cfg__vue men-cfg__vue--ok" title="${esc(titre)}">${icone('i-check')}
      <span data-i18n="menages.equipe.config.a_jour"></span></span>`
  }
  return `<span class="men-cfg__vue men-cfg__vue--ko" title="${esc(titre)}">${icone('i-phone-off')}
    <span data-i18n="menages.equipe.config.pas_vu"></span></span>`
}

// ⚠ VERT OU ROUGE, JAMAIS D'AMBRE ICI (décision de Thierry). `rien` est
// réservé au cas où elle ne recevra AUCUN ménage ; un bien mal réglé parmi
// d'autres porte son avertissement sur SA ligne, là où le geste se fait.
function renderEtatConfig () {
  const zone = $('[data-bind="cfg-etat"]')
  const f = cfg.fiche
  if (!f || !f.personne) { zone.innerHTML = ''; return }
  const nomDuBien = (id) => {
    const b = (f.biens || []).find(x => String(x.id) === String(id))
    return b ? b.nom : null
  }
  const e = etatDeLaPrestataire({ liaisons: f.liaisons || [], nomDuBien })
  if (e.etat === 'ok') {
    // « Reçoit les ménages de X (rang 1) et de Y le week-end (rang 2) »
    const liste = e.biens.map(b => t('menages.equipe.config.etat_bien', {
      bien: b.nom, jours: joursEnMots(b.forme), rang: b.rang })).join(t('menages.equipe.config.et'))
    zone.innerHTML = `<div class="men-cfg__state men-cfg__state--ok">
      ${icone('i-check')}<span><b data-i18n="menages.equipe.config.etat_ok"></b> ${esc(liste)}</span></div>`
  } else {
    const biens = e.biensEnDefaut.map(b => b.nom).join(', ')
    const texte = e.motif === 'aucun_bien'
      ? t('menages.equipe.config.etat_sans_bien')
      : t('menages.equipe.config.etat_sans_jour', { biens })
    // ⚠ L'ACTION EST DANS L'ALERTE. Dire le problème sans offrir le geste
    // laisse l'hôte chercher l'onglet : le cas réel (Lola, deux biens confiés
    // sans aucun jour) se répare en deux clics, à condition qu'on l'y mène.
    const bouton = (f.droits || {}).prestataires === 'write'
      ? `<button type="button" class="btn btn--secondary men-cfg__fix" data-cfg-fix="${esc(e.action)}">${esc(
          t(e.action === 'biens' ? 'menages.equipe.config.fix_biens' : 'menages.equipe.config.fix_jours'))}</button>`
      : ''
    zone.innerHTML = `<div class="men-cfg__state men-cfg__state--ko">
      ${icone('i-alert')}<span><b data-i18n="menages.equipe.config.etat_rien"></b> ${esc(texte)}</span>${bouton}</div>`
  }
}

function joursEnMots (forme) {
  if (!forme || forme.cle === 'tous') return t('menages.equipe.config.jours_tous')
  if (forme.cle === 'weekend') return t('menages.equipe.config.jours_weekend')
  if (forme.cle === 'semaine') return t('menages.equipe.config.jours_semaine')
  return (forme.jours || []).map(j => t('menages.jour_' + j)).join(', ')
}

function renderOngletsConfig () {
  const zone = $('[data-bind="cfg-onglets"]')
  zone.innerHTML = CFG_ONGLETS.map(o => `
    <button type="button" class="men-cfg__onglet${cfg.onglet === o ? ' is-on' : ''}" role="tab"
            aria-selected="${cfg.onglet === o}" data-cfg-onglet="${o}">
      <span data-i18n="menages.equipe.config.onglet_${o}"></span>
    </button>`).join('')
}

// ─── Le corps, par onglet ───────────────────────────────────────────────────

function renderCorpsConfig () {
  const zone = $('[data-bind="cfg-corps"]')
  if (cfg.erreur) {
    zone.innerHTML = `<p class="caption muted" style="padding: 16px">${esc(t('menages.equipe.panne'))}</p>`
    return
  }
  if (!cfg.fiche) {
    zone.innerHTML = `<p class="caption muted" style="padding: 16px">${esc(t('common.loading'))}</p>`
    return
  }
  // ⚠ UNE FICHE SANS PERSONNE NE SE PEINT PAS, ELLE SE DIT. Les trois onglets
  // lisent `personne.…` dans leurs gabarits : un `null` y lève un TypeError
  // HORS du try/catch du chargement, et la fenêtre reste figée sur
  // « Chargement… », sans message et sans fermeture (constat de la revue de
  // ac28b1f). Le serveur répond désormais complètement — cette garde est la
  // seconde ligne, pour tout ce qu'on n'a pas prévu.
  if (!cfg.fiche.personne) {
    zone.innerHTML = `<p class="caption muted" style="padding: 16px">${esc(t('menages.equipe.panne'))}</p>`
    return
  }
  zone.classList.toggle('is-occupe', cfg.occupe)
  zone.innerHTML = cfg.onglet === 'param' ? htmlOngletParam() : htmlOngletCal()
  I18n.apply(zone)
}

function htmlOngletCal () {
  const f = cfg.fiche
  const peut = (f.droits || {}).prestataires === 'write'
  const parId = new Map((f.liaisons || []).map(l => [String(l.property_id), l]))
  const confies = [], libres = []
  for (const b of (f.biens || [])) {
    const l = parId.get(String(b.id))
    if (l && l.active) confies.push({ b, l }); else libres.push({ b, l: l || null })
  }

  // ⚠ UN SEUL MENU PAR BIEN (décision de Thierry, recette du 14 octobre).
  // « D'office / Elle confirme » et le rang étaient DEUX réglages pour une
  // seule question — « qu'est-ce que je lui confie sur ce bien ? » — et leur
  // combinaison se lisait mal : rien, à l'écran, ne disait que le rang ne sert
  // qu'à celles qui confirment. Les quatre choix recouvrent exactement ce qui
  // existe en base (relevé du 14 octobre 2026 : 0 combinaison hors de ces
  // quatre sur les 15 liaisons de production).
  //
  // ⚠ ET LA CINQUIÈME OPTION N'EST PAS DÉCORATIVE : une liaison « d'office en
  // rang 2 », ou un rang 3, reste possible en base. Elle s'affiche TELLE
  // QUELLE plutôt que d'être silencieusement réécrite par le premier
  // enregistrement — un écran qui ne sait pas montrer un état ne doit pas
  // l'effacer.
  const choixDuBien = (l) => {
    if (!l || !l.active) return 'non'
    if (l.requires_ack === false) return l.rang === 1 ? 'office' : 'autre'
    if (l.rang === 1) return 'p1'
    if (l.rang === 2) return 'p2'
    return 'autre'
  }

  const ligneBien = ({ b, l }) => {
    // ⚠ UN BIEN PEUT N'AVOIR AUCUNE LIAISON : il n'a jamais été confié à cette
    // personne. Le menu existe quand même — c'est par lui qu'on le lui confie —
    // mais il n'y a ni jours, ni avertissement à lire.
    const confie = !!(l && l.active)
    const choix = choixDuBien(l)
    // ⚠ LA MEME SOURCE QUE LE CLIC (`shared/presta-etat.js`) : c'est leur
    // divergence qui avait inverse le geste sur une liaison vierge.
    const jours = joursAffiches(l)
    const cases = CFG_JOURS.map(j => {
      const on = jours.includes(j.n)
      // ⚠ PAS ENCORE RÉGLÉ ≠ TOUS LES JOURS, MAIS SEULEMENT QUAND ÇA BLOQUE.
      // `weekdays = null` vaut « tous les jours » pour le moteur. Pour un bien
      // ATTRIBUÉ D'OFFICE, c'est vrai sans réserve : elle les reçoit tous, et
      // les sept cases sont pleines. Pour un bien PROPOSÉ, la file ne retient
      // que les jours explicitement réglés — elle ne sera donc jamais
      // sollicitée, et montrer sept cases pleines au-dessus de « ses jours ne
      // sont pas réglés » ferait dire à l'écran deux choses contraires.
      // Pointillé = l'hôte n'a rien réglé ET cela BLOQUE : la liaison est
      // « proposée », donc elle ne sera jamais sollicitée tant que ses jours
      // ne sont pas explicitement choisis.
      const vierge = !!l && l.requires_ack !== false && !Array.isArray(l.weekdays)
      return `<button type="button" class="men-cfg__cell${on && !vierge ? ' is-on' : ''}${
        vierge ? ' is-vierge' : ''}" aria-pressed="${on && !vierge}" ${peut ? '' : 'disabled'}
        data-cfg-jour="${b.id}:${j.n}" aria-label="${esc(t('menages.jour_' + j.n))}"></button>`
    }).join('')
    const options = ['office', 'p1', 'p2', 'non'].map(v =>
      `<option value="${v}"${choix === v ? ' selected' : ''}>${esc(t('menages.equipe.config.choix_' + v))}</option>`)
    if (choix === 'autre' && l) {
      options.unshift(`<option value="autre" selected>${esc(t('menages.equipe.config.choix_autre', {
        mode: t(l.requires_ack === false ? 'menages.equipe.config.doffice' : 'menages.equipe.config.confirme'),
        rang: l.rang }))}</option>`)
    }
    return `<div class="men-cfg__bien${confie ? '' : ' men-cfg__bien--off'}">
      <div class="men-cfg__bienTete">
        <span class="men-cfg__bienNom">${esc(b.nom)}</span>
        <select class="men-cfg__choix" ${peut ? '' : 'disabled'} data-cfg-choix="${b.id}"
                aria-label="${esc(t('menages.equipe.config.confier', { bien: b.nom }))}">${options.join('')}</select>
      </div>
      ${confie ? `<div class="men-cfg__cells">${cases}</div>` : ''}
      ${confie ? avertissementBien(l) : ''}
    </div>`
  }

  return `
  <section class="men-cfg__sec" data-cfg-sec="biens">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.confie_titre"></h3>
    <p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.jours_aide"></p>
    <div class="men-cfg__joursTete">${CFG_JOURS.map(j => `<span>${esc(j.c)}</span>`).join('')}</div>
    ${confies.concat(libres).map(ligneBien).join('')
      || `<p class="caption muted" data-i18n="menages.equipe.config.aucun_bien"></p>`}
  </section>

  <section class="men-cfg__sec" data-cfg-sec="jours">
    <div class="men-cfg__secTete">
      <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.ici_titre"></h3>
      ${traceDispo()}
    </div>
    ${htmlSelfDispo()}
    ${htmlSemaines()}
    ${htmlCalendrier()}
    ${htmlConges()}
  </section>

  <section class="men-cfg__sec" data-cfg-sec="autres">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.autres_titre"></h3>
    ${htmlVisibiliteAutres()}
  </section>

  <section class="men-cfg__sec" data-cfg-sec="visibles">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.visibles_titre"></h3>
    ${htmlJoursVisibles()}
  </section>`
}

// Les deux avertissements du moteur, posés là où le geste se fait — et le
// texte DIFFÈRE selon l'engagement : « aucune proposition » et « AUCUN
// ménage » ne sont pas la même perte.
function avertissementBien (l) {
  const d = defautDeLaLiaison(l)
  if (!d || d === 'inactive') return ''
  const cle = d === 'aucun_jour'
    ? (l.requires_ack ? 'menages.equipe.config.av_aucun_jour' : 'menages.equipe.config.av_aucun_jour_office')
    : 'menages.equipe.config.av_a_regler'
  return `<p class="men-cfg__av" data-i18n="${cle}"></p>`
}

// ⚠ LA TRACE NE S'AFFICHE QUE SI C'EST ELLE. « Modifié par vous » n'apprend
// rien à celui qui vient de le faire ; et un SMS se rate, un e-mail se classe —
// la trace, elle, reste.
function traceDispo () {
  const regles = ((cfg.dispo || {}).regles || []).filter(r => r.active !== false)
  const sienne = regles.filter(r => r.source === 'prestataire')
    .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')))[0]
  if (!sienne || !sienne.created_at) return ''
  return `<span class="caption muted men-cfg__trace">${esc(
    t('menages.equipe.config.regle_par_elle', { quand: dateHeure(sienne.created_at) }))}</span>`
}

function htmlSelfDispo () {
  const p = cfg.fiche.personne
  const peut = (cfg.fiche.droits || {}).equipe === 'write'
  // ⚠ `null` = NON LU : la case se grise et RIEN ne sera envoyé. Un simple
  // timeout révoquait sinon définitivement un droit que personne n'avait
  // touché.
  const inconnu = p.self_availability === null
  const on = p.self_availability === 'write'
  return `<div class="men-cfg__row">
    <div class="men-cfg__rowTxt">
      <span data-i18n="menages.equipe.config.self_dispo"></span>
      <span class="caption muted" data-i18n="menages.equipe.config.self_dispo_aide"></span>
      ${inconnu ? `<span class="men-cfg__av" data-i18n="menages.equipe.config.self_dispo_illisible"></span>` : ''}
    </div>
    <button type="button" class="men-cfg__sw${on ? ' is-on' : ''}" role="switch" aria-checked="${on}"
            ${peut && !inconnu ? '' : 'disabled'} data-cfg-self></button>
  </div>`
}

// Les semaines A/B, EN LECTURE : c'est elle qui les règle depuis son
// application, et dans les données réelles l'hôte n'en a jamais posé une seule.
// Le geste reste offert (« Corriger pour elle »), il n'occupe pas la place.
function htmlSemaines () {
  const regles = ((cfg.dispo || {}).regles || []).filter(r => r.active !== false)
  if (!regles.length) {
    return `<p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.aucune_regle"></p>`
  }
  const alterne = regles.some(r => r.cadence === 'quinzaine')
  const ligne = (lettre, jours) => `<div class="men-cfg__sem">
    ${alterne ? `<span class="men-cfg__ab men-cfg__ab--${lettre.toLowerCase()}">${lettre}</span>` : ''}
