<link rel="icon" href="/shared/logo.svg" type="image/svg+xml">

<!-- PAGE « MÉNAGES » — refonte UI V5, lot 4 ÉTAPE 1 : LECTURE SEULE.
     Un calendrier 14 jours, un bloc par bien, une ligne par prestataire :
     barre = jours où elle est LA GARDE CALCULÉE (api/garde.js, même brique
     que le moteur), pastille = ménage. « Personne » = trou de garde d'un
     bien GÉRÉ seulement (décision du 3 septembre : un bien sans prestataire
     n'affiche aucune ligne, jamais de rouge). Pas de bulle « À traiter »
     (étape 2), aucune action d'écriture (étape 3).
     Spec : docs/specs/lot-menages-v5/spec-refonte-ui-v5-lot-menages.md
     (+ §13, les décisions) ; fond : docs/specs/inventaire-menages.md.
     RÈGLES : aucun hexa, aucun texte en dur, icônes du sprite, aucun appel
     provider ; X-Compte sur chaque appel ; la vérité « fait » vient du
     serveur (menage_done), jamais du localStorage de l'ancien écran. -->
</head>
<body>

<header class="topbar">
  <a class="topbar__brand" href="/pages/aujourdhui">
    <img src="/shared/logo.svg" width="34" height="34" alt="">
    <span>HôteSmart</span>
  </a>
  <nav class="topbar__nav" data-i18n-attr="aria-label:nav.menu"><!-- nav.js --></nav>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary" style="padding-inline: 14px 8px" data-menu-toggle aria-expanded="false" data-i18n-attr="aria-label:nav.menu">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-menu"/></svg>
      <span class="avatar" data-bind="initials"></span>
    </button>
    <div class="menu" data-menu hidden><!-- nav.js --></div>
  </div>
</header>

<main class="men-page">
  <div class="men-entete">
    <h1 class="h2" data-i18n="menages.title"></h1>
    <a class="btn btn--secondary btn--icon" href="/apps/menages/prestataires" data-i18n-attr="aria-label:menages.prestataires;title:menages.prestataires">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-users"/></svg>
    </a>
  </div>

  <!-- « À traiter » : le SEUL moment ambre de l'écran (spec §3.1). -->
  <section class="men-bulle" data-bind="bulle" hidden aria-labelledby="h-atraiter"></section>

  <!-- La même barre de période que le Calendrier (référence visuelle). -->
  <div class="row men-nav">
    <button type="button" class="btn btn--secondary btn--icon" data-nav="-1" data-i18n-attr="aria-label:menages.prev">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-chevron" transform="rotate(180 12 12)"/></svg>
    </button>
    <button type="button" class="btn btn--secondary" data-nav="0" data-i18n="menages.today"></button>
    <button type="button" class="btn btn--secondary btn--icon" data-nav="1" data-i18n-attr="aria-label:menages.next">
      <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#i-chevron"/></svg>
    </button>
    <div class="cal-periode men-periode" role="group" data-i18n-attr="aria-label:menages.period_len">
      <button type="button" class="tab" data-mois="1" data-i18n="menages.m1"></button>
      <button type="button" class="tab" data-mois="3" data-i18n="menages.m3"></button>
      <button type="button" class="tab" data-mois="6" data-i18n="menages.m6"></button>
      <button type="button" class="tab" data-mois="12" data-i18n="menages.m12"></button>
    </div>
  </div>

  <!-- Les biens masqués remontent AVANT les dates (recette du 13 octobre) :
       MÊME UI que le calendrier — bulles photo au téléphone, sélecteur dans
       l'angle de la bande à l'ordinateur. -->
  <div class="cal-bulles" data-bind="bulles"></div>

  <p class="card men-avis" data-bind="avis-tronque" hidden data-i18n="menages.truncated"></p>
  <div class="men-vide" data-bind="etat-vide" hidden></div>

  <!-- L'en-tête des dates vit HORS du défilement vertical (sticky) et se
       synchronise avec le défilement horizontal du calendrier (recette). -->
  <div class="men-tete" data-bind="tete" hidden>
    <div data-bind="cal-tete"></div>
  </div>
  <div class="men-scroll" data-bind="planning" hidden>
    <div data-bind="cal"></div>
  </div>

  <p class="caption muted" data-bind="etat-charge" hidden></p>

<div class="cal-toasts" data-bind="toasts" aria-live="polite"></div>

<script type="module">
import { requireAuth } from '/components/auth-guard.js'
import { getUser, signOut } from '/shared/supabase.js'
import { supabase } from '/shared/supabase.js'
import { initErrorHandler } from '/shared/error-handler.js'
import { logger } from '/shared/logger.js'
import { escapeHtml as esc } from '/shared/properties.js'
import { compteCourant, peutLire, peutEcrire, estTitulaire, comptes, basculerVers, enteteCompte }
  from '/shared/compte-courant.js'
import { toISO } from '/shared/calendar-core.js'
import { couleurDe } from '/shared/presta-couleur.js'
import { bandeJoursHtml, classesWE as classesWEDuJour } from '/shared/bande-jours.js'
import { lignesATraiter, comptesParType, TYPES } from '/shared/menages-a-traiter.js'
import { brancherReordonnancement } from '/shared/reordonner-biens.js'

initErrorHandler()
const t = (k, v) => I18n.t(k, v)
const $ = (s) => document.querySelector(s)
const icone = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="/shared/icons.svg#${id}"/></svg>`
const AUJOURDHUI = toISO(new Date())
// Le MEME selecteur que le calendrier (recette du 13 octobre) : des mois.
// L'endpoint refuse au-dela de 92 jours : au-dela, la page lit par TRANCHES.
const MOIS = [1, 3, 6, 12]
const JOURS_PAR_MOIS = { 1: 30, 3: 91, 6: 182, 12: 364 }
const TRANCHE_MAX = 92
const langue = () => (window.I18n && I18n.lang) || document.documentElement.lang || 'fr'

const etat = {
  biens: [],            // réponse /api/garde : [{id(ref provider), name, photo}]
  garde: [],            // [{propertyId, gere, jours: [{date, responsable, remplacante, trou}]}]
  menages: [],          // [{propertyId, bookingId, date, status, fait, porteur, proposeesA, expireLe, raison, retour, differe}]
  avecNoms: false, avecAvis: false, tronque: false,
  jours: [],            // les iso de la fenêtre
  mois: 1,              // 1 / 3 / 6 / 12 (persisté, comme le calendrier)
  decalage: 0,          // en jours, NON persisté (même règle que le calendrier)
  masques: [],          // refs des biens masqués (persisté PAR COMPTE)
  ordre: [],            // ordre des biens (poignée de déplacement, persisté)
  aTraiter: [],         // lignes de la bulle (fenêtre PROPRE : J−30 → J+30)
  aTraiterTronque: false,
  prestataires: [],     // annuaire pour « changer la prestataire » (vide sans le droit)
  toutVoir: false,      // « Tout voir » déplié
  typeOuvert: null      // téléphone : le type dont la liste est ouverte
}
// ⚠ Une clé PAR COMPTE : la page est délégable, et une ref provider masquée
// sur un compte ne doit pas faire disparaître le bien homonyme d'un autre
// (constat de la revue de 4235a21).
const prefsCle = () => `hs_menages_v5_prefs:${compteCourant() || 'moi'}`
function lirePrefs () {
  try {
    const p = JSON.parse(localStorage.getItem(prefsCle()) || '{}')
    if (Array.isArray(p.masques)) etat.masques = p.masques.map(String)
    if (Array.isArray(p.ordre)) etat.ordre = p.ordre.map(String)
    if (MOIS.includes(p.mois)) etat.mois = p.mois
  } catch {}
}
function ecrirePrefs () {
  try { localStorage.setItem(prefsCle(), JSON.stringify({ masques: etat.masques, ordre: etat.ordre, mois: etat.mois })) } catch {}
}

// ─── Dates (Intl, jamais de formatage à la main) ────────────────────────────
const dateCourte = iso => new Intl.DateTimeFormat(langue(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })
  .format(new Date(iso + 'T12:00:00Z'))
const dateLongue = iso => new Intl.DateTimeFormat(langue(), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
  .format(new Date(iso + 'T12:00:00Z'))
const estLarge = () => window.matchMedia('(min-width: 900px)').matches
// La règle des week-ends vient du MODULE, comme la bande : une seule
// implémentation pour les deux plannings (revue de 742fa7f).
const classesWE = iso => classesWEDuJour(new Date(iso + 'T12:00:00').getDay())
const photoBien = b => b.photo ? `<img src="${esc(b.photo)}" alt="" loading="lazy">` : icone('i-home')

function fenetre () {
  const base = new Date(AUJOURDHUI + 'T12:00:00Z')
  base.setUTCDate(base.getUTCDate() + etat.decalage)
  const jours = []
  for (let i = 0; i < JOURS_PAR_MOIS[etat.mois]; i++) {
    const d = new Date(base); d.setUTCDate(d.getUTCDate() + i)
    jours.push(d.toISOString().slice(0, 10))
  }
  return jours
}


// ─── Chargement ─────────────────────────────────────────────────────────────
async function appel (chemin) {
  const { data: { session } } = await supabase.auth.getSession()
  const r = await fetch(chemin, {
    headers: { Authorization: 'Bearer ' + session.access_token, ...enteteCompte() }
  })
  const corps = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(corps.message || corps.error || `HTTP ${r.status}`); e.status = r.status; throw e }
  return corps
}
// ⚠ LA BULLE A SA PROPRE FENÊTRE (spec §3.1) : aujourd'hui → J+30, et
// J−30 → hier pour « non terminé » et « mauvais retour ». Elle ne suit donc
// PAS la période choisie — un hôte en vue 12 mois doit voir les mêmes
// alertes qu'en vue 1 mois. 61 jours : une seule requête, sous le plafond.
async function poster (chemin, corps) {
  const { data: { session } } = await supabase.auth.getSession()
  const r = await fetch(chemin, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json', ...enteteCompte() },
    body: JSON.stringify(corps)
  })
  const c = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(c.message || c.error || `HTTP ${r.status}`); e.status = r.status; throw e }
  return c
}

// Un mot à l'écran après un geste, avec son « Annuler » quand le geste se
// défait vraiment (⚠ jamais un « Annuler » qui ne rejoue pas l'inverse réel).
function toast (texte, { annuler = null } = {}) {
  const zone = $('[data-bind="toasts"]')
  const el = document.createElement('div')
  el.className = 'cal-toast'
  el.innerHTML = `<span>${esc(texte)}</span>` +
    (annuler ? `<button type="button" class="link" data-annuler>${esc(t('menages.annuler'))}</button>` : '')
  zone.appendChild(el)
  if (annuler) el.querySelector('[data-annuler]').addEventListener('click', () => { el.remove(); annuler() })
  setTimeout(() => el.remove(), 6000)
}

let jetonBulle = 0
async function chargerATraiter () {
  const jeton = ++jetonBulle
  const d = new Date(AUJOURDHUI + 'T12:00:00Z')
  d.setUTCDate(d.getUTCDate() - 30)
  const du = d.toISOString().slice(0, 10)
  d.setUTCDate(d.getUTCDate() + 60)
  const au = d.toISOString().slice(0, 10)
  try {
    const r = await appel(`/api/garde?du=${du}&au=${au}`)
    if (jeton !== jetonBulle) return
    etat.aTraiter = lignesATraiter({
      biens: r.biens || [], garde: r.garde || [], menages: r.menages || [],
      avecAvis: !!r.avec_avis, aujourdhui: AUJOURDHUI
    })
    // ⚠ LA BULLE A SA PROPRE TRONCATURE : sa fenêtre n'est pas celle du
    // planning, donc le bandeau de `charger()` ne la couvre pas. Taire
    // celle-ci ferait d'un compte incomplet un compte qui paraît complet.
    etat.aTraiterTronque = !!r.tronque
    etat.prestataires = r.prestataires || []
  } catch (e) {
    if (jeton !== jetonBulle) return
    // ⚠ UNE BULLE QUI N'A PAS PU LIRE NE DIT PAS « RIEN À TRAITER » : elle se
    // tait et le dit. Annoncer le calme sur une panne est le pire des deux.
    logger.error('Menages', 'à traiter', e)
    etat.aTraiter = null
  }
  renderBulle()
  majBadge()
}

let jetonLecture = 0
async function charger () {
  const jeton = ++jetonLecture
  const chargeEl = $('[data-bind="etat-charge"]')
  chargeEl.hidden = false
  chargeEl.textContent = t('common.loading')
  const jours = fenetre()
  try {
    // L'endpoint refuse une fenetre > 92 jours (troncature silencieuse
    // interdite) : 6 et 12 mois se lisent par TRANCHES consecutives, fusionnees
    // ici — les biens viennent de la premiere, le reste se concatene.
    const tranches = []
    for (let i = 0; i < jours.length; i += TRANCHE_MAX) {
      const bloc = jours.slice(i, i + TRANCHE_MAX)
      tranches.push([bloc[0], bloc[bloc.length - 1]])
    }
    const reponses = await Promise.all(tranches.map(([du, au]) => appel(`/api/garde?du=${du}&au=${au}`)))
    if (jeton !== jetonLecture) return   // réponse en retard : on ne repeint pas
    const d0 = reponses[0]
    const gardeParBien = new Map()
    for (const r of reponses) {
      for (const g of (r.garde || [])) {
        const cle = String(g.propertyId)
        if (!gardeParBien.has(cle)) gardeParBien.set(cle, { propertyId: cle, gere: g.gere, jours: [] })
        gardeParBien.get(cle).jours.push(...(g.jours || []))
      }
    }
    etat.jours = jours
    etat.biens = d0.biens || []
    etat.garde = [...gardeParBien.values()]
    etat.menages = reponses.flatMap(r => r.menages || [])
    etat.avecNoms = !!d0.avec_noms
    etat.avecAvis = !!d0.avec_avis
    etat.tronque = reponses.some(r => !!r.tronque)
    chargeEl.hidden = true
    renderTout()
  } catch (e) {
    if (jeton !== jetonLecture) return
    logger.error('Menages', 'chargement', e)
    chargeEl.hidden = true
    const vide = $('[data-bind="etat-vide"]')
    vide.hidden = false
    vide.innerHTML = `<p class="muted">${esc(e.status === 403 ? t('menages.no_access') : t('menages.load_error'))}</p>`
    $('[data-bind="planning"]').hidden = true
    // L'en-tete collant suit le corps : des dates perimees au-dessus d'une
    // erreur diraient une fenetre qu'on n'affiche pas (revue de bad5d25).
    $('[data-bind="tete"]').hidden = true
  }
}

// ─── L'état d'un ménage → sa pastille. TROIS états, lisibles sans légende
// (décision de Thierry, 13 octobre) : à faire (pris OU à venir), fait,
// personne pour le faire (proposition sans preneur, orphelin, non assigné).
function etatPastille (m) {
  if (m.fait) return 'fait'
  if (m.porteur) return 'afaire'
  // ⚠ UN REFUS N'EST PAS UN REPORT. Le serveur rend `differe: true` pour un
  // ménage `orphaned` (offres effacées, verrou `manual`, jamais repris par
  // le moteur) : le peindre « à faire » cachait le refus jusqu'à J−7. La
  // bulle et le planning disent la même chose (revue de c197a10).
  if (m.differe && m.status !== 'orphaned') return 'afaire'
  return 'alerte'
}
const CLASSE_MK = { fait: 'men-mk--fait', afaire: '', alerte: 'men-mk--alerte' }
const ICONE_MK = { fait: 'i-check', afaire: 'i-cleaning', alerte: 'i-alert' }
// Gravité d'affichage quand plusieurs ménages partagent une case : l'alarme
// passe devant le travail, le travail devant le terminé.
const GRAVITE = { alerte: 2, afaire: 1, fait: 0 }

function nomOu (p, defaut) {
  if (!p) return t(defaut)
  return p.prenom || t('menages.quelquun')
}
// Infobulle : état · prénom · date (décision du 13 octobre).
// ⚠ L'ÉTAT DIT DOIT S'ACCORDER AU PRÉNOM DIT. Les trois pastilles fusionnent
// « proposé, en attente » et « personne » dans le même rouge ; l'infobulle,
// elle, les distingue — sinon elle annonçait « Personne pour le faire ·
// Marie », deux affirmations contradictoires (revue de 742fa7f).
function infobulle (m) {
  const qui = m.porteur || (m.proposeesA || [])[0] || null
  const e = etatPastille(m)
  const cle = (e === 'alerte' && (m.proposeesA || []).length) ? 'menages.tt_propose' : 'menages.tt_' + e
  // Un retour de propreté ne vit pas QUE dans la couleur du badge
  // (theme.css : « jamais la couleur seule »).
  const retour = m.retour
    ? ' · ' + t(m.retour.verdict === 'remarque' ? 'menages.retour_mauvais' : 'menages.retour_bon') : ''
  return `${t(cle)} · ${nomOu(qui, 'menages.sans_presta')} · ${dateLongue(m.date)}${retour}`
}

// ─── Construction des lignes d'un bien ──────────────────────────────────────
// Une ligne par prestataire : (a) responsable d'au moins un jour de la
// fenêtre ; (b) porteuse ou proposée d'un ménage de la fenêtre (ligne
// TEMPORAIRE, sans barre — décision §13 « remplaçante »). Sans
// `prestataires:read` : UNE ligne neutre par bien.
const CLE_COUVERTURE = '__couverture'
const CLE_SANS = '__sans'
function lignesDuBien (bien, g, menagesDuBien) {
  const lanes = new Map()
  const lane = (cle) => {
    if (!lanes.has(cle)) {
      lanes.set(cle, { cle, prenom: null, actif: null, aRegler: false, jours: new Set(), menages: new Map() })
    }
    return lanes.get(cle)
  }
  const cleDe = p => (p && etat.avecNoms && p.id) ? String(p.id) : CLE_COUVERTURE
  const responsableDu = {}
  for (const j of (g ? g.jours : [])) {
    responsableDu[j.date] = j.responsable || null
    if (!j.responsable) continue
    const l = lane(cleDe(j.responsable))
    l.jours.add(j.date)
    if (j.responsable.prenom) l.prenom = j.responsable.prenom
    if (j.responsable.actif === false) l.actif = false
    if (j.responsable.a_regler) l.aRegler = true
  }
  // Une ABSENCE est une case VIDE (décision du 13 octobre : moins de bruit) —
  // la barre s'arrête d'elle-même, puisque la garde ne la désigne pas.
  for (const m of menagesDuBien) {
    const e = etatPastille(m)
    let cle
    if (m.porteur) cle = cleDe(m.porteur)
    else if ((m.proposeesA || []).length) cle = cleDe(m.proposeesA[0])
    else if (m.differe) cle = cleDe(responsableDu[m.date])
    else cle = CLE_SANS
    const l = lane(cle)
    const p = m.porteur || (m.proposeesA || [])[0]
    if (p && p.prenom && !l.prenom) l.prenom = p.prenom
    if (!l.menages.has(m.date)) l.menages.set(m.date, [])
    l.menages.get(m.date).push(m)
  }
  // « Sans prestataire » toujours en dernier ; les autres par premier jour de barre.
  return [...lanes.values()].sort((a, b) => {
    if (a.cle === CLE_SANS) return 1
    if (b.cle === CLE_SANS) return -1
    const ja = [...a.jours].sort()[0] || '9999', jb = [...b.jours].sort()[0] || '9999'
    return ja < jb ? -1 : ja > jb ? 1 : 0
  })
}

// Fond des colonnes, peint en PREMIER dans chaque ligne : une cellule par
// jour (filet, teinte week-end, rails d'aujourd'hui) — la même grammaire que
// la ligne Réservations du calendrier (cal-resas__jour).
// ⚠ UN CONTENEUR DÉDIÉ, comme `cal-resas__fond` du calendrier : dans la
// piste elle-même, les cellules sont suivies des barres et des pastilles,
// donc `:last-child` ne désignait jamais le dernier jour et le filet de
// droite doublait la bordure du cadre (revue de 742fa7f).
//
// ⚠ LE FOND PORTE AUSSI LES JOURS SANS PERSONNE (recette du 13 octobre) :
// plus de ligne « Personne » dédiée — la COLONNE du bien passe en rouge
// hachuré, et un « ! » la nomme sur la première ligne du bloc.
const fondsCache = new Map()
function fondsJours (trous, marque) {
  const cle = `${marque ? 'M' : '-'}|${[...(trous || [])].sort().join(',')}`
  if (!fondsCache.has(cle)) {
    fondsCache.set(cle, `<span class="men-fond">` + etat.jours.map(iso => {
      const trou = !!(trous && trous.has(iso))
      const bang = trou && marque ? `<span class="men-jj__bang" aria-hidden="true">!</span>` : ''
      const titre = trou ? ` title="${esc(t('menages.personne_jour') + ' — ' + dateLongue(iso))}"` : ''
      return `<span class="men-jj${classesWE(iso)}${iso === AUJOURDHUI ? ' cal-auj' : ''}${trou ? ' men-jj--trou' : ''}"${titre}>${bang}</span>`
    }).join('') + `</span>`)
  }
  return fondsCache.get(cle)
}

// Les suites de jours consécutifs d'un ensemble, en indices de la fenêtre.
function suites (joursSet) {
  const idx = etat.jours.map((iso, i) => joursSet.has(iso) ? i : -1).filter(i => i >= 0)
  const runs = []
  for (const i of idx) {
    const r = runs[runs.length - 1]
    if (r && i === r.fin + 1) r.fin = i
    else runs.push({ debut: i, fin: i })
  }
  return runs
}

// ─── Rendu ──────────────────────────────────────────────────────────────────
function renderTout () {
  const cal = $('[data-bind="cal"]')
  const calTete = $('[data-bind="cal-tete"]')
  const tete = $('[data-bind="tete"]')
  const planning = $('[data-bind="planning"]')
  const vide = $('[data-bind="etat-vide"]')
  $('[data-bind="avis-tronque"]').hidden = !etat.tronque
  document.querySelectorAll('[data-mois]').forEach(b =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.mois) === etat.mois)))
  fondsCache.clear()

  // L'ordre des biens suit la poignée (persisté, biens masqués compris).
  const rang = new Map(ordreComplet().map((id, i) => [id, i]))
  const visibles = etat.biens
    .filter(b => !etat.masques.includes(String(b.id)))
    .sort((a, b) => rang.get(String(a.id)) - rang.get(String(b.id)))
  if (!etat.biens.length) {
    planning.hidden = true
    tete.hidden = true
    vide.hidden = false
    vide.innerHTML = `<p class="muted">${esc(t('menages.empty'))}</p>`
    renderBulles()
    return
  }
  vide.hidden = true
  planning.hidden = false
  tete.hidden = false

  // LA bande du calendrier (composant partagé shared/bande-jours.js) ; son
  // angle porte le sélecteur des biens masqués, comme au Calendrier.
  const bande = bandeJoursHtml({ jours: etat.jours, langue: langue(), aujourdhui: AUJOURDHUI, esc })
  calTete.innerHTML = `<div class="cal-bande">
    <div class="cal-bande__angle">${angleHtml()}</div>
    <div class="cal-bande__corps"><div class="cal-bande__l">${bande.mois}</div><div class="cal-bande__l">${bande.jours}</div></div>
  </div>`
  brancherAngle(calTete)

  const parBienGarde = new Map(etat.garde.map(g => [String(g.propertyId), g]))
  const joursSet = new Set(etat.jours)
  const menagesParBien = new Map()
  for (const m of etat.menages) {
    const cle = String(m.propertyId)
    if (!menagesParBien.has(cle)) menagesParBien.set(cle, [])
    menagesParBien.get(cle).push(m)
  }

  // Un BLOC BORDÉ par bien, comme le calendrier : titre hors cadre (poignée,
  // photo ronde, nom, ×), lignes dans le cadre.
  const blocs = visibles.map(bien => {
    const g = parBienGarde.get(String(bien.id))
    const gere = !!(g && g.gere)
    const menagesDuBien = (menagesParBien.get(String(bien.id)) || []).filter(m => joursSet.has(m.date))
    const enteteBien = `<div class="cal-bien__bandeau"><div class="cal-bien__bandeau-int">
      <span class="cal-poigne" data-poigne title="${esc(t('cal.drag_hint'))}" aria-label="${esc(t('cal.drag_hint'))}">${icone('i-menu')}</span>
      <span class="cal-photo cal-bien__photo">${photoBien(bien)}</span>
      <b class="cal-bien__nom">${esc(bien.name || '')}</b>
      <button type="button" class="cal-bien__reduire" data-reduire="${esc(bien.id)}"
        title="${esc(t('cal.reduce'))}" aria-label="${esc(t('cal.reduce'))}">${icone('i-close')}</button>
    </div></div>`
    // Un bien non confié : aucune ligne, jamais de rouge (décision du 3 sept.).
    // Un bien non confié n'a PAS de jours « sans personne » : il n'a confié
    // aucun ménage (décision du 3 septembre, pas de rouge permanent).
    const trous = gere ? trousDuBien(g) : new Set()
    const corps = !gere
      ? (menagesDuBien.length ? renderLignes(bien, g, menagesDuBien, trous)
         : `<p class="men-nonconfie caption muted" data-i18n="menages.non_confie"></p>`)
      : renderLignes(bien, g, menagesDuBien, trous)
    return `<section class="men-bloc" data-bien-section="${esc(bien.id)}">
      ${enteteBien}<div class="men-cadre">${corps}</div>
    </section>`
  }).join('')

  cal.innerHTML = blocs
  I18n.apply(cal)
  cal.querySelectorAll('[data-reduire]').forEach(b => b.addEventListener('click', () => {
    etat.masques = [...new Set([...etat.masques, String(b.dataset.reduire)])]
    ecrirePrefs(); renderTout()
  }))
  brancherPoignees(cal)
  renderBulles()
}

// Réordonner les blocs : LE module partagé (shared/reordonner-biens.js) —
// souris ET doigt, insertion correcte, poignée seule, payload filtré. La
// page avait réécrit ce geste et en avait repayé les quatre défauts.
function brancherPoignees (zone) {
  brancherReordonnancement(zone, {
    // ⚠ L'ORDRE COMPLET, biens masqués compris : reconstruire depuis les
    // seules sections visibles faisait revenir en DERNIER un bien masqué
    // puis ré-affiché, dont la place avait été réglée à la main.
    ordre: () => ordreComplet(),
    onOrdre: (liste) => { etat.ordre = liste; ecrirePrefs(); renderTout() }
  })
}
// L'ordre de référence : ce que les préférences disent, complété par les
// biens que le serveur a rendus et que les préférences ne connaissent pas.
function ordreComplet () {
  const connus = etat.ordre.filter(id => etat.biens.some(b => String(b.id) === id))
  const neufs = etat.biens.map(b => String(b.id)).filter(id => !connus.includes(id))
  return [...connus, ...neufs]
}


function renderLignes (bien, g, menagesDuBien, trous) {
  const lanes = lignesDuBien(bien, g, menagesDuBien)
  const nb = etat.jours.length
  return lanes.map((l, rang) => {
    const sans = l.cle === CLE_SANS
    const anonyme = l.cle === CLE_COUVERTURE
    const coul = sans || anonyme ? 'var(--surface-2)' : couleurDe(l.cle)
    const nom = sans ? t('menages.sans_presta') : (l.prenom || t('menages.quelquun'))
    const regler = l.aRegler
      ? `<span class="men-regler" data-i18n-attr="title:menages.a_regler">${icone('i-settings')}</span>` : ''
    const off = l.actif === false
    // Une désactivée = prénom grisé, LIGNE VIDE (décision du 13 octobre).
    const barres = (sans || off) ? '' : suites(l.jours).map(r =>
      `<span class="men-barre" style="grid-column: ${r.debut + 1} / ${r.fin + 2}; --coul: ${coul}"></span>`).join('')
    const pastilles = [...l.menages.entries()].map(([iso, ms]) => {
      const i = etat.jours.indexOf(iso)
      if (i < 0) return ''
      // ⚠ LE PLUS GRAVE L'EMPORTE sur une pastille agrégée (revue de 4235a21 :
      // un « non pris » rouge se cachait derrière un « fait » vert chiffré —
      // surtout sans prestataires:read, où TOUT le bien tient sur une ligne).
      // Même règle que l'ancien Planning de garde (GRAVITE, A.2).
      const m = ms.reduce((pire, x) => GRAVITE[etatPastille(x)] > GRAVITE[etatPastille(pire)] ? x : pire, ms[0])
      const e = etatPastille(m)
      const retour = (e === 'fait' && m.retour)
        ? `<span class="men-mk__retour${m.retour.verdict === 'remarque' ? ' men-mk__retour--mauvais' : ''}" title="${esc(t(m.retour.verdict === 'remarque' ? 'menages.retour_mauvais' : 'menages.retour_bon'))}">${icone(m.retour.verdict === 'remarque' ? 'i-thumb-down' : 'i-thumb-up')}</span>` : ''
      const n = ms.length > 1 ? `<span class="men-mk__n">${ms.length}</span>` : ''
      const titres = ms.map(infobulle).join('\n—\n')
      return `<span class="men-case" style="grid-column: ${i + 1}" title="${esc(titres)}">
        <span class="men-mk ${CLASSE_MK[e]}">${icone(ICONE_MK[e])}${retour}${n}</span>
      </span>`
    }).join('')
    return `<div class="men-ligne">
      <div class="cal-bien__coin"><span class="men-qui${sans || off ? ' men-qui--off' : ''}"><span class="men-prenom">${esc(nom)}</span>${regler}</span></div>
      <span class="men-lane" style="--n: ${nb}">${fondsJours(trous, rang === 0)}${barres}${pastilles}</span>
    </div>`
  }).join('')
}

// Les jours où AUCUNE prestataire n'est disponible pour le bien. Ils ne
// font plus une LIGNE à eux (recette du 13 octobre) : c'est la COLONNE du
// bien qui passe en rouge hachuré, avec un « ! » — une ligne nommée
// « Personne » laissait croire à une personne de plus dans l'équipe.
function trousDuBien (g) {
  const dans = new Set(etat.jours)
  return new Set((g ? g.jours : []).filter(j => j.trou && dans.has(j.date)).map(j => j.date))
}

// ─── Les gestes de la bulle (étape 3, demandés en recette) ─────────────────
// ⚠ ILS ÉCRIVENT SUR LE SERVEUR, pas dans le navigateur. « Fait » marqué ici
// est le même fait que celui de la PWA : même table, même writer (écart D1).
async function validerMenage (l) {
  try {
    await poster('/api/menages', { action: 'fait', property_id: l.bienId,
                                   booking_id: l.bookingId, departure_date: l.date })
    toast(t('menages.fait_ok', { bien: l.bienNom }), {
      annuler: async () => {
        try {
          await poster('/api/menages', { action: 'defaire', property_id: l.bienId,
                                         booking_id: l.bookingId, departure_date: l.date })
          await rafraichir()
        } catch (e) { toast(e.message || t('menages.geste_echec')) }
      }
    })
    await rafraichir()
  } catch (e) { toast(e.message || t('menages.geste_echec')) }
}

// Changer la prestataire : la liste des actives, puis « Assigner » (transfert
// immédiat) ou « Proposer » (elle confirme) — les deux gestes que le serveur
// distingue déjà (spec §11.6).
function ouvrirChangement (l, ancre) {
  document.querySelectorAll('.men-choix').forEach(x => x.remove())
  const choix = document.createElement('div')
  choix.className = 'men-choix'
  choix.innerHTML = `<p class="caption muted" style="margin: 0 0 6px">${esc(t('menages.changer_qui'))}</p>` +
    etat.prestataires.map(p => `<button type="button" data-presta="${esc(p.id)}">${esc(p.prenom || '')}</button>`).join('') +
    (etat.prestataires.length ? '' : `<p class="caption muted" style="margin: 0">${esc(t('menages.changer_vide'))}</p>`)
  ancre.appendChild(choix)
  const fermer = () => choix.remove()
  setTimeout(() => document.addEventListener('click', fermer, { once: true }), 0)
  choix.addEventListener('click', e => e.stopPropagation())
  choix.querySelectorAll('[data-presta]').forEach(b => b.addEventListener('click', async () => {
    fermer()
    try {
      const r = await poster('/api/menages', { property_id: l.bienId, booking_id: l.bookingId,
                                               departure_date: l.date, provider_id: b.dataset.presta,
                                               mode: 'assigner' })
      toast(t('menages.change_ok', { prenom: r.prenom || b.textContent }))
      await rafraichir()
    } catch (e) { toast(e.message || t('menages.geste_echec')) }
  }))
}

// Après un geste : la bulle ET le planning, puisque les deux lisent le cœur.
async function rafraichir () {
  await Promise.all([chargerATraiter(), charger()])
}

// ─── La bulle « À traiter » ─────────────────────────────────────────────────
const ICONE_TYPE = {
  sans_personnel: 'i-shield-off', non_assigne: 'i-circle-dashed',
  non_pris: 'i-alert', non_termine: 'i-scheduled', mauvais_retour: 'i-thumb-down'
}
const MAX_LIGNES = 8

// Le badge ambre de l'onglet Ménages = le nombre de lignes de la bulle.
function majBadge () {
  // ⚠ SUR UNE PANNE, ON NE TOUCHE PAS AU BADGE. Le remettre à zéro ferait
  // dire à la navigation « rien à traiter » pendant que la bulle dit
  // « non lisible » — le calme annoncé sur une panne, encore (revue de
  // c197a10). Sans lecture, le badge garde ce qu'il montrait.
  if (!Array.isArray(etat.aTraiter)) return
  HSNav.render({ peutLire, badges: { menagesATraiter: etat.aTraiter.length } })
}

// ⚠ LE PROBLÈME EN TOUTES LETTRES, EN PREMIER (recette du 13 octobre).
// La ligne disait « Ofuro Futari · dim. 13 sept. » : l'hôte lisait un bien et
// une date, et devait deviner à l'icône POURQUOI elle était là. Le titre dit
// désormais ce qui ne va pas ; le bien, la date et le prénom suivent.
function ligneHtml (l) {
  const photo = l.photo ? `<img src="${esc(l.photo)}" alt="" loading="lazy">` : icone('i-home')
  const quand = l.type === 'sans_personnel'
    ? t('menages.n_jours', { n: l.nbJours })
    : dateCourte(l.date)
  const qui = l.qui && l.qui.prenom ? ` · ${esc(l.qui.prenom)}` : ''
  return `<div class="men-atr">
    <span class="men-atr__type men-atr__type--${esc(l.type)}" aria-hidden="true">${icone(ICONE_TYPE[l.type])}</span>
    <span class="cal-photo men-atr__photo">${photo}</span>
    <span class="men-atr__texte">
      <b>${esc(t('menages.type_' + l.type))}</b>
      <span class="caption muted">${esc(l.bienNom)} · ${esc(quand)}${qui}</span>
    </span>
    ${boutonsLigne(l)}
  </div>`
}

// ⚠ CHAQUE BOUTON SUIT SON DROIT, et un bouton non autorisé est ABSENT du DOM
// (décision G12) : griser promet un geste qu'on refusera.
function boutonsLigne (l) {
  const b = []
  if (l.type === 'non_termine' && peutEcrire('menages')) {
    b.push(`<button type="button" class="btn btn--secondary men-atr__btn" data-valider>${esc(t('menages.valider'))}</button>`)
  }
  // Changer la prestataire : partout où quelqu'un doit faire le ménage.
  if (['non_termine', 'non_assigne', 'non_pris'].includes(l.type) &&
      peutEcrire('prestataires') && etat.prestataires.length) {
    b.push(`<button type="button" class="btn btn--secondary men-atr__btn" data-changer>${esc(t('menages.changer'))}</button>`)
  }
  return b.length ? `<span class="men-atr__actions">${b.join('')}</span>` : ''
}

function renderBulle () {
  const zone = $('[data-bind="bulle"]')
  zone.hidden = false
  // Panne de lecture : on le DIT, on n'annonce pas le calme.
  if (etat.aTraiter === null) {
    zone.className = 'men-bulle men-bulle--muette'
    zone.innerHTML = `<p class="caption muted" id="h-atraiter" style="margin: 0">${esc(t('menages.atraiter_panne'))}</p>`
    return
  }
  const lignes = etat.aTraiter
  // Rien à traiter : une ligne blanche avec une coche verte, SANS ambre.
  if (!lignes.length) {
    zone.className = 'men-bulle men-bulle--calme'
    zone.innerHTML = `<span class="men-atr__type men-atr__type--ok">${icone('i-check')}</span>
      <span id="h-atraiter" data-i18n="menages.atraiter_rien"></span>`
    I18n.apply(zone)
    return
  }
  zone.className = 'men-bulle'
  const comptes = comptesParType(lignes)
  // ⚠ TÉLÉPHONE : LES COMPTEURS SEULS (spec §4), un appui ouvre la liste du
  // type — huit lignes avant le calendrier le repousseraient hors de l'écran.
  // Ordinateur : la liste, 8 lignes puis « Tout voir ».
  const parType = etat.typeOuvert ? lignes.filter(l => l.type === etat.typeOuvert) : null
  const visibles = parType || (estLarge() ? (etat.toutVoir ? lignes : lignes.slice(0, MAX_LIGNES)) : [])
  const reste = parType ? 0 : lignes.length - visibles.length
  const filtrees = visibles
  const compteurs = TYPES.filter(ty => comptes[ty]).map(ty =>
    `<button type="button" class="men-cpt${etat.typeOuvert === ty ? ' men-cpt--ouvert' : ''}" data-type="${esc(ty)}"
       aria-pressed="${etat.typeOuvert === ty}" title="${esc(t('menages.type_' + ty))}" aria-label="${esc(t('menages.type_' + ty))}">
      <span class="men-atr__type men-atr__type--${esc(ty)}">${icone(ICONE_TYPE[ty])}</span><b>${comptes[ty]}</b>
    </button>`).join('')
  zone.innerHTML = `
    <div class="men-bulle__tete">
      <h2 class="h2" id="h-atraiter" data-i18n="menages.atraiter"></h2>
      <span class="badge badge--amber">${lignes.length}</span>
      <span class="caption muted" style="margin-inline-start: auto" data-i18n="menages.atraiter_fenetre"></span>
    </div>
    ${etat.aTraiterTronque ? `<p class="caption" style="margin: 0; color: var(--warn)" data-i18n="menages.atraiter_tronque"></p>` : ''}
    <div class="men-cpts">${compteurs}</div>
    <div class="men-atrs">${filtrees.map(ligneHtml).join('')}</div>
    ${reste > 0 && estLarge() ? `<button type="button" class="link small" data-tout-voir>${esc(t('menages.tout_voir', { n: reste }))}</button>` : ''}`
  I18n.apply(zone)
  const tv = zone.querySelector('[data-tout-voir]')
  if (tv) tv.addEventListener('click', () => { etat.toutVoir = true; renderBulle() })
  zone.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
    etat.typeOuvert = etat.typeOuvert === b.dataset.type ? null : b.dataset.type
    renderBulle()
  }))
  // Les gestes : la ligne connaît SA donnée par son rang dans la liste rendue.
  zone.querySelectorAll('.men-atr').forEach((el, i) => {
    const l = filtrees[i]
    if (!l) return
    const v = el.querySelector('[data-valider]')
    if (v) v.addEventListener('click', () => validerMenage(l))
    const c = el.querySelector('[data-changer]')
    if (c) c.addEventListener('click', (e) => { e.stopPropagation(); ouvrirChangement(l, el) })
  })
}

// MÊME UI QUE LE CALENDRIER. Ordinateur : le sélecteur vit dans l'angle de la
// bande (puce aux miniatures empilées + menu « Afficher » / « Tout
// afficher ») ; téléphone : des bulles photo au-dessus des dates.
function lesMasques () {
  return etat.biens.filter(b => etat.masques.includes(String(b.id)))
}
function angleHtml () {
  if (!estLarge()) return ''
  const masques = lesMasques()
  if (!masques.length) return `<span class="caption muted">${esc(t('cal.all_shown'))}</span>`
  const minis = masques.slice(0, 4).map(b => `<span class="cal-photo cal-angle__mini">${photoBien(b)}</span>`).join('')
  return `<details class="cal-angle__menu">
    <summary class="cal-angle__puce" title="${esc(t('cal.hidden_props'))}">
      <span class="cal-angle__pile">${minis}</span>
      <b>${masques.length}</b>
      <span class="caption">${esc(t('cal.hidden_props'))}</span>
    </summary>
    <div class="cal-angle__liste">
      ${masques.map(b => `<button type="button" data-afficher="${esc(b.id)}">
        <span class="cal-photo cal-angle__mini">${photoBien(b)}</span>
        <span class="cal-angle__nom">${esc(b.name || '')}</span>
        <span class="link small">${esc(t('cal.show_one'))}</span>
      </button>`).join('')}
      <button type="button" class="cal-angle__tout" data-tout-afficher>${esc(t('cal.show_all'))}</button>
    </div>
  </details>`
}
function brancherAngle (zone) {
  const afficher = ids => {
    etat.masques = etat.masques.filter(x => !ids.includes(x))
    ecrirePrefs(); renderTout()
  }
  zone.querySelectorAll('[data-afficher]').forEach(b => b.addEventListener('click', () => afficher([String(b.dataset.afficher)])))
  const tout = zone.querySelector('[data-tout-afficher]')
  if (tout) tout.addEventListener('click', () => afficher(etat.masques.slice()))
  const det = zone.querySelector('.cal-angle__menu')
  if (det) {
    det.addEventListener('toggle', () => {
      if (!det.open) return
      const r = det.querySelector('summary').getBoundingClientRect()
      const liste = det.querySelector('.cal-angle__liste')
      liste.style.top = (r.bottom + 4) + 'px'
      liste.style.insetInlineStart = Math.max(8, r.left) + 'px'
    })
    // ⚠ UNE SEULE FOIS : `[data-bind="planning"]` SURVIT aux rendus, et
    // brancherAngle est rappelé à chaque renderTout — un écouteur par rendu
    // s'empilait, chacun retenant un <details> détaché (revue de 742fa7f).
    const planning = $('[data-bind="planning"]')
    if (!planning.dataset.fermeAngle) {
      planning.dataset.fermeAngle = '1'
      planning.addEventListener('scroll', () => {
        const ouvert = $('[data-bind="tete"]').querySelector('.cal-angle__menu[open]')
        if (ouvert) ouvert.open = false
      }, { passive: true })
    }
  }
}
function renderBulles () {
  const zone = $('[data-bind="bulles"]')
  if (estLarge()) { zone.innerHTML = ''; return }
  zone.innerHTML = lesMasques().map(b =>
    `<button type="button" class="cal-bulle" data-afficher="${esc(b.id)}" title="${esc(t('cal.bubble_show', { nom: b.name || '' }))}">
      <span class="cal-photo cal-bulle__photo">${photoBien(b)}</span>
      <span class="cal-bulle__nom">${esc(b.name)}</span>
    </button>`).join('')
  zone.querySelectorAll('[data-afficher]').forEach(b => b.addEventListener('click', () => {
    etat.masques = etat.masques.filter(x => x !== String(b.dataset.afficher))
    ecrirePrefs(); renderTout()
  }))
}

// ─── Démarrage ──────────────────────────────────────────────────────────────
async function init () {
  const session = await requireAuth()
  if (!session) return
  await I18n.init()
  document.addEventListener('i18n:changed', () => location.reload())
  const user = await getUser()
  $('[data-bind="initials"]').textContent = (user?.email || '').slice(0, 2).toUpperCase()
  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
    outils: [
      peutLire('reservations') && { href: '/apps/yield', key: 'nav.tool_yield', icon: 'i-price' },
      estTitulaire() && { href: '/apps/serrures', key: 'nav.tool_locks', icon: 'i-key' },
      estTitulaire() && { href: '/apps/sms', key: 'nav.tool_sms', icon: 'i-send' },
      estTitulaire() && { href: '/apps/reservation-directe', key: 'nav.tool_direct', icon: 'i-calendar' },
      estTitulaire() && { href: '/connexions', key: 'nav.tool_connections', icon: 'i-link' },
      estTitulaire() && { href: '/abonnement', key: 'nav.tool_billing', icon: 'i-euro' }
    ].filter(Boolean)
  })
  majBadge()
  if (!peutLire('menages')) {
    $('[data-bind="etat-vide"]').hidden = false
    $('[data-bind="etat-vide"]').innerHTML = `<p class="muted">${esc(t('menages.no_access'))}</p>`
    return
  }
  lirePrefs()
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    const sens = Number(b.dataset.nav)
    etat.decalage = sens === 0 ? 0 : etat.decalage + sens * JOURS_PAR_MOIS[etat.mois]
    charger()
  }))
  document.querySelectorAll('[data-mois]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.mois)
    if (!MOIS.includes(n) || n === etat.mois) return
    etat.mois = n
    ecrirePrefs(); charger()
  }))
  // Bascule angle <-> bulles au passage du seuil 900 px (même UI que le
  // calendrier : angle à l'ordinateur, bulles au téléphone).
  let large = estLarge()
  window.addEventListener('resize', () => {
    if (estLarge() !== large) {
      large = estLarge()
      // Le filtre par type est un geste du TÉLÉPHONE : le garder en passant
      // à l'ordinateur masquait les autres lignes sans « Tout voir » pour
      // les ramener (revue de c197a10).
      etat.typeOuvert = null
      renderTout(); renderBulle()
    }
  })
  // L'en-tête collant suit le défilement horizontal du calendrier (téléphone).
  const scrollEl = $('[data-bind="planning"]')
  const teteEl = $('[data-bind="tete"]')
  scrollEl.addEventListener('scroll', () => { teteEl.scrollLeft = scrollEl.scrollLeft }, { passive: true })
  // Changement de jour : re-rendu si la date a changé (onglet ouvert la nuit).
  let jourVu = AUJOURDHUI
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && toISO(new Date()) !== jourVu) location.reload()
  })
  await Promise.all([charger(), chargerATraiter()])
}
init().catch(e => logger.error('Menages', e.message, e))

</script>
</body>
</html>
