    ${CFG_JOURS.map(j => `<span class="men-cfg__pastille${jours.has(j.n) ? ' is-on' : ''}">${esc(j.c)}</span>`).join('')}
  </div>`
  if (!alterne) {
    const u = new Set()
    for (const r of regles) for (const j of (r.jours || [])) u.add(Number(j))
    return ligne('', u)
  }
  // En quinzaine, chaque règle porte sa propre ancre : A = celles dont l'ancre
  // tombe sur la semaine courante.
  const semA = new Set(), semB = new Set()
  for (const r of regles) {
    const cible = (r.cadence === 'quinzaine' && !semaineAncree(r.ancre)) ? semB : semA
    for (const j of (r.jours || [])) cible.add(Number(j))
  }
  return ligne('A', semA) + ligne('B', semB)
}

// La semaine ISO de l'ancre a-t-elle la même parité que celle d'aujourd'hui ?
// ⚠ Sans cela, A et B s'inversaient une semaine sur deux à l'écran.
function semaineAncree (ancre) {
  if (!ancre) return true
  const semaines = (iso) => Math.floor(Date.parse(iso + 'T12:00:00Z') / 604800000)
  return (semaines(String(ancre).slice(0, 10)) - semaines(AUJOURDHUI)) % 2 === 0
}

// Le calendrier deux mois, EN LECTURE. ⚠ CHAQUE JOUR VIENT DU SERVEUR, qui
// l'a calculé avec `estDisponible` — le même code que celui qui décide à qui un
// ménage est attribué. Rien n'est recalculé ici : un calendrier peint par une
// seconde implémentation finirait par contredire le moteur.
function htmlCalendrier () {
  const jours = (cfg.dispo || {}).jours
  if (!Array.isArray(jours) || !jours.length) return ''
  const parMois = new Map()
  for (const j of jours) {
    const m = j.date.slice(0, 7)
    if (!parMois.has(m)) parMois.set(m, [])
    parMois.get(m).push(j)
  }
  const nomMois = (m) => new Intl.DateTimeFormat(langue(), { month: 'long', year: 'numeric', timeZone: 'UTC' })
    .format(new Date(m + '-01T12:00:00Z'))
  const grille = (m, liste) => {
    // Lundi en premier : `getUTCDay()` rend 0 = dimanche.
    const premier = new Date(m + '-01T12:00:00Z').getUTCDay()
    const vides = (premier + 6) % 7
    const cases = Array(vides).fill('<span></span>').concat(liste.map(j => {
      const cl = ['men-cfg__jour']
      if (j.dispo) cl.push('is-on')
      if (j.conge) cl.push('is-conge')
      if (j.date < AUJOURDHUI) cl.push('is-passe')
      // Le point = réglé à la main (une exception datée). ⚠ Il ne dit PAS qui :
      // c'est la seule des trois traces qui reste muette là-dessus, et la
      // légende ne prétend pas le contraire.
      const point = j.exception ? '<i class="men-cfg__pt" aria-hidden="true"></i>' : ''
      const titre = j.conge
        ? t('menages.equipe.config.cal_conge', { motif: j.conge.motif || t('menages.equipe.config.conge_sans_motif') })
        : t(j.dispo ? 'menages.equipe.config.cal_travaille' : 'menages.equipe.config.cal_absente')
      return `<span class="${cl.join(' ')}" title="${esc(dateLongue(j.date) + ' — ' + titre)}">
        ${Number(j.date.slice(8, 10))}${point}</span>`
    }))
    return `<div class="men-cfg__mois">
      <div class="men-cfg__moisNom">${esc(nomMois(m))}</div>
      <div class="men-cfg__moisTete">${CFG_JOURS.map(j => `<span>${esc(j.c)}</span>`).join('')}</div>
      <div class="men-cfg__grille">${cases.join('')}</div>
    </div>`
  }
  const corriger = (cfg.fiche.droits || {}).prestataires === 'write'
    ? `<a class="btn btn--secondary men-cfg__corriger" href="/apps/menages/prestataires?presta=${encodeURIComponent(cfg.profilId)}">
         <span data-i18n="menages.equipe.config.corriger"></span></a>`
    : ''
  return `<div class="men-cfg__cal">${[...parMois].map(([m, l]) => grille(m, l)).join('')}</div>
    <div class="men-cfg__legende">
      <span><i class="men-cfg__lg is-on"></i><span data-i18n="menages.equipe.config.cal_travaille"></span></span>
      <span><i class="men-cfg__lg"></i><span data-i18n="menages.equipe.config.cal_absente"></span></span>
      <span><i class="men-cfg__lg is-conge"></i><span data-i18n="menages.equipe.config.cal_conge_lg"></span></span>
      <span><i class="men-cfg__pt men-cfg__pt--lg"></i><span data-i18n="menages.equipe.config.cal_point"></span></span>
      ${corriger}
    </div>`
}

// Les congés À VENIR, avec leur source. ⚠ L'HÔTE NE RETIRE QUE LES SIENS :
// `api/disponibilites` refuse de toucher un congé posé par elle, et proposer le
// bouton ferait promettre un geste qu'on refuserait.
function htmlConges () {
  const conges = ((cfg.dispo || {}).conges || [])
    .filter(c => String(c.fin).slice(0, 10) >= AUJOURDHUI)
    .sort((a, b) => String(a.debut).localeCompare(String(b.debut)))
  const peut = (cfg.fiche.droits || {}).prestataires === 'write'
  const lignes = conges.map(c => {
    const par = t(c.source === 'prestataire' ? 'menages.equipe.config.par_elle' : 'menages.equipe.config.par_vous')
    const retirer = (peut && c.source !== 'prestataire')
      ? `<button type="button" class="link small" data-cfg-conge-off="${esc(c.id)}" data-i18n="menages.equipe.config.conge_retirer"></button>`
      : ''
    return `<li class="men-cfg__conge">
      <span>${esc(dateCourte(String(c.debut).slice(0, 10)))} → ${esc(dateCourte(String(c.fin).slice(0, 10)))}</span>
      <span class="caption muted">${esc(c.motif || t('menages.equipe.config.conge_sans_motif'))} · ${esc(par)}</span>
      ${retirer}
    </li>`
  }).join('')
  const poser = peut
    ? `<button type="button" class="btn btn--secondary men-cfg__poser" data-cfg-conge-new data-i18n="menages.equipe.config.conge_poser"></button>`
    : ''
  return `<div class="men-cfg__conges">
    <div class="men-cfg__congesTete">
      <b data-i18n="menages.equipe.config.conges"></b>
      ${conges.length ? '' : `<span class="caption muted" data-i18n="menages.equipe.config.conges_aucun"></span>`}
      ${poser}
    </div>
    ${conges.length ? `<ul class="men-cfg__congesListe">${lignes}</ul>` : ''}
  </div>`
}

// « Ce qu'elle voit des autres » : les DEUX portées se CUMULENT, et le défaut
// est RIEN — elle ne voit que ses propres ménages.
function htmlVisibiliteAutres () {
  const v = (cfg.dispo || {}).visibilite
  if (!v) return `<p class="caption muted" data-i18n="menages.equipe.panne"></p>`
  const peut = (cfg.fiche.droits || {}).prestataires === 'write'
  const f = cfg.fiche
  // Les biens dont elle reçoit AUJOURD'HUI les propositions : le rappel
  // dynamique de l'écran d'avant, qui évite de régler à l'aveugle.
  const siens = (f.liaisons || []).filter(l => l.active && l.requires_ack)
    .map(l => (f.biens || []).find(b => String(b.id) === String(l.property_id)))
    .filter(Boolean).map(b => b.nom)
  const puces = (f.collegues || []).map(c => {
    const on = (v.profils_vus || []).map(String).includes(String(c.id))
    // Une personne DÉSACTIVÉE déjà cochée reste affichée, et le dit : l'effacer
    // ferait disparaître un réglage que l'hôte a posé.
    if (!c.actif && !on) return ''
    const nom = nomCollegue(c, f.collegues)
    return `<button type="button" class="men-cfg__puce${on ? ' is-on' : ''}" aria-pressed="${on}"
      ${peut ? '' : 'disabled'} data-cfg-vu="${esc(c.id)}">${esc(nom)}${
      c.actif ? '' : ` <span class="caption">${esc(t('menages.equipe.config.desactivee'))}</span>`}</button>`
  }).join('')
  const regle = v.regle_le
    ? `<p class="caption muted">${esc(v.regle_par
        ? t('menages.equipe.config.regle_le_par', { quand: dateHeure(v.regle_le), qui: v.regle_par })
        : t('menages.equipe.config.regle_le', { quand: dateHeure(v.regle_le) }))}</p>`
    : ''
  return `<div class="men-cfg__row">
      <div class="men-cfg__rowTxt">
        <span data-i18n="menages.equipe.config.autres_biens"></span>
        <span class="caption muted">${esc(siens.length
          ? t('menages.equipe.config.autres_biens_liste', { biens: siens.join(', ') })
          : t('menages.equipe.config.autres_biens_aucun'))}</span>
      </div>
      <button type="button" class="men-cfg__sw${v.par_bien ? ' is-on' : ''}" role="switch"
              aria-checked="${v.par_bien}" ${peut ? '' : 'disabled'} data-cfg-parbien></button>
    </div>
    <p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.autres_pris"></p>
    <div class="men-cfg__puces">${puces || `<span class="caption muted" data-i18n="menages.equipe.config.autres_seule"></span>`}</div>
    ${regle}`
}

// Prénom seul, SAUF si deux personnes le partagent — demande de Thierry :
// « Lena » suffit tant qu'il n'y a pas deux Lena.
function nomCollegue (c, tous) {
  const homonyme = (tous || []).some(x => String(x.id) !== String(c.id) &&
    String(x.prenom || '').toLowerCase() === String(c.prenom || '').toLowerCase())
  if (!homonyme) return c.prenom || t('menages.quelquun')
  return `${c.prenom || ''} ${String(c.nom || '').slice(0, 1).toUpperCase()}`.trim()
}

function htmlJoursVisibles () {
  const lien = cfg.fiche.lien
  // ⚠ `null` = NON LU. Afficher « 30 jours » ferait croire à l'hôte qu'il a
  // réglé ce qu'il n'a pas réglé — et un clic ultérieur l'écrirait pour de bon.
  if (!lien) return `<p class="caption muted" data-i18n="menages.equipe.config.lien_illisible"></p>`
  const peut = (cfg.fiche.droits || {}).prestataires === 'write'
  return `<p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.visibles_aide"></p>
    <div class="men-cfg__seg" role="group">${CFG_VISIBLES.map(v =>
      `<button type="button" class="${v === lien.visibility_days ? 'is-on' : ''}" ${peut ? '' : 'disabled'}
        data-cfg-visibles="${v}">${esc(t('menages.equipe.config.n_jours', { n: v }))}</button>`).join('')}</div>`
}

// ─── Onglet « Configuration » ───────────────────────────────────────────────
//
// ⚠ TOUT CE QUI EST ICI PASSE PAR `/api/membres`, qui exige `equipe: write`
// NON DÉLÉGABLE. Un délégué voit donc ces champs en LECTURE : les lui offrir
// éditables ferait promettre un enregistrement que le serveur refuse.
function htmlOngletParam () {
  const f = cfg.fiche
  const p = f.personne
  const peut = (f.droits || {}).equipe === 'write'
  const champ = (cle, val, type = 'text') => `<label class="men-cfg__champ">
    <span class="caption muted" data-i18n="menages.equipe.config.${cle}"></span>
    <input type="${type}" value="${esc(val || '')}" ${peut && p.a_un_lien ? '' : 'disabled'}
           data-cfg-champ="${cle}" autocomplete="off">
  </label>`
  const bascule = (attr, cleTxt, on, cleAide = null, actif = true) => `<div class="men-cfg__row">
    <div class="men-cfg__rowTxt">
      <span data-i18n="menages.equipe.config.${cleTxt}"></span>
      ${cleAide ? `<span class="caption muted" data-i18n="menages.equipe.config.${cleAide}"></span>` : ''}
    </div>
    <button type="button" class="men-cfg__sw${on ? ' is-on' : ''}" role="switch" aria-checked="${on}"
            ${actif ? '' : 'disabled'} data-${attr}></button>
  </div>`

  // ⚠ LE NOM DE FAMILLE EST OBLIGATOIRE depuis le 15 septembre 2026, et ce
  // n'est pas de l'état civil : un prénom seul ne DÉSIGNE personne dès qu'il y
  // a deux Marie — ni dans la liste, ni dans le planning, ni dans les avis, ni
  // dans le SMS qui arrive chez elle. La règle n'est pas rétroactive : une
  // fiche ancienne fonctionne, elle est seulement marquée.
  const manqueNom = !p.nom
    ? `<p class="men-cfg__av" data-i18n="menages.equipe.config.nom_requis"></p>` : ''

  // ⚠ UN LIEN SANS PERSONNE DERRIÈRE ne peut rien enregistrer : on coupe les
  // champs et on DIT pourquoi, plutôt que de promettre un enregistrement.
  const sansPersonne = !p.a_un_lien
    ? `<p class="men-cfg__av" data-i18n="menages.equipe.config.sans_personne"></p>` : ''

  // Les canaux : DEUX CHOIX, PAS UNE DÉDUCTION. Avant, le canal se déduisait de
  // la coordonnée, et le seul moyen de ne pas notifier était d'EFFACER le
  // numéro — donc de perdre le moyen de l'appeler.
  const avSms = p.notify_sms && !p.tel
    ? `<p class="men-cfg__av" data-i18n="menages.equipe.config.av_sans_tel"></p>` : ''
  const avMail = p.notify_email && !p.email
    ? `<p class="men-cfg__av" data-i18n="menages.equipe.config.av_sans_email"></p>` : ''
  const avMuet = !(p.notify_sms && p.tel) && !(p.notify_email && p.email)
    ? `<p class="men-cfg__av" data-i18n="menages.equipe.config.av_muet"></p>` : ''

  // ⚠ LES TROIS GESTES DU LIEN VIVENT ICI (décision de Thierry, 14 octobre
  // 2026). Ils habitaient l'onglet « Ce qu'elle voit », supprimé avec son
  // cadre : un aperçu de sa page ne disait rien de plus que sa page elle-même,
  // et le jeton n'a plus à entrer dans le DOM de l'hôte pour être envoyé.
  // ⚠ « Ouvrir sa page » RESTE EN LECTURE SEULE (`apercu=1`) : ce bouton est
  // le seul chemin qui mène encore chez elle depuis cet écran, et sans le mode
  // il horodaterait une ouverture qu'elle n'a pas faite.
  const lien = `<section class="men-cfg__sec">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.son_lien"></h3>
    ${p.a_un_lien ? `<p class="caption muted" data-i18n="menages.equipe.config.son_lien_aide"></p>
      <div class="men-cfg__lienBtns">
        ${peut ? `<button type="button" class="btn btn--primary" data-cfg-envoyer>
          ${icone('i-send')}<span data-i18n="menages.equipe.config.envoyer"></span></button>` : ''}
        <button type="button" class="btn btn--secondary" data-cfg-ouvrir>
          ${icone('i-link')}<span data-i18n="menages.equipe.config.ouvrir"></span></button>
        ${peut ? `<button type="button" class="btn btn--secondary" data-cfg-nouveau>
          ${icone('i-key')}<span data-i18n="menages.equipe.config.nouveau_lien"></span></button>` : ''}
      </div>
      ${peut ? `<p class="caption muted" data-i18n="menages.equipe.config.nouveau_lien_av"></p>` : ''}`
      : `<p class="men-cfg__av" data-i18n="menages.equipe.config.sans_lien"></p>`}
  </section>`

  return `
  <section class="men-cfg__sec">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.identite"></h3>
    ${sansPersonne}
    <div class="men-cfg__champs">
      ${champ('prenom', p.prenom)}${champ('nom', p.nom)}
      ${champ('tel', p.tel, 'tel')}${champ('email', p.email, 'email')}
    </div>
    ${manqueNom}
  </section>

  <section class="men-cfg__sec">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.notifs"></h3>
    ${bascule('cfg-sms', 'notif_sms', p.notify_sms, 'notif_sms_aide', peut && p.a_un_lien)}
    ${avSms}
    ${bascule('cfg-mail', 'notif_email', p.notify_email, null, peut && p.a_un_lien)}
    ${avMail}${avMuet}
  </section>

  ${lien}
  ${htmlEval()}
  ${htmlRatio()}
  ${htmlRetirer()}`
}

// L'évaluation des voyageurs. ⚠ ELLE N'APPARAÎT QU'AVEC LE DROIT `avis`, et
// elle NAÎT DÉCOCHÉE (décision du 2 octobre 2026) : elle ne voit aucune
// question tant que l'hôte ne l'y autorise pas.
function htmlEval () {
  const f = cfg.fiche
  if ((f.droits || {}).avis === 'none') return ''
  if (!cfg.eval) {
    return `<section class="men-cfg__sec"><h3 class="men-cfg__h3" data-i18n="menages.equipe.config.eval"></h3>
      <p class="caption muted" data-i18n="menages.equipe.config.eval_illisible"></p></section>`
  }
  const peut = (f.droits || {}).avis === 'write'
  const participe = cfg.eval.eval_scope && cfg.eval.eval_scope !== 'aucun'
  const valide = cfg.eval.eval_power === 'valider'
  return `<section class="men-cfg__sec">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.eval"></h3>
    <div class="men-cfg__row">
      <div class="men-cfg__rowTxt">
        <span data-i18n="menages.equipe.config.eval_repond"></span>
        <span class="caption muted" data-i18n="menages.equipe.config.eval_repond_aide"></span>
      </div>
      <button type="button" class="men-cfg__sw${participe ? ' is-on' : ''}" role="switch"
              aria-checked="${participe}" ${peut ? '' : 'disabled'} data-cfg-eval-scope></button>
    </div>
    <p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.eval_quand"></p>
    <div class="men-cfg__seg" role="group">
      <button type="button" class="${valide ? '' : 'is-on'}" ${peut && participe ? '' : 'disabled'}
              data-cfg-eval-power="soumettre" data-i18n="menages.equipe.config.eval_relire"></button>
      <button type="button" class="${valide ? 'is-on' : ''}" ${peut && participe ? '' : 'disabled'}
              data-cfg-eval-power="valider" data-i18n="menages.equipe.config.eval_publie"></button>
    </div>
    <p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.eval_negatif"></p>
    ${participe ? '' : `<p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.eval_aucune"></p>`}
  </section>`
}

// La période du ratio : celle sur laquelle SES avis de propreté sont comptés
// DANS SON APPLICATION — pas dans les chiffres de l'hôte. ⚠ LES QUATRE VALEURS
// RÉELLES, celles que la base accepte (CHECK) : 15 j / 30 j / 6 mois / depuis
// le début. La maquette en proposait trois autres ; une valeur hors liste fait
// échouer l'écriture avec un message Postgres.
function htmlRatio () {
  const lien = cfg.fiche.lien
  if (!lien) return ''
  const peut = (cfg.fiche.droits || {}).prestataires === 'write'
  return `<section class="men-cfg__sec">
    <h3 class="men-cfg__h3" data-i18n="menages.equipe.config.ratio"></h3>
    <p class="caption muted men-cfg__aide" data-i18n="menages.equipe.config.ratio_aide"></p>
    <div class="men-cfg__seg" role="group">${CFG_PERIODES.map(v =>
      `<button type="button" class="${v === lien.ratio_periode ? 'is-on' : ''}" ${peut ? '' : 'disabled'}
        data-cfg-ratio="${v}" data-i18n="menages.equipe.config.periode_${v}"></button>`).join('')}</div>
  </section>`
}

// ⚠ RETIRER, C'EST TROIS GESTES, ET LES TROIS SONT NÉCESSAIRES : couper ses
// liaisons (le moteur ne lit ni le lien ni le statut du profil — c'est elles
// qui le font travailler), désactiver le profil, et le serveur supprime la
// ligne du lien. Le vécu gravé dans `/api/membres` : effacer le seul lien
// laissait le profil actif ET ses liaisons actives, si bien que le cron
// continuait d'attribuer des ménages — d'office si elle était référente — à
// quelqu'un dont le lien n'existe plus.
// ⚠ LES LIAISONS D'ABORD : si la désactivation échoue, les ménages ont au
// moins cessé de lui être attribués, et l'écran le dit.
// Choix de Thierry (14 octobre 2026), option 1 : un seul geste, celui qui
// existe déjà. Conséquence assumée : son périmètre est perdu, donc une reprise
// demandera de recocher ses biens.
function htmlRetirer () {
  if ((cfg.fiche.droits || {}).equipe !== 'write') return ''
  return `<section class="men-cfg__sec">
    <button type="button" class="btn btn--secondary men-cfg__retirer" data-cfg-retirer
            data-i18n="menages.equipe.config.retirer"></button>
  </section>`
}

// ─── Les gestes ─────────────────────────────────────────────────────────────
//
// ⚠ CHAQUE ÉCRITURE PASSE PAR L'ENDPOINT QUI EN EST LE WRITER, jamais en
// direct dans une table : les liaisons par `/api/menages action:'liaisons'`,
// l'identité et les droits par `/api/membres`, les disponibilités et « ce
// qu'elle voit » par `/api/disponibilites`, les réglages de son lien par
// `action:'reglages_lien'`, l'évaluation par le bus du cœur.

// La liste COMPLÈTE des liaisons actives, telle que le serveur l'attend : les
// biens absents de la liste sont désactivés. On part donc TOUJOURS de l'état
// relu, jamais d'un souvenir d'écran.
function liaisonsAEnvoyer (modif) {
  const f = cfg.fiche
  const out = []
  for (const b of (f.biens || [])) {
    const l = (f.liaisons || []).find(x => String(x.property_id) === String(b.id))
    const base = l
      ? { property_id: String(b.id), rang: l.rang, requires_ack: l.requires_ack,
          weekdays: Array.isArray(l.weekdays) ? [...l.weekdays] : null, active: l.active }
      : { property_id: String(b.id), rang: 1, requires_ack: true, weekdays: null, active: false }
    const apres = modif(base) || base
    if (apres.active) out.push({ property_id: apres.property_id, rang: apres.rang,
                                 requires_ack: apres.requires_ack, weekdays: apres.weekdays })
  }
  return out
}

const envoyerLiaisons = (modif) => gesteConfig(async () => {
  const liaisons = liaisonsAEnvoyer(modif)
  const r = await poster('/api/menages',
    { action: 'liaisons', provider_id: cfg.profilId, liaisons })
  // ⚠ ON LE DIT QUAND SA PAGE NE SERVIRA PEUT-ÊTRE PAS LE BIEN : les liaisons
  // sont écrites, le moteur attribuera, mais le ménage pourrait être invisible
  // chez elle. Sans ce message, l'hôte chercherait la panne de son côté.
  if (r && r.perimetre_pwa === false) toast(t('menages.equipe.config.perimetre_rate'))
})

function brancherConfig () {
  const zone = $('[data-bind="cfg"]')
  $('[data-bind="cfg-fermer"]').addEventListener('click', fermerConfig)
  $('[data-bind="cfg-voile"]').addEventListener('click', fermerConfig)

  zone.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-cfg-onglet],[data-cfg-fix],' +
      '[data-cfg-jour],[data-cfg-self],[data-cfg-parbien],[data-cfg-vu],' +
      '[data-cfg-visibles],[data-cfg-ratio],[data-cfg-sms],[data-cfg-mail],[data-cfg-eval-scope],' +
      '[data-cfg-eval-power],[data-cfg-retirer],[data-cfg-envoyer],[data-cfg-ouvrir],' +
      '[data-cfg-nouveau],[data-cfg-conge-new],[data-cfg-conge-off]')
    if (!el || el.disabled) return
    const d = el.dataset

    if (d.cfgOnglet) {
      cfg.onglet = d.cfgOnglet
      renderConfig()
      return
    }
    if (d.cfgFix) {
      cfg.onglet = 'cal'
      renderConfig()
      const cible = $(`[data-cfg-sec="${d.cfgFix === 'biens' ? 'biens' : 'biens'}"]`)
      if (cible) cible.scrollIntoView({ behavior: 'smooth', block: 'start' })
      return
    }

    // ── Les jours confiés sur un bien ──
    // ⚠ CE BLOC AVAIT ÉTÉ EMPORTÉ avec l'interrupteur et les deux menus qu'il
    // remplaçait (constat haut de la revue de 6d007f3) : les sept cases
    // restaient peintes et cliquables, et ne faisaient RIEN. Pire, une liaison
    // « proposée » sans jours réglés — les cases en pointillé — ne pouvait plus
    // être résolue du tout : c'est exactement le blocage que cet écran existe
    // pour lever.
    if (d.cfgJour) {
      const [id, j] = d.cfgJour.split(':')
      const n = Number(j)
      // ⚠ LA REGLE EST DANS LE MODULE, partagée avec le RENDU : c'est leur
      // divergence qui avait inversé le geste (re-revue de e528ca1).
      envoyerLiaisons(b => (String(b.property_id) === id
        ? { ...b, weekdays: joursApresClic(b, n) } : b))
      return
    }

    // ── Quand elle est là ──
    if ('cfgSelf' in d) {
      const on = cfg.fiche.personne.self_availability === 'write'
      gesteConfig(() => poster('/api/membres',
        { action: 'update', profile_id: cfg.profilId, self_availability: on ? 'none' : 'write' }))
      return
    }
    if ('cfgCongeNew' in d) { poserCongeConfig(); return }
    if (d.cfgCongeOff) {
      gesteConfig(() => poster('/api/disponibilites',
        { action: 'retirerConge', provider_id: cfg.profilId, id: d.cfgCongeOff }))
      return
    }

    // ── Ce qu'elle voit des autres : les DEUX portées partent ENSEMBLE, parce
    // que `reglerVisibilite` écrit la ligne entière (writer unique). N'envoyer
    // qu'un champ effacerait l'autre.
    if ('cfgParbien' in d || d.cfgVu) {
      const v = (cfg.dispo || {}).visibilite || { par_bien: false, profils_vus: [] }
      let parBien = !!v.par_bien
      let vus = (v.profils_vus || []).map(String)
      if ('cfgParbien' in d) parBien = !parBien
      else vus = vus.includes(d.cfgVu) ? vus.filter(x => x !== d.cfgVu) : vus.concat(d.cfgVu)
      gesteConfig(() => poster('/api/disponibilites',
        { action: 'reglerVisibilite', provider_id: cfg.profilId, par_bien: parBien, profils_vus: vus }))
      return
    }

    // ── Les réglages portés par son lien ──
    if (d.cfgVisibles) {
      gesteConfig(() => poster('/api/menages',
        { action: 'reglages_lien', provider_id: cfg.profilId, visibility_days: Number(d.cfgVisibles) }))
      return
    }
    if (d.cfgRatio) {
      gesteConfig(() => poster('/api/menages',
        { action: 'reglages_lien', provider_id: cfg.profilId, ratio_periode: d.cfgRatio }))
      return
    }

    // ── Les canaux : l'envoi exige LES DEUX, la coordonnée ET l'intention ──
    if ('cfgSms' in d || 'cfgMail' in d) {
      const p = cfg.fiche.personne
      const champ = ('cfgSms' in d) ? 'notify_sms' : 'notify_email'
      gesteConfig(() => poster('/api/membres',
        { action: 'update', profile_id: cfg.profilId, [champ]: !p[champ] }))
      return
    }

    // ── L'évaluation des voyageurs (bus du cœur) ──
    if ('cfgEvalScope' in d) {
      const on = cfg.eval && cfg.eval.eval_scope && cfg.eval.eval_scope !== 'aucun'
      gesteConfig(async () => {
        await hsBus.demander('avis.reglages_prestataire',
          { profile_id: cfg.profilId, eval_scope: on ? 'aucun' : 'propre' })
        await chargerEvalConfig(cfg.profilId)
      })
      return
    }
    if (d.cfgEvalPower) {
      const v = d.cfgEvalPower
      gesteConfig(async () => {
        await hsBus.demander('avis.reglages_prestataire', { profile_id: cfg.profilId, eval_power: v })
        await chargerEvalConfig(cfg.profilId)
      })
      return
    }

    // ── Son lien ──
    if ('cfgEnvoyer' in d) { envoyerLien(); return }
    if ('cfgOuvrir' in d) { ouvrirSaPage(); return }
    if ('cfgNouveau' in d) { nouveauLien(); return }
    if ('cfgRetirer' in d) { retirerDeLEquipe(); return }
  })

  // Les champs de texte s'enregistrent à la sortie du champ, et seulement si la
  // valeur a changé : une écriture par frappe enverrait une requête par lettre.
  zone.addEventListener('change', (ev) => {
    // ── Le menu d'un bien : UN geste, quatre choix ──
    const menu = ev.target.closest('[data-cfg-choix]')
    if (menu && !menu.disabled) {
      const id = menu.dataset.cfgChoix
      const v = menu.value
      // ⚠ « Tel quel » N'EST PAS UN CHOIX : c'est l'état lu en base, affiché
      // pour ne pas l'effacer. Le sélectionner ne doit rien écrire.
      if (v === 'autre') return
      const l = (cfg.fiche.liaisons || []).find(x => String(x.property_id) === String(id))
      const actifAvant = !!(l && l.active)
      // ⚠ RETIRER LE DERNIER BIEN EST REFUSÉ, et le message dit quoi faire : un
      // périmètre vide ne retire pas l'accès, il l'OUVRE à tous les biens du
      // compte. Le refus ne vaut que pour qui voit l'ENSEMBLE des biens —
      // sinon un délégué ne pourrait pas retirer son seul bien visible.
      const actifsApres = (cfg.fiche.liaisons || []).filter(x => x.active).length - (actifAvant ? 1 : 0)
      if (v === 'non' && actifAvant && actifsApres === 0 && (cfg.fiche.droits || {}).perimetre_complet) {
        toast(t('menages.equipe.config.dernier_bien')); renderConfig(); return
      }
      const vers = { office: { active: true, requires_ack: false, rang: 1 },
                     p1: { active: true, requires_ack: true, rang: 1 },
                     p2: { active: true, requires_ack: true, rang: 2 },
                     non: { active: false } }[v]
      envoyerLiaisons(b => (String(b.property_id) === String(id) ? { ...b, ...vers } : b))
      return
    }
    const el = ev.target.closest('[data-cfg-champ]')
    if (!el || el.disabled) return
    const cle = el.dataset.cfgChamp
    const vers = { prenom: 'first_name', nom: 'last_name', tel: 'phone', email: 'email' }[cle]
    const avant = cfg.fiche.personne[cle] || ''
    const apres = el.value.trim()
    if (apres === avant) return
    // ⚠ LE NOM NE S'EFFACE PAS : il est obligatoire depuis le 15 septembre
    // 2026, et le serveur refuse une chaîne vide. Le dire ici évite un
    // aller-retour pour un message qu'on connaît déjà.
    if (cle === 'nom' && !apres) { toast(t('menages.equipe.config.nom_requis')); renderConfig(); return }
    gesteConfig(() => poster('/api/membres',
      { action: 'update', profile_id: cfg.profilId, [vers]: apres }))
  })
}

// ─── Son congé, posé par l'hôte ─────────────────────────────────────────────
//
// ⚠ UN SEUL CHAMP DE SAISIE AURAIT SUFFI À SE TROMPER : les bornes d'un congé
// sont INCLUSES des deux côtés (`availability.js`), donc « du 9 au 15 » couvre
// le 15. Le dire au moment de la saisie évite de croire qu'elle revient le 15.
function poserCongeConfig () {
  const debut = prompt(t('menages.equipe.config.conge_debut'))
  if (!debut) return
  const fin = prompt(t('menages.equipe.config.conge_fin'), debut)
  if (!fin) return
  const jour = /^\d{4}-\d{2}-\d{2}$/
  if (!jour.test(debut.trim()) || !jour.test(fin.trim())) { toast(t('menages.equipe.config.conge_date_ko')); return }
  if (fin.trim() < debut.trim()) { toast(t('menages.equipe.config.conge_ordre')); return }
  const motif = prompt(t('menages.equipe.config.conge_motif')) || null
  gesteConfig(() => poster('/api/disponibilites', {
    action: 'poserConge', provider_id: cfg.profilId,
    debut: debut.trim(), fin: fin.trim(), motif
  }))
}

// ─── Son lien ───────────────────────────────────────────────────────────────
//
// ⚠ LE JETON N'EST DEMANDÉ QU'AU MOMENT DU GESTE, et il ne reste pas dans
// l'écran. C'est son mot de passe : le charger à l'ouverture de la fiche
// l'exposerait à toute capture d'écran, pour un geste fait une fois.
async function lienDElle () {
  const r = await appel(`/api/membres?action=lien&profile_id=${encodeURIComponent(cfg.profilId)}`)
  if (!r || !r.lien) throw new Error('lien absent')
  return r.lien
}

// ⚠ CE BOUTON NE MÈNE QU'À SA PAGE. `/api/membres action:'lien'` rend aussi,
// pour un profil d'un autre mode d'accès, une URL d'INVITATION — une page qui
// n'a ni mode lecture seule, ni garde sur les écritures. L'écran ne vérifiait que
// `a_un_lien` (l'existence d'un jeton), qui n'est pas le même prédicat
// (constat de la revue de 6d007f3).
// ⚠ L'ORIGINE COMPTE AUTANT QUE LE CHEMIN (constat de la re-revue de e528ca1).
// `lienDAcces` construit l'URL à partir d'une base qui vient de la requête :
// une base erronée — variable d'environnement, en-tête `host` d'une preview —
// donnerait une adresse d'une AUTRE origine, où ni le garde sur les écritures
// ni le stockage volatile n'existent. Le jeton partirait dans un cadre tiers.
const estSaPage = (lien) => {
  try {
    const u = new URL(lien, location.origin)
    return u.origin === location.origin && u.pathname.startsWith('/apps/menages/public')
  } catch { return false }
}
// Le mode lecture seule de sa page. L'ouvrir sans lui défait trois gardes d'un
// clic : l'horodatage de sa dernière ouverture, le jeton rangé dans le
// navigateur de l'hôte, le service worker installé chez lui.
const enApercu = (lien) => lien + (lien.includes('?') ? '&' : '?') + 'apercu=1'

// « Envoyer le lien » : le partage natif du téléphone quand il existe (SMS,
// messagerie…), sinon le presse-papier. ⚠ POUR QUE L'HÔTE N'AIT PLUS JAMAIS À
// RECOPIER UN MOT DE PASSE À LA MAIN (décision H.7-1) : jusqu'ici, le seul
// chemin par lequel le lien atteignait la prestataire était une notification
// de ménage — ou un copier-coller de l'hôte dans ses propres SMS.
async function envoyerLien () {
  try {
    const lien = await lienDElle()
    const p = cfg.fiche.personne
    const texte = t('menages.equipe.config.sms_texte', { prenom: p.prenom || '', lien })
    if (navigator.share) {
      // ⚠ L'ABANDON DU PARTAGE N'EST PAS UNE PANNE : fermer la feuille de
      // partage lève `AbortError`, et l'annoncer comme un échec ferait croire
      // que le lien n'est pas parti alors qu'il n'a pas été envoyé exprès.
      try { await navigator.share({ text: texte }) } catch (e) { if (e && e.name === 'AbortError') return; throw e }
      toast(t('menages.equipe.config.envoye'))
      return
    }
    await navigator.clipboard.writeText(texte)
    toast(t('menages.equipe.config.copie'))
  } catch (e) {
    logger.error('Menages', 'envoyer lien', e)
    toast(t('menages.equipe.config.echec'))
  }
}

async function ouvrirSaPage () {
  try {
    const lien = await lienDElle()
    // ⚠ EN LECTURE SEULE. L'hôte veut voir sa page, pas s'y substituer :
    // sans le mode, ce clic horodatait sa dernière
    // ouverture — et le badge passait au vert sur quelqu'un qui n'a jamais
    // rien ouvert.
    // ⚠ `noopener` : la page ouverte porte son jeton dans l'URL, et on ne lui
    // donne aucune poignée sur celle de l'hôte.
    // ⚠ ON NE SE RABAT PAS SUR LE LIEN BRUT (constat de la re-revue de
    // e528ca1) : `lienDAcces` rend une URL d'INVITATION pour un profil qui
    // n'est plus en mode « lien ». Ouverte dans la session de l'hôte, elle lui
    // propose de rejoindre le compte — et un clic de plus CONSOMMERAIT
    // l'invitation destinée à la prestataire. Le cadre refuse ce lien ; ce
    // bouton le refuse aussi.
    if (!estSaPage(lien)) { toast(t('menages.equipe.config.page_ko')); return }
    window.open(enApercu(lien), '_blank', 'noopener')
  } catch (e) {
    logger.error('Menages', 'ouvrir sa page', e)
    toast(t('menages.equipe.config.echec'))
  }
}

// ⚠ « Nouveau lien » CASSE L'ANCIEN, et c'est tout l'intérêt (lien compromis,
// téléphone perdu). On le dit AVANT, et la confirmation nomme la personne :
// régénérer le lien de la mauvaise prestataire la laisse dehors sans prévenir.
function nouveauLien () {
  const p = cfg.fiche.personne
  const nom = [p.prenom, p.nom].filter(Boolean).join(' ')
  if (!confirm(t('menages.equipe.config.nouveau_lien_confirm', { nom }))) return
  gesteConfig(async () => {
    await poster('/api/membres', { action: 'regenerate', profile_id: cfg.profilId })
    toast(t('menages.equipe.config.nouveau_lien_fait'))
  })
}

// ⚠ RETIRER = COUPER LES LIAISONS **PUIS** DÉSACTIVER, dans cet ordre.
// Le moteur ne lit ni le lien ni le statut du profil : ce sont les LIAISONS qui
// le font travailler. Le vécu gravé dans `/api/membres` : effacer le seul lien
// laissait le profil actif ET ses liaisons actives, si bien que le cron
// continuait d'attribuer des ménages — d'office si elle était référente — à
// quelqu'un dont le lien n'existe plus.
// Si la désactivation échoue, les ménages ont AU MOINS cessé de lui être
// attribués, et l'écran le dit au lieu d'annoncer un retrait complet.
async function retirerDeLEquipe () {
  const p = cfg.fiche.personne
  const nom = [p.prenom, p.nom].filter(Boolean).join(' ')
  if (!confirm(t('menages.equipe.config.retirer_confirm', { nom }))) return
  try {
    await poster('/api/menages', { action: 'liaisons', provider_id: cfg.profilId, liaisons: [] })
  } catch (e) {
    logger.error('Menages', 'retirer liaisons', e)
    toast(t('menages.equipe.config.retirer_ko_liaisons'))
    await chargerConfig().catch(() => {})
    return
  }
  try {
    await poster('/api/membres', { action: 'deactivate', profile_id: cfg.profilId })
  } catch (e) {
    logger.error('Menages', 'retirer profil', e)
    // Les liaisons SONT coupées : plus aucun ménage ne lui sera attribué. Mais
    // son lien fonctionne encore, et le dire est la seule façon pour l'hôte de
    // savoir quoi reprendre.
    toast(t('menages.equipe.config.retirer_demi'))
    await chargerConfig().catch(() => {})
    return
  }
  toast(t('menages.equipe.config.retire', { nom }))
  fermerConfig()
}

// ─── Démarrage ──────────────────────────────────────────────────────────────
async function init () {
  const session = await requireAuth()
  if (!session) return
  await I18n.init()
  document.addEventListener('i18n:changed', () => location.reload())
  const user = await getUser()
  $('[data-bind="initials"]').textContent = (user?.email || '').slice(0, 2).toUpperCase()
  HSNav.renderMenu({
    comptes: comptes(), compteActif: compteCourant(),
    onCompte: id => basculerVers(id), onDeconnexion: () => signOut(),
    reglages: estTitulaire(), avis: peutLire('avis'),
    outils: [
      peutLire('reservations') && { href: '/apps/yield', key: 'nav.tool_yield', icon: 'i-price' },
      estTitulaire() && { href: '/apps/serrures', key: 'nav.tool_locks', icon: 'i-key' },
      estTitulaire() && { href: '/apps/sms', key: 'nav.tool_sms', icon: 'i-send' },
      estTitulaire() && { href: '/apps/reservation-directe', key: 'nav.tool_direct', icon: 'i-calendar' },
      estTitulaire() && { href: '/connexions', key: 'nav.tool_connections', icon: 'i-link' },
      estTitulaire() && { href: '/abonnement', key: 'nav.tool_billing', icon: 'i-euro' }
    ].filter(Boolean)
  })
  majBadge()
  if (!peutLire('menages')) {
    $('[data-bind="etat-vide"]').hidden = false
    $('[data-bind="etat-vide"]').innerHTML = `<p class="muted">${esc(t('menages.no_access'))}</p>`
    return
  }
  lirePrefs()
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    const sens = Number(b.dataset.nav)
    etat.decalage = sens === 0 ? 0 : etat.decalage + sens * JOURS_PAR_MOIS[etat.mois]
    charger()
  }))
  document.querySelectorAll('[data-mois]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.mois)
    if (!MOIS.includes(n) || n === etat.mois) return
    etat.mois = n
    ecrirePrefs(); charger()
  }))
  // Bascule angle <-> bulles au passage du seuil 900 px (même UI que le
  // calendrier : angle à l'ordinateur, bulles au téléphone).
  let large = estLarge()
  window.addEventListener('resize', () => {
    if (estLarge() !== large) {
      large = estLarge()
      renderTout(); renderBulle()
    }
  })
  $('[data-bind="ouvrir-equipe"]').addEventListener('click', ouvrirEquipe)
  $('[data-bind="fermer-equipe"]').addEventListener('click', fermerEquipe)
  $('[data-bind="fermer-fiche"]').addEventListener('click', fermerFiche)
  $('[data-bind="voile"]').addEventListener('click', () => {
    if (!$('[data-bind="fiche"]').hidden) fermerFiche(); else fermerEquipe()
  })
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return
    // ⚠ L'ORDRE SUIT L'EMPILEMENT : la fenêtre de configuration est au-dessus
    // du volet, donc Échap la ferme d'abord — sinon on referme le volet qui
    // est derrière, et la fenêtre reste seule à l'écran.
    if (!$('[data-bind="cfg"]').hidden) fermerConfig()
    else if (!$('[data-bind="fiche"]').hidden) fermerFiche()
    else if (!$('[data-bind="volet"]').hidden) fermerEquipe()
  })
  brancherConfig()
  $('[data-bind="equipe-liste"]').addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-cfg-ouvrir-presta]')
    if (el) ouvrirConfig(el.dataset.cfgOuvrirPresta)
  })
  // L'en-tête collant suit le défilement horizontal du calendrier (téléphone).
  const scrollEl = $('[data-bind="planning"]')
  const teteEl = $('[data-bind="tete"]')
  scrollEl.addEventListener('scroll', () => { teteEl.scrollLeft = scrollEl.scrollLeft }, { passive: true })
  // Changement de jour : re-rendu si la date a changé (onglet ouvert la nuit).
  let jourVu = AUJOURDHUI
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && toISO(new Date()) !== jourVu) location.reload()
  })
  await Promise.all([charger(), chargerATraiter()])
  // ⚠ UN LIEN DIRECT VERS UNE FICHE (`?presta=<id>`) : l'ancien écran l'avait,
  // et le volet s'en servait. Il reste utile — un SMS, un signet, un renvoi
  // depuis une alerte. L'identifiant ne désigne rien par lui-même : le serveur
  // refuse par un 404 ce qui n'est pas du compte, et l'écran le dit.
  const presta = new URLSearchParams(location.search).get('presta')
  if (presta) ouvrirConfig(presta)
}
init().catch(e => logger.error('Menages', e.message, e))

</script>
</body>
</html>
