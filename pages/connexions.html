function setStatus (id, type, label) {
  poserEtat(document.getElementById(`status-${id}`), type, label)
}

function showToast (id, msg, type) {
  afficherRetour(document.getElementById(`toast-${id}`), msg, type === 'success' ? 'ok' : 'erreur', 5000)
}

// ===== Beds24 =====
async function checkBeds24Status () {
  const res = await fetch('/api/beds24-setup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
    body: JSON.stringify({ action: 'status' })
  })
  const data = await res.json()
  const ok = data.connected

  setStatus('beds24', ok ? 'ok' : 'off', t(ok ? 'outil.connecte' : 'outil.non_connecte'))

  const info = document.getElementById('token-info-beds24')
  if (ok && data.hasRefresh) {
    info.textContent = t('cnx.refresh_ok')
    info.className = 'out-bandeau out-bandeau--sans-point out-bandeau--ok'
    info.hidden = false
  } else if (ok) {
    info.textContent = t('cnx.refresh_absent')
    info.className = 'out-bandeau out-bandeau--sans-point out-bandeau--attente'
    info.hidden = false
  } else {
    info.hidden = true
  }
}

function brancherBeds24 () {
  document.getElementById('btn-connect-beds24').addEventListener('click', async () => {
    const code = document.getElementById('invite-code').value.trim()
    if (!code) return showToast('beds24', t('cnx.invite_requis'), 'error')

    const btn = document.getElementById('btn-connect-beds24')
    btn.disabled = true; btn.textContent = t('cnx.connexion')

    const res = await fetch('/api/beds24-setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: 'setup', inviteCode: code })
    })
    const data = await res.json()
    btn.disabled = false; btn.textContent = t('cnx.connecter')

    if (data.success) {
      document.getElementById('invite-code').value = ''
      showToast('beds24', t('cnx.beds24_ok'), 'success')
      await checkBeds24Status()
    } else {
      showToast('beds24', data.error || t('cnx.erreur_inconnue'), 'error')
    }
  })

  document.getElementById('btn-refresh-beds24').addEventListener('click', async () => {
    const btn = document.getElementById('btn-refresh-beds24')
    btn.disabled = true; btn.textContent = t('cnx.renouvellement')

    const res = await fetch('/api/beds24-setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: 'refresh' })
    })
    const data = await res.json()
    btn.disabled = false; btn.textContent = t('cnx.renouveler')

    if (data.success) {
      showToast('beds24', t('cnx.renouvele', { h: Math.round(data.expiresIn / 3600) }), 'success')
      await checkBeds24Status()
    } else {
      showToast('beds24', data.error || t('outil.erreur'), 'error')
    }
  })
}

// ===== Brevo SMS (config par hôte) =====
async function loadBrevoConfig () {
  try {
    const res = await fetch('/api/sms?action=config', {
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    })
    const data = await res.json()
    if (data.configured) {
      document.getElementById('brevo-key').value = '••••••••••••••••••••'
      document.getElementById('brevo-enabled').checked = data.enabled
      setStatus('brevo', data.enabled ? 'ok' : 'off',
        t(data.enabled ? 'outil.connecte' : 'cnx.brevo_cle_sms_off'))
      // ⚠ L'EXPEDITEUR NE SUIT PAS LE TOGGLE SMS. Couper les SMS ne coupe pas
      // les e-mails : ce sont deux canaux, et un hôte qui refuse les SMS doit
      // pouvoir régler quand même l'adresse vue par ses voyageurs.
      await loadSenders(data.senderEmail)
    } else {
      setStatus('brevo', 'off', t('outil.non_configure'))
      document.getElementById('bloc-expediteur').hidden = true
    }
  } catch {
    setStatus('brevo', 'off', t('outil.erreur'))
    // Sans ça, le bloc expéditeur reste affiché avec « Chargement… » figé et un
    // bouton actif qui ne peut rien faire : on ne laisse pas une UI morte
    // prétendre attendre quelque chose.
    const bloc = document.getElementById('bloc-expediteur')
    if (bloc) bloc.hidden = true
  }
}

// ===== Adresse d'expédition des e-mails voyageur =====
// La liste vient de Brevo, jamais d'une saisie. Le serveur la revérifie avant
// d'enregistrer : se fier au menu affiché reviendrait à accepter n'importe
// quelle adresse postée à la main, donc une identité d'expéditeur que l'hôte
// ne possède pas.
async function loadSenders (choisi) {
  const sel = document.getElementById('brevo-sender')
  const aide = document.getElementById('sender-aide')
  const bloc = document.getElementById('bloc-expediteur')
  try {
    const res = await fetch('/api/sms?action=senders', {
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    })
    const data = await res.json()

    if (!data.configured) {
      // Sans clé, ce réglage n'a pas de sens : on cache plutôt que de montrer
      // un menu vide dont personne ne devinerait la cause.
      bloc.hidden = true
      return
    }
    bloc.hidden = false
    aide.className = 'out-aide'

    if (data.error) {
      sel.innerHTML = '<option value="">—</option>'
      sel.disabled = true
      aide.textContent = t('cnx.sender_muet', { erreur: data.error })
      return
    }
    if (!data.senders.length) {
      sel.innerHTML = `<option value="">${esc(t('cnx.sender_aucun'))}</option>`
      sel.disabled = true
      aide.textContent = t('cnx.sender_aucun_aide')
      return
    }

    sel.disabled = false
    sel.innerHTML = data.senders
      .map(x => `<option value="${esc(x.email)}">${esc(t('cnx.sender_option', { nom: x.name, email: x.email }))}</option>`).join('')
    if (choisi && data.senders.some(x => x.email === choisi)) {
      sel.value = choisi
      aide.textContent = ''
    } else if (choisi) {
      // ⚠ L'ECRAN NE DOIT PAS AFFIRMER LE CONTRAIRE DU SERVEUR.
      // L'adresse enregistrée n'est plus vérifiée chez Brevo (supprimée,
      // désactivée). Le serveur continue de l'utiliser telle quelle : Brevo
      // rend 400 et PLUS AUCUN e-mail ne part. Annoncer « Par défaut : … »
      // ici laisserait croire que tout va bien, et l'hôte n'aurait aucune
      // raison de recliquer. Constat de review.
      aide.className = 'out-aide out-aide--alerte'
      aide.innerHTML = rendreRiche(t('cnx.sender_invalide', { email: choisi }))
    } else {
      // Rien de choisi : on annonce le défaut au lieu de laisser croire à une
      // sélection. C'est bien cette adresse-là qui partira.
      aide.textContent = t('cnx.sender_defaut', { nom: data.senders[0].name, email: data.senders[0].email })
    }
  } catch (e) {
    bloc.hidden = false
    aide.textContent = t('cnx.sender_lecture', { message: e.message })
  }
}

function brancherBrevo () {
  document.getElementById('btn-save-brevo').addEventListener('click', async () => {
    const key = document.getElementById('brevo-key').value.trim()
    if (!key || key.startsWith('•')) return showToast('brevo', t('outil.cle_invalide'), 'error')

    const btn = document.getElementById('btn-save-brevo')
    btn.disabled = true; btn.textContent = t('cnx.enregistrement')
    try {
      const res = await fetch('/api/sms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ action: 'saveConfig', apiKey: key })
      })
      const data = await res.json()
      if (data.success) {
        document.getElementById('brevo-key').value = '••••••••••••••••••••'
        document.getElementById('brevo-enabled').checked = true
        setStatus('brevo', 'ok', t('outil.connecte'))
        showToast('brevo', t('cnx.brevo_cle_ok'), 'success')
        // La clé venant d'arriver, les expéditeurs deviennent lisibles.
        await loadSenders(null)
      } else {
        showToast('brevo', data.error || t('outil.erreur'), 'error')
      }
    } catch (e) {
      showToast('brevo', e.message, 'error')
    } finally {
      btn.disabled = false; btn.textContent = t('outil.enregistrer')
    }
  })

  document.getElementById('btn-save-sender').addEventListener('click', async () => {
    const email = document.getElementById('brevo-sender').value
    if (!email) return showToast('brevo', t('cnx.sender_choisir'), 'error')
    const btn = document.getElementById('btn-save-sender')
    btn.disabled = true; btn.textContent = t('cnx.enregistrement')
    try {
      const res = await fetch('/api/sms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ action: 'saveSender', email })
      })
      const data = await res.json()
      if (data.success) {
        document.getElementById('sender-aide').textContent = ''
        showToast('brevo', t('cnx.sender_ok'), 'success')
      } else {
        showToast('brevo', data.error || t('outil.erreur'), 'error')
      }
    } catch (e) {
      showToast('brevo', e.message, 'error')
    } finally {
      btn.disabled = false; btn.textContent = t('outil.enregistrer')
    }
  })

  document.getElementById('brevo-enabled').addEventListener('change', async (e) => {
    const enabled = e.target.checked
    try {
      const res = await fetch('/api/sms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ action: 'toggleConfig', enabled })
      })
      const data = await res.json()
      if (!data.success) throw new Error(data.error || t('outil.erreur'))
      setStatus('brevo', enabled ? 'ok' : 'off', t(enabled ? 'outil.connecte' : 'cnx.envoi_desactive'))
      showToast('brevo', t(enabled ? 'sms.active' : 'sms.desactive'), 'success')
    } catch (er) {
      document.getElementById('brevo-enabled').checked = !enabled
      showToast('brevo', er.message, 'error')
    }
  })
}

// ===== Plateformes OTA (gestionnaire de canaux) =====
async function loadOtaProperties () {
  const box = document.getElementById('ota-properties')
  try {
    const res = await fetch('/api/channel-property', {
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    })
    const data = await res.json()
    // ⚠ ET LES BIENS EN COURS DE MIGRATION.
    // Constat de Thierry, 10 septembre 2026 : « sur HoteSmart je ne peux pas
    // deconnecter de Beds24 et remapper ensuite, je pensais que c'etait
    // prevu ». Ce ne l'etait pas : ce filtre ne montrait que les biens DEJA
    // chez le canal, donc un bien encore `beds24` — meme pourvu de sa
    // propriete Channex par l'assistant de migration — n'apparaissait nulle
    // part. Il n'existait aucun autre chemin dans le produit pour le
    // connecter : la migration butait sur une page vide.
    //
    // Le critere est la PROPRIETE CIBLE : un bien qui en a une est pret a
    // etre connecte, quel que soit le provider encore inscrit. Les endpoints,
    // eux, resolvent deja la bonne destination (`proprieteChezLeProvider`).
    const props = (data.properties || []).filter(p =>
      p.provider === 'channex' || p.provider === 'channel' || p.migration_target_property_id)

    // ⚠ LE PARAMETRE SE LIT AVANT TOUT DEPART (revue de l'etape 3). Quand le
    // compte n'a aucun bien eligible, ce `return` partait AVANT la lecture de
    // `?bien` : l'hote arrivait depuis la fiche et ne voyait rien, ni fenetre
    // ni explication.
    const bienDemande = new URLSearchParams(location.search).get('bien')

    if (!props.length) {
      box.innerHTML = `<p class="out-aide">
        ${esc(t(bienDemande ? 'cnx.ota_non_eligible_bien' : 'cnx.ota_aucun'))}
        ${rendreRiche(t('cnx.ota_creer'), { nouveau: '/logements/nouveau' })}</p>`
      setStatus('ota', 'off', t('cnx.ota_aucun_bien'))
      return
    }

    otaProps = props
    setStatus('ota', 'ok', t('cnx.ota_n_biens', { n: props.length }))
    // Self-service : chaque bien ouvre l'assistant marque blanche (Airbnb OAuth /
    // Booking) via components/connexions.js -> Channex reste masque.
    box.innerHTML = props.map(p => `
      <div class="out-ligne">
        <div class="out-ligne__corps">
          <span class="out-ligne__titre">${esc(p.name)}</span>
          <span class="out-ligne__sous">${esc(p.city || '')}${p.capacity ? ' · ' + esc(t('cnx.ota_pers', { n: p.capacity })) : ''}</span>
        </div>
        <button type="button" class="btn btn--primary" data-connect="${esc(p.id)}">${esc(t('cnx.ota_connecter'))}</button>
      </div>`).join('')

    box.querySelectorAll('button[data-connect]').forEach(b =>
      b.addEventListener('click', () => {
        const p = otaProps.find(x => String(x.id) === String(b.dataset.connect))
        if (p) openConnexions(p, b)
      }))

    // ⚠ ARRIVEE DEPUIS LA FICHE D'UN LOGEMENT (lot Logements V5, etape 3) :
    // `?bien=<uuid>` ouvre l'assistant sur CE bien. La fiche ne descend aucune
    // cle du partenaire ; c'est cette page qui la connait deja, et elle resout
    // l'UUID en propriete avant d'ouvrir.
    // ⚠ ET UN IDENTIFIANT QU'ELLE NE CONNAIT PAS SE DIT (revue de l'etape 3) :
    // un bien Beds24 sans propriete cible, ou le bien d'un autre compte, sont
    // absents de cette liste. Ne rien faire laissait l'hote devant une page
    // qui ignorait sa demande, sans un mot.
    if (bienDemande) {
      const cible = otaProps.find(x => String(x.id) === String(bienDemande))
      if (cible) openConnexions(cible, null)
      else {
        box.insertAdjacentHTML('afterbegin',
          `<p class="out-aide" data-bien-inconnu>${esc(t('cnx.ota_inconnu'))}</p>`)
      }
    }
  } catch (e) {
    box.innerHTML = `<p class="out-aide out-aide--alerte">${esc(t('cnx.ota_erreur'))}</p>`
    setStatus('ota', 'off', t('outil.erreur'))
  }
}

// [EN SOMMEIL] Ouverture de l'iframe self-service Channex BRUTE (expose l'UI Channex).
// On lui prefere l'assistant marque blanche (openConnexions). Conservee
// pour reactivation post-beta ; plus appelee par aucun bouton (voir loadOtaProperties).
// eslint-disable-next-line no-unused-vars
async function openOtaModal (propId, propName, btn) {
  btn.disabled = true
  const old = btn.textContent
  btn.textContent = t('cnx.preparation')
  try {
    const res = await fetch(`/api/channel-connect?property_id=${encodeURIComponent(propId)}`, {
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    })
    const data = await res.json()
    if (!res.ok || !data.iframe_url) throw new Error(data.error || t('cnx.erreur_connexion'))

    document.getElementById('ota-modal-title').textContent = t('cnx.modale_titre_bien', { nom: propName })
    document.getElementById('ota-iframe').src = data.iframe_url
    document.getElementById('ota-modal').classList.add('show')
  } catch (e) {
    showToast('ota', e.message, 'error')
  } finally {
    btn.disabled = false
    btn.textContent = old
  }
}

async function init () {
  await I18n.init()
  // ⚠ PAGE NON DELEGABLE : elle montre les donnees de la personne connectee,
  // pas celles du compte sur lequel on travaille. Sans ce garde-fou, elle
  // s'ouvrait par URL directe en mode basculé et affichait un contresens.
  await exigerCompteProprePage({ nomPage: t('cnx.titre') })
  session = await requireAuth()
  if (!session) return
  document.addEventListener('i18n:changed', () => location.reload())
  monterCoquille({
    HSNav, I18n, session, titre: t('cnx.titre'),
    compte: { comptes, compteCourant, basculerVers, estTitulaire, peutLire },
    deconnexion: () => signOut()
  })
  window._session = session
  window._supabase = supabase
  brancherBeds24()
  brancherBrevo()
  document.getElementById('ota-modal-close').addEventListener('click', () => {
    document.getElementById('ota-modal').classList.remove('show')
    document.getElementById('ota-iframe').src = 'about:blank'
  })

  // Vérifier statut Beds24
  await checkBeds24Status()

  // Vérifier statut Seam
  const { data: seamData } = await supabase.from('api_keys')
    .select('seam_api_key, seam_enabled').eq('user_id', session.user.id).maybeSingle()
  const seamOk = !!(seamData?.seam_api_key && seamData?.seam_enabled !== false)
  setStatus('seam', seamOk ? 'ok' : 'off', t(seamOk ? 'outil.connecte' : 'outil.non_connecte'))

  // Plateformes OTA
  await loadOtaProperties()

  // ⚠ LE REPLI PLEINE PAGE DE LA CONNEXION AIRBNB ABOUTIT ICI. Quand le
  // navigateur bloque la popup, `pages/airbnb-retour.html` stocke le retour et
  // renvoie sur cette page avec `?airbnb_return=1` ; `bootstrapAirbnbReturn`
  // resout le bien PAR LE JETON (resolution serveur, pas la session) et rouvre
  // l'assistant a l'ecran B. L'appel vivait dans `pages/biens.html` : depuis la
  // bascule V5, plus aucune page ne le faisait, et le retour se perdait.
  // Il vient APRES le chargement des biens : l'assistant s'ouvre par-dessus une
  // page deja peuplee, pas sur un ecran vide.
  bootstrapAirbnbReturn()

  // Brevo SMS (config par hôte)
  await loadBrevoConfig()

  // Le bandeau d'incitation que l'ancienne barre latérale posait : gardé
  // (spec §3.1 et §8), sans attente, après le rendu.
  renderOnboardingBanner().catch(() => {})
}

init().catch(e => console.error('[connexions]', e))
</script>
