<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HôteSmart — Configuration prestataire</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#222222;-webkit-font-smoothing:antialiased}
a{color:#222222}
button{font-family:inherit;cursor:pointer}
.ico{width:44px;height:44px;border:1px solid #DDDDDD;border-radius:99px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid #EBEBEB}
.tab{height:48px;padding:0 16px;border:none;background:none;font-size:15px;font-weight:500;color:#717171;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
.tab.on{color:#222222;font-weight:700;border-bottom-color:#222222}
.sec{padding:20px 28px}
.h3{margin:0 0 12px;font-size:13px;font-weight:700;color:#717171;text-transform:uppercase;letter-spacing:0.05em}
.seg{display:inline-flex;border:1px solid #DDDDDD;border-radius:99px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 14px;border:none;border-radius:99px;background:none;font-size:13px;font-weight:600;color:#717171}
.seg button.on{background:#222222;color:#FFFFFF}
.day{width:36px;height:36px;border-radius:99px;border:1.5px solid #DDDDDD;background:#FFFFFF;font-size:13px;font-weight:700;color:#BDBDBD;display:flex;align-items:center;justify-content:center;padding:0}
.day.on{background:#DCEBDD;border-color:#1A7F4B;color:#1A7F4B}
.sw{width:44px;height:26px;border-radius:99px;background:#DDDDDD;position:relative;flex:none;border:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,0.3)}
.sw.on{background:#222222}
.sw.on::after{left:21px}
.btn{height:44px;padding:0 18px;border:1px solid #222222;border-radius:99px;background:#FFFFFF;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.lite{border-color:#DDDDDD}
.foot{margin-top:auto;padding:16px 28px;border-top:1px solid #EBEBEB;display:flex;justify-content:flex-end;gap:10px}
</style>
</helmet>
<div role="dialog" aria-label="Configuration de Tiphaine Nzaramba" style="width: 760px; min-height: 820px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: flex-start; gap: 16px; padding: 24px 28px 16px">
    <div style="flex: 1; min-width: 0">
      <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Tiphaine Nzaramba</h2>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 8px; font-size: 14px; color: #717171">
        <span style="display: flex; align-items: center; gap: 5px" aria-label="17 bons retours, 1 remarque"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1A7F4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v10H4V10ZM7 10l4-7c1.5 0 2.5 1 2.3 2.6L13 10h5.5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.3 20H7"/></svg><b style="color: #222222">17</b><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C13515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14V4H4v10ZM7 14l4 7c1.5 0 2.5-1 2.3-2.6L13 14h5.5a2 2 0 0 0 2-2.3l-1.2-6A2 2 0 0 0 17.3 4H7"/></svg><b style="color: #C13515">1</b></span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 99px; background: #1A7F4B"></span>Active</span>
      </div>
    </div>
    <a href="#" class="ico" aria-label="Appeler"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg></a>
    <a href="#" class="ico" aria-label="Écrire un e-mail"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></a>
    <button class="ico" aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="tabs" role="tablist"><button class="tab" aria-selected="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V10l9-6 9 6v11Z"/><path d="M9 21v-6h6v6"/></svg>Biens</button><button class="tab" aria-selected="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planning</button><button class="tab on" aria-selected="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg>Accès</button></div>

  <div class="sec">
    <div class="h3">Son application</div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <button class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>Envoyer le lien</button>
      <button class="btn lite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>Nouveau lien</button>
    </div>
    <div style="font-size: 13px; color: #717171; margin-top: 10px">Nouveau lien : l’ancien ne marche plus.</div>
  </div>
  <div class="sec" style="border-top: 1px solid #EBEBEB">
    <div class="h3">Ce qu’elle voit des autres</div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 10px 0"><span style="flex: 1; font-size: 15px">[Réglage 1 — à reprendre de l’existant]</span><button class="sw on" role="switch" aria-checked="true" aria-label="Réglage 1"></button></div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 10px 0"><span style="flex: 1; font-size: 15px">[Réglage 2 — à reprendre de l’existant]</span><button class="sw" role="switch" aria-checked="false" aria-label="Réglage 2"></button></div>
  </div>
  <div class="sec" style="border-top: 1px solid #EBEBEB">
    <div class="h3">Contact</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <input aria-label="Prénom" value="Tiphaine" style="height: 44px; padding: 0 16px; border: 1px solid #DDDDDD; border-radius: 12px; font-family: inherit; font-size: 14px">
      <input aria-label="Nom" value="Nzaramba" style="height: 44px; padding: 0 16px; border: 1px solid #DDDDDD; border-radius: 12px; font-family: inherit; font-size: 14px">
      <input aria-label="Téléphone" value="06 •• •• •• ••" style="height: 44px; padding: 0 16px; border: 1px solid #DDDDDD; border-radius: 12px; font-family: inherit; font-size: 14px">
      <input aria-label="E-mail" value="[e-mail]" style="height: 44px; padding: 0 16px; border: 1px solid #DDDDDD; border-radius: 12px; font-family: inherit; font-size: 14px">
    </div>
  </div>
  <div class="sec" style="border-top: 1px solid #EBEBEB; display: flex; flex-wrap: wrap; gap: 10px">
    <button class="btn lite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>Désactiver</button>
    <button class="btn lite" style="color: #C13515; border-color: #F0C9C2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C13515" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Supprimer</button>
  </div>
  <div class="foot"><button class="btn lite">Annuler</button><button class="btn">Enregistrer</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
