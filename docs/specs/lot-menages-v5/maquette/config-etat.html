<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HôteSmart — Configuration, état (V5)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#222222;-webkit-font-smoothing:antialiased}
a{color:#222222}
button{font-family:inherit;cursor:pointer}
.ico{width:44px;height:44px;border:1px solid #DDDDDD;border-radius:99px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid #EBEBEB}
.tab{height:48px;padding:0 16px;border:none;background:none;font-size:15px;font-weight:500;color:#717171;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
.tab.on{color:#222222;font-weight:700;border-bottom-color:#222222}
.sec{padding:20px 28px}
.h3{margin:0 0 12px;font-size:13px;font-weight:700;color:#717171;text-transform:uppercase;letter-spacing:0.05em}
.seg{display:inline-flex;border:1px solid #DDDDDD;border-radius:99px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 14px;border:none;border-radius:99px;background:none;font-size:13px;font-weight:600;color:#717171}
.seg button.on{background:#222222;color:#FFFFFF}
.day{width:36px;height:36px;border-radius:99px;border:1.5px solid #DDDDDD;background:#FFFFFF;font-size:13px;font-weight:700;color:#BDBDBD;display:flex;align-items:center;justify-content:center;padding:0}
.day.on{background:#DCEBDD;border-color:#1A7F4B;color:#1A7F4B}
.sw{width:44px;height:26px;border-radius:99px;background:#DDDDDD;position:relative;flex:none;border:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,0.3)}
.sw.on{background:#222222}
.sw.on::after{left:21px}
.btn{height:44px;padding:0 18px;border:1px solid #222222;border-radius:99px;background:#FFFFFF;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.lite{border-color:#DDDDDD}
.foot{margin-top:auto;padding:16px 28px;border-top:1px solid #EBEBEB;display:flex;justify-content:flex-end;gap:10px}
.cell{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0;border:1.5px solid #DDDDDD;background:#FFFFFF}
.cell.on{background:#1A7F4B;border-color:#1A7F4B}
.cell.off{background:repeating-linear-gradient(135deg,#F2F2F2 0 4px,#FFFFFF 4px 8px);border-color:#EBEBEB}
.cell.on.off{background:repeating-linear-gradient(135deg,#A9CDB2 0 4px,#D4E7D8 4px 8px);border-color:#A9CDB2}
.acc{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 28px;border:none;border-top:1px solid #EBEBEB;background:#FFFFFF;font-size:16px;font-weight:700;text-align:left}
.acc .v{margin-left:auto;font-size:14px;font-weight:500;color:#717171}
.state{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.45}
</style>
</helmet>
<div role="dialog" aria-label="Configuration de Lola" style="width: 760px; min-height: 250px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 24px 28px 14px">
    <div style="flex: 1; min-width: 0">
      <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Lola [Nom]</h2>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 8px; font-size: 14px; color: #717171">
        <span style="display: flex; align-items: center; gap: 5px" aria-label="0 bons retours, 0 remarques"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1A7F4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v10H4V10ZM7 10l4-7c1.5 0 2.5 1 2.3 2.6L13 10h5.5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.3 20H7"/></svg><b style="color: #222222">0</b><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C13515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14V4H4v10ZM7 14l4 7c1.5 0 2.5-1 2.3-2.6L13 14h5.5a2 2 0 0 0 2-2.3l-1.2-6A2 2 0 0 0 17.3 4H7"/></svg><b style="color: #BDBDBD">0</b></span>
      </div>
    </div>
    <a href="#" class="ico" aria-label="Appeler"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg></a>
    <a href="#" class="ico" aria-label="Écrire un e-mail"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></a>
    <button class="ico" aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div style="padding: 0 28px 24px">
    <div class="state" style="background: #FCEDEA; color: #8A2414"><svg width="20" height="20" viewBox="0 0 24 24" style="flex: none; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#C13515"/><path d="M12 7v6M12 16.5v.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/></svg><span><b>Ne recevra aucun ménage.</b> Cœur de vie 23 et La bulle lui sont confiés, mais sans aucun jour.</span>
      <button class="btn" style="height: 38px; font-size: 13px; margin-left: auto; flex: none">Choisir ses jours</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":250}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
